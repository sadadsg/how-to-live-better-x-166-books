- theme: 主体性与内耗科学依据
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 主体性与内耗科学依据调研报告.md
  claims:
  - claim: 对他人要求越少、动机越自主（内部控制点）的人主体性越强；但'少要求他人'不等于断绝关系，归属感仍是基本心理需要
    verdict: 支持
    original: ✅（边界：SDT归属感同样必要，非断绝关系）
    evidence: Ryan & Deci 2017 SDT综述：整合性调节与幸福感r≈0.40-0.60、外部调节r≈-0.20至-0.40；Levenson 1973'有力他人'控制点量表直接测'绑定他人'程度；内部LOC预测幸福感r≈0.30、外部LOC预测抑郁r≈0.25
    sources:
    - Ryan & Deci 2017, Annual Review of Psychology
    - Levenson 1973
    - Rotter 1966
    - Cheng 2013 (meta)
    url: https://selfdeterminationtheory.org/theory/
  - claim: 将喜怒哀乐绑定在不可控的他人身上会陷入沉溺型反刍（brooding），导致情绪不稳定与内耗
    verdict: 支持
    original: ✅ 完全核证
    evidence: Nolen-Hoeksema反刍理论：反刍与抑郁r≈0.40；Watkins 2008（Psychological Bulletin）：brooding（而非反思型）预测抑郁且因果方向明确；情绪依赖与依恋焦虑r≈0.40（Bornstein）
    sources:
    - Nolen-Hoeksema 1991/2000
    - Watkins 2008, Psychological Bulletin
    - Gross 2015
    - Bornstein 1992（EDS）
    url: ''
  - claim: 把注意力转向自身、构建安全感与价值感是有效的，但必须是'主动非评判'型自我关注，反刍式自我关注反而有害
    verdict: 支持
    original: ✅（边界：须为adaptive自我关注，Ingram 1990）
    evidence: Neff：自我关怀与幸福感r≈0.50-0.55、与焦虑抑郁r≈-0.50；Crocker 2002（JPSP）：基于他人评价的条件自尊与抑郁正相关；Ingram 1990：自我关注分adaptive与maladaptive两型
    sources:
    - Neff 2003a/2011
    - Crocker & Park 2004
    - Ingram 1990
    url: https://self-compassion.org/what-is-self-compassion/
  - claim: 不对伴侣过度期待、解绑'关系条件自尊'（RCSE）能提高关系满意度；注意这是安全依恋，不是回避型的情感隔离
    verdict: 支持
    original: ✅ 完全核证（边界：非回避型表面低期待）
    evidence: Knee 2008（JPSP）：RCSE与关系满意度r≈-0.30、与焦虑依恋r≈0.40；Candel & Turliuc 2019元分析：不安全依恋×满意度r≈-0.40至-0.50；Laurenceau 2005：期望-实现差距预测满意度
    sources:
    - Knee 2008, JPSP
    - Candel & Turliuc 2019 (meta)
    - Laurenceau 2005
    - Mikulincer & Shaver 2016
    url: https://psycnet.apa.org/record/2008-13794-005
  - claim: 将高标准转向自身（自我导向完美主义）比要求他人更健康，但极端自我导向会转为自我贬低，需配合自我关怀
    verdict: 部分支持
    original: ✅（边界：需Self-Compassion配合）
    evidence: Frost 1990/Hewitt & Flett 1991三维完美主义：自我导向→高表现低焦虑（d≈0.20-0.40），他人导向/社会规定→焦虑与关系满意度下降；Curran 2018元分析：年轻人完美主义显著上升
    sources:
    - Frost 1990
    - Hewitt & Flett 1991
    - Curran & Hill 2018 (meta)
    url: ''
  - claim: 停止向外界索取、构建独立且稳定的自我有坚实实证基础（自我概念清晰度+SDT整合调节+自我关怀）
    verdict: 支持
    original: ✅（SDT/自我概念清晰度/自我关怀部分）
    evidence: Light 2019元分析：自我概念清晰度与心理健康r≈0.45；Wu 2023：与幸福感r≈0.40；SDT三需要满足与幸福感r=0.40-0.60，SDT干预元分析效应量d≈0.40
    sources:
    - Campbell 1990
    - Light 2019 (meta)
    - Wu 2023 (meta)
    - Ryan & Deci 2017
    url: https://pubmed.ncbi.nlm.nih.gov/2231284/
  - claim: 荣格'个体化'理论为'独立稳定自我'提供了合用的概念框架（实证级别）
    verdict: 部分支持
    original: ⭐⭐⭐⭐ 方向契合（临床框架非RCT实证）
    evidence: Jung 1921个体化=整合意识与无意识、目标是更真实的关系而非孤立；属临床心理学框架，缺乏RCT实证（报告自评降级为⭐⭐⭐⭐）
    sources:
    - Jung 1921, Psychological Types
    url: ''
  - claim: 认知重评（换角度解读情绪事件）与幸福感正相关、表达抑制与幸福感负相关，可用于替代反刍
    verdict: 支持
    original: ✅ 核证
    evidence: Gross 2015情绪调节过程模型（五大策略）；Hu 2014元分析：重评与主观幸福感r≈0.30，表达抑制与幸福感负相关
    sources:
    - Gross 2015, Annual Review of Clinical Psychology
    - Hu 2014 (meta)
    url: ''
  - claim: 亲密关系中承诺由满意度、投资与替代选项共同决定，承诺对分手有极强预测力（流传的'137项研究N≈38,000'系错误数据，实为52项研究N=11,582）
    verdict: 支持
    original: ✅（含数据修正：52项研究/60个独立样本/N=11,582）
    evidence: Le & Agnew 2003元分析：52项研究、60个独立样本、N=11,582；承诺预测分手d=-0.832（极强）；满意度+投资+替代共同解释承诺变异近65%
    sources:
    - Le & Agnew 2003, Personality and Social Psychology Review
    url: https://doi.org/10.1177/1088868303253781
- theme: 人格20到40岁变化研判
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 人格20到40岁变化研判调研报告.md
  claims:
  - claim: 20-40岁期间尽责性与外向性支配面（社会支配性）平均显著上升，是人格心理学最稳健发现之一
    verdict: 支持
    original: 已验证（92个纵向研究元分析）
    evidence: Roberts, Walton & Viechtbauer 2006 Psychological Bulletin：92个纵向研究元分析，20-40岁段尽责性与social dominance上升最陡；Bleidorn 2022（k=276, N=242,542）复现。
    sources:
    - Roberts, Walton & Viechtbauer 2006
    - Bleidorn et al. 2022
    url: https://pubmed.ncbi.nlm.nih.gov/16435954/
  - claim: 20-40岁情绪稳定性上升（神经质下降），但该下降仅在女性中显著，男性基本不变
    verdict: 部分支持
    original: 已验证但男性为部分验证
    evidence: Srivastava et al. 2003 JPSP（N=132,515，21-60岁）：神经质女性下降、男性基本不变；Terracciano 2005 BLSA（N=1,944）：神经质持续降至约80岁。
    sources:
    - Srivastava et al. 2003 JPSP
    - Terracciano et al. 2005
    url: https://pubmed.gov/12757147/
  - claim: '''人格30岁定型如石膏''的假说不成立，人格在整个成年期持续变化'
    verdict: 证伪
    original: Srivastava 2003 直接拒绝石膏假说【已验证】
    evidence: Srivastava et al. 2003（N=132,515）直接反驳'30岁石膏假说'；Roberts & Mroczek 2008：变化集中在20-40岁年轻成年期。
    sources:
    - Srivastava et al. 2003 JPSP
    - Roberts & Mroczek 2008
    url: https://pubmed.gov/12757147/
  - claim: 人格成熟是群体均值上升，个体相对位次高度稳定：排序稳定性30岁约0.64、50-70岁约0.74
    verdict: 支持
    original: 最重要边界：均值变化≠排序稳定
    evidence: Roberts & DelVecchio 2000 元分析：排序稳定性从童年0.31、大学0.54升至30岁0.64、50-70岁0.74——大家都往上走，相对位置难移。
    sources:
    - Roberts & DelVecchio 2000 Psychological Bulletin
    url: ''
  - claim: 人格变化幅度小而慢：每十年约0.25-0.33个标准差，需以月年计而非周月
    verdict: 支持
    original: 已验证量级
    evidence: Roberts 2006 元分析按十年段拆分：约0.25-0.33 SD/十年（年化约0.025-0.033 SD）；个体差异大，已成熟者变化最小。
    sources:
    - Roberts, Walton & Viechtbauer 2006
    url: https://pubmed.ncbi.nlm.nih.gov/16435954/
  - claim: 主动设定人格改变目标并付诸行动者，16周可比同龄人多增长约0.16个标准差（外向性、情绪稳定性效应最大）
    verdict: 支持
    original: 已验证（改变目标干预）
    evidence: Hudson et al. 2020 Social Psychological and Personality Science 改变目标研究：高改变目标者16周多增长约0.16 SD；Hudson & Fraley 2015 JPSP 干预范式确立。
    sources:
    - Hudson et al. 2020 SPPS
    - Hudson & Fraley 2015 JPSP
    url: https://doi.org/10.1177/1948550619878423
  - claim: 行为先于特质：先反复像目标特质的人那样行动，新模式自动化后特质分数随之改变
    verdict: 支持
    original: 五大通用原则之首（Fleeson 密度分布模型）
    evidence: Fleeson 2001 JPSP 密度分布模型：特质即行为分布，稳定的行为改变带动特质改变；Hudson & Fraley 2015 干预证实行为训练可移动特质。
    sources:
    - Fleeson 2001 JPSP
    - Hudson & Fraley 2015
    url: https://doi.org/10.1037/0022-3514.80.6.1011
  - claim: '''如果—就''实施意图把行动预编程进情境可有效提升目标达成（元分析 d=0.65，真实世界更小）'
    verdict: 支持
    original: 结构化胜过少意志力
    evidence: Gollwitzer & Sheeran 2006 元分析（94项研究）：实施意图效应 d=0.65；报告注明真实世界效应更小。
    sources:
    - Gollwitzer & Sheeran 2006 Advances in Experimental Social Psychology
    url: ''
  - claim: 认知行为疗法（统一方案UP）16周可显著降低神经质（d=-0.32至-0.43）
    verdict: 支持
    original: 已验证（最强杠杆）
    evidence: Sauer-Zavala et al. 2020 Psychological Medicine 随机试验：统一方案16周降低神经质 d=-0.32~-0.43，是情绪稳定性最可干预的路径。
    sources:
    - Sauer-Zavala et al. 2020 Psychological Medicine
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7678331/
  - claim: 投入成人角色（工作、婚姻、社区）推动人格成熟化（社会投资原则），但育儿角色的证据混合
    verdict: 部分支持
    original: 主流机制解释，育儿角色证据混合
    evidence: Bleidorn et al. 2013：成人角色进入更早的文化成熟化更快；但 van Scheppingen 2016 代表性样本未发现育儿对五因素有显著效应。
    sources:
    - Bleidorn et al. 2013
    - van Scheppingen et al. 2016
    url: ''
  - claim: 人格遗传度约40-50%，但这是群体参数，不锁定个体改变空间
    verdict: 支持
    original: 群体参数，环境与非共享经验占40-60%
    evidence: Vukasović & Bratko 2015 元分析（>100,000人）：人格遗传度约40%，双生子研究约50%；其余由环境与非共享经验塑造。
    sources:
    - Vukasović & Bratko 2015 遗传度元分析
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5068715/
- theme: 人生苦甜均衡
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 人生苦甜均衡调研报告.md
  claims:
  - claim: 儿童期延迟满足能力（棉花糖实验）是决定日后学业与人生成功的关键因素
    verdict: 证伪
    original: 棉花糖实验被严重高估（复验效应衰减约2/3）
    evidence: Watts, Duncan & Quan 2018（Psychological Science，n≈1000 NICHD SECCYD样本）：控制家庭背景与早期认知能力后相关衰减约2/3，4岁每多等1分钟15岁成绩仅+0.1SD（原始效应一半），行为结果几乎不再显著
    sources:
    - Watts, Duncan & Quan 2018, Psychological Science
    url: https://doi.org/10.1177/0956797618761661
  - claim: 人对单一'大甜'（升职、买房等正性事件）适应极快、数月回到基线，把享乐延迟到未来一次性兑现会因享乐能力钝化而失效
    verdict: 支持
    original: ✅ 强支持（反驳'先苦后甜'）
    evidence: Lyubomirsky & Sheldon HAP模型（Sheldon & Lyubomirsky 2012）：正性事件快速适应回基线、负性事件适应慢且不完全；多巴胺编码奖励预测误差差值而非绝对量（Schultz 2016），大差值快速适应、温和小差值更可持续
    sources:
    - Sheldon & Lyubomirsky 2012（HAP模型）
    - Schultz 2016, Nature Reviews Neuroscience
    - Gershman et al. 2024, Nature Neuroscience
    url: https://www.nature.com/articles/nrn.2015.26
  - claim: 日常小确幸对生活满意度的解释力高于重大生活事件，'把享乐写进日历'有实证支持
    verdict: 支持
    original: ✅ 强支持（苦甜应均匀分布）
    evidence: Miwa 2025（Journal of Happiness Studies）：实证提取小确幸6因子结构，日常小事件对生活满意度解释力12%，显著高于重大生活事件的7.2%
    sources:
    - Miwa 2025, Journal of Happiness Studies
    url: https://link.springer.com/article/10.1007/s10902-025-00896-2
  - claim: 过度延迟与过度控制有真实心理代价（完美主义、职业倦怠、人际疏离），'先苦后甜'的极端版本有害
    verdict: 支持
    original: ✅ 强支持
    evidence: Lynch 2018 RO-DBT：过控制谱系（高度延迟/完美主义/认知僵化）是慢性抑郁、神经性厌食、强迫型人格的核心机制；Liu 2025（EJWOP）：完美主义→远程压力→工作-生活冲突→burnout三阶段中介链
    sources:
    - Lynch 2018, RO-DBT
    - Liu 2025, European Journal of Work and Organizational Psychology
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12053826/
  - claim: 若'苦'是被外在强加的（牺牲自主感与胜任感），会破坏内在动机；'苦'须被自主意义化而非被控制型安排
    verdict: 支持
    original: ✅ 支持
    evidence: Ryan & Deci 2020综述：外在奖励、惩罚、考评等控制型手段破坏内在动机，自主支持型才能同时提升成绩与心理健康
    sources:
    - Ryan & Deci 2020, Contemporary Educational Psychology
    url: https://www.sciencedirect.com/science/article/pii/S0361476X20300254
  - claim: 情绪唤起情境下（焦虑、社交压力、兴奋）单靠意志力延迟易失败，结构化设计（冷却、拆解、默认选项）比意志力更可靠
    verdict: 支持
    original: ✅ 强支持
    evidence: Casey 2011（PNAS，40年随访）：当年低延迟者40年后面对积极社交线索仍难抑制反应，右侧下额回激活降低、腹侧纹状体升高；Steinberg双系统模型：社会情绪系统发育早于认知控制系统
    sources:
    - Casey et al. 2011, PNAS
    - Steinberg 2011
    url: https://www.pnas.org/doi/10.1073/pnas.1108561108
  - claim: 延迟满足是'信任+资源+能力'三合一：环境不可靠（他人不守信）时选择即时满足是理性策略而非意志缺陷
    verdict: 支持
    original: ✅（延迟的批判性再审视）
    evidence: Kidd, Palmeri & Aslin 2013：不可靠环境下儿童理性选择不吃棉花糖；Michaelson & Munakata 2016：观察到实验者对他人不守信的儿童显著缩短等待时间
    sources:
    - Kidd, Palmeri & Aslin 2013, Frontiers in Psychology
    - Michaelson & Munakata 2016, Developmental Science
    url: https://doi.org/10.3389/fpsyg.2013.00355
  - claim: 今天的你给明天的你设置承诺装置（自动转账、锁起甜品、默认选项）有严格理论基础：双曲贴现造成时间不一致偏好
    verdict: 支持
    original: ✅ 支持（短期小目标+长期规划）
    evidence: Laibson 1997（QJE）双曲贴现：今天vs明天的折现率显著大于远期；Fudenberg & Levine 2006（AER）双重自我模型；McClure 2004 fMRI显示即时与延迟奖励激活两套系统
    sources:
    - Laibson 1997, QJE
    - Fudenberg & Levine 2006, AER
    - McClure et al. 2004
    url: https://doi.org/10.1162/003355397555253
  - claim: 用纳什均衡可以严格论证人生'苦甜均衡'（科学结论级）
    verdict: 存疑
    original: ⚠️ 部分支持：方向对，但Laibson双曲贴现+Dual-Self Model更严格
    evidence: 纳什1950假设完全理性与完备信息且均衡≠Pareto最优（囚徒困境）；该类比在学术文献中多为隐喻层面，缺乏可证伪实证，报告定位为启发性类比
    sources:
    - Nash 1950/1951
    - Laibson 1997
    - Fudenberg & Levine 2006
    url: ''
  - claim: FIRE式极端储蓄（攒25倍年支出+4%提取率）对超长退休期不够安全
    verdict: 支持
    original: ✅ 强支持（财务分配建议）
    evidence: Vanguard 2020《Fuel for the F.I.R.E.》：4%提取率在30年期成功率81.9%，50年期骤降至36%
    sources:
    - Vanguard 2020, Fuel for the F.I.R.E.
    url: https://www.vanguardmexico.com/content/dam/intl/americas/documents/mexico/en/fuel-for-the-fire.pdf
  - claim: 番茄工作法（25分钟硬切）相比其他专注/休息方式并无产出优势，自调节休息是合理选择
    verdict: 支持
    original: ✅ 强支持（时间管理建议）
    evidence: MDPI 2025实验（n=94）：Pomodoro/Flowtime/自调节休息在最终产出上无显著差异
    sources:
    - MDPI 2025 Pomodoro vs Flowtime study
    url: https://www.mdpi.com/2076-328X/15/7/861
  - claim: 90分钟超日节律（工作单元+离屏休息）有生理机制依据，'工作90分钟休息20分钟'可直接提升认知表现
    verdict: 部分支持
    original: 报告待确认项：外推到工作场景是经验性而非强结论性
    evidence: Kleitman 1969基本休息-活动周期；2025 Physical Review E建模证实90分钟周期机制（saddle-node分岔），但证据多来自睡眠EEG领域，工作场景认知任务研究少
    sources:
    - Kleitman 1969
    - Physical Review E 2025（90分钟机制建模）
    url: https://journals.aps.org/pre/abstract/10.1103/PhysRevE.111.044215
  - claim: 苦甜均衡的关键是'多放点甜'的线性补偿
    verdict: 证伪
    original: ✅ 强支持（均衡应理解为对极端化的双向纠偏，而非简单多放甜）
    evidence: 报告综合平衡表：棉花糖复验+享乐适应+多巴胺RPE+过控制代价四股证据一致指向'小而多变+自主意义化+结构降低诱惑'，而非单边补偿
    sources:
    - Watts et al. 2018
    - Sheldon & Lyubomirsky 2012
    - Lynch 2018
    url: ''
- theme: 他人非议与自我提升
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 他人非议与自我提升调研报告.md
  claims:
  - claim: 诋毁多源于恶意嫉妒与下行比较：上行比较催生嫉妒→幸灾乐祸→攻击的完整因果链，良性嫉妒反而驱动自我提升
    verdict: 支持
    original: ✅ 恶意嫉妒+下行比较实证
    evidence: 9项实验（N=1,827）：上行比较→嫉妒/幸灾乐祸；2026中学生研究（n=2,172）：幸灾乐祸在恶意嫉妒与欺凌间完全中介；职场研究（306名员工）高嫉妒者见同事受难参与攻击。
    sources:
    - Lange & Crusius 等嫉妒-幸灾乐祸实验 (N=1,827)
    - Scientific Reports 2026 (n=2,172)
    url: https://pubmed.ncbi.nlm.nih.gov/35025600/
  - claim: 印象一旦形成，确认偏误使记忆与信息寻求系统性偏向印证，纠正大多无效——'越解释越被动'
    verdict: 支持
    original: ✅ 确认偏误+CIE+操作性条件反射
    evidence: 2018年4项实验：印象形成后记忆/解释/信息寻求被系统性偏置；Nature Reviews Psychology 2022：debunking 有效性有限；持续影响效应（CIE）显示纠错后错误信息仍影响推理。
    sources:
    - SagePub 2018 确认偏误实验
    - Nature Reviews Psychology 2022
    url: https://www.nature.com/articles/s44159-021-00006-y
  - claim: 对恶意诋毁作出愤怒/辩解等反应会强化攻击（有反应→攻击被奖励的操作性条件反射），'不争'是认知资源保护策略
    verdict: 支持
    original: ✅ 争辩激活冲突环路、消耗认知资源
    evidence: 操作性条件反射机制：造谣者目标是获得反应，反应即奖励；争辩激活前额叶-杏仁核冲突环路造成认知资源消耗；'不进入对方框架'对应框架效应研究。
    sources:
    - 操作性条件反射与框架效应研究
    url: ''
  - claim: 记恨伤身：记恨想象使血压/心率升高且恢复期持续，宽恕与身体健康普遍正相关
    verdict: 支持
    original: ✅ 宽恕健康元分析+心血管实验
    evidence: 宽恕元分析（128项研究，N=58,531）：宽恕与身体健康 r=0.14，不受年龄/性别/教育调节；Witvliet 实验（71人）：记恨想象升血压心率且恢复慢，宽恕想象更快恢复。
    sources:
    - 宽恕与身体健康元分析 (128 studies, N=58,531)
    - Witvliet et al. 心血管实验
    url: https://pubmed.ncbi.nlm.nih.gov/30669877/
  - claim: 不宽恕预测3年后健康下降，反刍是宽恕→健康的核心中介；但放下≠和解、强迫立即原谅是压抑
    verdict: 支持
    original: ✅ 前瞻性研究因果方向明确
    evidence: 前瞻性研究：不宽恕预测3年后健康下降（N=484/249研究中反刍为核心中介）；报告边界：放下≠遗忘≠给对方开脱，强迫原谅会反弹。
    sources:
    - 前瞻性不宽恕-健康研究
    - MDPI 反刍中介研究 (N=484/249)
    url: https://pubmed.ncbi.nlm.nih.gov/24266673/
  - claim: 固定型思维者失败后倾向向下比较修复自尊，成长型思维者倾向向上比较与自我提升
    verdict: 支持
    original: ✅ 成长型思维+注意力经济
    evidence: Nussbaum & Dweck 2008：失败后固定型选向下比较、成长型选向上比较；2023研究：上行比较的'认同vs对比'取向决定成长或内耗。
    sources:
    - Nussbaum & Dweck 2008
    - Springer 2023 社会比较研究
    url: https://link.springer.com/article/10.1007/s11218-023-09850-7
  - claim: 成长型思维干预可提升学业成就（全国随机实验），'想变强'比'现在强'更能驱动自我提升
    verdict: 支持
    original: ✅ Nature 全国实验（2019）
    evidence: Yeager et al. 2019 Nature 全国随机实验：成长型思维干预提升成就；1,000名工作者研究：成长型思维与自我提升动机相关（β=0.275-0.413）强于当前能力感知。
    sources:
    - Yeager et al. 2019 Nature
    - Growth Mindsets and Self-Improvement Motivation
    url: https://www.nature.com/articles/s41586-019-1466-y
- theme: 低强度长期复利
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 低强度长期复利调研报告.md
  claims:
  - claim: 习惯形成的中位时间约为66天（范围18-254天），因行为复杂度差异巨大；30天只能建立'动作-提示'稳定链，不足以宣称完全自动化
    verdict: 支持
    original: 🟢 强支持（真金）
    evidence: Lally et al. 2010（EJSP 40:998-1009）真实情境研究：中位66天达到自动性峰值，自动性曲线为指数渐近线，前期增长最快；30天约覆盖前40-50%加速段
    sources:
    - Lally, van Jaarsveld, Potts & Wardle 2010, European Journal of Social Psychology
    url: ''
  - claim: 坚持21天即可形成习惯
    verdict: 证伪
    original: 🔴 没有任何研究支持'21天形成习惯'——Maltz只是临床观察未做实验
    evidence: Lally 2010实测中位66天（18-254天）；21天说法源自Maltz医生临床观察，从未有实验支持
    sources:
    - Lally et al. 2010, EJSP
    - Maltz 1960（临床观察，非实验）
    url: ''
  - claim: 把目标降到'丢人级'最小剂量，配合固定锚点与实施意图（如果-那么），可显著提高目标达成率
    verdict: 支持
    original: 🟢 强支持（真金）
    evidence: Gollwitzer & Sheeran 2006元分析（94项研究、>8000受试者）：实施意图使目标达成率提高d≈0.65，健身节食类可达2-3倍；Fogg 2019 B=MAP：动机下降时唯一杠杆是降难度+强提示
    sources:
    - Gollwitzer & Sheeran 2006 (meta, k=94)
    - Fogg 2019, Tiny Habits
    - Gollwitzer 1999, American Psychologist
    url: ''
  - claim: 习惯中断后加倍补偿（'今天没做明天做2倍'）极易诱发二次中断，正确做法是次日以最低存活剂量（约20%）恢复并逐步爬升
    verdict: 支持
    original: 🔴 加倍补偿——Marlatt已证伪：补偿导致60%+的二次中断
    evidence: Marlatt & Gordon 1985复发预防模型：单次中断（lapse）不等于全面复发（relapse），补偿式恢复与'全自我失败'归因触发违戒效应（AVE）导致全面中断
    sources:
    - Marlatt & Gordon 1985, Relapse Prevention
    url: ''
  - claim: 自我同情（自我宽容+共同人性+正念）会增加而非削弱自我改进动机，中断后自责式归因才导致放弃
    verdict: 支持
    original: ✅ 强支持（真金）
    evidence: Breines & Chen 2012（PSPB）：自我同情提高自我改进动机，推翻'自我同情=放弃'误解；Leary et al. 2007：自我同情者失败后更倾向调整目标而非自责放弃
    sources:
    - Breines & Chen 2012, PSPB
    - Neff 2003a, Self and Identity
    - Leary et al. 2007
    url: ''
  - claim: 中断一天不算失败，连续中断两天才算链路断裂（never miss twice），第二天必须完成最低剂量
    verdict: 支持
    original: 🟢 强支持
    evidence: Fogg 2019 Tiny Habits提出never miss twice；与Marlatt lapse≠relapse归因重构一致，被Clear 2018《Atomic Habits》与Maurer 2014引用
    sources:
    - Fogg 2019, Tiny Habits
    - Marlatt & Gordon 1985
    - Clear 2018, Atomic Habits
    url: ''
  - claim: 习惯建立初期（约30天）不公开宣告目标、屏蔽社会比较可保护内在动机，但完全沉默可能过度，30天后宜引入非目标领域的同侪
    verdict: 部分支持
    original: 🟡 部分（30天内锁死自我参照有据，但完全沉默可能过度）
    evidence: Festinger 1954社会比较+Deci & Ryan 1985 SDT支持初期低调；公开承诺悖论（Carden & Wood 2018）属流传证据强度较弱；高质量同侪可降低中断期孤独感与风险
    sources:
    - Festinger 1954, Human Relations 7(2)
    - Deci & Ryan 1985
    - Carden & Wood 2018
    url: ''
  - claim: 每日打勾的视觉链条系统通过小进展反馈与损失厌恶维持动机，可对抗潜伏期'无效感'
    verdict: 支持
    original: 🟢 强支持
    evidence: Amabile & Kramer 2011（238份知识工作者日记、约12000工作日）：小胜是影响动机的最强催化剂，比评价与激励更强；Kahneman & Tversky 1979损失厌恶λ≈2.0放大断链痛苦；每日一勾=Skinner FR1
    sources:
    - Amabile & Kramer 2011, The Progress Principle
    - Kahneman & Tversky 1979, Econometrica
    - Skinner 1938/1953
    url: ''
  - claim: '''急切→极端→放弃→倒退''的恶性循环由担忧型完美主义、双曲贴现与沉没成本谬误共同驱动，''必然成功''的小步可切断该链条'
    verdict: 支持
    original: 🟢 强支持
    evidence: Stober 1998：担忧型完美主义（关注错误高分）与拖延显著正相关；Laibson 1997双曲贴现；Arkes & Blumer 1985沉没成本谬误；Dweck 2006固定型心态把失败解读为能力证据
    sources:
    - Stober 1998
    - Laibson 1997, QJE
    - Arkes & Blumer 1985, OBHDP
    - Dweck 2006, Mindset
    url: ''
  - claim: '''永远不超标''（绝不超额执行）是习惯养成的普世规则'
    verdict: 存疑
    original: 🟡 慎用：某些研究支持弹性，完全'不超标'长期可能积累过度克制压力
    evidence: 报告裁定属'镀铜'限定：中断后减量执行优于完全中断，完全克制在长期可能积累过度克制压力，有边界条件而非普世规则
    sources:
    - Marlatt & Gordon 1985（复发预防）
    url: ''
  - claim: 习惯改变存在'潜伏期'：初期执行无可感知结果（J型学习曲线），需人为构造可观测信号（如打勾）防止无效感触发放弃
    verdict: 部分支持
    original: 🟢（复利曲线4阶段+J曲线，数学演示可直接验证）
    evidence: Newell, Liu & Mayer-Kress 2001：学习曲线常呈J型（先投入后拐点指数增长）；1.01^365=37.78为数学演示（Hardy 2011），属隐喻而非实证预测
    sources:
    - Newell, Liu & Mayer-Kress 2001
    - Hardy 2011, The Compound Effect
    url: ''
  - claim: 每日微小行动是对目标身份的'投票'，身份认同（我是X的人）比结果目标更能维持长期行为
    verdict: 支持
    original: 🟢 强支持（真金）
    evidence: Clear 2018《Atomic Habits》身份投票论（每次行动=投给想成为的人）；Verplanken & Orbell 2003 SRHI量表：习惯强度为连续变量，高习惯强度行为更抗中断
    sources:
    - Clear 2018, Atomic Habits
    - Verplanken & Orbell 2003, J Applied Social Psychology
    url: ''
- theme: 冥想科学依据与练习方法
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 冥想科学依据与练习方法调研报告.md
  claims:
  - claim: 规律冥想者及受训人群的大脑灰质结构存在可测量差异，与情绪觉察相关的右前腹侧脑岛最一致
    verdict: 支持
    original: 证据等级 A-
    evidence: 25项MRI研究元分析（冥想者395 vs 对照454）：直接对照 g≈1.03；唯一空间一致脑区为右前腹侧脑岛；但异质性高（I²≈76%）。
    sources:
    - MRI灰质结构元分析（PMC8500886）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8500886/
  - claim: 正念训练增强显著性网络-默认模式网络（SN-DMN）跨网络连接，对应更强的对走神与反刍的元觉察控制
    verdict: 支持
    original: 证据等级 A（Nature 子刊元分析）
    evidence: 12项静息态fMRI研究（n=226 vs 204）元分析（Scientific Reports 2022）：SN-DMN连接增强，Hedge's g≈0.234，p=0.029。
    sources:
    - Scientific Reports 2022 静息态fMRI元分析
    url: ''
  - claim: 8周MBSR中感知压力下降越多者，右侧基底外侧杏仁核灰质密度下降越多
    verdict: 部分支持
    original: 证据等级 B（纵向）
    evidence: Hölzel et al. 2010（26名健康高压被试，8周MBSR前后MRI）：PSS下降幅度与右侧杏仁核灰质密度下降正相关；小样本、无对照。
    sources:
    - Hölzel et al. 2010
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2840837/
  - claim: 对焦虑障碍患者，8周MBSR的疗效不劣于一线药物艾司西酞普兰，且副作用更少
    verdict: 支持
    original: 证据等级 A（RCT）
    evidence: JAMA Psychiatry 2023 TAME trial（n=276 RCT）：8周MBSR不劣于艾司西酞普兰；副作用发生率15.4% vs 78.6%。
    sources:
    - Hoge et al. 2023 (JAMA Psychiatry)
    url: https://doi.org/10.1001/jamapsychiatry.2022.3679
  - claim: 冥想项目对抑郁症状有小幅改善
    verdict: 部分支持
    original: 证据等级 B
    evidence: AHRQ 综述/Goyal et al. 2014（41项试验、2993人）：中等证据，ES≈0.32（小效应）。
    sources:
    - Goyal et al. 2014
    url: https://doi.org/10.1001/jamainternmed.2013.13018
  - claim: 冥想项目对慢性疼痛有小幅改善
    verdict: 部分支持
    original: 证据等级 B
    evidence: AHRQ 综述/Goyal et al. 2014（41项试验、2993人）：中等证据，ES≈0.33。
    sources:
    - Goyal et al. 2014
    url: https://doi.org/10.1001/jamainternmed.2013.13018
  - claim: 正念冥想改善老年睡眠障碍者的睡眠质量，效应量大且优于睡眠卫生教育
    verdict: 支持
    original: 证据等级 A–B
    evidence: JAMA Internal Medicine 2015 RCT（Black et al.）：PSQI效应量0.89（大），优于睡眠卫生教育；慢性失眠RCT缓解率50%。
    sources:
    - Black et al. 2015 (JAMA Internal Medicine)
    url: https://doi.org/10.1001/jamainternmed.2014.1906
  - claim: 正念训练能即时提升专注力与工作记忆
    verdict: 存疑
    original: B-（提示性）
    evidence: Headspace RCT：1个月随访工作记忆优于对照，但即时后测无差异——需持续练习才可能显效，仅为提示性证据。
    sources:
    - Headspace RCT (PMC9483434)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9483434/
  - claim: 冥想练得越久、单次时间越长，效果越好（剂量-反应关系）
    verdict: 存疑
    original: 关键纠偏：实证并未证明
    evidence: 2026剂量-反应综述：RCT中大小剂量结局差异不显著；关键是'每天规律'而非单次时长，新手从5分钟起步即可。
    sources:
    - 2026 剂量-反应综述 (Journal of Contemplative Studies)
    url: ''
  - claim: 冥想是零风险、无不良反应的活动
    verdict: 证伪
    original: 不良反应被长期低估，但确实存在
    evidence: 系统综述（ACPS，83项研究）：总不良反应率8.3%（实验性3.7%），最常见焦虑33%、抑郁27%、认知异常25%，与心理治疗3%-10%相当。
    sources:
    - Farias et al. 2020 (Acta Psychiatrica Scandinavica)
    url: https://doi.org/10.1111/acps.13125
  - claim: 有心理困扰或精神病史者、以及新手贸然参加长期闭关，冥想不良反应风险显著升高
    verdict: 部分支持
    original: 预测因子：心理困扰、参加闭关
    evidence: 美国人群调查（n=886）：58.4%报告某种不良反应，9.1%功能受损；预测因子为心理困扰与参加闭关。
    sources:
    - 美国人群调查 (n=886)
    url: ''
  - claim: 中重度焦虑/抑郁患者可以用冥想替代精神科治疗或作为停药理由
    verdict: 证伪
    original: ❌ 能替代治疗
    evidence: 报告临床立场：中重度焦虑/抑郁中冥想是辅助而非替代，不是停药理由；有精神病史者需临床监护下作辅助治疗。
    sources: []
    url: ''
  - claim: Headspace 等冥想App对抑郁的改善有充分且无利益冲突的RCT证据支持
    verdict: 部分支持
    original: 14项RCT，75%见改善；50%研究有利益冲突→结论打折扣看
    evidence: Headspace 14项RCT中75%报告抑郁改善，但50%研究有利益冲突（厂商提供免费权限/参与设计）；Calm截至2021仅1项RCT。
    sources:
    - Headspace/Calm RCT 系统综述 (PubMed 36125880)
    url: https://pubmed.ncbi.nlm.nih.gov/36125880/
- theme: 大学生四类共性状态科学依据
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 大学生四类共性状态科学依据调研报告.md
  claims:
  - claim: 大学生'莫名烦躁'与无聊倾向及基本心理需要缺失相关，是有结构性来源的状态而非无病呻吟
    verdict: 支持
    original: ✅ 强支持
    evidence: Liu 2024（N=1102）：无聊-焦虑r=0.457；2021中华行为医学（N=590）：无聊-抑郁r=0.649；Escartín 2014（50名大学生12节课）：课堂仅20%时间处于心流
    sources:
    - Liu 2024
    - 中华行为医学 2021
    - Escartín 2014
    - Deci & Ryan 2000 SDT
    url: ''
  - claim: 网络上行社会比较（刷朋友圈/小红书/抖音看到'成功同辈'）与心理适应不良稳定相关
    verdict: 支持
    original: ✅ 强支持
    evidence: Lei 2026元分析（94个效应量，N=36,583）：网络上行比较与心理适应不良r̄=0.330；边界：比较对象接近且可达时有同化激励作用（Collins 1996）
    sources:
    - Lei 2026 (meta)
    - Collins 1996
    - Festinger 1954
    url: ''
  - claim: '''易被带节奏''源于从众与信息瀑布机制：多数人一致给出错误答案时32-37%被试至少一次服从，一个同盟者即可大幅降低从众'
    verdict: 支持
    original: ✅ 强支持
    evidence: Asch 1956：32-37%被试至少一次服从错误多数，有1名同盟者时从众率降至约1/4；Bikhchandani 1992信息瀑布：个体会忽略私人信息跟随前人选择
    sources:
    - Asch 1956
    - Bikhchandani, Hirshleifer & Welch 1992
    url: ''
  - claim: '''多疑敏感''对应高敏感人格（HSP）这一稳定特质（约15-25%人口），是感觉加工更精细而非病态警觉'
    verdict: 支持
    original: ✅ 强支持
    evidence: Lionetti 2019元分析（k=72，N>40,000）：HSP与神经质r=0.40-0.42、与负性情感r=0.34；Acevedo 2014 fMRI：岛叶/下额回/前扣带激活增强但杏仁核无差异
    sources:
    - Lionetti 2019 (meta)
    - Acevedo 2014 fMRI
    - Aron 1997
    url: ''
  - claim: '''意志力如肌肉''的自我损耗（ego depletion）资源模型成立，自控失败是能量耗尽'
    verdict: 证伪
    original: ❌ Hagger 2016 d=0.04 CI [-0.07, 0.15]，23实验室联合复制崩塌
    evidence: Hagger et al. 2016预注册联合复制（23个实验室，N=2,141）：效应d=0.04、置信区间包含零，经典范式无法复现，资源模型被推翻
    sources:
    - Hagger et al. 2016, Registered Replication Report
    url: ''
  - claim: 自控失败应改用'动机-注意力转移'解释：不是能量耗尽，而是动机从'必须做'转向'想做'，注意力可重新分配
    verdict: 支持
    original: ⚠️⚠️⚠️ 最强红线：必须改为'动机-注意力转移'
    evidence: Inzlicht & Schmeichel 2012 / Inzlicht & Berkman 2015动机转移模型（shifting priorities）：自控后大脑对任务重新估值而非资源耗尽
    sources:
    - Inzlicht & Berkman 2015
    - Inzlicht & Schmeichel 2012
    url: ''
  - claim: '''成长心态''教育干预能普遍显著提升（普通）学生的学业成绩'
    verdict: 证伪
    original: ⚠️ Macnamara 2022高质量6研究d=0.02不显著；早期效应被发表偏差与商业利益放大
    evidence: Macnamara 2022（Psychological Science，63研究N=97,672）：总体d=0.05，高质量6研究d=0.02 [-0.06,0.10]不显著；Blackwell 2007 d=0.66→Macnamara 2022 d=0.02累计落差33倍
    sources:
    - Macnamara et al. 2022, Psychological Science
    - Sisk et al. 2018
    url: ''
  - claim: 行为激活（先做再说、每天1-2件小事）是治疗抑郁的高效心理疗法，效应量不弱于药物，适合'想多做少'状态
    verdict: 支持
    original: ✅ 强支持（BA g=0.85）
    evidence: Cuijpers 2023元分析：BA g=0.85（CI 0.57-1.10），NNT=3.48；Ekers 2014：vs药物SMD=-0.42不弱；Dimidjian 2006 RCT（N=241重度抑郁）：BA改善79%>药物60%>认知治疗50%
    sources:
    - Cuijpers 2023 (meta)
    - Ekers 2014, PLOS ONE
    - Dimidjian 2006 RCT
    - Richards 2016, Lancet（COBRA）
    url: ''
  - claim: '''活在当下''的正念训练能显著降低抑郁复发风险并改善焦虑抑郁症状'
    verdict: 支持
    original: ✅ 强支持
    evidence: Kuyken 2016（JAMA Psychiatry，1258例个体数据60周）：MBCT复发风险HR=0.69（降低31%）；ACT治抑郁SMD=-0.66（Wang 2025）；正念治焦虑g=0.63（Hofmann 2010）
    sources:
    - Kuyken et al. 2016, JAMA Psychiatry
    - Wang 2025 (ACT meta)
    - Hofmann 2010
    url: ''
  - claim: 实施意图（'如果X情境那么我做Y'）能把想法转化为行动，目标达成率获得中等至大效应提升
    verdict: 支持
    original: ✅ 强支持
    evidence: Gollwitzer & Sheeran 2006元分析（k=94）：d=0.65；Sheeran 2024更新（k=642）校正后d=0.36仍显著
    sources:
    - Gollwitzer & Sheeran 2006 (meta)
    - Sheeran et al. 2024
    url: ''
  - claim: 习惯形成中位约66天（18-254天），'21天习惯'说法无科学支持，关键是每天同一情境的稳定性
    verdict: 支持
    original: ✅ 强支持（66天，非21天）
    evidence: Lally 2010/2014（N=96真实情境研究）：中位66天，范围18-254天；Lally已多次澄清21天无依据
    sources:
    - Lally et al. 2010, EJSP
    - Fogg 2019, Tiny Habits
    url: ''
  - claim: 中国大学生心理咨询知晓率约80%但实际使用率仅2.8%，低成本循证自助方法（正念/小事启动/行为实验）可填补此鸿沟
    verdict: 支持
    original: 🟢 强支持（中国大学生本土化数据）
    evidence: 2024中科院心理所蓝皮书（N=60,782）：知晓率80%、使用率2.8%；一二年级抑郁焦虑风险高于高年级；室友支持为保护因素（OR≈0.6）
    sources:
    - 2024中科院心理所《中国国民心理健康发展报告》
    url: ''
  - claim: 短视频重度使用与大学生负面状态相关，应主动限制时长（报告建议<90分钟/天）
    verdict: 支持
    original: 🟢 强支持（本土数据）
    evidence: 2024蓝皮书（N=60,782）：日均短视频179.9分钟，30%反映负面影响，36.5%有成瘾倾向；93.33%大学生有学业拖延（中国青年网2021，N=22,896）
    sources:
    - 2024中科院心理所蓝皮书
    - 中国青年网 2021
    url: ''
  - claim: 马克思异化四维度可作为大学生'莫名烦躁'的科学诊断工具
    verdict: 部分支持
    original: 🟡 哲学人类学非量表，只作结构诊断用，不作为诊断工具
    evidence: 报告裁定：Marx 1844异化论仅可作'为何读书缺乏及时正向反馈'的结构解释，误用为病理学诊断属还原论错误
    sources:
    - Marx 1844《1844年经济学哲学手稿》
    url: ''
- theme: 底层四大隐形陷阱科学依据
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 底层四大隐形陷阱科学依据调研报告.md
  claims:
  - claim: '''布热津斯基1995年提出奶头乐理论、资本精英有计划设计奶头乐''属孤证伪托的阴谋论叙事'
    verdict: 证伪
    original: 误用（孤证伪托），学界普遍视为无数据支撑
    evidence: '''布氏提出''仅见于1996年《全球化陷阱》两位记者转述，英文世界无独立记载、本人从未确认；1995年会议有CNN直播，与''密谋''叙事矛盾；中文''三种娱乐模型''系二次创作。'
    sources:
    - The Global Trap (1996/1997)
    - 方可成考证
    - Wiktionary tittytainment
    url: https://en.wikipedia.org/wiki/The_Global_Trap
  - claim: '''人类注意力只剩47秒/短视频把注意力摧毁成47秒''是泛化误用：测的是职场屏幕切换行为，非注意力上限'
    verdict: 证伪
    original: 数据坚实，泛化误用
    evidence: Gloria Mark（UC Irvine）追踪：2004年约2.5分钟→2016-2020年47秒（已趋稳态），被50秒/44秒独立复现；但为观测性数据、时序下降不等于屏幕导致。
    sources:
    - Mark et al. CHI 2016
    - APA Speaking of Psychology
    url: https://ics.uci.edu/~gmark/Home_page/Publications_files/CHI%2016%20Multitasking%20and%20Focus.pdf
  - claim: 重度无结构短视频使用（通常≥4小时/天）与青少年注意力不集中、冲动性、工作记忆下降一致相关，但因果证据薄弱、集中于重度使用
    verdict: 部分支持
    original: 方向有据，因果薄弱，GRADE确定性低
    evidence: 2026 ECAP 系统综述（42项研究、N=46,912）：注意力 β≈0.30、工作记忆 β≈-0.75、成瘾症状 β≈0.60；唯一RCT是减全部娱乐屏幕（JAMA Netw Open 2024, d=0.53），非短视频特异。
    sources:
    - European Child & Adolescent Psychiatry 2026 综述
    - SCREENS 试验 JAMA Network Open 2024
    url: https://link.springer.com/article/10.1007/s00787-026-03083-7
  - claim: 短视频'下一条不确定'的可变奖励设计通过中脑多巴胺'想要'系统促成成瘾式使用
    verdict: 支持
    original: 机制坚实
    evidence: Ferster & Skinner 1957 可变比率强化产生最稳定最难消退的反应；2023 Addictive Behaviors 综述：信息流设计经奖赏预测误差持续激活多巴胺系统。
    sources:
    - Ferster & Skinner 1957
    - Addictive Behaviors 2023 综述
    - Berridge & Robinson wanting/liking
    url: https://www.sciencedirect.com/science/article/pii/S0306460323000217
  - claim: '''多巴胺排毒/detox''可通过清空多巴胺重置大脑，没有神经科学依据'
    verdict: 证伪
    original: 误用（Cleveland Clinic 辟谣）
    evidence: Berridge & Robinson 激励显著化理论：多巴胺介导'想要'而非'喜欢'，且为运动/睡眠/动机必需递质，无法也不应'清空'；该词系2019年营销包装，本质是认知行为疗法。
    sources:
    - Berridge & Robinson 2016
    - Cleveland Clinic 辟谣
    url: https://health.clevelandclinic.org/dopamine-detox
  - claim: '''低收入群体日均刷短视频比高收入群体多1.5小时''查无任何原始出处（方向有间接支持）'
    verdict: 证伪
    original: 无据（方向部分成立）
    evidence: 仅见于无引用自媒体；CNNIC不按收入分层公布；最接近的是美国 Common Sense 2019：低收入家庭青少年全部娱乐屏幕时间多1小时43分-1小时50分（口径不同）。
    sources:
    - Common Sense Census 2019
    - Pew Research 2025
    url: https://www.commonsensemedia.org/sites/default/files/research/report/2019-census-8-to-18-full-report-updated.pdf
  - claim: 稀缺征'认知带宽税'方向获支持，但'穷人因此损失13个IQ点'的强版本复制不一致、效应被高估
    verdict: 部分支持
    original: 方向有据，强度被夸大
    evidence: Mani 2013 Science 商场实验 d=0.88-0.94；但 Carvalho 2016 AER 发薪日前后认知无差异；2024元分析（256效应量、111,852人）控制教育后仅 g=-0.15。
    sources:
    - Mani et al. 2013 Science
    - Carvalho et al. 2016 AER
    - 2024 元分析
    url: https://www.sciencedirect.com/science/article/pii/S0167487024000102
  - claim: 无反馈的重复练习（天真练习）难以积累能力，且刻意练习总体仅解释表现差异约12%、职业领域<1%不显著
    verdict: 支持
    original: 结构性报酬递减是真的，'勤奋无效'是过度简化
    evidence: Ericsson 1993 刻意练习三要素含即时反馈；Macnamara et al. 2014 元分析：刻意练习解释表现差异12%（教育）、职业领域<1%（不显著）。
    sources:
    - Ericsson et al. 1993
    - Macnamara et al. 2014 Psychological Science
    url: https://doi.org/10.1177/0956797614535810
  - claim: 长期刚性外部结构导致机构化（依赖外部决策、自主发起能力萎缩），但监狱研究属极端情境，平移到普通职场是跨域外推
    verdict: 部分支持
    original: 机制有真实文献对应，监狱隐喻慎用
    evidence: Craig Haney 2002 监狱心理研究：长期刚性结构致依赖外部决策与过度警觉，且当事人几乎无自觉；报告标注普通职场可控性与退出自由远高于监禁。
    sources:
    - Haney 2002 The Psychological Impact of Incarceration
    url: https://www.urban.org/sites/default/files/publication/60676/410624-The-Psychological-Impact-of-Incarceration.PDF
  - claim: 被动无助不是被'驯化/习得'的，而是面对持续不可控厌恶刺激的默认反应；真正需要主动习得的是可控感
    verdict: 支持
    original: 习得性无助理论2016年被神经科学反转
    evidence: Maier & Seligman 2016：被动反应由背侧中缝核5-羟色胺介导为默认；vmPFC检测到'我能控制'后抑制被动回路——可控感回路需反复激活，早期控制经历可'免疫化'后续压力。
    sources:
    - Maier & Seligman 2016 Learned Helplessness at Fifty
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4920136/
  - claim: 人明知危机仍拒绝改变有坚实机制：现状偏差、损失厌恶、遗漏偏差、系统正当化四重作用
    verdict: 支持
    original: 全视频最坚实的一条
    evidence: Samuelson & Zeckhauser 1988 现状偏差；Madrian & Shea 2001 401(k)研究：自动加入后61%新员工停留默认组合（旧制度<1%）；损失厌恶系数下修至中位λ≈1.31但方向稳健。
    sources:
    - Samuelson & Zeckhauser 1988
    - Madrian & Shea 2001 NBER
    - 2024 损失厌恶元分析
    url: https://www.nber.org/system/files/working_papers/w7682/w7682.pdf
  - claim: 低收入群体在可见地位品上的支出比例更高，可能压低储蓄并形成贫困陷阱——无需阴谋论解释
    verdict: 支持
    original: 垃圾桶陷阱最有力的科学对应（实证最硬）
    evidence: Charles, Hurst & Roussanov 2009 QJE：参照群体越穷可见消费占比越高；Moav & Neeman 2012 EJ：穷人更大比例收入用于信号性消费降低储蓄率。
    sources:
    - Charles, Hurst & Roussanov 2009 QJE
    - Moav & Neeman 2012 Economic Journal
    url: https://www.nber.org/system/files/working_papers/w13392/w13392.pdf
  - claim: '''越贵越买''的凡勃伦效应并非普遍规律，分品类、分人群、分价格区间，严格实验中难以稳定复制'
    verdict: 部分支持
    original: 理论链坚实，'越贵越买'非普遍规律
    evidence: Bagwell & Bernheim 1996 AER 信号博弈理论上成立；Heffetz 2009 田野实验未检测到显著非预算约束价格效应；视频中Hanauer实验、He & Wu论文均查无实据。
    sources:
    - Bagwell & Bernheim 1996 AER
    - 'Heffetz 2009 AEJ: Applied'
    url: https://www.aeaweb.org/articles?id=10.1257%2Fapp.1.4.170
  - claim: '''86.6%年轻人负债累累''是误读：实为信贷产品使用率，实质负债人群44.5%、债务收入比实质仅12.5%'
    verdict: 证伪
    original: 误读（把使用率当负债率）
    evidence: 尼尔森2019（N=3,036）：86.6%使用信贷产品，其中42.1%仅当支付工具当月还清；信贷用途集中于日常与休闲，并非主要买奢侈品。
    sources:
    - 尼尔森《中国年轻人负债状况报告》2019
    url: https://www.jiemian.com/article/3700688.html
  - claim: 信用卡等抽象支付产生'支付钝化'：同样商品用信用卡出价显著更高，溢价最高达100%
    verdict: 支持
    original: 支付钝化效应是真的
    evidence: Prelec & Simester 2001 真实拍卖实验（MIT）：被要求用信用卡支付者的出价显著更高，篮球门票溢价最高达100%。
    sources:
    - Prelec & Simester 2001 Marketing Science
    url: https://web.mit.edu/simester/Public/Papers/Alwaysleavehome.pdf
- theme: 情关与认知升级
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 情关与认知升级调研报告.md
  claims:
  - claim: 恋爱使双方自我概念重叠，分手导致自我概念内容改变与清晰度显著下降，清晰度下降独特预测分手后痛苦
    verdict: 支持
    original: 命题一验证 ✅
    evidence: Lewandowski 'Who Am I Without You?'（3项研究）：分手后自我概念清晰度显著下降且独特预测情绪痛苦；2025 PRISMA 综述（47项研究）确认分手真实改变自我概念。
    sources:
    - Lewandowski et al. 自我概念研究
    - PRISMA 分手综述 2025
    url: ''
  - claim: 分手后恢复呈韧性/快速恢复/慢恢复/慢性痛苦四类轨迹，神经质+高反刍+认知控制差者走向慢性痛苦
    verdict: 支持
    original: 被动等待可能滑入慢性痛苦轨迹
    evidence: 分手轨迹研究（n=87，30周跟踪）：慢性痛苦轨迹由神经质、反刍与认知控制差预测——'熬'不等于'过'。
    sources:
    - 分手后轨迹研究 (n=87, 30周)
    url: ''
  - claim: 分手痛苦源于沉没成本与替代恐惧：投资模型三支柱（满意度+投资规模+替代质量）预测承诺与分手
    verdict: 支持
    original: 命题二精确成立 ✅
    evidence: Le et al. 元分析（137项研究，n≈38,000）：承诺预测分手 d=-0.832（极强）；SEM（N=499）确认投资→损失厌恶→承诺因果路径；'本来要一起做的事'（未来计划投资）预测力最强。
    sources:
    - Le et al. 投资模型元分析
    - Goodfriend & Agnew
    - Rusbult 投资模型
    url: ''
  - claim: 害怕单身会使人将就低质量关系，依恋焦虑者因恐惧改变而留在不幸福关系中
    verdict: 支持
    original: JPSP 2013 验证
    evidence: Spielmann et al. 2013 JPSP：害怕单身提高容忍低质量关系的倾向；George 2020：依恋焦虑→恐惧改变→留在不幸福关系。
    sources:
    - Spielmann et al. 2013 JPSP
    - George 2020
    url: ''
  - claim: 亲密关系可由社会交换/投资模型刻画，吸引力提升策略跨文化一致：提升外貌>展示才能>展示相似性
    verdict: 支持
    original: 命题三有完整实证链条 ✅
    evidence: 14国伴侣价值研究（N=7,181）策略排序跨文化一致；conjoint分析（445人、5,340次滑动）：外貌1SD=选择率+20%，智力1SD仅+2%；捷克样本（N=2,280）高价值者更挑剔。
    sources:
    - 14国伴侣价值研究 (N=7,181)
    - conjoint 滑动分析
    - 捷克国民样本
    url: ''
  - claim: 关系条件自尊（RCSE）高者，情绪与自尊随关系事件剧烈连锁波动（'被绑在船头'而非'掌舵'）
    verdict: 支持
    original: 最硬核证据：Knee JPSP 2008 ✅
    evidence: Knee et al. 2008 JPSP（4项研究+14天日记）：RCSE高者关系事件→情绪→自尊连锁反应显著更强；Crocker 条件自尊研究：自尊绑外部领域者受挫时最脆弱。
    sources:
    - Knee et al. 2008 JPSP
    - Crocker 条件自尊研究
    url: ''
  - claim: 把自我价值来源从外部认可转向自主成长（SDT自主导向），可获得更稳定的自尊与更低抑郁焦虑
    verdict: 支持
    original: 命题四验证 ✅（'向内修'=自主导向）
    evidence: Deci & Ryan 自我决定理论：自尊稳定来源是自主（胜任+联结为辅）而非被认可；Kasser & Ryan：强调外部认可与低自尊、抑郁、焦虑相关。
    sources:
    - Deci & Ryan 自我决定理论
    - Kasser & Ryan 外部动机研究
    url: ''
  - claim: 被动等待（'熬过失恋'）恢复慢甚至慢性化，主动认知重构（书写+重构+自我建设）才是真正的'洗牌升级'
    verdict: 支持
    original: ⚠️ 关键修正：'熬'≠'过'
    evidence: PRISMA 综述（47研究）：恢复好的个体具备情绪调节与心理化能力——是主动技能而非时间自动馈赠；轨迹研究显示被动者滑向慢性痛苦。
    sources:
    - PRISMA 分手综述 2025
    - 分手轨迹研究
    url: ''
  - claim: 表达性书写不是万能药：对高反刍且高度意义搜寻者反而有害，应先行为激活再叙事书写
    verdict: 支持
    original: 🚨 本报告最重要的修正
    evidence: Sbarra 9个月随访：高反刍+高度意义搜寻者做情绪书写后结局更差；对比之下 Sloan 研究显示低反刍者书写后抑郁下降——效果依人群而异。
    sources:
    - Sbarra 表达性书写随访研究
    - Sloan 书写干预研究
    url: ''
  - claim: 能把人生故事讲顺（叙事连贯性高）的人，离婚/分手后恢复更好
    verdict: 支持
    original: '''自我闭环''=讲一个完整的自己的故事'
    evidence: 叙事连贯性研究（N=109）：叙事连贯性高者离婚恢复更好；与 McAdams 人生故事模型及'救赎序列'一致。
    sources:
    - 叙事连贯性与离婚恢复研究 (N=109)
    - McAdams 人生故事模型
    url: ''
- theme: 走出人生低谷
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 走出人生低谷调研报告.md
  claims:
  - claim: 有适度但非零终生逆境史的人，比零逆境和高逆境者痛苦更低、生活满意度更高（U形淬炼关系）
    verdict: 支持
    original: 奠基性证据，U形二次关系
    evidence: Seery, Holman & Silver 2010 JPSP 多年度纵向全国样本 N=2,398：适度逆境组痛苦与PTSD症状更低；Seery 2013 冷加压实验复现为生理-行为差异。
    sources:
    - Seery et al. 2010 JPSP
    - Seery et al. 2013 Psychological Science
    url: https://doi.org/10.1037/a0021344
  - claim: 童年期累积逆境与心理问题主要呈单调负向剂量反应，逆境种类越多抑郁风险越高
    verdict: 支持
    original: 主要支持单调上升的损害模式
    evidence: 2023 ACE-IQ 元分析（N=14,238）：任何童年逆境使抑郁风险升至2.75倍；2018 BMC Psychiatry：任何逆境 OR=4.6，3种以上 OR=4.6-8.0。
    sources:
    - ACE-IQ 2023 元分析
    - BMC Psychiatry 2018
    url: https://www.sciencedirect.com/science/article/abs/pii/S0145213423000728
  - claim: 在中年人群中，累积终生逆境不能缓冲月度逆境的负面影响，反而加剧抑郁焦虑上升（'熬过变强'未获复制）
    verdict: 支持
    original: 关键反证——未发现 steeling effect
    evidence: Infurna, Luthar & Grimm 2021 J Gerontol B 与 Infurna 2023 Psychology and Aging：终生逆境在月度逆境出现时加剧负性情绪，家庭/财务/工作领域最强。
    sources:
    - Infurna et al. 2021 J Gerontol B
    - Infurna et al. 2023 Psychology and Aging
    url: https://doi.org/10.1093/geronb/gbab230
  - claim: '''低谷是走大运前兆、熬过必然翻盘''没有任何预测性证据，属幸存者偏差支撑的玄学化叙事'
    verdict: 证伪
    original: 无预测性证据——切勿把希望全押在这上面
    evidence: Seery 2010 是事后统计不能预测个体翻盘；美国SBA约20%新企业首年倒闭、CB Insights超70%创企20个月内失败；Kahneman指成功组唯一共同答案是运气。
    sources:
    - SBA 企业存活统计
    - CB Insights 创企失败报告
    url: ''
  - claim: 把逆境评估为'挑战'而非'威胁'会产生相反的神经反应，直接影响低谷期应对质量
    verdict: 支持
    original: 强支持（Lazarus 评估模型）
    evidence: Lazarus & Folkman 1984：挑战评估激活左侧前额叶与接近行为，威胁评估激活右侧前额叶、杏仁核反应增强——同一事件生理后果完全相反。
    sources:
    - Lazarus & Folkman 1984 Stress, Appraisal, and Coping
    url: https://psu.pb.unizin.org/psych425/chapter/lazarus-view-of-stress/
  - claim: 高质量的意义建构（形成具体可叙述的新理解）能缓冲低谷痛苦，但需要时间与具体化
    verdict: 支持
    original: 主动意义建构可显著降低痛苦
    evidence: Park 2010 Psychological Bulletin（被引2000+）：起效的是'意义建构产品'而非努力数量；Park 2022 综述：成功预测因子是时间+具体化。
    sources:
    - Park 2010 Psychological Bulletin
    - Park 2022 Frontiers in Psychology
    url: https://doi.org/10.1037/a0018301
  - claim: 在最低点反复追问'为什么是我'式的反刍不产生释怀，反而加剧痛苦并维持创伤后应激
    verdict: 支持
    original: 持续 rumination 无果，与创伤后抑郁机制一致
    evidence: Park 2010：反复无果的意义建构努力（rumination状态）反而加剧痛苦；报告列为PTSD维持因素。
    sources:
    - Park 2010 Psychological Bulletin
    url: https://doi.org/10.1037/a0018301
  - claim: 低谷期'越挣扎越下沉'有神经机制支持：强努力常触发威胁僵硬、唤起过载与前额叶功能下降
    verdict: 支持
    original: 强支持：threat rigidity + Yerkes-Dodson + PFC 损伤
    evidence: Staw 1981 ASQ 威胁僵硬（信息/控制/反应三重窄化）；Arnsten 2009/2011 综述：慢性应激使PFC神经元放电下降、树突萎缩，决策权移交杏仁核。
    sources:
    - Staw et al. 1981 ASQ
    - Arnsten 2009/2011 综述
    - Yerkes & Dodson 1908
    url: https://doi.org/10.2307/2392337
  - claim: 15分钟正念冥想即可显著降低沉没成本偏差，改善低谷期决策质量
    verdict: 支持
    original: ★★★★★（核心方法）
    evidence: Psychological Science 冥想-沉没成本实验：15分钟正念通过'拉回当下+降低负面情绪'显著减少沉没成本谬误；2015 冥想决策综述确认认知控制+情绪调节通路。
    sources:
    - Hafenbrack et al. 2014 Psychological Science
    - 冥想决策综述 2015
    url: https://pubmed.ncbi.nlm.nih.gov/24317419/
  - claim: '''决策疲劳''作为现象真实（每日决策越多次日决策质量越差），但''意志力资源耗尽''的实验室机制已被推翻'
    verdict: 部分支持
    original: 现象真实，机制被推翻
    evidence: Hagger et al. 2016 多实验室预注册复验（k=23, N=2,141）：自我损耗效应 d=0.04、CI含零；但真实世界每日决策数量与次日健康/财务决策质量仍相关。
    sources:
    - Hagger et al. 2016 Perspectives on Psychological Science
    url: https://journals.sagepub.com/doi/10.1177/1745691616652873
  - claim: 表达性书写（同一主题连写3-4天）比口头诉苦更能促进意义建构并改善健康结局
    verdict: 支持
    original: 用'书写'替代'诉苦'
    evidence: Pennebaker 范式：4天×15分钟书写最深压力事件后6个月内健康中心访问减少约50%；关键机制是叙事形成而非宣泄。
    sources:
    - Pennebaker & Seagal 1999
    url: https://doi.org/10.1002/(sici)1097-4679(199910)55:10
  - claim: 高反刍状态下向他人倾诉反而有害，倾诉的益处取决于反刍水平与听者回应类型
    verdict: 支持
    original: ★★★★（需选择性社交）
    evidence: 《社会倾诉的双刃剑》2024（N=659）：高反刍时倾诉降低情绪理解；2012《宣泄迷思》：共情回应仅暂时缓解，认知重构型回应才带来真正恢复。
    sources:
    - Double-Edged Sword of Social Sharing 2024
    - Beyond the myth of venting 2012
    url: https://pubmed.ncbi.nlm.nih.gov/39163547/
  - claim: 社会支持是创伤恢复的首要预测因子，低谷期应保留1-2个深度信任的'安全锚'而非切断一切社交
    verdict: 支持
    original: 边界：选择性社交，不是社会孤立
    evidence: Hobfoll COR 资源保存理论：0支持加速资源损失螺旋；21天日记研究（n=178）：自主选择的独处降低压力、被迫孤立有害。
    sources:
    - Hobfoll 2011 COR Theory
    - 21天独处日记研究 (PMC10698034)
    url: https://psycnet.apa.org/record/2010-25086-007
  - claim: 人群中'压力下变强'的抗脆弱表现罕见：仅约2-4%的人经常或几乎总是整体抗脆弱
    verdict: 支持
    original: 抗脆弱实证仍稀缺（Empirical studies remain scarce）
    evidence: Tsai 2024 J Positive Psychology 抗脆弱量表（N=783低收入退伍军人+245验证样本）：仅2-4%经常表现整体抗脆弱；Holton 2026 范围综述确认实证稀缺。
    sources:
    - Tsai 2024 抗脆弱量表
    - Holton et al. 2026 Scoping Review
    url: https://doi.org/10.1080/17439760.2024.2394466
  - claim: 每日'三件好事'练习可在6个月内显著提升幸福感并降低抑郁，坚持者效应最强
    verdict: 支持
    original: Seligman 2005 实证，后续元分析确认持续效应
    evidence: Seligman et al. 2005 American Psychologist：三件好事+优势使用6个月内显著提升幸福感、降低抑郁；效应在练习后6-12个月对坚持者持续。
    sources:
    - Seligman et al. 2005 American Psychologist
    url: https://time.com/wp-content/uploads/2014/11/articleseligman.pdf
- theme: 过得差时的归因调试
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 过得差时的归因调试调研报告.md
  claims:
  - claim: 失败时先审视具体环境因素（外部×稳定×不可控维度）有归因理论支持，是'定位'而非'甩锅'
    verdict: 支持
    original: 🟢 强支持（Weiner × Kelley × Seligman）
    evidence: Weiner 1985 三维归因（被引>20,000）：内外源/稳定性/可控性决定预期与情绪；Kelley 1967 协变原则提供共识-独特性-一致性检验法。
    sources:
    - Weiner 1985 Psychological Review
    - Kelley 1967 协变原则
    url: https://doi.org/10.1037/0033-295X.92.4.548
  - claim: '''过得差全是别人的问题''式完全外部归因是有效自我保护——不成立，它是习得性无助的反面镜像、另一种认知偏差'
    verdict: 证伪
    original: 🔴 勿用：完全外归=认知偏差
    evidence: Abramson 1978 归因修正版：抑郁型风格=内部+稳定+全局归因；报告论证完全外归是内部归因风格的反面镜像；Mezulis 2004 元分析（266项研究）显示归因偏差双向存在。
    sources:
    - Abramson et al. 1978
    - Mezulis et al. 2004 元分析
    url: https://doi.org/10.1037/0021-843X.87.1.49
  - claim: 行为与情绪沿社交网络传染（肥胖、吸烟跨三层人脉传播），换环境需进入新的网络结构而非仅物理离开
    verdict: 支持
    original: 🟢 强支持（Christakis Framingham 队列）
    evidence: Christakis & Fowler 2007/2008 NEJM（32年、12,067人）：朋友肥胖显著增加个人肥胖概率且跨三层传播；Centola 2010 Science：聚类网络比随机网络更能扩散健康行为；抑郁传染机制有争议（🟡）。
    sources:
    - Christakis & Fowler 2007/2008 NEJM
    - Centola 2010 Science
    - Rosenquist 2010 AJPH
    url: https://doi.org/10.1056/NEJMsa066082
  - claim: 与偏差群体抱团显著拉高越轨/再犯风险，但并非100%必然（17-32%不再犯），关键是接触稳定的非偏差群体
    verdict: 支持
    original: 🟢 有数据支持但过度化
    evidence: 美国BJS 2018：刑满释放3年再犯68%、9年83%，但17-32%不再犯；Dishion 1995：把偏差者集中干预反效果（iatrogenic）；Sampson & Laub 1990：转折点在新社会键。
    sources:
    - BJS 2018 Recidivism Report
    - Dishion et al. 1995
    - Sampson & Laub 1990
    url: ''
  - claim: 远离毒性关系是优先级等同戒烟的健康干预，但'远离所有人'=孤立有害，需新建正向连接
    verdict: 支持
    original: 🟢🟢 真金（Rook × Holt-Lunstad）
    evidence: Rook 1984 JPSP：消极交换破坏力>积极交换恢复力（负向不对称）；Holt-Lunstad 2010（148项研究、308,849人）：社会关系弱者死亡风险 OR=1.50，效应与戒烟相当。
    sources:
    - Rook 1984 JPSP
    - Holt-Lunstad et al. 2010 PLoS Medicine
    url: https://doi.org/10.1371/journal.pmed.1000316
  - claim: 反馈并非普遍有效：超过38%的反馈干预实际降低绩效，平均效应仅 d=0.41
    verdict: 支持
    original: 🟢 强支持（Kluger & DeNisi 元分析）
    evidence: Kluger & DeNisi 1996 Psychological Bulletin（607个效应量、23,663次观察）：d=0.41、>38%负向；针对自我的高层级反馈最低效甚至负效；Wisniewski 2020（k=994）复现异质性 d=0.48。
    sources:
    - Kluger & DeNisi 1996
    - Wisniewski et al. 2020
    url: https://doi.org/10.1037/0033-2909.119.2.254
  - claim: 打压式（威胁式/针对自我的）反馈会激发心理反抗，使反馈无效甚至反向
    verdict: 支持
    original: 🟢 强支持（Brehm 心理反抗理论）
    evidence: Brehm 1966 心理反抗理论（Miron & Brehm 2006 综述被引5,310）：威胁行为自由激发恢复自由的动机状态——打压者反馈无效化的机制；反馈干预理论：自我层级反馈最低效。
    sources:
    - Brehm 1966
    - Miron & Brehm 2006
    - Kluger & DeNisi 1996 反馈干预理论
    url: ''
  - claim: 凭单一观察判断他人是否说谎/是否打压者准确率差，需多源论据与长期准确率追踪（如30天记录）
    verdict: 支持
    original: 🟢 强支持（谎言检测综述）
    evidence: DePaulo 1998 与 Hart & Bondy 2019 Annual Review of Psychology：非言语欺骗线索微弱不可靠、人是中等水平谎言捕捉者——单一观察差、多源论据准。
    sources:
    - DePaulo et al. 1998
    - Hart & Bondy 2019 Annual Review of Psychology
    url: https://doi.org/10.1146/annurev-psych-010418-103135
  - claim: 学习/掌握目标导向比表现目标导向带来更有效的策略、更多挑战偏好与长期韧性
    verdict: 支持
    original: 🟢 强支持（Dweck 1986）
    evidence: Ames 1988（176名学生）：掌握目标学生策略更有效、偏好挑战；Yeager 2016 元分析（1,260名中国学生）：成长型思维经韧性提升预测心理健康与学校投入。
    sources:
    - Dweck 1986
    - Ames 1988 J Educational Psychology
    - Yeager et al. 2016
    url: https://doi.org/10.1037/0022-0663.80.3.260
  - claim: 具体+困难的目标产生最高绩效，过程导向应理解为'过程目标+每周评估'，而非不设目标
    verdict: 支持
    original: 🟢 强支持（Locke & Latham 35年综合）
    evidence: Locke & Latham 2002 American Psychologist（被引>10,000）：具体+困难目标经专注/努力/坚持/策略/效能感五机制提升绩效；Ordonez 2009 警告无目标化反效果。
    sources:
    - Locke & Latham 2002
    - Ordonez et al. 2009 Goals Gone Wild
    url: https://doi.org/10.1037/0003-066X.57.9.705
  - claim: '''只关注过程、不设目标不评估结果''是反模式——会变成无目的忙碌与价值虚无'
    verdict: 部分支持
    original: 🟡 慎用：过程导向≠不设目标
    evidence: Ordonez et al. 2009 Goals Gone Wild 警告目标缺失的风险边界；报告主张过程价值与结果价值平衡、每周复盘动作完成度（ACT 元分析 g=0.57 支持承诺行动框架）。
    sources:
    - Ordonez et al. 2009
    - Ost 2014 ACT 元分析
    url: ''
- theme: 长期坚持与运气准备
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 长期坚持与运气准备调研报告.md
  claims:
  - claim: 坚持（Grit）显著预测长期成就：西点军校保留率提升约62%，解释成功方差约4%
    verdict: 支持
    original: 真金——坚持是稀缺竞争力，研究强支持
    evidence: Duckworth et al. 2007 JPSP：Grit解释成功方差约4%、与IQ无关，西点保留率+62%；2016年研究区分：Grit预测数十年单一目标成就、自我控制预测日常适应。
    sources:
    - Duckworth et al. 2007 JPSP
    - Duckworth & Gross 2016
    url: ''
  - claim: '''Grit是尽责性之外的独立成功特质、增量预测力大''未获元分析支持：两者相关 r=0.84，增量效度几乎为零'
    verdict: 证伪
    original: 🟡 Credé 2016 grit 元分析
    evidence: Credé 2016 JPSP 元分析：grit与尽责性 r=0.84，增量效度几乎为零；'坚持兴趣不变'（consistency of interest）维度有时负向预测成就。
    sources:
    - Credé et al. 2016 JPSP
    url: ''
  - claim: '''走运是积累的必然显化''过度：准备能放大概率但不能保证结果，运气成分被系统性低估'
    verdict: 证伪
    original: 🔴 必然显化陷阱（Taleb/Salganik/Chetty）
    evidence: Salganik 2006 Science 音乐实验室：初始条件随机性显著影响流行结果；Taleb 2007 叙事谬误：人为随机事件构建因果故事；报告估运气/网络/地点/时机占30-50%+。
    sources:
    - Salganik, Dodds & Watts 2006 Science
    - Taleb 2007 Black Swan
    url: ''
  - claim: 准备（先验知识+警觉性）能系统性放大命中机会的概率：准备决定哪些机会'可见'
    verdict: 支持
    original: 🟢 强支持（Pasteur/Kirzner/Baron）
    evidence: Kirzner 1973 警觉性理论：准备不足者机会'不可见'；Baron 2006：机会识别=模式识别、依赖先验知识；Macnamara 2014：准备在反馈封闭领域解释表现差异18-26%。
    sources:
    - Kirzner 1973
    - Baron 2006 AMP
    - Macnamara et al. 2014
    url: ''
  - claim: 积累期长期无正反馈是正常现象：习惯形成中位数约66天，复利前期缓慢后期陡峭
    verdict: 支持
    original: 🟢 强支持（无反馈期真实存在）
    evidence: Lally et al. 2010 Eur J Soc Psychol：习惯形成中位数66天（个体18-254天差异大）；Newell 2001 动力学阶段跃迁模型解释J曲线式进步。
    sources:
    - Lally et al. 2010
    - Newell, Liu & Mayer-Kress 2001
    url: ''
  - claim: 大脑天然偏好即时回报、系统性低估远期回报（双曲线贴现），使长期坚持天然反本能
    verdict: 支持
    original: 🟢 强支持（走捷径长期代价）
    evidence: Laibson 1997 QJE 双曲线贴现模型（健身房月卡现象）；DellaVigna & Malmendier 2006 信用卡债实证；短期损失痛苦权重约2倍（损失厌恶）。
    sources:
    - Laibson 1997 QJE
    - DellaVigna & Malmendier 2006
    url: ''
  - claim: '''永远坚持''并非美德：坚持仅在''大逻辑成立+有小正反馈''的Dip（谷底）中正确，Cul-de-Sac（死胡同）应理性退出'
    verdict: 支持
    original: 🟡 守正仅在Dip中成立 / 🔴 反对无条件坚持
    evidence: Godin 2007 The Dip：区分谷底与死胡同；Duckworth 2018 公开承认 grit 不等于死扛、'何时放弃'是另一半；报告给出六维季度体检（3项红灯即退出）。
    sources:
    - Godin 2007 The Dip
    - Duckworth 2018 公开修正
    url: ''
  - claim: 主要风口的兑现周期普遍远超5-10年（亚马逊约10年、福耀约30年、深度学习约40年）
    verdict: 支持
    original: 成立（案例计量，视频估计保守）
    evidence: 亚马逊1997上市、2002年首次季度盈利（约10年），市值曾缩水95%；Hinton 1972-2012 经历两次AI寒冬共40年才迎AlexNet；报告标注为案例级证据。
    sources:
    - 亚马逊股东信汇编（界面新闻）
    - Hinton 五十年回顾（腾讯新闻）
    url: https://www.jiemian.com/article/6350602.html
  - claim: 安静期是筛选器：竞争者因'耐心不对称'分期退场，坚持者获得集中的幸存者资源（客户/渠道/人才/资本）
    verdict: 部分支持
    original: 成立（案例级，无独立实证研究）
    evidence: 福耀玻璃案例：专注30年成全球龙头（全球每3辆车1辆用其玻璃），急躁者3-6个月退场、跟风者1-2年退场；报告自注这是案例归纳的机制洞察，非受控研究。
    sources:
    - 福耀玻璃案例（36氪/每经网专访）
    url: https://www.36kr.com/p/3460970022278530
  - claim: 小正反馈是熬过安静期的燃料：即时回报机制（多巴胺奖赏）、目标梯度效应与自我效能积累支撑长期坚持
    verdict: 支持
    original: 成立（多巴胺+目标梯度+自我效能）
    evidence: 报告整合：多巴胺奖赏回路需要即时回报、目标梯度效应（越近越有力）、自我效能感随小成功积累；'小正反馈不是大成功的替代品，是熬到大成功的燃料'。
    sources: []
    url: ''
  - claim: 成功归因需诚实承认'准备+运气'双成分：漏掉任一都偏离真实，单一归因既是自夸也是幸存者叙事
    verdict: 支持
    original: 核心结论：诚实承认+持续积累+主动警觉
    evidence: 报告行动5对照表：'全靠自己努力'与'全靠运气差'均为失真叙述；Chetty 2014/2023 证明地点与出身结构性影响向上流动，个人归因必须留出运气份额。
    sources:
    - Chetty et al. 2014 QJE
    - Chetty et al. 2023 Nature
    url: ''
- theme: 个人魅力科学依据与可行性方案
  category: 6_个人成长方法论/6.4_关系婚恋与形象
  report_file: 个人魅力科学依据与可行性方案调研报告.md
  claims:
  - claim: 外貌统治亚秒级第一印象（入场券），但其权重随相处时长衰减，长期吸引靠重复曝光+正面互动+响应性
    verdict: 支持
    original: 支持｜证据强度：强（前半句完全成立；权重随相处衰减）
    evidence: Willis & Todorov 2006：100ms 即完成五维特质判断，延长只增自信不增准确；Hunt 2015：相识越久外貌匹配度越低；Reis 2011：初始印象偏正时重复接触提升吸引
    sources:
    - Willis & Todorov 2006
    - Langlois et al. 2000 元分析
    - Hunt, Eastwick & Finkel 2015
    - Reis et al. 2011
    - Moreland & Beach 1992
    url: https://pubmed.ncbi.nlm.nih.gov/16866745/
  - claim: 照通用魅力模板改造自己就能对所有人有吸引力
    verdict: 证伪
    original: 失败模式6：模板式魅力——吸引的独特性几乎不可预测
    evidence: Joel 2017 机器学习+速度约会：'谁喜欢谁'大量落在个体特异性成分；Eastwick & Finkel 2008：陈述的理想伴侣标准不能预测现场互动中的浪漫兴趣
    sources:
    - Joel, Eastwick & Finkel 2017
    - Eastwick & Finkel 2008
    url: https://pubmed.ncbi.nlm.nih.gov/28853645/
  - claim: '''先建立自我、不盲目迎合''是魅力的直接加分项'
    verdict: 部分支持
    original: 部分支持｜证据强度：中——建立自我是止损不是增益
    evidence: Campbell 1996：低自我清晰度与低自尊 r≈.61；Guadagno 2007：低SCC者更依赖外部评价；'明确自我→更有魅力'缺直接实验证据，成立的是'低清晰→从众'反向链
    sources:
    - Campbell et al. 1996
    - Guadagno et al. 2007
    - Laursen 2022
    url: https://www.tandfonline.com/doi/full/10.1080/15534510701357270
  - claim: 深耕真实能力带来尊重（仅限被观察到的专长），且长期深耕有生理沉淀（认知组块、脑结构改变）
    verdict: 支持
    original: 支持（带修正）｜证据强度：强
    evidence: Cheng 支配-威望双路径：分享专长获得尊重是被反复验证的地位通道；Maguire 2000：伦敦出租车司机后部海马灰质更大且与从业年限相关
    sources:
    - Cheng, Tracy & Henrich 双路径模型
    - Maguire et al. 2000 (PNAS)
    - Chase & Simon 1973
    url: https://pubmed.ncbi.nlm.nih.gov/10716738/
  - claim: 在单一领域堆时长（投入时间=厚度）就能形成能力与成绩
    verdict: 证伪
    original: 堆时长已被证伪：刻意练习只解释 12% 成绩差异
    evidence: Macnamara 2014 元分析88项：刻意练习仅解释成绩差异12%（教育4%、职业<1%）；Credé 2017 元分析：Grit 与尽责性 r=.84，预测力不优于尽责性
    sources:
    - Macnamara, Hambrick & Oswald 2014
    - Credé, Tynan & Harms 2017
    url: https://pubmed.ncbi.nlm.nih.gov/24986855/
  - claim: '''管控情绪''的正确实践是压抑表情、憋住不表现'
    verdict: 证伪
    original: 关键修正：压抑会让对方血压升高（Butler 2003）
    evidence: Oveis 2025 元分析77项 N=20,940：认知重评 r=.16、自然表达 r=.18（最高）、表达抑制 r=−.06；Butler 2003 实验：一方压抑令互动对方血压升高、rapport 下降
    sources:
    - Oveis, Dezecache & Gruber 2025 元分析
    - Butler et al. 2003
    - Srivastava et al. 2009
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12056272
  - claim: 情绪稳定/成熟是跨文化择偶偏好中位居前列的特质（但口头偏好对实际择偶预测力有限）
    verdict: 支持
    original: 支持（关键修正）——情绪稳定确实是跨文化最受看重的特质之一
    evidence: Buss 1989（37种文化 7,000+人）：情绪稳定/成熟位居择偶偏好前列；Malouff 2010 元分析：神经质与关系满意度 r≈−.26；限定：Eastwick 2024 预注册检验
    sources:
    - Buss 1989（37 cultures）
    - Malouff et al. 2010
    - Eastwick et al. 2024
    url: https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/sex-differences-in-human-mate-preferences-evolutionary-hypotheses-tested-in-37-cultures/0E112ACEB2E7BC877805E3AC11ABC889
  - claim: '''让他人舒服''与讨好是两条相反的路：讨好一旦被识破即反噬，且是抑郁易感因素'
    verdict: 支持
    original: 支持（机制层面）——两者方向相反，不是程度差异
    evidence: Gordon 1996 元分析：ingratiation 被识别为操纵手段时出现评价惩罚；Vonk 2002：第三方观察者更怀疑并给低评；people-pleasing 与焦虑、耗竭负关联
    sources:
    - Jones 1964
    - Gordon 1996 元分析
    - Vonk 2002
    url: http://www.communicationcache.com/uploads/1/0/8/8/10887248/impact_of_ingratiation_on_judgments_and_evaluations-_a_meta-analytic_investigation.pdf
  - claim: '''给人安全感''的实证配方是低回避+低焦虑（稳定可及+不过度索取），且安全感可训练'
    verdict: 支持
    original: 支持——安全感是可训练的，不是天生注定的
    evidence: Li & Chan 2012 元分析73项 N=21,602：依恋焦虑与回避均损害关系质量，回避负效应更强；Mikulincer 2020：security priming 显示安全感可被实验诱导扩建
    sources:
    - Li & Chan 2012 元分析
    - Mikulincer & Shaver 2007/2020
    - Reis 2007
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7143531/
  - claim: 做自己的真实性红利（幸福感+关系深度）真实存在，但'想说什么就说什么'的粗暴表达不行
    verdict: 部分支持
    original: 部分支持——文献指向'真实+善意表达'，不是'想说什么就说什么'
    evidence: Sutton 2020 元分析75项 N=36,533：真实性与幸福感 r≈.40；Levine & Cohen 2018 多实验：说真话的社交代价被系统性高估；边界：无分寸的粗暴仍伤关系
    sources:
    - Sutton 2020 元分析
    - Levine & Cohen 2018
    - Snyder et al. 1985
    url: https://www.sciencedirect.com/science/article/pii/S019188691930577X
  - claim: 保持好奇心、多领域涉猎会自动带来'鲜活魅力'（涉猎→有趣的因果链成立）
    verdict: 部分支持
    original: 部分支持｜证据强度：中——涉猎→有趣缺直接因果实验
    evidence: Kashdan 2011 三项研究：好奇者在深度对话中制造更多亲密感，small talk 中无优势；Tolomeo 2023 好奇心脑影像 FWE 校正后无显著簇，禁止强引用
    sources:
    - Kashdan & Roberts 2004
    - Kashdan et al. 2011
    - Tolomeo et al. 2023
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3356784/
  - claim: 渐进式自我表露提升喜欢与亲密感；神秘感的全部可核验收益只是短期不确定性注意
    verdict: 支持
    original: 支持｜证据强度：强——六条中最干净的支持
    evidence: Collins & Miller 1994 元分析：表露-喜欢三路径全为正；Aron 1997：45分钟渐进互惠表露显著产生亲密感；Birnbaum 2018：感知不感兴趣时不确定性直接损害吸引
    sources:
    - Collins & Miller 1994 元分析
    - Aron et al. 1997
    - Birnbaum et al. 2018
    url: https://pubmed.ncbi.nlm.nih.gov/7809308/
  - claim: '''保持神秘/一律难得到''会让人更渴望你'
    verdict: 证伪
    original: 失败模式5：'一律难得到'实证上无效（Walster 1973）
    evidence: Walster 1973 现场实验：'一律难得到'并不更被渴望，有效的是 selectively hard to get（对'你'热情、对他人冷淡）；感知冷漠即触发欲望抑制
    sources:
    - Walster et al. 1973
    - Whitchurch, Wilson & Gilbert 2011
    - Norton, Frost & Ariely 2007
    url: https://pubmed.ncbi.nlm.nih.gov/21169522/
  - claim: '''21天养成习惯/魅力''有科学依据（存在统一的习惯养成天数）'
    verdict: 证伪
    original: 任何'X天养成魅力'的单一数字都无科学依据
    evidence: Lally 2010（96人）：达到自动性时间中位数约66天、全距18-254天；Singh 2024：复杂行为106-154天；if-then 执行意图元分析 d=0.65（Gollwitzer & Sheeran 2006）
    sources:
    - Lally et al. 2010
    - Singh 2024
    - Gollwitzer & Sheeran 2006 元分析
    url: https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674
  - claim: 谈吐层面的魅力（表达策略）可通过训练显著提升，不是天赋
    verdict: 支持
    original: 表达层魅力可训练（RCT 级）——mean d=.62
    evidence: Antonakis 2011：12项魅力领导策略（CLT）训练，34名中层经理随机分派3个月后同事盲评显著提升；41名MBA 培训前后由135名评委盲评，魅力评分 mean d=.62
    sources:
    - Antonakis, Fenley & Liechti 2011 (AMLE)
    url: https://iris.unil.ch/bitstreams/bc0be0af-64c6-42a6-b347-6c2f379a8e50/download
- theme: 六亲缘浅与改命契机
  category: 6_个人成长方法论/6.4_关系婚恋与形象
  report_file: 六亲缘浅与改命契机调研报告.md
  claims:
  - claim: '''六亲缘浅''人群的''独立''是真正觉醒/内在稳定的表现'
    verdict: 部分支持
    original: 🟡 部分支持：回避型'独立'是防御策略，不是觉察
    evidence: Mikulincer & Shaver 2005：回避型的'独立'是去激活防御策略；Fraley 2002 元分析：回避型成人表面独立但皮质醇未降低，应激未真正消解
    sources:
    - Mikulincer & Shaver 2007《Attachment in Adulthood》
    - Fraley & Shaver 2000
    - Simpson et al. 1996
    url: https://www.guilford.com/books/Attachment-in-Adulthood/Mikulincer-Shaver/9781593854430
  - claim: 孤独可以转化为成长，但依赖认知重评、安全依恋/社会支持等前提，非必然
    verdict: 部分支持
    original: 🟡 部分支持：PTG 有基础但非必然
    evidence: Park 2010 meta：PTG 效应量小（d=0.15-0.40）且与心理健康改善不同步；Rzeszutek 2015：PTG 与社会支持正相关 r≈.20-.30；反刍式孤独导向抑郁（Nolen-Hoeksema 2001）
    sources:
    - Tedeschi & Calhoun 1996/2004 (PTG)
    - Park 2010 meta
    - Nolen-Hoeksema 2001
    url: https://psycnet.apa.org/record/1996-03415-001
  - claim: 孤独感是'命格特殊'的觉醒信号（先天命理禀赋）
    verdict: 存疑
    original: 🟡 部分支持；'命格特殊'无实证、不可证伪（玄学概念）
    evidence: 报告标注：'命格特殊'不是可证伪的科学命题；其可转化对应物（成长型心智 Dweck 2006、意义感 Steger 2006）是主观框架与可习得技能，非命理禀赋
    sources:
    - Dweck 2006
    - Steger 2006
    url: ''
  - claim: '''不受人情绑架、能量自由流动''= 切断关系即健康自主'
    verdict: 证伪
    original: ❌ 部分证伪：Relatedness 不可省略，防御性切断≠健康自主
    evidence: Ryan & Deci 2000 SDT：自主、胜任、关联缺一则幸福感不可持续；Holt-Lunstad 2010 meta（n=308,849）：社会隔离死亡风险增加26-32%；健康方式是连接中设边界
    sources:
    - Ryan & Deci 2000 (SDT)
    - Holt-Lunstad et al. 2010 meta
    - Cacioppo & Patrick 2008
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3150158/
  - claim: '''断代修行者''能打破家族宿命轮回（代际创伤可逆）'
    verdict: 部分支持
    original: 🟡 部分支持：代际创伤可逆有科学基础，但'修行者'是叙事包装
    evidence: Yehuda 2015：Holocaust 母亲创伤影响后代 DNA 甲基化；Weaver 2004：环境丰富化可逆转部分甲基化效应；真实路径是心理治疗+安全依恋，非'修行'标签
    sources:
    - Yehuda 2015
    - Weaver 2004
    - Bowen 1978
    - Felitti 1998 (ACEs)
    url: https://pubmed.ncbi.nlm.nih.gov/25740992/
  - claim: 缘分来去随缘，关系不必主动强求维护
    verdict: 部分支持
    original: 🟡 部分支持：自然发生的高质量关系有证据，但主动维护更持久
    evidence: Reis 2012：感知伴侣回应性是关系满意度最强预测因子（r≈.6-.7）；社会支持网络随年龄衰减（Siedlecki 2013），不主动维护增加晚年孤立风险
    sources:
    - Reis 2012 感知回应性
    - Siedlecki 2013
    - Kansky 2016
    url: https://psycnet.apa.org/record/2012-07161-001
  - claim: 应有意识地筛选值得的人进入生命
    verdict: 支持
    original: ✅ 支持：社会网络传染+强关系生存率50%↑，硬数据支撑
    evidence: Holt-Lunstad 2010 meta（n=308,849）：强社会关系者生存率高50%，隔离等同每天吸15支烟；Dunbar 150：核心亲密层仅5人；Christakis & Fowler 2009：行为沿网络传染
    sources:
    - Holt-Lunstad et al. 2010 meta
    - Dunbar 1998
    - Christakis & Fowler 2009
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3150158/
  - claim: 珍惜当下真心相待的关系（被看见/被回应的关系价值最高）
    verdict: 支持
    original: ✅ 强支持：全视频最硬的关系类论断
    evidence: Reis 2012：感知伴侣回应性（被理解/被认可/被关心）是关系满意度最强预测因子（r≈.6-.7）；Finkel 2014：现代婚姻质量取决于'被看见'的程度
    sources:
    - Reis 2012
    - Finkel 2014《The All-or-Nothing Marriage》
    url: https://psycnet.apa.org/record/2012-07161-001
  - claim: 低调/勤劳/善良三种'福相'必然带来福报（果报式因果关系）
    verdict: 部分支持
    original: 🟡 部分支持：三品质有实证，但'福相'果报框架是非因果包装
    evidence: Roberts 2007 meta：尽责性预测收入 r=.15、健康 r=.13；Curry 2018 meta：利他与幸福感 r≈.18——效应量小到中等（r≈.15-.30），只能建立相关非因果
    sources:
    - Roberts et al. 2007 meta
    - Curry et al. 2018 meta
    - Aknin 2013（136国）
    url: https://psycnet.apa.org/record/2007-02622-001
  - claim: 用司马懿、刘伯温的历史故事佐证'福相'美德
    verdict: 证伪
    original: ❌ 证伪：Cherry-picking+逻辑谬误（政治策略≠道德美德）
    evidence: 司马懿'隐忍'是政治权谋（高平陵之变杀曹爽三族）非道德例证；刘伯温'三分天下'出自清代/民国小说《英烈传》《烧饼歌》非明史；以个例证普遍规律属草率概括
    sources:
    - 明史刘基传（报告考证）
    - 逻辑谬误：hasty generalization
    url: ''
  - claim: 行善要顺势而为、有边界，避免'能量错位'（帮助者共情耗竭）
    verdict: 支持
    original: ✅ 支持：Compassion Fatigue 实证充分
    evidence: Figley 2002：共情疲劳有标准化测量（ProQOL 量表），效应量中等偏强；Maslach & Leiter 2016：利他型职业（医护/社工）耗竭率显著高于平均；'能量'非物理学概念但指向实证构念
    sources:
    - Figley 2002 Compassion Fatigue
    - Maslach & Leiter 2016
    url: https://psycnet.apa.org/record/2003-87044-009
  - claim: '''授人以渔''优于直接给钱，适用于一切受助者'
    verdict: 部分支持
    original: 🟡 部分支持：极端贫困 RCT 直接现金援助效果不逊
    evidence: Haushofer & Shapiro 2016 GiveDirectly RCT：$1,000 现金转移使婴儿死亡率降低48%、心理幸福感显著提升；技能训练仅在基础需求满足后有效（条件性命题）
    sources:
    - Haushofer & Shapiro 2016 RCT
    - Banerjee & Duflo 2011
    - Bandura 1997 自我效能
    url: https://www.nber.org/papers/w22392
  - claim: '''救急不救穷''作为普遍原则成立（穷源于个人不努力）'
    verdict: 部分支持
    original: 🟡 部分支持：作为全称命题不成立，结构性贫困非个人问题
    evidence: 贫困有大量结构性成因（Rajan 2010；Sen 1999 能力剥夺；Burt 1999 社会网络断裂）；应区分结构性/情境性/依赖性贫困；全称化'救穷无用'可能为不作为提供道德借口
    sources:
    - Rajan 2010《Fault Lines》
    - Sen 1999
    - Hulme & Shepherd 2003
    url: ''
  - claim: '''尊重对方命运''适用于一切被帮助者（包括心理危机者）'
    verdict: 部分支持
    original: 🟡 部分支持：自主权伦理支持，但对无决策能力者过度'尊重'=放弃
    evidence: Mental Capacity Act 2005（UK）：受助者无决策能力时可按'最佳利益'介入；对重度抑郁等心理危机者，极端被动的'尊重命运'可能延误救助甚至致命
    sources:
    - Beauchamp & Childress 1979
    - Mental Capacity Act 2005
    - Emanuel 1999
    url: https://global.oup.com/academic/product/principles-of-biomedical-ethics-9780190926427
  - claim: 真正的修行是在生活中尽好本分、活在当下（正念/心流/意义感）
    verdict: 支持
    original: ✅ 支持：全视频最坚实的论断（四大支柱稳健实证）
    evidence: Khoury 2013 meta（209项）：MBSR 焦虑 d=0.63、抑郁 d=0.59；A-Tjak 2015：ACT g=0.57；Sone 2008 队列 n=43,391：ikigai 与全因死亡率负相关（OR≈1.7，报告转述）
    sources:
    - Khoury et al. 2013 meta
    - A-Tjak 2015 meta
    - Sone et al. 2008
    - Csikszentmihalyi 1990
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3579857/
- theme: 彼得森整理房间三条法则
  category: 6_个人成长方法论/6.4_关系婚恋与形象
  report_file: 彼得森整理房间三条法则调研报告.md
  claims:
  - claim: 龙虾的胜负地位循环由血清素驱动（胜者5-HT升高、注射5-HT可让败者翻盘）
    verdict: 支持
    original: Kravitz 1980 龙虾血清素研究真实（基础神经科学高质量研究）
    evidence: Kravitz 团队 1980/1988 Science：注射5-HT→屈曲姿势、章鱼胺→伸展；胜者脑内5-HT浓度升高，效应在数周内自增强
    sources:
    - Livingstone et al. 1980 Science
    - Kravitz 1988/2000
    url: https://doi.org/10.1126/science.208.4439.76
  - claim: 龙虾的血清素-胜负循环可类比解释人类社会层级与'站直'法则
    verdict: 存疑
    original: ⚠️ 类比过度泛化被同行批评（龙虾成立，人类证据反向）
    evidence: 演化分异约5.5亿年、龙虾无真正大脑；人类 5-HT 与攻击性方向相反（5-HT↓→攻击↑）；Gonçalves 2018、PZ Myers、Kate Manne 系统性反驳
    sources:
    - Gonçalves 2018 (The Conversation)
    - PZ Myers 2018
    - Kate Manne 2018 (TLS)
    url: https://theconversation.com/psychologist-jordan-peterson-says-lobsters-help-to-explain-why-human-hierarchies-exist-do-they-90489
  - claim: 2分钟 power posing（笔直站立）能改变睾酮/皮质醇等激素水平
    verdict: 证伪
    original: ❌ 复验失败——2分钟 power posing 不能改变激素
    evidence: Ranehill 2015 预注册复验（200人）：激素效应不显著；Körner 2020 元分析：行为/激素效应不可复现；Simmons & Simonsohn 2017 p-curve：与'效应为零+选择性报告'无异
    sources:
    - Carney, Cuddy & Yap 2010（原研究）
    - Ranehill et al. 2015
    - Körner et al. 2020 元分析
    url: https://doi.org/10.1177/0956797616658563
  - claim: 扩张性姿势对主观'感到有权'有中等效应（作为行为提示可用）
    verdict: 部分支持
    original: 主观'感到有权'效应稳健（Gronau 2017 贝叶斯元分析）
    evidence: Gronau 2017 贝叶斯元分析：主观 felt power 效应稳健；Körner 2020：affective 效应部分可复现；报告结论：作为行为提示合理，作为神经科学论断站不住
    sources:
    - Gronau et al. 2017
    - Körner et al. 2020
    url: https://journals.sagepub.com/doi/full/10.1177/1745691620919358
  - claim: 像照顾负责的对象一样对待自己（公正待己/自我同情干预）可改善心理状态
    verdict: 支持
    original: ✅ 强支持（Rule 2 实证强度：强）
    evidence: Ferrari 2019 元分析：自我同情 micro-practice 效应量中到大；Kramer & Pascual-Leone 2016/2020：两椅对话干预自我鄙视前后测 d=0.80
    sources:
    - Neff 2003
    - Ferrari 2019 元分析
    - Kramer & Pascual-Leone 2016/2020
    - Gilbert 2009 CFT
    url: https://www.researchgate.net/publication/332539030_Self-compassion_interventions_and_caregiver_well-being_A_meta-analysis
  - claim: 自我鄙视（self-contempt）是独立于无望感的自杀意念预测因子
    verdict: 支持
    original: ✅ 强支持——Flett PSDM 三波纵向+自我鄙视独立预测自杀
    evidence: Rüsch 2019：self-contempt 在控制 hopelessness 后仍显著预测自杀意念；Flett PSDM 三波纵向：社会指定完美主义→反物质感→抑郁/自杀意念
    sources:
    - Rüsch et al. 2019
    - Flett PSDM 三波纵向
    url: https://doi.org/10.1002/capr.12307
  - claim: 整理房间/清洁行为能减弱压力反应
    verdict: 支持
    original: ✅ 中等支持——Lee 2025 直接实证
    evidence: Lee 2025 预注册研究（N=3,066，三国）：真实清洁与视觉模拟清洁都减弱压力反应；压力事件后用整理作为应对有生理恢复效应
    sources:
    - Lee et al. 2025
    - Bandura 1977
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11925691/
  - claim: 整洁环境促进健康选择、慷慨与执行控制
    verdict: 支持
    original: ✅（Vohs 2013；整洁环境证据较一致）
    evidence: Vohs 2013：整洁房间健康选择 67% vs 20%（苹果vs巧克力）、捐款金额2.5倍；McMains & Kastner 2011：杂乱视觉环境增加反应时、降低执行控制
    sources:
    - Vohs, Redden & Rahinel 2013
    - McMains & Kastner 2011
    - Zhong et al. 2015
    url: https://journals.sagepub.com/doi/10.1177/0956797613480186
  - claim: 凌乱环境能激发创造力
    verdict: 证伪
    original: ❌ Sio & Ormerod 2019 明确未能复制（样本量大2倍）
    evidence: Sio & Ormerod 2019：未能复制 Vohs 2013 '乱激发创造力'效应；报告结论：整洁对创造力证据不一致，对健康选择/慷慨/执行控制较一致
    sources:
    - Sio & Ormerod 2019
    - Vohs 2013（原研究）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6340966/
  - claim: '''整理房间''等微行动三法则可作为轻度迷茫者重塑自我的启动点'
    verdict: 支持
    original: ✅ 作为'启动点'——适合轻度迷茫者
    evidence: 机制栈：Bandura 1977 自我效能 + Amabile 2011 进步原理（12,000篇日记分析）+ Risko & Gilbert 2016 环境结构卸载工作记忆；预期真实效应 r≈0.10-0.30
    sources:
    - Bandura 1977
    - Amabile 2011
    - Risko & Gilbert 2016
    url: https://www.sciencedirect.com/science/article/abs/pii/S1053810015001221
  - claim: 三法则可作为完整人生哲学、替代结构化心理干预（ACT/MBCT 等）
    verdict: 证伪
    original: ❌ 作为'完整人生哲学'——过度承诺
    evidence: 重度抑郁、深度创伤、强迫症、物质成瘾人群不适配——整理房间是辅助而非治疗；报告建议三法则只当入门读物，真正改变需结构化干预
    sources:
    - 报告边界警示（不适配人群与配伍建议）
    url: ''
  - claim: 彼得森原书主张就是'整理房间三条法则'
    verdict: 证伪
    original: 原书是12章完整体系，无'三条法则'原说（中文传播严重简化）
    evidence: 《12 Rules for Life》2018 共12条；中文传播取第1+2+6条，跳过说真话、追求意义、精确说话等'反极端主义核心'；关键工具60%+被删
    sources:
    - Peterson 2018《12 Rules for Life》
    - 'Wikipedia: Jordan Peterson'
    url: https://en.wikipedia.org/wiki/Jordan_Peterson
  - claim: 微小行动的成功可通过自我效能循环撬动更大的行为改变
    verdict: 支持
    original: （科学栈：Bandura+Amabile+Wood 三循环）
    evidence: Bandura 1977：performance accomplishment 是自我效能最强来源；Wood 2002：行为重复→自动习惯→积极情绪→认知带宽扩展的三向循环
    sources:
    - Bandura 1977
    - Wood, Quinn & Kashy 2002
    url: https://dradamvolungis.com/wp-content/uploads/2011/06/self-efficacy-unifying-theory-of-behavioral-change-bandura-1977.pdf
- theme: 斯坦福人生设计21天四步法
  category: 6_个人成长方法论/6.4_关系婚恋与形象
  report_file: 斯坦福人生设计21天四步法调研报告.md
  claims:
  - claim: '''21天''可以完成人生设计四步法或养成一个习惯'
    verdict: 证伪
    original: ❌ 已被证伪（Maltz 1960 是轶事；Lally 2010 中位数66天）
    evidence: Maltz 1960 为整形科医生轶事（'a minimum of about'指心理适应非行为习惯）；Lally 2010（96人）：自动化中位数66天、全距18-254天；Singh 2024（N=2,601）：复杂行为106-154天
    sources:
    - Maltz 1960（UCL 考据）
    - Lally et al. 2010
    - Singh et al. 2024
    - Gardner, Lally & Wardle 2012
    url: https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674
  - claim: 21天不足以养成习惯，但作为'认知启动窗口'（承诺机制/仪式感）仍有心理价值
    verdict: 部分支持
    original: （启动仪式价值：承诺机制+仪式效应）
    evidence: Brooks 2016 JPSP 6项实验：仪式化动作显著提升自我纪律感；报告定位：启动注意力、积累首批数据，真效应 r≈0.10，不期望改变人生
    sources:
    - Brooks et al. 2016 JPSP
    url: ''
  - claim: '''人生仪表''四板块（健康-爱-工作-娱乐）自评有科学对应且健康值得独立成板块'
    verdict: 部分支持
    original: ✅ 部分支持（PERMA + Wheel of Life）
    evidence: 四板块与 Seligman PERMA 五要素部分对应；Khaw & Kern 2015 马来西亚样本：健康等维度在自由回答中评分高但不在5因素内，支持健康独立成板块
    sources:
    - Seligman 2011 PERMA
    - Khaw & Kern 2015
    - Butler & Kern 2016 PERMA-Profiler
    url: https://www.peggykern.org/uploads/5/6/6/7/56678211/khaw___kern_2015_-_a_cross-cultural_comparison_of_the_perma_model_of_well-being.pdf
  - claim: 每晚记录'三件好事'能持续提升幸福感（效应量如宣传所示）
    verdict: 部分支持
    original: ✅ 部分支持：效应存在但真实 r≈0.10，远小于宣传的 0.29
    evidence: Seligman 2005（N=411 随机对照）：1周练习效应持续至6个月；White 2019 重算：真实效应 r≈0.10；Gander 2013：2周版与安慰剂无差异；依从性是瓶颈
    sources:
    - Seligman et al. 2005
    - White, Uttl & Holder 2019
    - Gander et al. 2013
    url: https://doi.org/10.1037/0003-066x.60.5.410
  - claim: AEIOU 观察框架是斯坦福/IDEO 的发明
    verdict: 证伪
    original: ❌ 错误归功（Doblin 1991）
    evidence: AEIOU 由 Rick Robinson 等4人 1991 年在 Doblin 集团提出；Robinson 本人强调它是分类启发式（约80% MECE），与 IDEO/d.school 无直接发明关系
    sources:
    - Robinson et al. 1991 (Doblin)
    - Robinson 2015 EPIC 回忆录
    url: https://www.epicpeople.org/building-a-useful-research-tool/
  - claim: '''三种平行人生''推演（Odyssey Plan）有实证支撑且可预测长期职业转变'
    verdict: 部分支持
    original: ✅ 部分支持：博士论文级证据但无长期追踪
    evidence: 两篇斯坦福博士论文：职业构想能力提升、功能障碍性信念减少（统计显著）；但均为前测-后测设计，未追踪5-10年后真正转行者；对应 Schwartz 1991 情景规划
    sources:
    - Burnett & Evans 2016
    - Schwartz 1991
    url: https://www.penguinrandomhouseretail.com/book/?isbn=9781101875322
  - claim: Pre-mortem（事前验尸/逆向思维）显著降低对计划的过度自信
    verdict: 支持
    original: （Veinott 2010 实验：显著优于普通批评与利弊列表）
    evidence: Veinott, Klein & Wiggins 2010 控制实验：pre-mortem 组过度自信降幅显著大于'普通批评'和'利弊列表'；Morewedge 2015：情景模拟类方法最稳健持久；需心理安全（配 trusted partner）
    sources:
    - Klein 2007 HBR
    - Veinott, Klein & Wiggins 2010
    - Morewedge et al. 2015
    url: https://hbr.org/2007/09/performing-a-project-premortem
  - claim: 原型对话（信息性访谈）是经过 RCT 验证的有效工具
    verdict: 存疑
    original: 机制可信但直接 RCT 缺位（效应量未确认）
    evidence: 机制基于 Deutsch & Gerard 1955 信息性社会影响；但未找到直接检验其有效性的 RCT；冷邮件回复率仅20-30%，且存在幸存者偏差（只能见到还在干这行的人）
    sources:
    - Deutsch & Gerard 1955
    url: ''
  - claim: 短期职业体验（shadowing）能提升职业决策自我效能
    verdict: 支持
    original: （Onkst & Nice 2026 RCT：显著提升 p<.001）
    evidence: Onkst & Nice 2026 RCT（N=131，美国农村高中生）：career decision self-efficacy 显著提升（p<.001，d≈0.42）
    sources:
    - Onkst & Nice 2026 RCT
    url: https://doi.org/10.1080/21501378.2026.2660703
  - claim: 1-2天的短期 shadowing 可作为可靠的职业决策工具（短期体验≈长期生活）
    verdict: 证伪
    original: ❌ 不能当'决策工具'——career maturity 反而下降
    evidence: 同一 RCT：career maturity 反而下降（r=.39，p<.001）；短期体验≠长期生活（时间充裕度、责任构成不同），新鲜感光环会高估行业热情
    sources:
    - Onkst & Nice 2026 RCT
    url: https://doi.org/10.1080/21501378.2026.2660703
  - claim: PERMA 五要素幸福模型与主观幸福感高度重叠（潜在相关达0.98，是同一通道的不同测量）
    verdict: 支持
    original: （Goodman 2017：潜在相关0.98，Seligman 承认同一通道）
    evidence: Goodman, Disabato, Kashdan & Kauffman 2017（N=517）：PERMA-Profiler 与 SWB 潜在相关达 0.98；Seligman 据此承认两者同一通道，但 PERMA 在'建设 well-being'上更可操作
    sources:
    - Goodman et al. 2017
    - Butler & Kern 2016
    url: https://internationaljournalofwellbeing.org/index.php/ijow/article/view/526
  - claim: '''逆时针''实验证明一周环境/心理重置可显著逆转衰老与身心指标'
    verdict: 存疑
    original: 样本量仅8人；未做长期追踪；不能外推
    evidence: Langer 1979：8名70+男性在修道院'过一周1959年'，灵活性/视力/握力等改善优于控制组；但 Wiseman 指出自我暗示等可解释，不可外推到职业偏好重塑
    sources:
    - Langer 1979 counterclockwise
    - Wiseman（BBC 引述评论）
    url: https://d1ge0kk1l5kms0.cloudfront.net/images/G/01/randoEMS/COUNTERCLOCKWISE.pdf
  - claim: 视频'21天四步法'如实转述斯坦福原书《Designing Your Life》
    verdict: 证伪
    original: 营销化二次包装：严重压缩+时长虚标1.4-2.1倍
    evidence: 原书为11章完整体系（Odyssey Plan 不评级+4维 Dashboard 等关键规则丢失）；课程实为10周-1学年；'四步法+21天'无原书出处
    sources:
    - Burnett & Evans 2016《Designing Your Life》
    - Stanford Life Design Lab
    - d.school 历史
    url: https://readingraphics.com/book-summary-designing-your-life/
  - claim: 《The Art of Possibility》与 Schwartz 的 Shell 情景规划同源
    verdict: 证伪
    original: ❌ 误传（Zander 夫妻领导力/教练书）
    evidence: 《The Art of Possibility》(2000) 是 Zander 夫妻的可能性思维实践书；Schwartz 1991《The Art of the Long View》才是 Shell 情景规划开山之作，两者无作者或方法论继承关系
    sources:
    - Zander & Zander 2000
    - Schwartz 1991《The Art of the Long View》
    url: https://www.penguinrandomhouse.com/books/162919/the-art-of-the-long-view-by-peter-schwartz/
- theme: 灵魂伴侣七迹象与荣格心理学科学依据
  category: 6_个人成长方法论/6.4_关系婚恋与形象
  report_file: 灵魂伴侣七迹象与荣格心理学科学依据调研报告.md
  claims:
  - claim: 强烈吸引源于'图式激活+单纯曝光+投射'等心理机制；'灵魂共振'解释无实证
    verdict: 部分支持
    original: 🟡 部分支持+过度叙事化（红线：把'激活+投射'=灵魂共振）
    evidence: Bornstein 1989 元分析：单纯曝光效应 r=0.26；Westen 1998 SWAP-200（800+病人样本）：投射是临床可观察现象；'灵魂共振'作为解释无实证对应
    sources:
    - Bornstein 1989 元分析
    - Bruner 1957 激活模型
    - Westen 1998 SWAP-200
    url: ''
  - claim: 相信'命中注定'（destiny belief）与初始关系满意度正相关
    verdict: 支持
    original: （Knee 1998：与初始满意度 r=0.20-0.30）
    evidence: Knee 1998 JPSP：命运信念与初始满意度 r=0.20-0.30，并调节关系反应；Finkel 2007：destiny × 状态焦虑 β=-.16（与延迟原谅相关）
    sources:
    - Knee 1998 JPSP
    - Finkel 2007 JPSP
    url: ''
  - claim: 相信灵魂伴侣命中注定能让关系长期更稳定
    verdict: 证伪
    original: destiny 双高→关系下降最快（Gander 2024，2年追踪）
    evidence: Gander 2024 JSPR 2年追踪 N=904：destiny 信念双高组合的关系满意度下降最快（短期高满意度、长期低韧性）；成长信念使下降斜率减缓50%
    sources:
    - Gander 2024 JSPR
    - Knee 1998 JPSP
    url: ''
  - claim: 亲密关系中的强烈情绪唤醒会推动个体直面内在功课（依恋系统激活的现象真实存在）
    verdict: 支持
    original: 🟢 强支持（现象真实，'灵魂连结'叙事浪漫化）
    evidence: Hazan & Shaver 1987：浪漫爱=依恋模板投射（安全56%/回避24%/焦虑矛盾20%）；Lemche 2005 fMRI：不安全依恋者面对伴侣负面情绪杏仁核激活升高
    sources:
    - Bowlby 1969
    - Hazan & Shaver 1987
    - Mikulincer & Shaver 2007
    - Lemche 2005
    url: ''
  - claim: 反复的'亲密-疏远-再亲密'循环是'宇宙安排'或灵魂感应的证明
    verdict: 证伪
    original: 红线：把'依恋焦虑'=灵魂感应=浪漫化（不是爱，是焦虑）
    evidence: Hazan & Shaver 1987：焦虑-矛盾型（约20%人口）的典型表现即'亲密-疏远-再亲密'循环，机制是对被抛弃/不被爱的恐惧，非宇宙安排
    sources:
    - Hazan & Shaver 1987
    - West & Sheldon 1988
    url: ''
  - claim: 共时性（有意义巧合）是真实的非因果物理原理/宇宙指引信号
    verdict: 证伪
    original: 🔴 主体已被证伪（Bem 2011→Galak 2012 复制失败 d=0.04）
    evidence: Bem 2011 报告 psi 效应 d=0.42-0.65，后被指出方法学问题；Galak 2012 预注册严格复制 N=3,289：d=0.04 不显著；'巧合'可由注意力效应+确认偏误+大数定律解释
    sources:
    - Bem 2011 JPSP
    - Galak et al. 2012 复制研究
    - Ritchie 2012 批评
    - Hand 2014《The Improbability Principle》
    url: ''
  - claim: '''有意义巧合''作为主观体验普遍存在（现象学层面真实，华人''缘分''信念更强）'
    verdict: 支持
    original: （现象学真实：99% 人报告至少一次有意义巧合）
    evidence: Russo-Netzer & Icekson 2023 SAMD 量表（α=.81/.91）：99% 人报告至少一次；Goodwin & Findlay 1997：华人缘分信念显著强于英国（M=45.34 vs 37.16，p<.0001）
    sources:
    - Russo-Netzer & Icekson 2023
    - Goodwin & Findlay 1997
    url: ''
  - claim: '''对方让我强烈不舒服''可能源于自身未整合特质的投射（阴影投射机制可临床观察）'
    verdict: 支持
    original: 🟢 强支持（需区分健康投射 vs 病理投射性认同）
    evidence: Westen 1998 SWAP-200（800+病人样本）：投射是临床可观察现象；极端投射可能是边缘/自恋型人格征兆（Feldman 2014），健康整合与病理投射需区分
    sources:
    - Jung CW 7/9i
    - Westen 1998 SWAP-200
    - Byington 2009
    - Feldman 2014
    url: ''
  - claim: '''似曾相识/莫名熟悉''（时间折叠感）源于熟悉度错觉与隐性记忆，而非深层认出'
    verdict: 支持
    original: 🟡 部分支持——现象有认知机制解释（红线：=集体无意识是过度叙事化）
    evidence: Jacoby 1989 false fame 实验：虚假熟悉度制造'认出'感；Roediger 1995 DRM 范式：40-60% 被试'记得'从未呈现过的核心词（虚假记忆）
    sources:
    - Jacoby 1989
    - Roediger 1995 DRM
    - Brown 2001 隐性记忆综述
    url: ''
  - claim: '''集体无意识深层认出''是可检验的科学机制（阿尼玛/集体无意识可操作化）'
    verdict: 存疑
    original: '''集体无意识''作为科学命题未操作化（仅现象学描述有启发性）'
    evidence: 荣格集体无意识缺乏直接操作化；认知心理学 schema/脚本理论更接近但不等同；Eysenck 等批评实证不足；主流态度转向部分整合（Knox 2003 与依恋理论整合）
    sources:
    - Jung CW 9i
    - Knox 2003
    - Eysenck 1953/1985
    url: ''
  - claim: 健康的分离-重聚是依恋系统与个体发展的正常过程
    verdict: 支持
    original: 🟡 部分支持——分离-重聚本身是依恋正常循环（'宇宙安排'是浪漫化）
    evidence: West & Sheldon 1988：依恋系统含'抗议-绝望-分离'阶段，重聚是正常循环；Mahler 1975：分离-个体化是正常发展；Field 1999：持续连接是健康适应模式
    sources:
    - West & Sheldon 1988
    - Mahler 1975
    - Field 1999
    url: ''
  - claim: '''不再需要对方''（自主选择而非焦虑驱动）标志更健康的关系状态'
    verdict: 支持
    original: 🟢 强支持（SDT 自主+无条件自尊+ACT 价值行动）
    evidence: Ryan & Deci 2017：自主性与心理健康 r=0.45-0.55；Crocker & Wolfe 2001：外部条件性自尊导致自尊不稳定；ACT 对抑郁 SMD=-0.66（Wang 2025，13 RCT N=1,362）
    sources:
    - Deci & Ryan 2000/2017 (SDT)
    - Crocker & Wolfe 2001
    - Wang 2025 ACT 元分析
    url: ''
  - claim: 对人的痴迷感（执念）是爱的深度的证明
    verdict: 证伪
    original: 红线：痴迷型爱=可卡因渴求回路，不是爱的深度
    evidence: Bartels & Zeki 2000/2004 fMRI：浪漫爱激活 VTA+尾状核多巴胺奖赏回路；Fisher 2016：与可卡因渴求同源；Stead 2012：痴迷型爱伴杏仁核威胁反应激活
    sources:
    - Bartels & Zeki 2000/2004
    - Fisher 2004/2010/2016
    - Stead 2012
    - Acevedo 2011
    url: ''
  - claim: '''真指引推动成长清醒、执念强化幻想消耗''的鉴别框架方向正确'
    verdict: 支持
    original: 🟢 强支持（方向正确+简化版，缺神经科学/依恋/投资模型三层）
    evidence: 成长信念使关系下降斜率减缓50%（Gander 2024）；情绪粒度训练 d=0.50（Barrett 2004 GLA）；ACT 焦虑 g=0.52（Ferreira 2022）；MBCT 复发预防 HR=0.69（Kuyken 2016）
    sources:
    - Gander 2024
    - Barrett 2004
    - Ferreira 2022
    - Kuyken 2016
    url: ''
  - claim: '''推动内在完整''（个体化=整合对立面）有现代发展心理学的操作化对应'
    verdict: 支持
    original: 🟢 强支持（Loevinger+Vaillant+Kegan 三套独立证据线收敛）
    evidence: Loevinger 1976 ego development 9阶段（E7个体化=整合内在矛盾）；Vaillant Grant Study 60年追踪：防御成熟度与心理健康 r=0.65；后常规阶段仅≈10%成年人达到
    sources:
    - Loevinger 1976
    - Vaillant 1977/2002
    - Kegan 1982/2009
    - Cook-Greuter 1999
    url: ''
- theme: 男性颜值红利与形象管理
  category: 6_个人成长方法论/6.4_关系婚恋与形象
  report_file: 男性颜值红利与形象管理调研报告.md
  claims:
  - claim: 在简历与能力相同时，高颜值男性获得更多面试机会（有因果证据）
    verdict: 支持
    original: ✅（Deepfake 实验证实：面试邀请率+8.2%）
    evidence: Deepfake 实验 2024（N=493 招聘负责人）：换脸保持简历/能力一致，高颜值面试邀请率 +6.0%（男性 +8.2%）、能力评分 +0.36；只有男性持续从颜值获益
    sources:
    - Deepfake 实验 2024（N=493）
    - Hamermesh & Biddle 1994
    url: https://www.sciencedirect.com/science/article/pii/S0276562424001057
  - claim: 男性颜值红利比女性更强、更普适、更稳定
    verdict: 支持
    original: ✅（Nault 2020、Kukkonen 2024 两项综述一致确认）
    evidence: Nault et al. 2020 与 Kukkonen et al. 2024 两项综述一致：男性颜值红利比女性更普适、更稳定；Deepfake 实验中亦只有男性持续获益
    sources:
    - Nault et al. 2020
    - Kukkonen et al. 2024
    url: https://link.springer.com/chapter/10.1007/978-3-032-08035-6_10
  - claim: 颜值'把关'能力信息的加工优先级：同样的能力，高颜值者被'看见'更多（能力放大器）
    verdict: 支持
    original: ✅（ERP 2025：P200/LPP 增强）
    evidence: ERP 神经研究 2025：高颜值条件下能力信息获得更多注意资源（P200/LPP 增强）——颜值吸引注意力、能力承接注意力，两者相乘产生曝光与机会
    sources:
    - ERP 研究 2025（MDPI）
    url: https://www.mdpi.com/2076-328X/15/8/1130
  - claim: 颜值溢价集中在客户接触型岗位，数据/技术岗无优势
    verdict: 支持
    original: ✅（Stinebrickner 2019 证实客户岗颜值溢价）
    evidence: Stinebrickner et al. 2019：颜值在客户接触型岗位有溢价，数据/技术岗无优势——形象投入应集中在面试、对外沟通、关键汇报等高权重场景
    sources:
    - Stinebrickner et al. 2019
    url: ''
  - claim: '''男人靠实力就行，颜值在职场无用'''
    verdict: 证伪
    original: 误区①：错——颜值是能力放大器
    evidence: Hamermesh & Biddle 1994：颜值高者薪酬更高、更易被雇佣（外貌溢价奠基研究）；Deepfake 2024（N=493）因果证据：简历相同时高颜值男性邀请率 +8.2%
    sources:
    - Hamermesh & Biddle 1994
    - Deepfake 实验 2024（N=493）
    url: https://www.sciencedirect.com/science/article/pii/S0276562424001057
  - claim: 颜值单出（无能力承接）是风险敞口：花瓶标签、预期落差惩罚与竞争排斥
    verdict: 支持
    original: ✅（Heilman 1979 + 竞争情境歧视 2015）
    evidence: Heilman & Saruwatari 1979：能力导向岗位高颜值可能不利（Beauty Penalty：颜值拉高能力预期，不匹配时落差惩罚更重）；Andreoni & Petrie 2008：高颜值者犯错被更严厉惩罚
    sources:
    - Heilman & Saruwatari 1979
    - 竞争情境歧视研究 2015（4项研究）
    - Andreoni & Petrie 2008
    url: https://www.sciencedirect.com/science/article/abs/pii/S0749597815000096
  - claim: 形象红利的约80%来自可后天管理的基础形象（干净、得体、精神），而非天生五官
    verdict: 部分支持
    original: ✅ 核心洞察（但'80%'为报告归纳数字、无直接文献出处）
    evidence: 修饰×着装一致性研究 2022（3组样本）：一致性显著影响可雇佣性，感知胜任力是中介；'80%'具体比例无文献出处，方向有据、数字存疑
    sources:
    - 修饰×着装一致性研究 2022（I J of Selection and Assessment）
    url: https://doi.org/10.1111/ijsa.12399
  - claim: 职场吸引力的目标应是可打造的'职业氛围感'：整洁+得体+精神的一致性传递专业信号
    verdict: 支持
    original: ✅（一致性→感知胜任力→可雇佣性）
    evidence: 2022 研究：grooming 与着装风格的一致性传递'自我管理能力强、认真、靠谱'信号（邋遢+名牌=错位信号）；投入产出排序：整洁>得体穿搭>体态>健身
    sources:
    - 修饰×着装一致性研究 2022
    url: https://doi.org/10.1111/ijsa.12399
  - claim: 出众外形在婚恋与社交中带来更多选择权、包容度与更低社交门槛
    verdict: 支持
    original: ✅（首因效应+光环效应）
    evidence: 报告对比总结判 ✅：婚恋选择权与社交门槛降低由首因效应+光环效应解释；与 Hamermesh & Biddle 1994 外貌溢价同源
    sources:
    - Hamermesh & Biddle 1994
    - 光环效应/首因效应经典研究
    url: ''
  - claim: 颜值红利可替代长期关系与职业发展中的性格、价值观与能力
    verdict: 证伪
    original: 边界：颜值是'入场券'不是'全部'——长期关系靠性格、价值观、能力
    evidence: 报告边界：第一印象权重>长期评价会反转；颜值单出遭 Beauty Penalty 与反噬（Heilman 1979；Andreoni & Petrie 2008）；内外兼修才是长期竞争力
    sources:
    - Heilman & Saruwatari 1979
    - Andreoni & Petrie 2008
    url: https://www.sciencedirect.com/science/article/abs/pii/S0749597815000096
- theme: 内在年轻态的科学依据
  category: 6_个人成长方法论/6.5_健康与身体
  report_file: 内在年轻态的科学依据调研报告.md
  claims:
  - claim: 对社区居民，累积压力会加速表观遗传年龄（GrimAge），而情绪调节能力强可显著缓冲这一加速
    verdict: 支持
    original: 证据最硬（强）
    evidence: 2021 Transl Psychiatry 社区样本（N=444）：压力×情绪调节交互显著（p=8.82e-4），情绪调节能力抵消压力的表观遗传年龄加速。
    sources:
    - Transl Psychiatry 2021（N=444 社区样本）
    url: https://www.nature.com/articles/s41398-021-01735-7
  - claim: 对成年人，气质性乐观水平高者寿命更长、慢性炎症水平更低
    verdict: 支持
    original: 强（多队列+纵向+CTRA）
    evidence: PNAS 2019（N≈70,000+）：最高乐观四分位寿命长11-15%；CTRA 2018（N=114）高乐观者炎症基因表达低约12.5%；DETECT（N=6,890）乐观预测1年与4年后更低CRP。
    sources:
    - PNAS 2019 乐观-寿命研究
    - CTRA 2018 日本工人研究
    - DETECT 纵向研究
    url: https://www.pnas.org/doi/abs/10.1073/pnas.1900712116
  - claim: 主观年轻感（自我感知年龄）与更健康的衰老结局和更长寿命相关，且伴随更慢的表观遗传加速（观察性）
    verdict: 支持
    original: 关联稳健但效应小
    evidence: 2023元分析（99篇文章/107项纵向研究）：主观老化显著预测健康长寿 LR=1.347；2021 HRS（N=2,253）：自感更老者 PhenoAge 加速，经自评健康与CRP中介。
    sources:
    - 2023 主观老化-健康元分析（PMC10192139）
    - HRS 2021（N=2,253）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10192139/
  - claim: 正念/冥想干预与更长端粒相关（g=0.23），但对普通人群的短程干预效果不确定
    verdict: 部分支持
    original: 证据中等但受偏倚限制
    evidence: 2023元分析：正念干预对端粒长度小到中等效应（g=0.23），主要由长期冥想者病例对照驱动、存在发表偏倚；短程干预对普通人不确定。
    sources:
    - 2023 正念-端粒元分析
    url: https://link.springer.com/article/10.1007/s12671-023-02075-x
  - claim: '''不执着/平等心''等特质能直接延缓生物年龄（因果层面）'
    verdict: 存疑
    original: 因果链尚未建立
    evidence: 多为横断面/中介模型，缺乏随机干预与硬终点；不执着元分析（2022, Clin Psychol Rev）仅覆盖心理层面结局。
    sources:
    - 不执着元分析 2022（Clin Psychol Rev）
    url: https://pubmed.ncbi.nlm.nih.gov/35690041/
  - claim: 静息心率变异性（HRV）低的人全因死亡风险更高
    verdict: 支持
    original: 大样本荟萃支撑（中-强）
    evidence: 2022 HRV-死亡荟萃（32项研究、N=38,008）：最低HRV四分位全因死亡 HR=1.56。
    sources:
    - 2022 HRV-死亡荟萃分析
    url: https://www.sciencedirect.com/science/article/abs/pii/S0149763422003967
  - claim: 低HRV是宿命的体质特征（不可通过生活方式改变）
    verdict: 证伪
    original: 遗传预测HRV与死亡无关
    evidence: UK Biobank 2023（表型N=54,312）：表型低HRV与死亡相关，但遗传预测的HRV与死亡无关——HRV反映可改变的生活方式与环境。
    sources:
    - UK Biobank 2023
    url: https://www.nature.com/articles/s42003-023-05376-y
  - claim: 亲近自然（自然联结、绿地接触）与更低的心理困扰相关，但前瞻性证据与皮质醇效应尚不一致
    verdict: 部分支持
    original: 中-强（绿地-皮质醇异质）
    evidence: Sci Rep 2021（18国、N=16,307）：自然联结与绿地访问关联更低心理困扰；但绿地-皮质醇综述异质性大，波兰纵向（N=261）未复现前瞻预测。
    sources:
    - Sci Rep 2021 自然联结研究（18国）
    - 绿地-皮质醇范围综述 2021
    - 波兰纵向研究 2023（N=261）
    url: https://www.nature.com/articles/s41598-021-87675-0
  - claim: 每天几分钟深慢呼吸可即刻提升副交感-迷走张力（HF-HRV）并降低焦虑
    verdict: 支持
    original: 单次即有效
    evidence: Sci Rep 2021：单次5分钟深慢呼吸即显著提升 HF-HRV 并降低焦虑。
    sources:
    - Sci Rep 2021 深慢呼吸研究
    url: https://www.nature.com/articles/s41598-021-98736-9
  - claim: 人生目的感高者早死风险低约30%（观察性，调整健康行为后明显减弱）
    verdict: 部分支持
    original: 本组最强证据；但调整后明显减弱
    evidence: 2026元分析（25样本/488,765人/最长32年）：HR=0.76；更长随访或纳入健康指标后大幅衰减，反向因果可能。ikigai队列（N=71,501）一致。
    sources:
    - Psychological Medicine 2026 目的感-死亡率元分析
    - ikigai 队列 2022（N=71,501）
    - medRxiv 2022 反向因果分析
    url: https://www.cambridge.org/core/journals/psychological-medicine/article/purpose-in-life-and-mortality-a-metaanalysis-of-the-published-literature-and-individualparticipant-data-of-488765-participants-followed-for-up-to-32-years/4B36E59E83FE5FE28586DBC859DF42C4
  - claim: 主动宽恕干预能降低未宽恕感并改善抑郁与焦虑（RCT因果证据）
    verdict: 支持
    original: RCT 因果等级高（强）
    evidence: 2024 REACH 宽恕工作簿多中心RCT（4,598人、5国）：2周后未宽恕显著降低（SMD=-0.53），抑郁焦虑亦降。
    sources:
    - REACH 宽恕RCT 2024（BMJ Public Health）
    url: https://bmjpublichealth.bmj.com/content/2/1/e000072
  - claim: 接纳训练可降低急性应激下的皮质醇与血压反应性（RCT证据）
    verdict: 支持
    original: RCT 机制清晰（强）
    evidence: 接纳训练RCT（2018, N=153）：接纳成分降低急性应激下的皮质醇与血压反应性。
    sources:
    - 接纳-应激反应RCT 2018（N=153）
    url: https://pubmed.ncbi.nlm.nih.gov/29040891/
  - claim: 利他/助人行为能显著提升幸福感并大幅降低死亡风险
    verdict: 部分支持
    original: 有获益但效应温和且看动机
    evidence: 亲社会-幸福感元分析（N=198,213）仅 r=0.13；志愿服务≥100小时/年死亡风险低44%但有阈值效应与健康者选择偏倚；仅利他动机者获益。
    sources:
    - Curry et al. 2020 亲社会-幸福感元分析
    - HRS 志愿服务研究 2020
    url: https://pubmed.ncbi.nlm.nih.gov/32881540/
  - claim: '''放下/冥想能抗炎''——这类干预可改善健康人群的炎症标志物'
    verdict: 证伪
    original: 大RCT多为空结果
    evidence: 两项预注册RCT对CRP为空结果，仅在炎症高风险亚组有探索性益处；健康人群不能泛称'放下/冥想能抗炎'。
    sources:
    - 正念/接纳-炎症预注册RCT（两项）
    url: ''
  - claim: '''老灵魂/轮回/能量充电/由内而外的光''等灵性表述是可被科学检验的物理量'
    verdict: 证伪
    original: ❌ 不可证伪
    evidence: 无可观测、可重复检验的实证对象，属灵性隐喻；科学只能验证其背后的意义感、利他、宽恕等心理行为变量。
    sources: []
    url: ''
- theme: 最健康睡眠时间科学依据
  category: 6_个人成长方法论/6.5_健康与身体
  report_file: 最健康睡眠时间科学依据调研报告.md
  claims:
  - claim: 健康成年人推荐每晚睡 7-9 小时，65 岁及以上推荐 7-8 小时
    verdict: 支持
    original: 🔍 已验证
    evidence: NSF 2015 官方共识：成人 7-9h、老年 7-8h；AASM 2015 共识只设下限'成人 ≥7h'，明确拒绝一刀切的'8 小时'口径
    sources:
    - NSF 2015
    - AASM 2015
    url: https://www.sleephealthjournal.org/article/s2352-7218(15)00015-7/fulltext
  - claim: 长期睡眠不足 6 小时与死亡、心血管、代谢、免疫、痴呆风险升高相关（健康成人）
    verdict: 支持
    original: 🔍
    evidence: Cappuccio 2010 元分析 n=1,382,999：短睡全因死亡 RR 1.12、冠心病 RR 1.48；Prather 2015 实验：睡眠<6h 者感冒风险 OR 4.50
    sources:
    - Cappuccio et al. 2010
    - Prather et al. 2015
    - Sabia et al. 2021
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2864873/
  - claim: 睡眠时长与全因死亡率呈 U 型关联，群体均值谷底约在 7 小时，而非'睡得越多越好'或'必须 8 小时'
    verdict: 支持
    original: 🔍（谷底钟点 ⚠️）
    evidence: Cappuccio 2010 元分析：短睡 RR 1.12、长睡 RR 1.30；Kripke 2002（110 万人）与日本 JACC 两个队列（各约 10 万人）谷底均为 7 小时
    sources:
    - Cappuccio et al. 2010
    - Kripke et al. 2002
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2864873/
  - claim: 入睡时间与心血管风险呈 U 型：22:00-22:59 入睡者风险最低，晚于 0 点或早于 22 点均升高（中老年人群，观察性证据）
    verdict: 部分支持
    original: 🔍 ⚠️ 单一观察性研究，精确钟点不宜过度解读
    evidence: Nikbakhtian & Plans 2021：UK Biobank 88,026 人加速度计+5.7 年随访，22:00-22:59 组 CVD 发生率最低 2.79%；≥00:00 HR 1.25、<22:00 HR 1.24
    sources:
    - Nikbakhtian & Plans 2021
    url: https://academic.oup.com/ehjdh/article/2/4/658/6423198
  - claim: 睡眠规律性（就寝/起床时间稳定）对全因死亡与心血管风险的预测力强于睡眠时长（中老年队列）
    verdict: 支持
    original: 🔍
    evidence: Windred 2023：UK Biobank 60,977 人，规律性最高组全因死亡低 20-48% 且预测力强于时长；Chaput 2024：时长达标无法抵消不规律风险 HR 1.19
    sources:
    - Windred et al. 2023
    - Cribb et al. 2023
    - Chaput et al. 2024
    - Yiallourou et al. 2024
    url: https://doi.org/10.1093/sleep/zsad253
  - claim: 只要总睡眠时长够，几点睡都可以（入睡钟点不影响健康）
    verdict: 证伪
    original: ❌
    evidence: Scheer 2009 PNAS 受控实验：等睡眠量下节律错位使瘦素 -17%、血糖 +6%；Leproult 2014：同等睡眠量下错位使胰岛素抵抗升幅翻倍
    sources:
    - Scheer et al. 2009
    - Leproult et al. 2014
    - Morris et al. 2015
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2657421/
  - claim: 肝脏只在凌晨 1-3 点'排毒'，不睡肝脏就无法排毒
    verdict: 证伪
    original: ❌
    evidence: 肝脏 CYP450 三相解毒 24 小时连续、由底物驱动，无'排毒时段'；中医专家澄清这是对子午流注（经气盛衰）的现代扭曲
    sources:
    - 科普中国·科学辟谣
    - Nature Rev Gastroenterol Hepatol 2016
    url: https://www.nature.com/articles/nrgastro.2016.8
  - claim: 早睡对肝脏有益，机制是昼夜节律对齐而非'按时排毒'；偶尔晚睡不会让肝脏'错过班次'
    verdict: 部分支持
    original: 🟡
    evidence: 肝脏约 10% 转录组有节律性表达，2024 年 MIT 在原代人肝细胞证实自主昼夜振荡——真实图景是'连续工作+节律性效率波动'
    sources:
    - Nature Rev Gastroenterol Hepatol 2016
    - MIT 2024
    url: https://www.nature.com/articles/nrgastro.2016.8
  - claim: 多相睡眠（如每天只睡 2 小时的分段睡眠）能替代整段睡眠且不影响健康
    verdict: 证伪
    original: ❌
    evidence: NSF 共识综述：无任何益处证据；Rosenblumm 2024：Uberman 方案 10 人中 9 人三周内退出，坚持者生长激素分泌被抑制 >95%
    sources:
    - NSF 多相睡眠共识综述 2021
    - Rosenblumm et al. 2024
    url: https://pubmed.ncbi.nlm.nih.gov/33795195/
  - claim: 睡眠以约 90 分钟为周期循环，按 90 分钟倍数安排睡眠可精确卡点、睡得更聪明
    verdict: 部分支持
    original: 🟡 过度简化
    evidence: Cajochen 2023 实测 6,064 个周期：中位 96 分钟、范围约 60-150 分钟且逐夜波动——周期真实存在但无法精确卡点，'倍数睡更聪明'属营销
    sources:
    - Cajochen et al. 2023
    - StatPearls 2023
    url: https://eprints.soton.ac.uk/502837/1/1-s2.0-S2352721823002048-main.pdf
  - claim: 周末补觉能缓解急性睡眠不足带来的困倦（效果短暂）
    verdict: 部分支持
    original: 🟡 能缓解急性困倦（短暂）
    evidence: 报告裁决：周末补觉'能缓解急性困倦（短暂）'；Depner 2019 住院 RCT 同时显示其无法防止代谢紊乱
    sources:
    - Depner et al. 2019
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12798825/
  - claim: 周末补觉能还清睡眠债、弥补长期睡眠不足造成的代谢损害
    verdict: 证伪
    original: 🟡 还不了代谢的债
    evidence: Depner 2019 住院 2 周随机对照：周末补觉组全身胰岛素敏感度反降 27%，肝/肌敏感度下降仅见于补觉组，褪黑素相位延迟 1.2-1.7h
    sources:
    - Depner et al. 2019
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12798825/
  - claim: 生长激素固定在 23 点-凌晨 2 点分泌最旺，必须在此钟点前熟睡才不浪费
    verdict: 证伪
    original: ⚠️ 对经典生理学的通俗化误读
    evidence: Takahashi 1968 直接证明 GH 主峰锚定'入睡后首个慢波睡眠'而非固定钟点，入睡推迟则峰值平移；夜班者 24h 总量不变
    sources:
    - Takahashi et al. 1968
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC297368/
  - claim: 睡前喝酒有助入眠、改善睡眠质量
    verdict: 证伪
    original: 🔍（Ebrahim 2013 系统综述）
    evidence: Ebrahim 2013 系统综述：全剂量酒精缩短入睡潜伏期但破坏 REM 与后半夜睡眠结构，整体损害睡眠质量
    sources:
    - Ebrahim et al. 2013
    url: https://doi.org/10.1111/acer.12006
  - claim: 入睡前 6 小时摄入 400mg 咖啡因仍会客观减少睡眠 1 小时以上，且本人主观无感（健康成人）
    verdict: 支持
    original: 🔍
    evidence: Drake 2013：咖啡因半衰期均值 5h（1.5-9.5h）；400mg 睡前 6h 仍客观减睡 >1h 且主观无感——建议末杯不晚于入睡前 8 小时
    sources:
    - Drake et al. 2013
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807/
- theme: 相由心生
  category: 6_个人成长方法论/6.5_健康与身体
  report_file: 相由心生调研报告.md
  claims:
  - claim: 面部照片判断的'感知年龄'是独立于实际年龄的死亡预测因子
    verdict: 支持
    original: ✅ 强支持
    evidence: Christensen 2009 BMJ 丹麦双胞胎队列（LSADT 1826 人）：校正实际年龄与性别后感知年龄仍稳健预测死亡，且与白细胞端粒长度相关。
    sources:
    - Christensen 2009 BMJ
    url: https://www.bmj.com/content/339/bmj.b5262
  - claim: 慢性心理压力通过皮质醇信号直接损伤皮肤（纹理上升、胶原下调）
    verdict: 支持
    original: ✅ 强支持
    evidence: De Tollenaere 2024：中度慢性压力者皮肤微观纹理严重度升 32.9%；体外皮质醇显著下调 I/III 型胶原 mRNA；GR 抑制剂 RU486 可逆转该抑制。
    sources:
    - De Tollenaere 2024 PMC11743297
    - Chae 2021 IJMS
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11743297/
  - claim: 他人能在 100 毫秒内对你的状态形成特质判断，30 秒判断与数分钟观察无显著差异
    verdict: 支持
    original: ✅ 强支持
    evidence: Ambady & Rosenthal 1992 元分析（38 项研究）总体 r=.39；Willis & Todorov 2006：100ms 曝光已足够形成特质判断，更长时间主要增加信心而非改变判断。
    sources:
    - Ambady & Rosenthal 1992 Psychol Bull
    - Willis & Todorov 2006 Psychol Sci
    url: https://journals.sagepub.com/doi/10.1111/j.1467-9280.2006.01750.x
  - claim: 亲社会行为（善良）改善健康与寿命，且有剂量窗口（约每月 2-15 小时）
    verdict: 支持
    original: ✅ 强支持
    evidence: Post 2021 PNAS（MIDUS 6325 人 23 年随访）：给予-接受平衡者全因死亡率最低，>15 小时/月反增风险；Nakamura 2023（HRS 9662 人）：每年≥100 小时帮助他人 4 年死亡风险降 32%。
    sources:
    - Post 2021 PNAS
    - Nakamura 2023 Ann Behav Med
    url: https://www.pnas.org/doi/10.1073/pnas.2024770118
  - claim: 行善的分子层面回报必须指向'具体他人'，对世界或对自己行善无此效应
    verdict: 支持
    original: ✅ 强支持
    evidence: Nelson-Coffey 2017 RCT（N=159）：仅'对具体他人行善'组 CTRA 促炎基因表达显著下调，对世界/对自己行善组无显著变化；Regan 2022（N=182）重复验证。
    sources:
    - Nelson-Coffey 2017 Psychoneuroendocrinology
    - Regan 2022
    url: https://www.sciencedirect.com/science/article/abs/pii/S0306453016310587
  - claim: 童年自控力可预测数十年后的健康、财富与犯罪 outcomes
    verdict: 支持
    original: ✅ 强支持
    evidence: Moffitt 2011 PNAS Dunedin 队列（N=1037，30 年随访）：3-11 岁自控力跨梯度预测依赖、代谢异常、炎症、财务与犯罪，控制 IQ 与家庭背景后仍显著；自控力还调节压力→胰岛素抵抗链。
    sources:
    - Moffitt 2011 PNAS
    - Friedman Terman 队列 1993
    url: https://www.pnas.org/doi/10.1073/pnas.1010076108
  - claim: 偏爱独处、内心宁静有益身心（关键变量是自主选择，孤独则有害）
    verdict: 部分支持
    original: ⚠️ 支持但有边界
    evidence: Coplan 2019 Aloneliness（4 研究 N=2407）：对独处渴求低者独处越多越抑郁；Hawkley & Cacioppo 2010：孤独经 CTRA 同等机制提高促炎基因表达与心血管风险。
    sources:
    - Coplan 2019 PAID
    - Hawkley & Cacioppo 2010
    url: https://doi.org/10.1016/j.paid.2019.05.020
  - claim: 高情绪粒度（精确命名情绪）可降低应激下的主观痛苦
    verdict: 支持
    original: ✅（四维代理均有实证）
    evidence: 2023 研究（PMC10247597）：高负性情绪粒度者在 Trier 社会应激中负性高唤醒情绪更少（β=-.15）且主观更可控；机制为前额叶对边缘系统的实际调控。
    sources:
    - Kashdan/Barrett/McKnight 2015
    - PMC10247597 2023
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10247597/
  - claim: 反刍思维会升高炎症指标（IL-6、TNF-α、CRP）
    verdict: 支持
    original: ✅ 因果方向更可靠
    evidence: 2022 scoping review（13 项研究）：实验性诱发反刍的研究一致显示 IL-6、TNF-α、CRP 升高，因果方向（反刍→炎症）比相关研究更可靠；Epel 2009 指反刍延长 HPA 唤醒。
    sources:
    - PMC8957598 2022 scoping review
    - Epel 2009 Ann NY Acad Sci
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8957598/
  - claim: 累积压力会加速表观遗传时钟（GrimAge），情绪调节能力可显著缓冲
    verdict: 支持
    original: ✅
    evidence: 2021 Transl Psychiatry（N=444）：累积压力与 GrimAge 加速正相关（P=0.0388），低情绪调节者的加速效应是其他人的数倍（p=8.82e-4）；UK Biobank 2024 提示 HPA 轴变化可能可逆。
    sources:
    - Transl Psychiatry 2021 PMC8627511
    - UK Biobank 2024 BMC Medicine
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8627511/
  - claim: 长期心理压力会加速端粒缩短（相当于提前衰老约 9-17 年）
    verdict: 支持
    original: ✅（奠基性研究）
    evidence: Epel & Blackburn 2004 PNAS：高压力照护者外周血单核细胞端粒缩短 550bp，约等于提前衰老 9-17 年；机制为 HPA 唤醒→皮质醇+氧化应激→端粒酶活性降低。
    sources:
    - Epel & Blackburn 2004 PNAS
    url: https://www.pnas.org/doi/10.1073/pnas.0407162101
  - claim: 慈心冥想（LKM）与端粒保护相关，且优于一般正念
    verdict: 支持
    original: ✅
    evidence: Hoge 2013：长期 LKM 女性端粒显著长于对照；Le Nguyen 2019 12 周 RCT：LKM 组端粒损耗显著低于对照，纯正念组与对照无差异——效应关键在'朝向他人'。
    sources:
    - Hoge 2013 Brain Behav Immun
    - Le Nguyen 2019 Psychoneuroendocrinology
    url: https://doi.org/10.1016/j.bbi.2013.04.005
  - claim: 8 周正念训练（每天约 22 分钟）可使杏仁核体积显著缩小
    verdict: 支持
    original: ✅ 最小有效剂量
    evidence: Kral 2022 Science Advances：8 周 MBSR + 每日 22 分钟练习→右杏仁核体积显著缩小；Valk 2017：3 个月以上持续冥想者前额叶与前扣带回皮层增厚。
    sources:
    - Kral 2022 Science Advances
    - Valk 2017 Science Advances
    url: https://n.yam.com/Article/20260822563503
  - claim: 面相、手相、占星可用于预测个人命运
    verdict: 证伪
    original: 零证据/无法超越随机
    evidence: 占星双盲实验（Wyman & Vyse 2008）：受试者无法在真实与虚假星盘间识别自己的；手相被列为伪科学；fWHR 仅群体相关，个体预测力低。
    sources:
    - Wyman & Vyse 2008 J Gen Psychol
    - Britannica Pseudoscience
    url: https://doi.org/10.3200/genp.135.3.287-300
  - claim: 中医望诊部分可验证，但'五色对应五脏'的特定颜色映射（青=肝、赤=心）未获双盲支持
    verdict: 存疑
    original: 部分可验证（红外热像、皮肤微循环）
    evidence: 红外热成像面诊可客观化面部温差（李洪娟 2012；望诊仪 2017 结直肠组大肠区温差 P<0.05）；但五色-五脏特定映射双盲未达统计显著，'望神'无法客观量化。
    sources:
    - 李洪娟 2012 红外热成像研究
    - 《黄帝内经》望诊仪 2017 临床
    url: https://www.hanspub.org/journal/paperinformation?paperid=21083
- theme: 线粒体与能量
  category: 6_个人成长方法论/6.5_健康与身体
  report_file: 线粒体与能量-Martin-Picard-视频核验-主报告.md
  claims:
  - claim: Martin Picard 是哥伦比亚大学（CUIMC）线粒体精神生物学领域的代表学者
    verdict: 支持
    original: ✅
    evidence: CUIMC 行为医学教授、Picard Lab 负责人；代表作 MitoBrainMap（Nature 2025）、mitochondrial allostatic load（Nat Rev Endocrinol 2014）。
    sources:
    - Columbia University Irving Medical Center
    - Picard Lab
    url: https://www.columbiapsychiatry.org/profile/martin-picard-phd
  - claim: 线粒体是'微型大脑'，能决定身体进入修复还是防御模式（Picard 原话）
    verdict: 部分支持
    original: 🟡 二次创作
    evidence: Picard 原话为 orchestrators/tiny transformers/portal，从未用 micro-brain；但 cf-mtDNA、GDF15 应激信号通路真实存在，'修复 vs 防御'对应 EC 模型 GMR 挤压。
    sources:
    - Picard 2014 Nat Rev Endocrinol
    - EC model 2025 OSF preprint
    - Quanta 2026 专访
    url: https://www.quantamagazine.org/martin-picards-mitochondrial-theory-of-mind-20260717/
  - claim: 人体约有 5000 万亿个线粒体，平均每个细胞约 1000 个
    verdict: 证伪
    original: 🟡 数量级偏
    evidence: Lane 估算人体约 10^16 个（低一个数量级）；红细胞 0 个、卵细胞可达 10 万，'每细胞 1000'仅对肝/心肌成立，2024 综述称其为误导性简化。
    sources:
    - Nick Lane《Power, Sex, Suicide》
    - PMC10883508 2024 综述
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10883508/
  - claim: 白发与皱纹是能量被应激挤占后的衰老输出（能量竞争参与白发）
    verdict: 部分支持
    original: 🟡 包装夸张
    evidence: EC 模型（2025）支持有限能量预算下 GMR 被挤压；Rosenberg 2021 eLife 证明压力性白发部分可逆且毛囊上调能量代谢蛋白；皱纹与线粒体因果链弱，'最后的多米诺'是修辞。
    sources:
    - Rosenberg et al. 2021 eLife
    - Behnke/Picard/Pontzer EC model 2025
    url: https://elifesciences.org/articles/67437
  - claim: 运动可经 AMPK-SIRT1-PGC-1α 通路倒逼线粒体新生
    verdict: 支持
    original: ✅
    evidence: 耐力运动激活 AMPK→PGC-1α 驱动线粒体新生；Abrego-Guandique 2025 meta：PGC-1α 升高 g=1.17（I²=84.5% 人群差异大）；'更多=更好'是过度简化。
    sources:
    - Abrego-Guandique 2025 meta
    - Drake 2016 Annual Review of Physiology
    url: https://doi.org/10.1515/bmc-2025-0055
  - claim: 每天 20 分钟温和快走就够，且温和运动优于 HIIT
    verdict: 部分支持
    original: 🟡
    evidence: WHO 建议成人每周 150-300 分钟中等强度（约 21-43 分/天），20 分/天略低于下限但有效；Maturana 2021（55 RCT）：HIIT 在 VO2max 略优（d=0.40），MICT 在 HbA1c 略优。
    sources:
    - WHO 2020 身体活动指南
    - Maturana 2021 MSSE
    - Bellicha 2023 Sports Medicine
    url: https://doi.org/10.1249/mss.0000000000002506
  - claim: 慢性疲劳/康复人群也适用'每天 20 分钟温和快走'的普适方案
    verdict: 证伪
    original: ❌ 误导
    evidence: NICE NG206（2021）明确反对对 ME/CFS 患者做固定增量运动（GET），可能触发运动后不适（PEM）；长新冠/心衰/肿瘤康复需个体化处方。
    sources:
    - NICE NG206 2021
    - Cochrane CD003331
    url: https://www.nice.org.uk/guidance/ng206/chapter/recommendations
  - claim: 适度饥饿能在人体内可靠启动 mitophagy（线粒体自噬）
    verdict: 部分支持
    original: 🟡
    evidence: AMPK→mTORC1 抑制→自噬及 PINK1-Parkin 通路在动物/细胞证据充分；人体直接证据弱，禁食时长无共识（常用 16:8、5:2）。
    sources:
    - Storoschuk 2024 AMPK 综述
    - Mattson 2022 IF/TRE 综述
    url: ''
  - claim: 生理性饥饿与情绪性进食由两套可区分的神经系统驱动
    verdict: 支持
    original: ✅
    evidence: 下丘脑 homeostatic 系统（AgRP/NPY-POMC）与 VTA-NAc hedonic 奖赏系统分离；ghrelin 可直接激活奖赏通路（Edvardsson 2021 等）。
    sources:
    - Edvardsson 2021
    - Cornejo 2018
    - Heberden 2023
    url: https://pubmed.ncbi.nlm.nih.gov/33737011/
  - claim: 营养过剩是现代人慢性疲劳的主因
    verdict: 部分支持
    original: 🟡 部分对
    evidence: 缺铁仍是常见病因（特别是女性）：Vaucher 2012、Verdon 2003 RCT 显示补铁改善非贫血女性疲劳；高糖高脂饮食人体因果 RCT 少，B12/镁证据弱。
    sources:
    - Vaucher 2012 CMAJ
    - Verdon 2003 BMJ
    - Markun 2021 综述
    url: https://doi.org/10.1503/cmaj.110950
  - claim: 短期过量进食会即时损伤人体骨骼肌线粒体功能
    verdict: 存疑
    original: 🟡 动物证据强，人体复杂
    evidence: 高脂饮食损伤动物线粒体证据大量；但 Toledo 2018（Diabetologia）实测健康人增重 7.7kg 后骨骼肌线粒体功能与 ROS 无显著变化。
    sources:
    - Toledo 2018 Diabetologia
    url: https://pubmed.ncbi.nlm.nih.gov/29150696/
  - claim: 限时进食（TRE/轻断食）相比单纯热量限制有额外减重优势
    verdict: 证伪
    original: 并无显著减重优势
    evidence: Liu 2022 NEJM 12 个月 RCT：TRE+CR 相比单纯 CR 无显著减重优势；高质量 RCT 显示 IF 优势多来源于热量赤字本身，时间窗单独效应小。
    sources:
    - Liu 2022 NEJM
    - Manoogian 2024 Ann Intern Med
    - Guo 2024 JAMA Netw Open
    url: https://doi.org/10.1056/NEJMoa2114833
  - claim: 关系好=线粒体储能、消耗型关系=漏电（直接因果）
    verdict: 证伪
    original: ❌ 源滥用
    evidence: Picard 只证明急性心理应激升高 cf-mtDNA（Trumpff 2019）等双向通路，未做'关系质量→人体线粒体功能'研究；落地指标是 allostatic load 而非 ATP。
    sources:
    - Trumpff 2019
    - Picard & Sandi 2021 Neurosci Biobehav Rev
    url: https://pubmed.ncbi.nlm.nih.gov/32637466/
  - claim: 社会关系质量影响健康与死亡风险
    verdict: 支持
    original: 强证据
    evidence: Holt-Lunstad 2010（PLoS Med，148 项研究、308,849 人）：社会关系对死亡风险 OR=1.50，效应与吸烟、肥胖相当；'储能/漏电'仅是隐喻。
    sources:
    - Holt-Lunstad 2010 PLoS Med
    - Hostinar & Gunnar 2013
    url: https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1000316
  - claim: 疲惫/失眠/胸闷是身体在'提醒'情绪问题（躯体化机制）
    verdict: 支持
    original: ✅
    evidence: 对应躯体化症状障碍（SSD）：Schnabel 2022 指情绪调节紊乱是 SSD 关键病因；CBT meta 同时改善躯体症状（g=-0.89）与情绪调节（g=1.50）；与 Picard 线粒体研究不在同一证据链。
    sources:
    - Kirmayer 1998 Psychosom Med
    - Schnabel 2022 Clin Psychol Rev
    - Wakif 2026 meta
    url: https://pubmed.ncbi.nlm.nih.gov/9710287/
- theme: 未来十年财富管理科学依据
  category: 6_个人成长方法论/6.6_财富与道德
  report_file: 未来十年财富管理科学依据调研报告.md
  claims:
  - claim: 房产年化回报约为6%
    verdict: 部分支持
    original: 🟡 需修正：'6%'是杠杆后+一线+2006-2016段的复合数
    evidence: 美国Case-Shiller 2000-2026 +232%（约5%名义CAGR）；中国一线2006-2024累计+550%+、三四线+200%；杠杆后一线黄金期IRR 12-15%、2016-2026平台期甚至负收益——须分段/分地区/分杠杆看
    sources:
    - Case-Shiller指数
    - 国家统计局房价数据
    url: ''
  - claim: 消费品牌已完全无法区分车主/用户的财富水平（消费主义彻底失效）
    verdict: 部分支持
    original: 🟡 区分度大幅下降但'无法'是夸张
    evidence: 特斯拉2025起售价下探至19.9万，71%车主家庭年入<50万——信号区分度大降但未消失，信号载体从物质转向数字品味（Veblen炫耀性消费的数字转型）
    sources:
    - 特斯拉销量与车主数据
    - Veblen 1899《有闲阶级论》
    url: ''
  - claim: '''铁饭碗''竞争白热化、性价比下降'
    verdict: 支持
    original: 🟢 基本属实
    evidence: 2024国考303.3万报考/3.96万招录，平均报录比77:1（视频'100:1'为热门岗位修辞），极端岗位21,258:1（西藏阿里邮政局）；2026估91:1
    sources:
    - 国家公务员局2024报考数据
    url: ''
  - claim: 高学历因扩招而贬值（学历通胀）
    verdict: 支持
    original: 🟢 基本属实
    evidence: 2024高等教育毛入学率60.80%、2026毕业生1,270万；Jones, Kaya & Nan 2024（IZA）：中国毕业生过度教育率30-40%、起薪低15-25%
    sources:
    - 教育部统计公报
    - Jones, Kaya & Nan 2024, IZA
    url: ''
  - claim: 中国低利率环境下把钱存在银行'躺平'跑不赢通胀
    verdict: 部分支持
    original: 🟡 中国情境完全成立，美国2023-2024不成立（须分段）
    evidence: 中国2026年1年期定存约1.30% vs 2020-2026累计CPI 5.5%；但美联储2023-2024利率峰值5.33%时'低利率陷阱'不存在
    sources:
    - 中国人民银行存款利率
    - 国家统计局CPI
    - 美联储FEDFUNDS
    url: ''
  - claim: 黄金缺乏现金流且历史上曾深度回撤（超70%），古董等另类资产流动性差，不宜视为稳赚的核心资产
    verdict: 支持
    original: 🟢 基本属实
    evidence: 1980-2002金价$850→$250（-70.6%，历史最大回撤）；2011-2015 $1,900→$1,050（-44.7%）；中国一二线商铺空置率12-15%；古董艺术品变现折扣30-60%
    sources:
    - World Gold Council历史金价
    - 中国商铺空置率数据
    url: ''
  - claim: 长期（10-20年）主动型基金大多能跑赢指数，主动选基金优于买宽指基金
    verdict: 证伪
    original: 🟢（视频方向正确：SPIVA显示主动基金跑输率85-95%）
    evidence: SPIVA 2024：10/15/20年期主动基金跑输指数比例85-95%；标普500 1928-2024年化约10%（实际约7%）；沪深300 2005-2024年化约8%
    sources:
    - SPIVA 2024 (S&P Dow Jones Indices)
