- theme: 努力改变命运的科学依据
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 努力改变命运的科学依据调研报告.md
  claims:
  - claim: '''1962年美国同卵双胞胎乐器研究''查无出处，系MISTRA（1979-1996）与Ericsson万小时研究的嫁接误引'
    verdict: 证伪
    original: ⚠️ 视频溯源有误（🔴 红框1）
    evidence: PubMed/Scholar查无1962年出处；最可能为Bouchard等MISTRA（1979-1996）+ Ericsson 1993柏林音乐学院练习时间研究（非双胞胎设计）
    sources:
    - Ericsson et al. 1993
    url: ''
  - claim: 人类行为性状平均遗传度约49%，但非共享环境占30-60%——努力不是纯天生特质，可塑窗口真实存在
    verdict: 部分支持
    original: 🟡 h²≈30-50% 但可塑
    evidence: Polderman 2015元分析（2,748篇/17,804性状/约1456万对双胞胎）：平均h²≈49%；Turkheimer三定律：E占30-60%，是努力的可塑窗口
    sources:
    - Polderman et al. 2015
    - Turkheimer 2000
    url: https://doi.org/10.1038/ng.3285
  - claim: '''天赋决定一切，努力无用''的全称化躺平论不成立：非遗传因素解释30-60%变异'
    verdict: 证伪
    original: 🔴 红框3——Turkheimer 三定律反驳纯遗传决定
    evidence: Turkheimer第三定律：相当部分变异归于E（30-60%）；Watts 2018棉花糖实验复制显示自控-成功简单叙事被削弱
    sources:
    - Turkheimer 2000
    - Watts, Duncan & Quan 2018
    url: ''
  - claim: '''一切皆可努力/努力万能''的全称化努力论不成立：遗传度约49%划定可行域，出身预决约40%'
    verdict: 证伪
    original: 🔴 红框2——纯努力崇拜是全称化错
    evidence: h²≈49%（Polderman 2015）划定可行域；阶级IGE≈0.4意味着约40%由出身预决（Chetty）；正确模型是努力×制度×运气三因子
    sources:
    - Polderman et al. 2015
    - Chetty et al. 2014
    url: https://doi.org/10.1038/ng.3285
  - claim: grit（毅力）对成功的独立预测力有限：与尽责性几乎重合（r≈0.84-0.90），解释率不足4%
    verdict: 存疑
    original: 🟡 复制争议（红框9：grit ≈ conscientiousness 子集）
    evidence: Credé 2018网络分析：grit与尽责性r≈0.84-0.90无法分离；Rimfeld 2016（TEDS N=4,642）：grit h²≈37%且与尽责性遗传相关rg≈0.86；Duckworth 2016自承解释率<4%
    sources:
    - Credé 2018
    - Rimfeld et al. 2016
    url: https://doi.org/10.1016/j.intell.2016.09.003
  - claim: meritocracy（精英制）信念越强的国家客观流动性反而越低——高不平等催生强信念的合法性机制而非努力回报更高
    verdict: 支持
    original: ✅ 强支持（红框5：显著负相关，27 国数据）
    evidence: Mijs 2018（ISSP 25年数据）：不平等越严重民众越信'成功靠努力'（system justification）；美国呈'强信念+低客观流动'的流动性迷思
    sources:
    - Mijs 2018
    url: https://doi.org/10.1093/ser/mwy051
  - claim: '''北欧高福利=自动高流动''是错误简化：丹麦教育流动低于美国，优势来自早期儿童投资'
    verdict: 证伪
    original: 🔴 错误简化（红框7）
    evidence: Landersø & Heckman 2016：丹麦收入流动高于美国（IGE 0.15 vs 0.34）但教育流动更低；高流动机制是0-3岁早期儿童投资而非福利自动机制
    sources:
    - Landersø & Heckman 2016
    url: https://doi.org/10.1111/sjoe.12219
  - claim: 早期儿童投资回报最高：0-3岁每1美元投入年化回报7-13%，6岁后ROI急剧下降
    verdict: 支持
    original: Heckman 反复论证——0-3 岁是 ROI 最高的窗口期
    evidence: Heckman技能形成模型：0-3岁1美元→7-13%年化回报，3-6岁→5-10%，6岁后急剧下降，成人培训ROI常为负
    sources:
    - Heckman
    - Landersø & Heckman 2016
    url: https://doi.org/10.1111/sjoe.12219
  - claim: 代际收入弹性显示父母收入显著预测子女收入：北欧IGE≈0.15-0.20，美国≈0.34-0.50，中国≈0.50-0.60
    verdict: 支持
    original: OECD 2018 + Chetty 2014 实证
    evidence: Chetty 2014（N≈4000万IRS子女-父母配对）：美国rank-rank≈0.34、地理差距4倍；OECD 2018《Broken Social Elevator》26国：北欧最低、美英意最高
    sources:
    - Chetty et al. 2014
    - OECD 2018
    url: https://doi.org/10.1093/qje/qju022
  - claim: 成功=天赋×机遇（运气）获强支持：练习与绩效相关仅r≈0.4，远低于'1万小时'叙事的近必然性
    verdict: 支持
    original: ✅ 强支持（Simonton + Chetty + Milanovic）
    evidence: Howe 1999反驳Ericsson：练习-绩效r≈0.4；Simonton 1991：创造性产出巅峰年龄因领域而异（数学20岁vs文学40+）；Chetty：出身预决约40%
    sources:
    - Howe 1999
    - Simonton 1991
    - Chetty et al. 2014
    url: ''
  - claim: 自我服务归因偏差（成功归己、失败归外）是跨情境稳定的普遍认知偏差
    verdict: 支持
    original: 普通人最普遍的认知偏差之一
    evidence: Campbell & Sedikides 1998（226项研究）：归因偏差是跨情境稳定的自我保护机制；Mezulis 2004（95项研究meta）：学业成功自利归因d=0.34、失败外部化d≈0.31
    sources:
    - Campbell & Sedikides 1998
    - Mezulis et al. 2004
    url: https://doi.org/10.1037/0033-2909.124.2.197
  - claim: 经典棉花糖实验的'自控力决定未来'效应在控制家庭背景后大幅缩小
    verdict: 支持
    original: Watts 2018 棉花糖复制（用于反驳全称化躺平论）
    evidence: Watts, Duncan & Quan 2018复制研究：控制家庭背景后棉花糖延迟效应大幅缩小，效应量远小于原始研究
    sources:
    - Watts, Duncan & Quan 2018
    url: ''
  - claim: 家庭社会经济地位调节遗传表达：低SES环境中遗传对认知能力的效应被压缩
    verdict: 支持
    original: 低 SES 家庭中，遗传效应被压缩
    evidence: Engelhardt et al. 2019（Texas Twin Project N=1,728）：SES（家长/学校/社区）解释IQ共享环境的100%、言语/阅读的79%；高SES中基因表达更充分
    sources:
    - Engelhardt et al. 2019
    url: https://doi.org/10.1007/s10519-019-09962-7
  - claim: '''成功靠努力''是普世信念但分化明显：北欧约38%、美国约60%、东亚约73%同意，meritocracy并非美式例外'
    verdict: 部分支持
    original: 🟡 普世但分化（⚠️ 2016 欧洲调查待溯源）
    evidence: WVS Wave 7 + ISSP：北美60%、北欧38%、东亚73%同意'成功靠努力'；'2016年欧洲人不信努力'的精确调查来源待溯源
    sources:
    - WVS Wave 7
    - Mijs 2018
    url: https://www.worldvaluessurvey.org/
  - claim: '''精英制（meritocracy）=公平''不成立：仅满足形式机会平等，且把市场结果道德化为个人应得'
    verdict: 证伪
    original: 🔴 红框4 + ✅ 强支持（meritocracy 批判）
    evidence: Rawls 1971：天赋是社会共同资产，需公平机会平等（FEO）与差别原则；Sandel 2020三大批判：社会分裂、精英傲慢、技术治国
    sources:
    - Rawls 1971
    - Sandel 2020
    url: https://doi.org/10.2307/j.ctv1254v2v
- theme: 大脑可塑性科学依据
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 大脑可塑性科学依据调研报告.md
  claims:
  - claim: 成年大脑仍可被训练结构性改变：训练可扩张皮层代表区、增加灰质（教科书级强证据）
    verdict: 支持
    original: 证据强度强（成人神经发生部分争议）
    evidence: Jenkins & Merzenich 1990：行为训练数周即重组成年猴皮层；Maguire 2000（n=16司机）：后部海马灰质更大且与从业年数正相关；Draganski 2004（n=24）：3个月杂耍灰质扩张
    sources:
    - Jenkins & Merzenich 1990
    - Maguire et al. 2000
    - Draganski 2004
    url: https://www.pnas.org/doi/10.1073/pnas.070039597
  - claim: 训练带来的结构增益会随停练部分回落，'技能一旦学会永不遗忘'不成立，需维持性练习
    verdict: 支持
    original: ★★（'技能难以遗忘'要打折）
    evidence: Draganski 2004：杂耍灰质增益停练3个月回落（原文自称transient）；Raffin & Siebner 2018：1周固定手指即削弱既有技能与皮层代表
    sources:
    - Draganski 2004
    - Raffin & Siebner 2018
    url: https://doi.org/10.1038/427311a
  - claim: '''伦敦出租车司机海马体更活跃''的归类与解读有误：原始发现是后部海马体积更大（结构性），且专业化有学习代价'
    verdict: 证伪
    original: ★★★ 最重要的内容性偏差（归类错位）
    evidence: Maguire 2000测得后部海马灰质体积更大（VBM），Boyd原文将其列于结构性段落；Maguire 2006：司机习得新空间信息能力劣于公交司机，代价被传播省略
    sources:
    - Maguire et al. 2000
    - Maguire et al. 2006
    url: https://www.pnas.org/doi/10.1073/pnas.070039597
  - claim: 长期记忆靠间隔重复而非考前突击：最优间隔回忆成绩提升64%（d=1.1），且72%的人误以为突击更有效
    verdict: 支持
    original: 强（百年历史 + 317 实验元分析）
    evidence: Cepeda 2006元分析（184篇/317实验）：271组直接比较仅12组间隔无益；Cepeda 2008（n>1350）：最优间隔回忆+64%；Kornell 2009：72%被试误以为集中学习更有效
    sources:
    - Cepeda et al. 2006
    - Cepeda et al. 2008
    - Kornell 2009
    url: https://pubmed.ncbi.nlm.nih.gov/16719566/
  - claim: '''智力无上限所以相信就能逆袭''是证据越级：成长型思维干预对普通学生学业效应接近零（d=0.08）'
    verdict: 证伪
    original: 干预效应弱（群体层面强 / 干预效应弱）
    evidence: Sisk 2018两大元分析：关联k=273 N=365,915仅r=.10；干预k=43 N=57,155 d=0.08（一般教育干预d≈0.57）；Yeager 2019（N=12,490）：低成就学生GPA仅+0.1
    sources:
    - Sisk et al. 2018
    - Yeager et al. 2019
    url: https://doi.org/10.1177/0956797617739704
  - claim: 成长型思维干预对弱势学生（低SES/高学业风险）有小幅正向效应（d≈0.19-0.34）
    verdict: 部分支持
    original: 亚组分析：低社会经济地位学生 d=0.34、高学术风险学生 d=0.19
    evidence: Sisk 2018亚组：低SES学生d=0.34、高学术风险学生d=0.19；Yeager 2019（N=12,490）：约1小时在线干预使低成就学生GPA小幅提升，效应依赖学校同伴规范
    sources:
    - Sisk et al. 2018
    - Yeager et al. 2019
    url: https://www.nature.com/articles/s41586-019-1466-y
  - claim: 静息时大脑并非停机：默认模式网络维持基线活动，大脑以约20%的全身能耗持续运转
    verdict: 支持
    original: 强（三个误区中证据最扎实）
    evidence: Raichle 2001：发现DMN静息基线活动；Raichle & Gusnard 2002：大脑占体重约2%却耗约20%氧气与热量，且跨精神状态 remarkably constant
    sources:
    - Raichle et al. 2001
    - Raichle & Gusnard 2002
    url: https://www.pnas.org/doi/10.1073/pnas.98.2.676
  - claim: 睡眠巩固记忆：睡眠中神经活动重放白天经验，第一夜睡眠即带来约20%的技能速度增益
    verdict: 支持
    original: 有硬证据（'学完就睡'）
    evidence: Wilson & McNaughton 1994：大鼠慢波睡眠中位置细胞按白天相同顺序重放；Walker 2002/2003：一夜睡眠+20%速度增益，加倍练习量不改变该增益
    sources:
    - Wilson & McNaughton 1994
    - Walker 2002
    url: https://www.science.org/doi/10.1126/science.8036517
  - claim: 习惯自动性形成中位约66天（全距18-254天，复杂行为106-154天），'21天/X天习惯法则'无科学依据
    verdict: 支持
    original: 任何'X 天养成习惯'的单一数字都无科学依据
    evidence: Lally 2010（N=96，12周日记）：95%自动性中位66天、漏做一天无实质影响；Singh 2024系统综述（20项纵向研究n=2,601）：简单行为59-66天、复杂行为106-154天
    sources:
    - Lally et al. 2010
    - Singh 2024
    url: https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674
  - claim: if-then执行意图（若情境Y则做X）是低成本习惯工具（d=0.65），优于'强迫自己'的意志路径
    verdict: 支持
    original: 执行意图强（d=0.65）/'意志强迫'路径无元分析支持
    evidence: Gollwitzer & Sheeran 2006元分析（94项独立检验）：if-then计划d=0.65（中-大效应）；'强迫'一词并非Boyd演讲原话
    sources:
    - Gollwitzer & Sheeran 2006
    url: https://doi.org/10.1016/s0065-2601(06)38002-1
  - claim: '''练够一万小时就能精通''确属过度简化：刻意练习解释表现方差有限（音乐21%、体育18%、教育4%、职业<1%）'
    verdict: 证伪
    original: 争议未决，但'练够一万小时就能精通'确属过度简化
    evidence: Macnamara 2014元分析（88项研究）；Macnamara & Maitra 2019预注册复制Ericsson原研究失败；1万小时是Gladwell对Ericsson的简化，Ericsson本人否认'魔力数字'
    sources:
    - Macnamara 2014
    - Macnamara & Maitra 2019
    url: https://doi.org/10.1098/rsos.190327
  - claim: '''放弃好习惯会导致大脑能力退化''在健康人群中证据薄弱，属过度推论的恐惧叙事'
    verdict: 存疑
    original: ★★（健康人群证据薄弱）——勿用恐惧叙事自我鞭策
    evidence: 支持证据主要来自临床/动物模型（剥夺致代表区萎缩、习得性失用）；健康成人日常行为的用进废退神经影像证据薄弱；慢性疼痛类证据已有反例（Gustin 2012）
    sources:
    - Gustin et al. 2012
    url: ''
  - claim: 成人海马能否长出新神经元在学界仍未决：Sorrells 2018几乎检不出 vs Boldrini 2018等结论相反，不宜当定论引用
    verdict: 存疑
    original: ★★（争议未决）
    evidence: Sorrells 2018（n=17+12标本）：成人齿状回几乎检不出新神经元；Boldrini 2018/Moreno-Jiménez 2019：健康者至90岁仍有数千未成熟神经元；分歧在组织固定方法
    sources:
    - Sorrells et al. 2018
    - Boldrini et al. 2018
    url: https://www.nature.com/articles/nature25975
  - claim: 单次tDCS经颅脑刺激对健康成人认知无可靠增益：59项认知结局分析无一显著
    verdict: 证伪
    original: '''脑刺激定制升级''不可信'
    evidence: Horvath 2015系统综述：59项认知结局分析中无一显著；'阳极易化'效应在认知任务中的出现率仅0.16
    sources:
    - Horvath et al. 2015
    url: https://pubmed.ncbi.nlm.nih.gov/25701175/
  - claim: 重复行为会形成纹状体习惯回路（控制权向背外侧纹状体转移），但前额叶存在'皮层闸门'，固化不等于不可逆
    verdict: 支持
    original: 成瘾强 / 习惯化强（负面可塑性证据分层）
    evidence: Graybiel 2008：重复行为在基底节被打包为单一单元；Yin & Knowlton 2006：习惯形成=控制权从DMS向DLS转移；Smith & Graybiel 2013：前额叶边缘下区可逐试验决定是否以习惯方式执行
    sources:
    - Graybiel 2008
    - Yin & Knowlton 2006
    - Smith & Graybiel 2013
    url: https://doi.org/10.1146/annurev.neuro.29.051605.112851
- theme: 普通人利润视角训练
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 普通人利润视角训练调研报告.md
  claims:
  - claim: 普通人与商人的财富认知差距主要是练习量差距而非智力差距：利润直觉=可被刻意练习训练的专家直觉
    verdict: 支持
    original: 完全成立，且有充分科学依据（可行性 ✅）
    evidence: Ericsson 1993：专家表现源于大量有反馈的刻意练习；Klein 1993 RPD：专家快速决策=领域经验模式识别；JBR研究（N=302定价经理）：直觉正向影响新产品定价表现
    sources:
    - Ericsson et al. 1993
    - Klein 1993
    url: ''
  - claim: 五类利润视角训练（利润感知/缺口扫描/买单逻辑/流向追踪/判断输出）均有方法论与科学锚点
    verdict: 支持
    original: 五类训练全部有科学锚点（可行性 ✅）
    evidence: 缺口扫描=精益创业Problem Interview+Intuit Follow-Me-Home；买单逻辑=心理账户/心理所有权/身份认同；流向追踪=清崎现金流定义；判断输出=生成效应+反馈闭环
    sources:
    - Ericsson et al. 1993
    - Prelec & Loewenstein 1998
    url: ''
  - claim: 思维训练本身不等于赚钱：变现需要'30秒判断+小规模验证+真实利润反馈'闭环，并警惕时间成本与合规风险
    verdict: 部分支持
    original: 唯一需要修正的点：训练 ≠ 赚钱
    evidence: 训练建立的是发现机会的眼睛；验证标准为10个陌生人愿付费/复购；时薪低于主业时副业是'用命换钱'；食品类需健康证/经营许可
    sources: []
    url: ''
  - claim: 消费者只感知总价不拆成本结构，'支付痛苦'驱动消费决策（心理账户双重记账）
    verdict: 支持
    original: 科学依据（Prelec & Loewenstein）
    evidence: Prelec & Loewenstein 1998：心理账户双重记账，先付后享与先享后付的快乐/痛苦配比不同；消费者被支付痛苦驱动，只感知总价不拆结构
    sources:
    - Prelec & Loewenstein 1998
    url: ''
  - claim: 心理所有权（拥有感）会提升对物品的估值与溢价支付意愿
    verdict: 支持
    original: 科学依据（Bootstrap 验证路径显著）
    evidence: 产地-心理所有权-感知质量路径显著（Bootstrap验证）：拥有感提升估值→溢价支付意愿；购买也是身份认同与自我表达
    sources: []
    url: ''
  - claim: 用户付费动机不止功能价值，还包括身份认同、情绪价值、便利溢价、社交货币、损失厌恶五类
    verdict: 支持
    original: 六大付费动机模型（科学依据：心理账户/心理所有权/身份认同）
    evidence: 用户买的不是产品而是产品带来的结果/感受；心理所有权与身份认同研究支持为'成为某种人'付费；具体效应量未系统量化
    sources:
    - Prelec & Loewenstein 1998
    url: ''
  - claim: '''同样成本下情绪价值定价可高10倍''的具体倍数无直接文献支撑，属经验性说法'
    verdict: 存疑
    original: 核心领悟（同样成本，情绪价值定价可高 10 倍）
    evidence: 身份认同/情绪价值支持溢价方向有依据（心理所有权路径显著），但'高10倍'为报告经验性表述，无引文与效应量
    sources: []
    url: ''
  - claim: 蹲守观察+行为证据（Problem Interview/Follow-Me-Home）是发现真实需求的有效方法：付费行为才是真需求
    verdict: 支持
    original: ⭐⭐⭐⭐⭐（落地价值最高）
    evidence: 精益创业Problem Interview：问行为不问假设（多久一次/现在怎么应对/花了多少钱）；Intuit Follow-Me-Home：用户说的≠做的，行为证据>口头声明
    sources: []
    url: ''
  - claim: 零成本/低成本副业有大量实证案例：2026年报道显示启动成本普遍低于1000元（代扔垃圾月入8000+等）
    verdict: 支持
    original: 落地案例 ✅（36氪实证）
    evidence: 36氪2026深度报道：仓库热饭月增收近4000元（0元）、广州代扔垃圾月入8000+（50元启动）、教老人用手机月入5000+（0元）等
    sources: []
    url: ''
  - claim: '''图近、图方便、图省事''类琐碎需求是大公司看不上、年轻人嫌琐碎、普通人可接住的空白市场'
    verdict: 部分支持
    original: 共性规律（案例归纳）
    evidence: 6个2026年案例的共性归纳：门槛不是资金而是'靠谱+耐心'；属媒体案例归纳而非系统研究，外推需谨慎
    sources: []
    url: ''
  - claim: 按现金流定义（是否帮你赚钱），自住房与家用车多为负债而非资产：持有成本造成月度净流出
    verdict: 支持
    original: 关键认知升级（清崎现金流定义）
    evidence: 清崎现金流定义：北京800万自住房月净流出约1.7万、20万家用车月持有成本约5000元；判断标准看是否帮赚钱，不看价格
    sources:
    - Kiyosaki 1997
    url: ''
- theme: 破四相科学依据
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 破四相科学依据调研报告.md
  claims:
  - claim: 把念头/评价/情绪当成事实的'认知融合'与'认知解离'是独立可测的成熟心理构念
    verdict: 支持
    original: ✅ 强支持
    evidence: Bernstein 2015 综述提出元觉知-去认同-反应性降低三元模型；CFQ 量表 α=.89-.93，单维度跨文化验证
    sources:
    - Bernstein et al. 2015 Perspectives on Psychological Science
    - Gillanders et al. 2014 Behavior Therapy (CFQ 量表)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5103165/
  - claim: ACT 接纳承诺疗法降低抑郁并提升心理灵活性，且不通过改变念头内容起效
    verdict: 支持
    original: ✅ 强支持
    evidence: Wang 2025 BMC Psychiatry meta：13 RCT N=1362，抑郁 SMD=-0.66、心理灵活性 SMD=+0.50，自动念头改变 g=-0.28 不显著
    sources:
    - Wang et al. 2025 BMC Psychiatry
    url: ''
  - claim: MBCT 正念认知疗法可预防抑郁复发
    verdict: 支持
    original: ✅ 强支持
    evidence: Kuyken 2016 JAMA Psychiatry：1258 例个体患者数据 meta，MBCT 复发风险 HR=0.69（vs 无 MBCT）
    sources:
    - Kuyken et al. 2016 JAMA Psychiatry
    url: ''
  - claim: 反刍思维与抑郁焦虑等心理病理强相关，是各情绪调节策略中风险最高的
    verdict: 支持
    original: ✅ 强支持
    evidence: Aldao 2010 元分析（241 效应量、114 研究）：反刍-病理 r=.49，临床样本达 r=.87，为六策略中最高
    sources:
    - Aldao, Nolen-Hoeksema & Schweizer 2010 Clinical Psychology Review
    url: ''
  - claim: 缓解期患者被负性情绪诱发的'认知反应性'升高可独立预测抑郁复发
    verdict: 支持
    original: ✅（临床随访证据）
    evidence: Segal 2006：99 名缓解期患者 18 个月随访，认知反应性每升 1 个标准差复发风险增 42%（HR=1.42）
    sources:
    - Segal et al. 2006 Archives of General Psychiatry
    url: ''
  - claim: 把情绪用语言说出（affect labeling）能降低杏仁核反应、缓解情绪
    verdict: 部分支持
    original: ⚠️ 部分支持（存在实验室偏倚）
    evidence: Lieberman 2007 fMRI 首证 RVLPFC-杏仁核通路；Rizk Wahba 2025 meta pooled g=-0.43，但独立实验室 g=-0.13 不显著，效应集中于 UCLA 系实验室
    sources:
    - Lieberman et al. 2007 Psychological Science
    - Rizk Wahba 2025 affect labeling meta（OSF preprint）
    url: ''
  - claim: '''情绪内耗=意志力/能量被耗竭''（自我损耗 ego depletion）不成立，应改为注意力被情绪捕获与优先级替换'
    verdict: 证伪
    original: ❌ 已证伪（本调研最强红线）
    evidence: Hagger 2016 多实验室预注册复制（23 实验室 N=2141）：效应 d=0.04，95%CI[-0.07,0.15] 跨零；Inzlicht & Berkman 2015 提出动机-注意替代模型
    sources:
    - Hagger et al. 2016 注册复制报告
    - Inzlicht & Berkman 2015
    url: ''
  - claim: 成长心态干预能让普通学生成绩显著提升、'改变命运'
    verdict: 证伪
    original: ⚠️ 严格 meta d=0.02 不显著（效应量塌缩约 33 倍）
    evidence: Macnamara & Burgoyne 2022（63 研究 N=97,672）：高质量研究 d=0.02 不显著；Sisk 2018 meta（约 36.6 万学生）d=0.08
    sources:
    - Macnamara & Burgoyne 2022 Psychological Science
    - Sisk et al. 2018 Psychological Science
    url: ''
  - claim: 成长心态干预对处境不利学生在支持性学校环境中仍有小效应
    verdict: 部分支持
    original: ⚠️ 小到中效应保留（非万能解药）
    evidence: Yeager 2019 Nature：12,000+ 处境不利 9 年级学生 d=0.11、GPA+0.10；早期 Blackwell 2007 d=0.66 被认为受发表偏差与商业利益放大
    sources:
    - Yeager et al. 2019 Nature
    url: ''
  - claim: 认知解离对应 DMN 去激活与三网络切换，长期正念训练可解耦叙事自我网络
    verdict: 支持
    original: ✅ 强支持
    evidence: Brewer 2011 PNAS：禅修者 mPFC/PCC 去激活；Farb 2007：8 周训练组 insula-mPFC 连接 R=0.609→0.056；Hasenkamp 2012 界定三网络四阶段
    sources:
    - Brewer et al. 2011 PNAS
    - Farb et al. 2007 SCAN
    - Hasenkamp & Barsalou 2012 Frontiers
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3250176/
  - claim: 把伴侣负面行为归因于'关系整体差'（RDA）的归因习惯与关系质量/满意度相关
    verdict: 支持
    original: ✅ 强支持
    evidence: Hoyt 2005 综述（28 项研究）：关系归因-行为平均相关 r=.34；REA（情境化归因）习惯越强的伴侣关系满意度越高
    sources:
    - Hoyt et al. 2005 关系归因 meta
    - Holtzworth-Munroe & Jacobson 1985
    url: ''
  - claim: 肥胖与幸福感会在社会网络中'传染'，孤独/不快乐是网络结构产物而非单纯个人失败
    verdict: 支持
    original: ✅ 强支持
    evidence: Christakis & Fowler 2007 NEJM（12,067 人 32 年随访）：朋友肥胖使风险+57%（3 度衰减 +20%/+10%）；Fowler & Christakis 2008 BMJ：朋友幸福+25%（1.6km 内）
    sources:
    - Christakis & Fowler 2007 NEJM
    - Fowler & Christakis 2008 BMJ
    url: ''
  - claim: 情绪粒度（精确区分情绪）是可训练的技能而非稳定特质
    verdict: 支持
    original: ✅（2 周训练即可显著提升）
    evidence: Erbas 2018/2021：2 周 experience sampling 使正性粒度 d=0.50、负性粒度 d=0.32 显著提高
    sources:
    - Barrett 2004（情绪粒度构念）
    - Erbas et al. 2018/2021
    url: ''
  - claim: '''共依附''（codependency）是有效的临床诊断标签'
    verdict: 证伪
    original: ⚠️ 边界警示：概念模糊、测量混乱、不属 DSM/ICD
    evidence: Bornstein 1993 综述指出概念模糊测量混乱；不属于 DSM/ICD；更严谨替代为关系正念 IMS/关系灵活性 RFQ
    sources:
    - Bornstein 1993 综述
    url: ''
- theme: 自我投资与职业规划
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 自我投资与职业规划调研报告.md
  claims:
  - claim: 每天睡够 7-8 小时能降低健康风险，最低风险窗口约 7 小时
    verdict: 支持
    original: 🟢 真金
    evidence: 443 万人睡眠综述 + JAHA 剂量反应研究：睡眠时长与风险呈 J 形曲线，最低风险约 7h
    sources:
    - 443 万人睡眠综述
    - JAHA 剂量反应研究
    url: ''
  - claim: 长期低强度运动（如步行）优于依赖剧烈运动，剧烈运动存在 U 形拐点
    verdict: 支持
    original: 🟢 真金
    evidence: NEJM：步行降低 30% 心血管风险；哥本哈根研究：运动强度与获益呈 U 形，剧烈运动反而失效
    sources:
    - NEJM 步行与心血管风险研究
    - 哥本哈根运动强度研究
    url: ''
  - claim: 每年做深度全面体检是必要的健康投资
    verdict: 部分支持
    original: 🟡 镀金（过度医疗风险）
    evidence: 早筛有价值，但'每年深度体检'存在过度医疗风险，建议改为按风险分层筛查
    sources: []
    url: ''
  - claim: 自我宽恕（REACH 式）能降低抑郁与焦虑，不原谅自己会加重心理症状
    verdict: 支持
    original: 🟢 真金
    evidence: 2024 多中心 RCT：不自我原谅与抑郁、焦虑上升相关，自我宽恕干预可改善
    sources:
    - 2024 自我宽恕多中心 RCT
    url: ''
  - claim: 适度独处能恢复社交能量，但需与高质量联结保持平衡
    verdict: 支持
    original: 🟢 真金
    evidence: PLOS One 研究：独处可恢复社交能量；需与高质量联结平衡，不能以独处替代关系
    sources:
    - PLOS One 独处研究
    url: ''
  - claim: 储备约 6 个月的应急资金能显著提升财务幸福感
    verdict: 支持
    original: 🟢 真金
    evidence: Vanguard 研究：有半年储备金者财务幸福感 +34%，是反脆弱的底座
    sources:
    - Vanguard 储备金研究
    url: ''
  - claim: 每日花几分钟复盘反思能提升工作表现
    verdict: 支持
    original: 🟢 真金
    evidence: 哈佛商学院《反思提升表现》研究：反思/复盘显著提升后续表现，每天加 5 分钟即可
    sources:
    - Harvard Business School 反思研究
    url: ''
  - claim: 每日阅读 30 分钟是认知投资的最优剂量
    verdict: 部分支持
    original: 🟡 镀金（经验阈值）
    evidence: 方向正确，但 30 分钟为经验阈值而非实验测定的最优剂量
    sources: []
    url: ''
  - claim: 去陌生地旅行能拓展认知与创造力
    verdict: 部分支持
    original: 🟡 镀金（需条件转化）
    evidence: 旅行与创造力有关联，但需'深度卷入+开放心态'才转化为创造力提升，应作条件版使用
    sources: []
    url: ''
  - claim: '''大脑 25 岁就定型''，此后无法再改变'
    verdict: 证伪
    original: 🔴 镀铜/神话
    evidence: The Conversation 2025：4200 人 0-90 岁研究显示脑网络'青春期'延伸至 32 岁；25 岁说法源自 1999 年扫描止于 20 岁后的外推
    sources:
    - The Conversation 2025 神经科学综述
    url: ''
  - claim: 25-35 岁是自我投资的高杠杆窗口，但不是唯一窗口
    verdict: 部分支持
    original: 🟢 精神真金 / 🔴 硬 cutoff 镀铜
    evidence: 束缚少、可塑性强、复利早启动为真；但可塑性持续到 32 岁以上，习惯任何年龄都复利，决定轨迹的是持续投资而非 35 岁前通关
    sources:
    - The Conversation 2025
    url: ''
  - claim: '''反脆弱心态''作为独立心理训练模块有充分实证支持'
    verdict: 部分支持
    original: 🟡 镀金（框架级概念）
    evidence: 属 Taleb 框架级概念，缺直接干预实证；落地为'成长思维+复盘'等有实证组件更扎实
    sources:
    - Taleb《反脆弱》
    url: ''
- theme: 认知本质与普通人方法论
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 认知本质与普通人方法论调研报告.md
  claims:
  - claim: '''认知=看见商机''——企业家警觉（机会识别）可训练，但这一表述收窄了认知的含义'
    verdict: 部分支持
    original: 部分可信（概念成立但被收窄）
    evidence: Tang 2012 警觉三维度量表（扫描/联想/判断）可测可练；但'看见'不等于'变现'，警觉依赖先前知识，开发/利用环节被跳过
    sources:
    - Tang, Kacmar & Busenitz 2012 警觉三维度量表
    - Kirzner 1973
    url: ''
  - claim: 原生家庭通过言传身教传递认知——文化资本存在显著的代际传递
    verdict: 支持
    original: 高度可信
    evidence: Mikus 2019（德）、Liu 2017（北京大学生追踪）：文化资本→学业→地位中介链成立；丹麦双胞胎研究佐证
    sources:
    - Mikus, Tieben & Schober 2019 BJSE
    - Liu Wenli 2017 HKUST
    url: ''
  - claim: 阶层/原生家庭近似宿命地决定一个人的认知水平
    verdict: 证伪
    original: ⚠️ 过度推断（决定论倾向）
    evidence: 证据仅支持'显著且可被削弱的影响'；教育扩张、公共政策、个体能动性都能打断代际传递
    sources: []
    url: ''
  - claim: 挤入高学历圈层本身就能产出'高维认知'
    verdict: 证伪
    original: 部分可信——实为变量误读
    evidence: 真变量是网络多样性：Eagle 2010 Science 全英通话数据，经济排名与社交多样性 r=0.73；名校圈价值来自触达更广资源网络，因果方向不明
    sources:
    - Eagle, Macy & Claxton 2010 Science
    - Granovetter 1973
    url: ''
  - claim: 主动拓展弱关系与跨界信息源能带来认知与机会红利
    verdict: 支持
    original: ★ 强证据支持
    evidence: Granovetter 1973 弱关系理论；Eagle 2010：社交网络多样性（含弱关系）与经济排名相关 r=0.73
    sources:
    - Granovetter 1973
    - Eagle et al. 2010 Science
    url: ''
  - claim: AI 将大面积替代白领/蓝领岗位
    verdict: 部分支持
    original: 部分可信（暴露≠替代）
    evidence: Eloundou 2023：约 80% 劳动力≥10%任务受影响、19%≥50%，高收入认知岗暴露更高；但 WEF 2025 预测岗位净增 7800 万，OECD 27% 高自动化风险
    sources:
    - Eloundou et al. 2023 'GPTs are GPTs'
    - OECD Employment Outlook 2023
    - WEF Future of Jobs 2025
    url: https://arxiv.org/abs/2303.10130
  - claim: 稳定工作正在系统性弱化（零工化+技能半衰期缩短）
    verdict: 支持
    original: 高度可信
    evidence: 孙萍 8 年 19 省 400+ 骑手田野：杭州样本仅 12% 签合同、87% 未缴养老；WEF：约 39% 核心技能 5 年内过时、每 2-3 年需学新技能
    sources:
    - 孙萍 2024《过渡劳动》
    - WEF Future of Jobs
    url: https://www.cssn.cn/skgz/bwyc/202409/t20240911_5776820.shtml
  - claim: 长期自我投资能自动构建职业护城河
    verdict: 部分支持
    original: 部分可信（方向对、需具体化）
    evidence: WEF：自驱 upskilling 者 18 个月内转高需求岗概率是企业培训者的 2.3 倍；护城河需落地为可迁移能力+跨界弱关系+稀缺专长
    sources:
    - WEF Future of Jobs
    url: ''
  - claim: 抢先进入市场（先发）就能赢
    verdict: 证伪
    original: 与证据相悖（先驱劣势）
    evidence: Golder & Tellis 1993 历史档案研究：约 47% 市场先驱失败、平均份额仅 10%；早期领导者失败率 8%、份额 28%、平均晚 13 年进入
    sources:
    - Golder & Tellis 1993 JMR
    url: https://gtellis.net/wp-content/uploads/2020/09/pioneering-advantage-marketing-logic-or-marketing-legend.pdf
  - claim: '''正确时间做正确事''存在早期窗口优势，小成本试错优于 All-in 赌先发'
    verdict: 部分支持
    original: 部分可信
    evidence: 早期进入确有优势（份额 28% vs 10%），但持久优势来自切换成本/标准/规模三大机制，应验证机制后再重注
    sources:
    - Golder & Tellis 1993 JMR
    url: ''
  - claim: 多读历史能帮助认知未来
    verdict: 部分支持
    original: 部分可信（有效但有严格边界）
    evidence: Neustadt & May 1986：历史可作情景库与结构视角，但有六大类比陷阱（急于行动、模糊类比等），决策前应显式列异同
    sources:
    - Neustadt & May 1986 Thinking in Time
    url: ''
  - claim: 追求自主、胜任、关系三需求的满足能提升幸福感与绩效
    verdict: 支持
    original: 高度可信
    evidence: Slemp 2024 元分析 N=443,556：SDT 三需求与幸福感强相关、与绩效中等相关，跨文化稳定；追外在标签损害自主感反损幸福感
    sources:
    - Slemp et al. 2024 JPSP
    - Deci & Ryan 自决理论
    url: https://dspace.ewha.ac.kr/handle/2015.oak/269929
  - claim: 外卖/滴滴骑手个案证明'努力无用'
    verdict: 证伪
    original: 个案不能推普适因果
    evidence: 个案揭示的是结构性回报不对等（算法压价+无保障+平台抽成），解释制度如何压制回报，不能推出努力无效的普适因果
    sources:
    - 孙萍 2024《过渡劳动》
    url: ''
- theme: 认知觉醒科学依据
  category: 6_个人成长方法论/6.1_认知与心理科学方法论
  report_file: 认知觉醒科学依据调研报告.md
  claims:
  - claim: 人脑由本能脑（爬行脑）、情绪脑（哺乳脑）、理性脑（新皮层）三层结构按演化顺序层叠而成（三重大脑模型）
    verdict: 证伪
    original: ❌ 作为脑科学事实已被推翻（作为动机冲突隐喻部分有效）
    evidence: Cesario et al. 2020 综述：所有脊椎动物拥有相同基本脑区，差异在比例而非层叠，皮层可能比脊椎动物共同祖先更古老；MacLean 三重脑作为演化神经解剖学已被普遍推翻
    sources:
    - Cesario et al. 2020
    - LeDoux 2012
    - Panksepp 1998
    url: https://journals.sagepub.com/doi/10.1177/0963721420913369
  - claim: 人类约 99% 的日常决策由本能脑和情绪脑做出，理性脑只占 1%
    verdict: 证伪
    original: ❌⚠⚠⚠ 严重失真
    evidence: 无任何实验能测出该占比；最接近的 Libet 1985 准备电位实验仅 n=5、限于单次手指动作，且 Libet 本人强调意识可在最后 100-200ms 否决动作
    sources:
    - Libet 1985
    url: https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/abs/unconscious-cerebral-initiative-and-the-role-of-conscious-will-in-voluntary-action/D215D2A77F1140CD0D8DA6AB93DA5499
  - claim: 意志力是有限资源，自控任务会消耗后续自控能力（自我耗竭模型）
    verdict: 证伪
    original: ❌ 重磅红框
    evidence: Hagger et al. 2016：23 实验室 N=2141 预注册复制 d=0.04（零效应）；Vohs et al. 2021：36 实验室 N=3531 d=0.06，贝叶斯 4.4 倍支持零假设
    sources:
    - Hagger et al. 2016
    - Vohs et al. 2021
    - Carter & McCullough 2014
    url: https://journals.sagepub.com/doi/10.1177/1745691616652873
  - claim: 技能与学习成长遵循复利指数曲线：每天进步 1% 一年约 37.78 倍，前期平坦后期爆发
    verdict: 证伪
    original: ❌⚠⚠⚠ 严重失真
    evidence: Newell & Rosenbloom 1981 幂律、Crossman 1959 卷烟学习对数曲线、Lally 2010 习惯渐近曲线均显示学习前期快后期慢，与复利曲线方向相反
    sources:
    - Newell & Rosenbloom 1981
    - Crossman 1959
    - Lally et al. 2010
    url: https://doi.org/10.1002/ejsp.674
  - claim: 在任何领域累计练习 1 万小时即可成为专家（万小时定律）
    verdict: 证伪
    original: ❌⚠⚠
    evidence: Ericsson 本人公开否认'铁律'说；Macnamara et al. 2014 元分析：练习时长对绩效方差解释率棋类 26%、音乐 21%、体育 18%、教育 4%，平均仅 14%
    sources:
    - Ericsson et al. 1993
    - Macnamara et al. 2014
    - Macnamara & Maitra 2019
    url: https://doi.org/10.1177/0956797614535810
  - claim: 元认知（对思考的思考）可以训练，且对学业成就有中等偏大的正向效应
    verdict: 支持
    original: ✓✓
    evidence: Hattie 综合 d=0.59（22 项元分析、839 研究、124,768 名学生）；Donker 2014 元认知训练 RCT g=0.57
    sources:
    - Flavell 1979
    - Hattie 2009
    - Donker et al. 2014
    - Smeekes et al. 2024
    url: https://www.visiblelearningmetax.com/influences/view/meta-cognition_strategies
  - claim: 心流由三个条件触发：明确目标、即时反馈、挑战与技能匹配
    verdict: 支持
    original: ✓✓✓
    evidence: Csikszentmihalyi 1990 原典 + 30 余年 ESM 跨文化复现；Ulrich 2014-2022 三次 fMRI 复制（n=23-41 健康男性）见 mPFC 去激活与 DMN 抑制
    sources:
    - Csikszentmihalyi 1990
    - Ulrich et al. 2014/2016/2022
    url: https://doi.org/10.1016/j.neuroimage.2013.08.019
  - claim: 学习发生在'拉伸区'（难度刚好略超当前能力）时效果最好，对应心流通道的挑战-技能匹配
    verdict: 支持
    original: ✓✓
    evidence: Zou 2019 RtL 任务：拉伸区练习效果 OR=1.71（数学）/7.71（英语）；Baker 2020 综述 30+ 项研究支持拉伸区挑战提升学习
    sources:
    - Csikszentmihalyi 1990
    - Zou et al. 2019
    - Baker 2020
    url: https://learninganalytics.upenn.edu/ryanbaker/paper%20115b.pdf
  - claim: 习惯自动化约 66 天即可形成（对普通成人的日常习惯）
    verdict: 部分支持
    original: ⚠ 数字简化
    evidence: Lally et al. 2010：96 人习惯自动性追踪，18-254 天达到 95% 渐近线、中位数 66 天——66 天是中位数而非统一所需天数
    sources:
    - Lally et al. 2010
    url: https://doi.org/10.1002/ejsp.674
  - claim: 戒除坏习惯可将习惯养成四法则对称反转（藏提示、去吸引、加阻力、厌奖励）精确实现
    verdict: 存疑
    original: ⚠ 对称性主张不成立
    evidence: Edgren et al. 2026 RCT n=313：替代、抑制、降低可及性三种习惯降解策略效果无显著差异，'精确对称反转'无 RCT 级支持
    sources:
    - Edgren et al. 2026
    - Fogg 2019
    url: https://www.nature.com/articles/s44271-026-00432-9
  - claim: 改变环境（默认选项、物理阻力）比单纯依靠意志力更能有效改变行为
    verdict: 支持
    original: ✓✓✓
    evidence: Johnson & Goldstein 2003（Science）：器官捐献'默认同意'设计使各国同意率相差约 30 个百分点；助推文献含 RCT 级证据
    sources:
    - Thaler & Sunstein 2008
    - Johnson & Goldstein 2003
    url: https://doi.org/10.1126/science.1091721
  - claim: 接纳（而非压制）焦虑的应对方式（ACT 接纳承诺疗法）能显著降低焦虑（对焦虑障碍患者）
    verdict: 支持
    original: ✓✓✓
    evidence: Cochrane/Nature 2021：23 项 RCT N=1815，ACT vs 常规治疗 SMD=-0.98（大效应）；但 vs CBT 差异不显著，特异性效应存疑
    sources:
    - Powers et al. 2009
    - A-Tjak et al. 2015
    - Cochrane/Nature 2021
    url: https://doi.org/10.1037/a0018230
  - claim: 正念冥想训练（MBSR 类）能降低焦虑（对临床焦虑与情绪障碍人群）
    verdict: 支持
    original: ✓✓✓
    evidence: Hofmann et al. 2010 元分析 39 项研究 N=1140：焦虑/情绪障碍亚组 g=0.97；Khoury 2013 综合 N=12,145 g=0.55，效应随对照强度递减
    sources:
    - Hofmann et al. 2010
    - Khoury et al. 2013
    url: https://doi.org/10.1037/a0018555
  - claim: '''只做 2 分钟''的最小行动法能降低启动阻力、缓解拖延（2 分钟为经验法则而非精确阈值）'
    verdict: 部分支持
    original: ✓ ⚠
    evidence: Gollwitzer & Sheeran 2006 元分析 94 项研究 d=0.65 与 Fogg B=MAP 模型支持降低启动阻力方向；但'2 分钟'无精确阈值实证
    sources:
    - Fogg 2019
    - Gollwitzer & Sheeran 2006
    - Pychyl & Sirois 2013
    url: https://doi.org/10.1016/s0065-2601(06)38002-1
  - claim: if-then 实施意图（把目标写成'如果出现X情境就做Y'）能提升目标达成率
    verdict: 支持
    original: ✓✓✓
    evidence: Gollwitzer & Sheeran 2006 元分析 94 项研究 d≈0.65：if-then 计划显著缩小目标-行动鸿沟，跨健康、学习等多领域有效
    sources:
    - Gollwitzer & Sheeran 2006
    url: https://doi.org/10.1016/s0065-2601(06)38002-1
- theme: 学习效率与记忆方法论
  category: 6_个人成长方法论/6.2_学习与深度工作
  report_file: 学习效率与记忆方法论调研报告.md
  claims:
  - claim: 学习效率差异主要源于方法而非天赋
    verdict: 支持
    original: ✅ 成立（🟢 强，多项元分析）
    evidence: 2021 元分析（N=169,179）：练习测试 d=0.74、间隔练习 d=0.85，方法变量效应量大且可操作
    sources:
    - Hodges et al. 2021 Frontiers in Education
    - Agarwal et al. 2021 Educational Psychology Review
    url: ''
  - claim: 间隔重复（分散学习）显著优于集中突击学习
    verdict: 支持
    original: ✅（证据最充分的学习策略之一）
    evidence: Cepeda 2006 荟萃（184 篇/317 项实验）：间隔学习记忆提升 50-60%；医学教育综述 n=21,415：SMD=0.78（p<0.0001）
    sources:
    - Cepeda et al. 2006 Psychological Bulletin
    - BMJ EBM 2025 医学教育系统综述
    url: ''
  - claim: 主动检索/练习测试比重读等被动输入更能巩固记忆（测试效应）
    verdict: 支持
    original: ✅（报告指出被视频遗漏的核心策略）
    evidence: 测试效应 g=0.499（222 项研究 N=48,478）；Roediger & Karpicke 2006：测试组延迟保留 81% vs 重读组 28%
    sources:
    - Agarwal et al. 2021
    - Roediger & Karpicke 2006 Psychological Science
    url: ''
  - claim: 深度加工（语义关联、用自己的话复述）能提升记忆
    verdict: 支持
    original: ✅（加工水平理论经典结论）
    evidence: Craik & Tulving 1975：深层加工识别准确率比浅层高 2.4-13.6 倍；精细追问 d=0.56、自我解释 d=0.54
    sources:
    - Craik & Tulving 1975
    - Dunlosky et al. 2013
    url: ''
  - claim: '''理解了就能记住''——深度加工能改变遗忘速率，仅靠理解即可长期保持'
    verdict: 证伪
    original: ⚠️ 重要修正：不改变遗忘速率
    evidence: 2024 Memory & Cognition 研究：深度加工提升记忆起点但不改变遗忘速率，理解是必要但不充分的，必须配合间隔复习
    sources:
    - Memory & Cognition 2024
    url: ''
  - claim: 费曼技巧（讲给他人听）能提升学习效果
    verdict: 支持
    original: ✅（实验组显著优于对照组）
    evidence: 4/7/11 年级学生实验中'学以致教'组均显著优于对照组（p<0.001-0.006）；属主动输出/精细加工
    sources:
    - Fiorella & Mayer 2013
    - Karpicke 2017
    url: ''
  - claim: 工作记忆容量仅约 4±1 个单元，无复述仅保持约 20 秒，极易被打断
    verdict: 支持
    original: ✅ 完全正确
    evidence: Miller 1956 与 Cowan 2001 经典测定：容量 4±1 单元；无复述信息约 20 秒衰退
    sources:
    - Miller 1956
    - Cowan 2001
    url: ''
  - claim: 刷短视频等碎片化内容会损害工作记忆、注意力与学习能力
    verdict: 支持
    original: ✅ 有充分实证支持
    evidence: 短视频成瘾系统综述（23 项研究）：主要损害注意力与自我控制；观看 25 分钟后模式识别准确率降约 10%；频繁上下文切换是关键机制
    sources:
    - 短视频成瘾系统综述
    - Nature 2025 事件分割研究
    - ACM 2024
    url: ''
  - claim: 多感官/场景化学习普遍优于单感官学习
    verdict: 部分支持
    original: ⚠️ 有科学依据但需注意边界
    evidence: 2025 研究：多模态准确率 92% vs 单模态 59.6%；但多感官优势非普遍发现（2022 Cognition），VR 被动学习回忆反而更差，需控认知负荷
    sources:
    - Paivio 双重编码理论
    - Mayer 多媒体学习理论
    - Cognition 2022
    url: ''
  - claim: 睡眠（尤其慢波睡眠）对记忆巩固有因果性作用，学后保证睡眠是必要环节
    verdict: 支持
    original: ✅ 完全正确
    evidence: Nature Neuroscience 2023：闭环深部脑刺激增强 SO-spindle-ripple 三层振荡耦合，首次提供因果证据；间隔+睡眠为最佳组合
    sources:
    - Klinzing et al. 2019 Nature Neuroscience
    - Nature Neuroscience 2023 闭环刺激研究
    url: ''
  - claim: 超过 30 分钟的午睡能显著提升记忆保持
    verdict: 支持
    original: ✅
    evidence: 午睡>30 分钟提升记忆保持 Cohen's d=0.7962；另 2025 元分析（42 项研究 n=1,751）：午后小睡对认知 g=0.59
    sources:
    - 2025 午睡元分析（心理发展与教育）
    url: ''
  - claim: 间隔检索练习能在真实课堂中提升学业表现（输出优于输入）
    verdict: 支持
    original: ✅ 正确（有边界条件）
    evidence: 全部 9 门 STEM 课程中间隔检索练习显著提高表现（约 +2.06%）；带反馈的练习测试显著优于无反馈
    sources:
    - Agarwal et al. 2021
    url: ''
- theme: 最科学学习时间
  category: 6_个人成长方法论/6.2_学习与深度工作
  report_file: 最科学学习时间调研报告.md
  claims:
  - claim: 不存在适用于所有人的统一'黄金学习时段'，最佳时间因时型、记忆类型与年龄而异
    verdict: 支持
    original: ✅ 核心结论（科学共识）
    evidence: Brunel 2024 系统综述（65 项研究 18 国）：80%+ 研究显示时型同步效应；通用窗口上午 9-11 点高分者比例最高 69.2%，但约 25% 的人并非最佳
    sources:
    - Brunel University 2024 systematic review
    - Nature Communications 2021
    url: https://bura.brunel.ac.uk/bitstream/2438/31067/6/FullText.pdf
  - claim: 在与自身生物节律高峰同步的时段学习，认知效率最高（同步效应）
    verdict: 支持
    original: ✅（80% 以上研究支持）
    evidence: Nature Comms 2021 n=32：晨型早晨工作记忆命中 65.4% vs 傍晚 57.2%；夜型晚间 72.7% vs 早晨 62.7%；同步效应在注意/抑制/记忆任务最明显
    sources:
    - Nature Communications 2021
    - Brunel University 2024
    url: https://www.nature.com/articles/s41467-021-24885-0
  - claim: '''早晨是所有人记忆力最好的时间'''
    verdict: 证伪
    original: ❌ 误区 1
    evidence: 约 30% 的人早晨最佳、30% 下午最佳、30% 晚上最佳、10% 无明显偏向（Rita Dunn 1978）
    sources:
    - Dunn 1978
    url: ''
  - claim: '''5 点起床的人更成功''——早起本身带来成功'
    verdict: 证伪
    original: ❌ 误区 2
    evidence: Randler 2026：5 点神话忽略个体差异，强迫夜型人早起导致睡眠债务、注意力下降和情绪问题；成功来自与自身节律对齐
    sources:
    - Randler 2026 The Conversation
    url: https://theconversation.com/the-5am-myth-why-waking-early-wont-make-you-more-successful-276031
  - claim: 睡前临时抱佛脚（cramming）是高效的学习方式
    verdict: 证伪
    original: ❌ 误区 3
    evidence: 间隔学习长期准确率约 65% vs 临时抱佛脚约 34%；熬夜还消除了睡眠依赖的记忆巩固过程
    sources:
    - Cepeda et al. 2008 Psychological Science
    url: https://laplab.ucsd.edu/articles/Cepeda%20et%20al%202008%5Fpsychsci.pdf
  - claim: 学习时间越长效果越好
    verdict: 证伪
    original: ❌ 误区 4（倒 U 型）
    evidence: 学习时间与成绩呈倒 U 型；世界级表演者每天高质量练习不超过 3.5 小时，多数人深度专注上限 4-6 小时；4 小时专注优于 8 小时分心
    sources:
    - Ericsson 刻意练习研究
    url: ''
  - claim: 重读课本是有效的复习方式
    verdict: 证伪
    original: ❌ 误区 5
    evidence: Dunlosky 2013 大综述：重读被评为'低实用性'；仅练习测试与分布式练习被评为高实用性
    sources:
    - Dunlosky et al. 2013 Psychological Science in the Public Interest
    url: ''
  - claim: 考前通宵复习是值得的
    verdict: 证伪
    original: ❌ 误区 6
    evidence: 通宵消除当天学习的巩固窗口并损害次日编码能力（Matt Walker：练习+睡眠才能完美）；学到午夜+睡 6-7 小时优于通宵
    sources:
    - Matt Walker / UC Berkeley 睡眠研究
    url: ''
  - claim: 不同记忆类型的最佳学习时间不同：陈述性记忆宜下午学，程序性记忆宜睡前 1-2 小时练
    verdict: 支持
    original: ✅（PLOS ONE 2012）
    evidence: PLOS ONE 2012 n=50：陈述性记忆下午（睡前 3-5h）佳、为海马 LTP 留窗口；程序性记忆睡前 1-2h 最大化睡眠依赖离线增益
    sources:
    - PLOS ONE 2012
    url: https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0040963
  - claim: 夜型青少年在下午/晚间上课的学业表现优于清晨上课
    verdict: 支持
    original: ✅（随机实验）
    evidence: 阿根廷随机实验 n=753：夜型青少年下午班（12:40）与晚间班（17:20）表现显著优于上午班（07:45）
    sources:
    - Nature Human Behaviour 2020
    url: https://www.nature.com/articles/s41562-020-0820-2
  - claim: 午后小睡能提升认知功能（执行功能与记忆）
    verdict: 支持
    original: ✅
    evidence: 2025 元分析（42 项研究 n=1,751）：午后小睡对认知 g=0.59 中等正向；20 分钟午睡显著提高表现（OR=2.5）
    sources:
    - 心理发展与教育 2025 元分析
    url: https://devpsy.bnu.edu.cn/CN/Y2025/V41/I2/173
  - claim: 上午 9-11 点是对所有人都最优的学习时段
    verdict: 部分支持
    original: 🟡 通用参考窗口，非普适
    evidence: Pope 2014（近 200 万学生）：上午数学课 GPA 高 0.072（约教师质量 1/4 标准差）；但该时段仅 69.2% 高分，仍有约 25-30% 的人非最佳
    sources:
    - Pope 2014
    url: http://www.econweb.umd.edu/~pope/morning_afternoon.pdf
  - claim: 最优复习间隔约等于距考试时间的 10-20%（Cepeda 公式）
    verdict: 支持
    original: ✅（1,350+ 人里程碑实验）
    evidence: Cepeda 2008：最优间隔为滞留时间的 10-20%，间隔学习使回忆率提高 64%（d=1.1）
    sources:
    - Cepeda et al. 2008 Psychological Science
    url: https://laplab.ucsd.edu/articles/Cepeda%20et%20al%202008%5Fpsychsci.pdf
- theme: 深度工作实操路径
  category: 6_个人成长方法论/6.2_学习与深度工作
  report_file: 深度工作实操路径调研报告.md
  claims:
  - claim: 任务切换会留下'注意力残留'，显著降低下一个任务的表现
    verdict: 支持
    original: ✅（Leroy 实验证明）
    evidence: Sophie Leroy 实验：切换后部分注意力'卡在'前一任务上，错误率上升、最优决策率下降；其 Ready-to-Resume 记录技巧可显著降低切换损失
    sources:
    - Sophie Leroy 注意力残留研究
    - Cal Newport《Deep Work》2016
    url: ''
  - claim: 工作中断后平均需约 23 分钟（23 分 15 秒）才能恢复，且中断内容是否相关不影响代价
    verdict: 支持
    original: ✅（Gloria Mark 量化）
    evidence: Gloria Mark 观察研究：中断后恢复需 23 分 15 秒，办公室工作者单次任务平均仅 3 分 5 秒；中断后压力评级 6.92→9.46（20 分量表）
    sources:
    - Gloria Mark《Attention Span》2023
    url: ''
  - claim: 多任务处理效率更高
    verdict: 证伪
    original: ❌ 常见误区
    evidence: 每次任务切换都产生认知税与注意力残留；知识工作者约 60% 时间耗在浅层工作，频繁切换是主因
    sources:
    - Cal Newport《Deep Work》
    - Gloria Mark 2023
    url: ''
  - claim: '''看一眼通知/被打断一下没关系'''
    verdict: 证伪
    original: ❌ 常见误区
    evidence: Gloria Mark：任何打断都触发切换代价与注意力残留，中断内容是否与工作相关不改变代价
    sources:
    - Gloria Mark《Attention Span》2023
    url: ''
  - claim: 专注能力是天生的、不可训练
    verdict: 证伪
    original: ❌ 常见误区（神经科学证明可训练）
    evidence: Georgia Tech 2024：专注时 FPCN 与 DMN 去同步化、约 20 秒准周期跨物种存在——专注有根本性神经基础且可被训练
    sources:
    - Seeburger & Schumacher 2024 Georgia Tech
    url: https://psychology.gatech.edu/news/neuroscience-study-taps-brain-network-patterns-understand-deep-focus-attention
  - claim: 人每天能进行的高质量深度认知工作上限约 4 小时
    verdict: 支持
    original: ✅（艾力克森研究上限）
    evidence: 最杰出知识工作者每天真正深度工作不超过 4 小时；纽波特：40 小时时间块周的产出等于 60+ 小时无结构周
    sources:
    - Ericsson 刻意练习研究
    - Cal Newport《Deep Work》
    url: ''
  - claim: 记者模式（利用碎片时间随时切入深度状态）适合新手日常使用
    verdict: 部分支持
    original: ⚠️ 纽波特警告：不适合新手
    evidence: Cal Newport 警告频繁切换会耗尽意志力，属专家经验而非对照实验；新手应从节律模式（每天固定 1-4 小时）起步
    sources:
    - Cal Newport《Deep Work》
    url: ''
  - claim: 30 天社交媒体戒断实验能夺回注意力主动权
    verdict: 部分支持
    original: 🟡 实践框架（非对照试验）
    evidence: 纽波特 30 天四阶段戒断+工匠选择法为实践方案；关键教训：需提前规划替代活动，否则其他屏幕填补真空；无 RCT 验证
    sources:
    - Cal Newport Digital Minimalism 30 天实验
    url: ''
  - claim: 知识工作者平均约 60% 的工作时间用于浅层事务
    verdict: 支持
    original: ✅（纽波特综合估计）
    evidence: Cal Newport：知识工作者平均 60% 时间用于浅层工作，深度时间被会议/邮件/行政切碎
    sources:
    - 'Cal Newport: Knowledge Workers are Bad at Working'
    url: https://calnewport.com/knowledge-workers-are-bad-at-working-and-heres-what-to-do-about-it/
- theme: 碎片化学习与系统性学习科学依据
  category: 6_个人成长方法论/6.2_学习与深度工作
  report_file: 碎片化学习与系统性学习科学依据调研报告.md
  claims:
  - claim: 对各类学习材料与学习者，分散（间隔）练习的长期保持效果优于集中练习
    verdict: 支持
    original: 【元分析】强
    evidence: Cepeda et al. 2006 元分析（839项评估/317实验/184篇文献）：间隔练习在259/271个比较中胜出（约96%）；Donovan & Radosevich 1999（63项研究）d=0.46。
    sources:
    - Cepeda et al. 2006
    - Donovan & Radosevich 1999
    url: https://escholarship.org/uc/item/3rr6q10c
  - claim: 间隔练习的最优间隔约为目标保持期的10%-20%，并非间隔越碎越好，任务越复杂效应越小
    verdict: 支持
    original: 调节变量明确（强）
    evidence: Cepeda et al. 2008（约1,354名网络被试）：最优间隔随目标保持期变化，约为其10%-20%，间隔是调度学问而非越短越好。
    sources:
    - Cepeda et al. 2008
    url: https://journals.sagepub.com/doi/10.1111/j.1467-9280.2008.02209.x
  - claim: 对已学内容做提取练习（自测）比重读更能提升长期保持，尽管当下感觉更难、5分钟内重读组反超
    verdict: 支持
    original: 【直接实验+元分析】强
    evidence: Roediger & Karpicke 2006：1周后测试组约56% vs 重读组42%；Adesope et al. 2017 元分析（217项研究）vs 重学 g≈0.51。
    sources:
    - Roediger & Karpicke 2006
    - Adesope et al. 2017
    url: https://journals.sagepub.com/doi/10.1111/j.1467-9280.2006.01693.x
  - claim: 交错练习对绘画分类、数学等材料有效（g=0.42），但对外语词汇几乎无益、对说明文为负效应，不宜泛化
    verdict: 部分支持
    original: 中-强，强依赖材料
    evidence: Brunmair & Richter 2019 元分析：总体g=0.42；绘画分类g=0.67、数学中等、说明文负效应、外语词汇几乎无益——不宜泛化。
    sources:
    - Brunmair & Richter 2019
    - Rohrer & Taylor 2007
    url: https://doi.org/10.1037/bul0000209
  - claim: 棋类、音乐、工作记忆等外围训练对数学成绩等远迁移目标的提升微乎其微（主动对照设计下接近0）
    verdict: 支持
    original: 【三项元分析汇总，接近定论】
    evidence: Sala & Gobet 2017：主动对照组效应量棋类-数学0.10、音乐0.03、工作记忆0.05（被动对照虚高）；效应量与设计质量成反比。
    sources:
    - Sala & Gobet 2017
    - Melby-Lervåg & Hulme 2013
    - Melby-Lervåg et al. 2016
    - Simons et al. 2016
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8143029/
  - claim: 刻意练习量与专业表现正相关，但只解释成绩方差的约12%，且各领域差异极大
    verdict: 部分支持
    original: 争议带：正相关真实但远非全部
    evidence: Macnamara et al. 2014 元分析（88项研究）：r=.35；游戏26%、音乐21%、体育18%、教育4%、职业不足1%。
    sources:
    - Ericsson, Krampe & Tesch-Römer 1993
    - Macnamara et al. 2014
    url: https://journals.sagepub.com/doi/abs/10.1177/0956797614535810
  - claim: '''累计练习满1万小时即可成为专家''（一万小时定律）'
    verdict: 存疑
    original: 2019直接复制未复现组间梯度
    evidence: Macnamara & Maitra 2019 在同一音乐学院重取样直接复制，未复现 Ericsson 1993 的累计练习量组间梯度；'1万小时'原为音乐学院样本组均值。
    sources:
    - Ericsson, Krampe & Tesch-Römer 1993
    - Macnamara & Maitra 2019
    url: https://doi.org/10.1098/rsos.190327
  - claim: 对新知识的初次学习，孤立无结构的碎片内容因缺乏可挂靠图式而编码质量骤降
    verdict: 支持
    original: 【直接实验，强】
    evidence: Bransford & Johnson 1972：同一段文字，听前给标题的组回忆大幅领先，听后给标题毫无帮助——图式必须在编码时激活。
    sources:
    - Bransford & Johnson 1972
    - Sweller 1988
    url: https://memlab.yale.edu/sites/default/files/files/1972_Bransford_Johnson_JVLVB.pdf
  - claim: 分段/碎片化式呈现对新手减负有效，但对已有知识基础的专家会失效甚至反转有害（专长逆转效应）
    verdict: 支持
    original: 【教学实验综述】中-强
    evidence: Kalyuga et al. 2003：对新手有效的支架式呈现随专长增长失效甚至反转有害；碎片化好坏须先问学习者水平。
    sources:
    - Kalyuga et al. 2003
    url: https://doi.org/10.1207/S15326985EP3801_4
  - claim: 多任务切换与未完成任务造成的注意残留会显著损耗后续任务表现，实验室证据强
    verdict: 支持
    original: 实验室强证据 / 中
    evidence: Rubinstein, Meyer & Evans 2001：切换需goal shifting+rule activation两阶段，复杂任务损耗大；Leroy 2009：未完成任务A的认知残留损害任务B。
    sources:
    - Rubinstein, Meyer & Evans 2001
    - Leroy 2009
    url: https://www.sciencedirect.com/science/article/abs/pii/S0749597809000399
  - claim: 课堂上用电脑多任务的学生理解成绩低约11%，坐在可见其屏幕位置的同伴低约17%（负外部性）
    verdict: 支持
    original: 中-强
    evidence: Sana, Weston & Cepeda 2013（模拟课堂实验）：多任务学生理解低约11%，旁观同伴低约17%；方向与 May & Elder 2018 综述一致。
    sources:
    - Sana, Weston & Cepeda 2013
    - May & Elder 2018
    url: https://doi.org/10.1016/j.compedu.2012.11.001
  - claim: 屏幕阅读的文本理解略差于纸质（g=-0.21），等时控制下缩至-0.10，部分源于可改变的浏览式阅读习惯
    verdict: 支持
    original: 中（小效应、方向稳健）
    evidence: Delgado et al. 2018（54项研究）：屏幕理解差g=-0.21；Clinton 2019（39项研究）等时控制下约-0.10；纸质读者元认知更准。
    sources:
    - Delgado et al. 2018
    - Clinton 2019
    url: https://doi.org/10.1016/j.edurev.2018.09.001
  - claim: '''人的注意力只有8秒/比金鱼还短'''
    verdict: 证伪
    original: 错误（已证伪）
    evidence: 源自 Microsoft Canada 2015 营销报告，溯源至 Statistic Brain 查无此文、无同行评审；BBC 核查失败；Gloria Mark 实测47秒是任务切换行为均值，非注意力上限。
    sources:
    - BBC 核查 2017
    - Microsoft Canada 2015
    url: https://www.bbc.com/news/health-38896790
  - claim: '''21天即可养成一个习惯'''
    verdict: 证伪
    original: 错误（无来源）
    evidence: Lally et al. 2010（96名成人追踪12周）：习惯自动化达平台中位约66天，个体区间18-254天；'21天'疑为1960年代 Maltz 观察的以讹传讹。
    sources:
    - Lally et al. 2010
    url: https://doi.org/10.1002/ejsp.674
  - claim: 重度媒体多任务者（MMI高分）的注意力过滤与任务切换能力更差
    verdict: 存疑
    original: 复制争议（引用必须连带）
    evidence: Ophir et al. 2009 原始发现复制不稳：Minear et al. 2013 未复制核心结果，Wiradhany & Nieuwenstein 2017 两项复制+元分析否定 MMI 预测力。
    sources:
    - Ophir, Nass & Wagner 2009
    - Minear et al. 2013
    - Wiradhany & Nieuwenstein 2017
    - Uncapher & Wagner 2018
    url: https://www.pnas.org/doi/10.1073/pnas.0903620106
- theme: 2026分水岭与普通人行动指南
  category: 6_个人成长方法论/6.3_情绪压力与韧性
  report_file: 2026分水岭与普通人行动指南调研报告.md
  claims:
  - claim: 用AI可以让个人工作效率提升10倍
    verdict: 证伪
    original: 🔴 存疑（'10倍'零实证，内核部分有效）
    evidence: 最严谨RCT链：程序员任务+26%（Microsoft/Accenture三重实验）、客服新手+30-34%、翻译算力10倍仅省时12%；METR实验资深开发者用AI反而慢19%；自报调查中位仅1.4-2倍且系统性高估40pp
    sources:
    - Microsoft/Accenture RCT
    - METR 2025实验
    - BCG锯齿前沿实验
    url: ''
  - claim: 低年资者在合适任务上用AI可获15%-56%效率提升（新手红利），目标宜锚定20-50%而非10倍
    verdict: 支持
    original: 🟢 内核部分有效（真实区间+15%~56%，新手红利显著）
    evidence: RCT证据链：程序员任务+26%、客服新手+30-34%；PwC：全球AI技能薪资溢价56%；报告建议以20-50%为锚、每天30分钟解决一个本职痛点
    sources:
    - Microsoft/Accenture三重实验
    - PwC AI技能溢价研究
    url: ''
  - claim: 3-5人小联盟能带来10倍效率，未来竞争是'联盟vs联盟'
    verdict: 证伪
    original: 🔴 存疑（弱部分有效）：'效率×10''联盟vs联盟'检索不到任何学术来源
    evidence: Ringelmann效应元分析（78项研究）：无问责机制的搭伙使人均产出降25-40%；'联盟vs联盟'属知识付费圈身份话术
    sources:
    - Ringelmann效应元分析（78项研究）
    url: ''
  - claim: 3人以上互补小团队成功率更高，但单干同样可行，不必为'不组队就被淘汰'焦虑
    verdict: 支持
    original: 🟢 有据部分（组队收益×2）；solo创始人存活率高2.5倍
    evidence: Nature 2024：3人以上创始团队成功率翻倍，4-9人是甜点区；Wharton：solo创始人存活率高2.5倍；组队需贡献可识别+利益书面化否则被Ringelmann效应吞掉增益
    sources:
    - Nature 2024创始团队研究
    - Wharton solo创始人研究
    url: ''
  - claim: AI归因裁员在加速，初级白领是冲击锋线
    verdict: 支持
    original: 🟡 部分属实（加速属实，'三类人淘汰'表述过度）
    evidence: AI归因裁员54,836起（2025）→101,743起（2026上半年）；Anthropic实测：高暴露群体中研究生学历占17.4%
    sources:
    - AI裁员追踪数据2025-2026
    - Anthropic经济指数
    url: ''
  - claim: 普通人不结盟、不做副业就将在AI浪潮中被淘汰
    verdict: 证伪
    original: 🟡 部分属实（表述过度）：'单打独斗者被淘汰'无就业统计支持，甚至方向相反
    evidence: WEF预测至2030创造1.7亿岗位vs替代9200万、净增7800万；AI正在催生超级个体
    sources:
    - WEF未来就业报告
    url: ''
  - claim: 坚持做'边际成本递减'的长期内容项目是普通人可靠的致富路径
    verdict: 部分支持
    original: 🟢→🟡 部分有效（长期主义是必要条件而非充分条件）
