  - claim: '''花未全开月未圆''原作者是曾国藩'
    verdict: 证伪
    original: 重要纠偏
    evidence: 原作出自北宋蔡襄《十三日吉祥院探花》（1066 年，两天后手书《山堂诗帖》）；曾国藩 1845 年《求阙斋记》仅取首句作'宰割式'再诠释。
