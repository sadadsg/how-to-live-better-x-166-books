  - claim: '''天道忌满，人道忌全''一语出自先秦经典'
    verdict: 证伪
    original: 重要纠偏
    evidence: 该句是清代文康《儿女英雄传》第三十八回的成语化总结，非先秦原典；先秦支撑来自道德经/周易等单句命题而非此成语。
