    - 周国平（观点引用）
    - Sahil Bloom 2026
    url: ''
  - claim: 用控制二分法（区分可控与不可控）可化解大部分焦虑
    verdict: 存疑
    original: 无明确判定标记（报告称'实用意义'，未附数据）
    evidence: 爱比克泰德《手册》控制二分法；报告断言'焦虑几乎全部来自试图控制不可控之事'但未提供实证（ACT接纳疗法效应量证据见同库其他报告）
    sources:
