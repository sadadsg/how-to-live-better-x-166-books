  - claim: '''满则亏''可用意志力有限资源模型（ego depletion）解释'
    verdict: 证伪
    original: ❌→🟡（资源模型已崩塌）
    evidence: Hagger 2016 注册重复复制 d=0.04、Vohs 2021 BF=4.4：资源模型崩塌；替代解释为'动机/注意转移'模型成立。
    sources:
    - Hagger 2016
    - Vohs 2021
    - Inzlicht 2018
