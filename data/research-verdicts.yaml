  - claim: 好奇心本身就是奖赏：好奇激活尾状核与SN/VTA多巴胺回路，中脑神经元编码信息预测误差
    verdict: 支持
    original: ✅ 机制成立 / ⚠️ 引文嫁接
    evidence: Kang 2009好奇激活尾状核；Gruber 2014好奇激活SN/VTA；Bromberg-Martin & Hikosaka 2009中脑多巴胺神经元编码信息预测误差
    sources:
    - Kang 2009
    - Gruber 2014
    - Bromberg-Martin & Hikosaka 2009
    url: https://doi.org/10.1016/j.neuron.2014.08.043
  - claim: 好奇心状态增强海马依赖的学习与记忆（先有好奇问题，再有奖赏激活，顺序不能反）
    verdict: 支持
    original: 权威证据（Gruber 2014 Neuron）
    evidence: Gruber 2014：好奇心激活SN/VTA并增强海马依赖学习，中脑活动可解释过半偶然记忆获益方差；Kang 2009高好奇心问题记忆保持更好
    sources:
    - Gruber 2014
    - Kang 2009
    url: https://doi.org/10.1016/j.neuron.2014.08.043
  - claim: 视频引用的'Kobayashi & Hsu 2019 Neuron《Primary need for novelty》'查无此文，系引文嫁接
    verdict: 证伪
