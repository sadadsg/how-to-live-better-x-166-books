- theme: 管住表达欲与沉默的科学依据
  category: 6_个人成长方法论/6.8_古典智慧应用
  report_file: 管住表达欲与沉默的科学依据调研报告.md
  claims:
  - claim: '''讷言敏行''''多言数穷不如守中''''希言自然''等讷言命题有先秦原典精确出处'
    verdict: 支持
    original: ✅ 4/5 命题 ✅
    evidence: 《论语·里仁》'君子欲讷于言而敏于行'（何晏/朱熹/皇侃/邢昺四家注完整）；《道德经》5 章（帛书甲本作'多闻'）与 23 章'希言自然'（河上公训'希'为少）；跨文化十方支撑。
    sources:
    - 《论语·里仁》四家注
    - 《道德经》5/23 章王弼本+帛书本
    - 《周易·系辞上》
    url: ''
  - claim: '''群处守口独处守心''出自先秦原典'
    verdict: 证伪
    original: ❌ 非先秦原典（5 命题中唯一 🟡）
    evidence: 最早可考为清代金缨《格言联璧》（1851）'群居守口，独坐防心'，曾国藩约 1868 年化用为对联'群居守口，独居守心'；明代近旨表述见《菜根谭》《呻吟语》。
    sources:
    - 金缨《格言联璧》1851
    - 曾国藩对联约 1868
    - 吕坤《呻吟语》1593
    url: ''
  - claim: '''言多必失''四字直接出自先秦《鬼谷子》原文'
    verdict: 存疑
    original: 🟡 字面为'言多不能无短'且属汉代托名
    evidence: 鬼谷子《本经阴符七术·分威法》作'言多不能无短'，且《本经阴符》为汉代托名之作；先秦同旨见《金人铭》'无多言，多言多败'与《荀子·劝学》'言有招祸'。
    sources:
    - 《本经阴符七术·分威法》
    - 《金人铭》
    - 《荀子·劝学》
    url: ''
  - claim: 表达欲强源于大脑对即时社交反馈的奖赏敏感（多巴胺预测误差）
    verdict: 支持
    original: ✅
    evidence: Schultz 1997 Nature（20000+ 引用）：多巴胺神经元对意外奖励的反应比预期奖励强 3-5 倍；点赞互动构成可变比率强化程序，使表达比沉默更容易。
    sources:
    - Schultz 1997 Nature
    url: ''
  - claim: '''自贬式炫耀''（humblebrag）比直接自夸更招人反感'
    verdict: 支持
    original: ✅（9 项研究）
    evidence: Sezer 2018 JPSP 9 项研究：受众识破'自贬+自夸'结构后触发反感与不信任，同等条件下 humblebrag 好感度低于直接 brag。
    sources:
    - Sezer 2018 JPSP
    url: ''
  - claim: 交浅言深（对关系尚浅者过度自我披露）会触发信任反噬
    verdict: 支持
    original: ✅
    evidence: Lewicki & Bunker 1996 三类信任模型：信任按计算型→认知型→认同型顺序累积，交浅言深等于跨级披露，在关系早期触发'过度披露'反噬。
    sources:
    - Lewicki & Bunker 1996 OBHDP
    url: ''
  - claim: 只输出事实不输出情绪的表达无法增进亲密关系
    verdict: 支持
    original: ✅
    evidence: Laurenceau 1998 dyadic intimacy 模型：情绪披露对关系亲密度 β=0.37 显著，纯事实披露无显著影响（ns）。
    sources:
    - Laurenceau 1998
    url: ''
  - claim: '''55% 肢体语言+38% 语调+7% 词语''是沟通效果的普遍权重（Mehrabian 法则）'
    verdict: 证伪
    original: 严重误用（80% 引用是错的）
    evidence: Mehrabian 1971《Silent Messages》数据仅限单一研究中'情感态度不一致'场景的面部/语调权重；Mehrabian 本人 2010 公开澄清误用，Lapakko 2015 核验约 80% 引用错误。
    sources:
    - Mehrabian 1971 Silent Messages
    - Lapakko 2015 核验
    url: ''
  - claim: 情绪上头时'嘴慢半拍'有神经科学依据：给前额叶留出调控时间
    verdict: 支持
    original: ✅
    evidence: LeDoux 1996/Phelps 2004：杏仁核约 200-500ms 激活，前额叶（vmPFC）调控需 800ms+，时间差约 200-300ms；对应 Gross 1998 情绪调节五阶段的反应调节。
    sources:
    - Gross 1998 Review of General Psychology
    - LeDoux 1996
    - Phelps 2004
    url: ''
  - claim: 人在情绪激动（hot）状态下会系统性低估风险，冷静后易后悔
    verdict: 支持
    original: ✅
    evidence: Loewenstein 2005 hot-cold empathy gap：情感状态下系统性低估未来风险；Van Boven 2005 'cold reflection' 模型：冷静反思可降低情感偏差。
    sources:
    - Loewenstein 2005 J Consumer Psychol
    - Van Boven 2005
    url: ''
  - claim: 安静与静默激活默认模式网络（DMN），是内省与判断标准建立的神经基础
    verdict: 支持
    original: ✅
    evidence: Raichle 2001 PNAS（16000+ 引用）：无任务态下 DMN（mPFC/PCC 等）持续活跃，关联内省、未来规划与价值判断；Brewer 2011：长期正念降低 DMN 自我中心活动。
    sources:
    - Raichle 2001 PNAS
    - Brewer 2011 PNAS
    - Kabat-Zinn 1990 MBSR
    url: ''
  - claim: 自我控制失败可用'意志力资源耗竭'（ego depletion）解释
    verdict: 证伪
    original: ❌ 资源模型已崩塌
    evidence: Hagger 2016 d=0.04、Vohs 2021 BF=4.4：资源模型崩塌；替代为 Strack & Deutsch 2004 反思/冲动双系统竞争模型（3989 引用）——管住嘴是反思系统抑制冲动系统，而非资源耗竭。
    sources:
    - Hagger 2016
    - Vohs 2021
    - Strack & Deutsch 2004
    url: ''
  - claim: 共情式倾听是咨询与沟通有效性的关键成分，'听'比'说'更有效
    verdict: 支持
    original: ✅（Elliott 2011 元分析）
    evidence: Rogers 1951 共情倾听三条件（真诚/积极关注/共情）；Elliott 2011 元分析：共情是心理治疗有效性的关键预测因子；Bandura 1965：观察学习经注意+保持两过程高效获取信息。
    sources:
    - Rogers 1951 Client-Centered Therapy
    - Elliott 2011 元分析
    - Bandura 1965 JPSP
    url: ''
  - claim: 用结果（明示反馈）代替争论与解释更能改进表现
    verdict: 支持
    original: ✅
    evidence: Kluger & DeNisi 1996（Psychol Bull 反馈干预元分析）：明示反馈比推断反馈更有效；配合 Kahneman 2011 启发式框架，'养富贵嘴'的核心是预制判断标准。
    sources:
    - Kluger & DeNisi 1996 Psychol Bull
    - Kahneman 2011
    url: ''
  - claim: 人偏好在当下'说'而非等待更大远期回报，管住嘴需对抗双曲贴现
    verdict: 支持
    original: ✅
    evidence: Laibson 1997 QJE 双曲贴现模型：人系统性偏好即时奖励，管住嘴=对抗双曲贴现，需刻意训练与外部承诺机制。
    sources:
    - Laibson 1997 QJE
    url: ''
- theme: 过度兴奋反噬与藏锋避祸
  category: 6_个人成长方法论/6.8_古典智慧应用
  report_file: 过度兴奋反噬与藏锋避祸调研报告.md
  claims:
  - claim: '''持而盈之''''亢龙有悔''''自伐自矜''''慎终如始''''功成身退''等古籍命题有原典与出土本精确支撑'
    verdict: 支持
    original: ✅ 4/5 个古籍命题 ✅
    evidence: 《道德经》9/24/44/64/66 章 + 《周易·乾卦》上九与《文言传》'贵而无位，高而无民'；帛书乙本'功遂身退'、郭店楚简'慎终如始'古本原形互证；王弼/河上公/魏源三家注差异清晰。
    sources:
    - 《道德经》王弼本+帛书+郭店楚简
    - 《周易·乾卦》朱熹/程颐/虞翻三家易注
    url: ''
  - claim: 《乾·文言》'知进退存亡'（儒家）与老子'功成身退'（道家）是同一思想，可直接互引
    verdict: 证伪
    original: ❌ 路径殊异，不可混用
    evidence: 报告明确边界：儒家《易传》强调'知进退存亡而不失其正'的道德主动性，道家强调'功成身退天之道'的自然退让——均讲'退'但路径殊异，不可混用；'自伐'（居功外归因）与'自矜'（恃才内归因）亦有别。
    sources:
    - 《周易·乾·文言》
    - 《道德经》第 9 章
    url: ''
  - claim: 炫才招祸：杨修'鸡肋事件'被杀是'自伐自矜'的历史反例
    verdict: 支持
    original: ✅（可迁移）
    evidence: 《三国志·魏书·杨修传》：建安 24 年（219 AD）秋鸡肋事件，以'前后漏泄言教，交关诸侯'罪收杀，年约 44-45；心理机制对应 self-promotion+overconfidence。
    sources:
    - 《三国志·魏书·杨修传》
    url: ''
  - claim: 藏锋避祸足以在权力斗争中保身（荀彧式藏智可成功避祸）
    verdict: 部分支持
    original: 🟡 藏锋不完全成功
    evidence: 《三国志·荀彧传》：荀彧'深密有谋'仍于建安 17 年（212 AD）空盒事件被迫自尽——藏锋需配合远离权力中心（如张良'从赤松子游'善终）；留在权力中心则不完全奏效。
    sources:
    - 《三国志·魏书·荀彧传》及裴注
    - 《史记·留侯世家》
    url: ''
  - claim: 谦虚是自我保护机制，但需同时满足'已建立能力'与'集体主义文化语境'两个边界
    verdict: 部分支持
    original: 🟡 需限定两个边界条件
    evidence: Heine & Hamamura 2007 元分析（91 项研究）：东亚谦逊偏向 d=0.84；但西式 self-serving bias（d≈0.85）支持适度自夸，过度谦虚可能被低估；印象管理五策略中楷模化最脆弱。
    sources:
    - Heine & Hamamura 2007 元分析
    - Markus & Kitayama 1991
    - Jones & Pittman 1982
    url: ''
  - claim: 高调楷模人设（loud virtue/exemplification）是印象管理策略中最脆弱的
    verdict: 支持
    original: ✅
    evidence: Jones & Pittman 1982：五策略中 exemplification 依赖持续表演，单次翻车反噬最重；Pratfall 效应（Aronson 1966）仅限'已建立能力+非道德失误'，道德失误触发虚伪感。
    sources:
    - Jones & Pittman 1982
    - Aronson 1966
    - Sezer 2018 JPSP
    url: ''
  - claim: 过度兴奋会系统性扭曲决策：激活奖赏回路、抑制风险信号，导致忽视风险
    verdict: 支持
    original: ✅（三线实证一致）
    evidence: Kuhnen & Knutson 2011 J Neurosci（fMRI 投资任务）：NAcc 激活+insula 抑制→过度自信与风险忽视；Knutson & Bossaerts 2007：预测误差增强→决策失衡；Loewenstein 2005：情感状态低估风险 50%+。
    sources:
    - Kuhnen & Knutson 2011 J Neurosci
    - Knutson & Bossaerts 2007 SCAN
    - Loewenstein 2005
    url: ''
  - claim: 重要决策前保持冷静（'扣扳机前呼吸微弱'）能降低情感决策偏差
    verdict: 支持
    original: ✅ 神经科学+经济学双支撑
    evidence: Loewenstein 2005 hot-cold empathy gap + Van Boven 2005 cold reflection：冷静反思降低情感偏差；边界：仅适用情感驱动决策（投资/谈判），不适用逻辑推理型决策。
    sources:
    - Loewenstein 2005 J Consumer Psychol
    - Van Boven 2005
    url: ''
  - claim: '''赢家诅咒''与领导者过度自信（hubris）导致溢价过高与并购表现变差（亢龙有悔的现代对应）'
