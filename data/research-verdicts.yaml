- theme: 赚钱道德与人设管理
  category: 6_个人成长方法论/6.6_财富与道德
  report_file: 赚钱道德与人设管理调研报告.md
  claims:
  - claim: 赚钱本质是发现并利用信息差，存在套利/咨询/教育/品牌等合法形态
    verdict: 支持
    original: 🟢 强支持
    evidence: Hayek 1945：信息天然分散，利润机会普遍存在；Kirzner 1973：警觉性套利是企业家原型；Spence 1973：品牌/认证是传递私有信息的信号机制。
    sources:
    - Hayek 1945 AER
    - Kirzner 1973 Competition and Entrepreneurship
    - Spence 1973 QJE
    url: ''
  - claim: 不骗人赚不到第一桶金（欺骗是发财的必要条件）
    verdict: 证伪
    original: 🔴 反对
    evidence: Akerlof 1970 柠檬市场表明信息差获利不要求欺骗；巴菲特/华为/娃哈哈等反例；Bowles 2017：长期重复博弈中合作期望收益更高，信任可降低交易费用数十个百分点。
    sources:
    - Akerlof 1970 QJE
    - Bowles 2017 JEP
    - Arrow 1972
    url: ''
  - claim: 道德标准受阶层与资源形态塑造（如牧业荣誉文化、贫穷挤压决策）
    verdict: 部分支持
    original: 🟡 部分
    evidence: Nisbett & Cohen 1996：美国南方凶杀率为北方 2-3 倍；Mani 2013：贫穷占用约 13 个 IQ 点当量；但 Piff 2012 PNAS 发现高阶层更不道德（部分复制失败），DePaulo 1996：普通人每天撒谎 1-2 次与阶层无关。
    sources:
    - Nisbett & Cohen 1996
    - Piff et al. 2012 PNAS
    - DePaulo et al. 1996 JPSP
    url: ''
  - claim: 创业失败/被收割可转化为学习，前提是内部归因+内在动机+中等严重度失败
    verdict: 支持
    original: 🟢 强支持
    evidence: Yamakawa 2015（ETP）：内部归因+内在动机+中等严重度失败→再创业最佳表现，外部归因无学习；Shepherd 2003：须先处理悲伤情绪，快速正向归因反而抑制学习。
    sources:
    - Yamakawa/Peng/Deeds 2015 ETP
    - Shepherd 2003 AMR
    - Sitkin & Pablo 1992 AMR
    url: ''
  - claim: 道德资本可长期积累并与经济资本协同，是可持续护城河
    verdict: 支持
    original: 🟢 强支持
    evidence: Bowles 2017 JEP 道德经济学：道德激励相容，道德资本类似网络效应；信任作为润滑剂可降低交易费用数十个百分点（Arrow 1972）。
    sources:
    - Bowles 2017 JEP
    - Arrow 1972
    url: ''
  - claim: 高调道德标榜（loud virtue）的人设最脆弱，单次翻车即反噬
    verdict: 支持
    original: 🟢 强支持
    evidence: Jones & Pittman 1982：印象管理五策略中 exemplification（楷模化）最脆弱，依赖持续表演；Merritt 2010：回忆道德善行后更愿选不道德产品（道德自我许可）。
    sources:
    - Jones & Pittman 1982
    - Merritt/Effron/Monin 2010 PSPB
    url: ''
  - claim: 在短期、弱关系、自我概念受威胁情境中，道德行为会让步于利益（道德许可效应）
    verdict: 部分支持
    original: 🟡 仅在自我概念受威胁时+短期+非直接伤害行为时显著
    evidence: Mazar & Zhong 2010：购买绿色产品后更愿偷拿糖果、撒谎；Blanken 2015（Psychological Science）：该效应跨情境重复困难，存在明确边界条件。
    sources:
    - Mazar & Zhong 2010 Psychol Sci
    - Blanken/van de Ven/Zeelenberg 2015
    url: ''
  - claim: 在长期重复博弈、强声誉机制下，道德仍会普遍让步于利益
    verdict: 证伪
    original: 🔴 边界（长期衰减）
    evidence: Bowles 2017：长期重复博弈中合作期望收益更高，道德许可效应在长期关系与声誉机制下衰减；三鹿、长春长生等短期套利均长期崩溃。
    sources:
    - Bowles 2017 JEP
    - Blanken 2015 PSPB
    url: ''
  - claim: 《道德经》第二章是否定道德本身（皆知善之为善，斯不善已）
    verdict: 证伪
    original: 🔴 反对（断章取义）
    evidence: 王弼读作对立概念辩证互存、河上公读作统治者不标榜美善、魏源读作上行下效之治——三家无一家解读为'否定道德'；本章主张不言之教与无为而治。
    sources:
    - 王弼《老子注》（楼宇烈校释本）
    - 河上公《老子河上公章句》
    - 魏源《老子本义》
    url: ''
  - claim: 暴露小缺点能提升好感（Pratfall 效应），但仅限已建立能力且非道德性失误
    verdict: 支持
    original: 🟢 强支持
    evidence: Aronson 1966：有能力者犯小失误更讨人喜欢；关键边界：道德失误触发'虚伪感'而非 Pratfall；Kervyn 2022 后续支持。
    sources:
    - Aronson 1966
    - Kervyn et al. 2022 Psychological Science
    url: ''
  - claim: 主动暴露自私/道德污点能消解大众的道德评判
    verdict: 证伪
    original: 🔴 不支持
    evidence: 道德信誉机制（Monin & Miller 2001）是'先建信用后使用'，非主动暴露；主动暴露自私被读为新的人设；Sezer 2018 JPSP（9 项研究）：humblebrag 比直接自夸更招反感。
    sources:
    - Monin & Miller 2001 Psychol Sci
    - Sezer 2018 JPSP
    url: ''
  - claim: 永远自我贬低/主动降低他人期望能保护自己
    verdict: 证伪
    original: 🔴 反向（Golem 效应）
    evidence: Golem 效应：自我低期望触发他人低期望→表现受限（McNatt 2000 元分析）；Sezer 2018：'自贬+自夸'被识破时反感度高于纯抱怨；能力被低估+反感度提升双重代价。
    sources:
    - McNatt 2000 JAP
    - Sezer 2018 JPSP
    url: ''
  - claim: 人设翻车应靠事后补救（承认-道歉-纠错-补偿-持续），而非事前预防性自贬
    verdict: 支持
    original: 🔴 不支持事前自贬（SCCT 支持事后 restitution）
    evidence: Coombs 2007 SCCT：危机修复靠事后 restitution 五步；强生 Tylenol 1982 事后完美响应反而提升信任；事前自贬被读为'提前甩锅'并形成反向人设。
    sources:
    - Coombs 2007 Corporate Reputation Review
    - 强生 Tylenol 1982 案例
    url: ''
  - claim: 默默行善不标榜是跨文化的稳定智慧（儒家讷言敏行/道家/佛家/SDT 共识）
    verdict: 支持
    original: 🟢 强支持
    evidence: 《论语》讷言敏行、《道德经》太上不知有之/信言不美、《金刚经》应无所住，与 SDT authenticity 满足自主性需要一致；区别于视频的'策略性反向管理'（假无为）。
    sources:
    - 《论语·宪问》
    - 《道德经》17/81 章
    - Ryan & Deci 2000 American Psychologist
    url: ''
  - claim: 坦诚承认自利动机（而非包装成道德）是心理更健康的表达方式，但有文化边界
    verdict: 部分支持
    original: 🟡 慎用（SDT×斯密×墨子支持；东亚集体主义边界）
    evidence: Ryan & Deci 2000：压制真实动机会致自我疏离与内化失调；斯密双轨与墨子'兼相爱交相利'支持义利兼容；但 Markus & Kitayama 1991：东亚'自我'受关系网络塑造，跨文化需校准。
    sources:
    - Ryan & Deci 2000 American Psychologist
    - Smith 1759/1776
    - Markus & Kitayama 1991 Psychol Rev
    url: ''
- theme: 了不起的我-科学依据
  category: 6_个人成长方法论/6.7_独立专题核验
  report_file: 了不起的我-科学依据调研报告.md
  claims:
  - claim: 接纳承诺疗法（ACT）能改善抑郁、焦虑等心理问题，对对照组效应量为中到大
    verdict: 支持
    original: ✅ 接纳有独立实证支持（g=0.42-0.82）
    evidence: 多项元分析一致：Powers 2009（18 RCTs, n=917）g=0.42；A-Tjak 2015（39 RCTs, n=1821）g=0.57；Keulen 2025 青年（65 RCTs, n=5283）g=0.72；Zhao 2023 抑郁 SMD=-1.05
    sources:
    - Powers et al. 2009（18 RCTs, n=917）
    - A-Tjak et al. 2015（39 RCTs, n=1821）
    - Keulen et al. 2025（65 RCTs, n=5283）
    - Hayes & King 2024（约 1000 项 RCT 回顾）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4244236/
  - claim: ACT 的疗效优于认知行为疗法（CBT）
    verdict: 证伪
    original: ns（与 CBT 无显著差异，p=0.14）——'书中隐含 ACT 优于 CBT 的暗示需要修正'
    evidence: 多项元分析一致显示 ACT vs CBT 无显著差异：A-Tjak 2015 p=0.14；Öst 2014（60 RCTs, n=4234）g=0.16 ns；抑郁专项研究中 vs CBT 反而不利 ACT（Zhao 2023）
    sources:
    - A-Tjak et al. 2015
    - Öst 2014（60 RCTs, n=4234）
    - Zhao et al. 2023（11 RCTs, n=962）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4718567/
  - claim: '''外化声音+拉偏架''对应的认知解离是 ACT 产生疗效的关键中介机制'
    verdict: 部分支持
    original: ✅ 有效但非 ACT 独有（7/8 项中介显著）
    evidence: Stockton 综述：8 项中介分析中 7 项显著；但 MASEM（k=9）不显著，5 项调节中介中 4 项不显著——认知解离可能并非 ACT 独有机制，CBT 或经不同路径起效
    sources:
    - Stockton et al. 认知解离中介综述
    - MASEM 元分析结构方程（k=9）
    url: https://eprints.whiterose.ac.uk/id/eprint/137915/3/ACT%20Mediation%20Review%20%28final%20submission%29.pdf
  - claim: 自我慈悲训练能显著减少反刍思维、抑郁和自我批判
    verdict: 支持
    original: ✅ 强支持
    evidence: Ferrari 2019 元分析（27 RCTs）：反刍 g=1.37、抑郁 g=0.66、自我批判 g=0.56；Wakelin 2021（20 RCTs）自我批判减少 g=0.51 [0.33-0.69]
    sources:
    - Ferrari et al. 2019 元分析（27 RCTs）
    - Wakelin et al. 2021 元分析（20 RCTs）
    url: https://self-compassion.org/wp-content/uploads/2019/08/Ferrari2019.pdf
  - claim: '''自我攻击才是痛苦根源''——自我批判与抑郁及精神病理强相关'
    verdict: 支持
    original: ✅ 核心机制成立（批判↔抑郁 r=0.53）
    evidence: Buric 2026（256 项研究，N=107,304）：自我慈悲与精神病理 r=-0.50；自我批判（非慈悲维度）与抑郁 r=+0.53，为三维度中最强关联
    sources:
    - Buric et al. 2026（N=107,304）
    - Neff 2023 Annual Review
    url: https://doi.org/10.1007/s12671-026-02832-8
  - claim: 自我慈悲不等于自我放纵，不会削弱动机，反而增加自我改进动机与健康行为
    verdict: 支持
    original: ✅ 强支持
    evidence: Breines & Chen 2012：自我慈悲增加而非减少自我改进动机（与掌握目标正相关）；Phillips & Hine 2021 元分析（94 项）：与健康促进行为（戒烟、锻炼等）正相关
    sources:
    - Breines & Chen 2012
    - Phillips & Hine 2021 元分析（94 项）
    - Muris et al. 2025（自我慈悲≠自恋）
    url: https://hqinstitute.org/wp-content/uploads/sites/5/2022/09/Breines_Chen_SelfCompMotivation.2012.pdf
  - claim: 行为激活疗法（BA，直接安排行动绕过动机）对抑郁有效，效果与 CBT 相当
    verdict: 支持
    original: ✅ 小行为启动有实证（BA g=0.67-0.85）
    evidence: Cuijpers 2026 最大元分析（105 RCTs, N=13,933）：SMD=0.67，12 个月仍显著；BA vs CBT SMD=0.04 无显著差异（27 个比较）；Ekers 2014 g=0.74（26 RCTs）
    sources:
    - Cuijpers et al. 2026（105 RCTs, N=13,933）
    - Ekers et al. 2014（26 RCTs, n=1524）
    - Uphoff et al. 2020 Cochrane（RR 1.40）
    url: https://doi.org/10.1016/j.cpr.2026.102783
  - claim: '''行动不需要动力，行动本身就是动力的来源''——可以先行动再产生动机'
    verdict: 支持
    original: ✅ 强支持
    evidence: 神经科学：多巴胺主要响应努力与目标追求而非奖励消费（Salamone & Correa）；BA 核心机制即绕过动机直接启动行为；实施意图 d=0.65（Gollwitzer & Sheeran 2006）
    sources:
    - Salamone & Correa 2012/2024 多巴胺与努力综述
    - Gollwitzer & Sheeran 2006 实施意图元分析（d=0.65）
    - Martell et al. 2010 行为改变先于认知改变
    url: https://doi.org/10.1146/annurev-psych-020223-012208
  - claim: 宏大的'100% 改变计划'注定失败，微小行动（5% 扰动）是更可靠的改变方式
    verdict: 部分支持
    original: 🟡 方向对，但无直接 RCT
    evidence: BA 理论：大行为门槛导致回避（Martell 2010）；实施意图 d=0.65 支持小行为启动；但该命题本身无直接 RCT 检验，'5%扰动'实证基础来自 BA 与实施意图而非微习惯
    sources:
    - Martell et al. 2010 行为激活理论
    - Gollwitzer & Sheeran 2006（d=0.65）
    url: ''
  - claim: 一个新习惯平均 21 天即可养成
    verdict: 证伪
    original: ❌ 21天说法被否定（中位数 66 天）
    evidence: Lally 2010 追踪研究：习惯形成中位数 66 天（区间 18-254 天）；YAML 补充：中位 59-66 天、平均 106-154 天，个体差异 4-335 天
    sources:
    - Lally et al. 2010 习惯形成追踪研究
    url: ''
  - claim: '''5% 扰动''/微习惯方法本身有独立实验证据支持'
    verdict: 存疑
    original: ⚠️ 实验室难以诱导习惯（de Wit 2018 五次失败）
    evidence: de Wit 2018 五项预注册实验均未能在健康人中实验性诱导出习惯，习惯增益可能消散；BJ Fogg 模型（50 万+数据点）非严格 RCT
    sources:
    - de Wit et al. 2018（五次实验性习惯诱导失败）
    - BJ Fogg Tiny Habits 数据（非 RCT）
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6033090/
  - claim: '''意志力是有限资源、会被消耗''的 ego depletion（自我损耗）模型成立'
    verdict: 证伪
    original: ❌ 已崩塌（d=0.04-0.06）
    evidence: Hagger 2016 多中心预注册复制（23 实验室, N=2141）：d=0.04 零效应；Vohs 2021（36 实验室, N=3531）：d=0.06，贝叶斯 4.4 倍支持零假设；替代解释为动机/注意力转移
    sources:
    - Hagger et al. 2016 多中心复制（23 实验室, N=2141）
    - Vohs et al. 2021（36 实验室, N=3531）
    - Inzlicht et al. 2021 过程模型
    url: ''
  - claim: '''想改变''本身就是问题——渴望成为''应该的自己''会阻碍自我发展'
    verdict: 部分支持
    original: 🟡 方向对，但需细化
    evidence: ACT 研究支持过度经验性回避（执着于'应该的自己'）与心理病理相关；但'改变动机'本身不是问题，原表述过度概括
    sources:
    - ACT 经验性回避与心理病理研究（Hayes 等）
    url: ''
  - claim: 真正的自律是减少需要硬撑（依赖意志力）的场景，而非意志力更强
    verdict: 部分支持
    original: 🟡 部分支持
    evidence: ego depletion 崩塌后'消耗有限意志力'表述需修正；但环境设计与习惯固化（中位 66 天、d=0.65 实施意图）支持'减少意志力依赖'这一方向
    sources:
    - Lally et al. 2010 习惯形成研究
    - Inzlicht et al. 2021 动机/注意力转移过程模型
    url: ''
  - claim: '''黑色想象''（主动预想最坏情况）是经独立验证的有效心理工具'
    verdict: 存疑
    original: 🟡 方向对，缺乏直接证据（弱-中，无独立 RCT）
    evidence: 仅有斯多葛哲学与 ACT'创造性绝望'的理论同源支持，无独立 RCT 检验该工具本身；属 ACT 已验证机制的通俗包装
    sources:
    - 斯多葛哲学传统
    - ACT 创造性绝望理论
    url: ''
- theme: 吸引力法则科学依据
  category: 6_个人成长方法论/6.7_独立专题核验
  report_file: 吸引力法则科学依据调研报告.md
  claims:
  - claim: '''思维通过宇宙力量吸引对应事件''（吸引力法则内核）成立'
    verdict: 证伪
    original: ❌ 无证据（多项元分析否定，归为伪科学）
    evidence: Mayo Clinic 元分析：23 项独立测试、3,000+ 受试者，未发现可视化/积极思考/祈祷能有意影响身体健康结果的证据
    sources:
    - Mayo Clinic meta-analysis
    url: ''
  - claim: 量子物理学支持吸引力法则（观察者效应/量子纠缠证明意识创造现实）
    verdict: 证伪
    original: ❌ 伪科学
    evidence: 2026 Frontiers 综述：量子意识讨论'术语驱动而非证据驱动'；量子坍缩由退相干引起；Chopra 2026 公开撤回'意识导致坍缩'主张
    sources:
    - Frontiers in Psychology 2026 综述
    - Deepak Chopra 2026 公开更正
    url: https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2026.1730965/full
  - claim: 保持积极心态有助于成功与健康
    verdict: 部分支持
    original: ✅ 有条件支持
    evidence: 有效部分的机制是行为改变与情绪调节，而非'宇宙吸引'；效果远不如声称的强大，且需配合行动
    sources: []
    url: ''
  - claim: 设定具体且有挑战性的目标能提升绩效
    verdict: 支持
    original: ✅ 强支持
    evidence: Locke & Latham 50 年研究、100+ 任务、40,000+ 参与者、8+ 国家：具体挑战性目标 d=0.42-0.82，目标难度与绩效线性正相关
    sources:
    - Locke & Latham 2002 American Psychologist
    url: https://med.stanford.edu/content/dam/sm/s-spire/documents/PD.locke-and-latham-retrospective_Paper.pdf
  - claim: 纯积极可视化（生动想象成功画面）能让目标成真
    verdict: 证伪
    original: ❌ 反效果
    evidence: Oettingen 系列研究：纯积极幻想降低随后努力、能量水平与收缩压（大脑把想象当已实现）；替代方案 WOOP 在多项 RCT 中有效
    sources:
    - Oettingen 系列（NYU）
    - WOOP 多项 RCT
    url: https://www.psychologytoday.com/us/blog/new-take/201512/the-simple-technique-for-achieving-your-goals
  - claim: 感恩练习能改善幸福感（生活满意度、焦虑、抑郁）
    verdict: 支持
    original: ✅ 支持（小而稳健）
    evidence: Choi 2025 元分析（145 篇 N=24,804）：g=0.19，对出版偏倚稳健；Diniz 2023（64 项 RCT）：生活满意度+6.86%、焦虑-7.76%、抑郁-6.89%
    sources:
    - Choi et al. 2025 meta
    - Diniz et al. 2023 meta
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12280877/
  - claim: 信奉显化（manifesting）信念能提升客观成功水平
    verdict: 证伪
    original: ❌ 无效果
    evidence: Dixon 2023（N=1,023）：信奉者主观感到更成功，但收入与教育程度无差异；更偏好高风险投资、更可能经历破产（魔法思维）
    sources:
    - Dixon et al. 2023 Personality and Social Psychology Bulletin
    url: https://journals.sagepub.com/doi/10.1177/01461672231181162
  - claim: NLP（神经语言程序学）为吸引力法则提供了科学验证
    verdict: 证伪
    original: ❌ NLP 本身缺乏证据
    evidence: Witkowski 2010（35 年综合）：54.5% 同行评审研究不支持 NLP、仅 18.2% 支持；NHS 不推荐；101 位顶尖心理学家将其列为最不受认可实践之一
    sources:
    - Witkowski 2010
    - Sturt et al. 2012 BJGP
    - Norcross & Koocher 2006
    url: https://bjgp.org/content/62/604/e757
  - claim: 网状激活系统（RAS）是'吸引你所关注之物'的神经基础
    verdict: 证伪
    original: ❌ 被过度简化/误用
    evidence: RAS 核心功能是调节注意力过滤，只影响你注意到哪些已存在的刺激，不具备'吸引'外部事件的能力（StatPearls）
    sources:
    - 'StatPearls: Reticular Activating System'
    url: https://www.ncbi.nlm.nih.gov/books/NBK549835/
  - claim: 自我实现预言/皮格马利翁效应使期望能较大程度改变他人表现
    verdict: 部分支持
    original: 🟡 有限的真实效果
    evidence: Rosenthal & Rubin 1978 证实效应存在，但效果量通常较小（Jussim 1986），尤其在教育成就领域；不能外推为'思想创造一切经历'
    sources:
    - Rosenthal & Rubin 1978
    - Jussim 1986
    url: ''
  - claim: 心智训练（运动意象）可以改变大脑并改善实际动作表现
    verdict: 支持
    original: ✅（但限于内部神经变化，非吸引外部事件）
    evidence: Ridderinkhof 2019：仅想象拇指运动即在初级运动皮层诱导可塑性；Gippert 2025 PNAS：运动意象改善实际执行表现
    sources:
    - Ridderinkhof et al. 2019 Scientific Reports
    - Gippert et al. 2025 PNAS
    url: https://doi.org/10.1073/pnas.2423642122
  - claim: 观察者效应证明'意识导致量子坍缩、心灵可以影响物质'
    verdict: 证伪
    original: ❌ 物理学误用（von Neumann 意识坍缩概念已被大量拒绝）
    evidence: 量子坍缩由环境退相干引起；No-Communication 定理禁止纠缠传信息；Chopra 2026 承认'观察者是探测器、是交互、是记录'
    sources:
    - Mroczkowski & Malozemoff 2019 JNDS
    - Frontiers in Psychology 2026
    url: https://doi.org/10.17514/jnds-2019-37-3-p201-221
  - claim: 过度信奉吸引力法则可能导致焦虑与社会职业功能障碍
    verdict: 存疑
    original: 个案报告（证据有限）
    evidence: Mehra & Chakravarty 2024（Asian Journal of Psychiatry）：32 岁女性因过度信奉出现焦虑与社会职业功能障碍；仅个案，无发生率数据
    sources:
    - Mehra & Chakravarty 2024 Asian Journal of Psychiatry
    url: ''
  - claim: 使用自助产品（吸引力法则类书籍/课程）能带来人格与幸福感的持久改变
    verdict: 证伪
    original: ❌（2026 年 2 年追踪研究）
    evidence: 2026 瑞士研究：2,391 人 2 年追踪，自助产品使用与人格/幸福感变化无关
    sources:
    - 2026 瑞士追踪研究
    url: ''
- theme: 心流可行性调研
  category: 6_个人成长方法论/6.7_独立专题核验
  report_file: 心流可行性调研报告.md
  claims:
  - claim: 把注意力比作精神能量、用'精神熵/负熵'描述意识秩序的'意识热力学'框架
    verdict: 部分支持
    original: 🟡 部分支持（隐喻有价值但非可证伪科学）
    evidence: Csikszentmihalyi 早期 ESM 研究（n≈75-100 高中生）发现注意力投入与积极体验正相关，但样本有限；无研究能测量'意识的熵值'，属隐喻而非可证伪定律
    sources:
    - Csikszentmihalyi 经验取样法（ESM）原始研究
    - Csikszentmihalyi 1990《Flow》
    url: ''
  - claim: 客观的挑战-技能平衡（倒U型匹配）会直接提升活动的享受度与参与度
    verdict: 存疑
    original: ⚠️ 存疑（最新 RCT 挑战倒U型假设）
    evidence: Cutting & Deterding 2023 预注册 RCT（n=311，AI 精确控制难度-技能比）：享受度 p=0.277、η²p=0.008 不显著；Deterding & Cutting 2023（n=309）未发现倒U型关系
    sources:
    - Cutting & Deterding 2023（n=311 预注册 RCT）
    - Deterding & Cutting 2023（CHI, n=309）
    - 既往 ESM/问卷研究（可能混淆主观感知平衡）
    url: https://doi.org/10.1098/rsos.220274
  - claim: 物质享受的快乐会迅速回归基线（享乐适应），投入型'乐趣'比被动享乐带来更持久的满足
    verdict: 支持
    original: ✅ 强证据
    evidence: Brickman & Campbell 1971 后大量复制：享乐快速回归基线；Liu et al. 2023 元分析（N=60,110）：心流与幸福感 ρ=0.52、与工作满意度 ρ=0.67
    sources:
    - Brickman & Campbell 1971 享乐适应研究
    - Kahneman 峰终定律
    - Liu et al. 2023 元分析（N=60,110, k=113）
    url: https://doi.org/10.1016/j.jvb.2023.103891
  - claim: 心流会直接推动技能升级（成长螺旋），进入心流越多能力提升越快
    verdict: 部分支持
    original: 🟡 部分支持（心流促进动机，但技能升级靠刻意练习）
    evidence: 心流与创造力 ρ=0.35（Liu et al. 2023）；但 Macnamara 2014 元分析：刻意练习在职业领域仅解释 <1% 绩效方差；世界级表现者仅约 15% 时间处于心流（Gervais）
    sources:
    - Liu et al. 2023 元分析（N=60,110）
    - Macnamara, Hambrick & Oswald 2014 刻意练习元分析
    - Michael Gervais 世界级表现者访谈数据
    url: https://doi.org/10.1016/j.jvb.2023.103891
  - claim: 自成目的性（为做事本身而做）与内在动机相关，且心流干预能实际提升幸福感与投入
    verdict: 支持
    original: ✅ 强证据
    evidence: Deci et al. 2001 元分析（n=128）：内在动机与绩效、创造力、坚持性正相关；Ludwigs et al. 2019 Trivago Flowlab RCT（n=253）证实心流干预提升工作幸福感与投入
    sources:
    - Deci et al. 2001 元分析（n=128）
    - Deci & Ryan 自我决定理论（SDT）
    - Ludwigs et al. 2019（RCT n=253）
    url: https://doi.org/10.1007/s11482-019-09736-x
  - claim: 放下焦虑性控制反而获得最优掌控（'越想控制越失控'）
    verdict: 部分支持
    original: 🟡 部分支持（有相关性证据，缺因果验证）
    evidence: 心流研究支持'停止焦虑性控制后掌控感增强'，与 Yerkes-Dodson 定律（适度唤醒最佳）一致；但均为事后相关，缺乏'放下控制→更优表现'的前瞻因果实验
    sources:
    - Yerkes-Dodson 定律相关研究
    - 心流体验者自我报告研究
    url: ''
  - claim: 结构化的身体与感官活动（运动、品鉴训练）比被动休闲更容易产生心流
    verdict: 支持
    original: ✅ 强证据
    evidence: 运动心理学大量研究支持运动中的心流体验；Liu et al. 2023 元分析：心流与工作投入 ρ=0.73，支持'结构化活动更易产生心流'；感官鉴赏训练研究支持意识复杂度提升
    sources:
    - 运动心理学心流研究
    - Liu et al. 2023 元分析（N=60,110）
    url: https://doi.org/10.1016/j.jvb.2023.103891
  - claim: 对多数上班族，工作比被动休闲产生更多心流时刻（约 3 倍）并带来更高投入与满足
    verdict: 支持
    original: ✅ 强证据（拆书笔记中证据最强的主张之一）
    evidence: ESM 数据显示工作时心流时刻约为休闲的 3 倍；Liu et al. 2023 元分析（N=60,110, k=113）：心流-工作投入 ρ=0.73、-满意度 ρ=0.67；注意自主性高的工作与被动工作差异巨大
    sources:
    - Csikszentmihalyi ESM 数据
    - Liu et al. 2023 元分析（N=60,110, k=113）
    - Frontiers in Psychology 2023 叙事综述
    url: https://doi.org/10.1016/j.jvb.2023.103891
  - claim: 逆境是心流的原料：经历越大的逆境，重建秩序后获得的心流与成长越强
    verdict: 存疑
    original: ⚠️ 存疑（PTG 存在但过度乐观）
    evidence: 创伤后成长（Tedeschi & Calhoun）确实存在但只发生在部分人群，且 PTG 不等于心流；'熵越大重建后负熵越强'无直接实证，有被误读为'受苦有益论'的风险
    sources:
    - Tedeschi & Calhoun 创伤后成长（PTG）研究
    - 弗兰克尔集中营研究（仅支持'态度自由'概念）
    url: ''
  - claim: 人生需要统一的生命主题/三层目标对齐才有意义感
    verdict: 存疑
    original: ⚠️ 存疑（有意义感研究支持，但'对齐'缺验证）
    evidence: Steger 2009 支持意义感与幸福感正相关，但不支持'必须统一目标才有意义'；多元目标的人同样可以幸福；'三层目标对齐'缺乏实证验证
    sources:
    - Steger 2009 意义感纵向研究
    - McAdams 叙事心理学'生命故事'
    url: ''
  - claim: 学习中的心流体验与学业成绩正相关
    verdict: 支持
    original: 元分析汇总：学习心流→学业成绩 r=0.43（95% CI 不含 0）
    evidence: Zhang & Fang 2023 教育领域元分析（n=3,253）：学习心流与学业成绩 r=0.43（95% CI [0.28, 0.57]），中等正相关
    sources:
    - Zhang & Fang 2023 学习心流元分析（n=3,253）
    url: https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2023.1270642/full
  - claim: 心流中自我意识消失，且心流结束后自我感会变得更强大
    verdict: 部分支持
    original: 🟡 部分支持（有 EEG 证据，缺纵向验证）
    evidence: EEG 研究发现心流时 alpha 波增强，可能与自我意识抑制有关；但神经科学证据'稀少且无结论性'（样本通常 n<30），'出来后自我更强大'缺乏纵向验证
    sources:
    - 心流 EEG 研究（alpha 波增强）
    - Ding et al. 2013 fMRI 瞬时前额叶功能低下研究
    url: ''
  - claim: 最危险的心理状态不是焦虑而是冷漠（低挑战×低技能）
    verdict: 部分支持
    original: 🟡 部分支持（有理论支持，措辞过于绝对）
    evidence: 八通道模型中冷漠与抑郁、倦怠相关；退休者/闲职者抑郁研究支持'缺乏挑战导致心理萎缩'；但 Liu et al. 2023 心流-倦怠 ρ=-0.01 不显著，'最危险'措辞绝对化
    sources:
    - 八通道模型研究
    - Liu et al. 2023 元分析（心流-倦怠 ρ=-0.01）
    url: https://doi.org/10.1016/j.jvb.2023.103891
  - claim: 独处的能力决定幸福的下限（独处质量是内在秩序的体检报告）
    verdict: 存疑
    original: ⚠️ 存疑（缺乏直接实证）
    evidence: 有自我决定理论（自主性是基本需求）的理论支持，但'独处能力决定幸福下限'无直接实证；社会支持研究显示人际关系是幸福感的重要预测因子，该主张可能过度贬低社交
    sources:
    - Deci & Ryan 自我决定理论
    - 社会支持与幸福感预测研究
    url: ''
  - claim: 生活的意义不是找到的而是建构出来的，意义建构干预可提升幸福感
    verdict: 支持
    original: ✅ 强证据
    evidence: 叙事心理学（McAdams）与存在主义治疗（Frankl）高度支持；Steger 2009 纵向研究：意义感与幸福感正相关；干预研究显示'意义建构'类干预可提升幸福感
    sources:
    - McAdams 叙事心理学
    - Frankl 意义治疗
    - Steger 2009 纵向研究
    url: ''
- theme: 天道忌满人道忌全取舍留白调研
  category: 6_个人成长方法论/6.8_古典智慧应用
  report_file: 天道忌满人道忌全取舍留白调研报告.md
  claims:
  - claim: '''持而盈之不如其已''''功成身退''''知足知止''''慎终如始''等反满思想有先秦原典精确依据'
    verdict: 支持
    original: ✅ 4/4 命题 ✅
    evidence: 《道德经》9/24/44/45/64 章 + 《周易》乾卦上九'亢龙有悔' + 《尚书·旅獒》精确锁定章节句；帛书甲乙本与王弼本互证；王弼/河上公注支撑'留白'义理。
    sources:
    - 《道德经》王弼本+帛书本
    - 《周易·乾卦》
    - ctext.org 电子化计划
