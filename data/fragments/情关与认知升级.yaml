- theme: "情关与认知升级"
  category: "6_个人成长方法论/6.3_情绪压力与韧性"
  report_file: "情关与认知升级调研报告.md"
  claims:
    - claim: "恋爱使双方自我概念重叠，分手导致自我概念内容改变与清晰度显著下降，清晰度下降独特预测分手后痛苦"
      verdict: "支持"
      original: "命题一验证 ✅"
      evidence: "Lewandowski 'Who Am I Without You?'（3项研究）：分手后自我概念清晰度显著下降且独特预测情绪痛苦；2025 PRISMA 综述（47项研究）确认分手真实改变自我概念。"
      sources: ["Lewandowski et al. 自我概念研究", "PRISMA 分手综述 2025"]
      url: ""
    - claim: "分手后恢复呈韧性/快速恢复/慢恢复/慢性痛苦四类轨迹，神经质+高反刍+认知控制差者走向慢性痛苦"
      verdict: "支持"
      original: "被动等待可能滑入慢性痛苦轨迹"
      evidence: "分手轨迹研究（n=87，30周跟踪）：慢性痛苦轨迹由神经质、反刍与认知控制差预测——'熬'不等于'过'。"
      sources: ["分手后轨迹研究 (n=87, 30周)"]
      url: ""
    - claim: "分手痛苦源于沉没成本与替代恐惧：投资模型三支柱（满意度+投资规模+替代质量）预测承诺与分手"
      verdict: "支持"
      original: "命题二精确成立 ✅"
      evidence: "Le et al. 元分析（137项研究，n≈38,000）：承诺预测分手 d=-0.832（极强）；SEM（N=499）确认投资→损失厌恶→承诺因果路径；'本来要一起做的事'（未来计划投资）预测力最强。"
      sources: ["Le et al. 投资模型元分析", "Goodfriend & Agnew", "Rusbult 投资模型"]
      url: ""
    - claim: "害怕单身会使人将就低质量关系，依恋焦虑者因恐惧改变而留在不幸福关系中"
      verdict: "支持"
      original: "JPSP 2013 验证"
      evidence: "Spielmann et al. 2013 JPSP：害怕单身提高容忍低质量关系的倾向；George 2020：依恋焦虑→恐惧改变→留在不幸福关系。"
      sources: ["Spielmann et al. 2013 JPSP", "George 2020"]
      url: ""
    - claim: "亲密关系可由社会交换/投资模型刻画，吸引力提升策略跨文化一致：提升外貌>展示才能>展示相似性"
      verdict: "支持"
      original: "命题三有完整实证链条 ✅"
      evidence: "14国伴侣价值研究（N=7,181）策略排序跨文化一致；conjoint分析（445人、5,340次滑动）：外貌1SD=选择率+20%，智力1SD仅+2%；捷克样本（N=2,280）高价值者更挑剔。"
      sources: ["14国伴侣价值研究 (N=7,181)", "conjoint 滑动分析", "捷克国民样本"]
      url: ""
    - claim: "关系条件自尊（RCSE）高者，情绪与自尊随关系事件剧烈连锁波动（'被绑在船头'而非'掌舵'）"
      verdict: "支持"
      original: "最硬核证据：Knee JPSP 2008 ✅"
      evidence: "Knee et al. 2008 JPSP（4项研究+14天日记）：RCSE高者关系事件→情绪→自尊连锁反应显著更强；Crocker 条件自尊研究：自尊绑外部领域者受挫时最脆弱。"
      sources: ["Knee et al. 2008 JPSP", "Crocker 条件自尊研究"]
      url: ""
    - claim: "把自我价值来源从外部认可转向自主成长（SDT自主导向），可获得更稳定的自尊与更低抑郁焦虑"
      verdict: "支持"
      original: "命题四验证 ✅（'向内修'=自主导向）"
      evidence: "Deci & Ryan 自我决定理论：自尊稳定来源是自主（胜任+联结为辅）而非被认可；Kasser & Ryan：强调外部认可与低自尊、抑郁、焦虑相关。"
      sources: ["Deci & Ryan 自我决定理论", "Kasser & Ryan 外部动机研究"]
      url: ""
    - claim: "被动等待（'熬过失恋'）恢复慢甚至慢性化，主动认知重构（书写+重构+自我建设）才是真正的'洗牌升级'"
      verdict: "支持"
      original: "⚠️ 关键修正：'熬'≠'过'"
      evidence: "PRISMA 综述（47研究）：恢复好的个体具备情绪调节与心理化能力——是主动技能而非时间自动馈赠；轨迹研究显示被动者滑向慢性痛苦。"
      sources: ["PRISMA 分手综述 2025", "分手轨迹研究"]
      url: ""
    - claim: "表达性书写不是万能药：对高反刍且高度意义搜寻者反而有害，应先行为激活再叙事书写"
      verdict: "支持"
      original: "🚨 本报告最重要的修正"
      evidence: "Sbarra 9个月随访：高反刍+高度意义搜寻者做情绪书写后结局更差；对比之下 Sloan 研究显示低反刍者书写后抑郁下降——效果依人群而异。"
      sources: ["Sbarra 表达性书写随访研究", "Sloan 书写干预研究"]
      url: ""
    - claim: "能把人生故事讲顺（叙事连贯性高）的人，离婚/分手后恢复更好"
      verdict: "支持"
      original: "'自我闭环'=讲一个完整的自己的故事"
      evidence: "叙事连贯性研究（N=109）：叙事连贯性高者离婚恢复更好；与 McAdams 人生故事模型及'救赎序列'一致。"
      sources: ["叙事连贯性与离婚恢复研究 (N=109)", "McAdams 人生故事模型"]
      url: ""
