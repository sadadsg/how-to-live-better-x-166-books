- theme: "个人成长方法论可行性"
  category: "6_个人成长方法论/6.1_认知与心理科学方法论"
  report_file: "个人成长方法论可行性调研报告.md"
  claims:
    - claim: "对标高阶人格'快速模仿人格'可完成迭代缩小认知差距——不成立，人格改变需数月结构化干预且效应中等"
      verdict: "证伪"
      original: "❌ 模仿'人格/能量'；'快速模仿人格缩小认知差距'在科学框架内不成立"
      evidence: "PNAS 2021 RCT（n=1,523）：3个月结构化数字干预人格改变d≈0.52，依赖主动意愿而非模仿；Nature Reviews Psychology 2024：人格改变渐进、幅度有限"
      sources: ["PNAS 2021", "Nature Reviews Psychology 2024"]
      url: "https://www.pnas.org/doi/abs/10.1073/pnas.2017548118"
    - claim: "榜样与导师对职业发展确有正向作用，但客观效应量小（薪酬r≈.12、晋升r≈.31），远非'机遇自然发生'的风口"
      verdict: "部分支持"
      original: "导师制元分析——客观效应小，主观满意度效应更大"
      evidence: "Allen & Eby 2004元分析：薪酬r=.12、晋升r=.31；榜样效应元分析（24项研究538个估计）对成绩平均仅0.030 SD，校正发表偏倚后可能归零"
      sources: ["Allen & Eby 2004", "de Gendre et al. 2023"]
      url: "https://pubmed.ncbi.nlm.nih.gov/14769125/"
    - claim: "选导师应看深层相似性而非咖位：深层相似是导师质量最强预测因子（1 SD相似→职业支持+0.52 SD）"
      verdict: "支持"
      original: "最强预测因子：1 SD 深层相似→职业支持 +0.52 SD"
      evidence: "导师研究显示深层相似性（价值观、路径、背景）是导师质量最强预测因子，建议选只领先自己1-2个台阶的人"
      sources: []
      url: ""
    - claim: "向上社会比较显著中介焦虑与抑郁，把对标对象当标尺会损害心理健康"
      verdict: "支持"
      original: "向上社会比较显著中介焦虑与抑郁（中国18-35岁样本研究证实）"
      evidence: "中国18-35岁样本研究证实向上社会比较显著中介焦虑与抑郁；建议与昨天的自己比、把对标对象当信息源而非标尺"
      sources: []
      url: ""
    - claim: "弱连接有因果证据但呈倒U型：'中等偏弱'关系最有效，不是攀附越强的人越好"
      verdict: "支持"
      original: "弱连接理论获2022年Science因果验证，但呈倒U型"
      evidence: "LinkedIn 2000万用户随机实验（Science 2022）：弱连接助力求职获因果验证，但中等偏弱关系最有效"
      sources: ["LinkedIn实验 2022"]
      url: "https://pubmed.ncbi.nlm.nih.gov/36107999/"
    - claim: "情绪可通过社交网络传染但效应极小（d≈0.02），'能量污染'表述夸大强度"
      verdict: "部分支持"
      original: "情绪传染真实存在，但效应量很小，'能量污染'表述夸大了强度"
      evidence: "Facebook 68万人实验（PNAS 2014）：情绪传染存在但d≈0.02"
      sources: ["Kramer et al. 2014"]
      url: "https://www.pnas.org/doi/10.1073/pnas.1320040111"
    - claim: "跨阶层友谊数量是向上流动最强预测因子（收入约+20%），但属社区结构现象而非个人攀附策略"
      verdict: "支持"
      original: "Chetty 2022 Nature——最强向上流动预测因子，但是社区结构性现象"
      evidence: "Chetty 2022 Nature（210亿对好友数据）：跨阶层友谊预测收入+20%；跨阶层接触一半取决于学校、社区等结构性场景"
      sources: ["Chetty et al. 2022"]
      url: "https://www.nature.com/articles/s41586-022-04996-4"
    - claim: "远离长期有毒关系有依据：每多一个'麻烦制造者'关系，生物衰老加速约9个月"
      verdict: "支持"
      original: "PNAS 2026——支持远离长期有毒关系，但不支持疏远'偶尔抱怨的朋友'"
      evidence: "PNAS 2026：每多一个'麻烦制造者'，生物衰老加速约9个月；疏远应限于持续单向索取、操控、打压型关系"
      sources: ["PNAS 2026"]
      url: "https://www.pnas.org/doi/abs/10.1073/pnas.2515331123"
    - claim: "'能量高低'作为筛选社交的标准无科学定义、不可证伪，属民哲话术"
      verdict: "证伪"
      original: "'能量'无科学定义（心理学家喻丰：民哲话术）"
      evidence: "心理学家明确定性为民哲话术；可操作替代是把'能量'翻译成可观察的有毒行为指标（持续索取、操控、贬低打压）"
      sources: []
      url: "https://www.jiemian.com/article/5390120.html"
    - claim: "社交组合多样性（亲友/熟人/陌生人均衡）独立预测幸福感，只筛'高能量者'反而损害幸福"
      verdict: "支持"
      original: "PNAS 2022（5万余人8国）——社交组合多样性独立预测幸福感"
      evidence: "PNAS 2022：5万余人8国样本，社交组合多样性独立预测幸福感"
      sources: ["PNAS 2022"]
      url: "https://www.pnas.org/doi/10.1073/pnas.2120668119"
    - claim: "'情感问题源于伴侣静态特质不达标'被证伪：关系质量由互动过程决定，静态特质无额外预测力"
      verdict: "证伪"
      original: "PNAS 2020 直接证伪核心归因"
      evidence: "Joel et al. 2020 PNAS（43个数据集、11,196对伴侣）：互动过程变量解释关系质量约45%，人格/财富/外貌等静态特质无额外预测力"
      sources: ["Joel et al. 2020"]
      url: "https://www.pnas.org/doi/abs/10.1073/pnas.1917036117"
    - claim: "'六边形战士'清单式全优择偶被实证证伪且数学上不可达，对20-35岁群体基本不可操作"
      verdict: "证伪"
      original: "❌ 清单式全优择偶被实证证伪且数学上不可达"
      evidence: "2023批判综述：特质清单对真实互动中的吸引力几乎无预测力；速配研究n=1145多维全优无法被单维清单预测；六维全优联合概率指数级萎缩"
      sources: []
      url: ""
    - claim: "持不现实择偶高标准者反而更难建立满意关系（β=-.13），标准应分底线项与加分项"
      verdict: "支持"
      original: "Bredow 2015——持不现实高标准者反而更难建立满意关系"
      evidence: "Bredow 2015：不现实高标准与关系满意度负相关（β=-.13）；建议底线项（价值观）不妥协、加分项浮动、收益在'足够好'处封顶"
      sources: ["Bredow 2015"]
      url: "https://doi.org/10.1111/pere.12091"
    - claim: "伴侣价值观/目标一致性远比静态条件重要：目标一致性与满意度r=.43，价值观相似r=.58"
      verdict: "支持"
      original: "优先价值观/目标一致性（r=.43）"
      evidence: "目标一致性与满意度r=.43；伴侣相似性元分析（Nature Human Behaviour 2023）：真实伴侣主要在价值观（r=0.58）和教育上相似；Gottman：69%冲突是永久性问题只能管理"
      sources: ["Nature Human Behaviour 2023", "Gottman"]
      url: "https://pubmed.ncbi.nlm.nih.gov/37653148/"
    - claim: "MOOC完课率极低但'社交学习者'完成度远高于非社交者，真实互动社群有学习价值"
      verdict: "支持"
      original: "社群互动机制有真实学习价值"
      evidence: "MOOC完课率中位数仅12.6%、52%注册者从未开始学习；社交学习者完成度远高于非社交者"
      sources: []
      url: ""
