- theme: "赚钱道德与人设管理"
  category: "6_个人成长方法论/6.6_财富与道德"
  report_file: "赚钱道德与人设管理调研报告.md"
  claims:
    - claim: "赚钱本质是发现并利用信息差，存在套利/咨询/教育/品牌等合法形态"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Hayek 1945：信息天然分散，利润机会普遍存在；Kirzner 1973：警觉性套利是企业家原型；Spence 1973：品牌/认证是传递私有信息的信号机制。"
      sources: ["Hayek 1945 AER", "Kirzner 1973 Competition and Entrepreneurship", "Spence 1973 QJE"]
      url: ""
    - claim: "不骗人赚不到第一桶金（欺骗是发财的必要条件）"
      verdict: "证伪"
      original: "🔴 反对"
      evidence: "Akerlof 1970 柠檬市场表明信息差获利不要求欺骗；巴菲特/华为/娃哈哈等反例；Bowles 2017：长期重复博弈中合作期望收益更高，信任可降低交易费用数十个百分点。"
      sources: ["Akerlof 1970 QJE", "Bowles 2017 JEP", "Arrow 1972"]
      url: ""
    - claim: "道德标准受阶层与资源形态塑造（如牧业荣誉文化、贫穷挤压决策）"
      verdict: "部分支持"
      original: "🟡 部分"
      evidence: "Nisbett & Cohen 1996：美国南方凶杀率为北方 2-3 倍；Mani 2013：贫穷占用约 13 个 IQ 点当量；但 Piff 2012 PNAS 发现高阶层更不道德（部分复制失败），DePaulo 1996：普通人每天撒谎 1-2 次与阶层无关。"
      sources: ["Nisbett & Cohen 1996", "Piff et al. 2012 PNAS", "DePaulo et al. 1996 JPSP"]
      url: ""
    - claim: "创业失败/被收割可转化为学习，前提是内部归因+内在动机+中等严重度失败"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Yamakawa 2015（ETP）：内部归因+内在动机+中等严重度失败→再创业最佳表现，外部归因无学习；Shepherd 2003：须先处理悲伤情绪，快速正向归因反而抑制学习。"
      sources: ["Yamakawa/Peng/Deeds 2015 ETP", "Shepherd 2003 AMR", "Sitkin & Pablo 1992 AMR"]
      url: ""
    - claim: "道德资本可长期积累并与经济资本协同，是可持续护城河"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Bowles 2017 JEP 道德经济学：道德激励相容，道德资本类似网络效应；信任作为润滑剂可降低交易费用数十个百分点（Arrow 1972）。"
      sources: ["Bowles 2017 JEP", "Arrow 1972"]
      url: ""
    - claim: "高调道德标榜（loud virtue）的人设最脆弱，单次翻车即反噬"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Jones & Pittman 1982：印象管理五策略中 exemplification（楷模化）最脆弱，依赖持续表演；Merritt 2010：回忆道德善行后更愿选不道德产品（道德自我许可）。"
      sources: ["Jones & Pittman 1982", "Merritt/Effron/Monin 2010 PSPB"]
      url: ""
    - claim: "在短期、弱关系、自我概念受威胁情境中，道德行为会让步于利益（道德许可效应）"
      verdict: "部分支持"
      original: "🟡 仅在自我概念受威胁时+短期+非直接伤害行为时显著"
      evidence: "Mazar & Zhong 2010：购买绿色产品后更愿偷拿糖果、撒谎；Blanken 2015（Psychological Science）：该效应跨情境重复困难，存在明确边界条件。"
      sources: ["Mazar & Zhong 2010 Psychol Sci", "Blanken/van de Ven/Zeelenberg 2015"]
      url: ""
    - claim: "在长期重复博弈、强声誉机制下，道德仍会普遍让步于利益"
      verdict: "证伪"
      original: "🔴 边界（长期衰减）"
      evidence: "Bowles 2017：长期重复博弈中合作期望收益更高，道德许可效应在长期关系与声誉机制下衰减；三鹿、长春长生等短期套利均长期崩溃。"
      sources: ["Bowles 2017 JEP", "Blanken 2015 PSPB"]
      url: ""
    - claim: "《道德经》第二章是否定道德本身（皆知善之为善，斯不善已）"
      verdict: "证伪"
      original: "🔴 反对（断章取义）"
      evidence: "王弼读作对立概念辩证互存、河上公读作统治者不标榜美善、魏源读作上行下效之治——三家无一家解读为'否定道德'；本章主张不言之教与无为而治。"
      sources: ["王弼《老子注》（楼宇烈校释本）", "河上公《老子河上公章句》", "魏源《老子本义》"]
      url: ""
    - claim: "暴露小缺点能提升好感（Pratfall 效应），但仅限已建立能力且非道德性失误"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Aronson 1966：有能力者犯小失误更讨人喜欢；关键边界：道德失误触发'虚伪感'而非 Pratfall；Kervyn 2022 后续支持。"
      sources: ["Aronson 1966", "Kervyn et al. 2022 Psychological Science"]
      url: ""
    - claim: "主动暴露自私/道德污点能消解大众的道德评判"
      verdict: "证伪"
      original: "🔴 不支持"
      evidence: "道德信誉机制（Monin & Miller 2001）是'先建信用后使用'，非主动暴露；主动暴露自私被读为新的人设；Sezer 2018 JPSP（9 项研究）：humblebrag 比直接自夸更招反感。"
      sources: ["Monin & Miller 2001 Psychol Sci", "Sezer 2018 JPSP"]
      url: ""
    - claim: "永远自我贬低/主动降低他人期望能保护自己"
      verdict: "证伪"
      original: "🔴 反向（Golem 效应）"
      evidence: "Golem 效应：自我低期望触发他人低期望→表现受限（McNatt 2000 元分析）；Sezer 2018：'自贬+自夸'被识破时反感度高于纯抱怨；能力被低估+反感度提升双重代价。"
      sources: ["McNatt 2000 JAP", "Sezer 2018 JPSP"]
      url: ""
    - claim: "人设翻车应靠事后补救（承认-道歉-纠错-补偿-持续），而非事前预防性自贬"
      verdict: "支持"
      original: "🔴 不支持事前自贬（SCCT 支持事后 restitution）"
      evidence: "Coombs 2007 SCCT：危机修复靠事后 restitution 五步；强生 Tylenol 1982 事后完美响应反而提升信任；事前自贬被读为'提前甩锅'并形成反向人设。"
      sources: ["Coombs 2007 Corporate Reputation Review", "强生 Tylenol 1982 案例"]
      url: ""
    - claim: "默默行善不标榜是跨文化的稳定智慧（儒家讷言敏行/道家/佛家/SDT 共识）"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "《论语》讷言敏行、《道德经》太上不知有之/信言不美、《金刚经》应无所住，与 SDT authenticity 满足自主性需要一致；区别于视频的'策略性反向管理'（假无为）。"
      sources: ["《论语·宪问》", "《道德经》17/81 章", "Ryan & Deci 2000 American Psychologist"]
      url: ""
    - claim: "坦诚承认自利动机（而非包装成道德）是心理更健康的表达方式，但有文化边界"
      verdict: "部分支持"
      original: "🟡 慎用（SDT×斯密×墨子支持；东亚集体主义边界）"
      evidence: "Ryan & Deci 2000：压制真实动机会致自我疏离与内化失调；斯密双轨与墨子'兼相爱交相利'支持义利兼容；但 Markus & Kitayama 1991：东亚'自我'受关系网络塑造，跨文化需校准。"
      sources: ["Ryan & Deci 2000 American Psychologist", "Smith 1759/1776", "Markus & Kitayama 1991 Psychol Rev"]
      url: ""
