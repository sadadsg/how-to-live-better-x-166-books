- theme: "最科学学习时间"
  category: "6_个人成长方法论/6.2_学习与深度工作"
  report_file: "最科学学习时间调研报告.md"
  claims:
    - claim: "不存在适用于所有人的统一'黄金学习时段'，最佳时间因时型、记忆类型与年龄而异"
      verdict: "支持"
      original: "✅ 核心结论（科学共识）"
      evidence: "Brunel 2024 系统综述（65 项研究 18 国）：80%+ 研究显示时型同步效应；通用窗口上午 9-11 点高分者比例最高 69.2%，但约 25% 的人并非最佳"
      sources: ["Brunel University 2024 systematic review", "Nature Communications 2021"]
      url: "https://bura.brunel.ac.uk/bitstream/2438/31067/6/FullText.pdf"
    - claim: "在与自身生物节律高峰同步的时段学习，认知效率最高（同步效应）"
      verdict: "支持"
      original: "✅（80% 以上研究支持）"
      evidence: "Nature Comms 2021 n=32：晨型早晨工作记忆命中 65.4% vs 傍晚 57.2%；夜型晚间 72.7% vs 早晨 62.7%；同步效应在注意/抑制/记忆任务最明显"
      sources: ["Nature Communications 2021", "Brunel University 2024"]
      url: "https://www.nature.com/articles/s41467-021-24885-0"
    - claim: "'早晨是所有人记忆力最好的时间'"
      verdict: "证伪"
      original: "❌ 误区 1"
      evidence: "约 30% 的人早晨最佳、30% 下午最佳、30% 晚上最佳、10% 无明显偏向（Rita Dunn 1978）"
      sources: ["Dunn 1978"]
      url: ""
    - claim: "'5 点起床的人更成功'——早起本身带来成功"
      verdict: "证伪"
      original: "❌ 误区 2"
      evidence: "Randler 2026：5 点神话忽略个体差异，强迫夜型人早起导致睡眠债务、注意力下降和情绪问题；成功来自与自身节律对齐"
      sources: ["Randler 2026 The Conversation"]
      url: "https://theconversation.com/the-5am-myth-why-waking-early-wont-make-you-more-successful-276031"
    - claim: "睡前临时抱佛脚（cramming）是高效的学习方式"
      verdict: "证伪"
      original: "❌ 误区 3"
      evidence: "间隔学习长期准确率约 65% vs 临时抱佛脚约 34%；熬夜还消除了睡眠依赖的记忆巩固过程"
      sources: ["Cepeda et al. 2008 Psychological Science"]
      url: "https://laplab.ucsd.edu/articles/Cepeda%20et%20al%202008%5Fpsychsci.pdf"
    - claim: "学习时间越长效果越好"
      verdict: "证伪"
      original: "❌ 误区 4（倒 U 型）"
      evidence: "学习时间与成绩呈倒 U 型；世界级表演者每天高质量练习不超过 3.5 小时，多数人深度专注上限 4-6 小时；4 小时专注优于 8 小时分心"
      sources: ["Ericsson 刻意练习研究"]
      url: ""
    - claim: "重读课本是有效的复习方式"
      verdict: "证伪"
      original: "❌ 误区 5"
      evidence: "Dunlosky 2013 大综述：重读被评为'低实用性'；仅练习测试与分布式练习被评为高实用性"
      sources: ["Dunlosky et al. 2013 Psychological Science in the Public Interest"]
      url: ""
    - claim: "考前通宵复习是值得的"
      verdict: "证伪"
      original: "❌ 误区 6"
      evidence: "通宵消除当天学习的巩固窗口并损害次日编码能力（Matt Walker：练习+睡眠才能完美）；学到午夜+睡 6-7 小时优于通宵"
      sources: ["Matt Walker / UC Berkeley 睡眠研究"]
      url: ""
    - claim: "不同记忆类型的最佳学习时间不同：陈述性记忆宜下午学，程序性记忆宜睡前 1-2 小时练"
      verdict: "支持"
      original: "✅（PLOS ONE 2012）"
      evidence: "PLOS ONE 2012 n=50：陈述性记忆下午（睡前 3-5h）佳、为海马 LTP 留窗口；程序性记忆睡前 1-2h 最大化睡眠依赖离线增益"
      sources: ["PLOS ONE 2012"]
      url: "https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0040963"
    - claim: "夜型青少年在下午/晚间上课的学业表现优于清晨上课"
      verdict: "支持"
      original: "✅（随机实验）"
      evidence: "阿根廷随机实验 n=753：夜型青少年下午班（12:40）与晚间班（17:20）表现显著优于上午班（07:45）"
      sources: ["Nature Human Behaviour 2020"]
      url: "https://www.nature.com/articles/s41562-020-0820-2"
    - claim: "午后小睡能提升认知功能（执行功能与记忆）"
      verdict: "支持"
      original: "✅"
      evidence: "2025 元分析（42 项研究 n=1,751）：午后小睡对认知 g=0.59 中等正向；20 分钟午睡显著提高表现（OR=2.5）"
      sources: ["心理发展与教育 2025 元分析"]
      url: "https://devpsy.bnu.edu.cn/CN/Y2025/V41/I2/173"
    - claim: "上午 9-11 点是对所有人都最优的学习时段"
      verdict: "部分支持"
      original: "🟡 通用参考窗口，非普适"
      evidence: "Pope 2014（近 200 万学生）：上午数学课 GPA 高 0.072（约教师质量 1/4 标准差）；但该时段仅 69.2% 高分，仍有约 25-30% 的人非最佳"
      sources: ["Pope 2014"]
      url: "http://www.econweb.umd.edu/~pope/morning_afternoon.pdf"
    - claim: "最优复习间隔约等于距考试时间的 10-20%（Cepeda 公式）"
      verdict: "支持"
      original: "✅（1,350+ 人里程碑实验）"
      evidence: "Cepeda 2008：最优间隔为滞留时间的 10-20%，间隔学习使回忆率提高 64%（d=1.1）"
      sources: ["Cepeda et al. 2008 Psychological Science"]
      url: "https://laplab.ucsd.edu/articles/Cepeda%20et%20al%202008%5Fpsychsci.pdf"
