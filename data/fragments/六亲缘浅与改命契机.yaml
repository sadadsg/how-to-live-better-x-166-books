- theme: "六亲缘浅与改命契机"
  category: "6_个人成长方法论/6.4_关系婚恋与形象"
  report_file: "六亲缘浅与改命契机调研报告.md"
  claims:
    - claim: "'六亲缘浅'人群的'独立'是真正觉醒/内在稳定的表现"
      verdict: "部分支持"
      original: "🟡 部分支持：回避型'独立'是防御策略，不是觉察"
      evidence: "Mikulincer & Shaver 2005：回避型的'独立'是去激活防御策略；Fraley 2002 元分析：回避型成人表面独立但皮质醇未降低，应激未真正消解"
      sources: ["Mikulincer & Shaver 2007《Attachment in Adulthood》", "Fraley & Shaver 2000", "Simpson et al. 1996"]
      url: "https://www.guilford.com/books/Attachment-in-Adulthood/Mikulincer-Shaver/9781593854430"
    - claim: "孤独可以转化为成长，但依赖认知重评、安全依恋/社会支持等前提，非必然"
      verdict: "部分支持"
      original: "🟡 部分支持：PTG 有基础但非必然"
      evidence: "Park 2010 meta：PTG 效应量小（d=0.15-0.40）且与心理健康改善不同步；Rzeszutek 2015：PTG 与社会支持正相关 r≈.20-.30；反刍式孤独导向抑郁（Nolen-Hoeksema 2001）"
      sources: ["Tedeschi & Calhoun 1996/2004 (PTG)", "Park 2010 meta", "Nolen-Hoeksema 2001"]
      url: "https://psycnet.apa.org/record/1996-03415-001"
    - claim: "孤独感是'命格特殊'的觉醒信号（先天命理禀赋）"
      verdict: "存疑"
      original: "🟡 部分支持；'命格特殊'无实证、不可证伪（玄学概念）"
      evidence: "报告标注：'命格特殊'不是可证伪的科学命题；其可转化对应物（成长型心智 Dweck 2006、意义感 Steger 2006）是主观框架与可习得技能，非命理禀赋"
      sources: ["Dweck 2006", "Steger 2006"]
      url: ""
    - claim: "'不受人情绑架、能量自由流动'= 切断关系即健康自主"
      verdict: "证伪"
      original: "❌ 部分证伪：Relatedness 不可省略，防御性切断≠健康自主"
      evidence: "Ryan & Deci 2000 SDT：自主、胜任、关联缺一则幸福感不可持续；Holt-Lunstad 2010 meta（n=308,849）：社会隔离死亡风险增加26-32%；健康方式是连接中设边界"
      sources: ["Ryan & Deci 2000 (SDT)", "Holt-Lunstad et al. 2010 meta", "Cacioppo & Patrick 2008"]
      url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3150158/"
    - claim: "'断代修行者'能打破家族宿命轮回（代际创伤可逆）"
      verdict: "部分支持"
      original: "🟡 部分支持：代际创伤可逆有科学基础，但'修行者'是叙事包装"
      evidence: "Yehuda 2015：Holocaust 母亲创伤影响后代 DNA 甲基化；Weaver 2004：环境丰富化可逆转部分甲基化效应；真实路径是心理治疗+安全依恋，非'修行'标签"
      sources: ["Yehuda 2015", "Weaver 2004", "Bowen 1978", "Felitti 1998 (ACEs)"]
      url: "https://pubmed.ncbi.nlm.nih.gov/25740992/"
    - claim: "缘分来去随缘，关系不必主动强求维护"
      verdict: "部分支持"
      original: "🟡 部分支持：自然发生的高质量关系有证据，但主动维护更持久"
      evidence: "Reis 2012：感知伴侣回应性是关系满意度最强预测因子（r≈.6-.7）；社会支持网络随年龄衰减（Siedlecki 2013），不主动维护增加晚年孤立风险"
      sources: ["Reis 2012 感知回应性", "Siedlecki 2013", "Kansky 2016"]
      url: "https://psycnet.apa.org/record/2012-07161-001"
    - claim: "应有意识地筛选值得的人进入生命"
      verdict: "支持"
      original: "✅ 支持：社会网络传染+强关系生存率50%↑，硬数据支撑"
      evidence: "Holt-Lunstad 2010 meta（n=308,849）：强社会关系者生存率高50%，隔离等同每天吸15支烟；Dunbar 150：核心亲密层仅5人；Christakis & Fowler 2009：行为沿网络传染"
      sources: ["Holt-Lunstad et al. 2010 meta", "Dunbar 1998", "Christakis & Fowler 2009"]
      url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3150158/"
    - claim: "珍惜当下真心相待的关系（被看见/被回应的关系价值最高）"
      verdict: "支持"
      original: "✅ 强支持：全视频最硬的关系类论断"
      evidence: "Reis 2012：感知伴侣回应性（被理解/被认可/被关心）是关系满意度最强预测因子（r≈.6-.7）；Finkel 2014：现代婚姻质量取决于'被看见'的程度"
      sources: ["Reis 2012", "Finkel 2014《The All-or-Nothing Marriage》"]
      url: "https://psycnet.apa.org/record/2012-07161-001"
    - claim: "低调/勤劳/善良三种'福相'必然带来福报（果报式因果关系）"
      verdict: "部分支持"
      original: "🟡 部分支持：三品质有实证，但'福相'果报框架是非因果包装"
      evidence: "Roberts 2007 meta：尽责性预测收入 r=.15、健康 r=.13；Curry 2018 meta：利他与幸福感 r≈.18——效应量小到中等（r≈.15-.30），只能建立相关非因果"
      sources: ["Roberts et al. 2007 meta", "Curry et al. 2018 meta", "Aknin 2013（136国）"]
      url: "https://psycnet.apa.org/record/2007-02622-001"
    - claim: "用司马懿、刘伯温的历史故事佐证'福相'美德"
      verdict: "证伪"
      original: "❌ 证伪：Cherry-picking+逻辑谬误（政治策略≠道德美德）"
      evidence: "司马懿'隐忍'是政治权谋（高平陵之变杀曹爽三族）非道德例证；刘伯温'三分天下'出自清代/民国小说《英烈传》《烧饼歌》非明史；以个例证普遍规律属草率概括"
      sources: ["明史刘基传（报告考证）", "逻辑谬误：hasty generalization"]
      url: ""
    - claim: "行善要顺势而为、有边界，避免'能量错位'（帮助者共情耗竭）"
      verdict: "支持"
      original: "✅ 支持：Compassion Fatigue 实证充分"
      evidence: "Figley 2002：共情疲劳有标准化测量（ProQOL 量表），效应量中等偏强；Maslach & Leiter 2016：利他型职业（医护/社工）耗竭率显著高于平均；'能量'非物理学概念但指向实证构念"
      sources: ["Figley 2002 Compassion Fatigue", "Maslach & Leiter 2016"]
      url: "https://psycnet.apa.org/record/2003-87044-009"
    - claim: "'授人以渔'优于直接给钱，适用于一切受助者"
      verdict: "部分支持"
      original: "🟡 部分支持：极端贫困 RCT 直接现金援助效果不逊"
      evidence: "Haushofer & Shapiro 2016 GiveDirectly RCT：$1,000 现金转移使婴儿死亡率降低48%、心理幸福感显著提升；技能训练仅在基础需求满足后有效（条件性命题）"
      sources: ["Haushofer & Shapiro 2016 RCT", "Banerjee & Duflo 2011", "Bandura 1997 自我效能"]
      url: "https://www.nber.org/papers/w22392"
    - claim: "'救急不救穷'作为普遍原则成立（穷源于个人不努力）"
      verdict: "部分支持"
      original: "🟡 部分支持：作为全称命题不成立，结构性贫困非个人问题"
      evidence: "贫困有大量结构性成因（Rajan 2010；Sen 1999 能力剥夺；Burt 1999 社会网络断裂）；应区分结构性/情境性/依赖性贫困；全称化'救穷无用'可能为不作为提供道德借口"
      sources: ["Rajan 2010《Fault Lines》", "Sen 1999", "Hulme & Shepherd 2003"]
      url: ""
    - claim: "'尊重对方命运'适用于一切被帮助者（包括心理危机者）"
      verdict: "部分支持"
      original: "🟡 部分支持：自主权伦理支持，但对无决策能力者过度'尊重'=放弃"
      evidence: "Mental Capacity Act 2005（UK）：受助者无决策能力时可按'最佳利益'介入；对重度抑郁等心理危机者，极端被动的'尊重命运'可能延误救助甚至致命"
      sources: ["Beauchamp & Childress 1979", "Mental Capacity Act 2005", "Emanuel 1999"]
      url: "https://global.oup.com/academic/product/principles-of-biomedical-ethics-9780190926427"
    - claim: "真正的修行是在生活中尽好本分、活在当下（正念/心流/意义感）"
      verdict: "支持"
      original: "✅ 支持：全视频最坚实的论断（四大支柱稳健实证）"
      evidence: "Khoury 2013 meta（209项）：MBSR 焦虑 d=0.63、抑郁 d=0.59；A-Tjak 2015：ACT g=0.57；Sone 2008 队列 n=43,391：ikigai 与全因死亡率负相关（OR≈1.7，报告转述）"
      sources: ["Khoury et al. 2013 meta", "A-Tjak 2015 meta", "Sone et al. 2008", "Csikszentmihalyi 1990"]
      url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3579857/"
