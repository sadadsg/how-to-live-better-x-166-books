- theme: "灵魂伴侣七迹象与荣格心理学科学依据"
  category: "6_个人成长方法论/6.4_关系婚恋与形象"
  report_file: "灵魂伴侣七迹象与荣格心理学科学依据调研报告.md"
  claims:
    - claim: "强烈吸引源于'图式激活+单纯曝光+投射'等心理机制；'灵魂共振'解释无实证"
      verdict: "部分支持"
      original: "🟡 部分支持+过度叙事化（红线：把'激活+投射'=灵魂共振）"
      evidence: "Bornstein 1989 元分析：单纯曝光效应 r=0.26；Westen 1998 SWAP-200（800+病人样本）：投射是临床可观察现象；'灵魂共振'作为解释无实证对应"
      sources: ["Bornstein 1989 元分析", "Bruner 1957 激活模型", "Westen 1998 SWAP-200"]
      url: ""
    - claim: "相信'命中注定'（destiny belief）与初始关系满意度正相关"
      verdict: "支持"
      original: "（Knee 1998：与初始满意度 r=0.20-0.30）"
      evidence: "Knee 1998 JPSP：命运信念与初始满意度 r=0.20-0.30，并调节关系反应；Finkel 2007：destiny × 状态焦虑 β=-.16（与延迟原谅相关）"
      sources: ["Knee 1998 JPSP", "Finkel 2007 JPSP"]
      url: ""
    - claim: "相信灵魂伴侣命中注定能让关系长期更稳定"
      verdict: "证伪"
      original: "destiny 双高→关系下降最快（Gander 2024，2年追踪）"
      evidence: "Gander 2024 JSPR 2年追踪 N=904：destiny 信念双高组合的关系满意度下降最快（短期高满意度、长期低韧性）；成长信念使下降斜率减缓50%"
      sources: ["Gander 2024 JSPR", "Knee 1998 JPSP"]
      url: ""
    - claim: "亲密关系中的强烈情绪唤醒会推动个体直面内在功课（依恋系统激活的现象真实存在）"
      verdict: "支持"
      original: "🟢 强支持（现象真实，'灵魂连结'叙事浪漫化）"
      evidence: "Hazan & Shaver 1987：浪漫爱=依恋模板投射（安全56%/回避24%/焦虑矛盾20%）；Lemche 2005 fMRI：不安全依恋者面对伴侣负面情绪杏仁核激活升高"
      sources: ["Bowlby 1969", "Hazan & Shaver 1987", "Mikulincer & Shaver 2007", "Lemche 2005"]
      url: ""
    - claim: "反复的'亲密-疏远-再亲密'循环是'宇宙安排'或灵魂感应的证明"
      verdict: "证伪"
      original: "红线：把'依恋焦虑'=灵魂感应=浪漫化（不是爱，是焦虑）"
      evidence: "Hazan & Shaver 1987：焦虑-矛盾型（约20%人口）的典型表现即'亲密-疏远-再亲密'循环，机制是对被抛弃/不被爱的恐惧，非宇宙安排"
      sources: ["Hazan & Shaver 1987", "West & Sheldon 1988"]
      url: ""
    - claim: "共时性（有意义巧合）是真实的非因果物理原理/宇宙指引信号"
      verdict: "证伪"
      original: "🔴 主体已被证伪（Bem 2011→Galak 2012 复制失败 d=0.04）"
      evidence: "Bem 2011 报告 psi 效应 d=0.42-0.65，后被指出方法学问题；Galak 2012 预注册严格复制 N=3,289：d=0.04 不显著；'巧合'可由注意力效应+确认偏误+大数定律解释"
      sources: ["Bem 2011 JPSP", "Galak et al. 2012 复制研究", "Ritchie 2012 批评", "Hand 2014《The Improbability Principle》"]
      url: ""
    - claim: "'有意义巧合'作为主观体验普遍存在（现象学层面真实，华人'缘分'信念更强）"
      verdict: "支持"
      original: "（现象学真实：99% 人报告至少一次有意义巧合）"
      evidence: "Russo-Netzer & Icekson 2023 SAMD 量表（α=.81/.91）：99% 人报告至少一次；Goodwin & Findlay 1997：华人缘分信念显著强于英国（M=45.34 vs 37.16，p<.0001）"
      sources: ["Russo-Netzer & Icekson 2023", "Goodwin & Findlay 1997"]
      url: ""
    - claim: "'对方让我强烈不舒服'可能源于自身未整合特质的投射（阴影投射机制可临床观察）"
      verdict: "支持"
      original: "🟢 强支持（需区分健康投射 vs 病理投射性认同）"
      evidence: "Westen 1998 SWAP-200（800+病人样本）：投射是临床可观察现象；极端投射可能是边缘/自恋型人格征兆（Feldman 2014），健康整合与病理投射需区分"
      sources: ["Jung CW 7/9i", "Westen 1998 SWAP-200", "Byington 2009", "Feldman 2014"]
      url: ""
    - claim: "'似曾相识/莫名熟悉'（时间折叠感）源于熟悉度错觉与隐性记忆，而非深层认出"
      verdict: "支持"
      original: "🟡 部分支持——现象有认知机制解释（红线：=集体无意识是过度叙事化）"
      evidence: "Jacoby 1989 false fame 实验：虚假熟悉度制造'认出'感；Roediger 1995 DRM 范式：40-60% 被试'记得'从未呈现过的核心词（虚假记忆）"
      sources: ["Jacoby 1989", "Roediger 1995 DRM", "Brown 2001 隐性记忆综述"]
      url: ""
    - claim: "'集体无意识深层认出'是可检验的科学机制（阿尼玛/集体无意识可操作化）"
      verdict: "存疑"
      original: "'集体无意识'作为科学命题未操作化（仅现象学描述有启发性）"
      evidence: "荣格集体无意识缺乏直接操作化；认知心理学 schema/脚本理论更接近但不等同；Eysenck 等批评实证不足；主流态度转向部分整合（Knox 2003 与依恋理论整合）"
      sources: ["Jung CW 9i", "Knox 2003", "Eysenck 1953/1985"]
      url: ""
    - claim: "健康的分离-重聚是依恋系统与个体发展的正常过程"
      verdict: "支持"
      original: "🟡 部分支持——分离-重聚本身是依恋正常循环（'宇宙安排'是浪漫化）"
      evidence: "West & Sheldon 1988：依恋系统含'抗议-绝望-分离'阶段，重聚是正常循环；Mahler 1975：分离-个体化是正常发展；Field 1999：持续连接是健康适应模式"
      sources: ["West & Sheldon 1988", "Mahler 1975", "Field 1999"]
      url: ""
    - claim: "'不再需要对方'（自主选择而非焦虑驱动）标志更健康的关系状态"
      verdict: "支持"
      original: "🟢 强支持（SDT 自主+无条件自尊+ACT 价值行动）"
      evidence: "Ryan & Deci 2017：自主性与心理健康 r=0.45-0.55；Crocker & Wolfe 2001：外部条件性自尊导致自尊不稳定；ACT 对抑郁 SMD=-0.66（Wang 2025，13 RCT N=1,362）"
      sources: ["Deci & Ryan 2000/2017 (SDT)", "Crocker & Wolfe 2001", "Wang 2025 ACT 元分析"]
      url: ""
    - claim: "对人的痴迷感（执念）是爱的深度的证明"
      verdict: "证伪"
      original: "红线：痴迷型爱=可卡因渴求回路，不是爱的深度"
      evidence: "Bartels & Zeki 2000/2004 fMRI：浪漫爱激活 VTA+尾状核多巴胺奖赏回路；Fisher 2016：与可卡因渴求同源；Stead 2012：痴迷型爱伴杏仁核威胁反应激活"
      sources: ["Bartels & Zeki 2000/2004", "Fisher 2004/2010/2016", "Stead 2012", "Acevedo 2011"]
      url: ""
    - claim: "'真指引推动成长清醒、执念强化幻想消耗'的鉴别框架方向正确"
      verdict: "支持"
      original: "🟢 强支持（方向正确+简化版，缺神经科学/依恋/投资模型三层）"
      evidence: "成长信念使关系下降斜率减缓50%（Gander 2024）；情绪粒度训练 d=0.50（Barrett 2004 GLA）；ACT 焦虑 g=0.52（Ferreira 2022）；MBCT 复发预防 HR=0.69（Kuyken 2016）"
      sources: ["Gander 2024", "Barrett 2004", "Ferreira 2022", "Kuyken 2016"]
      url: ""
    - claim: "'推动内在完整'（个体化=整合对立面）有现代发展心理学的操作化对应"
      verdict: "支持"
      original: "🟢 强支持（Loevinger+Vaillant+Kegan 三套独立证据线收敛）"
      evidence: "Loevinger 1976 ego development 9阶段（E7个体化=整合内在矛盾）；Vaillant Grant Study 60年追踪：防御成熟度与心理健康 r=0.65；后常规阶段仅≈10%成年人达到"
      sources: ["Loevinger 1976", "Vaillant 1977/2002", "Kegan 1982/2009", "Cook-Greuter 1999"]
      url: ""
