- theme: "了不起的我-科学依据"
  category: "6_个人成长方法论/6.7_独立专题核验"
  report_file: "了不起的我-科学依据调研报告.md"
  claims:
    - claim: "接纳承诺疗法（ACT）能改善抑郁、焦虑等心理问题，对对照组效应量为中到大"
      verdict: "支持"
      original: "✅ 接纳有独立实证支持（g=0.42-0.82）"
      evidence: "多项元分析一致：Powers 2009（18 RCTs, n=917）g=0.42；A-Tjak 2015（39 RCTs, n=1821）g=0.57；Keulen 2025 青年（65 RCTs, n=5283）g=0.72；Zhao 2023 抑郁 SMD=-1.05"
      sources: ["Powers et al. 2009（18 RCTs, n=917）", "A-Tjak et al. 2015（39 RCTs, n=1821）", "Keulen et al. 2025（65 RCTs, n=5283）", "Hayes & King 2024（约 1000 项 RCT 回顾）"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4244236/"
    - claim: "ACT 的疗效优于认知行为疗法（CBT）"
      verdict: "证伪"
      original: "ns（与 CBT 无显著差异，p=0.14）——'书中隐含 ACT 优于 CBT 的暗示需要修正'"
      evidence: "多项元分析一致显示 ACT vs CBT 无显著差异：A-Tjak 2015 p=0.14；Öst 2014（60 RCTs, n=4234）g=0.16 ns；抑郁专项研究中 vs CBT 反而不利 ACT（Zhao 2023）"
      sources: ["A-Tjak et al. 2015", "Öst 2014（60 RCTs, n=4234）", "Zhao et al. 2023（11 RCTs, n=962）"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4718567/"
    - claim: "'外化声音+拉偏架'对应的认知解离是 ACT 产生疗效的关键中介机制"
      verdict: "部分支持"
      original: "✅ 有效但非 ACT 独有（7/8 项中介显著）"
      evidence: "Stockton 综述：8 项中介分析中 7 项显著；但 MASEM（k=9）不显著，5 项调节中介中 4 项不显著——认知解离可能并非 ACT 独有机制，CBT 或经不同路径起效"
      sources: ["Stockton et al. 认知解离中介综述", "MASEM 元分析结构方程（k=9）"]
      url: "https://eprints.whiterose.ac.uk/id/eprint/137915/3/ACT%20Mediation%20Review%20%28final%20submission%29.pdf"
    - claim: "自我慈悲训练能显著减少反刍思维、抑郁和自我批判"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Ferrari 2019 元分析（27 RCTs）：反刍 g=1.37、抑郁 g=0.66、自我批判 g=0.56；Wakelin 2021（20 RCTs）自我批判减少 g=0.51 [0.33-0.69]"
      sources: ["Ferrari et al. 2019 元分析（27 RCTs）", "Wakelin et al. 2021 元分析（20 RCTs）"]
      url: "https://self-compassion.org/wp-content/uploads/2019/08/Ferrari2019.pdf"
    - claim: "'自我攻击才是痛苦根源'——自我批判与抑郁及精神病理强相关"
      verdict: "支持"
      original: "✅ 核心机制成立（批判↔抑郁 r=0.53）"
      evidence: "Buric 2026（256 项研究，N=107,304）：自我慈悲与精神病理 r=-0.50；自我批判（非慈悲维度）与抑郁 r=+0.53，为三维度中最强关联"
      sources: ["Buric et al. 2026（N=107,304）", "Neff 2023 Annual Review"]
      url: "https://doi.org/10.1007/s12671-026-02832-8"
    - claim: "自我慈悲不等于自我放纵，不会削弱动机，反而增加自我改进动机与健康行为"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Breines & Chen 2012：自我慈悲增加而非减少自我改进动机（与掌握目标正相关）；Phillips & Hine 2021 元分析（94 项）：与健康促进行为（戒烟、锻炼等）正相关"
      sources: ["Breines & Chen 2012", "Phillips & Hine 2021 元分析（94 项）", "Muris et al. 2025（自我慈悲≠自恋）"]
      url: "https://hqinstitute.org/wp-content/uploads/sites/5/2022/09/Breines_Chen_SelfCompMotivation.2012.pdf"
    - claim: "行为激活疗法（BA，直接安排行动绕过动机）对抑郁有效，效果与 CBT 相当"
      verdict: "支持"
      original: "✅ 小行为启动有实证（BA g=0.67-0.85）"
      evidence: "Cuijpers 2026 最大元分析（105 RCTs, N=13,933）：SMD=0.67，12 个月仍显著；BA vs CBT SMD=0.04 无显著差异（27 个比较）；Ekers 2014 g=0.74（26 RCTs）"
      sources: ["Cuijpers et al. 2026（105 RCTs, N=13,933）", "Ekers et al. 2014（26 RCTs, n=1524）", "Uphoff et al. 2020 Cochrane（RR 1.40）"]
      url: "https://doi.org/10.1016/j.cpr.2026.102783"
    - claim: "'行动不需要动力，行动本身就是动力的来源'——可以先行动再产生动机"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "神经科学：多巴胺主要响应努力与目标追求而非奖励消费（Salamone & Correa）；BA 核心机制即绕过动机直接启动行为；实施意图 d=0.65（Gollwitzer & Sheeran 2006）"
      sources: ["Salamone & Correa 2012/2024 多巴胺与努力综述", "Gollwitzer & Sheeran 2006 实施意图元分析（d=0.65）", "Martell et al. 2010 行为改变先于认知改变"]
      url: "https://doi.org/10.1146/annurev-psych-020223-012208"
    - claim: "宏大的'100% 改变计划'注定失败，微小行动（5% 扰动）是更可靠的改变方式"
      verdict: "部分支持"
      original: "🟡 方向对，但无直接 RCT"
      evidence: "BA 理论：大行为门槛导致回避（Martell 2010）；实施意图 d=0.65 支持小行为启动；但该命题本身无直接 RCT 检验，'5%扰动'实证基础来自 BA 与实施意图而非微习惯"
      sources: ["Martell et al. 2010 行为激活理论", "Gollwitzer & Sheeran 2006（d=0.65）"]
      url: ""
    - claim: "一个新习惯平均 21 天即可养成"
      verdict: "证伪"
      original: "❌ 21天说法被否定（中位数 66 天）"
      evidence: "Lally 2010 追踪研究：习惯形成中位数 66 天（区间 18-254 天）；YAML 补充：中位 59-66 天、平均 106-154 天，个体差异 4-335 天"
      sources: ["Lally et al. 2010 习惯形成追踪研究"]
      url: ""
    - claim: "'5% 扰动'/微习惯方法本身有独立实验证据支持"
      verdict: "存疑"
      original: "⚠️ 实验室难以诱导习惯（de Wit 2018 五次失败）"
      evidence: "de Wit 2018 五项预注册实验均未能在健康人中实验性诱导出习惯，习惯增益可能消散；BJ Fogg 模型（50 万+数据点）非严格 RCT"
      sources: ["de Wit et al. 2018（五次实验性习惯诱导失败）", "BJ Fogg Tiny Habits 数据（非 RCT）"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6033090/"
    - claim: "'意志力是有限资源、会被消耗'的 ego depletion（自我损耗）模型成立"
      verdict: "证伪"
      original: "❌ 已崩塌（d=0.04-0.06）"
      evidence: "Hagger 2016 多中心预注册复制（23 实验室, N=2141）：d=0.04 零效应；Vohs 2021（36 实验室, N=3531）：d=0.06，贝叶斯 4.4 倍支持零假设；替代解释为动机/注意力转移"
      sources: ["Hagger et al. 2016 多中心复制（23 实验室, N=2141）", "Vohs et al. 2021（36 实验室, N=3531）", "Inzlicht et al. 2021 过程模型"]
      url: ""
    - claim: "'想改变'本身就是问题——渴望成为'应该的自己'会阻碍自我发展"
      verdict: "部分支持"
      original: "🟡 方向对，但需细化"
      evidence: "ACT 研究支持过度经验性回避（执着于'应该的自己'）与心理病理相关；但'改变动机'本身不是问题，原表述过度概括"
      sources: ["ACT 经验性回避与心理病理研究（Hayes 等）"]
      url: ""
    - claim: "真正的自律是减少需要硬撑（依赖意志力）的场景，而非意志力更强"
      verdict: "部分支持"
      original: "🟡 部分支持"
      evidence: "ego depletion 崩塌后'消耗有限意志力'表述需修正；但环境设计与习惯固化（中位 66 天、d=0.65 实施意图）支持'减少意志力依赖'这一方向"
      sources: ["Lally et al. 2010 习惯形成研究", "Inzlicht et al. 2021 动机/注意力转移过程模型"]
      url: ""
    - claim: "'黑色想象'（主动预想最坏情况）是经独立验证的有效心理工具"
      verdict: "存疑"
      original: "🟡 方向对，缺乏直接证据（弱-中，无独立 RCT）"
      evidence: "仅有斯多葛哲学与 ACT'创造性绝望'的理论同源支持，无独立 RCT 检验该工具本身；属 ACT 已验证机制的通俗包装"
      sources: ["斯多葛哲学传统", "ACT 创造性绝望理论"]
      url: ""
