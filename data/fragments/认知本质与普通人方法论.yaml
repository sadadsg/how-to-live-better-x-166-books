- theme: "认知本质与普通人方法论"
  category: "6_个人成长方法论/6.1_认知与心理科学方法论"
  report_file: "认知本质与普通人方法论调研报告.md"
  claims:
    - claim: "'认知=看见商机'——企业家警觉（机会识别）可训练，但这一表述收窄了认知的含义"
      verdict: "部分支持"
      original: "部分可信（概念成立但被收窄）"
      evidence: "Tang 2012 警觉三维度量表（扫描/联想/判断）可测可练；但'看见'不等于'变现'，警觉依赖先前知识，开发/利用环节被跳过"
      sources: ["Tang, Kacmar & Busenitz 2012 警觉三维度量表", "Kirzner 1973"]
      url: ""
    - claim: "原生家庭通过言传身教传递认知——文化资本存在显著的代际传递"
      verdict: "支持"
      original: "高度可信"
      evidence: "Mikus 2019（德）、Liu 2017（北京大学生追踪）：文化资本→学业→地位中介链成立；丹麦双胞胎研究佐证"
      sources: ["Mikus, Tieben & Schober 2019 BJSE", "Liu Wenli 2017 HKUST"]
      url: ""
    - claim: "阶层/原生家庭近似宿命地决定一个人的认知水平"
      verdict: "证伪"
      original: "⚠️ 过度推断（决定论倾向）"
      evidence: "证据仅支持'显著且可被削弱的影响'；教育扩张、公共政策、个体能动性都能打断代际传递"
      sources: []
      url: ""
    - claim: "挤入高学历圈层本身就能产出'高维认知'"
      verdict: "证伪"
      original: "部分可信——实为变量误读"
      evidence: "真变量是网络多样性：Eagle 2010 Science 全英通话数据，经济排名与社交多样性 r=0.73；名校圈价值来自触达更广资源网络，因果方向不明"
      sources: ["Eagle, Macy & Claxton 2010 Science", "Granovetter 1973"]
      url: ""
    - claim: "主动拓展弱关系与跨界信息源能带来认知与机会红利"
      verdict: "支持"
      original: "★ 强证据支持"
      evidence: "Granovetter 1973 弱关系理论；Eagle 2010：社交网络多样性（含弱关系）与经济排名相关 r=0.73"
      sources: ["Granovetter 1973", "Eagle et al. 2010 Science"]
      url: ""
    - claim: "AI 将大面积替代白领/蓝领岗位"
      verdict: "部分支持"
      original: "部分可信（暴露≠替代）"
      evidence: "Eloundou 2023：约 80% 劳动力≥10%任务受影响、19%≥50%，高收入认知岗暴露更高；但 WEF 2025 预测岗位净增 7800 万，OECD 27% 高自动化风险"
      sources: ["Eloundou et al. 2023 'GPTs are GPTs'", "OECD Employment Outlook 2023", "WEF Future of Jobs 2025"]
      url: "https://arxiv.org/abs/2303.10130"
    - claim: "稳定工作正在系统性弱化（零工化+技能半衰期缩短）"
      verdict: "支持"
      original: "高度可信"
      evidence: "孙萍 8 年 19 省 400+ 骑手田野：杭州样本仅 12% 签合同、87% 未缴养老；WEF：约 39% 核心技能 5 年内过时、每 2-3 年需学新技能"
      sources: ["孙萍 2024《过渡劳动》", "WEF Future of Jobs"]
      url: "https://www.cssn.cn/skgz/bwyc/202409/t20240911_5776820.shtml"
    - claim: "长期自我投资能自动构建职业护城河"
      verdict: "部分支持"
      original: "部分可信（方向对、需具体化）"
      evidence: "WEF：自驱 upskilling 者 18 个月内转高需求岗概率是企业培训者的 2.3 倍；护城河需落地为可迁移能力+跨界弱关系+稀缺专长"
      sources: ["WEF Future of Jobs"]
      url: ""
    - claim: "抢先进入市场（先发）就能赢"
      verdict: "证伪"
      original: "与证据相悖（先驱劣势）"
      evidence: "Golder & Tellis 1993 历史档案研究：约 47% 市场先驱失败、平均份额仅 10%；早期领导者失败率 8%、份额 28%、平均晚 13 年进入"
      sources: ["Golder & Tellis 1993 JMR"]
      url: "https://gtellis.net/wp-content/uploads/2020/09/pioneering-advantage-marketing-logic-or-marketing-legend.pdf"
    - claim: "'正确时间做正确事'存在早期窗口优势，小成本试错优于 All-in 赌先发"
      verdict: "部分支持"
      original: "部分可信"
      evidence: "早期进入确有优势（份额 28% vs 10%），但持久优势来自切换成本/标准/规模三大机制，应验证机制后再重注"
      sources: ["Golder & Tellis 1993 JMR"]
      url: ""
    - claim: "多读历史能帮助认知未来"
      verdict: "部分支持"
      original: "部分可信（有效但有严格边界）"
      evidence: "Neustadt & May 1986：历史可作情景库与结构视角，但有六大类比陷阱（急于行动、模糊类比等），决策前应显式列异同"
      sources: ["Neustadt & May 1986 Thinking in Time"]
      url: ""
    - claim: "追求自主、胜任、关系三需求的满足能提升幸福感与绩效"
      verdict: "支持"
      original: "高度可信"
      evidence: "Slemp 2024 元分析 N=443,556：SDT 三需求与幸福感强相关、与绩效中等相关，跨文化稳定；追外在标签损害自主感反损幸福感"
      sources: ["Slemp et al. 2024 JPSP", "Deci & Ryan 自决理论"]
      url: "https://dspace.ewha.ac.kr/handle/2015.oak/269929"
    - claim: "外卖/滴滴骑手个案证明'努力无用'"
      verdict: "证伪"
      original: "个案不能推普适因果"
      evidence: "个案揭示的是结构性回报不对等（算法压价+无保障+平台抽成），解释制度如何压制回报，不能推出努力无效的普适因果"
      sources: ["孙萍 2024《过渡劳动》"]
      url: ""
