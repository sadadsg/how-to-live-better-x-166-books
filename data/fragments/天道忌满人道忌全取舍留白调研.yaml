- theme: "天道忌满人道忌全取舍留白调研"
  category: "6_个人成长方法论/6.8_古典智慧应用"
  report_file: "天道忌满人道忌全取舍留白调研报告.md"
  claims:
    - claim: "'持而盈之不如其已''功成身退''知足知止''慎终如始'等反满思想有先秦原典精确依据"
      verdict: "支持"
      original: "✅ 4/4 命题 ✅"
      evidence: "《道德经》9/24/44/45/64 章 + 《周易》乾卦上九'亢龙有悔' + 《尚书·旅獒》精确锁定章节句；帛书甲乙本与王弼本互证；王弼/河上公注支撑'留白'义理。"
      sources: ["《道德经》王弼本+帛书本", "《周易·乾卦》", "ctext.org 电子化计划"]
      url: ""
    - claim: "'天道忌满，人道忌全'一语出自先秦经典"
      verdict: "证伪"
      original: "重要纠偏"
      evidence: "该句是清代文康《儿女英雄传》第三十八回的成语化总结，非先秦原典；先秦支撑来自道德经/周易等单句命题而非此成语。"
      sources: ["文康《儿女英雄传》第三十八回"]
      url: ""
    - claim: "'花未全开月未圆'原作者是曾国藩"
      verdict: "证伪"
      original: "重要纠偏"
      evidence: "原作出自北宋蔡襄《十三日吉祥院探花》（1066 年，两天后手书《山堂诗帖》）；曾国藩 1845 年《求阙斋记》仅取首句作'宰割式'再诠释。"
      sources: ["蔡襄《十三日吉祥院探花》/《山堂诗帖》", "曾国藩《求阙斋记》1845"]
      url: ""
    - claim: "工作-家庭冲突有系统实证：冲突越强，心理压力越高、生活满意度越低"
      verdict: "支持"
      original: "✅ 6/7 案例 ✅"
      evidence: "Greenhaus & Beutell 1985 三类冲突模型（时间/紧张/行为）；Allen 2000 元分析：与心理压力 r=0.42、生活满意度 r=-0.32；Liu & Chien 2025 三波调查（N=237）：完美主义经 telepressure 链放大倦怠。"
      sources: ["Allen 2000 JAP 元分析", "Greenhaus & Beutell 1985", "Liu & Chien 2025 EJWOP"]
      url: ""
    - claim: "家族企业难以传过三代（Ward 数据为 87% 传不过，坊间'70%'系误读）"
      verdict: "支持"
      original: "✅（数据已纠偏）"
      evidence: "Ward 1987 追踪 200 家伊利诺伊制造商 60 年：仅 13% 由同一家族持有至第三代；麦肯锡：全球家族企业平均寿命 24 年，传至第三代不足 13%；余明阳：82% 中国二代不愿主动接班。"
      sources: ["Ward 1987 Keeping the Family Business Healthy", "麦肯锡家族企业研究", "余明阳 182 家样本研究"]
      url: ""
    - claim: "极致事业必然直接导致创始早逝（乔布斯、王均瑶式结局是事业的必然结果）"
      verdict: "部分支持"
      original: "🟡（乔布斯+王均瑶因个人延误诊断）"
      evidence: "乔布斯 2003 确诊 pNET 后延误 9 个月选替代疗法致肝转移（早期手术 5 年生存率 60-80%）；王均瑶 38 岁肠癌去世——主因延误诊断与工作狂，非'极致事业'本身必然；李开复病后'只用半个自己'为对照。"
      sources: ["Isaacson 2011 Steve Jobs", "Harvard R. Amri 评论", "王均瑶讣告事实链"]
      url: ""
    - claim: "高净值与富裕群体面临更高的心理健康与代际焦虑风险（财富心理悖论）"
      verdict: "支持"
      original: "✅"
      evidence: "Wilkinson & Pickett 2009：不平等高的社会心理健康问题高 3 倍；UBS Investor Watch（5000+ 样本）57% 担心健康恶化；Luthar：富裕青少年抑郁率 2-3 倍；报告提示可能存在自选择偏差。"
      sources: ["Wilkinson & Pickett 2009 The Spirit Level", "UBS Investor Watch", "Luthar 富裕青少年研究"]
      url: ""
    - claim: "收入超过一定阈值后幸福感增益显著递减乃至饱和"
      verdict: "支持"
      original: "✅"
      evidence: "Brickman 1978 彩票赢家研究（享乐适应）；Killingsworth-Kahneman-Mellers 2023 PNAS：约 50 万-100 万美元后幸福感饱和；Diener 2024 提示富国穷国曲线形态仍有争议。"
      sources: ["Brickman 1978 JPSP", "Killingsworth/Kahneman/Mellers 2023 PNAS"]
      url: ""
    - claim: "完美主义与'追求极致'提高职业倦怠风险"
      verdict: "支持"
      original: "✅"
      evidence: "Limburg 2017 元分析：完美主义→倦怠 d=0.27；Hill & Curran 2016（Psychol Bull）：担忧型完美主义与倦怠 r=0.41；强角色边界可屏蔽该路径（Liu & Chien 2025）。"
      sources: ["Limburg 2017 元分析", "Hill & Curran 2016 Psychol Bull"]
      url: ""
    - claim: "'每年 15% 低风险收益'的投资目标在传统大类资产中可实现"
      verdict: "证伪"
      original: "已被 SGOB 报告证伪（'低风险'与'15%'矛盾）"
      evidence: "SGOV 真实收益约 3.61%；covered call（BXM 基准）长期净年化 6-8%；中国合规组合净年化约 5-7%——'低风险'与'15%'不可兼得，留白哲学本身成立但该数字不成立。"
      sources: ["vault SGOB 核验报告 2026-08-29"]
      url: ""
    - claim: "'知足知止/大成若缺/花未全开'等留白命题可与现代心理学机制一一对应"
      verdict: "支持"
      original: "✅（10 条古籍命题↔现代机制）"
      evidence: "知足知止↔享乐适应（Brickman 1978）；大成若缺↔完美主义-倦怠元分析（Limburg 2017 d=0.27）；花未全开↔ACT 接纳；功成身退↔Bonanno 弹性轨迹（45-71%）。"
      sources: ["Brickman 1978", "Limburg 2017", "Bonanno 2004"]
      url: ""
    - claim: "恒星质量越大寿命越短（'盛极必衰'的物理学硬规律类比）"
      verdict: "支持"
      original: "✅（专项核验）"
      evidence: "L∝M^-2.5~-3.5：O5 型恒星寿命约 1-3 百万年、太阳（G2）约 100 亿年、红矮星可达万亿年；爱丁顿极限约 150-200 太阳质量，超限则物质抛射——但物理学是硬规律，不可直接套用于经济。"
      sources: ["Eddington 1921", "Chandrasekhar 1931 ApJ"]
      url: ""
    - claim: "'满则亏'可用意志力有限资源模型（ego depletion）解释"
      verdict: "证伪"
      original: "❌→🟡（资源模型已崩塌）"
      evidence: "Hagger 2016 注册重复复制 d=0.04、Vohs 2021 BF=4.4：资源模型崩塌；替代解释为'动机/注意转移'模型成立。"
      sources: ["Hagger 2016", "Vohs 2021", "Inzlicht 2018"]
      url: ""
