- theme: "过度兴奋反噬与藏锋避祸"
  category: "6_个人成长方法论/6.8_古典智慧应用"
  report_file: "过度兴奋反噬与藏锋避祸调研报告.md"
  claims:
    - claim: "'持而盈之''亢龙有悔''自伐自矜''慎终如始''功成身退'等古籍命题有原典与出土本精确支撑"
      verdict: "支持"
      original: "✅ 4/5 个古籍命题 ✅"
      evidence: "《道德经》9/24/44/64/66 章 + 《周易·乾卦》上九与《文言传》'贵而无位，高而无民'；帛书乙本'功遂身退'、郭店楚简'慎终如始'古本原形互证；王弼/河上公/魏源三家注差异清晰。"
      sources: ["《道德经》王弼本+帛书+郭店楚简", "《周易·乾卦》朱熹/程颐/虞翻三家易注"]
      url: ""
    - claim: "《乾·文言》'知进退存亡'（儒家）与老子'功成身退'（道家）是同一思想，可直接互引"
      verdict: "证伪"
      original: "❌ 路径殊异，不可混用"
      evidence: "报告明确边界：儒家《易传》强调'知进退存亡而不失其正'的道德主动性，道家强调'功成身退天之道'的自然退让——均讲'退'但路径殊异，不可混用；'自伐'（居功外归因）与'自矜'（恃才内归因）亦有别。"
      sources: ["《周易·乾·文言》", "《道德经》第 9 章"]
      url: ""
    - claim: "炫才招祸：杨修'鸡肋事件'被杀是'自伐自矜'的历史反例"
      verdict: "支持"
      original: "✅（可迁移）"
      evidence: "《三国志·魏书·杨修传》：建安 24 年（219 AD）秋鸡肋事件，以'前后漏泄言教，交关诸侯'罪收杀，年约 44-45；心理机制对应 self-promotion+overconfidence。"
      sources: ["《三国志·魏书·杨修传》"]
      url: ""
    - claim: "藏锋避祸足以在权力斗争中保身（荀彧式藏智可成功避祸）"
      verdict: "部分支持"
      original: "🟡 藏锋不完全成功"
      evidence: "《三国志·荀彧传》：荀彧'深密有谋'仍于建安 17 年（212 AD）空盒事件被迫自尽——藏锋需配合远离权力中心（如张良'从赤松子游'善终）；留在权力中心则不完全奏效。"
      sources: ["《三国志·魏书·荀彧传》及裴注", "《史记·留侯世家》"]
      url: ""
    - claim: "谦虚是自我保护机制，但需同时满足'已建立能力'与'集体主义文化语境'两个边界"
      verdict: "部分支持"
      original: "🟡 需限定两个边界条件"
      evidence: "Heine & Hamamura 2007 元分析（91 项研究）：东亚谦逊偏向 d=0.84；但西式 self-serving bias（d≈0.85）支持适度自夸，过度谦虚可能被低估；印象管理五策略中楷模化最脆弱。"
      sources: ["Heine & Hamamura 2007 元分析", "Markus & Kitayama 1991", "Jones & Pittman 1982"]
      url: ""
    - claim: "高调楷模人设（loud virtue/exemplification）是印象管理策略中最脆弱的"
      verdict: "支持"
      original: "✅"
      evidence: "Jones & Pittman 1982：五策略中 exemplification 依赖持续表演，单次翻车反噬最重；Pratfall 效应（Aronson 1966）仅限'已建立能力+非道德失误'，道德失误触发虚伪感。"
      sources: ["Jones & Pittman 1982", "Aronson 1966", "Sezer 2018 JPSP"]
      url: ""
    - claim: "过度兴奋会系统性扭曲决策：激活奖赏回路、抑制风险信号，导致忽视风险"
      verdict: "支持"
      original: "✅（三线实证一致）"
      evidence: "Kuhnen & Knutson 2011 J Neurosci（fMRI 投资任务）：NAcc 激活+insula 抑制→过度自信与风险忽视；Knutson & Bossaerts 2007：预测误差增强→决策失衡；Loewenstein 2005：情感状态低估风险 50%+。"
      sources: ["Kuhnen & Knutson 2011 J Neurosci", "Knutson & Bossaerts 2007 SCAN", "Loewenstein 2005"]
      url: ""
    - claim: "重要决策前保持冷静（'扣扳机前呼吸微弱'）能降低情感决策偏差"
      verdict: "支持"
      original: "✅ 神经科学+经济学双支撑"
      evidence: "Loewenstein 2005 hot-cold empathy gap + Van Boven 2005 cold reflection：冷静反思降低情感偏差；边界：仅适用情感驱动决策（投资/谈判），不适用逻辑推理型决策。"
      sources: ["Loewenstein 2005 J Consumer Psychol", "Van Boven 2005"]
      url: ""
    - claim: "'赢家诅咒'与领导者过度自信（hubris）导致溢价过高与并购表现变差（亢龙有悔的现代对应）"
      verdict: "支持"
      original: "✅"
      evidence: "Thaler 1988 winner's curse（15400 引用），Arroyabe 2024 元分析：拍卖经验溢价 69%；Roll 1986 hubris hypothesis + Malmendier & Tate 2005/2008：CEO 过度自信→并购市场表现差约 100bp。"
      sources: ["Thaler 1988 JEP", "Roll 1986 JF", "Malmendier & Tate 2005/2008 JFE"]
      url: ""
    - claim: "范蠡'功成身退、三聚三散'案例完整可迁移（散财再聚循环）"
      verdict: "支持"
      original: "✅ 最完整散财再聚案例"
      evidence: "《史记·越王勾践世家》《货殖列传》：助越灭吴后乘舟退，改名经商，'十九年之中三致千金'再分散于贫交疏昆弟，约 88 岁善终；对应 modesty bias 与 Bonanno 弹性轨迹。"
      sources: ["《史记·越王勾践世家》", "《史记·货殖列传》"]
      url: ""
    - claim: "汉初三杰对照：主动隐退者善终、恋栈者遭祸（张良 vs 韩信/萧何）"
      verdict: "支持"
      original: "✅（可迁移）"
      evidence: "《史记·留侯世家》：张良'愿弃人间事，欲从赤松子游'主动请辞、约 189 BC 善终；韩信被吕雉诛杀；萧何善终但多次下狱——远离权力中心是'藏锋'成功的配套条件。"
      sources: ["《史记·留侯世家》", "《史记·淮阴侯列传》"]
      url: ""
    - claim: "'过度兴奋→promotion focus→忽视预防'的因果链已有直接 RCT 验证"
      verdict: "存疑"
      original: "🟡 缺直接 RCT"
      evidence: "Higgins 1997/1998 prevention/promotion focus 经典理论（8000+ 引用）成立，但'过度兴奋→promotion focus→忽视预防'链条尚无直接 RCT；过度兴奋对决策的影响已由 NAcc/insula 实验支持。"
      sources: ["Higgins 1997 Adv Exp Soc Psychol"]
      url: ""
    - claim: "现代'功成身退'有可迁移实例：巴菲特提前布局交接、稻盛和夫卸任、洛克菲勒基金会化传承"
      verdict: "支持"
      original: "✅（7 例中 6 例可迁移）"
      evidence: "巴菲特 2021 任命 Abel 为副董事长、2025 宣布卸任，2026Q1 现金储备 $397.4B；稻盛和夫 78 岁零薪水重建日航、81 岁无退休金卸任；洛克菲勒 1913 基金会化实现 5 代传承。"
      sources: ["Berkshire Hathaway 2025 年报", "京瓷官方讣告/日航史料", "Rockefeller Foundation 官网"]
      url: ""
