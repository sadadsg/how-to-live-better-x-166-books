- theme: "男性颜值红利与形象管理"
  category: "6_个人成长方法论/6.4_关系婚恋与形象"
  report_file: "男性颜值红利与形象管理调研报告.md"
  claims:
    - claim: "在简历与能力相同时，高颜值男性获得更多面试机会（有因果证据）"
      verdict: "支持"
      original: "✅（Deepfake 实验证实：面试邀请率+8.2%）"
      evidence: "Deepfake 实验 2024（N=493 招聘负责人）：换脸保持简历/能力一致，高颜值面试邀请率 +6.0%（男性 +8.2%）、能力评分 +0.36；只有男性持续从颜值获益"
      sources: ["Deepfake 实验 2024（N=493）", "Hamermesh & Biddle 1994"]
      url: "https://www.sciencedirect.com/science/article/pii/S0276562424001057"
    - claim: "男性颜值红利比女性更强、更普适、更稳定"
      verdict: "支持"
      original: "✅（Nault 2020、Kukkonen 2024 两项综述一致确认）"
      evidence: "Nault et al. 2020 与 Kukkonen et al. 2024 两项综述一致：男性颜值红利比女性更普适、更稳定；Deepfake 实验中亦只有男性持续获益"
      sources: ["Nault et al. 2020", "Kukkonen et al. 2024"]
      url: "https://link.springer.com/chapter/10.1007/978-3-032-08035-6_10"
    - claim: "颜值'把关'能力信息的加工优先级：同样的能力，高颜值者被'看见'更多（能力放大器）"
      verdict: "支持"
      original: "✅（ERP 2025：P200/LPP 增强）"
      evidence: "ERP 神经研究 2025：高颜值条件下能力信息获得更多注意资源（P200/LPP 增强）——颜值吸引注意力、能力承接注意力，两者相乘产生曝光与机会"
      sources: ["ERP 研究 2025（MDPI）"]
      url: "https://www.mdpi.com/2076-328X/15/8/1130"
    - claim: "颜值溢价集中在客户接触型岗位，数据/技术岗无优势"
      verdict: "支持"
      original: "✅（Stinebrickner 2019 证实客户岗颜值溢价）"
      evidence: "Stinebrickner et al. 2019：颜值在客户接触型岗位有溢价，数据/技术岗无优势——形象投入应集中在面试、对外沟通、关键汇报等高权重场景"
      sources: ["Stinebrickner et al. 2019"]
      url: ""
    - claim: "'男人靠实力就行，颜值在职场无用'"
      verdict: "证伪"
      original: "误区①：错——颜值是能力放大器"
      evidence: "Hamermesh & Biddle 1994：颜值高者薪酬更高、更易被雇佣（外貌溢价奠基研究）；Deepfake 2024（N=493）因果证据：简历相同时高颜值男性邀请率 +8.2%"
      sources: ["Hamermesh & Biddle 1994", "Deepfake 实验 2024（N=493）"]
      url: "https://www.sciencedirect.com/science/article/pii/S0276562424001057"
    - claim: "颜值单出（无能力承接）是风险敞口：花瓶标签、预期落差惩罚与竞争排斥"
      verdict: "支持"
      original: "✅（Heilman 1979 + 竞争情境歧视 2015）"
      evidence: "Heilman & Saruwatari 1979：能力导向岗位高颜值可能不利（Beauty Penalty：颜值拉高能力预期，不匹配时落差惩罚更重）；Andreoni & Petrie 2008：高颜值者犯错被更严厉惩罚"
      sources: ["Heilman & Saruwatari 1979", "竞争情境歧视研究 2015（4项研究）", "Andreoni & Petrie 2008"]
      url: "https://www.sciencedirect.com/science/article/abs/pii/S0749597815000096"
    - claim: "形象红利的约80%来自可后天管理的基础形象（干净、得体、精神），而非天生五官"
      verdict: "部分支持"
      original: "✅ 核心洞察（但'80%'为报告归纳数字、无直接文献出处）"
      evidence: "修饰×着装一致性研究 2022（3组样本）：一致性显著影响可雇佣性，感知胜任力是中介；'80%'具体比例无文献出处，方向有据、数字存疑"
      sources: ["修饰×着装一致性研究 2022（I J of Selection and Assessment）"]
      url: "https://doi.org/10.1111/ijsa.12399"
    - claim: "职场吸引力的目标应是可打造的'职业氛围感'：整洁+得体+精神的一致性传递专业信号"
      verdict: "支持"
      original: "✅（一致性→感知胜任力→可雇佣性）"
      evidence: "2022 研究：grooming 与着装风格的一致性传递'自我管理能力强、认真、靠谱'信号（邋遢+名牌=错位信号）；投入产出排序：整洁>得体穿搭>体态>健身"
      sources: ["修饰×着装一致性研究 2022"]
      url: "https://doi.org/10.1111/ijsa.12399"
    - claim: "出众外形在婚恋与社交中带来更多选择权、包容度与更低社交门槛"
      verdict: "支持"
      original: "✅（首因效应+光环效应）"
      evidence: "报告对比总结判 ✅：婚恋选择权与社交门槛降低由首因效应+光环效应解释；与 Hamermesh & Biddle 1994 外貌溢价同源"
      sources: ["Hamermesh & Biddle 1994", "光环效应/首因效应经典研究"]
      url: ""
    - claim: "颜值红利可替代长期关系与职业发展中的性格、价值观与能力"
      verdict: "证伪"
      original: "边界：颜值是'入场券'不是'全部'——长期关系靠性格、价值观、能力"
      evidence: "报告边界：第一印象权重>长期评价会反转；颜值单出遭 Beauty Penalty 与反噬（Heilman 1979；Andreoni & Petrie 2008）；内外兼修才是长期竞争力"
      sources: ["Heilman & Saruwatari 1979", "Andreoni & Petrie 2008"]
      url: "https://www.sciencedirect.com/science/article/abs/pii/S0749597815000096"
