- theme: "斯坦福人生设计21天四步法"
  category: "6_个人成长方法论/6.4_关系婚恋与形象"
  report_file: "斯坦福人生设计21天四步法调研报告.md"
  claims:
    - claim: "'21天'可以完成人生设计四步法或养成一个习惯"
      verdict: "证伪"
      original: "❌ 已被证伪（Maltz 1960 是轶事；Lally 2010 中位数66天）"
      evidence: "Maltz 1960 为整形科医生轶事（'a minimum of about'指心理适应非行为习惯）；Lally 2010（96人）：自动化中位数66天、全距18-254天；Singh 2024（N=2,601）：复杂行为106-154天"
      sources: ["Maltz 1960（UCL 考据）", "Lally et al. 2010", "Singh et al. 2024", "Gardner, Lally & Wardle 2012"]
      url: "https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674"
    - claim: "21天不足以养成习惯，但作为'认知启动窗口'（承诺机制/仪式感）仍有心理价值"
      verdict: "部分支持"
      original: "（启动仪式价值：承诺机制+仪式效应）"
      evidence: "Brooks 2016 JPSP 6项实验：仪式化动作显著提升自我纪律感；报告定位：启动注意力、积累首批数据，真效应 r≈0.10，不期望改变人生"
      sources: ["Brooks et al. 2016 JPSP"]
      url: ""
    - claim: "'人生仪表'四板块（健康-爱-工作-娱乐）自评有科学对应且健康值得独立成板块"
      verdict: "部分支持"
      original: "✅ 部分支持（PERMA + Wheel of Life）"
      evidence: "四板块与 Seligman PERMA 五要素部分对应；Khaw & Kern 2015 马来西亚样本：健康等维度在自由回答中评分高但不在5因素内，支持健康独立成板块"
      sources: ["Seligman 2011 PERMA", "Khaw & Kern 2015", "Butler & Kern 2016 PERMA-Profiler"]
      url: "https://www.peggykern.org/uploads/5/6/6/7/56678211/khaw___kern_2015_-_a_cross-cultural_comparison_of_the_perma_model_of_well-being.pdf"
    - claim: "每晚记录'三件好事'能持续提升幸福感（效应量如宣传所示）"
      verdict: "部分支持"
      original: "✅ 部分支持：效应存在但真实 r≈0.10，远小于宣传的 0.29"
      evidence: "Seligman 2005（N=411 随机对照）：1周练习效应持续至6个月；White 2019 重算：真实效应 r≈0.10；Gander 2013：2周版与安慰剂无差异；依从性是瓶颈"
      sources: ["Seligman et al. 2005", "White, Uttl & Holder 2019", "Gander et al. 2013"]
      url: "https://doi.org/10.1037/0003-066x.60.5.410"
    - claim: "AEIOU 观察框架是斯坦福/IDEO 的发明"
      verdict: "证伪"
      original: "❌ 错误归功（Doblin 1991）"
      evidence: "AEIOU 由 Rick Robinson 等4人 1991 年在 Doblin 集团提出；Robinson 本人强调它是分类启发式（约80% MECE），与 IDEO/d.school 无直接发明关系"
      sources: ["Robinson et al. 1991 (Doblin)", "Robinson 2015 EPIC 回忆录"]
      url: "https://www.epicpeople.org/building-a-useful-research-tool/"
    - claim: "'三种平行人生'推演（Odyssey Plan）有实证支撑且可预测长期职业转变"
      verdict: "部分支持"
      original: "✅ 部分支持：博士论文级证据但无长期追踪"
      evidence: "两篇斯坦福博士论文：职业构想能力提升、功能障碍性信念减少（统计显著）；但均为前测-后测设计，未追踪5-10年后真正转行者；对应 Schwartz 1991 情景规划"
      sources: ["Burnett & Evans 2016", "Schwartz 1991"]
      url: "https://www.penguinrandomhouseretail.com/book/?isbn=9781101875322"
    - claim: "Pre-mortem（事前验尸/逆向思维）显著降低对计划的过度自信"
      verdict: "支持"
      original: "（Veinott 2010 实验：显著优于普通批评与利弊列表）"
      evidence: "Veinott, Klein & Wiggins 2010 控制实验：pre-mortem 组过度自信降幅显著大于'普通批评'和'利弊列表'；Morewedge 2015：情景模拟类方法最稳健持久；需心理安全（配 trusted partner）"
      sources: ["Klein 2007 HBR", "Veinott, Klein & Wiggins 2010", "Morewedge et al. 2015"]
      url: "https://hbr.org/2007/09/performing-a-project-premortem"
    - claim: "原型对话（信息性访谈）是经过 RCT 验证的有效工具"
      verdict: "存疑"
      original: "机制可信但直接 RCT 缺位（效应量未确认）"
      evidence: "机制基于 Deutsch & Gerard 1955 信息性社会影响；但未找到直接检验其有效性的 RCT；冷邮件回复率仅20-30%，且存在幸存者偏差（只能见到还在干这行的人）"
      sources: ["Deutsch & Gerard 1955"]
      url: ""
    - claim: "短期职业体验（shadowing）能提升职业决策自我效能"
      verdict: "支持"
      original: "（Onkst & Nice 2026 RCT：显著提升 p<.001）"
      evidence: "Onkst & Nice 2026 RCT（N=131，美国农村高中生）：career decision self-efficacy 显著提升（p<.001，d≈0.42）"
      sources: ["Onkst & Nice 2026 RCT"]
      url: "https://doi.org/10.1080/21501378.2026.2660703"
    - claim: "1-2天的短期 shadowing 可作为可靠的职业决策工具（短期体验≈长期生活）"
      verdict: "证伪"
      original: "❌ 不能当'决策工具'——career maturity 反而下降"
      evidence: "同一 RCT：career maturity 反而下降（r=.39，p<.001）；短期体验≠长期生活（时间充裕度、责任构成不同），新鲜感光环会高估行业热情"
      sources: ["Onkst & Nice 2026 RCT"]
      url: "https://doi.org/10.1080/21501378.2026.2660703"
    - claim: "PERMA 五要素幸福模型与主观幸福感高度重叠（潜在相关达0.98，是同一通道的不同测量）"
      verdict: "支持"
      original: "（Goodman 2017：潜在相关0.98，Seligman 承认同一通道）"
      evidence: "Goodman, Disabato, Kashdan & Kauffman 2017（N=517）：PERMA-Profiler 与 SWB 潜在相关达 0.98；Seligman 据此承认两者同一通道，但 PERMA 在'建设 well-being'上更可操作"
      sources: ["Goodman et al. 2017", "Butler & Kern 2016"]
      url: "https://internationaljournalofwellbeing.org/index.php/ijow/article/view/526"
    - claim: "'逆时针'实验证明一周环境/心理重置可显著逆转衰老与身心指标"
      verdict: "存疑"
      original: "样本量仅8人；未做长期追踪；不能外推"
      evidence: "Langer 1979：8名70+男性在修道院'过一周1959年'，灵活性/视力/握力等改善优于控制组；但 Wiseman 指出自我暗示等可解释，不可外推到职业偏好重塑"
      sources: ["Langer 1979 counterclockwise", "Wiseman（BBC 引述评论）"]
      url: "https://d1ge0kk1l5kms0.cloudfront.net/images/G/01/randoEMS/COUNTERCLOCKWISE.pdf"
    - claim: "视频'21天四步法'如实转述斯坦福原书《Designing Your Life》"
      verdict: "证伪"
      original: "营销化二次包装：严重压缩+时长虚标1.4-2.1倍"
      evidence: "原书为11章完整体系（Odyssey Plan 不评级+4维 Dashboard 等关键规则丢失）；课程实为10周-1学年；'四步法+21天'无原书出处"
      sources: ["Burnett & Evans 2016《Designing Your Life》", "Stanford Life Design Lab", "d.school 历史"]
      url: "https://readingraphics.com/book-summary-designing-your-life/"
    - claim: "《The Art of Possibility》与 Schwartz 的 Shell 情景规划同源"
      verdict: "证伪"
      original: "❌ 误传（Zander 夫妻领导力/教练书）"
      evidence: "《The Art of Possibility》(2000) 是 Zander 夫妻的可能性思维实践书；Schwartz 1991《The Art of the Long View》才是 Shell 情景规划开山之作，两者无作者或方法论继承关系"
      sources: ["Zander & Zander 2000", "Schwartz 1991《The Art of the Long View》"]
      url: "https://www.penguinrandomhouse.com/books/162919/the-art-of-the-long-view-by-peter-schwartz/"
