- theme: "两类好奇心脑科学-认知需求与探索式搜寻"
  category: "6_个人成长方法论/6.1_认知与心理科学方法论"
  report_file: "两类好奇心脑科学-认知需求与探索式搜寻调研报告.md"
  claims:
    - claim: "NFC（认知需求）高者右苍白球与左梭状回灰质更大有真实论文依据，但证据未通过FWE全脑校正、系探索性发现"
      verdict: "部分支持"
      original: "✅ 有文献 / ⚠️ 未校正"
      evidence: "Tolomeo et al. 2023（N=82，VBM）报告右苍白球与左梭状回灰质与NFC正相关，但FWE全脑校正后无显著簇，作者自认探索性发现"
      sources: ["Tolomeo 2023"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10498082/"
    - claim: "EIS（消费探索倾向）高者左楔前叶灰质更大，但'消费场景联想'解读引申过度且系单篇孤证"
      verdict: "部分支持"
      original: "✅ 有文献 / ❌ '消费场景联想'是引申过度"
      evidence: "Tolomeo 2023（N=82）报告左楔前叶灰质与EIS相关但未过FWE校正；主流消费神经科学将购物奖赏定位于纹状体（Knutson 2007），楔前叶关联为孤证"
      sources: ["Tolomeo 2023", "Knutson 2007"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10498082/"
    - claim: "消费相关探索因子与左额中回灰质相关（注意重定向解释），是视频对原论文最准确的转述"
      verdict: "支持"
      original: "✅ 视频最准确的转述"
      evidence: "Tolomeo 2023 EFA的消费探索因子对应左额中回（-40,14,42），作者引Japee 2015解释为注意重定向"
      sources: ["Tolomeo 2023"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10498082/"
    - claim: "NFC与EIS行为得分零相关，两类好奇心是独立分布的四象限结构而非互斥对立"
      verdict: "支持"
      original: "行为零相关——这才是'两类好奇心'分离的实证基础"
      evidence: "Tolomeo 2023（N=82）：NFC×EIS r(78)=-0.07, p=.54；EFA载荷到互不相关因子；左梭状回同时与两者正相关"
      sources: ["Tolomeo 2023"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10498082/"
    - claim: "'学霸与购物达人是互斥的两种人'的二分法不成立：零相关不等于互斥，存在高NFC高EIS象限"
      verdict: "证伪"
      original: "反对面（视频的过度二分）"
      evidence: "r=-0.07说明独立分布；左梭状回为两类好奇心共同脑区；Bromberg-Martin & Hikosaka 2009显示同一中脑多巴胺系统编码不同类型信息价值（共享底层+内容分化）"
      sources: ["Tolomeo 2023", "Bromberg-Martin & Hikosaka 2009"]
      url: ""
    - claim: "'比价倾向高源于梭状回信息整合'是过度推论，比价的认知核心在前额叶-纹状体价值网络"
      verdict: "证伪"
      original: "❌ 过度推论"
      evidence: "梭状回权威功能是视觉专家化识别（面孔/词形）；比价涉及vmPFC价值编码与dACC冲突监控（Knutson 2007等），与梭状回无关"
      sources: ["Knutson 2007", "Tolomeo 2023"]
      url: "https://doi.org/10.1016/j.neuron.2006.11.023"
    - claim: "NFC是动机倾向而非能力，'不爱动脑'不等于意志力差或能力不足"
      verdict: "支持"
      original: "方向正确（去道德化视角）"
      evidence: "NFC与流体智力仅中度相关（r≈.28），与工作记忆不相关；学业成绩元分析136个效应量N=53,258仅r≈.20"
      sources: ["Cacioppo & Petty 1982"]
      url: "https://doi.org/10.1080/00223981.1982.9720437"
    - claim: "'不爱动脑是奖赏机制先天偏弱'中'先天'用词过强，横断面研究无法区分天生与用进废退"
      verdict: "存疑"
      original: "⚠️ 半真——方向对，'先天'过强"
      evidence: "NFC遗传度20-40%说明个体差异真实；但Draganski 2004证明3个月训练即可改变灰质，多巴胺基因对NFC的直接效应经贝叶斯检验未获支持"
      sources: ["Draganski 2004", "Maguire 2000"]
      url: "https://www.nature.com/articles/nature02400"
    - claim: "好奇心本身就是奖赏：好奇激活尾状核与SN/VTA多巴胺回路，中脑神经元编码信息预测误差"
      verdict: "支持"
      original: "✅ 机制成立 / ⚠️ 引文嫁接"
      evidence: "Kang 2009好奇激活尾状核；Gruber 2014好奇激活SN/VTA；Bromberg-Martin & Hikosaka 2009中脑多巴胺神经元编码信息预测误差"
      sources: ["Kang 2009", "Gruber 2014", "Bromberg-Martin & Hikosaka 2009"]
      url: "https://doi.org/10.1016/j.neuron.2014.08.043"
    - claim: "好奇心状态增强海马依赖的学习与记忆（先有好奇问题，再有奖赏激活，顺序不能反）"
      verdict: "支持"
      original: "权威证据（Gruber 2014 Neuron）"
      evidence: "Gruber 2014：好奇心激活SN/VTA并增强海马依赖学习，中脑活动可解释过半偶然记忆获益方差；Kang 2009高好奇心问题记忆保持更好"
      sources: ["Gruber 2014", "Kang 2009"]
      url: "https://doi.org/10.1016/j.neuron.2014.08.043"
    - claim: "视频引用的'Kobayashi & Hsu 2019 Neuron《Primary need for novelty》'查无此文，系引文嫁接"
      verdict: "证伪"
      original: "查无此文"
      evidence: "多轮精确检索未找到该文；实际应为Kobayashi & Hsu 2009 PNAS'Common neural code for reward and information value'"
      sources: ["Kobayashi & Hsu 2009"]
      url: ""
    - claim: "灰质结构可塑，约3个月训练即可改变灰质，不应以脑区差异给自己贴终身标签"
      verdict: "支持"
      original: "灰质可塑（Draganski 2004）——33岁的思考偏好不是43岁的命运"
      evidence: "Draganski 2004 Nature：杂耍训练3个月改变灰质；Maguire 2000：出租车司机海马后部更大，可能长期实践的结果而非原因"
      sources: ["Draganski 2004", "Maguire 2000"]
      url: "https://www.nature.com/articles/nature02400"
    - claim: "'思考时大脑分泌多巴胺正向激励'为过度具体化，fMRI仅测得脑区激活而非神经递质"
      verdict: "部分支持"
      original: "⚠️ '分泌多巴胺'为过度具体化"
      evidence: "Lee & Reeve 2017：自主动机任务激活前脑岛+纹状体，但均为fMRI BOLD信号，非多巴胺直接测量"
      sources: ["Lee & Reeve 2017"]
      url: ""
    - claim: "EIS量表本质是消费语境构念（购物信息探索倾向），把它泛化为普遍好奇心类型超出构念边界"
      verdict: "支持"
      original: "视频用它指'购物达人'方向正确；泛化则超出构念边界"
      evidence: "EIS源自Baumgartner & Steenkamp 1996 EBBT量表的10题子量表，属消费者行为学量表，测'获取新奇购物/消费信息的倾向'"
      sources: ["Baumgartner & Steenkamp 1996"]
      url: ""
    - claim: "NFC个体差异部分可遗传（遗传度约20-40%），学习动机遗传度约40%"
      verdict: "支持"
      original: "遗传度 20-40%"
      evidence: "NFC遗传度20-40%；学习动机遗传度约40%（1.3万双生子、6国样本）；低NFC者从思考中获得的神经奖赏可能更少"
      sources: []
      url: ""
