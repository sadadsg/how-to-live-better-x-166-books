- theme: "决策科学方法论"
  category: "6_个人成长方法论/6.1_认知与心理科学方法论"
  report_file: "决策科学方法论调研报告.md"
  claims:
    - claim: "自主/胜任/关联三需要满足与幸福感、工作投入强相关（r=0.37-0.50），动机一致性是决策'道'维度的科学基础"
      verdict: "支持"
      original: "✓✓✓"
      evidence: "MetaSDT活体元分析（k≈220，N>60,000）：三需要与生活满意度r=0.37-0.50；Howard 2020（k≈76，N≈18,260）：自主需要与工作投入r≈0.45-0.50"
      sources: ["Howard et al. 2020", "Deci & Ryan 2000"]
      url: "https://www.metasdt.org"
    - claim: "使命感/意义感与工作投入强相关（r=0.51）并可纵向预测工作满意度"
      verdict: "支持"
      original: "✓✓✓"
      evidence: "Allan 2019元分析（k=27，N≈11,000）：使命感与工作投入r=0.51、与满意度r=0.44；Duffy 2012纵向N=400预测1年后满意度β≈0.32"
      sources: ["Allan et al. 2019"]
      url: ""
    - claim: "重要决策使用结构化清单能显著降低错误率：外科安全清单使死亡率相对下降约40%"
      verdict: "支持"
      original: "✓✓✓"
      evidence: "Haynes 2009 NEJM（N=7,688/7,730，8家医院）：死亡率1.5%→0.8%（相对-40%）、并发症-36%；Haugen 2015（N≈22,000整群RCT）：死亡率OR=0.56"
      sources: ["Haynes et al. 2009", "Haugen et al. 2015"]
      url: "https://doi.org/10.1056/NEJMsa0810119"
    - claim: "决策前Premortem（预演失败）与'考虑对立面'能显著改善风险识别与过度自信"
      verdict: "支持"
      original: "✓✓✓ / ✓✓"
      evidence: "Mitchell 1989：premortem组多识别30-40%有效风险；Morewedge 2015（N=750）：考虑对立面修正过度自信d=0.40；Klein 2007 NASA工作坊多识别7项关键风险"
      sources: ["Morewedge et al. 2015", "Klein 2007"]
      url: "https://hbr.org/2007/09/performing-a-project-premortem"
    - claim: "结构化复盘（AAR/debrief）能稳定提升个人与团队绩效（d≈0.36），但形式化复盘效应衰减至d≈0.10"
      verdict: "支持"
      original: "✓✓✓"
      evidence: "Tannenbaum & Cerasoli 2013元分析（k≈75）：整体d=0.36，个人复盘d≈0.37；形式化填表或时长<5分钟时衰减至d≈0.10"
      sources: ["Tannenbaum & Cerasoli 2013"]
      url: "https://doi.org/10.1177/0018720812448394"
    - claim: "个人主动择时（猜顶猜底）长期跑输市场：20年窗口92%主动基金跑输指数，频繁交易散户年回报低6.5%"
      verdict: "证伪"
      original: "✓✓✓（反向）——越多人相信可择时，越多人失败"
      evidence: "SPIVA 2024：20年窗口92%大型股主动基金跑输、10年85%跑输；Barber & Odean 2000（N=35,000账户）：交易最频繁散户净回报低于买入持有6.5%/年"
      sources: ["SPIVA 2024", "Barber & Odean 2000"]
      url: "https://www.spglobal.com/spiva/"
    - claim: "'意志力像肌肉会耗竭'（自我损耗）的经典强效应被多实验室复制否定，仅存微小效应且受动机调节"
      verdict: "证伪"
      original: "❌⚠⚠⚠ 严重失真——经典叙事严重动摇"
      evidence: "Hagger 2016（23实验室注册复制）d=0.04 vs 原始d=0.86；Many Labs 2017（32实验室）d≈0.03；2022-2024元分析d≈0.06-0.16；启示：纪律性决策应重流程、轻意志"
      sources: ["Hagger et al. 2016", "Many Labs 2017"]
      url: ""
    - claim: "沉没成本谬误真实存在，但真实商业情境中效应远小于实验室（仅解释8-12%决策变异），且存在复制争议"
      verdict: "部分支持"
      original: "✓✓（真实情境效应小于实验）⚠️ 复制争议"
      evidence: "Thaler 1980（N=92）：已购票者88%坚持观赛vs未购票17%；Navarro & Fantino 2005部分复制失败；Bornemann & Homburg 2011（N=237真实投资）解释8-12%变异"
      sources: ["Thaler 1980", "Navarro & Fantino 2005"]
      url: ""
    - claim: "承诺升级（越投入越难撤手）是组织决策最稳健的偏差之一（元分析k=137，d≈0.40）"
      verdict: "支持"
      original: "✓✓✓"
      evidence: "Sleesman et al. 2012元分析（k=137）确认承诺升级是最稳健偏差之一；Brockner 1992元分析（k≈30）平均d≈0.40"
      sources: ["Sleesman et al. 2012", "Brockner 1992"]
      url: ""
    - claim: "重大决策预先定义退出条件可显著降低失败率（创业失败率低25%），73%失败项目事前已有预警信号"
      verdict: "支持"
      original: "✓✓✓"
      evidence: "DeTienne 2010（N=300创业退出案例）：预先定义退出条件者失败率低25%；Sull 2018（N=1,000+战略决策）：73%失败项目决策前有可识别预警信号但被忽略"
      sources: ["DeTienne 2010", "Sull et al. 2018"]
      url: "https://hbr.org/2018/11/when-to-pull-the-plug-on-a-failing-strategy"
    - claim: "反馈干预平均提升绩效d≈0.38，但约1/3的反馈反而降低绩效（d=-0.38），任务层反馈才有效"
      verdict: "支持"
      original: "✓✓✓（⚠⚠ 双峰分布）——反馈形式比频率更重要"
      evidence: "Kluger & DeNisi 1996元分析（k=607，跨度约80年）：平均d=+0.38，约1/3研究负向（平均d=-0.38）；反馈触发自我焦虑时抑制绩效"
      sources: ["Kluger & DeNisi 1996"]
      url: "https://doi.org/10.1037/0033-2909.119.2.254"
    - claim: "习惯自动性形成中位数约66天（18-254天），'21天养成习惯'迷思被推翻"
      verdict: "支持"
      original: "✓✓——'21 天'迷思被推翻"
      evidence: "Lally 2010（N=96，84天日记法）：达95%自动性中位66天，自动性按渐近曲线增长；漏做一天无实质影响"
      sources: ["Lally et al. 2010"]
      url: "https://doi.org/10.1002/ejsp.674"
    - claim: "损失厌恶系数约2:1得到大样本元分析确认（中位约2.07）"
      verdict: "支持"
      original: "✓✓✓——与原始2:1比率高度一致"
      evidence: "Brown et al. 2024 PNAS元分析（k≈150，N≈30,000）：中位损失厌恶比≈2.07，与Kahneman & Tversky 1979的2:1高度一致"
      sources: ["Brown et al. 2024", "Kahneman & Tversky 1979"]
      url: ""
    - claim: "OKR作为独立框架的直接RCT证据薄弱，有效的是'具体而困难的目标'设置原理（d≈0.55）"
      verdict: "存疑"
      original: "⚠️ OKR 直接证据薄弱（过度推广）"
      evidence: "Locke & Latham 2002元分析（k≈70，N≈9,000）：具体且困难目标d≈0.55；Castro 2018系统综述：OKR学术实证明显稀缺，多为案例与白皮书"
      sources: ["Locke & Latham 2002", "Castro et al. 2018"]
      url: ""
    - claim: "助推/默认选项能有效改变行为（d≈0.20-0.40），但现场效应比实验室衰减约1/3且10-20%的nudge失效"
      verdict: "支持"
      original: "✓✓✓（⚠⚠ 边界显著）"
      evidence: "Maier 2022 PNAS元分析（k=200，N≈3.5M）：中位d≈0.20-0.40；Szaszi 2018：实验室d≈0.42、现场d≈0.28；Sunstein承认10-20%为失效nudge"
      sources: ["Maier et al. 2022", "Szaszi et al. 2018"]
      url: ""
