- theme: "大脑可塑性科学依据"
  category: "6_个人成长方法论/6.1_认知与心理科学方法论"
  report_file: "大脑可塑性科学依据调研报告.md"
  claims:
    - claim: "成年大脑仍可被训练结构性改变：训练可扩张皮层代表区、增加灰质（教科书级强证据）"
      verdict: "支持"
      original: "证据强度强（成人神经发生部分争议）"
      evidence: "Jenkins & Merzenich 1990：行为训练数周即重组成年猴皮层；Maguire 2000（n=16司机）：后部海马灰质更大且与从业年数正相关；Draganski 2004（n=24）：3个月杂耍灰质扩张"
      sources: ["Jenkins & Merzenich 1990", "Maguire et al. 2000", "Draganski 2004"]
      url: "https://www.pnas.org/doi/10.1073/pnas.070039597"
    - claim: "训练带来的结构增益会随停练部分回落，'技能一旦学会永不遗忘'不成立，需维持性练习"
      verdict: "支持"
      original: "★★（'技能难以遗忘'要打折）"
      evidence: "Draganski 2004：杂耍灰质增益停练3个月回落（原文自称transient）；Raffin & Siebner 2018：1周固定手指即削弱既有技能与皮层代表"
      sources: ["Draganski 2004", "Raffin & Siebner 2018"]
      url: "https://doi.org/10.1038/427311a"
    - claim: "'伦敦出租车司机海马体更活跃'的归类与解读有误：原始发现是后部海马体积更大（结构性），且专业化有学习代价"
      verdict: "证伪"
      original: "★★★ 最重要的内容性偏差（归类错位）"
      evidence: "Maguire 2000测得后部海马灰质体积更大（VBM），Boyd原文将其列于结构性段落；Maguire 2006：司机习得新空间信息能力劣于公交司机，代价被传播省略"
      sources: ["Maguire et al. 2000", "Maguire et al. 2006"]
      url: "https://www.pnas.org/doi/10.1073/pnas.070039597"
    - claim: "长期记忆靠间隔重复而非考前突击：最优间隔回忆成绩提升64%（d=1.1），且72%的人误以为突击更有效"
      verdict: "支持"
      original: "强（百年历史 + 317 实验元分析）"
      evidence: "Cepeda 2006元分析（184篇/317实验）：271组直接比较仅12组间隔无益；Cepeda 2008（n>1350）：最优间隔回忆+64%；Kornell 2009：72%被试误以为集中学习更有效"
      sources: ["Cepeda et al. 2006", "Cepeda et al. 2008", "Kornell 2009"]
      url: "https://pubmed.ncbi.nlm.nih.gov/16719566/"
    - claim: "'智力无上限所以相信就能逆袭'是证据越级：成长型思维干预对普通学生学业效应接近零（d=0.08）"
      verdict: "证伪"
      original: "干预效应弱（群体层面强 / 干预效应弱）"
      evidence: "Sisk 2018两大元分析：关联k=273 N=365,915仅r=.10；干预k=43 N=57,155 d=0.08（一般教育干预d≈0.57）；Yeager 2019（N=12,490）：低成就学生GPA仅+0.1"
      sources: ["Sisk et al. 2018", "Yeager et al. 2019"]
      url: "https://doi.org/10.1177/0956797617739704"
    - claim: "成长型思维干预对弱势学生（低SES/高学业风险）有小幅正向效应（d≈0.19-0.34）"
      verdict: "部分支持"
      original: "亚组分析：低社会经济地位学生 d=0.34、高学术风险学生 d=0.19"
      evidence: "Sisk 2018亚组：低SES学生d=0.34、高学术风险学生d=0.19；Yeager 2019（N=12,490）：约1小时在线干预使低成就学生GPA小幅提升，效应依赖学校同伴规范"
      sources: ["Sisk et al. 2018", "Yeager et al. 2019"]
      url: "https://www.nature.com/articles/s41586-019-1466-y"
    - claim: "静息时大脑并非停机：默认模式网络维持基线活动，大脑以约20%的全身能耗持续运转"
      verdict: "支持"
      original: "强（三个误区中证据最扎实）"
      evidence: "Raichle 2001：发现DMN静息基线活动；Raichle & Gusnard 2002：大脑占体重约2%却耗约20%氧气与热量，且跨精神状态 remarkably constant"
      sources: ["Raichle et al. 2001", "Raichle & Gusnard 2002"]
      url: "https://www.pnas.org/doi/10.1073/pnas.98.2.676"
    - claim: "睡眠巩固记忆：睡眠中神经活动重放白天经验，第一夜睡眠即带来约20%的技能速度增益"
      verdict: "支持"
      original: "有硬证据（'学完就睡'）"
      evidence: "Wilson & McNaughton 1994：大鼠慢波睡眠中位置细胞按白天相同顺序重放；Walker 2002/2003：一夜睡眠+20%速度增益，加倍练习量不改变该增益"
      sources: ["Wilson & McNaughton 1994", "Walker 2002"]
      url: "https://www.science.org/doi/10.1126/science.8036517"
    - claim: "习惯自动性形成中位约66天（全距18-254天，复杂行为106-154天），'21天/X天习惯法则'无科学依据"
      verdict: "支持"
      original: "任何'X 天养成习惯'的单一数字都无科学依据"
      evidence: "Lally 2010（N=96，12周日记）：95%自动性中位66天、漏做一天无实质影响；Singh 2024系统综述（20项纵向研究n=2,601）：简单行为59-66天、复杂行为106-154天"
      sources: ["Lally et al. 2010", "Singh 2024"]
      url: "https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674"
    - claim: "if-then执行意图（若情境Y则做X）是低成本习惯工具（d=0.65），优于'强迫自己'的意志路径"
      verdict: "支持"
      original: "执行意图强（d=0.65）/'意志强迫'路径无元分析支持"
      evidence: "Gollwitzer & Sheeran 2006元分析（94项独立检验）：if-then计划d=0.65（中-大效应）；'强迫'一词并非Boyd演讲原话"
      sources: ["Gollwitzer & Sheeran 2006"]
      url: "https://doi.org/10.1016/s0065-2601(06)38002-1"
    - claim: "'练够一万小时就能精通'确属过度简化：刻意练习解释表现方差有限（音乐21%、体育18%、教育4%、职业<1%）"
      verdict: "证伪"
      original: "争议未决，但'练够一万小时就能精通'确属过度简化"
      evidence: "Macnamara 2014元分析（88项研究）；Macnamara & Maitra 2019预注册复制Ericsson原研究失败；1万小时是Gladwell对Ericsson的简化，Ericsson本人否认'魔力数字'"
      sources: ["Macnamara 2014", "Macnamara & Maitra 2019"]
      url: "https://doi.org/10.1098/rsos.190327"
    - claim: "'放弃好习惯会导致大脑能力退化'在健康人群中证据薄弱，属过度推论的恐惧叙事"
      verdict: "存疑"
      original: "★★（健康人群证据薄弱）——勿用恐惧叙事自我鞭策"
      evidence: "支持证据主要来自临床/动物模型（剥夺致代表区萎缩、习得性失用）；健康成人日常行为的用进废退神经影像证据薄弱；慢性疼痛类证据已有反例（Gustin 2012）"
      sources: ["Gustin et al. 2012"]
      url: ""
    - claim: "成人海马能否长出新神经元在学界仍未决：Sorrells 2018几乎检不出 vs Boldrini 2018等结论相反，不宜当定论引用"
      verdict: "存疑"
      original: "★★（争议未决）"
      evidence: "Sorrells 2018（n=17+12标本）：成人齿状回几乎检不出新神经元；Boldrini 2018/Moreno-Jiménez 2019：健康者至90岁仍有数千未成熟神经元；分歧在组织固定方法"
      sources: ["Sorrells et al. 2018", "Boldrini et al. 2018"]
      url: "https://www.nature.com/articles/nature25975"
    - claim: "单次tDCS经颅脑刺激对健康成人认知无可靠增益：59项认知结局分析无一显著"
      verdict: "证伪"
      original: "'脑刺激定制升级'不可信"
      evidence: "Horvath 2015系统综述：59项认知结局分析中无一显著；'阳极易化'效应在认知任务中的出现率仅0.16"
      sources: ["Horvath et al. 2015"]
      url: "https://pubmed.ncbi.nlm.nih.gov/25701175/"
    - claim: "重复行为会形成纹状体习惯回路（控制权向背外侧纹状体转移），但前额叶存在'皮层闸门'，固化不等于不可逆"
      verdict: "支持"
      original: "成瘾强 / 习惯化强（负面可塑性证据分层）"
      evidence: "Graybiel 2008：重复行为在基底节被打包为单一单元；Yin & Knowlton 2006：习惯形成=控制权从DMS向DLS转移；Smith & Graybiel 2013：前额叶边缘下区可逐试验决定是否以习惯方式执行"
      sources: ["Graybiel 2008", "Yin & Knowlton 2006", "Smith & Graybiel 2013"]
      url: "https://doi.org/10.1146/annurev.neuro.29.051605.112851"
