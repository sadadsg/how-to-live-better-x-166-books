- theme: "A股操作避坑准则数据核验"
  category: "3_宏观经济金融/3.3_货币债务与危机"
  report_file: "A股操作避坑准则数据核验调研报告.md"
  claims:
    - claim: "对上证指数而言，高开 2% 以上的交易日约 80% 不高走，高开追买 5 日平均收益为负——'高开不追'在上证指数口径下成立"
      verdict: "支持"
      original: "✅ 数字真实 / ✅ 对上证成立"
      evidence: "腾讯接口复算 4294 日：≥2% 高开 15 次、高走仅 3 次（与视频'15 次仅 3 次高走'逐字吻合）；≥1% 高开 76 次回落 42 次；追高 5 日均值 -0.8%；与 A 股隔夜负收益异象文献同向"
      sources: ["腾讯行情接口日线复算（上证指数 2009-2026，4294 日）", "An, Huang & Li 2022 隔夜负收益异象（3665 只个股，67.94% 显著为负）", "Qiao & Dam 2020 T+1 隔夜收益之谜"]
      url: "https://www.mdpi.com/1911-8074/15/11/534"
    - claim: "'高开不追'是全市场普适规律，对创业板等成长板块同样成立"
      verdict: "证伪"
      original: "🟡 对创业板不成立（高走率 57.8%、追高 5 日 +2.5%）"
      evidence: "创业板指同口径复算：高开 [1%,2%) 高走率 57.8%、追高 5 日 +2.5%——方向与上证相反；个股高开次数是完全不同的量级（茅台同窗口 ≥2% 高开 194 次），接近抛硬币"
      sources: ["腾讯行情接口日线复算（创业板指/贵州茅台同窗口对照）"]
      url: ""
    - claim: "量化行情下高开更易兑现（高开回落率上升）"
      verdict: "存疑"
      original: "🟡 '量化行情'部分"
      evidence: "仅 [1%,2%) 高开带有方向性迹象：回落率从 2009-2015 的 48% 升至 2023-2026 的 56%，样本仅 9 次；≥2% 带（样本 3-8 次）不成立"
      sources: ["腾讯行情接口日线复算（分年代对照）"]
      url: ""
    - claim: "'股市没有持续上涨行情'——指数连涨 3-5 天后大概率回调，连红止盈是有统计优势的择时规则"
      verdict: "证伪"
      original: "❌ 作为择时规律 / ❌ '股市没有持续上涨行情'对指数不成立"
      evidence: "腾讯接口复算四标的：≥3 连涨后续涨概率 49.8%-51.6% 与基准无异；≥5 连涨上证 53.3%、沪深300 54.5% 反而高于基准；单轮最长连涨 11-12 天"
      sources: ["腾讯行情接口复算（上证/沪深300/创业板指/茅台 × ≥3/≥5 连涨续涨概率表）"]
      url: ""
    - claim: "账户连红后减仓止盈作为个人风控纪律自洽可行（非收益优化策略）"
      verdict: "部分支持"
      original: "🟡 作为风控纪律自洽"
      evidence: "连红后持有的惯性优势基本为零（续涨概率≈50%），止盈期望损失小；林树/俞乔实验：中国投资者赌徒谬误强于热手；但与止损组合成低盈亏比结构，趋势市系统性让渡大盈利"
      sources: ["林树、俞乔《投资者热手效应与赌徒谬误的心理实验研究》", "Odean 1998 处置效应研究（约 1 万账户）", "腾讯行情接口复算"]
      url: "http://dianda.cqvip.com/Qikan/Article/Detail?id=22655781"
    - claim: "被套后死扛等回本代价极高：指数深回撤可能 5-19 年不解套，问题个股可能归零"
      verdict: "支持"
      original: "✅ 方向硬数据支撑"
      evidence: "复算：上证 2015 峰 -52.3% 至今 11 年未回本、6124 点 19 年未收复、创业板 2015 峰 -69.7% 用 10.4 年；乐视网 179→0.18 元 28 万股东归零；2022-2025 退市 174 家"
      sources: ["腾讯行情接口复算（回撤回本时长表）", "中证网《十年前的 6124 点历史大顶》", "21财经《2025 年 A 股退市盘点》"]
      url: "https://www.cs.com.cn/xwzx/zt2017/20171016/01/201710/t20171016_5515432.html"
    - claim: "'死扛'在任何情况下都是错误策略，无需区分标的质地"
      verdict: "证伪"
      original: "🟡 边界：茅台 2012 腰斩后涨逾十倍——'基本面未坏'时死扛可赢"
      evidence: "茅台 2012-2014 腰斩（-54%~-61%）后 2015 年创新高、低点涨逾十倍——基本面未坏的价值股死扛反而最优；'不死扛'仅在估值泡沫/强周期/基本面受损标的上成立"
      sources: ["腾讯行情接口复算", "经济观察网《茅台再成A股王：价值投资的回归？》"]
      url: "http://www.eeo.com.cn/2017/0114/296297.shtml"
    - claim: "看好两只股票时等权小仓同买（N=2 分散）优于二选一全押，可显著降低组合波动"
      verdict: "支持"
      original: "✅ 理论无条件成立，A 股环境放大其价值"
      evidence: "组合方差 σ²(1+ρ)/2：ρ=0.5 降 25%、ρ=0 降 50%；押错算术：一好一坏时全押 -20% vs 等权 0%；A 股年化波动约 32%≈美国 2 倍，分散价值更大"
      sources: ["Markowitz 组合理论", "Statman 1987（JFQA）", "NBER w20957（中国市场波动约美国 2 倍）"]
      url: "https://www.jstor.org/stable/2330969"
    - claim: "持有 2 只股票即可实现充分分散"
      verdict: "证伪"
      original: "30-40 只才充分分散（保留意见）"
      evidence: "Statman 1987：充分分散需 30-40 只股票；N=2 处于方差下降曲线最陡段、前几只边际改善最大，但只解决单票押错，不解决系统性风险"
      sources: ["Statman 1987《How Many Stocks Make a Diversified Portfolio?》"]
      url: "https://www.jstor.org/stable/2330969"
    - claim: "指数与趋势行情中，破位后止损离场优于硬扛（指数破位后短期延续）"
      verdict: "支持"
      original: "🟡 双刃：指数/趋势市/急跌口径 ✅"
      evidence: "时序动量在 58 个品种全部显著（MOP 2012, JFE）；A 股指数存在短期时序动量（Shi & Zhou 2017）；趋势跟踪有 1880 年以来百年证据"
      sources: ["Moskowitz, Ooi & Pedersen 2012《Time Series Momentum》（58 品种）", "Shi & Zhou 2017 A 股时序动量研究"]
      url: "https://www.sciencedirect.com/science/article/pii/S0304405X11002613"
    - claim: "个股与震荡市中机械止损同样占优（个股破位后延续下跌）"
      verdict: "存疑"
      original: "🟡 个股/震荡市（机械止损易卖在局部低点）"
      evidence: "A 股横截面动量基本失效、1-12 月中期反转占优（7 篇文献同向）——个股破位后均值回复概率不低，震荡市机械止损易卖在局部低点"
      sources: ["A 股横截面动量反转文献组（7 篇）", "Shi & Zhou 2017（短期动量+长期反转）"]
      url: "https://arxiv.org/abs/1702.07374"
    - claim: "A 股跌停封板时止损单可能无法成交（磁吸效应），假设按破位价成交的回测会高估止损效果"
      verdict: "支持"
      original: "A股特有执行约束（红线 8）"
      evidence: "涨跌停磁吸效应研究（Chen et al./Princeton；Liu 2009）：跌停封板时止损单无法成交，只能次日承接更低开盘；创业板改 20% 涨跌幅后磁吸基本消失"
      sources: ["Chen et al.（Princeton）涨跌停磁吸效应研究", "Liu 2009 价格限制研究"]
      url: "https://www.princeton.edu/~wxiong/papers/PriceLimit.pdf"
    - claim: "'看不懂或行情差时空仓'作为防御性风险预算管理成立（A 股牛短熊长、震荡市占 43%）"
      verdict: "支持"
      original: "🟡 防御性空仓 ✅"
      evidence: "A 股牛市平均 12-13 个月 vs 熊市 27-28 个月（熊市约 2.3 倍）；荀玉根五轮牛熊划分：震荡市占 43%——近八成时间非牛市，'天天满仓'隐含成本高"
      sources: ["荀玉根（海通证券）五轮牛熊划分（中证网）", "人民网《中美牛市比较》", "腾讯行情接口复算"]
      url: "https://cs.com.cn/gppd/201703/t20170314_5207111.html"
    - claim: "通过预测顶底、躲跌等涨的主动择时空仓能提高收益"
      verdict: "证伪"
      original: "🟡偏❌ 预测式空仓与证据冲突"
      evidence: "错过沪深300 涨幅最大的 10 个交易日（占比不到 1%）收益 +28.65%→-14%；错过偏股基金指数最大 5 天收益减少近 100%；基民择时年均损耗 2.53%；最佳交易日紧邻恐慌日"
      sources: ["新浪财经《错过涨幅最大的 10 天》", "基金业协会《40 张图，坚定投资信心》", "《公募权益类基金投资者盈利洞察报告》"]
      url: "https://finance.sina.cn/2022-03-30/detail-imcwiwss9016101.d.html"
