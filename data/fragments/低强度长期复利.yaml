- theme: "低强度长期复利"
  category: "6_个人成长方法论/6.3_情绪压力与韧性"
  report_file: "低强度长期复利调研报告.md"
  claims:
    - claim: "习惯形成的中位时间约为66天（范围18-254天），因行为复杂度差异巨大；30天只能建立'动作-提示'稳定链，不足以宣称完全自动化"
      verdict: "支持"
      original: "🟢 强支持（真金）"
      evidence: "Lally et al. 2010（EJSP 40:998-1009）真实情境研究：中位66天达到自动性峰值，自动性曲线为指数渐近线，前期增长最快；30天约覆盖前40-50%加速段"
      sources: ["Lally, van Jaarsveld, Potts & Wardle 2010, European Journal of Social Psychology"]
      url: ""
    - claim: "坚持21天即可形成习惯"
      verdict: "证伪"
      original: "🔴 没有任何研究支持'21天形成习惯'——Maltz只是临床观察未做实验"
      evidence: "Lally 2010实测中位66天（18-254天）；21天说法源自Maltz医生临床观察，从未有实验支持"
      sources: ["Lally et al. 2010, EJSP", "Maltz 1960（临床观察，非实验）"]
      url: ""
    - claim: "把目标降到'丢人级'最小剂量，配合固定锚点与实施意图（如果-那么），可显著提高目标达成率"
      verdict: "支持"
      original: "🟢 强支持（真金）"
      evidence: "Gollwitzer & Sheeran 2006元分析（94项研究、>8000受试者）：实施意图使目标达成率提高d≈0.65，健身节食类可达2-3倍；Fogg 2019 B=MAP：动机下降时唯一杠杆是降难度+强提示"
      sources: ["Gollwitzer & Sheeran 2006 (meta, k=94)", "Fogg 2019, Tiny Habits", "Gollwitzer 1999, American Psychologist"]
      url: ""
    - claim: "习惯中断后加倍补偿（'今天没做明天做2倍'）极易诱发二次中断，正确做法是次日以最低存活剂量（约20%）恢复并逐步爬升"
      verdict: "支持"
      original: "🔴 加倍补偿——Marlatt已证伪：补偿导致60%+的二次中断"
      evidence: "Marlatt & Gordon 1985复发预防模型：单次中断（lapse）不等于全面复发（relapse），补偿式恢复与'全自我失败'归因触发违戒效应（AVE）导致全面中断"
      sources: ["Marlatt & Gordon 1985, Relapse Prevention"]
      url: ""
    - claim: "自我同情（自我宽容+共同人性+正念）会增加而非削弱自我改进动机，中断后自责式归因才导致放弃"
      verdict: "支持"
      original: "✅ 强支持（真金）"
      evidence: "Breines & Chen 2012（PSPB）：自我同情提高自我改进动机，推翻'自我同情=放弃'误解；Leary et al. 2007：自我同情者失败后更倾向调整目标而非自责放弃"
      sources: ["Breines & Chen 2012, PSPB", "Neff 2003a, Self and Identity", "Leary et al. 2007"]
      url: ""
    - claim: "中断一天不算失败，连续中断两天才算链路断裂（never miss twice），第二天必须完成最低剂量"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Fogg 2019 Tiny Habits提出never miss twice；与Marlatt lapse≠relapse归因重构一致，被Clear 2018《Atomic Habits》与Maurer 2014引用"
      sources: ["Fogg 2019, Tiny Habits", "Marlatt & Gordon 1985", "Clear 2018, Atomic Habits"]
      url: ""
    - claim: "习惯建立初期（约30天）不公开宣告目标、屏蔽社会比较可保护内在动机，但完全沉默可能过度，30天后宜引入非目标领域的同侪"
      verdict: "部分支持"
      original: "🟡 部分（30天内锁死自我参照有据，但完全沉默可能过度）"
      evidence: "Festinger 1954社会比较+Deci & Ryan 1985 SDT支持初期低调；公开承诺悖论（Carden & Wood 2018）属流传证据强度较弱；高质量同侪可降低中断期孤独感与风险"
      sources: ["Festinger 1954, Human Relations 7(2)", "Deci & Ryan 1985", "Carden & Wood 2018"]
      url: ""
    - claim: "每日打勾的视觉链条系统通过小进展反馈与损失厌恶维持动机，可对抗潜伏期'无效感'"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Amabile & Kramer 2011（238份知识工作者日记、约12000工作日）：小胜是影响动机的最强催化剂，比评价与激励更强；Kahneman & Tversky 1979损失厌恶λ≈2.0放大断链痛苦；每日一勾=Skinner FR1"
      sources: ["Amabile & Kramer 2011, The Progress Principle", "Kahneman & Tversky 1979, Econometrica", "Skinner 1938/1953"]
      url: ""
    - claim: "'急切→极端→放弃→倒退'的恶性循环由担忧型完美主义、双曲贴现与沉没成本谬误共同驱动，'必然成功'的小步可切断该链条"
      verdict: "支持"
      original: "🟢 强支持"
      evidence: "Stober 1998：担忧型完美主义（关注错误高分）与拖延显著正相关；Laibson 1997双曲贴现；Arkes & Blumer 1985沉没成本谬误；Dweck 2006固定型心态把失败解读为能力证据"
      sources: ["Stober 1998", "Laibson 1997, QJE", "Arkes & Blumer 1985, OBHDP", "Dweck 2006, Mindset"]
      url: ""
    - claim: "'永远不超标'（绝不超额执行）是习惯养成的普世规则"
      verdict: "存疑"
      original: "🟡 慎用：某些研究支持弹性，完全'不超标'长期可能积累过度克制压力"
      evidence: "报告裁定属'镀铜'限定：中断后减量执行优于完全中断，完全克制在长期可能积累过度克制压力，有边界条件而非普世规则"
      sources: ["Marlatt & Gordon 1985（复发预防）"]
      url: ""
    - claim: "习惯改变存在'潜伏期'：初期执行无可感知结果（J型学习曲线），需人为构造可观测信号（如打勾）防止无效感触发放弃"
      verdict: "部分支持"
      original: "🟢（复利曲线4阶段+J曲线，数学演示可直接验证）"
      evidence: "Newell, Liu & Mayer-Kress 2001：学习曲线常呈J型（先投入后拐点指数增长）；1.01^365=37.78为数学演示（Hardy 2011），属隐喻而非实证预测"
      sources: ["Newell, Liu & Mayer-Kress 2001", "Hardy 2011, The Compound Effect"]
      url: ""
    - claim: "每日微小行动是对目标身份的'投票'，身份认同（我是X的人）比结果目标更能维持长期行为"
      verdict: "支持"
      original: "🟢 强支持（真金）"
      evidence: "Clear 2018《Atomic Habits》身份投票论（每次行动=投给想成为的人）；Verplanken & Orbell 2003 SRHI量表：习惯强度为连续变量，高习惯强度行为更抗中断"
      sources: ["Clear 2018, Atomic Habits", "Verplanken & Orbell 2003, J Applied Social Psychology"]
      url: ""
