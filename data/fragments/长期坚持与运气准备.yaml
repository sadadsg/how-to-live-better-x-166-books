      original: "🔴 必然显化陷阱（Taleb/Salganik/Chetty）"
      evidence: "Salganik 2006 Science 音乐实验室：初始条件随机性显著影响流行结果；Taleb 2007 叙事谬误：人为随机事件构建因果故事；报告估运气/网络/地点/时机占30-50%+。"
      sources: ["Salganik, Dodds & Watts 2006 Science", "Taleb 2007 Black Swan"]
      url: ""
