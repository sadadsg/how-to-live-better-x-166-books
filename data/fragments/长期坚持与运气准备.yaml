      sources: ["Kirzner 1973", "Baron 2006 AMP", "Macnamara et al. 2014"]
      url: ""
    - claim: "积累期长期无正反馈是正常现象：习惯形成中位数约66天，复利前期缓慢后期陡峭"
      verdict: "支持"
      original: "🟢 强支持（无反馈期真实存在）"
