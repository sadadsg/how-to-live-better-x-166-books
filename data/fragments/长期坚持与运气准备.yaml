      original: "🟢 强支持（走捷径长期代价）"
      evidence: "Laibson 1997 QJE 双曲线贴现模型（健身房月卡现象）；DellaVigna & Malmendier 2006 信用卡债实证；短期损失痛苦权重约2倍（损失厌恶）。"
      sources: ["Laibson 1997 QJE", "DellaVigna & Malmendier 2006"]
      url: ""
