- theme: "人生苦甜均衡"
  category: "6_个人成长方法论/6.3_情绪压力与韧性"
  report_file: "人生苦甜均衡调研报告.md"
  claims:
    - claim: "儿童期延迟满足能力（棉花糖实验）是决定日后学业与人生成功的关键因素"
      verdict: "证伪"
      original: "棉花糖实验被严重高估（复验效应衰减约2/3）"
      evidence: "Watts, Duncan & Quan 2018（Psychological Science，n≈1000 NICHD SECCYD样本）：控制家庭背景与早期认知能力后相关衰减约2/3，4岁每多等1分钟15岁成绩仅+0.1SD（原始效应一半），行为结果几乎不再显著"
      sources: ["Watts, Duncan & Quan 2018, Psychological Science"]
      url: "https://doi.org/10.1177/0956797618761661"
    - claim: "人对单一'大甜'（升职、买房等正性事件）适应极快、数月回到基线，把享乐延迟到未来一次性兑现会因享乐能力钝化而失效"
      verdict: "支持"
      original: "✅ 强支持（反驳'先苦后甜'）"
      evidence: "Lyubomirsky & Sheldon HAP模型（Sheldon & Lyubomirsky 2012）：正性事件快速适应回基线、负性事件适应慢且不完全；多巴胺编码奖励预测误差差值而非绝对量（Schultz 2016），大差值快速适应、温和小差值更可持续"
      sources: ["Sheldon & Lyubomirsky 2012（HAP模型）", "Schultz 2016, Nature Reviews Neuroscience", "Gershman et al. 2024, Nature Neuroscience"]
      url: "https://www.nature.com/articles/nrn.2015.26"
    - claim: "日常小确幸对生活满意度的解释力高于重大生活事件，'把享乐写进日历'有实证支持"
      verdict: "支持"
      original: "✅ 强支持（苦甜应均匀分布）"
      evidence: "Miwa 2025（Journal of Happiness Studies）：实证提取小确幸6因子结构，日常小事件对生活满意度解释力12%，显著高于重大生活事件的7.2%"
      sources: ["Miwa 2025, Journal of Happiness Studies"]
      url: "https://link.springer.com/article/10.1007/s10902-025-00896-2"
    - claim: "过度延迟与过度控制有真实心理代价（完美主义、职业倦怠、人际疏离），'先苦后甜'的极端版本有害"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Lynch 2018 RO-DBT：过控制谱系（高度延迟/完美主义/认知僵化）是慢性抑郁、神经性厌食、强迫型人格的核心机制；Liu 2025（EJWOP）：完美主义→远程压力→工作-生活冲突→burnout三阶段中介链"
      sources: ["Lynch 2018, RO-DBT", "Liu 2025, European Journal of Work and Organizational Psychology"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12053826/"
    - claim: "若'苦'是被外在强加的（牺牲自主感与胜任感），会破坏内在动机；'苦'须被自主意义化而非被控制型安排"
      verdict: "支持"
      original: "✅ 支持"
      evidence: "Ryan & Deci 2020综述：外在奖励、惩罚、考评等控制型手段破坏内在动机，自主支持型才能同时提升成绩与心理健康"
      sources: ["Ryan & Deci 2020, Contemporary Educational Psychology"]
      url: "https://www.sciencedirect.com/science/article/pii/S0361476X20300254"
    - claim: "情绪唤起情境下（焦虑、社交压力、兴奋）单靠意志力延迟易失败，结构化设计（冷却、拆解、默认选项）比意志力更可靠"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Casey 2011（PNAS，40年随访）：当年低延迟者40年后面对积极社交线索仍难抑制反应，右侧下额回激活降低、腹侧纹状体升高；Steinberg双系统模型：社会情绪系统发育早于认知控制系统"
      sources: ["Casey et al. 2011, PNAS", "Steinberg 2011"]
      url: "https://www.pnas.org/doi/10.1073/pnas.1108561108"
    - claim: "延迟满足是'信任+资源+能力'三合一：环境不可靠（他人不守信）时选择即时满足是理性策略而非意志缺陷"
      verdict: "支持"
      original: "✅（延迟的批判性再审视）"
      evidence: "Kidd, Palmeri & Aslin 2013：不可靠环境下儿童理性选择不吃棉花糖；Michaelson & Munakata 2016：观察到实验者对他人不守信的儿童显著缩短等待时间"
      sources: ["Kidd, Palmeri & Aslin 2013, Frontiers in Psychology", "Michaelson & Munakata 2016, Developmental Science"]
      url: "https://doi.org/10.3389/fpsyg.2013.00355"
    - claim: "今天的你给明天的你设置承诺装置（自动转账、锁起甜品、默认选项）有严格理论基础：双曲贴现造成时间不一致偏好"
      verdict: "支持"
      original: "✅ 支持（短期小目标+长期规划）"
      evidence: "Laibson 1997（QJE）双曲贴现：今天vs明天的折现率显著大于远期；Fudenberg & Levine 2006（AER）双重自我模型；McClure 2004 fMRI显示即时与延迟奖励激活两套系统"
      sources: ["Laibson 1997, QJE", "Fudenberg & Levine 2006, AER", "McClure et al. 2004"]
      url: "https://doi.org/10.1162/003355397555253"
    - claim: "用纳什均衡可以严格论证人生'苦甜均衡'（科学结论级）"
      verdict: "存疑"
      original: "⚠️ 部分支持：方向对，但Laibson双曲贴现+Dual-Self Model更严格"
      evidence: "纳什1950假设完全理性与完备信息且均衡≠Pareto最优（囚徒困境）；该类比在学术文献中多为隐喻层面，缺乏可证伪实证，报告定位为启发性类比"
      sources: ["Nash 1950/1951", "Laibson 1997", "Fudenberg & Levine 2006"]
      url: ""
    - claim: "FIRE式极端储蓄（攒25倍年支出+4%提取率）对超长退休期不够安全"
      verdict: "支持"
      original: "✅ 强支持（财务分配建议）"
      evidence: "Vanguard 2020《Fuel for the F.I.R.E.》：4%提取率在30年期成功率81.9%，50年期骤降至36%"
      sources: ["Vanguard 2020, Fuel for the F.I.R.E."]
      url: "https://www.vanguardmexico.com/content/dam/intl/americas/documents/mexico/en/fuel-for-the-fire.pdf"
    - claim: "番茄工作法（25分钟硬切）相比其他专注/休息方式并无产出优势，自调节休息是合理选择"
      verdict: "支持"
      original: "✅ 强支持（时间管理建议）"
      evidence: "MDPI 2025实验（n=94）：Pomodoro/Flowtime/自调节休息在最终产出上无显著差异"
      sources: ["MDPI 2025 Pomodoro vs Flowtime study"]
      url: "https://www.mdpi.com/2076-328X/15/7/861"
    - claim: "90分钟超日节律（工作单元+离屏休息）有生理机制依据，'工作90分钟休息20分钟'可直接提升认知表现"
      verdict: "部分支持"
      original: "报告待确认项：外推到工作场景是经验性而非强结论性"
      evidence: "Kleitman 1969基本休息-活动周期；2025 Physical Review E建模证实90分钟周期机制（saddle-node分岔），但证据多来自睡眠EEG领域，工作场景认知任务研究少"
      sources: ["Kleitman 1969", "Physical Review E 2025（90分钟机制建模）"]
      url: "https://journals.aps.org/pre/abstract/10.1103/PhysRevE.111.044215"
    - claim: "苦甜均衡的关键是'多放点甜'的线性补偿"
      verdict: "证伪"
      original: "✅ 强支持（均衡应理解为对极端化的双向纠偏，而非简单多放甜）"
      evidence: "报告综合平衡表：棉花糖复验+享乐适应+多巴胺RPE+过控制代价四股证据一致指向'小而多变+自主意义化+结构降低诱惑'，而非单边补偿"
      sources: ["Watts et al. 2018", "Sheldon & Lyubomirsky 2012", "Lynch 2018"]
      url: ""
