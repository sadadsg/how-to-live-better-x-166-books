- theme: "未来十年财富管理科学依据"
  category: "6_个人成长方法论/6.6_财富与道德"
  report_file: "未来十年财富管理科学依据调研报告.md"
  claims:
    - claim: "房产年化回报约为6%"
      verdict: "部分支持"
      original: "🟡 需修正：'6%'是杠杆后+一线+2006-2016段的复合数"
      evidence: "美国Case-Shiller 2000-2026 +232%（约5%名义CAGR）；中国一线2006-2024累计+550%+、三四线+200%；杠杆后一线黄金期IRR 12-15%、2016-2026平台期甚至负收益——须分段/分地区/分杠杆看"
      sources: ["Case-Shiller指数", "国家统计局房价数据"]
      url: ""
    - claim: "消费品牌已完全无法区分车主/用户的财富水平（消费主义彻底失效）"
      verdict: "部分支持"
      original: "🟡 区分度大幅下降但'无法'是夸张"
      evidence: "特斯拉2025起售价下探至19.9万，71%车主家庭年入<50万——信号区分度大降但未消失，信号载体从物质转向数字品味（Veblen炫耀性消费的数字转型）"
      sources: ["特斯拉销量与车主数据", "Veblen 1899《有闲阶级论》"]
      url: ""
    - claim: "'铁饭碗'竞争白热化、性价比下降"
      verdict: "支持"
      original: "🟢 基本属实"
      evidence: "2024国考303.3万报考/3.96万招录，平均报录比77:1（视频'100:1'为热门岗位修辞），极端岗位21,258:1（西藏阿里邮政局）；2026估91:1"
      sources: ["国家公务员局2024报考数据"]
      url: ""
    - claim: "高学历因扩招而贬值（学历通胀）"
      verdict: "支持"
      original: "🟢 基本属实"
      evidence: "2024高等教育毛入学率60.80%、2026毕业生1,270万；Jones, Kaya & Nan 2024（IZA）：中国毕业生过度教育率30-40%、起薪低15-25%"
      sources: ["教育部统计公报", "Jones, Kaya & Nan 2024, IZA"]
      url: ""
    - claim: "中国低利率环境下把钱存在银行'躺平'跑不赢通胀"
      verdict: "部分支持"
      original: "🟡 中国情境完全成立，美国2023-2024不成立（须分段）"
      evidence: "中国2026年1年期定存约1.30% vs 2020-2026累计CPI 5.5%；但美联储2023-2024利率峰值5.33%时'低利率陷阱'不存在"
      sources: ["中国人民银行存款利率", "国家统计局CPI", "美联储FEDFUNDS"]
      url: ""
    - claim: "黄金缺乏现金流且历史上曾深度回撤（超70%），古董等另类资产流动性差，不宜视为稳赚的核心资产"
      verdict: "支持"
      original: "🟢 基本属实"
      evidence: "1980-2002金价$850→$250（-70.6%，历史最大回撤）；2011-2015 $1,900→$1,050（-44.7%）；中国一二线商铺空置率12-15%；古董艺术品变现折扣30-60%"
      sources: ["World Gold Council历史金价", "中国商铺空置率数据"]
      url: ""
    - claim: "长期（10-20年）主动型基金大多能跑赢指数，主动选基金优于买宽指基金"
      verdict: "证伪"
      original: "🟢（视频方向正确：SPIVA显示主动基金跑输率85-95%）"
      evidence: "SPIVA 2024：10/15/20年期主动基金跑输指数比例85-95%；标普500 1928-2024年化约10%（实际约7%）；沪深300 2005-2024年化约8%"
      sources: ["SPIVA 2024 (S&P Dow Jones Indices)", "Bogle被动投资理论", "Siegel长期数据"]
      url: ""
    - claim: "任何时候买入宽指基金都能稳赢、可以满仓押注"
      verdict: "部分支持"
      original: "🟢 + ⚠️ 关键修正：当前CAPE 41.74历史第二高，总仓位≤60%"
      evidence: "CAPE 41.74仅次2000年43.77、Buffett Indicator 244%历史最高、标普500前十大占市值约35%；时点与估值显著影响短期（1-3年）回报——不预测点位，只配置比例"
      sources: ["CAPE（Shiller PE）", "Buffett Indicator"]
      url: ""
    - claim: "租金/自媒体/无人驾驶出租车是当前可靠且易得的现金流资产"
      verdict: "部分支持"
      original: "🟡 需修正：'现金流资产必胜'是叙事化表达"
      evidence: "中国一线租金回报率1.5-2.5%低于房贷3-3.5%（实际负杠杆）；99%创作者中位月入<500元；Robotaxi 2026商业化早期单车ROI为负（Waymo 56.7M RO miles、Apollo Go 11城）"
      sources: ["贝壳租金数据", "创作者经济调查", "Waymo/Apollo Go运营数据"]
      url: ""
    - claim: "做个人IP/直播带货能为多数普通人带来可观财富"
      verdict: "部分支持"
      original: "🟡 幸存者偏差：99%创作者median月入<500元"
      evidence: "直播带货GMV 4.5-5万亿规模真实，但Cheng 2022：top 1000主播占约50% GMV（极端幂律）；2025-12网信办《拟人化互动服务征求意见稿》带来监管风险；IP须挂硬产品力"
      sources: ["Cheng 2022（直播带货集中度）", "CNNIC", "网信办2025-12征求意见稿"]
      url: ""
    - claim: "健康是长期财富的底层资产，健康冲击是头号家庭财务风险"
      verdict: "支持"
      original: "🟢 方向对+实操可量化（避免'健康=财富'过度类比）"
      evidence: "WHO/Lancet Global Health：灾难性健康支出（CHE）全球发生率11.7%；Wang 2015：中国老年家庭健康冲击风险高；40岁认知与体力影响50-60岁收入曲线"
      sources: ["WHO", "Lancet Global Health（CHE 11.7%）", "Wang 2015"]
      url: ""
    - claim: "温和运动建议（如每周150分钟）适用于所有人群，包括慢性疲劳综合征（ME/CFS）患者"
      verdict: "证伪"
      original: "🔴 与NICE NG206冲突（ME/CFS不应套用通用运动建议）"
      evidence: "NICE NG206指南反向证据：ME/CFS患者不应采用固定增量运动方案；报告警告'温和运动普适'属修辞升格"
      sources: ["NICE NG206指南"]
      url: ""
    - claim: "旧财富思维（买房/铁饭碗/高学历/存钱）已全面失效，应彻底抛弃"
      verdict: "证伪"
      original: "❌ 旧思维不必然失效——学区房/公务员/父母养老等情境仍合理（核心修正）"
      evidence: "一线学区房+入学、公务员事业编稳定现金流、父母养老医疗（流动性>收益率）、农村自建房等情境下旧思维仍合理；新思维也有边界（2026-2028估值风险）"
      sources: []
      url: ""
    - claim: "三阶段配置框架成立：短期（0-12月）留现金与6个月应急金；中期（1-3年）配宽指+至多2种现金流资产+能力资产；长期（3-10年）投健康与迁徙能力"
      verdict: "支持"
      original: "🟢 基本属实（边界量化：总仓位≤60%、现金流资产≤30%、杠杆永久禁止）"
      evidence: "报告核心交付：总仓位≤60%、现金流资产≤30%、房贷外杠杆永久禁止、加密≤5%、承诺>10%年化即红线"
      sources: ["报告§4个人方法论整合"]
      url: ""
    - claim: "'可复用能力资产'（写作/语言/课程）能一次投入终身收益"
      verdict: "部分支持"
      original: "🟢 边际成本递减成立，但专业+流量+品牌三重门槛被简化"
      evidence: "边际成本递减经济学成立；'一次投入终身收益'是理想化叙事，能力资产需叠加专业、流量与品牌三重门槛"
      sources: []
      url: ""
