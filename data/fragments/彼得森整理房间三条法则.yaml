- theme: "彼得森整理房间三条法则"
  category: "6_个人成长方法论/6.4_关系婚恋与形象"
  report_file: "彼得森整理房间三条法则调研报告.md"
  claims:
    - claim: "龙虾的胜负地位循环由血清素驱动（胜者5-HT升高、注射5-HT可让败者翻盘）"
      verdict: "支持"
      original: "Kravitz 1980 龙虾血清素研究真实（基础神经科学高质量研究）"
      evidence: "Kravitz 团队 1980/1988 Science：注射5-HT→屈曲姿势、章鱼胺→伸展；胜者脑内5-HT浓度升高，效应在数周内自增强"
      sources: ["Livingstone et al. 1980 Science", "Kravitz 1988/2000"]
      url: "https://doi.org/10.1126/science.208.4439.76"
    - claim: "龙虾的血清素-胜负循环可类比解释人类社会层级与'站直'法则"
      verdict: "存疑"
      original: "⚠️ 类比过度泛化被同行批评（龙虾成立，人类证据反向）"
      evidence: "演化分异约5.5亿年、龙虾无真正大脑；人类 5-HT 与攻击性方向相反（5-HT↓→攻击↑）；Gonçalves 2018、PZ Myers、Kate Manne 系统性反驳"
      sources: ["Gonçalves 2018 (The Conversation)", "PZ Myers 2018", "Kate Manne 2018 (TLS)"]
      url: "https://theconversation.com/psychologist-jordan-peterson-says-lobsters-help-to-explain-why-human-hierarchies-exist-do-they-90489"
    - claim: "2分钟 power posing（笔直站立）能改变睾酮/皮质醇等激素水平"
      verdict: "证伪"
      original: "❌ 复验失败——2分钟 power posing 不能改变激素"
      evidence: "Ranehill 2015 预注册复验（200人）：激素效应不显著；Körner 2020 元分析：行为/激素效应不可复现；Simmons & Simonsohn 2017 p-curve：与'效应为零+选择性报告'无异"
      sources: ["Carney, Cuddy & Yap 2010（原研究）", "Ranehill et al. 2015", "Körner et al. 2020 元分析"]
      url: "https://doi.org/10.1177/0956797616658563"
    - claim: "扩张性姿势对主观'感到有权'有中等效应（作为行为提示可用）"
      verdict: "部分支持"
      original: "主观'感到有权'效应稳健（Gronau 2017 贝叶斯元分析）"
      evidence: "Gronau 2017 贝叶斯元分析：主观 felt power 效应稳健；Körner 2020：affective 效应部分可复现；报告结论：作为行为提示合理，作为神经科学论断站不住"
      sources: ["Gronau et al. 2017", "Körner et al. 2020"]
      url: "https://journals.sagepub.com/doi/full/10.1177/1745691620919358"
    - claim: "像照顾负责的对象一样对待自己（公正待己/自我同情干预）可改善心理状态"
      verdict: "支持"
      original: "✅ 强支持（Rule 2 实证强度：强）"
      evidence: "Ferrari 2019 元分析：自我同情 micro-practice 效应量中到大；Kramer & Pascual-Leone 2016/2020：两椅对话干预自我鄙视前后测 d=0.80"
      sources: ["Neff 2003", "Ferrari 2019 元分析", "Kramer & Pascual-Leone 2016/2020", "Gilbert 2009 CFT"]
      url: "https://www.researchgate.net/publication/332539030_Self-compassion_interventions_and_caregiver_well-being_A_meta-analysis"
    - claim: "自我鄙视（self-contempt）是独立于无望感的自杀意念预测因子"
      verdict: "支持"
      original: "✅ 强支持——Flett PSDM 三波纵向+自我鄙视独立预测自杀"
      evidence: "Rüsch 2019：self-contempt 在控制 hopelessness 后仍显著预测自杀意念；Flett PSDM 三波纵向：社会指定完美主义→反物质感→抑郁/自杀意念"
      sources: ["Rüsch et al. 2019", "Flett PSDM 三波纵向"]
      url: "https://doi.org/10.1002/capr.12307"
    - claim: "整理房间/清洁行为能减弱压力反应"
      verdict: "支持"
      original: "✅ 中等支持——Lee 2025 直接实证"
      evidence: "Lee 2025 预注册研究（N=3,066，三国）：真实清洁与视觉模拟清洁都减弱压力反应；压力事件后用整理作为应对有生理恢复效应"
      sources: ["Lee et al. 2025", "Bandura 1977"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11925691/"
    - claim: "整洁环境促进健康选择、慷慨与执行控制"
      verdict: "支持"
      original: "✅（Vohs 2013；整洁环境证据较一致）"
      evidence: "Vohs 2013：整洁房间健康选择 67% vs 20%（苹果vs巧克力）、捐款金额2.5倍；McMains & Kastner 2011：杂乱视觉环境增加反应时、降低执行控制"
      sources: ["Vohs, Redden & Rahinel 2013", "McMains & Kastner 2011", "Zhong et al. 2015"]
      url: "https://journals.sagepub.com/doi/10.1177/0956797613480186"
    - claim: "凌乱环境能激发创造力"
      verdict: "证伪"
      original: "❌ Sio & Ormerod 2019 明确未能复制（样本量大2倍）"
      evidence: "Sio & Ormerod 2019：未能复制 Vohs 2013 '乱激发创造力'效应；报告结论：整洁对创造力证据不一致，对健康选择/慷慨/执行控制较一致"
      sources: ["Sio & Ormerod 2019", "Vohs 2013（原研究）"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6340966/"
    - claim: "'整理房间'等微行动三法则可作为轻度迷茫者重塑自我的启动点"
      verdict: "支持"
      original: "✅ 作为'启动点'——适合轻度迷茫者"
      evidence: "机制栈：Bandura 1977 自我效能 + Amabile 2011 进步原理（12,000篇日记分析）+ Risko & Gilbert 2016 环境结构卸载工作记忆；预期真实效应 r≈0.10-0.30"
      sources: ["Bandura 1977", "Amabile 2011", "Risko & Gilbert 2016"]
      url: "https://www.sciencedirect.com/science/article/abs/pii/S1053810015001221"
    - claim: "三法则可作为完整人生哲学、替代结构化心理干预（ACT/MBCT 等）"
      verdict: "证伪"
      original: "❌ 作为'完整人生哲学'——过度承诺"
      evidence: "重度抑郁、深度创伤、强迫症、物质成瘾人群不适配——整理房间是辅助而非治疗；报告建议三法则只当入门读物，真正改变需结构化干预"
      sources: ["报告边界警示（不适配人群与配伍建议）"]
      url: ""
    - claim: "彼得森原书主张就是'整理房间三条法则'"
      verdict: "证伪"
      original: "原书是12章完整体系，无'三条法则'原说（中文传播严重简化）"
      evidence: "《12 Rules for Life》2018 共12条；中文传播取第1+2+6条，跳过说真话、追求意义、精确说话等'反极端主义核心'；关键工具60%+被删"
      sources: ["Peterson 2018《12 Rules for Life》", "Wikipedia: Jordan Peterson"]
      url: "https://en.wikipedia.org/wiki/Jordan_Peterson"
    - claim: "微小行动的成功可通过自我效能循环撬动更大的行为改变"
      verdict: "支持"
      original: "（科学栈：Bandura+Amabile+Wood 三循环）"
      evidence: "Bandura 1977：performance accomplishment 是自我效能最强来源；Wood 2002：行为重复→自动习惯→积极情绪→认知带宽扩展的三向循环"
      sources: ["Bandura 1977", "Wood, Quinn & Kashy 2002"]
      url: "https://dradamvolungis.com/wp-content/uploads/2011/06/self-efficacy-unifying-theory-of-behavioral-change-bandura-1977.pdf"
