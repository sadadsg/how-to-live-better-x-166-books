- theme: "前额叶训练"
  category: "6_个人成长方法论/6.1_认知与心理科学方法论"
  report_file: "前额叶训练调研报告.md"
  claims:
    - claim: "有氧运动是证据最稳健的前额叶保护方法：多中心RCT显示长期运动减缓前额叶体积退化，机制为BDNF/VEGF与脑血流改善"
      verdict: "支持"
      original: "🟢 强支持（⭐⭐⭐⭐⭐）"
      evidence: "EXERT多中心RCT：高强度运动12个月后前额叶体积损失趋势更小；Erickson 2014综述：心肺适能与灰质体积一致相关；单次20分钟中等强度运动即改善脑血流"
      sources: ["Erickson et al. 2014", "EXERT研究"]
      url: ""
    - claim: "冥想对情绪调节、注意控制和压力（皮质醇）降低有一致的正向证据"
      verdict: "支持"
      original: "🟢 认知/情绪（一致性改善）"
      evidence: "Goyal 2014：正念对抑郁、焦虑、疼痛有中等改善；Whitfield 2022元分析：正念项目执行功能优于对照；Fan 2014：IBMT皮质醇剂量依赖性降低"
      sources: ["Goyal et al. 2014", "Whitfield et al. 2022"]
      url: ""
    - claim: "8周MBSR冥想引起灰质密度等结构性脑变化的证据混合：有阳性研究也有RCT阴性复制"
      verdict: "存疑"
      original: "🟡 结构变化（混合结果，Kral 2022 阴性）"
      evidence: "Hölzel 2011（N=16+17）：8周后海马等灰质密度增加；Kral 2022两项RCT联合分析未发现MBSR结构变化；Lazar 2005为横断面小样本（n=20）"
      sources: ["Hölzel et al. 2011", "Kral et al. 2022"]
      url: ""
    - claim: "冥想收益随练习时长持续累积的'累积收益'假设缺乏元分析支持"
      verdict: "存疑"
      original: "阴性：两项元分析未发现持续练习导致随时间累积变化的证据"
      evidence: "两项元分析未发现持续练习导致随时间累积变化的证据；剂量-反应证据仅支持即时、短期与中期效果"
      sources: []
      url: ""
    - claim: "工作记忆训练（N-back等）对训练任务本身（近迁移）效果可靠（d=0.4-0.7），但3-6个月后衰减"
      verdict: "支持"
      original: "🟢 近迁移（效果可靠，效应量中等）"
      evidence: "Melby-Lervåg & Hulme 2013元分析（23项研究，N=958）：近迁移g=0.44显著；工作记忆近迁移d=0.4-0.7，3-6个月后降至d=0.2-0.3"
      sources: ["Melby-Lervåg & Hulme 2013"]
      url: ""
    - claim: "'脑训练游戏让你变聪明'（远迁移提升流体智力）不成立：远迁移效应微弱且控制安慰剂后大幅减弱"
      verdict: "证伪"
      original: "🔴 远迁移（效果微弱且不一致）"
      evidence: "Melby-Lervåg & Hulme 2013：远迁移g=0.12不显著；Au 2015：控制发表偏倚后g=0.14；Sala & Gobet 2019（150+项研究）：控制安慰剂后效应大幅减弱"
      sources: ["Sala & Gobet 2019", "Melby-Lervåg & Hulme 2013"]
      url: ""
    - claim: "商业认知训练产品（Cogmed/BrainHQ等）宣传的效果超过科学证据支持，且价格高昂"
      verdict: "证伪"
      original: "反对——宣传效果超过科学证据支持"
      evidence: "Sala & Gobet 2019元分析（150+项研究）控制安慰剂后效应大幅减弱；Cogmed约$1500-2500但证据质量参差不齐"
      sources: ["Sala & Gobet 2019"]
      url: ""
    - claim: "神经反馈训练有前景但证据尚不充分：样本小、缺主动控制组、安慰剂效应难排除"
      verdict: "存疑"
      original: "🟡 前景好但证据不足"
      evidence: "多数研究N<50且缺乏主动控制组；EEG神经反馈对ADHD症状d≈0.3-0.5但安慰剂效应难排除；约20-30%的人无法有效学习脑电调控"
      sources: []
      url: ""
    - claim: "7-8小时睡眠是前额叶健康基础：胶质淋巴系统在睡眠期清除代谢废物，偏离7-8小时与脑炎症标志物升高相关"
      verdict: "支持"
      original: "🟢 强支持（⭐⭐⭐⭐⭐）"
      evidence: "胶质淋巴系统主要在睡眠期清除β-淀粉样蛋白等；慢性睡眠剥夺致前额叶小胶质细胞焦亡；Balter 2025 PET：偏离最佳睡眠时长与脑内小胶质细胞密度升高相关"
      sources: ["Balter et al. 2025", "Sabeti et al. 2018"]
      url: ""
    - claim: "慢性压力通过HPA轴-皮质醇-炎症通路损害前额叶，压力管理（冥想/运动/社交支持）有保护作用"
      verdict: "支持"
      original: "🟢 强支持（压力-炎症-前额叶退化链路清晰）"
      evidence: "慢性压力→HPA轴持续激活→皮质醇升高→糖皮质激素抵抗→CRP/IL-6升高（Miller 2002；Cohen 2012 PNAS）"
      sources: ["Miller 2002", "Cohen 2012"]
      url: ""
    - claim: "地中海/MIND饮食与脑健康相关但证据以观察性研究为主，RCT有限"
      verdict: "部分支持"
      original: "🟡 部分支持（观察性研究为主，RCT 有限）"
      evidence: "2024 fMRI：地中海饮食依从者内侧前额叶与丘脑、尾状核等连接更强；MIND饮食转录组学研究（n=1204）；缺乏大样本RCT"
      sources: []
      url: ""
    - claim: "Omega-3（EPA+DHA）对脑健康有益且WHO建议每日250-500mg，但补充剂效果可能不如食物来源"
      verdict: "部分支持"
      original: "建议每日 250-500mg EPA+DHA（WHO 推荐）；补充剂效果可能不如食物来源"
      evidence: "DHA是前额叶磷脂主要结构成分；EPA/DHA衍生促消退介质有抗炎与神经保护作用；APOE4携带者可能需更高剂量"
      sources: []
      url: ""
    - claim: "中年期（40-59岁关键窗口）开始规律运动可能降低痴呆风险，但证据强度中等"
      verdict: "部分支持"
      original: "🟡（痴呆风险降低：中年期开始规律运动）"
      evidence: "40-59岁被认为是保护认知健康的关键窗口期；Demnitz 2025五个欧洲队列发现自报体力活动与脑体积无显著关联，提示需客观测量"
      sources: ["Demnitz et al. 2025"]
      url: ""
