- theme: "冥想科学依据与练习方法"
  category: "6_个人成长方法论/6.3_情绪压力与韧性"
  report_file: "冥想科学依据与练习方法调研报告.md"
  claims:
    - claim: "规律冥想者及受训人群的大脑灰质结构存在可测量差异，与情绪觉察相关的右前腹侧脑岛最一致"
      verdict: "支持"
      original: "证据等级 A-"
      evidence: "25项MRI研究元分析（冥想者395 vs 对照454）：直接对照 g≈1.03；唯一空间一致脑区为右前腹侧脑岛；但异质性高（I²≈76%）。"
      sources: ["MRI灰质结构元分析（PMC8500886）"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8500886/"
    - claim: "正念训练增强显著性网络-默认模式网络（SN-DMN）跨网络连接，对应更强的对走神与反刍的元觉察控制"
      verdict: "支持"
      original: "证据等级 A（Nature 子刊元分析）"
      evidence: "12项静息态fMRI研究（n=226 vs 204）元分析（Scientific Reports 2022）：SN-DMN连接增强，Hedge's g≈0.234，p=0.029。"
      sources: ["Scientific Reports 2022 静息态fMRI元分析"]
      url: ""
    - claim: "8周MBSR中感知压力下降越多者，右侧基底外侧杏仁核灰质密度下降越多"
      verdict: "部分支持"
      original: "证据等级 B（纵向）"
      evidence: "Hölzel et al. 2010（26名健康高压被试，8周MBSR前后MRI）：PSS下降幅度与右侧杏仁核灰质密度下降正相关；小样本、无对照。"
      sources: ["Hölzel et al. 2010"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2840837/"
    - claim: "对焦虑障碍患者，8周MBSR的疗效不劣于一线药物艾司西酞普兰，且副作用更少"
      verdict: "支持"
      original: "证据等级 A（RCT）"
      evidence: "JAMA Psychiatry 2023 TAME trial（n=276 RCT）：8周MBSR不劣于艾司西酞普兰；副作用发生率15.4% vs 78.6%。"
      sources: ["Hoge et al. 2023 (JAMA Psychiatry)"]
      url: "https://doi.org/10.1001/jamapsychiatry.2022.3679"
    - claim: "冥想项目对抑郁症状有小幅改善"
      verdict: "部分支持"
      original: "证据等级 B"
      evidence: "AHRQ 综述/Goyal et al. 2014（41项试验、2993人）：中等证据，ES≈0.32（小效应）。"
      sources: ["Goyal et al. 2014"]
      url: "https://doi.org/10.1001/jamainternmed.2013.13018"
    - claim: "冥想项目对慢性疼痛有小幅改善"
      verdict: "部分支持"
      original: "证据等级 B"
      evidence: "AHRQ 综述/Goyal et al. 2014（41项试验、2993人）：中等证据，ES≈0.33。"
      sources: ["Goyal et al. 2014"]
      url: "https://doi.org/10.1001/jamainternmed.2013.13018"
    - claim: "正念冥想改善老年睡眠障碍者的睡眠质量，效应量大且优于睡眠卫生教育"
      verdict: "支持"
      original: "证据等级 A–B"
      evidence: "JAMA Internal Medicine 2015 RCT（Black et al.）：PSQI效应量0.89（大），优于睡眠卫生教育；慢性失眠RCT缓解率50%。"
      sources: ["Black et al. 2015 (JAMA Internal Medicine)"]
      url: "https://doi.org/10.1001/jamainternmed.2014.1906"
    - claim: "正念训练能即时提升专注力与工作记忆"
      verdict: "存疑"
      original: "B-（提示性）"
      evidence: "Headspace RCT：1个月随访工作记忆优于对照，但即时后测无差异——需持续练习才可能显效，仅为提示性证据。"
      sources: ["Headspace RCT (PMC9483434)"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9483434/"
    - claim: "冥想练得越久、单次时间越长，效果越好（剂量-反应关系）"
      verdict: "存疑"
      original: "关键纠偏：实证并未证明"
      evidence: "2026剂量-反应综述：RCT中大小剂量结局差异不显著；关键是'每天规律'而非单次时长，新手从5分钟起步即可。"
      sources: ["2026 剂量-反应综述 (Journal of Contemplative Studies)"]
      url: ""
    - claim: "冥想是零风险、无不良反应的活动"
      verdict: "证伪"
      original: "不良反应被长期低估，但确实存在"
      evidence: "系统综述（ACPS，83项研究）：总不良反应率8.3%（实验性3.7%），最常见焦虑33%、抑郁27%、认知异常25%，与心理治疗3%-10%相当。"
      sources: ["Farias et al. 2020 (Acta Psychiatrica Scandinavica)"]
      url: "https://doi.org/10.1111/acps.13125"
    - claim: "有心理困扰或精神病史者、以及新手贸然参加长期闭关，冥想不良反应风险显著升高"
      verdict: "部分支持"
      original: "预测因子：心理困扰、参加闭关"
      evidence: "美国人群调查（n=886）：58.4%报告某种不良反应，9.1%功能受损；预测因子为心理困扰与参加闭关。"
      sources: ["美国人群调查 (n=886)"]
      url: ""
    - claim: "中重度焦虑/抑郁患者可以用冥想替代精神科治疗或作为停药理由"
      verdict: "证伪"
      original: "❌ 能替代治疗"
      evidence: "报告临床立场：中重度焦虑/抑郁中冥想是辅助而非替代，不是停药理由；有精神病史者需临床监护下作辅助治疗。"
      sources: []
      url: ""
    - claim: "Headspace 等冥想App对抑郁的改善有充分且无利益冲突的RCT证据支持"
      verdict: "部分支持"
      original: "14项RCT，75%见改善；50%研究有利益冲突→结论打折扣看"
      evidence: "Headspace 14项RCT中75%报告抑郁改善，但50%研究有利益冲突（厂商提供免费权限/参与设计）；Calm截至2021仅1项RCT。"
      sources: ["Headspace/Calm RCT 系统综述 (PubMed 36125880)"]
      url: "https://pubmed.ncbi.nlm.nih.gov/36125880/"
