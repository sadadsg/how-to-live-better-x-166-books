- theme: "大学生四类共性状态科学依据"
  category: "6_个人成长方法论/6.3_情绪压力与韧性"
  report_file: "大学生四类共性状态科学依据调研报告.md"
  claims:
    - claim: "大学生'莫名烦躁'与无聊倾向及基本心理需要缺失相关，是有结构性来源的状态而非无病呻吟"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Liu 2024（N=1102）：无聊-焦虑r=0.457；2021中华行为医学（N=590）：无聊-抑郁r=0.649；Escartín 2014（50名大学生12节课）：课堂仅20%时间处于心流"
      sources: ["Liu 2024", "中华行为医学 2021", "Escartín 2014", "Deci & Ryan 2000 SDT"]
      url: ""
    - claim: "网络上行社会比较（刷朋友圈/小红书/抖音看到'成功同辈'）与心理适应不良稳定相关"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Lei 2026元分析（94个效应量，N=36,583）：网络上行比较与心理适应不良r̄=0.330；边界：比较对象接近且可达时有同化激励作用（Collins 1996）"
      sources: ["Lei 2026 (meta)", "Collins 1996", "Festinger 1954"]
      url: ""
    - claim: "'易被带节奏'源于从众与信息瀑布机制：多数人一致给出错误答案时32-37%被试至少一次服从，一个同盟者即可大幅降低从众"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Asch 1956：32-37%被试至少一次服从错误多数，有1名同盟者时从众率降至约1/4；Bikhchandani 1992信息瀑布：个体会忽略私人信息跟随前人选择"
      sources: ["Asch 1956", "Bikhchandani, Hirshleifer & Welch 1992"]
      url: ""
    - claim: "'多疑敏感'对应高敏感人格（HSP）这一稳定特质（约15-25%人口），是感觉加工更精细而非病态警觉"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Lionetti 2019元分析（k=72，N>40,000）：HSP与神经质r=0.40-0.42、与负性情感r=0.34；Acevedo 2014 fMRI：岛叶/下额回/前扣带激活增强但杏仁核无差异"
      sources: ["Lionetti 2019 (meta)", "Acevedo 2014 fMRI", "Aron 1997"]
      url: ""
    - claim: "'意志力如肌肉'的自我损耗（ego depletion）资源模型成立，自控失败是能量耗尽"
      verdict: "证伪"
      original: "❌ Hagger 2016 d=0.04 CI [-0.07, 0.15]，23实验室联合复制崩塌"
      evidence: "Hagger et al. 2016预注册联合复制（23个实验室，N=2,141）：效应d=0.04、置信区间包含零，经典范式无法复现，资源模型被推翻"
      sources: ["Hagger et al. 2016, Registered Replication Report"]
      url: ""
    - claim: "自控失败应改用'动机-注意力转移'解释：不是能量耗尽，而是动机从'必须做'转向'想做'，注意力可重新分配"
      verdict: "支持"
      original: "⚠️⚠️⚠️ 最强红线：必须改为'动机-注意力转移'"
      evidence: "Inzlicht & Schmeichel 2012 / Inzlicht & Berkman 2015动机转移模型（shifting priorities）：自控后大脑对任务重新估值而非资源耗尽"
      sources: ["Inzlicht & Berkman 2015", "Inzlicht & Schmeichel 2012"]
      url: ""
    - claim: "'成长心态'教育干预能普遍显著提升（普通）学生的学业成绩"
      verdict: "证伪"
      original: "⚠️ Macnamara 2022高质量6研究d=0.02不显著；早期效应被发表偏差与商业利益放大"
      evidence: "Macnamara 2022（Psychological Science，63研究N=97,672）：总体d=0.05，高质量6研究d=0.02 [-0.06,0.10]不显著；Blackwell 2007 d=0.66→Macnamara 2022 d=0.02累计落差33倍"
      sources: ["Macnamara et al. 2022, Psychological Science", "Sisk et al. 2018"]
      url: ""
    - claim: "行为激活（先做再说、每天1-2件小事）是治疗抑郁的高效心理疗法，效应量不弱于药物，适合'想多做少'状态"
      verdict: "支持"
      original: "✅ 强支持（BA g=0.85）"
      evidence: "Cuijpers 2023元分析：BA g=0.85（CI 0.57-1.10），NNT=3.48；Ekers 2014：vs药物SMD=-0.42不弱；Dimidjian 2006 RCT（N=241重度抑郁）：BA改善79%>药物60%>认知治疗50%"
      sources: ["Cuijpers 2023 (meta)", "Ekers 2014, PLOS ONE", "Dimidjian 2006 RCT", "Richards 2016, Lancet（COBRA）"]
      url: ""
    - claim: "'活在当下'的正念训练能显著降低抑郁复发风险并改善焦虑抑郁症状"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Kuyken 2016（JAMA Psychiatry，1258例个体数据60周）：MBCT复发风险HR=0.69（降低31%）；ACT治抑郁SMD=-0.66（Wang 2025）；正念治焦虑g=0.63（Hofmann 2010）"
      sources: ["Kuyken et al. 2016, JAMA Psychiatry", "Wang 2025 (ACT meta)", "Hofmann 2010"]
      url: ""
    - claim: "实施意图（'如果X情境那么我做Y'）能把想法转化为行动，目标达成率获得中等至大效应提升"
      verdict: "支持"
      original: "✅ 强支持"
      evidence: "Gollwitzer & Sheeran 2006元分析（k=94）：d=0.65；Sheeran 2024更新（k=642）校正后d=0.36仍显著"
      sources: ["Gollwitzer & Sheeran 2006 (meta)", "Sheeran et al. 2024"]
      url: ""
    - claim: "习惯形成中位约66天（18-254天），'21天习惯'说法无科学支持，关键是每天同一情境的稳定性"
      verdict: "支持"
      original: "✅ 强支持（66天，非21天）"
      evidence: "Lally 2010/2014（N=96真实情境研究）：中位66天，范围18-254天；Lally已多次澄清21天无依据"
      sources: ["Lally et al. 2010, EJSP", "Fogg 2019, Tiny Habits"]
      url: ""
    - claim: "中国大学生心理咨询知晓率约80%但实际使用率仅2.8%，低成本循证自助方法（正念/小事启动/行为实验）可填补此鸿沟"
      verdict: "支持"
      original: "🟢 强支持（中国大学生本土化数据）"
      evidence: "2024中科院心理所蓝皮书（N=60,782）：知晓率80%、使用率2.8%；一二年级抑郁焦虑风险高于高年级；室友支持为保护因素（OR≈0.6）"
      sources: ["2024中科院心理所《中国国民心理健康发展报告》"]
      url: ""
    - claim: "短视频重度使用与大学生负面状态相关，应主动限制时长（报告建议<90分钟/天）"
      verdict: "支持"
      original: "🟢 强支持（本土数据）"
      evidence: "2024蓝皮书（N=60,782）：日均短视频179.9分钟，30%反映负面影响，36.5%有成瘾倾向；93.33%大学生有学业拖延（中国青年网2021，N=22,896）"
      sources: ["2024中科院心理所蓝皮书", "中国青年网 2021"]
      url: ""
    - claim: "马克思异化四维度可作为大学生'莫名烦躁'的科学诊断工具"
      verdict: "部分支持"
      original: "🟡 哲学人类学非量表，只作结构诊断用，不作为诊断工具"
      evidence: "报告裁定：Marx 1844异化论仅可作'为何读书缺乏及时正向反馈'的结构解释，误用为病理学诊断属还原论错误"
      sources: ["Marx 1844《1844年经济学哲学手稿》"]
      url: ""
