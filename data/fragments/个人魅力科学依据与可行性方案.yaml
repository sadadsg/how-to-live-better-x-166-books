- theme: "个人魅力科学依据与可行性方案"
  category: "6_个人成长方法论/6.4_关系婚恋与形象"
  report_file: "个人魅力科学依据与可行性方案调研报告.md"
  claims:
    - claim: "外貌统治亚秒级第一印象（入场券），但其权重随相处时长衰减，长期吸引靠重复曝光+正面互动+响应性"
      verdict: "支持"
      original: "支持｜证据强度：强（前半句完全成立；权重随相处衰减）"
      evidence: "Willis & Todorov 2006：100ms 即完成五维特质判断，延长只增自信不增准确；Hunt 2015：相识越久外貌匹配度越低；Reis 2011：初始印象偏正时重复接触提升吸引"
      sources: ["Willis & Todorov 2006", "Langlois et al. 2000 元分析", "Hunt, Eastwick & Finkel 2015", "Reis et al. 2011", "Moreland & Beach 1992"]
      url: "https://pubmed.ncbi.nlm.nih.gov/16866745/"
    - claim: "照通用魅力模板改造自己就能对所有人有吸引力"
      verdict: "证伪"
      original: "失败模式6：模板式魅力——吸引的独特性几乎不可预测"
      evidence: "Joel 2017 机器学习+速度约会：'谁喜欢谁'大量落在个体特异性成分；Eastwick & Finkel 2008：陈述的理想伴侣标准不能预测现场互动中的浪漫兴趣"
      sources: ["Joel, Eastwick & Finkel 2017", "Eastwick & Finkel 2008"]
      url: "https://pubmed.ncbi.nlm.nih.gov/28853645/"
    - claim: "'先建立自我、不盲目迎合'是魅力的直接加分项"
      verdict: "部分支持"
      original: "部分支持｜证据强度：中——建立自我是止损不是增益"
      evidence: "Campbell 1996：低自我清晰度与低自尊 r≈.61；Guadagno 2007：低SCC者更依赖外部评价；'明确自我→更有魅力'缺直接实验证据，成立的是'低清晰→从众'反向链"
      sources: ["Campbell et al. 1996", "Guadagno et al. 2007", "Laursen 2022"]
      url: "https://www.tandfonline.com/doi/full/10.1080/15534510701357270"
    - claim: "深耕真实能力带来尊重（仅限被观察到的专长），且长期深耕有生理沉淀（认知组块、脑结构改变）"
      verdict: "支持"
      original: "支持（带修正）｜证据强度：强"
      evidence: "Cheng 支配-威望双路径：分享专长获得尊重是被反复验证的地位通道；Maguire 2000：伦敦出租车司机后部海马灰质更大且与从业年限相关"
      sources: ["Cheng, Tracy & Henrich 双路径模型", "Maguire et al. 2000 (PNAS)", "Chase & Simon 1973"]
      url: "https://pubmed.ncbi.nlm.nih.gov/10716738/"
    - claim: "在单一领域堆时长（投入时间=厚度）就能形成能力与成绩"
      verdict: "证伪"
      original: "堆时长已被证伪：刻意练习只解释 12% 成绩差异"
      evidence: "Macnamara 2014 元分析88项：刻意练习仅解释成绩差异12%（教育4%、职业<1%）；Credé 2017 元分析：Grit 与尽责性 r=.84，预测力不优于尽责性"
      sources: ["Macnamara, Hambrick & Oswald 2014", "Credé, Tynan & Harms 2017"]
      url: "https://pubmed.ncbi.nlm.nih.gov/24986855/"
    - claim: "'管控情绪'的正确实践是压抑表情、憋住不表现"
      verdict: "证伪"
      original: "关键修正：压抑会让对方血压升高（Butler 2003）"
      evidence: "Oveis 2025 元分析77项 N=20,940：认知重评 r=.16、自然表达 r=.18（最高）、表达抑制 r=−.06；Butler 2003 实验：一方压抑令互动对方血压升高、rapport 下降"
      sources: ["Oveis, Dezecache & Gruber 2025 元分析", "Butler et al. 2003", "Srivastava et al. 2009"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12056272"
    - claim: "情绪稳定/成熟是跨文化择偶偏好中位居前列的特质（但口头偏好对实际择偶预测力有限）"
      verdict: "支持"
      original: "支持（关键修正）——情绪稳定确实是跨文化最受看重的特质之一"
      evidence: "Buss 1989（37种文化 7,000+人）：情绪稳定/成熟位居择偶偏好前列；Malouff 2010 元分析：神经质与关系满意度 r≈−.26；限定：Eastwick 2024 预注册检验"
      sources: ["Buss 1989（37 cultures）", "Malouff et al. 2010", "Eastwick et al. 2024"]
      url: "https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/sex-differences-in-human-mate-preferences-evolutionary-hypotheses-tested-in-37-cultures/0E112ACEB2E7BC877805E3AC11ABC889"
    - claim: "'让他人舒服'与讨好是两条相反的路：讨好一旦被识破即反噬，且是抑郁易感因素"
      verdict: "支持"
      original: "支持（机制层面）——两者方向相反，不是程度差异"
      evidence: "Gordon 1996 元分析：ingratiation 被识别为操纵手段时出现评价惩罚；Vonk 2002：第三方观察者更怀疑并给低评；people-pleasing 与焦虑、耗竭负关联"
      sources: ["Jones 1964", "Gordon 1996 元分析", "Vonk 2002"]
      url: "http://www.communicationcache.com/uploads/1/0/8/8/10887248/impact_of_ingratiation_on_judgments_and_evaluations-_a_meta-analytic_investigation.pdf"
    - claim: "'给人安全感'的实证配方是低回避+低焦虑（稳定可及+不过度索取），且安全感可训练"
      verdict: "支持"
      original: "支持——安全感是可训练的，不是天生注定的"
      evidence: "Li & Chan 2012 元分析73项 N=21,602：依恋焦虑与回避均损害关系质量，回避负效应更强；Mikulincer 2020：security priming 显示安全感可被实验诱导扩建"
      sources: ["Li & Chan 2012 元分析", "Mikulincer & Shaver 2007/2020", "Reis 2007"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7143531/"
    - claim: "做自己的真实性红利（幸福感+关系深度）真实存在，但'想说什么就说什么'的粗暴表达不行"
      verdict: "部分支持"
      original: "部分支持——文献指向'真实+善意表达'，不是'想说什么就说什么'"
      evidence: "Sutton 2020 元分析75项 N=36,533：真实性与幸福感 r≈.40；Levine & Cohen 2018 多实验：说真话的社交代价被系统性高估；边界：无分寸的粗暴仍伤关系"
      sources: ["Sutton 2020 元分析", "Levine & Cohen 2018", "Snyder et al. 1985"]
      url: "https://www.sciencedirect.com/science/article/pii/S019188691930577X"
    - claim: "保持好奇心、多领域涉猎会自动带来'鲜活魅力'（涉猎→有趣的因果链成立）"
      verdict: "部分支持"
      original: "部分支持｜证据强度：中——涉猎→有趣缺直接因果实验"
      evidence: "Kashdan 2011 三项研究：好奇者在深度对话中制造更多亲密感，small talk 中无优势；Tolomeo 2023 好奇心脑影像 FWE 校正后无显著簇，禁止强引用"
      sources: ["Kashdan & Roberts 2004", "Kashdan et al. 2011", "Tolomeo et al. 2023"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3356784/"
    - claim: "渐进式自我表露提升喜欢与亲密感；神秘感的全部可核验收益只是短期不确定性注意"
      verdict: "支持"
      original: "支持｜证据强度：强——六条中最干净的支持"
      evidence: "Collins & Miller 1994 元分析：表露-喜欢三路径全为正；Aron 1997：45分钟渐进互惠表露显著产生亲密感；Birnbaum 2018：感知不感兴趣时不确定性直接损害吸引"
      sources: ["Collins & Miller 1994 元分析", "Aron et al. 1997", "Birnbaum et al. 2018"]
      url: "https://pubmed.ncbi.nlm.nih.gov/7809308/"
    - claim: "'保持神秘/一律难得到'会让人更渴望你"
      verdict: "证伪"
      original: "失败模式5：'一律难得到'实证上无效（Walster 1973）"
      evidence: "Walster 1973 现场实验：'一律难得到'并不更被渴望，有效的是 selectively hard to get（对'你'热情、对他人冷淡）；感知冷漠即触发欲望抑制"
      sources: ["Walster et al. 1973", "Whitchurch, Wilson & Gilbert 2011", "Norton, Frost & Ariely 2007"]
      url: "https://pubmed.ncbi.nlm.nih.gov/21169522/"
    - claim: "'21天养成习惯/魅力'有科学依据（存在统一的习惯养成天数）"
      verdict: "证伪"
      original: "任何'X天养成魅力'的单一数字都无科学依据"
      evidence: "Lally 2010（96人）：达到自动性时间中位数约66天、全距18-254天；Singh 2024：复杂行为106-154天；if-then 执行意图元分析 d=0.65（Gollwitzer & Sheeran 2006）"
      sources: ["Lally et al. 2010", "Singh 2024", "Gollwitzer & Sheeran 2006 元分析"]
      url: "https://onlinelibrary.wiley.com/doi/10.1002/ejsp.674"
    - claim: "谈吐层面的魅力（表达策略）可通过训练显著提升，不是天赋"
      verdict: "支持"
      original: "表达层魅力可训练（RCT 级）——mean d=.62"
      evidence: "Antonakis 2011：12项魅力领导策略（CLT）训练，34名中层经理随机分派3个月后同事盲评显著提升；41名MBA 培训前后由135名评委盲评，魅力评分 mean d=.62"
      sources: ["Antonakis, Fenley & Liechti 2011 (AMLE)"]
      url: "https://iris.unil.ch/bitstreams/bc0be0af-64c6-42a6-b347-6c2f379a8e50/download"
