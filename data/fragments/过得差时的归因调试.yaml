- theme: "过得差时的归因调试"
  category: "6_个人成长方法论/6.3_情绪压力与韧性"
  report_file: "过得差时的归因调试调研报告.md"
  claims:
    - claim: "失败时先审视具体环境因素（外部×稳定×不可控维度）有归因理论支持，是'定位'而非'甩锅'"
      verdict: "支持"
      original: "🟢 强支持（Weiner × Kelley × Seligman）"
      evidence: "Weiner 1985 三维归因（被引>20,000）：内外源/稳定性/可控性决定预期与情绪；Kelley 1967 协变原则提供共识-独特性-一致性检验法。"
      sources: ["Weiner 1985 Psychological Review", "Kelley 1967 协变原则"]
      url: "https://doi.org/10.1037/0033-295X.92.4.548"
    - claim: "'过得差全是别人的问题'式完全外部归因是有效自我保护——不成立，它是习得性无助的反面镜像、另一种认知偏差"
      verdict: "证伪"
      original: "🔴 勿用：完全外归=认知偏差"
      evidence: "Abramson 1978 归因修正版：抑郁型风格=内部+稳定+全局归因；报告论证完全外归是内部归因风格的反面镜像；Mezulis 2004 元分析（266项研究）显示归因偏差双向存在。"
      sources: ["Abramson et al. 1978", "Mezulis et al. 2004 元分析"]
      url: "https://doi.org/10.1037/0021-843X.87.1.49"
    - claim: "行为与情绪沿社交网络传染（肥胖、吸烟跨三层人脉传播），换环境需进入新的网络结构而非仅物理离开"
      verdict: "支持"
      original: "🟢 强支持（Christakis Framingham 队列）"
      evidence: "Christakis & Fowler 2007/2008 NEJM（32年、12,067人）：朋友肥胖显著增加个人肥胖概率且跨三层传播；Centola 2010 Science：聚类网络比随机网络更能扩散健康行为；抑郁传染机制有争议（🟡）。"
      sources: ["Christakis & Fowler 2007/2008 NEJM", "Centola 2010 Science", "Rosenquist 2010 AJPH"]
      url: "https://doi.org/10.1056/NEJMsa066082"
    - claim: "与偏差群体抱团显著拉高越轨/再犯风险，但并非100%必然（17-32%不再犯），关键是接触稳定的非偏差群体"
      verdict: "支持"
      original: "🟢 有数据支持但过度化"
      evidence: "美国BJS 2018：刑满释放3年再犯68%、9年83%，但17-32%不再犯；Dishion 1995：把偏差者集中干预反效果（iatrogenic）；Sampson & Laub 1990：转折点在新社会键。"
      sources: ["BJS 2018 Recidivism Report", "Dishion et al. 1995", "Sampson & Laub 1990"]
      url: ""
    - claim: "远离毒性关系是优先级等同戒烟的健康干预，但'远离所有人'=孤立有害，需新建正向连接"
      verdict: "支持"
      original: "🟢🟢 真金（Rook × Holt-Lunstad）"
      evidence: "Rook 1984 JPSP：消极交换破坏力>积极交换恢复力（负向不对称）；Holt-Lunstad 2010（148项研究、308,849人）：社会关系弱者死亡风险 OR=1.50，效应与戒烟相当。"
      sources: ["Rook 1984 JPSP", "Holt-Lunstad et al. 2010 PLoS Medicine"]
      url: "https://doi.org/10.1371/journal.pmed.1000316"
    - claim: "反馈并非普遍有效：超过38%的反馈干预实际降低绩效，平均效应仅 d=0.41"
      verdict: "支持"
      original: "🟢 强支持（Kluger & DeNisi 元分析）"
      evidence: "Kluger & DeNisi 1996 Psychological Bulletin（607个效应量、23,663次观察）：d=0.41、>38%负向；针对自我的高层级反馈最低效甚至负效；Wisniewski 2020（k=994）复现异质性 d=0.48。"
      sources: ["Kluger & DeNisi 1996", "Wisniewski et al. 2020"]
      url: "https://doi.org/10.1037/0033-2909.119.2.254"
    - claim: "打压式（威胁式/针对自我的）反馈会激发心理反抗，使反馈无效甚至反向"
      verdict: "支持"
      original: "🟢 强支持（Brehm 心理反抗理论）"
      evidence: "Brehm 1966 心理反抗理论（Miron & Brehm 2006 综述被引5,310）：威胁行为自由激发恢复自由的动机状态——打压者反馈无效化的机制；反馈干预理论：自我层级反馈最低效。"
      sources: ["Brehm 1966", "Miron & Brehm 2006", "Kluger & DeNisi 1996 反馈干预理论"]
      url: ""
    - claim: "凭单一观察判断他人是否说谎/是否打压者准确率差，需多源论据与长期准确率追踪（如30天记录）"
      verdict: "支持"
      original: "🟢 强支持（谎言检测综述）"
      evidence: "DePaulo 1998 与 Hart & Bondy 2019 Annual Review of Psychology：非言语欺骗线索微弱不可靠、人是中等水平谎言捕捉者——单一观察差、多源论据准。"
      sources: ["DePaulo et al. 1998", "Hart & Bondy 2019 Annual Review of Psychology"]
      url: "https://doi.org/10.1146/annurev-psych-010418-103135"
    - claim: "学习/掌握目标导向比表现目标导向带来更有效的策略、更多挑战偏好与长期韧性"
      verdict: "支持"
      original: "🟢 强支持（Dweck 1986）"
      evidence: "Ames 1988（176名学生）：掌握目标学生策略更有效、偏好挑战；Yeager 2016 元分析（1,260名中国学生）：成长型思维经韧性提升预测心理健康与学校投入。"
      sources: ["Dweck 1986", "Ames 1988 J Educational Psychology", "Yeager et al. 2016"]
      url: "https://doi.org/10.1037/0022-0663.80.3.260"
    - claim: "具体+困难的目标产生最高绩效，过程导向应理解为'过程目标+每周评估'，而非不设目标"
      verdict: "支持"
      original: "🟢 强支持（Locke & Latham 35年综合）"
      evidence: "Locke & Latham 2002 American Psychologist（被引>10,000）：具体+困难目标经专注/努力/坚持/策略/效能感五机制提升绩效；Ordonez 2009 警告无目标化反效果。"
      sources: ["Locke & Latham 2002", "Ordonez et al. 2009 Goals Gone Wild"]
      url: "https://doi.org/10.1037/0003-066X.57.9.705"
    - claim: "'只关注过程、不设目标不评估结果'是反模式——会变成无目的忙碌与价值虚无"
      verdict: "部分支持"
      original: "🟡 慎用：过程导向≠不设目标"
      evidence: "Ordonez et al. 2009 Goals Gone Wild 警告目标缺失的风险边界；报告主张过程价值与结果价值平衡、每周复盘动作完成度（ACT 元分析 g=0.57 支持承诺行动框架）。"
      sources: ["Ordonez et al. 2009", "Ost 2014 ACT 元分析"]
      url: ""
