- theme: "最健康睡眠时间科学依据"
  category: "6_个人成长方法论/6.5_健康与身体"
  report_file: "最健康睡眠时间科学依据调研报告.md"
  claims:
    - claim: "健康成年人推荐每晚睡 7-9 小时，65 岁及以上推荐 7-8 小时"
      verdict: "支持"
      original: "🔍 已验证"
      evidence: "NSF 2015 官方共识：成人 7-9h、老年 7-8h；AASM 2015 共识只设下限'成人 ≥7h'，明确拒绝一刀切的'8 小时'口径"
      sources: ["NSF 2015", "AASM 2015"]
      url: "https://www.sleephealthjournal.org/article/s2352-7218(15)00015-7/fulltext"
    - claim: "长期睡眠不足 6 小时与死亡、心血管、代谢、免疫、痴呆风险升高相关（健康成人）"
      verdict: "支持"
      original: "🔍"
      evidence: "Cappuccio 2010 元分析 n=1,382,999：短睡全因死亡 RR 1.12、冠心病 RR 1.48；Prather 2015 实验：睡眠<6h 者感冒风险 OR 4.50"
      sources: ["Cappuccio et al. 2010", "Prather et al. 2015", "Sabia et al. 2021"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2864873/"
    - claim: "睡眠时长与全因死亡率呈 U 型关联，群体均值谷底约在 7 小时，而非'睡得越多越好'或'必须 8 小时'"
      verdict: "支持"
      original: "🔍（谷底钟点 ⚠️）"
      evidence: "Cappuccio 2010 元分析：短睡 RR 1.12、长睡 RR 1.30；Kripke 2002（110 万人）与日本 JACC 两个队列（各约 10 万人）谷底均为 7 小时"
      sources: ["Cappuccio et al. 2010", "Kripke et al. 2002"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2864873/"
    - claim: "入睡时间与心血管风险呈 U 型：22:00-22:59 入睡者风险最低，晚于 0 点或早于 22 点均升高（中老年人群，观察性证据）"
      verdict: "部分支持"
      original: "🔍 ⚠️ 单一观察性研究，精确钟点不宜过度解读"
      evidence: "Nikbakhtian & Plans 2021：UK Biobank 88,026 人加速度计+5.7 年随访，22:00-22:59 组 CVD 发生率最低 2.79%；≥00:00 HR 1.25、<22:00 HR 1.24"
      sources: ["Nikbakhtian & Plans 2021"]
      url: "https://academic.oup.com/ehjdh/article/2/4/658/6423198"
    - claim: "睡眠规律性（就寝/起床时间稳定）对全因死亡与心血管风险的预测力强于睡眠时长（中老年队列）"
      verdict: "支持"
      original: "🔍"
      evidence: "Windred 2023：UK Biobank 60,977 人，规律性最高组全因死亡低 20-48% 且预测力强于时长；Chaput 2024：时长达标无法抵消不规律风险 HR 1.19"
      sources: ["Windred et al. 2023", "Cribb et al. 2023", "Chaput et al. 2024", "Yiallourou et al. 2024"]
      url: "https://doi.org/10.1093/sleep/zsad253"
    - claim: "只要总睡眠时长够，几点睡都可以（入睡钟点不影响健康）"
      verdict: "证伪"
      original: "❌"
      evidence: "Scheer 2009 PNAS 受控实验：等睡眠量下节律错位使瘦素 -17%、血糖 +6%；Leproult 2014：同等睡眠量下错位使胰岛素抵抗升幅翻倍"
      sources: ["Scheer et al. 2009", "Leproult et al. 2014", "Morris et al. 2015"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2657421/"
    - claim: "肝脏只在凌晨 1-3 点'排毒'，不睡肝脏就无法排毒"
      verdict: "证伪"
      original: "❌"
      evidence: "肝脏 CYP450 三相解毒 24 小时连续、由底物驱动，无'排毒时段'；中医专家澄清这是对子午流注（经气盛衰）的现代扭曲"
      sources: ["科普中国·科学辟谣", "Nature Rev Gastroenterol Hepatol 2016"]
      url: "https://www.nature.com/articles/nrgastro.2016.8"
    - claim: "早睡对肝脏有益，机制是昼夜节律对齐而非'按时排毒'；偶尔晚睡不会让肝脏'错过班次'"
      verdict: "部分支持"
      original: "🟡"
      evidence: "肝脏约 10% 转录组有节律性表达，2024 年 MIT 在原代人肝细胞证实自主昼夜振荡——真实图景是'连续工作+节律性效率波动'"
      sources: ["Nature Rev Gastroenterol Hepatol 2016", "MIT 2024"]
      url: "https://www.nature.com/articles/nrgastro.2016.8"
    - claim: "多相睡眠（如每天只睡 2 小时的分段睡眠）能替代整段睡眠且不影响健康"
      verdict: "证伪"
      original: "❌"
      evidence: "NSF 共识综述：无任何益处证据；Rosenblumm 2024：Uberman 方案 10 人中 9 人三周内退出，坚持者生长激素分泌被抑制 >95%"
      sources: ["NSF 多相睡眠共识综述 2021", "Rosenblumm et al. 2024"]
      url: "https://pubmed.ncbi.nlm.nih.gov/33795195/"
    - claim: "睡眠以约 90 分钟为周期循环，按 90 分钟倍数安排睡眠可精确卡点、睡得更聪明"
      verdict: "部分支持"
      original: "🟡 过度简化"
      evidence: "Cajochen 2023 实测 6,064 个周期：中位 96 分钟、范围约 60-150 分钟且逐夜波动——周期真实存在但无法精确卡点，'倍数睡更聪明'属营销"
      sources: ["Cajochen et al. 2023", "StatPearls 2023"]
      url: "https://eprints.soton.ac.uk/502837/1/1-s2.0-S2352721823002048-main.pdf"
    - claim: "周末补觉能缓解急性睡眠不足带来的困倦（效果短暂）"
      verdict: "部分支持"
      original: "🟡 能缓解急性困倦（短暂）"
      evidence: "报告裁决：周末补觉'能缓解急性困倦（短暂）'；Depner 2019 住院 RCT 同时显示其无法防止代谢紊乱"
      sources: ["Depner et al. 2019"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12798825/"
    - claim: "周末补觉能还清睡眠债、弥补长期睡眠不足造成的代谢损害"
      verdict: "证伪"
      original: "🟡 还不了代谢的债"
      evidence: "Depner 2019 住院 2 周随机对照：周末补觉组全身胰岛素敏感度反降 27%，肝/肌敏感度下降仅见于补觉组，褪黑素相位延迟 1.2-1.7h"
      sources: ["Depner et al. 2019"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12798825/"
    - claim: "生长激素固定在 23 点-凌晨 2 点分泌最旺，必须在此钟点前熟睡才不浪费"
      verdict: "证伪"
      original: "⚠️ 对经典生理学的通俗化误读"
      evidence: "Takahashi 1968 直接证明 GH 主峰锚定'入睡后首个慢波睡眠'而非固定钟点，入睡推迟则峰值平移；夜班者 24h 总量不变"
      sources: ["Takahashi et al. 1968"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC297368/"
    - claim: "睡前喝酒有助入眠、改善睡眠质量"
      verdict: "证伪"
      original: "🔍（Ebrahim 2013 系统综述）"
      evidence: "Ebrahim 2013 系统综述：全剂量酒精缩短入睡潜伏期但破坏 REM 与后半夜睡眠结构，整体损害睡眠质量"
      sources: ["Ebrahim et al. 2013"]
      url: "https://doi.org/10.1111/acer.12006"
    - claim: "入睡前 6 小时摄入 400mg 咖啡因仍会客观减少睡眠 1 小时以上，且本人主观无感（健康成人）"
      verdict: "支持"
      original: "🔍"
      evidence: "Drake 2013：咖啡因半衰期均值 5h（1.5-9.5h）；400mg 睡前 6h 仍客观减睡 >1h 且主观无感——建议末杯不晚于入睡前 8 小时"
      sources: ["Drake et al. 2013"]
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807/"
