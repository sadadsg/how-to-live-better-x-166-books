  - name: '"足够好的父母" vs "完美父母"模型'
    core: 完美父母（Perfect Parent）        足够好的父母（Good Enough）
  - name: 母亲"包容" × 父亲"切断"双力量模型
    core: 孩子的心理发展
  - name: 童话与故事的心理治疗功能
    core: 童话/故事的心理功能（荣格视角）
  - name: 孩子"问题行为"的深层解码
    core: 河合隼雄认为，大多数"问题行为"不是"毛病"，而是孩子在用有限的语言和能力，试图表达某种未被满足的心理需求。
  - name: 父母投射——未竟之梦的幽灵
    core: 投 射 机 制
  - name: 过度保护的悖论
    core: 保 护 程 度 与 孩 子 发 展 的 关 系
  - name: 育儿的核心悖论
    core: 育 儿 的 核 心 悖 论
  - name: 「标准病」诊断——每个孩子是一种「有树的风景」
    core: 「标 准 病」的 病 理
  - name: 亲子关系「储蓄」模型——学前期存款，青春期取款
    core: 孩子年龄   0  6  12  18 ▶
  - name: 「啐啄同时」——支持的时机哲学
    core: 小鸡孵化的三态（禅宗公案 → 养育模型）
  - name: 青春期「二次断乳」应对系统
    core: 青春期家庭系统震荡图
  - name: 养育的终点——自性实现与适时退出
    core: 养 育 全 程 图（起点 → 终点）
  counterintuitive:
  - title: '"孩子最不需要的，是完美的父母"'
    claim: 大众认知：父母越完美，孩子越幸福。我要尽一切努力成为最好的父母。 作者/河合隼雄：追求"完美父母"是育儿焦虑的根源。孩子需要的是一个真实的、会犯错的、但愿意和他一起成长的人。"足够好"才是最好的——因为"完美"既不可能，也会让孩子窒息。
  - title: '"童话里的''黑暗''不是毒药，是药"'
    claim: 大众认知：给孩子看的故事应该纯净、美好、正能量。黑暗的童话会吓到孩子。 作者/河合隼雄：恰恰相反——童话中的狼、巫婆、死亡和恐惧，是孩子在安全的想象空间中接触生命阴影的方式。被过度净化的童话剥夺了孩子学习面对恐惧的机会。
  - title: '"孩子的''问题行为''往往不是问题"'
    claim: 大众认知：孩子打人、说谎、不听话、胆小，都是需要纠正的"毛病"。 作者/河合隼雄：大多数"问题行为"是健康发展的信号。攻击性是生命力的表达，不听话是独立意识的觉醒，胆小是高度敏感性——这些都是孩子在用有限的方式表达自己的需要。
  - title: '"育儿的最大受益者不是孩子，是父母自己"'
    claim: 大众认知：育儿是为了孩子好。我牺牲自己，为了孩子的未来。 作者/河合隼雄：育儿过程中，真正被改变最大的是父母自己。孩子是一面镜子，照出你内心所有未解决的议题——你的焦虑、你的控制欲、你童年未被满足的需求。育儿是最深刻的心灵成长之旅。
  - title: '"保护过度比保护不足更危险"'
    claim: 大众认知：保护孩子越多越好，宁可过度保护也不要让孩子受伤。 作者/河合隼雄：保护不足的伤害是显而易见的（孩子缺乏安全感），但保护过度的伤害是隐蔽的——孩子丧失自主性、抗挫力和冒险精神，变成一个"温室里的花朵"，一旦离开温室就无法生存。
  - title: '"孩子是最好的心理治疗师"'
    claim: 大众认知：父母是孩子的心理建设者。 作者/河合隼雄：反过来更接近真相——孩子是父母的心理治疗师。孩子的存在会不断触发你内心最原始、最脆弱的部分。每一次你被孩子"激怒"，都是你的内心在告诉你："这里有一个旧伤，需要你来看一看。"
  - title: '"父母的''恶''不是消除对象，而是理解对象"'
    claim: 大众认知：好的父母应该控制自己的负面情绪，永远不把坏情绪带给孩子。 作者/河合隼雄：父母不可能不把"阴影"带进育儿。与其假装自己没有愤怒、焦虑和自私，不如在孩子面前展示一个"真实的人"——一个有情绪但能管理情绪、会犯错但愿意道歉的人。
  - title: '"孩子对着你的盲点唱反调，是在给你递镜子"'
    claim: 大众认知：孩子到了青春期就开始叛逆，唱反调是必须压回去的"毛病"。
  - title: '"能说出''讨厌养孩子''的父母，比假装深爱的更真实"'
    claim: 大众认知：父母怎么可以讨厌自己的孩子？说出口就是失职。
  - title: '"养育的目标是让孩子飞走，不是留在身边报恩"'
    claim: 大众认知：亲子纽带越紧越好，养儿防老，孩子守在身边才是福气。
  takeaway: 最好的父母不是不犯错的人，而是敢于在孩子面前承认"我也不完美"并继续成长的人。
