- book: 清洁的力量
  author: 琳达·托马斯（Linda Thomas，英国）
  category: 个人效能与习惯/生活整理
  file: 个人效能与习惯/生活整理/拆书笔记-《清洁的力量》.md
  frameworks:
  - name: 清洁 = 移动中的冥想
    core: 清 洁 与 冥 想 的 对 应 关 系
  - name: 空间与心灵的镜像关系
    core: 空 间 与 心 灵 的 镜 像
  - name: 清洁态度的三阶段转变
    core: 第一阶段                第二阶段                 第三阶段
  - name: 正念清洁五步法
    core: 托马斯将清洁过程转化为一套正念练习
  - name: 清洁的涟漪效应
    core: 外部环境改变（干净、有序、有光）
  - name: 天然清洁——对自己和环境的双重善意
    core: 托马斯特别强调使用天然清洁材料（白醋、小苏打、精油等），而非化学清洁剂。这不仅是环保主张，更是她哲学的一部分
  counterintuitive:
  - title: '"清洁不是家务，是冥想"'
    claim: 大众认知：清洁是不得不做的家务，是一种苦差事，越快做完越好。 作者/托马斯：清洁是"移动中的冥想"——当你带着觉知去擦桌子、洗碗、扫地，你的注意力就在当下，你的思绪就不再焦虑过去或恐惧未来。这和你坐在蒲团上冥想30分钟，本质上做的是同一件事。
  - title: '"不是心情好了再打扫，而是打扫了心情就好"'
    claim: 大众认知：等我有精力、有状态的时候再去打扫。 作者/托马斯：因果方向完全反了。不是"状态好→打扫"，而是"打扫→状态好"。一个干净的空间会直接改变你的心理状态——清晰、平静、有掌控感。你不需要等到"准备好了"，你只需要站起来，开始擦。
  - title: '"你不需要更多收纳术，你需要更少的东西"'
    claim: 大众认知：家里乱是因为收纳不够，买更多收纳盒就好了。 作者/托马斯：收纳不是解决之道——你只是把混乱藏进了盒子里。真正的解决之道是减少你需要清洁和管理的物品数量。东西越少，清洁越轻松，空间越开阔，心灵越自由。
  - title: '"天然清洁不是环保主义的矫情，是你和空间关系的升级"'
    claim: 大众认知：化学清洁剂效率更高、杀菌更彻底，天然清洁只是"小清新"的爱好。 作者/托马斯：天然清洁改变的不是清洁效果，而是你和清洁这件事的关系——从"对抗和消灭"变成了"照料和共生"。当你用醋和小苏打清洁时，你闻到的是自然的气味，你的皮肤不会被化学物质刺激，你的空间不会被化学残留污染。
  - title: '"越不想打扫的时候，越需要打扫"'
    claim: 大众认知：不想打扫就别打扫了，等有心情再说。 作者/托马斯：当你最不想打扫的时候，往往是你最需要打扫的时候。不想打扫的抗拒感，通常来自于空间已经积累了很多混乱，而这些混乱正在消耗你的能量。打破抗拒的那一刻，就是你开始恢复的时刻。
  - title: '"清洁不需要大块时间，需要的是觉知"'
    claim: 大众认知：打扫要专门腾出时间，最好是一个完整的下午。 作者/托马斯：真正的正念清洁不需要大块时间。擦一个洗手台2分钟，洗碗5分钟，扫地3分钟——如果你在这几分钟里是完全觉知的，效果可能比心不在焉地打扫一下午更好。
  - title: '"清洁是送给自己和家人的礼物"'
    claim: 大众认知：清洁是"为别人做的"，是牺牲和付出。 作者/托马斯：当你把清洁重新定义为"礼物"，整件事的性质就变了——你不是在"做家务"，你是在"创造一个干净、安全、有能量的空间给自己和你爱的人"。这个重新定义，让清洁从一种消耗变成了一种给予。
  takeaway: 你的家是你内心的X光片——改变那个空间，你就改变了自己。
