    core: 霭理士将性行为分解为三个阶段，不仅是生理描述，更是理解整个性心理的钥匙
  - name: 性反转连续光谱（The Sexual Inversion Spectrum）
    core: 霭理士拒绝"正常/变态"的二分法，提出性取向是一个连续光谱
  - name: 性爱象征机制（Erotic Symbolism）
    core: 性能量的"投射"方式——这是理解恋物癖、性幻想和所有"非典型性行为"的核心模型
  - name: 升华（Sublimation）的能量转化模型
    core: 性能量可以转化为其他高级活动
  - name: 求偶生物学（Courtship Biology）
    core: 求偶不是浪漫的附属品，而是生物学必需的过程
  - name: 霭理士 vs 弗洛伊德的方法论差异
    core: '---'
  counterintuitive:
  - title: '"羞涩不是道德产物，而是性选择的武器"'
    claim: 大众认知：羞涩是社会规训的结果，是"压制性欲"的文明代价。
  - title: '"自体性行为（auto-erotism）不是手淫，而是人类性生活的底层结构"'
    claim: 大众认知：自体性行为=手淫=堕落/有害。
  - title: '"同性恋是先天变异，不是堕落或发育失败"'
    claim: 大众认知（19世纪）：同性恋是罪行、是疯狂、是退化、是堕落的习得行为。
  - title: '"恋爱是一门需要学习的艺术，大多数人根本不懂恋爱"'
    claim: 大众认知：恋爱是本能，不需要学习。
  - title: '"性欲升华可能根本不存在——只是''拉开''了，不是''转化''了"'
    claim: 大众认知：性欲可以通过升华转化为创造力（弗洛伊德、霭理士的标准观点）。
  - title: '"男人在性中越主动越容易疲倦；女人在性中越被动越可能高潮延迟"'
    claim: 大众认知：男性是性中"永远饥渴"的一方，女性是"被动冷淡"的一方。
  - title: '"所有的性''变态''本质上都是象征化——与正常恋爱的机制完全相同"'
    claim: 大众认知：恋物癖、施虐受虐等是"心理疾病的症状"。
  - title: '"中国古人对性的理解并不比维多利亚时代的人差——只是没有系统化"'
    claim: 大众认知：中国传统文化对性讳莫如深，毫无科学理解。
  takeaway: 性能量是人类文明的底层燃料——理解它不是堕落，是觉醒。
