- book: 不妥协的谈判
  author: '[美] 丹尼尔·夏皮罗（Daniel Shapiro）'
  category: 心理学与行为科学/关系与沟通
  file: 心理学与行为科学/关系与沟通/拆书笔记-《不妥协的谈判》.md
  frameworks:
  - name: 身份谈判三层模型
    core: 身份谈判三层模型
  - name: 身份五大支柱
    core: 信仰   忠诚   价值观  经历   意识
  - name: 冲突旋涡五模型
    core: 冲突为什么会升级？作者识别出五个"旋涡"
  - name: 四步消歧法
    core: 打破身份对立的四步框架
  - name: 辩证统一模型
    core: 解决看似不可调和的冲突的方法——不是"折中"，而是"整合"
  - name: 情绪预警系统
    core: 与现有框架2.3的分工：2.3的"眩晕"回答"失控长什么样"，本框架回答"失控之前如何监测与降温"——给五漩涡装一个能从里面打开的出口。
  - name: 戏剧三角与赋能三角
    core: 与现有框架2.4的分工：2.4回答"打破身份对立的四步流程怎么做"，本框架回答"冲突把双方锁进了什么角色"——流程要跑得通，先得把人从角色牢笼里放出来。
  counterintuitive:
  - title: '"妥协是谈判失败的标志，不是成功"'
    claim: 大众认知：妥协是谈判的理想结果——双方各让一步。 作者观点：妥协意味着双方都没有得到真正想要的东西，只是暂时避免了冲突升级。
  - title: '"冲突的根源不是利益，而是身份"'
    claim: 大众认知：冲突是因为利益分配不均。 作者观点：利益冲突可以通过谈判解决，身份冲突不能——因为它关乎"我是谁"。
  - title: '"越是神圣不可侵犯的东西，越需要谈判"'
    claim: 大众认知：神圣的东西不应该被谈判——谈判就是亵渎。 作者观点：正因为它是"神圣"的，所以更需要理解对方为什么也认为它神圣。
  - title: '"部落效应是人类的本能，不是选择"'
    claim: 大众认知：人们可以选择不把对方当敌人。 作者观点：部落效应是进化遗留的本能——人类天生会把"我们"和"他们"分开。
  - title: '"解决冲突的第一步不是理解对方，而是理解自己"'
    claim: 大众认知：要解决冲突，先理解对方的立场。 作者观点：如果你不了解自己的"身份五大支柱"，你就无法理解为什么这个冲突让你如此痛苦。
  - title: '"禁忌话题往往是冲突的核心"'
    claim: 大众认知：有些话题不应该谈——谈了会更糟。 作者观点：那些"不能谈"的话题，往往正是冲突的核心。回避它们只会让冲突持续。
  - title: '"和解不是忘记过去，而是重新定义关系"'
    claim: 大众认知：和解意味着"算了"、"过去了"、"不追究了"。 作者观点：和解不是忘记，而是从"敌人"变成"合作伙伴"——即使我们有过去，我们也可以选择未来。
  takeaway: 冲突的本质不是利益之争，而是身份之战——解决冲突的关键不是妥协，而是打破部落效应。
