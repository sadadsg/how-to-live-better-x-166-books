    core: 核心定义（综合孔子各处论述）
  - name: 君子小人——二元人格坐标
    core: 孔子最常用的"二维分类法"，不是道德评判，是成长阶梯——每个人都在这两极之间移动。
  - name: 修身五步——从庶民到君子
    core: 孔子给出的人生升级路径（综合多章）
  - name: 礼——克己复礼的操作系统
    core: 孔子讲礼的三层结构（对齐老子"道→德→仁→义→礼"的退化链）
  - name: 为政四阶——德治的最强方案
    core: '"为政以德"的四层结构（综合为政、颜渊、子路各篇）'
  - name: 学习闭环——学而时习
    core: '"学而时习之"是孔子最核心的方法论'
  - name: 中庸之德——过犹不及
    core: '"中庸"不是平庸，是"恰到好处"——动态平衡'
  - name: 知命——承认边界但全力担当
    core: 孔子"知命"的四层含义
  - name: 六艺——可操作的能力体系
    core: 孔子教学生的六种实操技能（不是空谈心性）
  - name: 因材施教——同问不同答的方法论
    core: 同一问题，孔子给不同弟子不同答案——这就是"因材施教"
  - name: 损益观——文明的进化与退化
    core: '"殷因于夏礼，所损益可知也；周因于殷礼，所损益可知也"——礼是迭代的，不是死的。'
  - name: 人生三阶——而立、不惑、知天命
    core: 孔子自述的人生阶段（为政篇）
  counterintuitive:
  - title: '"学而时习之，不亦说乎"——学习不是苦差，是最大的快乐'
    claim: 大众认知：学习是辛苦的、为了生计的、应该被奖励才做的事。
  - title: '"巧言令色，鲜矣仁"——会说漂亮话的人，内心往往不仁'
    claim: 大众认知：会说话、会来事、会察言观色是优点，是情商高。
  - title: '"父为子隐，子为父隐"——直在亲情中'
    claim: 大众认知：法律面前人人平等，亲人犯错要举报才公正。
  - title: '"乡愿，德之贼也"——好好先生是道德的破坏者'
    claim: 大众认知：与人相处要和善、不得罪人、八面玲珑。
  - title: '"不患无位，患所以立"——怕的不是没位置，是没实力'
    claim: 大众认知：人生焦虑来自没得到想要的职位/财富/地位。
  - title: '"唯上智与下愚不移"——中人是最大的变数'
    claim: 大众认知：聪明人和笨人都好办，最难办的是普通人。
  - title: '"言必信，行必果"是**小人**，不是君子'
    claim: 大众认知：说话算数、做事有结果的人，是值得信赖的人。
  - title: '"未知生，焉知死"——先把活人的事做好'
    claim: 大众认知：思考人生意义，必须思考死亡。
  - title: '"知其不可而为之"——明知道做不到还做'
    claim: 大众认知：理性人应该评估成败概率，低概率的事不做。
  - title: '"君子不以言举人，不以人废言"——不看出身看内容'
    claim: 大众认知：选人要看身份、看资历、看关系。
  takeaway: '**孔子教你修起来——通过不断学习、克己、内省，把自己修成君子、仁者、圣人。'
