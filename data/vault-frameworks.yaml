- book: 沉思录
  author: '[古罗马]马可·奥勒留 (Marcus Aurelius)'
  category: 哲学经典/西方哲学
  file: 哲学经典/西方哲学/拆书笔记-《沉思录》.md
  frameworks:
  - name: 二分法控制（Dichotomy of Control）
    core: 全书最核心的框架。奥勒留反复回到这个圆心
  - name: 三重修炼（Three Disciplines）
    core: 奥勒留的三重修炼体系，对应控制二分法的三个面向
  - name: 从上方俯视（The View from Above）
    core: 奥勒留反复使用的一种心理技术——把自己抽离到宇宙尺度，从高处俯视人间万象
  - name: 死亡罗盘（Memento Mori）
    core: 死亡不是威胁，是指南针——帮你判断什么是真正重要的
  - name: 障碍即道路（The Obstacle Is the Way）
    core: 外部障碍（疾病/失败/他人的敌意）
  - name: 自然秩序与共同利益（Logos & Common Good）
    core: 个人理性 ←→ 宇宙理性（Logos）
  counterintuitive:
  - title: '"权力是最大的精神牢笼"'
    claim: 大众认知：拥有权力的人可以为所欲为，应该比普通人更自由。
  - title: '"死亡是人生最好的礼物"'
    claim: 大众认知：死亡是可怕的终点，应该尽一切可能逃避和遗忘它。
  - title: '"你不需要追求幸福——你只需要不制造不幸"'
    claim: 大众认知：幸福是通过获得更多的东西（钱、名声、爱）来实现的。
  - title: '"你的敌人是你最好的老师"'
    claim: 大众认知：敌人/对手是需要打败或消灭的对象。
  - title: '"一切都会被遗忘——这恰恰是自由"'
    claim: 大众认知：被人遗忘是最可怕的事，应该追求名垂青史。
  - title: '"抱怨暴露的是你自己，不是对方"'
    claim: 大众认知：抱怨是表达不满、寻求支持的合理行为。
  - title: '"真正的力量是选择不反应"'
    claim: 大众认知：强者是那些迅速回击、果断行动的人。
  - title: '"宇宙不欠你任何东西"'
    claim: 大众认知：世界应该公平，好人应该得到好报。
  takeaway: 你无法控制世界如何运转，但你可以控制自己的判断——这就是全部的自由。
