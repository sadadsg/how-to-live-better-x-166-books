  frameworks:
  - name: 创伤的三层印记模型
    core: 创伤的三层印记
  - name: 三重脑与创伤反应层级
    core: 前额叶皮层         ← 瞭望塔（控制中心）
  - name: 四种创伤生存反应
    core: ''
  - name: 发展性创伤障碍（DTD）
    core: 范德考克提出的DSM未采纳的诊断类别，描述的是长期、反复的童年创伤（而非单一事件PTSD）造成的特殊损害
  - name: 疗愈的"自下而上"层级
    core: 疗效层级（从低到高）：
  - name: 内部家庭系统（IFS）——自我碎片模型
    core: Self（真我）            ← 核心：好奇、平静、慈悲、自信
  counterintuitive:
  - title: '"创伤不是关于发生了什么，而是关于身体如何记住"'
    claim: 大众认知：创伤是"事件"——只要事件过去了，人就应该"恢复正常"。
  - title: '"你不是不想记住，你是不能记住；你不是不想忘记，你是不能忘记"'
    claim: 大众认知：创伤者可以选择"放下"或"想开"，如果放不下，是他们不够努力。
  - title: '"创伤后最危险的不是愤怒，而是麻木"'
    claim: 大众认知：创伤后的危险状态是暴怒、崩溃、歇斯底里。
  - title: '"药物不是治疗创伤，是让你能开始治疗"'
    claim: 大众认知：抗抑郁药/抗焦虑药是创伤的"治疗方案"。
  - title: '"治疗创伤最关键的不是技术，是关系"'
    claim: 大众认知：创伤疗愈需要"对症下药"——EMDR、神经反馈、药物等技术手段。
  - title: '"你的''问题行为''可能曾经是你的''生存策略''"'
    claim: 大众认知：自残、暴食、成瘾、攻击性是"病态行为"，需要被消除。
  - title: '"发展性创伤比单一事件创伤更隐蔽，也更普遍"'
    claim: 大众认知：只有经历过战争、性侵、重大灾难的人才有"真正的创伤"。
  - title: '"瑜伽不是让你放松，是让你学会感受"'
    claim: 大众认知：瑜伽是"减压运动"，是放松技巧。
  takeaway: 你不是困在过去的记忆里，你是困在过去的生理反应里——疗愈不是想通，是让身体重新学会安全。
