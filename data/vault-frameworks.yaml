- book: 世界观
  author: 大卫·多伊奇（David Deutsch，英国）
  category: 心理学与行为科学/认知科学
  file: 心理学与行为科学/认知科学/拆书笔记-《世界观》.md
  frameworks:
  - name: 解释三层次模型（最核心的认知切换）
    core: 这是多伊奇最核心的贡献
  - name: 好解释的特征
    core: 好解释的特征
  - name: 世界3模型（知识的独立存在）
    core: 世界1：物理世界（物质、能量）
  - name: 科学进步模型（如何进步）
    core: 科学进步模型
  - name: 不可思议的解释（好解释的标志）
    core: 不可思议的解释
  - name: 人是万能解释者（Universal Explainers）
    core: 是什么：多伊奇的核心论断——人是"万能解释者"。任何人类大脑能理解的解释性知识，宇宙中不存在另一个物种或"超级智能"能理解而人类原理上不能理解的东西。外星文明、人工智能与人类的差距只能是程度差距（速度、记忆、专业化），不是类型差距。
  - name: 静态社会vs动态社会（Static vs Dynamic Societies）
    core: 是什么：多伊奇对"李约瑟难题"式问题的回答：静态社会（古代绝大多数文明）不是缺少创造力，而是制度系统性地压制批评与偏离——变革被视作威胁，离经叛道者被惩罚；动态社会（如启蒙运动后的西方）则把"猜想→批评→纠错"制度化，进步从此指数级展开。
  counterintuitive:
  - title: '"科学不是收集事实"'
    claim: 大众认知：科学是收集和整理事实。
  - title: '"好的解释是''不可思议的''"'
    claim: 大众认知：好的解释应该简单明了。
  - title: '"进步来自排除错误"'
    claim: 大众认知：进步来自证实真理。
  - title: '"世界3是真实的"'
    claim: 大众认知：知识是抽象的、主观的。
  - title: '"所有知识都是猜想"'
    claim: 大众认知：有些知识是确定的。
  - title: '"解释比事实更重要"'
    claim: 大众认知：事实比解释重要。
  - title: '"停滞的社会不是缺少创造力"'
    claim: 大众认知：古代社会几千年停滞，是因为人们愚蠢、知识匮乏。
  takeaway: '**科学不是事实的积累，而是解释的进步——好的解释难以改变，却能预测新现象。'
