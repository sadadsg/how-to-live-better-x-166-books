- book: 街头生意经
  author: 诺姆·布罗茨基（Norm Brodsky，美国，连续创业者、Inc. 杂志专栏作家）；博·博林翰（Bo Burlingham，美国，合著）
  category: 创业与商业/生意实践与商业人物
  file: 创业与商业/生意实践与商业人物/拆书笔记-《街头生意经》.md
  frameworks:
  - name: 生意金字塔模型（最核心的认知切换）
    core: 这是吉尔福德最核心的贡献
  - name: 客户获取漏斗（如何获取客户）
    core: 客户获取漏斗
  - name: 定价策略框架
    core: 定价策略框架
  - name: 系统化思维（从手动到自动）
    core: 手动操作 → 标准化 → 自动化 → 系统化
  - name: 现金流管理（生命线）
    core: 收入 → 支出 → 现金余额
  - name: 增长的代价（The Cost of Growth）
    core: 是什么：布罗茨基全书最著名的警告：增长不等于健康，增长过快会杀死一家盈利的公司。 销售额增长是好事的唯一前提，是你有足够的现金和执行力去"喂养"它——否则增长越快，离破产越近，而且是以"利润表盈利"的姿态死去。
  - name: 毛利纪律（Gross Margin Discipline）
    core: 是什么：布罗茨基把毛利率称为生意的"第一道防线"：毛利决定你的容错空间——毛利不够厚，一次坏账、一次退货、一个淡季就可能致命。 与之配套的是他的另一条铁律：不打价格战，不做"只买便宜的"客户的生意。
  counterintuitive:
  - title: '"生意不是''做''出来的，是''设计''出来的"'
    claim: 大众认知：生意是做出来的，越努力越好。
  - title: '"你的时薪是最重要的指标"'
    claim: 大众认知：收入是最重要的指标。
  - title: '"系统比产品更重要"'
    claim: 大众认知：好产品是成功的关键。
  - title: '"定价不是成本问题，是价值问题"'
    claim: 大众认知：定价基于成本。
  - title: '"现金流比利润更重要"'
    claim: 大众认知：利润是最重要的。
  - title: '"客户获取比产品开发更重要"'
    claim: 大众认知：产品是最重要的。
  - title: '"增长不是奖励，是成本——增长过快会杀死公司"'
    claim: 大众认知：增长越快越好，增长就是成功的证明。
  takeaway: '**生意不是做苦力，而是建系统——让生意为你工作，而不是你为生意工作。'
