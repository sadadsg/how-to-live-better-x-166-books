- book: 英伟达的编年史和城墙
  author: 王韦华（主讲）、戴旭 等著（基于「苔藓花园」播客 E001 整理）
  category: 科技与创新/产业分析
  file: 科技与创新/产业分析/拆书笔记-《英伟达的编年史和城墙》.md
  frameworks:
  - name: 零亿美元市场（Zero Billion Dollar Market）
    core: 黄仁勋最核心的商业洞察——进入一个尚未存在的市场
  - name: 英伟达的三道城墙（Three Moats）
    core: 英伟达商业模式的护城河——为什么竞争对手难以复制
  - name: 黄仁勋的决策模型（Jensen's Decision Framework）
    core: 黄仁勋在关键时点的思维模式——为什么他能做出正确决策
  - name: 英伟达的商业模式演进
    core: 英伟达的商业模式演进
  - name: CUDA 飞轮（The CUDA Flywheel）
    core: 是什么：CUDA 不是一个产品，而是一台用十年亏损换来的"生态飞轮"机器。2006年黄仁勋决定在每一张 GeForce 消费级显卡里植入 CUDA 通用计算能力，把游戏 GPU 的巨大出货量变成通用计算的"免费安装基础"。
  - name: 城墙压力测试（Moat Stress Test）
    core: 是什么：一个动态竞争模型。城墙不是建好就不动的——每道城墙都有对应的"进攻武器"，而英伟达的护城河之所以持续有效，不是因为墙厚，而是因为补墙的速度快于挖墙的速度。
  - name: 光速组织（Speed of Light Organization）
    core: 是什么：支撑前面所有战略落地的执行机器。战略再对，如果组织以季度为单位传导信息、以部门为单位切割责任，"零亿美元市场"的窗口早就关了。英伟达的组织设计只有一个目标：让决策者的物理极限直接传导到每个员工的桌面。
  counterintuitive:
  - title: '"最成功的公司不是在现有市场中竞争，而是创造了新市场"'
    claim: 大众认知：成功 = 在现有市场中获得更大份额。
  - title: '"护城河不是一次性建立的，而是持续加深的"'
    claim: 大众认知：护城河 = 一次性的技术领先或市场优势。
  - title: '"最好的战略是让客户先成功"'
    claim: 大众认知：战略 = 让自己成功。
  - title: '"不要预测未来，要创造未来"'
    claim: 大众认知：战略 = 预测未来趋势，然后提前布局。
  - title: '"技术领先不是护城河，生态系统才是"'
    claim: 大众认知：技术领先 = 竞争优势。
  - title: '"最好的投资是投资未来，不是投资现在"'
    claim: 大众认知：投资 = 追求短期回报。
  - title: '"城墙最深的地方，恰恰是风险最集中的地方"'
    claim: 大众认知：护城河越深，公司越安全。
  takeaway: '**在零亿美元市场建立护城河，比在万亿市场中竞争更明智。'
