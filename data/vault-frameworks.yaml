- book: 天生不同
  author: '[美]伊莎贝尔·布里格斯·迈尔斯（Isabel Briggs Myers）'
  category: 心理学与行为科学/人格与动机
  file: 心理学与行为科学/人格与动机/拆书笔记-《天生不同》.md
  frameworks:
  - name: 四维人格模型（The Four Dimensions）
    core: 人格的四个基本维度，每个维度是一个二元对立
  - name: 四大气质类型（The Four Temperaments）
    core: 16种人格可以归纳为4种气质，每种气质4个类型
  - name: 人格发展阶梯（Type Development）
    core: 人格类型不是一成不变的，它会随年龄发展
  - name: 类型沟通矩阵（Type Communication Matrix）
    core: 不同类型的沟通风格完全不同
  - name: 类型与职业匹配（Type-Careers Fit）
    core: 人格类型与职业匹配
  - name: 类型与婚姻动力（Type and Marriage）
    core: 是什么：迈尔斯在原著中用夫妻样本研究类型与婚姻，结论与大众直觉相反：吸引你的是互补，留住你的是相似。 类型差异先让你"看上"一个和自己不一样的人，然后又让你们在柴米油盐里互相看不惯——婚姻经营的核心，就是分清哪些差异是引力，哪些差异是雷区。
  - name: 类型理论使用边界（The Limits of Type Theory）
    core: 是什么：类型是"偏好的概率描述"，不是"能力的判决书"。MBTI 测的是你更偏好用哪套心理功能，不预测你能力多强、行为如何、成就多大——用对是地图，用错是宿命。
  counterintuitive:
  - title: '"人格类型是天生的，不是后天培养的"'
    claim: 大众认知：人格是环境塑造的，教育可以改变一切。
  - title: '"你的缺点可能是另一种类型的优点"'
    claim: 大众认知：缺点就是需要改正的东西。
  - title: '"选错职业比不努力更可怕"'
    claim: 大众认知：只要努力，什么工作都能做好。
  - title: '"理解差异比改变差异更重要"'
    claim: 大众认知：差异是问题，需要被消除。
  - title: '"你的人格类型不是标签，是起点"'
    claim: 大众认知：MBTI测试结果就是你的全部。
  - title: '"沟通失败99%是类型不匹配，不是态度问题"'
    claim: 大众认知：沟通失败是因为对方不尊重你、不理解你。
  - title: '"测试结果是假设，不是判决"'
    claim: 大众认知：测出什么类型，我就是什么类型，一次定型，终身有效。
  takeaway: '**理解差异比改变差异重要一百倍——你的"缺点"可能只是另一种类型的"优点"。'
