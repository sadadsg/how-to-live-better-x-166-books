- book: 人性的弱点
  author: '[美]戴尔·卡耐基（Dale Carnegie，1888-1955）'
  category: 心理学与行为科学/关系与沟通
  file: 心理学与行为科学/关系与沟通/拆书笔记-《人性的弱点》.md
  frameworks:
  - name: 人际操作的三大底层原则（全书总纲）
    core: 这是全书的"宪法三条"——后续六大篇的具体技巧都是这三条的应用场景。
  - name: 六大篇的内在结构（从"基础"到"高级"到"家庭"）
    core: 全书六大篇的递进结构
  - name: 让人喜欢你的六个方式——本质是"自我中心三件套"
    core: 让人喜欢你的六方式 = 自我中心三件套
  - name: 赢得赞同的十二种方法——本质是"避开对抗 + 引导说'是'"
    core: 十二种方法的内在结构（= 避开对抗 + 引导说"是"）
  - name: 领导力四步法——本质是"先给安全感，再提建议"
    core: 改变他人的九种方法（领导力篇）= 先给安全感，再提建议
  - name: 让家庭幸福的七个法则——本质是"亲密关系比职场更难"
    core: 家庭幸福的七个法则 = 亲密关系的四大难点
  - name: 现代心理学的补丁——本书的三层"理性补全"
    core: 卡耐基原则的现代心理学基础（"理性补全"总图）
  - name: 本书的常见误读与五种边界
    core: 人性的弱点的五种常见误读 + 边界
  - name: 本书的迁移应用——可训练技能的层次模型
    core: 人际技能的四个层次（从本能到精通）
  counterintuitive:
  - title: '"争论永无赢家——即使你''赢了''，你也输了"'
    claim: 大众认知：争论 = 真理越辩越明；赢了争论 = 赢了道理。
  - title: '"真诚赞赏不是谄媚——空洞谄媚才令人反感"'
    claim: 大众认知：赞赏 = 拍马屁 = 虚伪。
  - title: '"批评让人改变行为，但破坏关系——长期看是双输"'
    claim: 大众认知：批评 = 让对方改正的有效方式。
  - title: '"记住一个人的名字，是对那个人最甜美的声音"'
    claim: 大众认知：名字只是一个代号，记不住是正常的。
  - title: '"激发他人渴望不是操控——是不浪费双方时间"'
    claim: 大众认知：激发渴望 = 操控他人 = 道德可疑。
  - title: '"提问代替命令——权力来自让人''愿意''而不是''必须''"'
    claim: 大众认知：领导力 = 决策权 + 命令权。
  - title: '"诉诸高尚动机——人们会努力达到你的高估"'
    claim: 大众认知：人们只按"自己的利益"行动。
  - title: '"对家人保持礼貌比对外人更难也更重要"'
    claim: 大众认知：家人之间不需要客气，客气反而生分。
  - title: '"避免争论——避免的不是''输''，是''失控''"'
    claim: 大众认知：避免争论 = 怯懦 = 失去立场。
  - title: '"本书最大的读者群应该是 CEO 而不是销售员"'
    claim: 大众认知：本书是"销售技巧书"。
  takeaway: '**人际关系不是表达力，是共情力；不是让人喜欢我，是让人被看见。'
