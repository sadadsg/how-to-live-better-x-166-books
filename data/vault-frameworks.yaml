- book: 一个人老后
  author: 上野千鹤子（Chizuko Ueno，日本）
  category: 生命哲学与死亡/生老与告别
  file: 生命哲学与死亡/生老与告别/拆书笔记-《一个人老后》.md
  frameworks:
  - name: 孤独 vs 独处二分模型
    core: 上野千鹤子在书中做了一个关键区分：日语中有两个词被中文都翻译成"孤独"——一个是 loneliness（寂寞），一个是 solitude（独处）。独居者的基本生活状态是"独处"，而不是"孤独"。
  - name: 自助-互助-公助三层照护体系
    core: 这是上野千鹤子老年照护研究的核心框架。晚年照护不是单一责任，而是三层协同
  - name: 单身人士五项身后准备
    core: 上野千鹤子从实际研究中提炼出的身后规划框架
  - name: 选择缘（Chosen Bonds）
    core: 上野千鹤子提出"选择缘"概念——与传统血缘、婚姻关系不同，单身人士需要主动构建的朋友网络。
  - name: 60㎡单间房居住模型
    core: 上野千鹤子借鉴北欧（特别是瑞士）的标准，推荐60㎡的单间房作为独居老人的理想户型
  - name: 现役期-准现役期-退役期三段划分
    core: 上野千鹤子反对把退休后的岁月看成一整块模糊的"晚年"。她把人从退休到离世切成三段：现役期（还能完全自理，如同仍在服役）、准现役期（尚能自理但体力明显下滑）、退役期（引退期）（需要他人照护）。关键主张：三段的边界不由年龄决定，由自理能力决定——所以要问的不是"我
  - name: 医疗现场的自主权（临终决策链设计）
    core: 独居者进入医疗现场要过三道门：知情同意（谁听医生讲真实病情）、抢救决策（延命治疗上不上）、临终地点（医院还是家）。对有家属的人，默认由家属签字；对独居者，这三道门没有默认答案——不提前设计，决策权就会自动滑落到医院流程或最疏远的亲属手里。
  counterintuitive:
  - title: '"独居老人的生活满意度最高"'
    claim: 大众认知：独居老人一定很寂寞、很不幸福。
  - title: '"孤独死不可怕，孤立才可怕"'
    claim: 大众认知：独自死去是最悲惨的结局。
  - title: '"接受照护需要的不是金钱，是勇气"'
    claim: 大众认知：养老最大的问题是钱不够。
  - title: '"机器人不能替代人来照顾老人"'
    claim: 大众认知：科技可以解决养老问题，照护机器人会越来越普及。
  - title: '"遗嘱不是为死，是为活着的自己"'
    claim: 大众认知：写遗嘱是不吉利的，等需要了再说。
  - title: '"不要把老人当小孩"'
    claim: 大众认知：老人功能衰退，需要像照顾孩子一样照顾他们。
  - title: '"临终不必等到最后一刻才见想见的人"'
    claim: 大众认知：临终前应该让所有亲人围在身边，"见到最后一面"很重要。
  takeaway: 独居不等于孤独，准备好的一个人老后，比凑合的两个人更体面。
