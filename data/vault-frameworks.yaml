- book: 赛斯书
  author: '[美] 简·罗伯茨（Jane Roberts，赛斯传导）'
  category: 灵性与意识
  file: 灵性与意识/拆书笔记-《赛斯书》.md
  frameworks:
  - name: 意识层级模型（最核心的认知切换）
    core: 这是赛斯体系的基础
  - name: 现实创造模型（信念如何塑造现实）
    core: 现实创造模型
  - name: 时间非线性模型（时间的幻觉）
    core: 时间非线性模型
  - name: 身体作为意识的创造（健康观）
    core: 身体作为意识的创造
  - name: 多重自我模型（你不止一个你）
    core: 多重自我模型
  - name: 当下是威力之点（Point of Power）
    core: 是什么：赛斯最著名的操作断言——"威力之点在当下"（《个人实相的本质》第657节：The point of power is in the present）。你无法在"过去"里改信念，也无法在"未来"里等改变；过去与未来都只是当下信念的投射物。所以一切改变动作
  - name: 梦的实相与梦工作（Dream Reality）
    core: 是什么：赛斯说"你创造一个梦的宇宙，它与物理宇宙同样真实"（《灵魂永生》《梦、进化与价值完成》）。物质事件先在梦中排练、成形，再落到白天——梦是创造的现场，不是睡眠的副产品。白天的意识负责"执行"，夜晚的意识负责"筹备"。
  counterintuitive:
  - title: '"身体是意识的创造物"'
    claim: 大众认知：身体是独立的机器，疾病是外部入侵。
  - title: '"时间是幻觉"'
    claim: 大众认知：时间是线性的，过去已逝，未来未至。
  - title: '"我们创造自己的现实"'
    claim: 大众认知：现实是给定的，我们被动接受。
  - title: '"死亡不是终点"'
    claim: 大众认知：死亡是生命的终结。
  - title: '"内在自我比自我意识更智慧"'
    claim: 大众认知：自我意识是最高智慧。
  - title: '"疾病可以被''治愈''"'
    claim: 大众认知：疾病需要外部治疗。
  - title: '"威力之点在当下，不在过去"'
    claim: 大众认知：要改变自己，必须先彻底处理过去——挖童年、算旧账，或者等未来条件成熟。
  takeaway: '**你是自己现实的创造者——改变内在信念，外在世界自动改变。'
