- book: 贪婪的多巴胺
  author: '[美]丹尼尔·利伯曼、迈克尔·E. 朗'
  category: 心理学与行为科学/幸福心理学
  file: 心理学与行为科学/幸福心理学/拆书笔记-《贪婪的多巴胺》.md
  frameworks:
  - name: 多巴胺的两副面孔——"想要"vs"拥有"
    core: '"想要"（Wanting）  ←→  "拥有"（Having）'
  - name: 多巴胺回路的四个维度
    core: 这四个回路共同构成"多巴胺系统"，不是单一功能，而是一套完整的欲望操作系统。
  - name: 当下分子 vs 多巴胺分子
    core: 当下分子            多巴胺分子
  - name: 多巴胺的"比较器"模型
    core: 多巴胺的核心功能不是"奖励"，而是比较——比较"预期"和"现实"
  - name: 多巴胺的"地盘"模型
    core: ''
  - name: 成瘾的"无限奖励"循环——当"想要"脱离"拥有"
    core: 是什么：成瘾不是"享受太多"，而是"渴望"系统被劫持后的单向运转。自然奖励（食物、社交、成就）自带饱和机制——吃饱了就不想再吃；而毒品、色情、赌博、刷手机是无限奖励，绕过饱和机制，让多巴胺回路在没有刹车的高速路上空转。原书第2章"毒品"讲的是这个机制的化学版，
  - name: 多巴胺人格光谱——探索者与秩序者
    core: 是什么：每个人多巴胺系统的"默认强度"不同。高多巴胺能人格活在抽象与可能性里——新奇、冒险、创造、坐不住；低多巴胺能（当下能）人格活在具体与现实里——秩序、传统、家庭、守成。原书用两章讲同一条光谱：个体端是天才与疯子共享机制，社会端是政治态度的神经化学梯度。
  counterintuitive:
  - title: '"多巴胺不是快乐分子，而是欲望分子"'
    claim: 大众认知：多巴胺让你快乐，所以它叫"快乐分子"。 作者/利伯曼和朗：多巴胺让你渴望，不让你快乐。你渴望的东西到手后，多巴胺立刻关闭，真正的满足来自其他神经递质。
  - title: '"爱情的消退不是悲剧，是多巴胺的正常运作"'
    claim: 大众认知：婚姻里没有激情是因为不爱了，或者选错了人。 作者/利伯曼和朗：恋爱时的激情是多巴胺制造的幻觉——它让你把对方理想化，看不到缺点。婚后多巴胺消退，你才真正看见对方。这不是失败，是爱情从多巴胺驱动转向当下分子驱动的自然过程。
  - title: '"创造力的代价是永远不满足"'
    claim: 大众认知：创造是天赋，创造者应该享受创作过程。 作者/利伯曼和朗：多巴胺驱动的创造力有一个残酷的副作用——创造者永远不满足于自己的作品。完成一件作品的那一刻，就是多巴胺离开的那一刻。这就是为什么很多艺术家在作品完成后感到空虚甚至抑郁。
  - title: '"多巴胺让你聪明，也让你疯狂"'
    claim: 大众认知：精神疾病和天才之间没有必然联系。 作者/利伯曼和朗：多巴胺水平异常高的人更容易有创造力，但也更容易有躁郁症、成瘾、偏执和妄想。历史上很多天才（梵高、特斯拉、特斯拉的特斯拉）都有精神问题——这不是巧合，是同一枚硬币的两面。
  - title: '"你的大部分欲望都不是你的"'
    claim: 大众认知：我想要什么，是我自己的选择。 作者/利伯曼和朗：多巴胺制造的欲望是自动的、无意识的。你以为你想要那辆车、那个职位、那个人，但多巴胺只是在对环境线索做出反应——广告、社交媒体、朋友圈的刺激。你的"欲望"可能根本不是你的。
  - title: '"满足感是反多巴胺的"'
    claim: 大众认知：满足感是积极的情绪，应该追求。 作者/利伯曼和朗：满足感意味着多巴胺停止工作——你不再需要追逐任何东西。对多巴胺系统来说，满足感是"敌人"，因为它意味着停止行动。这就是为什么满足感很难获得——你的多巴胺系统在抵抗它。
  - title: '"成瘾不是因为快乐太多，是因为渴望太强"'
    claim: 大众认知：成瘾者是因为享受毒品的快感才上瘾。 作者/利伯曼和朗：成瘾者的核心问题不是"享受"太多，而是"渴望"太强。多巴胺让他们对毒品产生无法控制的渴望，即使他们知道这会毁灭自己。成瘾是多巴胺劫持了大脑的动机系统。
  takeaway: 多巴胺让你追逐，不让你拥有；真正的满足，在于学会停下来享受已经到手的东西。
