- book: 当下的力量
  author: '[德]埃克哈特·托利（Eckhart Tolle）'
  category: 心理学与行为科学/心理哲学
  file: 心理学与行为科学/心理哲学/拆书笔记-《当下的力量》.md
  frameworks:
  - name: 两种存在模式（两种心态）
    core: 这是全书最核心的概念——你有两种活法
  - name: 小我（Ego）的运作机制
    core: 托利对"小我"的剖析——它是你痛苦的根源
  - name: 痛苦之身（Pain-Body）
    core: 托利对"情绪痛苦"的独特分析
  - name: 临在的三个层次
    core: 临在的三个层次
  - name: 臣服（Surrender）
    core: 托利的"臣服"不是消极放弃，是积极的接纳
  - name: 心理时间 vs 当下时间（Psychological Time vs Now）
    core: 托利把"时间"分成两种——一种是真实的（当下），一种是幻象的（心理时间）。这是原书的横向支撑轴——大部分章节都隐含这个二分，但没显式抽出。本节把它拉出来。
  - name: 恐惧的起源（The Origin of Fear）
    core: 现有"小我"和"痛苦之身"是结构层，本节讲情绪根——原书 Ch 4 整章。托利的颠覆性主张：恐惧不是来自外部威胁，是来自对当下这一刻的逃离。没有过去/未来，就没有恐惧——恐惧本身需要"心理时间"才能存在。
  - name: 关系的本质（The Purpose of Relationships）
    core: 原书 Ch 9 整章。托利最反常识的一章：关系的真正目的不是"找到爱"或"避免孤独"，是觉醒的镜子。两个小我相遇的化学反应会暴露你一个人时看不到的盲点。这是整套体系里最"非个人成长"的一章——缺了它笔记会显得只关心"自我"。
  counterintuitive:
  - title: '"你不是你的思维"'
    claim: 大众认知：我在想，所以我存在
  - title: '"思考是一种病"'
    claim: 大众认知：思考是好事，越多越好
  - title: '"痛苦来自对抗当下"'
    claim: 大众认知：痛苦来自外部事件
  - title: '"小我需要痛苦来存活"'
    claim: 大众认知：痛苦是不好的，要消除
  - title: '"行动不需要思考"'
    claim: 大众认知：先想清楚再行动
  - title: '"臣服不是放弃，是更大的力量"'
    claim: 大众认知：臣服 = 放弃、认输
  - title: '"你一直在逃避当下"'
    claim: 大众认知：我活在当下
