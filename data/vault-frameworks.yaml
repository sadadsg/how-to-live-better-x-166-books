  author: '[美] 塞德希尔·穆来纳森（Sendhil Mullainathan）/ 埃尔德·沙菲尔（Eldar Shafir）'
  category: 心理学与行为科学/认知科学
  file: 心理学与行为科学/认知科学/拆书笔记-《稀缺》.md
  frameworks:
  - name: 稀缺的隧道效应（Tunneling）
