- book: 海龟交易法则
  author: '[美]柯蒂斯·费思（Curtis Faith）'
  category: 财商与投资/交易技术
  file: 财商与投资/交易技术/拆书笔记-《海龟交易法则》.md
  frameworks:
  - name: 完整交易系统六要素模型
    core: 费思认为，一个能长期盈利的交易系统必须包含六个要素，缺一不可。大多数交易者只关注"入场"，忽略了其他五个更重要的要素。
  - name: ATR头寸管理模型——波动性标准化
    core: 这是海龟系统最核心的技术创新。用ATR（平均真实波幅，费思称之为"N"）来标准化所有市场的头寸规模，使得每个交易单位承担相同的风险金额。
  - name: 趋势跟踪系统——海龟交易规则
    core: 费思完整公开了海龟系统的交易规则，这是一套纯粹的机械趋势跟踪系统。
  - name: 期望值模型——交易系统的数学基础
    core: 费思用期望值公式解释了为什么低胜率的系统仍然可以盈利。
  - name: 系统交易者 vs 判断交易者
    core: 费思将交易者分为两种根本不同的类型，并认为大多数人天生倾向于判断交易，而这恰恰是亏损的根源。
  - name: 心理偏差陷阱矩阵
    core: 费思列出了交易者最常见的心理偏差，这些偏差是导致判断交易者失败的根本原因。
  - name: 衰落管理模型
    core: 费思认为，任何交易系统——包括最优秀的系统——都会经历衰落（回撤）。关键不是避免衰落，而是在衰落期间坚持执行。
  counterintuitive:
  - title: '"入场信号是交易系统中最不重要的部分"'
    claim: 大众认知：交易成功的关键是找到精准的入场信号——"买在最低点，卖在最高点"。
  - title: '"低胜率的系统比高胜率的系统更赚钱"'
    claim: 大众认知：好的交易系统应该有高胜率——"十次交易赢八次"才是好系统。
  - title: '"最好的交易往往是最让你不舒服的交易"'
    claim: 大众认知：好的交易应该让你感觉"对了"——有信心、有把握、舒适。
  - title: '"系统交易不是因为不够聪明，恰恰是因为太聪明了"'
    claim: 大众认知：系统交易是"笨方法"，真正的高手靠判断力和直觉。
  - title: '"交易中最重要的事是活着"'
    claim: 大众认知：交易的目的是赚钱——找到能赚钱的策略。
  - title: '"你无法预测市场，但你可以对市场做出反应"'
    claim: 大众认知：好的交易者应该能预测市场走向——"看准了再下手"。
  - title: '"衰落不是系统的失败，是系统的入场费"'
    claim: 大众认知：如果系统出现了大回撤，说明系统有问题，应该修改或放弃。
  - title: '"海龟系统的规则完全公开，但大多数人仍然用不了——因为执行比知识难100倍"'
    claim: 大众认知：如果一套交易系统真的有效，知道规则就能赚钱。
  takeaway: 交易的胜负不在你买对了什么，而在你亏错了多少次还能活着。
