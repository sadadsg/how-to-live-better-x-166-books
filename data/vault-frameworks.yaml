- book: 金刚经
  author: 释迦牟尼佛（说），鸠摩罗什（译）
  category: 哲学经典/东方哲学
  file: 哲学经典/东方哲学/拆书笔记-《金刚经》.md
  frameworks:
  - name: 三句式中道观（空-假-中）
    core: 《金刚经》最独特的思维工具是"所谓……即非……是名……"的三句式结构
  - name: 四相破执模型
    core: 四相是"我执"的四层投射结构
  - name: 无住生心操作系统
    core: 这是《金刚经》的核心修行方法论
  - name: 六度万行与无住的统一
    core: 《金刚经》不是让人消极避世，而是在积极行动中保持无住
  - name: 缘起性空本体论
    core: 现象界（假有）
  - name: 福德与功德之辨（较量模型）
    core: 《金刚经》全书约十次重复同一组对比实验（古称"较量功德"）：一边是天文数字的财布施——七宝满三千大千世界（第8分）、恒河沙数世界的七宝（第11分）、恒河沙等身命布施（第13分）、须弥山王七宝聚（第24分）；另一边只是"受持四句偈，为他人说"。每一次，佛都判后者
  - name: 一合相与不可说的整体观（碎微尘模型）
    core: 第30分（一合理相分）是一个思想实验：把三千大千世界碎为微尘。如"经云：佛说微尘众，即非微尘众，是名微尘众。如来所说三千大千世界，即非世界，是名世界"。
  counterintuitive:
  - title: '"佛法不是真理，而是工具"'
    claim: 大众认知：佛法是神圣的真理，应该虔诚信仰。
  - title: '"做善事不求回报，才是真正的善"'
    claim: 大众认知：做好事应该有好报，功德越大越好。
  - title: '"生气就是著四相"'
    claim: 大众认知：生气是正常的情绪反应，是对不公正的回应。
  - title: '"真正的''我''是不存在的"'
    claim: 大众认知：有一个真实的"我"，我的感受、想法、记忆构成了"我"。
  - title: '"不住相不等于不作为"'
    claim: 大众认知：无住就是什么都不在乎，是消极避世。
  - title: '"佛也不应该被执着"'
    claim: 大众认知：佛是最高存在，应该虔诚膜拜。
  - title: '"世界如梦幻泡影，但不否定世界"'
    claim: 大众认知：说世界是虚幻的，就是否定世界的存在价值。
  - title: '"无所得才是真正的得"'
    claim: 大众认知：修行应该有所得——得智慧、得解脱、得功德。
  takeaway: 看透执着的对象根本不存在，放下自然发生。
