- book: 自卑与超越
  author: 阿尔弗雷德·阿德勒（Alfred Adler）
  category: 心理学与行为科学/人格与动机
  file: 心理学与行为科学/人格与动机/拆书笔记-《自卑与超越》.md
  frameworks:
  - name: 自卑→补偿→超越（核心动力模型）
    core: 这是阿德勒个体心理学的发动机。全书围绕这个模型展开
  - name: 人生三大任务
    core: 阿德勒认为，人生的一切问题都可以归结为三大任务。它们不是独立的，而是互相关联的
  - name: 目的论（Teleology）——你的行为服务于你的目标
    core: 这是阿德勒与弗洛伊德的根本分歧，也是《被讨厌的勇气》的核心卖点。但本书的阐述更深刻
  - name: 社会感光谱（Social Interest Spectrum）
    core: 社会感是阿德勒衡量心理健康的唯一标准。它不是二元的"有/没有"，而是一个光谱
  - name: 家庭星座与出生顺序
    core: 阿德勒是第一个系统论述出生顺序对人格影响的心理学家
  - name: 教育——社会感的培养器
    core: 阿德勒用了大量篇幅讨论儿童教育，因为这是社会感形成的关键期
  - name: 性格即生活方式
    core: 阿德勒的"性格"概念不同于日常用法。他认为性格是一个人应对三大任务时的固定模式——也就是"生活方式"（style of life）
  - name: 爱情与婚姻的心理学
    core: 阿德勒对婚姻的分析在1931年极其超前
  counterintuitive:
  - title: '"自卑感是礼物，不是诅咒"'
    claim: 大众认知：自卑是需要被消灭的心理问题。
  - title: '"追求优越不等于追求比别人强"'
    claim: 大众认知：人类追求优越就是追求"比别人更好"。
  - title: '"最聪明的神经症患者用智力逃避人生"'
    claim: 大众认知：神经症是意志薄弱或心理脆弱的表现。
  - title: '"溺爱是对孩子最隐蔽的伤害"'
    claim: 大众认知：溺爱是爱得太深。
  - title: '"孩子的''坏习惯''不是性格缺陷，是求救信号"'
    claim: 大众认知：孩子说谎、捣乱、攻击是需要被纠正的坏行为。
  - title: '"男性优越是社会建构，不是自然事实"'
    claim: 大众认知：男性在智力和能力上天然优于女性。
  - title: '"你不幸是因为你''选择''了不幸"'
    claim: 大众认知：不幸是外在环境造成的——贫穷、创伤、运气不好。
  - title: '"合作能力是唯一需要培养的''社交技能''"'
    claim: 大众认知：社交需要学习"话术""技巧""情商"。
  takeaway: 自卑是人之常情，超越的方向才决定你是建设者还是逃避者。
