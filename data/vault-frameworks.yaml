- book: 人生的智慧
  author: 阿图尔·叔本华（Arthur Schopenhauer，德国哲学家）
  category: 哲学经典/西方哲学
  file: 哲学经典/西方哲学/拆书笔记-《人生的智慧》.md
  frameworks:
  - name: 幸福三来源模型
    core: 幸福的三大来源
  - name: 痛苦是常态——叔本华的悲观主义地基
    core: 叔本华的幸福公式：
  - name: 精神生活优于物质生活
    core: 叔本华把人的内在品质分为三个层次
  - name: 独处的智慧——叔本华论孤独与社交
    core: 独处的三重功能：
  - name: 审美静观——幸福的最高形式
    core: 叔本华认为审美（艺术欣赏）是通往幸福的最高路径
  - name: 对名声、财富、地位的系统性拆解
    core: '---'
  - name: 人生不同阶段的智慧
    core: 叔本华的人生阶段论
  - name: 框架之间的关系图
    core: 幸福三来源模型
  counterintuitive:
  - title: '"幸福不是拥有更多，而是成为更好的自己"'
    claim: 大众认知：幸福来自外部条件——钱越多、地位越高、名声越大，就越幸福。
  - title: '"人生本质上是痛苦的——这不是悲观，是清醒"'
    claim: 大众认知：人生应该追求快乐，痛苦是需要被消除的异常状态。
  - title: '"大多数人把精力花在最不重要的事情上"'
    claim: 大众认知：名声、地位、他人认可是成功的重要标志。
  - title: '"独处不是孤独，是精神自由"'
    claim: 大众认知：人是社会动物，独处是不健康的。
  - title: '"避苦比求乐更重要"'
    claim: 大众认知：追求快乐是人生的目标。
  - title: '"财富只能消除匮乏之苦，不能带来幸福"'
    claim: 大众认知：钱越多越幸福。
  - title: '"你的性格决定了你能享受什么"'
    claim: 大众认知：机会是平等的，只要给我同样的条件，我也能成功/幸福。
  takeaway: 幸福不是你拥有什么，而是你是什么样的人——减少痛苦比追求快乐更可行，独处比社交更滋养，内在比外在更可靠。
