- book: 被讨厌的勇气
  author: 岸见一郎、古贺史健
  category: 心理学与行为科学/人格与动机
  file: 心理学与行为科学/人格与动机/拆书笔记-《被讨厌的勇气》.md
  frameworks:
  - name: 目的论 vs 原因论（最核心的认知切换）
    core: 这是阿德勒和佛洛依德的根本分歧，也是整本书的地基
  - name: 课题分离（人际关系的万能手术刀）
    core: 这是阿德勒心理学最实用的工具
  - name: 人生三大课题
    core: 阿德勒认为所有人际关系都可以归为三类，每一类都是一道必须面对的考题
  - name: 共同感觉（共同体感觉）
    core: 阿德勒给出的幸福公式
  - name: 鼓励模型（阿德勒教育哲学）
    core: 传统模式                    阿德勒模式
  - name: 自我接纳三步模型（幸福的完整路径）
    core: 阿德勒认为幸福不是一个终点，是一条路径。三个步骤层层递进
  - name: 横向关系 vs 纵向关系（人际关系的基本坐标系）
    core: 阿德勒认为一切人际关系的痛苦，都来自你搞混了横向和纵向
  - name: 鼓舞性赞美 vs 竞争性赞美（语言里的权力游戏）
    core: 框架5讲了"表扬vs鼓励"，这里进一步细化——同样是"夸人"，背后的心理机制完全不同
  counterintuitive:
  - title: '"你的不幸是你自己选择的"'
    claim: 大众认知：我的问题是环境/过去/他人造成的，我身不由己。
  - title: '"一切烦恼都是人际关系的烦恼"'
    claim: 大众认知：烦恼来自钱不够、工作累、运气差。
  - title: '"不是因为你不会说话，是因为你不想被讨厌"'
    claim: 大众认知：我不善言辞、情商低、有社交恐惧。
  - title: '"自由就是被别人讨厌"'
    claim: 大众认知：自由 = 能做想做的事。
  - title: '"你不是为了满足别人的期待而活"'
    claim: 大众认知：我要让父母满意、让伴侣骄傲、让同事认可。
  - title: '"人生不是一条线，是一连串的刹那"'
    claim: 大众认知：人生有目标，我要到达某个终点才算成功。
  - title: '"竞争是最大的幻觉"'
    claim: 大众认知：别人成功意味着我失败，我要赢。
  - title: '"改变的悖论：你不想改变"'
    claim: 大众认知：我想改变，但我做不到。
  - title: '"问题行为的五个阶段"'
    claim: 大众认知：孩子/员工/伴侣"不听话"是态度问题。
  takeaway: '**你不需要被所有人喜欢，你需要的是接受有些人不喜欢你的勇气。'
