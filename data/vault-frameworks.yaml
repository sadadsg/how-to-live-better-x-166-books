- book: 地下室手记
  author: 陀思妥耶夫斯基（Fyodor Dostoevsky，俄罗斯；原文名：Записки из подполья）
  category: 哲学经典/西方哲学
  file: 哲学经典/西方哲学/拆书笔记-《地下室手记》.md
  frameworks:
  - name: 二二得四 vs 二二得五（核心模型）
    core: 这是全书最锋利的一对概念。它不是数学题，而是对"人是理性生物"这一假设的挑战。
  - name: 水晶宫隐喻
    core: 水晶宫（Хрустальный дворец） 是陀氏反复使用的乌托邦意象，源自 1851 年伦敦万国工业博览会真实存在的建筑——一个玻璃钢铁的奇迹，象征人类理性与技术的终极胜利。
  - name: 理性利己的四步滑坡批判
    core: 框架衍生｜陀氏攻击的主要对象是俄国 1860 年代"理性利己派"（разумный эгоизм），其代表人物包括车尔尼雪夫斯基（著《怎么办》1863）、皮萨列夫、杜勃罗留波夫。陀氏假想了一个"理性利己派先生"（以下简称"理性先生"），逐步拆解他的论证。
  - name: 主动受苦（страдание）的悖论
    core: 这是全书最违反现代人本能的论点，也是地下室人人格的核心。
  - name: 地下室人的四重自觉循环（Part II 核心模型）
    core: Part II 把 Part I 的哲学论证演给你看——地下室人不是抽象概念，是一个具体的"过度意识型"人格，他的命运就是这四步循环。
  - name: 三幕主动失败（Part II 叙事结构）
    core: Part II 的三幕故事——军官对峙、同学叙旧、丽莎告别——每次都是地下室人主动失败的策略。
  - name: 回忆作为自我重写机制
    core: 地下室人最独特的现象：他活在"回忆"里，但他的回忆不是历史，而是反复重写的自我剧本。
  counterintuitive:
  - title: '"人最顽固的愿望，是按自己的意志行事，哪怕违反利益最优"'
    claim: 大众认知：人是理性的，理性人追求利益最大化，行为可预测，社会工程可以基于此设计。
  - title: '"过度意识是行动的天然杀手"'
    claim: 大众认知：越清醒越好，越能预见后果越好，所以"想清楚再做"是金科玉律。
  - title: '"乌托邦最危险的不是做不到，而是做得到"'
    claim: 大众认知：乌托邦是人类的理想，值得追求；做不到是因为条件不足，做到了就是胜利。
  - title: '"主动失败是被动成功的自由形态"'
    claim: 大众认知：成功是好的，失败是坏的；主动选择失败是"非理性"。
  - title: '"回忆不是历史，而是反复重写的自我剧本"'
    claim: 大众认知：回忆是对过去事件的提取，提取得越准确越好。
  - title: '"人是牙齿和舌头：咬得越狠，伤的是自己"'
    claim: 大众认知：攻击别人是自我保护，攻击越有力越安全。
  - title: '"理性利己的最大悖论：越算计，越痛苦"'
    claim: 大众认知：理性利己让决策最优，最优带来幸福。
  takeaway: '**把人简化成公式，是对自由最大的亵渎。'
