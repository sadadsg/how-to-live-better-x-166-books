    claim: 大众认知：学更多知识=变得更好。
  - title: '"最小行动比宏大计划更有效"'
    claim: 大众认知：要做就做大的，小打小闹没意义。
  takeaway: '**夺回大脑控制权的唯一方法，是先看见它在怎么运作。'
