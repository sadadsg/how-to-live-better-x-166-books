  - 当下的力量
- book: 梦的解析
  author: '[奥]西格蒙德·弗洛伊德（Sigmund Freud）'
  category: 心理学与行为科学/创伤与疗愈
  file: 心理学与行为科学/创伤与疗愈/拆书笔记-《梦的解析》.md
  frameworks:
  - name: 梦的结构模型（Manifest vs. Latent Content）
    core: 梦有两个层次——你记住的那个，和你真正想说的那个。
  - name: 梦的四大加工机制（Dream Work）
    core: 无意识如何把一个被禁止的愿望变成一个看起来无害的梦？通过四种加工
  - name: 梦的审查机制（Censorship Model）
    core: 为什么梦不直接说"我想XXX"？因为有一个内在审查员。
  - name: 愿望满足理论（Wish Fulfillment Theory）
    core: 所有梦都是愿望满足——包括噩梦。
  - name: 梦的意义地图（Dream Interpretation Method）
    core: 弗洛伊德的解梦方法不是"梦见蛇就是XXX"的符号词典。他的方法是
  - name: 梦的心理拓扑学（Psychic Topology）
    core: 弗洛伊德用一个空间模型来描述精神结构——
  counterintuitive:
  - title: '"梦不是随机噪音，而是精心编码的信息"'
    claim: 大众认知：梦是大脑在整理信息时产生的"副产品"，没有意义，不值得关注。
  - title: '"你越觉得一个梦''无聊''，它可能越重要"'
    claim: 大众认知：精彩的梦（飞翔、冒险、奇幻）值得分析，无聊的梦（日常琐事、买东西、走路）没什么意义。
  - title: '"遗忘梦境是无意识的主动行为，不是记忆缺陷"'
    claim: 大众认知：人醒来后忘记梦是正常的——就像忘记其他短期记忆一样，只是大脑选择性保留信息。
  - title: '"噩梦不是敌人，而是无意识最努力的求救信号"'
    claim: 大众认知：噩梦是恐怖的、有害的，应该被压制或忽略。反复做噩梦说明"心理有问题"。
  - title: '"你的梦中人物往往不是他们自己"'
    claim: 大众认知：梦见某人就是关于那个人——梦见母亲就是想母亲，梦见老师就是关于学习。
  - title: '"儿童的梦比成人诚实得多"'
    claim: 大众认知：儿童的梦简单、天真，成人的梦复杂、深刻。
  - title: '"白日梦和夜间梦是同一个引擎的产物"'
    claim: 大众认知：白日梦（走神、幻想、做白日梦）和真正的梦完全不同——一个是清醒时的胡思乱想，一个是睡眠中的大脑活动。
  - title: '"梦中的''遗忘''和''记错''是故意的信息隐藏"'
    claim: 大众认知：梦中经常出现"找不到东西""忘记要去哪里""认错人"，这只是梦的混乱性。
  takeaway: 你做的每一个梦都是你最不敢承认的自己写给你的一封信——问题是你愿不愿意拆开它。
