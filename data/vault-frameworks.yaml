    claim: 大众认知：设好止损等着就行，给行情多一点时间。
  - title: '"交易规则比交易技巧重要100倍"'
    claim: 大众认知：学习更多技术指标和分析方法就能赚钱。
  - title: '"最好的交易是不做交易"'
    claim: 大众认知：多交易才能多赚钱。
  - title: '"盈利窗口关闭后，最聪明的做法是休息"'
    claim: 大众认知：赚了钱应该趁热打铁，继续交易。
  - title: '"赚快钱，弊大于利"'
    claim: 大众认知：快速翻倍是能力的证明，越早暴富越好。
  - title: '"亏钱埋怨别人，是最幼稚的行为"'
    claim: 大众认知：亏钱是因为庄家操纵、专家误导、运气太差。
