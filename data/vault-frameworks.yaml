- book: 理想国
  author: '[希腊]柏拉图 (Πλάτων, Plato)'
  category: 哲学经典/西方哲学
  file: 哲学经典/西方哲学/拆书笔记-《理想国》.md
  frameworks:
  - name: 灵魂三分模型（Tripartite Soul）
    core: 灵魂 (Psyche)
  - name: 城邦-灵魂同构（City-Soul Analogy）
    core: 柏拉图的推理策略是"放大法"——先在一个更大的对象（城邦）中看清正义的模样，再把它映射到更小的对象（个人灵魂）上
  - name: 四个退化政体循环
    core: 贵族政体 (Aristocracy)
  - name: 四个认知层级（Line Analogy / 线段比喻）
    core: ║ 可知世界 (Noesis)
  - name: 理念论与"是"与"似是而非"之辨
    core: 理念 (Idea/Form)           现象 (Particular)
  - name: 洞穴隐喻——转向、上升与返回的完整过程（Cave Allegory）
    core: 与框架四的分工：线段比喻是认知层级的静态地图（每一层是什么），洞穴隐喻是灵魂在层级之间移动的动态路线（如何被转向、如何上升、为什么必须返回）——框架五只借洞穴引出太阳（善的理念），这里展开全过程。
  - name: 厄尔神话与灵魂选择（Myth of Er）
    core: 与框架三的分工：框架三解释一个灵魂在此生如何退化（政体是灵魂病的外化），厄尔神话解释灵魂在两生之间如何自主挑选下一生——退化靠惯性，选择靠清醒，两者共享同一条灵魂因果链。
  counterintuitive:
  - title: '"知道得最多的人不应该掌权，而应该统治"'
    claim: 大众认知：哲学家/知识分子不接地气，应该让"有经验的人"或"多数人选出来的人"管理社会。
  - title: '"正义的人就是不正义的人更幸福的，即使后者拥有所有外在优势"'
    claim: 大众认知：如果一个作恶者聪明、富有、有权力，而且从不被抓住，那他比正直但倒霉的人更幸福。
  - title: '"民主是通往暴政的桥梁"'
    claim: 大众认知：民主是最自由的政体，自由是最高的善。
  - title: '"教育不是知识灌输，而是灵魂的转向"'
    claim: 大众认知：教育是把知识从老师传递到学生——老师知道，学生不知道，教就是了。
  - title: '"统治者应该没有私人财产和私人家庭"'
    claim: 大众认知：要求统治者放弃财产和家庭是反人性的、乌托邦的、不可行的。
  - title: '"大多数人追求的所谓''自由''，其实是欲望的奴隶状态"'
    claim: 大众认知：自由 = 做自己想做的事。想做什么就做什么，就是自由。
  - title: '"责任在选择者，神不参与——你过成什么样，主要是你选的"'
    claim: 大众认知：性格来自基因，处境来自环境，选择受制于运气——我变成今天这样，主要不怪我。
  takeaway: '**正义不是"对别人做什么"，而是"你的灵魂内部是谁在统治"——让正确的人做正确的事，从你的灵魂开始。'
