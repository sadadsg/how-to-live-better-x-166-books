- book: 一生
  author: 居伊·德·莫泊桑（Guy de Maupassant，法国）
  category: 生命哲学与死亡/文学人生
  file: 生命哲学与死亡/文学人生/拆书笔记-《一生》.md
  frameworks:
  - name: 幻灭弧光（The Arc of Disillusionment）
    core: 约娜的人生轨迹揭示了一个普遍模式：期望越高，幻灭越深。
  - name: 时间侵蚀模型（Time Erosion Model）
    core: 莫泊桑用了大量笔墨描写时间的流逝——不是戏剧性的事件，而是日复一日的磨损。
  - name: 期望-现实落差模型（Expectation-Reality Gap）
    core: 约娜的悲剧可以用一个简单的公式概括
  - name: 依附-觉醒模型（Dependence-Awakening Model）
    core: 依附的三种形式
  - name: 莫泊桑的"人生切片"叙事法
    core: 莫泊桑不写戏剧性的高潮，他写的是日常的磨损。
  - name: 罗莎莉对照组（The Rosalie Control Group）
    core: 莫泊桑在书里埋了一个天然实验：约娜和罗莎莉，一个贵族小姐、一个贴身女仆，先后被同一个男人——于连——伤害。约娜用余生的岁月反刍这场背叛；罗莎莉被解雇后转身嫁人、生子、持家，把日子一年年过扎实了。到小说结尾，贵族成了被照顾者，女仆成了当家人与支柱——社会等级反转
  - name: 空间收缩叙事（The Shrinking Estate Model）
    core: 莫泊桑用一座庄园写完一个人的一生。小说从春天开始：十七岁的约娜走出修道院，穿过诺曼底乡野奔向白杨山庄，满眼辽阔；后半程掉头：父母相继离世，房间一间间空下来；最后她被迫变卖白杨山庄替保尔还债，搬进狭小的小隐修院，身边只剩罗莎莉和襁褓中的婴儿。空间从辽阔到逼仄的收
  counterintuitive:
  - title: '"幸福的追求本身就是不幸的根源"'
    claim: 大众认知：追求幸福是人生的正当目标，越多越好。
  - title: '"婚姻不是爱情的延续，是幻觉的开始"'
    claim: 大众认知：婚姻是爱情修成正果的标志。
  - title: '"对孩子最大的爱是不把期望投射在他们身上"'
    claim: 大众认知：爱孩子就是为他们付出一切，期望他们过得好。
  - title: '"最平静的人往往是期望最低的人"'
    claim: 大众认知：有追求、有期望的人生才有意义。
  - title: '"人生的真相是：你不会得到你应得的"'
    claim: 大众认知：好人有好报，努力会有回报。
  - title: '"衰老不是惩罚，是最后一次觉醒的机会"'
    claim: 大众认知：衰老是丧失，是下降，是应该恐惧的事。 参见：[[拆书笔记-《一个人老后》]] — 上野千鹤子说"独居不等于孤独"，莫泊桑说"衰老不等于不幸"。两位作者从不同角度揭示了同一个真相：**人生的最后阶段不是丧失的阶段，是自由的阶段——当你不再需要为任何人、任何期望而活时，你第一次真正为自己而活。**
  - title: '"全书最清醒的人，是那个不识字的女仆"'
    claim: 大众认知：认知升级靠读书、学历、阶层跃升——教育越多，看得越清。
  takeaway: 期望是幻觉的种子，幻灭是觉醒的土壤——约娜用一生证明：平静比幸福更真实。
