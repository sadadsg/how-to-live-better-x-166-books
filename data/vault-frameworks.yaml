  author: 理查德·塞勒（Richard H. Thaler，美国）
  category: 心理学与行为科学/行为设计
  file: 心理学与行为科学/行为设计/拆书笔记-《错误的行为》.md
  frameworks:
  - name: 双系统思维模型（最核心的认知切换）
    core: 这是丹尼尔·卡尼曼和塞勒共同构建的地基
  - name: 心理账户（金钱的非理性分类）
    core: 这是塞勒最原创的贡献
  - name: 损失厌恶（损失是收益的2倍）
    core: 这是塞勒和卡尼曼最重要的发现之一
  - name: 禀赋效应（高估自己拥有的东西）
    core: 拥有前评价：100元
  - name: 锚定效应（初始数字的影响）
    core: 初始数字（锚点） → 调整不足 → 最终判断偏向锚点
  - name: 框架效应（表述方式改变选择）
    core: 问题表述方式 → 影响选择
  - name: 交易效用——你同时买了商品和"划算感"
    core: 每笔消费的双重账单（第2章：机会成本和禀赋效应）
  - name: 沉没成本——心理账户的结账机制
    core: 第8章：沉没成本谬误
  - name: 计划者-执行者——自我控制的两个人格
    core: 第三部分：自我控制（1975-1988）
  - name: 公平博弈——社会规范给市场划的上限
    core: 第14-15章：怎样才算公平？
  - name: 行为金融学与狭窄框架——市场也是人的
    core: 后段：把偏差带进市场
  counterintuitive:
  - title: '"理性假设是错的"'
    claim: 大众认知：人是理性的，会做出最优决策。
  - title: '"专家也会犯同样错误"'
    claim: 大众认知：基金经理、医生、法官是专业决策者，应该更理性。
  - title: '"免费的东西最贵"'
    claim: 大众认知：免费就是省钱。
  - title: '"损失厌恶不是弱点"'
    claim: 大众认知：损失厌恶是认知偏差，需要克服。
  - title: '"选择架构比教育更有效"'
    claim: 大众认知：要让人做正确选择，需要教育他们。
  - title: '"心理账户不是非理性"'
    claim: 大众认知：心理账户是非理性的，需要纠正。
  - title: '"你买的不只是商品，还有''划算感''——而划算感可以单独定价"'
    claim: 大众认知：买东西看的是"值不值"，划算只是省钱的结果。
  - title: '"懂经济学的人也会把自助餐吃撑——沉没成本不是道理问题，是账户问题"'
    claim: 大众认知：懂"沉没成本不是成本"的人就不会犯这个错误。
  - title: '"行为经济学不是''推翻''经济学，是把经济学拉回正轨——科学进步靠收集反常"'
    claim: 大众认知：新理论登场就是要推翻旧理论，行为经济学是"理性人假设的葬礼"。
  takeaway: '**人不是理性人，而是"可预测的非理性人"——理解这一点，就能设计更好的选择。'
