    core: 1. 财务知识（看懂钱的语言）
  - name: 老鼠赛跑与逃逸判定式
    core: 与现有框架2的分工：框架2给出资产/负债的静态定义（钱往哪流），本框架给出动态循环——中产为什么在同一个圈里越跑越累，以及"离开跑道"的物理判定式。框架2回答"什么算资产"，框架5回答"为什么你一直在买负债还停不下来"。
