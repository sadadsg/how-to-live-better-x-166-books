- book: 战后日本经济史
  author: 野口悠纪雄（Yukio Noguchi，日本）
  category: 历史与政治/经济史与国运兴衰
  file: 历史与政治/经济史与国运兴衰/拆书笔记-《战后日本经济史》.md
  frameworks:
  - name: 日本经济的"四阶段模型"（Four Stages of Japanese Economy）
    core: 日本战后经济的完整生命周期——从废墟到巅峰，再到幻灭
  - name: 日本的"三大制度枷锁"（Three Institutional Shackles）
    core: 战后日本经济制度从"优势"变"枷锁"的过程
  - name: 资产负债表衰退（Balance Sheet Recession）
    core: 野口悠纪雄（和辜朝明）解释日本"失去的三十年"的核心概念
  - name: 日本 vs 美国——两种"自我革新"路径
    core: 为什么美国能从危机中复苏，而日本不能——制度弹性的差异
  - name: '1940年体制的诞生与传递链（The 1940 System: Birth and Transmission）'
    core: 与现有框架2的分工：框架2讲三大枷锁"如何从优势变成枷锁"（表现层），本框架讲这套枷锁"从哪里来、如何穿越战败存活下来"（制度传递链）——枷锁是果，传递链是因。
  - name: 高速增长引擎拆解（Engine of the High-Growth Era）
    core: 与现有框架1的分工：框架1是全周期时间线，其阶段2只给出了引擎的名词清单；本框架把引擎拆开看内部结构——以及为什么这套引擎注定只能烧一次。
  - name: 泡沫的生成与破裂传导链（Anatomy of the Bubble）
    core: 与现有框架1/框架3的分工：框架1的阶段3只是泡沫速写，框架3讲泡沫破裂"之后"的衰退机制；本框架补上中间环节——泡沫"之前"如何生成、"破裂瞬间"如何传导，它是框架5（体制）通向框架3（衰退）的桥。
  counterintuitive:
  - title: '"日本经济崩溃不是因为''泡沫''，而是因为''制度没变''"'
    claim: 大众认知：日本经济崩溃是因为泡沫破了。 作者/野口悠纪雄：泡沫只是导火索，真正的炸药是"制度疲劳"——战后建立的那套制度（主银行制、终身雇佣、护送船团）在环境变化后变成了枷锁。即使没有泡沫，这套制度也会出问题。
  - title: '"终身雇佣在增长期是美德，在衰退期是毒药"'
    claim: 大众认知：终身雇佣是好制度——员工忠诚，企业稳定。 作者/野口悠纪雄：终身雇佣在"追赶型经济"中极其有效（员工有安全感，愿意学习专用技能）。但在"成熟型经济"中，它变成枷锁——企业养着大量"用不上"的人，成本上升，利润下降，更不敢创新。
  - title: '"刺激在''资产负债表衰退''时无效——因为没人想借钱"'
    claim: 大众认知：经济不好就降息刺激，经济就会复苏。 作者/野口悠纪雄：当所有人都在还债时，降息没用——即使利率降到0%，也没人愿意借钱。这时候需要的不是"货币政策"，而是"财政政策"（政府花钱补需求）。
  - title: '"保护银行不等于保护金融系统——有时候让弱者倒闭才是保护"'
    claim: 大众认知：银行倒闭会导致金融危机，所以应该保护所有银行。 作者/野口悠纪雄：日本的"护送船团"制度保护了所有银行，结果是"僵尸银行"遍地——它们不倒闭，但也不放贷，资源被锁死。美国让雷曼兄弟倒闭，结果是资源快速重新配置，5年内复苏。
  - title: '"日本的''失去的三十年''不是''运气不好''，而是''选择的结果''"'
    claim: 大众认知：日本运气不好，遇到了泡沫崩溃。 作者/野口悠纪雄：日本的"失去的三十年"是"选择的结果"——既得利益者（银行、大企业、官僚）选择"保护自己"而不是"改革制度"。他们选择了"让僵尸续命"而不是"让资源流动"。
  - title: '"人口危机不是''遥远的未来''，而是''正在发生的现在''"'
    claim: 大众认知：少子化是几十年后的问题，不用着急。 作者/野口悠纪雄：日本的少子化从1970年代就开始了，但政府一直"等等看"——等到2000年代才真正重视，已经晚了。人口变化有30年的"时滞"——今天出生的人数，决定30年后的劳动力市场。
  - title: '"广场协议不是泡沫元凶——''日本被美国搞垮''是流传最广的误读"'
    claim: 大众认知：1985年广场协议强迫日元升值，摧毁了日本出口，是美国精心策划的阴谋——日本"失去的三十年"是被美国搞垮的。 作者/野口悠纪雄：广场协议只是诱因。德国马克同期同样大幅升值，德国并没有陷入泡沫和萧条。真正的差别在于：日本央行把升值冲击当成萧条来治（超低利率维持过久），加上1940年体制残余的金融结构（护送船团、主银行、土地神话）提供了燃料。泡沫的病根在国内体制，不在华盛顿。
  takeaway: 任何成功的制度都有保质期——当环境变了而制度不变，曾经的优势就会变成最大的负担。
