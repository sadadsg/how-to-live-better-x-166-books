- book: 一本书读懂财报
  author: 肖星（中国）
  category: 财商与投资/财务分析与财报解读
  file: 财商与投资/财务分析与财报解读/拆书笔记-《一本书读懂财报》.md
  frameworks:
  - name: 会计是艺术——数字背后的判断与选择（引言）
    core: 开篇故事：一家公司用价值3000万的房子抵掉1.6亿银行欠债，
  - name: 照相机与摄像机——两张主表的时点与时差
    core: 资产负债表 = 照相机（时点概念）
  - name: 资产就是明天的费用（第2章）
    core: 资产与费用的共同点：都得花钱
  - name: 三件事模型——企业的全部活动（贯穿全书）
    core: 在会计眼中，企业一辈子只做三件事：
  - name: 三张表的分工——收益视角vs风险视角
    core: 收益视角（资产负债表＋利润表）
  - name: 财务分析方法体系（活用三张表）
    core: 第一层：同型分析（结构分析）
  - name: 影响财务数据的三因素（行业/战略/执行）
    core: 为什么两家公司的财务数据千差万别？
  - name: 好企业标准链——从净利润到经济利润
    core: 判定链条（层层递进）：
  - name: 税盾效应——借钱反而省税（好公司篇）
    core: A、B两家公司其他条件相同，A多借了100元债务：
  - name: 杜邦分解——股东回报从哪里来
    core: 净资产报酬率 ROE ＝ 总资产报酬率 × 权益乘数
  - name: 八种现金流组合诊断法（控制风险篇）
    core: 经营/投资/筹资三类现金流的正负组合 = 企业生命周期的X光片
  - name: 利润vs现金流的重要性判定律（全书压轴）
    core: 什么时候看利润，什么时候看现金流？
  counterintuitive:
  - title: '"会计不是科学，是艺术"'
    claim: 大众认知：会计是精确的科学，报表上的数字就是企业的真相。
  - title: '"资产就是明天的费用"'
    claim: 大众认知：资产是好东西，费用是坏东西，两者性质相反。
  - title: '"收购中，负债比资产更危险"'
    claim: 大众认知：收购最怕买到贬值资产，资产虚高是最大风险。
  - title: '"净利润大于0的公司，可能根本没赚钱"'
    claim: 大众认知：只要报表上有净利润，企业就是在赚钱。
  - title: '"银行最爱看的不是抵押物，而是现金流量表"'
    claim: 大众认知：贷款主要看资产负债表——家底厚、抵押足就能借到钱。
  - title: '"借钱反而可能省税——税盾效应"'
    claim: 大众认知：负债越少越好，利息是纯粹的负担。
  - title: '"提高股东回报的根本，不是加杠杆"'
    claim: 大众认知：ROE=净资产报酬率，加杠杆提高权益乘数就能让股东回报飙升。
  - title: '"利润和现金流哪个重要？没有标准答案"'
    claim: 大众认知：要么"利润至上"，要么"现金为王"，总有一个是真理。
  takeaway: 报表是艺术不是真相——效益乘以效率算能力，经济利润定好坏，现金流组合判生死。
