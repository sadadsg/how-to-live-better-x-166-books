    claim: 大众认知：我留着这些东西是因为珍惜回忆、不想浪费。
  - title: '"舍≠弃，扔东西也有两种方式"'
    claim: 大众认知：扔东西就是把不要的东西丢进垃圾桶。
  - title: '"俯瞰≠抽离，站在高处是为了更好地落地"'
    claim: 大众认知：看问题要保持距离、保持客观。
  - title: '"整理房间不是家务，是在给内心做SPA"'
    claim: 大众认知：整理是体力活，是浪费时间。
  - title: '"信息断舍离比物品断舍离更紧迫"'
    claim: 大众认知：信息越多越安全，知识越丰富越好。
  - title: '"断舍离不是清简生活，是丰盛生活"'
    claim: 大众认知：断舍离 = 极简 = 什么都没有 = 清苦。
  - title: '"扔掉父母灌输的观念，也是一种断舍离"'
    claim: 大众认知：父母说的都是对的，要听话。
  - title: '"自在力=能俯瞰也能落地，能放手也能拿起"'
    claim: 大众认知：自在就是什么都不在乎、什么都无所谓。
  takeaway: 断舍离不是扔东西，是扔掉那个被物品、执念和他人期待淹没的自己——腾出空间，让真正的你浮出水面。
