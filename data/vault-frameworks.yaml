- book: 金融经济学二十五讲
  author: 徐高（北京大学国家发展研究院兼职研究员；光大证券资产管理首席经济学家）
  category: 经济学与社会/经济学理论
  file: 经济学与社会/经济学理论/拆书笔记-《金融经济学二十五讲》.md
  frameworks:
  - name: 风险定价的统一视角——随机折现因子（SDF）
    core: 任何资产的现值 = E[m(x) · cf]，其中 m(x) 是 SDF，cf 是未来现金流。SDF 是市场对每个"未来状态"打的边际价格——稀缺状态贵、富足状态便宜。CAPM、CCAPM、APT、Black-Scholes 都是 SDF 的不同估计形式。
  - name: 均值-方差前沿与 CAPM
    core: Markowitz 均值-方差最优化给出有效前沿；引入无风险资产后，所有投资者都选择"无风险资产 + 切点组合"的线性组合。CAPM 公式
  - name: 跨期消费资产定价（CCAPM）
    core: CAPM 用市场组合做 SDF 的"代理变量"，但问题是：为什么长期投资要承担更高风险？CCAPM（Lucas 1978）用消费增长替代市场组合
  - name: 无套利定价原理
    core: 一价定律（Law of One Price）：相同现金流的资产必同价。一旦违反，套利者会买便宜的卖贵的，直到价差消失。
  - name: 因子模型（APT）与多因子定价
    core: Ross(1976) 的 APT（套利定价理论）：如果收益由 K 个因子线性生成，且无套利，那么 N 个资产的协方差矩阵秩 ≤ K
  - name: 金融摩擦——无摩擦模型的现实修正
    core: 前三部分（均衡+无套利）都建立在"无摩擦"假设上：完全信息、零交易成本、无限借贷。但金融摩擦才是常态，不是例外。
  counterintuitive:
  - title: '"CAPM 不是''高风险高收益''——它恰恰说只有系统性风险才被定价，特质风险可被分散"'
    claim: 大众认知：高风险股票就该回报高。
  - title: '"无套利≠无风险——2008 年 LTCM 破产就是经典反例"'
    claim: 大众认知：套利是"无风险赚钱"。
  - title: '"Black-Scholes 不是用''预测股价''定价，而是用''动态复制组合''倒推"'
    claim: 大众认知：BS 用历史波动率"猜"期权价。
  - title: '"金融摩擦不是''理论瑕疵''——它是 2008 危机的核心，''无摩擦模型''是工程师的简化"'
    claim: 大众认知：理论模型该跟现实一致，否则模型错。
  - title: '"SDF 是资产定价的''圣杯''——CAPM/CCAPM/APT/BS 本质上都在估算同一个东西"'
    claim: 大众认知：CAPM、APT、Black-Scholes 是不同的模型。
  - title: '"市场组合在 CAPM 里是''上帝视角''——理论上关键但现实中无法观测"'
    claim: 大众认知：CAPM 可以直接检验——找市场组合算 β。
  - title: '"风险厌恶系数的经济意义：决定你愿为''稳赚 1 元''放弃多少期望收益"'
    claim: 大众认知：风险厌恶是性格问题。
  - title: '"期望效用理论有反例（圣彼得堡悖论）——它不完美但仍是金融学的''操作系统''"'
    claim: 大众认知：理性人假设是错的，所以期望效用失效。
  takeaway: '**"金融学的统一语言是''为风险定价''——所有模型都在估算同一个东西：随机折现因子（SDF），即市场对每个''明天''打的''价格''。"'
