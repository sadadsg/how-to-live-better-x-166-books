  counterintuitive:
  - title: '"你的直觉大部分时候不是直觉，是系统1在偷懒"'
    claim: 大众认知：直觉是经验积累的结果，直觉准的人值得信赖。
  - title: '"你对自己的预测有多自信，和你的预测有多准，几乎没关系"'
    claim: 大众认知：越自信的预测，准确率越高。
  - title: '"失去100元的痛苦≈得到200元的快乐"'
    claim: 大众认知：损失和收益是对称的，亏100元痛，赚100元乐。
  - title: '"经验自我做不了决定——决定权在记忆自我手里"'
    claim: 大众认知：一个人的决策基于他全部的经历。
  - title: '"你的大脑喜欢偷懒——认知紧张是唯一能让它工作的办法"'
    claim: 大众认知：疲劳的时候"跟着感觉走"反而更好，因为想太多会让人犹豫。
  - title: '"你选择的信息，不是你想看的——是你已经相信的"'
    claim: 大众认知：我根据事实做判断，事实就在那里。
  - title: '"幸福不是你想要的那样——但聚焦错觉让你觉得它是"'
    claim: 大众认知：如果我能换工作/换城市/换伴侣，我就会幸福。
  - title: '"你不知道自己不知道什么——信息越少，故事反而越圆"'
    claim: 大众认知：信息不全时，人会保守地说"我不确定"。
  - title: '"小样本的惊人结果，多半是噪音而不是发现"'
    claim: 大众认知：小样本出了惊人结果，说明背后很可能有真效应。
  - title: '"诺贝尔奖得主的书，也有一章''被撤销的科学''——作者本人承认了"'
    claim: 大众认知：诺奖级学者的著作，每个结论都经过严格检验，可以放心引用。
  takeaway: '**你远没有自己以为的那么理性——承认这一点是真正理性的起点。'
