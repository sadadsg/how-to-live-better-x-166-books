- book: 向上生长
  author: 九边（刘朝阳，中国）
  category: 个人效能与习惯/认知与学习
  file: 个人效能与习惯/认知与学习/拆书笔记-《向上生长》.md
  frameworks:
  - name: 熵增定律——向上生长的物理学基础
    core: 熵 增 定 律 与 个 人 成 长
  - name: 复利曲线——成长的非线性爆发
    core: ╱     ← 拐点之后：指数级增长
  - name: 低水平勤奋 vs 有效努力
    core: 低水平勤奋（假努力）         有效努力（真成长）
  - name: 十年法则——精通的时间成本
    core: 十 年 法 则
  - name: 延迟满足 vs 即时满足
    core: 即时满足的陷阱：              延迟满足的回报：
  - name: 认知层级——不同层次看到不同的世界
    core: 认 知 层 级 模 型
  - name: 非对称机会——投入有限，回报无限
    core: 非 对 称 机 会 模 型
  - name: 概率思维——用次数对抗不确定性
    core: 概 率 思 维
  counterintuitive:
  - title: '"懒不是道德缺陷，是物理学定律"'
    claim: 大众认知：懒是性格缺点，需要靠意志力克服。 作者/九边：懒是热力学第二定律的体现——一切系统天然趋向最低能量状态。你的大脑天生在"节能模式"下运行。对抗懒的方法不是自责（那消耗更多能量），而是**设计环境**——让好行为更容易发生，让坏行为更难发生。
  - title: '"大多数人不是能力不够，是提前退场了"'
    claim: 大众认知：成功的人比失败的人更有能力或更聪明。 作者/九边：大多数人的失败不是因为能力不够，而是因为他们在复利曲线的拐点之前就放弃了。拐点之前的回报几乎为零——你看起来和3年前一样。但如果你再坚持一下，拐点之后的增长是指数级的。
  - title: '"选择比努力重要，但没有努力就没有选择"'
    claim: 大众认知：选择比努力重要，所以我要花时间做正确的选择。 作者/九边：选择确实比努力重要，但**选择的能力本身就来自持续的努力和积累**。一个不读书、不学习、不社交的人，他的"选择空间"极其有限——他看不到选项，自然做不出好选择。
  - title: '"低水平勤奋比不努力更危险"'
    claim: 大众认知：有努力总比没努力好。 作者/九边：低水平勤奋（在舒适区内重复做已经会的事）比不努力更危险——因为它给了你一个"我在努力"的幻觉，但实际上你没有成长。更糟糕的是，它消耗了你本可以用来做有效努力的时间和精力。
  - title: '"运气不是不可控的，你可以通过增加次数来操控它"'
    claim: 大众认知：运气是纯随机的，无法控制。 作者/九边：单次运气确实是随机的，但**多次尝试的运气是可以被"操控"的**——不是操控运气本身，而是操控你暴露在运气面前的次数。尝试100次的人，"中奖"的概率远远高于尝试1次的人。
  - title: '"消费型人生 vs 投资型人生"'
    claim: 大众认知：赚钱就是为了花钱，享受生活。 作者/九边：你花的每一分钟、每一块钱，都在决定你是"消费型人生"还是"投资型人生"。消费带来即时满足但长期贬值，投资带来延迟满足但长期复利。大多数人的困境不是"赚得不够"，而是"消费比例太高、投资比例太低"。
  - title: '"寒门难出贵子，但不是不可能"'
    claim: 大众认知：要么"努力就能成功"（鸡汤），要么"阶层已经固化"（犬儒）。 作者/九边：真相在中间——阶层固化确实是趋势，普通人向上流动的通道在收窄。但通道没有关闭。教育、技能、认知升级仍然是有效的路径。关键是：你需要比家境好的人付出更多的努力，走更长的路，承受更多的不确定性。
  takeaway: 向上生长的本质不是爆发力，是在看不到回报的漫长岁月中持续做正确的事——直到复利拐点到来的那一天。
