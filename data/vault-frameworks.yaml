  - title: '"我们鼓励顾客少买我们的产品"'
    claim: 大众认知：企业的目标是让顾客买更多。营销的本质是创造需求。
  - title: '"增长可能是企业最大的敌人"'
    claim: 大众认知：增长是企业的生命线。不增长就是衰退。企业应该尽可能做大。
  - title: '"企业可以把整个利润捐给地球"'
    claim: 大众认知：企业的利润属于股东。企业存在的目的是为股东创造价值。
  - title: '"不情愿的商人比天生的商人做得更好"'
    claim: 大众认知：成功的企业家必须有商业头脑、MBA学位、丰富的行业经验。
  - title: '"环保不是成本，是投资"'
    claim: 大众认知：环保会增加成本、降低利润。企业做环保是"有钱了之后"的事。
  - title: '"修补旧衣服比卖新衣服更赚钱"'
    claim: 大众认知：让顾客多买新衣服是利润来源。修补旧衣服是亏本买卖。
  - title: '"供应链透明是竞争优势，不是风险"'
    claim: 大众认知：供应链信息是商业机密，公开会暴露弱点、被竞争对手利用。
  takeaway: 做最好的产品，伤害最小的地球，然后把赚来的钱还给地球——这就是乔伊纳德的全部商业秘密。
