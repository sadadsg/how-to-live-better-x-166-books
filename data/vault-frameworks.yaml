- book: 启示录
  author: '[美]Marty Cagan'
  category: 创业与商业/创新与产品方法论
  file: 创业与商业/创新与产品方法论/拆书笔记-《启示录》.md
  frameworks:
  - name: 产品发现 vs 产品交付（Product Discovery vs Product Delivery）
    core: 产品团队（Product Team）
  - name: 新产品团队的三要素
    core: 产品领导的指导
  - name: 四大产品风险
    core: 新产品四大风险
  - name: 产品任务说明书（Product Brief） vs 功能规格说明书（Feature Spec）
    core: 产品任务说明书             功能规格说明书
  - name: 四原型验证工具箱（可行性原型 / 用户原型 / 真实数据原型 / 混合原型）
    core: 是什么：产品发现不是一句口号，而是Cagan在"产品发现"部分给出的具体工具箱：在写一行产品代码之前，用四种一次性原型分别烧掉四大风险，配套三件套是客户访谈、可用性测试和A/B测试。所有原型的共同特征是为学习而生、用完即弃——它们负责回答问题，不进入上线版本。
  - name: 愿景—策略—原则—OKR 四层对齐栈
    core: 是什么：授权的产品团队（框架二）敢自主发现的前提，是头顶有一条稳定的"轨道"。Cagan给出的对齐栈自上而下是：产品愿景（Product Vision）→ 产品策略（Product Strategy）→ 产品原则（Product Principles）→ 团队
  - name: 试点团队与产品文化（Pilot Team / 传教士 vs 雇佣兵）
    core: 是什么：Cagan给组织转型的答案分两半：推广机制（试点团队）解决"怎么改"，产品文化（传教士 vs 雇佣兵）解决"为什么愿意改"。前者防止转型翻车，后者决定转型成果能否存活。
  counterintuitive:
  - title: '"产品经理不是需求翻译官"'
    claim: 大众认知：产品经理就是收集客户需求，然后告诉工程师和设计师怎么做。 作者Marty Cagan：产品经理的核心职责是发现"正确的东西"，而不是把别人的需求翻译成功能规格。
  - title: '"用户说的一个字都不要信"'
    claim: 大众认知：多听用户的声音，用户需要什么我们就做什么。 作者Marty Cagan：用户给的建议往往不是他们真正需要的，甚至可能是他们从未想象过的。
  - title: '"功能规格说明书是产品开发的毒药"'
    claim: 大众认知：好的需求文档能让团队高效协作，写清楚每个细节。 作者Marty Cagan：功能规格说明书是"瀑布式思维"的产物，它告诉团队怎么做而不是做什么。
  - title: '"最好的想法不是来自最高薪的那个人"'
    claim: 大众认知：产品和方向的决策应该由最资深的产品领导者做出。 作者Marty Cagan：最好的想法可能来自任何一个团队成员，甚至是刚入职的新人。
  - title: '"速度不是做更多事，是更快地知道方向错了"'
    claim: 大众认知：敏捷开发就是更快地做更多功能。 作者Marty Cagan：敏捷和精益的真正价值不是加速开发，而是加速"发现"——更快地发现什么行得通、什么行不通。
  - title: '"不是所有的团队都应该是产品团队"'
    claim: 大众认知：每个团队都应该有产品经理，都应该用产品思维。 作者Marty Cagan：只有新产品/新功能的团队才是真正的产品团队。其他团队可能是交付团队、支持团队等。
  - title: '"产品策略比产品路线图更重要"'
    claim: 大众认知：做产品=列一个功能路线图，然后按计划交付。 作者Marty Cagan：路线图会经常变化，真正的核心是产品策略——你是谁、服务谁、为什么你能赢。
  takeaway: 产品管理的核心不是交付功能，而是发现值得做的事——用验证代替假设，用团队替代英雄，用速度证明方向。
  links:
