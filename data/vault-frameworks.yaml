- book: 给经理人的第一课
  author: 安迪·格鲁夫（Andy Grove，匈牙利裔美国）
  category: 工作与职业
  file: 工作与职业/拆书笔记-《给经理人的第一课》.md
  frameworks:
  - name: 产出导向模型（最核心的认知切换）
    core: 这是格鲁夫最核心的贡献
  - name: 经理人杠杆点（最高杠杆的活动）
    core: 经理人杠杆点
  - name: 会议效率框架
    core: 会议效率框架
  - name: 绩效评估框架
    core: 绩效评估框架
  - name: 混乱吸收器模型（经理人的核心角色）
    core: 混乱吸收器模型
  - name: 生产的基本原则与限制步骤（Production Fundamentals & the Limiting Step）
    core: 是什么：格鲁夫用煮一份早餐（软煮蛋、吐司、橙汁）比喻一切组织的生产系统——哪怕是高科技公司，底层也是一套生产机制，只有四个指标：产能、库存、交付时间、品质。
  - name: 激励与马斯洛需求（Motivation & Maslow's Hierarchy）
    core: 是什么：格鲁夫对"人为什么不出活"的著名回答——只有两个原因：不会做（能力），或不想做（动力）。不会做靠培训，不想做靠激励——本框架拆解"不想做"这台发动机。
  counterintuitive:
  - title: '"管理不是艺术，是科学"'
    claim: 大众认知：管理是天赋、是艺术。
  - title: '"经理人的产出不是自己的产出"'
    claim: 大众认知：经理人的产出是自己的工作。
  - title: '"会议是最重要的杠杆点"'
    claim: 大众认知：会议是浪费时间。
  - title: '"忙碌不等于高效"'
    claim: 大众认知：忙碌就是努力。
  - title: '"混乱吸收是核心职责"'
    claim: 大众认知：经理人的职责是指挥。
  - title: '"规划比执行更重要"'
    claim: 大众认知：执行比规划重要。
  - title: '"人不出活只有两个原因：不会做，或不想做"'
    claim: 大众认知：员工表现差的原因千差万别，很难诊断。
  takeaway: '**经理人的工作不是做事，而是让团队产出最大化——会议、规划、人才是三大杠杆。'
