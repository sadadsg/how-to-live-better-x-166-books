- book: 纳瓦尔宝典
  author: 埃里克·乔根森（Eric Jorgenson，编），纳瓦尔·拉维坎特（Naval Ravikant，原话）
  category: 财商与投资/投资哲学与价值投资
  file: 财商与投资/投资哲学与价值投资/拆书笔记-《纳瓦尔宝典》.md
  frameworks:
  - name: 财富公式（全书最硬核的部分）
    core: 纳瓦尔用一条公式总结了"不靠运气致富"
  - name: 三种杠杆
    core: 这是纳瓦尔最被广为引用的洞察——什么能真正放大一个人
  - name: 判断力（Judgment）——唯一真正稀缺的能力
    core: 纳瓦尔认为，判断力是比"努力"和"聪明"稀缺得多的东西
  - name: 幸福的四个基石
    core: 纳瓦尔的幸福观——幸福不是一种状态，是一种技能
  - name: 阅读与心智模型
    core: 纳瓦尔强调"阅读"是他最重要的习惯——但不是"随便读"
  - name: 成为"谁"比"做什么"更重要
    core: 大多数人的思维："我想做XXX → 我该做什么？"
  - name: 人生三个大决策（The Three Big Decisions）
    core: 纳瓦尔认为，你的人生有 99% 的变量被三个决策锁死——剩下的一切努力都是在优化这三个选择的残差
  - name: 机器与幽灵（Machine / Ghost Relationship）
    core: 这是纳瓦尔认知哲学的根基——一个被严重低估的二元论
  - name: 愤怒是烧红的煤（Anger Is a Hot Coal）
    core: 原书最被引用的金句，也是情绪管理最锋利的隐喻
  - name: 四种运气（Four Kinds of Luck）
    core: 这是纳瓦尔对“运气”最深刻的拆解——也是“不靠运气致富”的真正含义
  - name: 纳瓦尔的哲学金句（The Aphorisms）
    core: 原书后半部分是密集的“哲学随笔”——以下是纳瓦尔最锋利的思想签名
  counterintuitive:
  - title: '"你不靠运气也能致富——但你靠的是特定知识 + 杠杆，不是努力"'
    claim: 大众认知：致富需要"努力、聪明、关系、运气"——大多数人至少缺一样。
  - title: '"幸福不是你得到了什么——是你不再想要什么"'
    claim: 大众认知：幸福 = 目标达成（结婚、加薪、买房、环游世界）。
  - title: '"99%的努力是在浪费——因为方向错了"'
    claim: 大众认知：越努力，越成功。
  - title: '"现代人最昂贵的习惯——不是奢侈品，是新闻"'
    claim: 大众认知：保持信息更新是很重要的，不看新闻会落伍。
  - title: '"读基础学科比读应用学科重要得多"'
    claim: 大众认知：要学"实用的东西"——金融、管理、营销、编程。
  - title: '"嫉妒 = 你只看到对方的收益，没有看到他的成本"'
    claim: 大众认知：嫉妒是人之常情，只是一种"羡慕"。
  - title: '"不做事比做事难——而且更能创造价值"'
    claim: 大众认知：做事 = 创造价值。闲着 = 没价值。
  - title: '"你的人生被三个决策决定——而不是一万个努力"'
    claim: 大众认知：人生靠细节决定成败，勤奋/努力/选择每天都在起作用。
  - title: '"愤怒不会伤敌人，只会伤你自己"'
    claim: 大众认知：愤怒是“有力量的武器”，是该表达就表达的情绪。
  - title: '"你只是一只有计划的猴子"'
    claim: 大众认知：我很重要，我的烦恼很重要，别人应该在乎我。
  - title: ⓫ "死亡冥想是幸福的核心方法"
    claim: 大众认知：死亡是消极的，能不想就不想，最好避谈。
  - title: ⓬ "运气分四种——第四种你只能靠人格赚"
    claim: 大众认知：运气是随机的，运气好不好看命。
  - title: ⓭ "机器/幽灵分离——用意志力打败自己是现代病"
    claim: 大众认知：自律就是“用意志力压住冲动”，能做到就是强者。
  - title: ⓮ "自由不是没人管你——是你有能力离开"
    claim: 大众认知：自由 = 没人管我、没人约束我、想做什么做什么。
  takeaway: '**找到你天生擅长的事，用杠杆放大它，然后在漫长的时间里让复利替你工作。'
