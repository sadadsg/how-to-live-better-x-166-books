- book: 基层中国的运行逻辑
  author: 聂辉华（清华大学社会科学学院长聘教授）
  category: 经济学与社会/中国政治经济
  file: 经济学与社会/中国政治经济/拆书笔记-《基层中国的运行逻辑》.md
  frameworks:
  - name: 基层中国的三层签约结构
    core: 这是全书的总骨架。把中国从中央到个体的七级行政链条（中央—省—市—县—乡镇—村—户）压缩为四个签约层级。
  - name: 不完全契约理论与剩余控制权
    core: 这是全书的方法论底色。聂辉华的博士后导师 Oliver Hart 因不完全契约理论获得 2016 年诺贝尔经济学奖；聂在中国把这套理论本土化的关键工具就是「剩余控制权」。
  - name: 基层政府的双重身份（代理方 + 剩余索取者）
    core: 基层官员同时扮演两个角色，这两个角色经常冲突。
  - name: 基层运行的"锦标赛"晋升模型
    core: 锦标赛晋升模型：地方官员的政治激励
  - name: 政企关系的三层契约（掠夺型/勾连型/扶持型）
    core: 这是聂辉华的长期研究主线。本框架给出他对地方政府与企业之间关系的三分类。
  - name: 基层财政的"吃饭财政 vs 建设财政"
    core: 中国县乡两级财政的典型结构：绝大部分收入用于"养人"，可用于公共服务的钱非常少。
  - name: 基层治理的"不出事逻辑"（维稳激励）
    core: 这是中国基层治理中一个特别的均衡：不出事 ≠ 解决问题，而是"把问题压住/捂住/移出视野"。
  - name: 基层民主的"形式化与实质化"张力
    core: 基层民主的形式化 vs 实质化
  - name: 基层中国的长期均衡——"稳定但低效"陷阱
    core: 综合前八个框架，得出基层中国的长期均衡。
  counterintuitive:
  - title: '"基层官员不是''小贪官''，他们是地方政企关系的运营者"'
    claim: 大众认知：基层官员 = 小贪官 + 素质差 + 粗暴执法。
  - title: '"基层治理失效不是''素质问题''，是激励问题"'
    claim: 大众认知：基层出问题 = 干部作风差 / 培训不足 / 监督不严。
  - title: '"上访越多≠民怨越大——上访可能是被''筛选''出来的"'
    claim: 大众认知：上访数 = 社会矛盾数。
  - title: '"基层民主的选举不是越民主越好——形式化反而有功能"'
    claim: 大众认知：基层选举越真 = 越好。
  - title: '"县乡财政不是没钱，是钱不在公共服务上"'
    claim: 大众认知：基层财政紧张 = 中央转移支付不够。
  - title: '"稳定不是免费的——基层的稳定是用''不出事逻辑''换的"'
    claim: 大众认知：稳定 = 治理良好。
  - title: '"基层政府对企业的''好''可能不是好——三种角色需分清"'
    claim: 大众认知：地方政府对企业好 = 营商环境好。
  - title: '"乡村振兴的钱被''吃饭财政''先吃掉了一层"'
    claim: 大众认知：乡村振兴 = 国家大量投入。
  - title: '"上级政策越严，基层越会做表面文章"'
    claim: 大众认知：上级严管 = 基层规范。
  - title: '"中国宏观奇迹的代价，大部分沉淀在基层"'
    claim: 大众认知：中国奇迹 = 顶层设计 + 改革开放红利。
  takeaway: '**理解中国，先理解基层；理解基层，先理解谁拥有剩余控制权——激励机制决定一切，道德叙事只是表象。'
  links:
