- book: 翻篇
  author: '[美]谢里安娜·博伊尔（Sherianna Boyle）'
  category: 心理学与行为科学/创伤与疗愈
  file: 心理学与行为科学/创伤与疗愈/拆书笔记-《翻篇》.md
  frameworks:
  - name: 情绪反应性陷阱（Reactivity Trap）
    core: 博伊尔认为，大多数人的情绪问题不是"情绪太多"，而是"反应太快"
  - name: C.L.E.A.N.S.E. 七步情绪疗愈法
    core: 这是全书的技术核心——一个可重复、可日常化的情绪处理系统
  - name: 情绪的三重认知模型
    core: 博伊尔在第一部分建立的认知框架，解释了为什么大多数人处理情绪的方式是错的
  - name: 身体-情绪连接图谱
    core: 博伊尔强调身体是情绪的存储器，七步法大量运用身体技术
  - name: 表达性书写——情绪的输出通路（Expressive Writing & The Unsent Letter）
    core: （与框架2的分工：C.L.E.A.N.S.E. 是完整的操作系统，本框架聚焦步骤3 Emit"释放"的具体通路——情绪被激活之后从哪里流出去。书写是最便宜、门槛最低、可每天重复的输出通道。）
  - name: 宽恕、道歉与和解的决策模型（Forgiveness vs. Reconciliation）
    core: （与框架2的分工：步骤5 Nourish 里的"宽恕"只告诉你宽恕放在哪一步，本框架回答宽恕前后的关系决策——需不需要对方的道歉、和解到什么程度。这是从"个体情绪处理"进到"关系收尾"的一层。）
  - name: 情绪排毒周期与复发再处理（The Detox Cycle & Relapse Protocol）
    core: （与框架2的分工：步骤7 Ease 负责把疗愈成果固化为日常状态，本框架负责成果被打破之后——旧情绪反扑不是失败，是下一轮排毒周期的入口。这是从"单次处理"进到"时间维度"的一层。）
  counterintuitive:
  - title: '"情绪不需要被理解，需要被处理"'
    claim: 大众认知：我要搞清楚自己为什么会有这种感觉，理解了就好了。
  - title: '"你不是被情绪困住的，你是被你对情绪的反应困住的"'
    claim: 大众认知：我之所以走不出来，是因为那个伤害太深了。
  - title: '"快乐不是目标，是副产品"'
    claim: 大众认知：我要变得快乐，所以我需要消除所有负面情绪。
  - title: '"身体比你诚实，它一直在说话"'
    claim: 大众认知：情绪是心理问题，应该用心理方法解决。
  - title: '"原谅不是第一步，是第五步"'
    claim: 大众认知：要放下过去，首先得原谅伤害你的人。
  - title: '"被吸收的情绪是最隐蔽的情绪毒素"'
    claim: 大众认知：我的情绪是我自己的，和别人无关。
  - title: '"翻篇不是忘记，是带着理解继续走"'
    claim: 大众认知：翻篇 = 忘掉过去 = 假装什么都没发生。
  takeaway: 翻篇不是忘记过去，是让情绪从身体里流过去——流过去了，心就空了，空了才能装新的。
