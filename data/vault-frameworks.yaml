    claim: 大众认知：努力工作→赚更多钱→变富。
  - title: '"高薪不能解决财务问题"'
    claim: 大众认知：收入高了，问题就解决了。
  - title: '"财商比学历重要"'
    claim: 大众认知：好大学→好工作→好生活。
