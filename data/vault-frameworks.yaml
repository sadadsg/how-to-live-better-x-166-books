- book: 哀悼与忧郁
  author: '[奥]西格蒙德·弗洛伊德（Sigmund Freud）'
  category: 心理学与行为科学/创伤与疗愈
  file: 心理学与行为科学/创伤与疗愈/拆书笔记-《哀悼与忧郁》.md
  frameworks:
  - name: 哀悼 vs 忧郁的区分模型
    core: 失去所爱对象
  - name: 忧郁症的心理动力学
    core: 爱的对象（外部）
  - name: 忧郁症的五重特征
    core: ''
  - name: 对象关系的三阶段
    core: 第一阶段：理想化
  - name: 哀悼的正常路径
    core: 否认期 → "这不可能是真的"
  - name: 自恋型对象选择——为什么偏偏是这个人忧郁
    core: 与现有框架四的分工：框架四讲丧失之前对象关系的展开（理想化→矛盾并存→丧失）；本框架回答更上游的问题——这个人当初是怎么爱上的，为什么"自恋型对象选择"注定了丧失会变成自我的丧失。
  - name: 躁狂的胜利——忧郁的另一种结局（躁郁钟摆）
    core: 与现有框架二的分工：框架二讲忧郁的内战动力学（审判官攻击自我）；本框架讲这场内战的另一种结局——自我驱逐审判官之后的"胜利"，以及它如何解释躁狂与抑郁的循环摆荡。
  counterintuitive:
  - title: '"忧郁症患者攻击的不是自己，是他们深爱的人"'
    claim: 大众认知：忧郁症是"想不开"、"太脆弱"、"自我否定"。
  - title: '"真正的哀悼不是放下，是收回"'
    claim: 大众认知：哀悼就是"放下"、"忘记"、"move on"。
  - title: '"忧郁症的睡眠障碍是因为超我在夜间最活跃"'
    claim: 大众认知：失眠是焦虑的表现，睡多了是逃避。
  - title: '"自杀是自我想要消灭审判官"'
    claim: 大众认知：自杀是"不想活了"、"太绝望了"。
  - title: '"矛盾情感是爱的必修课"'
    claim: 大众认知：真正的爱应该是纯粹的、没有恨的。
  - title: '"忧郁症是哀悼的失败，不是失败的哀悼"'
    claim: 大众认知：忧郁症是"哀悼能力差"。
  - title: '"自我贬低是一种隐蔽的自恋"'
    claim: 大众认知：自卑和自恋是相反的。
  takeaway: 你攻击自己的每一个声音，都曾是你深爱过的一个人的声音。
