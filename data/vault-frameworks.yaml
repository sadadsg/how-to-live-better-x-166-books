- book: 全球股市启示录：行情脉络与板块轮动
  author: 燕翔、金晗（中国）
  category: 财商与投资/投资哲学与价值投资
  file: 财商与投资/投资哲学与价值投资/拆书笔记-《全球股市启示录》.md
  frameworks:
  - name: 框架①：ROE趋势定价模型（价值股 / 成长股 / 衰退股）
    core: ROE是所有企业和板块共有的指标，用它定义"景气周期"能解决不同行业之间横向不可比的难题——煤炭的景气来自煤价上涨、消费的景气来自销量增加、半导体的景气来自技术进步，但在行业比较层面，它们"处于景气周期的位置"是等价的。
  - name: 框架②：产业逻辑 vs 市场逻辑（内因 / 外因）
    core: 宏观与策略的"总量研究"只用来判断两个大方向，主次分明
  - name: 框架③：板块轮动双框架（自上而下 × 自下而上）
    core: 板块轮动的两大研究框架
  - name: 框架④：时代的贝塔（全球板块轮动主线）
    core: 西方股市普遍经历一条主线：周期 → 消费 →（金融穿插）→ 医药科技。金融板块不固定在其间位置——取决于各国房地产周期的爆发时间。
  - name: 框架⑤：7大市场 · 国家生态映射表
    core: 每个股市的行情脉络=国家发展阶段×主导产业×制度特征。市场是"带节奏的先行者"（美股），他国更像"跟随者、补充者"——经济发展阶段和规律相似，股市脉络"有迹可循"。
  - name: 框架⑥：市场共性三维度（宏观/流动性/估值 × 长期收益）
    core: 第九章对7大市场共性特征做统计总结，三个维度看清
  - name: 框架⑦：五类行业板块逻辑驱动
    core: 一句话：长跑看消费+医药（需求的永续性），爆发看科技（供给创新），弹性看周期（价格波动），时机看金融（跟房地产周期走）。
  - name: 框架⑧：股市长牛慢牛四要件 + 泡沫启示录
    core: 长牛慢牛四要件（对照美股等成熟市场的历史）——最核心的是第一条，其余是辅助
  - name: 框架⑨：未来路在何方（前瞻应用）
    core: 产业发展趋势决定未来投资主线
  counterintuitive:
  - title: '"市场从来不看估值——不是最近不看，是从来不看"'
    claim: 大众认知：A股越来越"投机"，只看故事不看估值，估值投资已经失效，市场病了。
  - title: '"低估值板块上涨的核心不是估值，是它恰好进入了景气上行"'
    claim: 大众认知：便宜就是安全边际，低估值的股票跌无可跌，最安全，买它等反弹。
  - title: '"价值投资不是买便宜货，是分享企业价值的增长"'
    claim: 大众认知：价值投资 = 低估值买入（PE/PB越低越有价值），赚"价格低于价值"的价差。
  - title: '"''跌多了会反弹''只在一种情况下成立：景气周期恰好向上"'
    claim: 大众认知：板块超跌了，均值回归会把它拉回来，该抄底。
  - title: '"金融股长期跑输不是被错杀，是它的商业模式被时代质疑"'
    claim: 大众认知：银行股估值全球最低，明显被严重错杀，早晚大幅修复。
  - title: '"大消费时代与婴儿潮和全球化无关，都是''时代的贝塔''"'
    claim: 大众认知：消费股长期牛，是因为消费"抗周期"、"永续需求"、"好公司本身牛"。
  - title: '"流动性宽松≠成长股必涨，是产业逻辑才让流动性行情强势"'
    claim: 大众认知：放水了，成长股就该涨；跌了是因为流动性收紧，基本面没问题。
  - title: '"市场成熟的长牛慢牛，前提是整个市场''脱敏''短期经济波动"'
    claim: 大众认知：经济数据好，股市就该涨；经济一差，股市必跌——牛短熊长是A股的宿命。
  takeaway: 股市赚的是企业盈利的钱——选景气的产业、跟时代的贝塔，别赌估值，别赌情绪。
