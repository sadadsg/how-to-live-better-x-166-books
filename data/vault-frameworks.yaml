- book: 钱是怎么流动的
  author: '[美]沃尔特·安达尔（Walter Andal）'
  category: 财商与投资/投资进阶
  file: 财商与投资/投资进阶/拆书笔记-《钱是怎么流动的》.md
  frameworks:
  - name: 金钱流动循环模型
    core: 央行（中央银行）
  - name: 收入双轨模型
    core: 你如何赚钱？
  - name: 信用双刃剑模型
    core: 信用（Credit）
  - name: 储蓄→投资→增值循环
    core: 收入 → 储蓄（先存后花）→ 投资（钱生钱）→ 增值（复利）
  - name: 供需-价格-通胀三角关系
    core: 供给（Supply）
  - name: 复利与时间（Compound Interest & Time）
    core: 是什么：复利 = 利息再生利息。每一轮增值都以下一轮的本金身份重新入场，增长从"加法"变成"乘法"。它被称作"世界第八大奇迹"，但奇迹的开关不是收益率，而是时间。
  - name: 通胀传导链（Inflation Transmission Chain）
    core: 是什么：通胀不是"超市涨价"这么简单，那只是链条的末端。通胀的起点在央行：新钱进入体系后像水波一样逐层扩散，普通人总是最后感知、最先受损。
  counterintuitive:
  - title: '"钱不是从ATM机里长出来的"'
    claim: 大众认知：央行想印多少就印多少，钱是"无中生有"的。 作者/Author：央行每印一笔钱，都有对应的代价——可能是通胀，可能是债务，可能是资产泡沫。钱不是凭空产生的，它是信用的产物。
  - title: '"信用是工具，不是收入"'
    claim: 大众认知：刷信用卡就是在花钱，花的是"自己的钱"。 作者/Author：信用卡里的钱不是你的钱，是银行借给你的钱。你花的每一分钱，将来都要还，还要加利息。
  - title: '"存钱不是等有钱了再存"'
    claim: 大众认知：等我赚够了再存钱，现在钱太少了存了也没用。 作者/Author：存钱的关键不是金额，而是习惯。从小开始，哪怕每月只存一块钱，复利效应会在未来给你惊喜。
  - title: '"股票不是赌博，但需要知识"'
    claim: 大众认知：炒股就是赌博，赢了是运气，输了是命。 作者/Author：股票是公司的所有权凭证，买股票就是买公司的一部分。赌博是零和游戏，而股票市场是正和游戏——公司创造价值，股东分享价值。
  - title: '"钱不是唯一能使你富有的东西"'
    claim: 大众认知：有钱就是富，没钱就是穷。 作者/Author：真正的富有包括物质财富、知识、健康、人际关系和精神满足。钱是工具，不是目的——它可以帮你获得其他东西，但钱本身不是终点。
  - title: '"通货膨胀是隐形的税收"'
    claim: 大众认知：通货膨胀是物价上涨，是经济问题。 作者/Author：通货膨胀实际上是一种隐性税收——它悄悄地减少了你手中钱的购买力。政府不需要直接从你口袋里拿钱，只需要让钱贬值。
  - title: '"外汇不只是出国旅游用的"'
    claim: 大众认知：外汇就是出国时换的外国钱。 作者/Author：外汇是国际金融体系的基础，它影响着进出口贸易、跨国投资、甚至国家间的权力博弈。汇率波动可以影响一个国家的经济命脉。
  takeaway: 理解钱的流动方向，比努力赚钱更重要。
