  counterintuitive:
  - title: '"增长≠发展，只有创新才是真正的增长"'
    claim: 大众认知：GDP增长就是经济发展，更多产出意味着更富裕。
  - title: '"企业家不是管理者，而是一种稍纵即逝的状态"'
    claim: 大众认知：企业家就是企业老板或CEO，是一种职业身份。
  - title: '"利润只来自创新，管理只能产生工资"'
    claim: 大众认知：利润来自聪明的经营和成本控制。
  - title: '"创新不是渐进改良，而是革命性跳跃"'
    claim: 大众认知：创新是持续改进，是量变积累到质变。
  - title: '"创造性破坏是资本主义的本质，不是bug"'
    claim: 大众认知：企业倒闭、产业衰退是经济问题，需要政策干预。
  - title: '"供给创造需求，而非需求拉动供给"'
    claim: 大众认知：先有需求，后有供给；企业应该满足消费者需求。
  - title: '"企业家不形成社会阶级，因为创新是个人行为"'
    claim: 大众认知：企业家是一个有共同利益的社会阶层。
  takeaway: 经济增长的真正源泉不是积累更多资源，而是用不同方式组合现有资源——这就是创新。
