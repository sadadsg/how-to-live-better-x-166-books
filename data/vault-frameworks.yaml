- book: 活出生命的意义
  author: 维克多·弗兰克尔（Viktor E. Frankl，奥地利）
  category: 生命哲学与死亡/意义与觉醒
  file: 生命哲学与死亡/意义与觉醒/拆书笔记-《活出生命的意义》.md
  frameworks:
  - name: 意义三来源模型（Three Sources of Meaning）
    core: 弗兰克尔提出人可以通过三种途径找到生命的意义——这是全书最核心的操作系统
  - name: 集中营心理阶段模型（Concentration Camp Psychology）
    core: 弗兰克尔观察到囚犯在集中营中经历的心理变化——这个模型适用于任何极端压力情境
  - name: 意义疗法vs精神分析对比模型（Logotherapy vs Psychoanalysis）
    core: 弗兰克尔明确区分了自己的"意义疗法"与弗洛伊德的"精神分析"和阿德勒的"个体心理学"
  - name: 存在真空模型（Existential Vacuum）
    core: 弗兰克尔诊断了现代人最普遍的心理问题——不是神经症，而是"存在真空"
  - name: 悲剧三元组模型（Tragic Triad）
    core: 弗兰克尔提出的"悲剧三元组"——人类无法避免的三种苦难，以及如何在其中找到意义
  - name: 自我超越模型（Self-Transcendence）
    core: 弗兰克尔认为意义的核心机制是"自我超越"——你必须超出自己才能找到意义
  counterintuitive:
  - title: '"快乐不能被追求，只能作为副产品出现"'
    claim: 大众认知：人生的目标是追求快乐，快乐越多越好。
  - title: '"人在任何境遇中都能找到意义——即使是集中营"'
    claim: 大众认知：集中营是人间地狱，不可能有意义可言。
  - title: '"苦难本身没有意义——但你对苦难的态度可以创造意义"'
    claim: 大众认知：受苦是有意义的，"吃得苦中苦，方为人上人"。
  - title: '"不是你在问生命的意义——是生命在问你"'
    claim: 大众认知：人活着应该追问"生命的意义是什么？"这个问题。
  - title: '"自由的最后堡垒是你选择态度的自由——任何外力都无法剥夺"'
    claim: 大众认知：自由是外在的——言论自由、行动自由、选择的自由。
  - title: '"自我超越不是牺牲自我——是通过服务他者发现自我"'
    claim: 大众认知：自我超越是"忘我"、"牺牲"、"无私奉献"——意味着放弃自己的利益。
  - title: '"存在真空不是因为缺少快乐——是因为缺少意义"'
    claim: 大众认知：空虚是因为缺少快乐、缺少刺激、缺少享乐。
  takeaway: 人可以被剥夺一切，除了最后一样东西：在任何境遇中选择自己态度的自由。
