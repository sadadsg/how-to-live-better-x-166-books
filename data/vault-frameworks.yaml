    core: 荣格和道家都关注的核心问题——意识与无意识的关系
  - name: 金花模型：个性化过程
    core: 荣格用道家的"金花"来解释他的"个性化"理论
  - name: 道家修炼路径
    core: 《太乙金华宗旨》中的修炼路径
  - name: 东西方心灵成长对照
    core: 东西方心灵成长对照
  - name: 识神与元神：原书的意识层次宇宙论
    core: 是什么：原书把"心"分成两层——
  - name: 性与命双修：心息相依
    core: 是什么：原书属内丹"性命双修"传统——
  - name: 荣格的"不要模仿"警告：方法不可移植
    core: 是什么：荣格在评注中反复警告——
  counterintuitive:
  - title: '"金花不是外在的药物，而是内心觉醒的象征"'
    claim: 大众认知：道家炼丹是炼外在的"仙丹"。
  - title: '"东方的道和西方的心理学，在''成为完整的人''这件事上殊途同归"'
    claim: 大众认知：东方哲学和西方科学是不同的体系。
  - title: '"你最讨厌的人，可能映射了你最不愿承认的自己"'
    claim: 大众认知：我讨厌他，是因为他不好。
  - title: '"真正的成长不是消除缺点，而是整合缺点"'
    claim: 大众认知：成长 = 变得更好 = 消除缺点。
  - title: '"梦是无意识给你的信——学会读它"'
    claim: 大众认知：梦是随机的神经活动，没有意义。
  - title: '"最好的管理是''让事情自然发生''"'
    claim: 大众认知：管理 = 控制。
  - title: '"人格的发展属于最昂贵的东西"'
    claim: 大众认知：最昂贵的东西是财富、地位、名声。
  takeaway: 金花的秘密不是"得到什么"，而是"成为什么"——接纳全部的自己，才能成为完整的人。
