  author: 克莱顿·克里斯坦森（美国）
  category: 创业与商业/创新与产品方法论
  file: 创业与商业/创新与产品方法论/拆书笔记-《创新的用途理论》.md
  frameworks:
  - name: 用途理论模型（最核心的认知切换）
    core: 这是克里斯坦森最核心的贡献
  - name: 任务层次模型
    core: 任务层次模型
  - name: 情境-任务匹配模型
    core: 情境-任务匹配模型
  - name: 竞争产品框架
    core: 竞争产品框架
  - name: 创新机会框架
    core: 创新机会框架
  - name: 大数据盲区框架（Big Data Blind Spot）
    core: 与现有框架1的分工：框架1给出"任务是什么"的模型，本框架回答"为什么大数据不能替代任务思维"——这是奶昔案例的认识论核心：相关性不等于因果性，数据告诉你"谁买了"，不告诉你"为什么买"。
  - name: 任务导向组织框架（Organization Around the Job）
    core: 与现有框架5的分工：框架5讲如何"找到"未完成任务的机会，本框架讲如何让整个组织"承接"机会——任务思维从产品层推进到组织层：流程、指标、激励、文化全部围绕任务重排。
  counterintuitive:
  - title: '"客户不是购买产品，而是雇佣产品"'
    claim: 大众认知：客户购买产品来满足需求。
  - title: '"任务比产品更重要"'
    claim: 大众认知：好产品自然有市场。
  - title: '"竞争不是同类产品之间"'
    claim: 大众认知：竞争是同类产品之间。
  - title: '"情境决定任务"'
    claim: 大众认知：产品有固定用途。
  - title: '"社会和情感任务更关键"'
    claim: 大众认知：功能任务最重要。
  - title: '"创新机会在于未完成的任务"'
    claim: 大众认知：创新在于技术突破。
  - title: '"数据告诉你''谁买了''，不告诉你''为什么买''"'
    claim: 大众认知：数据越多，创新越有把握。
  takeaway: '**客户不是购买产品，而是雇佣产品完成任务——理解任务，才能创新。'
