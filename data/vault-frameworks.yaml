- book: 易经
  author: 伏羲、周文王、周公旦、孔子（集体创作，跨越约两千年）
  category: 哲学经典/东方哲学
  file: 哲学经典/东方哲学/拆书笔记-《易经》.md
  frameworks:
  - name: 阴阳——变化的最小单位
    core: 《易经》的底层操作系统是阴阳。这不是玄学，是一种极简的二元分析工具。
  - name: 八卦——天地万物的八种基本模式
    core: 八卦由三个阴阳爻叠加而成，代表八种基本自然力量和八种基本处境。
  - name: 六十四卦——人生场景的完整决策图谱
    core: 两个八卦上下叠加，形成六十四卦。每一卦代表一种人生处境，配合卦辞和爻辞，构成一套完整的决策参考系统。
  - name: 六爻——事物发展的六阶段模型
    core: 每一卦有六个爻（从下到上），代表事物从萌芽到终结的六个阶段。
  - name: 变卦——变化的动态系统
    core: 《易经》最核心的创新不是64个静态的卦，而是变卦——一个卦如何变成另一个卦。这揭示了变化的内在逻辑。
  - name: 卦象解读的三层结构
    core: 卦 象 解 读 三 层 结 构
  - name: 应位与比邻——事物间的呼应关系
    core: 应 位 与 比 邻 关 系
  - name: 时位——时机与位置的匹配
    core: 这是《易经》决策哲学的核心。
  counterintuitive:
  - title: '"变化不是敌人，是唯一的朋友"'
    claim: 大众认知：变化是危险的、不确定的、让人焦虑的。人们追求稳定，害怕变化。 作者/《易经》：变化是宇宙唯一不变的法则。你无法阻止变化，就像你无法阻止四季轮转。智慧不是追求"不变"，而是理解"怎么变"——知道变化的方向和节奏，顺势而为。
  - title: '"六十四卦中唯一全吉的，不是最刚的，而是最柔的"'
    claim: 大众认知：要成功就要强势、自信、锋芒毕露。 作者/《易经》：六十四卦中唯一六爻皆吉的是"谦"卦——谦虚。不是"乾"（刚健），不是"大壮"（强壮），而是"谦"（谦逊）。谦卦的象辞："地中有山，谦。君子以裒多益寡，称物平施。"
  - title: '"困境不是惩罚，是修炼场"'
    claim: 大众认知：困境是坏事，应该尽快逃离。 作者/《易经》："蹇"卦（困难）教你"反身修德"——困境不是让你逃的，是让你向内修炼的。"困"卦（困顿）教你"致命遂志"——在困顿中坚守志向，困境就是你的修行道场。
  - title: '"最好的行动，往往是不行动"'
    claim: 大众认知：不做决定就是逃避，行动才是勇气。 作者/《易经》："潜龙勿用"——在时机不到的时候，最好的行动是不行动。"需"卦教你有信心地等待。"艮"卦教你知止。在"时位"不匹配时强行行动，不是勇气，是鲁莽。
  - title: '"成功比失败更危险"'
    claim: 大众认知：成功是好事，应该追求更多成功。 作者/《易经》："既济"卦（已经成功）的卦辞是"初吉终乱"——成功之后是最危险的时刻。"亢龙有悔"——到了最高处不退，就只有后悔。成功让人松懈，松懈让人衰败。
  - title: '"吉凶不是命，是选择"'
    claim: 大众认知：《易经》是算命的——告诉你未来是吉还是凶。 作者/《易经》：《易经》的核心不是"预测"吉凶，而是"解释"在什么情况下什么行为会带来什么结果。同一个人在同一个处境中，选择不同的行为，结果完全不同。吉凶不是天注定的，是你对"时位"的判断和应对决定的。
  - title: '"阴不是弱，是另一种强"'
    claim: 大众认知：阳（刚、强、主动）比阴（柔、弱、被动）好。 作者/《易经》：阴阳等价，没有高下。坤卦的"厚德载物"和乾卦的"自强不息"是同等重要的力量。在某些时位下，用阴（柔顺、等待、包容）比用阳（刚强、进取、对抗）更有效。关键不是"阳好还是阴好"，而是"现在该用阳还是用阴"。
  - title: '"未完成比完成更有力量"'
    claim: 大众认知：完成目标才是成功的标志。 作者/《易经》：六十四卦的最后一卦不是"既济"（完成），而是"未济"（未完成）。这不是巧合，而是《易经》最深邃的设计——一切的终点是新一轮的起点。"未济"意味着"一切皆有可能"，而"既济"意味着"已经到了尽头"。
  takeaway: 万事万物皆有其时、其位——顺之则吉，逆之则凶；知止而不殆，知时而无悔。
