- book: 亲密关系
  author: ''
  category: 心理学与行为科学/关系与沟通
  file: 心理学与行为科学/关系与沟通/拆书笔记-《亲密关系》.md
  frameworks:
  - name: 社会交换理论（关系的经济学模型）
    core: 米勒认为人际关系可以用经济学的成本-收益逻辑来理解，但比市场交易复杂得多
  - name: 依恋理论（决定你如何爱一个人的操作系统）
    core: 巴塞洛缪的四类型依恋模型——这是关系科学中最有预测力的框架
  - name: 爱的三元理论（斯坦伯格）
    core: 爱情不是一块整体，是三个成分的不同组合
  - name: 戈特曼的末日四骑士（关系失败的诊断工具）
    core: 约翰·戈特曼通过长期追踪研究，发现四个沟通模式能以超过90%的准确率预测离婚
  - name: 关系韧性模型（VSA模型）
    core: Karney & Bradbury 提出的关系长期演化模型
  - name: 互依理论（Interdependence Theory）
    core: 关系中的决策如何受对方影响
  - name: 关系辩证法（Relational Dialectics）
    core: 关系中永恒存在的三组张力
  - name: 自我延伸模型（Self-Expansion Model）
    core: 爱情的本质是扩展自我
  - name: 爱的五种语言（Gary Chapman）
    core: 每个人表达和接收爱的方式不同
  - name: 冲突解决策略（Conflict Resolution）
    core: 四种冲突处理风格及其后果
  - name: 关系阶段理论（Relationship Stages）
    core: 关系发展的四个阶段
  - name: 嫉妒的三成分模型（Bryant & Jeong）
    core: 嫉妒的三个组成部分
  - name: 自我表露理论（Self-Disclosure）
    core: 亲密关系的建立需要渐进式的自我揭露
  - name: 信任的三层结构（Rempel et al.）
    core: 信任的三个发展阶段
  counterintuitive:
  - title: '"浪漫爱情的激情必然在两年内下降"'
    claim: 大众认知：真爱的激情应该永远在，如果消失了就是不爱了。
  - title: '"相似比互补更能预测关系幸福"'
    claim: 大众认知：性格互补的人更吸引彼此（活泼配内敛、理性配感性）。
  - title: '"冲突不可避免，而且对关系有益——但不是所有的冲突"'
    claim: 大众认知：好的关系应该没有争吵/吵架说明不合适。
  - title: '"你不需要''对的人''，你需要在关系中成为''对的自己''"'
    claim: 大众认知：找到真命天子/天女，一切问题都会迎刃而解。
  - title: '"沟通不是万能的——有时候不沟通才是更好的选择"'
    claim: 大众认知：关系中任何问题都应该拿出来谈，坦诚沟通能解决一切。
  - title: '"自我揭露不是越多越好，时机和渐进比数量重要"'
    claim: 大众认知：亲密关系就应该无话不谈，毫无保留。
  - title: '"婚姻并不会让人更幸福——但好的婚姻会"'
    claim: 大众认知：结婚=幸福。不幸福就是结错了人。
  takeaway: '**爱不是一个需要找到的东西，是一个需要构建的东西——它不是一个问题，它是一个正在进行的项目。'
