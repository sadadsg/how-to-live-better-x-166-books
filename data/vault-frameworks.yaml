- book: 分手后，成为更好的自己
  author: '[美] 布鲁斯·费希尔（Bruce Fisher）/ 罗伯特·艾伯蒂（Robert Alberti）'
  category: 心理学与行为科学/关系与沟通
  file: 心理学与行为科学/关系与沟通/拆书笔记-《分手后，成为更好的自己》.md
  frameworks:
  - name: 重建方块（Rebuilding Blocks）——核心模型
    core: 这是全书的骨架，19个步骤构成一条从"崩溃"到"自由"的路径
  - name: 情感银行账户模型
    core: 一段关系本质上是一个情感银行账户
  - name: 爱的三层次模型
    core: 层次3       ← 真正的爱：给予自由，欣赏对方的独特性
  - name: 依赖-独立-互赖连续统
    core: 依赖 → 独立 → 互赖
  - name: 关系危机五征兆
    core: 分手不是突然发生的，通常有五个信号
  - name: 反弹关系陷阱（Rebound Relationship Trap）
    core: 费希尔反复强调：分手后最快进入新关系的人，往往是恢复最慢的人。
  - name: 过渡状态（Limbo）——"悬浮期"
    core: 费希尔将分手后的过渡期称为"Limbo"——一个既不属于旧生活、也不属于新生活的悬浮状态。
  - name: 未完成情结（Unfinished Business）
    core: 费希尔指出，很多人的恢复卡在某个阶段，是因为有未完成的情结在暗中拉扯。
  - name: 19步螺旋模型——恢复不是直线
    core: 费希尔特别强调：重建方块的19个步骤不是一条直线，而是一个螺旋。
  counterintuitive:
  - title: '"坠入爱河往往不是真的爱，只是找到一个人弥补自己缺失的部分"'
    claim: 大众认知：坠入爱河就是真爱的表现。 作者观点：坠入爱河是化学反应，不是爱。真正的爱需要了解、尊重和选择。
  - title: '"离婚的根本原因是结婚"'
    claim: 大众认知：离婚是关系的失败。 作者观点：很多人结婚时就是不成熟的——他们把依赖当成了爱，把需求当成了承诺。
  - title: '"相爱的感觉不是唯一难割舍的东西——愤怒、怨恨、报复心情同样难割舍"'
    claim: 大众认知：分手后最痛的是失去爱。 作者观点：很多人其实已经不爱了，但放不下的是愤怒和怨恨。
  - title: '"刚分手不要急着寻找下一段感情——友谊比爱情更重要"'
    claim: 大众认知：新恋情是最好的疗伤药。 作者观点：急于进入新关系是逃避——你没有完成重建，只是把旧伤口藏起来了。
  - title: '"你不是因为不幸才看这本书，恰恰是因为你想要更加幸运"'
    claim: 大众认知：只有"有问题"的人才需要心理疗愈。 作者观点：主动面对分手痛苦的人，正在做最勇敢的事——他们在把痛苦变成成长的燃料。
  - title: '"一段关系的结局并不重要，自我成长才是"'
    claim: 大众认知：一段关系的好坏由结局定义（白头偕老=成功，分手=失败）。 作者观点：关系的价值不在于持续多久，而在于你从中学到了什么。
  - title: '"我走在成长为一个完整的人的道路上，在未来的某个时间，我感到自己杯子里的东西是如此丰富，需要找一个人来分享多出来的部分"'
    claim: 大众认知：找一个伴侣是为了"完整自己"。 作者观点：你应该是"完整的"才去分享，而不是"去找到完整"。
  - title: '"如果你能利用每次恋情来了解自己和内心感受，你就能更接近你想成为的那个人"'
    claim: 大众认知：恋爱是为了找到"对的人"。 作者观点：恋爱是为了找到"对的自己"——每段关系都是一次自我认知的旅程。
  takeaway: 分手不是失去爱，是获得重新认识自己、成为完整的人的机会。
