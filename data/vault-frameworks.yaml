- book: 我的外婆从不内耗
  author: 理微尘
  category: 心理学与行为科学/情绪与内耗
  file: 心理学与行为科学/情绪与内耗/拆书笔记-《我的外婆从不内耗》.md
  frameworks:
  - name: 内耗本质模型——"橡皮擦"模型
    core: 外婆对"内耗"的定义极其精炼：内耗是理想与现实的反复摩擦，最终擦掉了真正的自己。
  - name: 斟满自己的杯子——爱的能量守恒模型
    core: 外婆最核心的价值观：爱人先爱己。 这不是自私，是能量管理的底层规律。
  - name: 自我边界系统——"不让别人介入你的心"
    core: 自我边界：心灵护城河系统
  - name: 实力法则——"弱时借势，强时无所谓"
    core: 外婆看待人际关系的底层逻辑——实力是一切关系的基石。
  - name: 意义苦难批判模型——"不要吃没意义的苦"
    core: 外婆对"吃苦"的重新定义，可能是这本书最犀利的观点
  - name: 认知觉醒五段路径
    core: 全书的结构本身就是一条可执行的成长路径
  counterintuitive:
  - title: '"让弱者以德报怨是一种邪恶"'
    claim: 大众认知：以德报怨是美德，宽容是高尚
  - title: '"延迟满足很多时候是自找苦吃"'
    claim: 大众认知：延迟满足是成功的必经之路，要忍得住才能得到的多
  - title: '"你不需要对自己的所有情绪负责——有些情绪是别人放进你心里的"'
    claim: 大众认知：我的情绪我做主，情绪管理是自己的事
  - title: '""无私"是一种危险的道德绑架"'
    claim: 大众认知：无私是最高尚的品质，要做一个不求回报的人
  - title: '"安贫乐道可能是极大的陷阱"'
    claim: 大众认知：安贫乐道是一种高尚的人生境界
  - title: '"不要让自己廉价——一旦接受了"廉价"的定位，麻烦就会找上你"'
    claim: 大众认知：做人要低调、不要太讲究、差不多就行
  - title: '"硬扛不是坚强，遇到问题想办法解决才是真的坚强"'
    claim: 大众认知：坚强=咬牙忍受，不叫苦不叫累
  - title: '"玩得越好的人，往往工作也越有效率"'
    claim: 大众认知：工作和玩是对立的，爱玩的人不靠谱
