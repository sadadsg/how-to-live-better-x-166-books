- book: 赢家的诅咒
  author: 理查德·塞勒（Richard H. Thaler，美国）
  category: 心理学与行为科学/幸福心理学
  file: 心理学与行为科学/幸福心理学/拆书笔记-《赢家的诅咒》.md
  frameworks:
  - name: 赢家诅咒模型（最核心的认知切换）
    core: 这是塞勒最经典的贡献
  - name: 公共价值 vs 私人价值
    core: 这是理解拍卖风险的基础
  - name: 信息瀑布模型（群体如何偏离真相）
    core: 第1人：根据私人信息出价
  - name: 禀赋效应在拍卖中的表现
    core: 拍卖中的禀赋效应
  - name: 沉没成本陷阱（越陷越深）
    core: 沉没成本陷阱
  - name: 最后通牒博弈与公平规范（The Ultimatum Game & Fairness）
    core: 是什么：最后通牒博弈——两人分一笔钱（比如100元），提议者出方案，回应者只能接受或拒绝；拒绝则两人一分不得。理性预测是"给1元也该接受（1>0）"，提议者应该拿走99元。实验结果却稳定相反：低于约三成的分法会被拒绝，而绝大多数提议者主动开出40%~50%。原
  - name: 过度反应与均值回归（Overreaction & Mean Reversion）
    core: 是什么：De Bondt 和 Thaler（1985）把纽约股市按过去3~5年的表现分组：过去表现最差的"输家组合"，未来3年跑赢过去表现最好的"赢家组合"约25%。原书"均值回归"章节从《体育画报》封面魔咒讲起——登上封面的明星运动员随后多半表现下滑：不是魔
  counterintuitive:
  - title: '"赢家可能是输家"'
    claim: 大众认知：赢了竞争就是成功。
  - title: '"竞争越激烈，诅咒越深"'
    claim: 大众认知：竞争激烈说明机会好。
  - title: '"信息多不一定好"'
    claim: 大众认知：信息越多，决策越好。
  - title: '"赢家诅咒不是概率问题，是必然"'
    claim: 大众认知：赢家诅咒是小概率事件。
  - title: '"避免赢家诅咒的方法是''不赢''"'
    claim: 大众认知：要赢就要参与竞争。
  - title: '"赢家诅咒适用于所有竞争"'
    claim: 大众认知：赢家诅咒只在拍卖中存在。
  - title: '"人会拒绝白拿的钱"'
    claim: 大众认知：白给的钱没人不要，拒绝的人一定傻。
  takeaway: '**竞争中的赢家往往支付超过价值的价格——真正的智慧是知道何时不赢。'
