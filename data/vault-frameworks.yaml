- book: 乌合之众
  author: '[法]古斯塔夫·勒庞（Gustave Le Bon, 1841-1931）'
  category: 心理学与行为科学/社会心理与影响
  file: 心理学与行为科学/社会心理与影响/拆书笔记-《乌合之众》.md
  frameworks:
  - name: 群体心智的诞生条件与三大特征
    core: 何为"心理群体"——不是物理聚集，而是有共同情感目标的一群人（如革命群众、陪审团、议会、粉丝群体、谣言传播链）。群体一旦形成，会表现出三大特征
  - name: 群体心智的运作机制——集体无意识与催眠机制
    core: 群体如何被驱动？勒庞提出催眠机制：领袖通过"断言+重复+传染"三步把暗示植入群体心智，群体像被催眠者一样执行。
  - name: 群体思维的特征——形象化、缺推理、强想象
    core: 群体的心智如何思考？勒庞说群体没有真正的推理能力，但有极强的想象力——这两者的结合产生一种独特的"思维模式"
  - name: 群体情感的三大特征——冲动、专横、极端化
    core: 群体的情感与个体情感截然不同——三个核心特征
  - name: 群体领袖与召唤方式
    core: 群体不是自组织的——它需要领袖。勒庞区分了两种领袖类型，并给出三大召唤工具
  - name: 文明与群体的轮回——少数精英 vs 群体力量
    core: 勒庞最锋利的论断——也是最易被误读的
  counterintuitive:
  - title: '"群体的智慧并不是个体的简单相加——它通常远低于个体"'
    claim: 大众认知：人多力量大，三个臭皮匠顶个诸葛亮。
  - title: '"群体既可能比个体更道德（纯真、英雄主义），也可能比个体更凶残"'
    claim: 大众认知：个体容易自私，群体更有道德感。
  - title: '"群体没有真正的推理能力——但有极强的想象力"'
    claim: 大众认知：群体能集体讨论出理性方案。
  - title: '"领袖不需要论证——只需要断言+重复+传染"'
    claim: 大众认知：好领袖靠理性论证说服大家。
  - title: '"名词和口号比论证更能让群体行动"'
    claim: 大众认知：讲清楚道理，群体就会行动。
  - title: '"文明是少数精英的产物，群体天然有破坏性"'
    claim: 大众认知：人民/群众是历史的创造者。
  - title: '"群体不是理性公民，是被无意识支配的动物——这是政治学的基础事实"'
    claim: 大众认知：现代民主建立在"理性公民"假设之上。
  - title: '"教育无法阻止群体心智——乌合之众的悲剧是文明的常态"'
    claim: 大众认知：教育普及=公民素质提升=群体理性化。
  takeaway: '**"群体不是个体的算术和——它是一个由无意识支配、对暗示感受性极强的全新心理实体；领袖通过断言+重复+传染塑造它，文明因此而生，也因此而灭。"'
