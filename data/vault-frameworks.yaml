- book: 从祖先到算法
  author: 约瑟夫·亨里奇
  category: 经济学与社会/社会与文化
  file: 经济学与社会/社会与文化/拆书笔记-《从祖先到算法》.md
  frameworks:
  - name: 文化累积模型（最核心的认知切换）
    core: 这是亨里奇最核心的贡献
  - name: 模仿学习框架（社会学习的基础）
    core: 模仿学习框架
  - name: 社会学习策略
    core: 社会学习策略
  - name: 文化-基因协同演化（双重继承）
    core: 文化-基因协同演化
  - name: 算法时代的文化演进
    core: 算法时代的文化演进
  - name: 分布式认知——智慧不在头脑中，在群体里
    core: 人类真正的"大脑"不是任何一个个体的头颅，而是整个物种的文化库。这是亨里奇论证"个体理性解释不了人类成功"的真正杀手锏。
  - name: 声望偏见 vs 从众偏见——我们模仿谁、模仿什么
    core: 社会学习的关键问题不是"我们会不会模仿"，而是"我们模仿谁、模仿什么"。亨里奇区分两类过滤器
  - name: 隐性知识与师徒传承——文化不是文档可以装下的
    core: 借鉴 Polanyi 的"我们知道的比能说出来的多"，亨里奇强调大量关键文化知识（手艺、狩猎、烹饪、社会礼仪）是不可言传的——必须通过长期近距离师徒关系才能传递。
  - name: 塔希提饿死案例——有文化不等于有"正确的文化"
    core: 亨里奇最有名的反直觉案例：塔希提岛民在 1770 年代英国探险队带来的猪、山羊、芒果等入侵物种面前，因文化禁忌和代际失传而无法食用，导致数百人饿死。
  - name: 生态位构建——文化改变环境，环境反向塑造文化
    core: 人类通过文化改变环境，被改变的环境反过来塑造下一代的文化。这是一个文化-环境的双向往返回路，是人类区别于其他物种的关键。
  counterintuitive:
  - title: '"人类成功不是因为个体智慧"'
    claim: 大众认知：人类成功是因为我们更聪明。
  - title: '"模仿不是缺陷，是优势"'
    claim: 大众认知：模仿是缺乏创造力。
  - title: '"个体理性解释不了人类成功"'
    claim: 大众认知：个体理性决定成功。
  - title: '"算法是文化演进的新形式"'
    claim: 大众认知：算法是文化的敌人。
  - title: '"现代人并不比古人更聪明"'
    claim: 大众认知：现代人比古人聪明。
  - title: '"文化演进可能超越基因演进"'
    claim: 大众认知：基因演进是主要的。
  - title: '"有文化不等于有正确的文化"'
    claim: 大众认知：有文化（=有规范/有禁忌/有礼仪）就是好的。
  - title: '"没有人是孤胆英雄，整个物种是一个分布式大脑"'
    claim: 大众认知：天才改变世界——爱因斯坦、牛顿、乔布斯。 亨里奇：即使最伟大的天才也是"站在巨人肩膀上"——他们接入的文化网络、受到的教育、参考的前人研究、所处的时代问题，都是他们"成功"的前提。**单独的个体大脑无法产生文明，整个物种的分布式认知才是文明的真正作者**。
  - title: '"人类真正的对手不是其他物种，是自己创造的环境"'
    claim: 大众认知：人类战胜了自然，征服了地球。
  takeaway: '**人类不是靠个体智慧成功，而是靠文化累积——算法是这一过程的新载体。'
