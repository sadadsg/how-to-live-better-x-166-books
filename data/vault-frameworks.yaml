- book: 如何对付蠢人
  author: '[法]马克西姆·罗维尔（Maxime Rovere）'
  category: 心理学与行为科学/社会心理与影响
  file: 心理学与行为科学/社会心理与影响/拆书笔记-《如何对付蠢人》.md
  frameworks:
  - name: 开篇三结论（Three Opening Observations）
    core: 开篇三结论（全书地基）
  - name: 斯宾诺莎决定论（Determinism）
    core: 核心命题：宇宙万物受因果律支配，不存在脱离自然规律的绝对自由意志。
  - name: 蠢人之网（The Net of Stupidity）
    core: 你遇到一个"蠢人"
  - name: 伦理生态学（Ethical Ecology）
    core: 传统思维：  蠢人 = 道德罪人 → 审判 → 惩罚/改造
  - name: Conatus 与战略性撤退（Strategic Withdrawal）
    core: 斯宾诺莎的 conatus：每个生命体都在努力保持和扩展自身的存在
  - name: 道德权威的悖论（Moral Authority Paradox）
    core: 道德的进化功能：
  - name: 愚蠢的传染与社会动力学
    core: 为什么蠢人更喜欢破坏？
  counterintuitive:
  - title: '"你越想消灭愚蠢，就越深陷冲突"'
    claim: 大众认知：遇到蠢人就该据理力争、教育纠正，真理越辩越明。
  - title: '"愚蠢没有旁观者，只有同谋犯"'
    claim: 大众认知：我是聪明人，我在旁边看着蠢人犯蠢，我和他们不一样。
  - title: '"最大的蠢人是我们自己"'
    claim: 大众认知：世界上存在明确的蠢人和聪明人之分，我属于后者。
  - title: '"道德是人际互动的毒药"'
    claim: 大众认知：道德是好的，用道德标准评判对错天经地义。
  - title: '"讲道理是最无效的策略"'
    claim: 大众认知：只要我逻辑严密、证据充分，对方就应该被说服。
  - title: '"你整天泡茶读书不叫修养，面对蠢人不被拖下水才叫"'
    claim: 大众认知：修养是在安静环境下培养出来的个人品质。
  - title: '"主动缔结和平，让蠢人自己去争斗"'
    claim: 大众认知：遇到冲突就该争个对错，逃避是懦弱。
  - title: '"愚蠢是相对的——你觉得别人蠢，别人也觉得你蠢"'
    claim: 大众认知：蠢就是蠢，有一个客观标准。
  takeaway: 蠢人不是用来改变的，是用来导航的——你改变不了地形，但你可以改变路线。
