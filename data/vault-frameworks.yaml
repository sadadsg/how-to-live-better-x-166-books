    claim: 大众认知：经济数据好股市就该涨，股市上涨说明经济现在很好。
  - title: '"庄家无法操纵基本趋势"'
    claim: 大众认知：A股涨跌都是庄家和主力操纵的结果，散户只是韭菜。
  - title: '"最危险的走势不是暴跌，而是次级折返"'
    claim: 大众认知：暴跌最可怕，躲过暴跌就能保住利润。
  - title: '"日间波动无需预测，也不可预测"'
    claim: 大众认知：高手能看懂每天的盘口，每天做T才能赚大钱。
  - title: '"年赚12%的人，跑赢想每周赚50%的人"'
    claim: 大众认知：来股市就是要抓涨停、快速翻倍。
  - title: '"专家知道的没有他们表现出来的那么多"'
    claim: 大众认知：财经专家、机构研报掌握着普通人接触不到的信息和洞察。
  - title: '"投机消亡之时，就是国家消亡之日"'
    claim: 大众认知：投机是市场的毒瘤，投机者是社会的寄生虫。
  takeaway: 股市是未来的晴雨表——读懂基本运动，无视日间噪音，在次级折返中进场。
