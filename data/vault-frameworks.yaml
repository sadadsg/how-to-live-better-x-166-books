- book: 福格行为模型
  author: B.J.福格（B.J. Fogg，美国，斯坦福大学行为设计实验室创始人）
  category: 心理学与行为科学/行为设计
  file: 心理学与行为科学/行为设计/拆书笔记-《福格行为模型》.md
  frameworks:
  - name: B=MAP 行为公式（核心模型）
    core: 行为（Behavior）= 动机（Motivation）× 能力（Ability）× 提示（Prompt）
  - name: 行为线上方与下方模型
    core: ║   行为线以上   ║  ← 动机足够高时，难事也能做
  - name: 三步行为设计法
    core: 第一步：明确愿望（Clarify Aspiration）
  - name: MAP 诊断清单（行为设计工具）
    core: 当一个行为没有发生时，用这个清单诊断
  - name: 微习惯（Tiny Habits）模型
    core: 微习惯 = 当前习惯（锚点） + 新行为（微小版）
  - name: 庆祝与情绪编程
    core: 行为发生 → 立即庆祝 → 大脑释放多巴胺
  - name: 行为设计七步法（完整流程）
    core: ''
  counterintuitive:
  - title: '"感觉好比感觉对更重要"'
    claim: 大众认知：改变应该是严肃的、痛苦的、"对"的——自律就意味着克制和忍耐。
  - title: '"动机是不可靠的，能力才是设计的杠杆"'
    claim: 大众认知：改变失败是因为我动机不够强——如果我足够想要，就能做到。
  - title: '"意志力不是用来开始习惯的，是用来结束习惯的"'
    claim: 大众认知：开始一个新习惯需要意志力——我需要逼自己去做。
  - title: '"庆祝不是奖励，是编程"'
    claim: 大众认知：庆祝是做完好事之后给自己的奖赏——等习惯养成了再庆祝。
  - title: '"成功比失败更值得分析"'
    claim: 大众认知：改变失败了要复盘——找到哪里做错了，下次避免。
  - title: '"你不需要等到想做才做"'
    claim: 大众认知：等我有动力了再开始——强迫自己做没感觉的事是痛苦的、不可持续的。
  - title: '"提示比动机更关键"'
    claim: 大众认知：我要养成习惯，最重要的是保持动力和自律。
  takeaway: 改变不是靠更大决心，而是靠更小的行为——小到不可能失败，就是真正的开始。
