    core: 的企业/行业
  - name: 经济护城河（Economic Moat）
    core: 巴菲特最著名的投资筛选标准——什么样的企业值得长期持有
  - name: 安全边际（Margin of Safety）
    core: 企业的内在价值（你估算的合理价格）
  - name: 资本配置（Capital Allocation）——CEO的核心能力
    core: 巴菲特认为大多数CEO不懂资本配置，这是他们最大的失职
  - name: 浮存金模型（The Float Model）——保险业的终极杠杆
    core: 浮存金运作机制
