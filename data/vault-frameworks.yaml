    core: 希尔在全书最后列出了他认为阻止大多数人成功的"六个恐惧"——这些恐惧需要在做任何事情之前解决
  - name: 想象力工厂（Imagination）
    core: 与现有框架2的分工：框架2把"想象力"列为13步骨架第5项，只有一行；本框架展开这一项——点子是怎么被生产出来、又怎么变成钱的。递进关系：框架3解决"信念怎么编程"，本框架解决"想法从哪来"——想象力是13步体系里把"思考"变成"财富"的第一道转化工序。
  - name: 计划与领导力（Organized Planning）
    core: 与现有框架2的分工：框架2是13步全景骨架（地图），本框架展开骨架第6步"系统计划"这一环——点子怎么变成可执行的组织动作。递进关系：框架6的想象力负责"生产点子"，本框架负责"落地点子"；框架4的智囊团出人脑，计划把人脑组织成行动。
  counterintuitive:
  - title: '"任何你心里能清楚想象并真正相信的东西，你都能实现"'
    claim: 大众认知：现实是现实的，想象是想象，两者有严格界限。
  - title: '"不劳而获是最危险的陷阱"'
    claim: 大众认知：我"想要"发财，但最好不用太辛苦。
  - title: '"专业知识不需要多，需要精准"'
    claim: 大众认知：要学习——学得越多越好，知识面越广越好。
  - title: '"成功的人做决定快，改变决定慢；失败的人做决定慢，改变决定快"'
    claim: 大众认知：要慎重决策，慢思考、多权衡。
  - title: '"失败是一种伪装的祝福"'
    claim: 大众认知：失败了就是输了，意味着你不行。
  - title: '"第六感是最强大的——但你必须走完前面12步才能使用它"'
    claim: 大众认知：灵感、直觉、创意——有些人天生就有，有些人没有。
  - title: '"真正阻止你的不是能力不足，是六个你不能直接看到的恐惧"'
    claim: 大众认知：我做不成大事是因为我没有资源/关系/运气/能力。
  takeaway: '**你头脑中能清楚想象并真正相信的东西，你就能亲手让它成为现实。'
