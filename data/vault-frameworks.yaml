  frameworks:
  - name: 个人经历过滤器（Personal Experience Filter）
    core: 全书的地基，解释了为什么人们对金钱的理解如此不同
  - name: 运气与风险双生体（Luck & Risk Twins）
    core: 运气与风险：同一台抽奖机
  - name: 永不知足陷阱（The Never-Enough Trap）
    core: 永不知足的进化路径
  - name: 复利的反直觉（Confounding Compounding）
    core: 巴菲特的复利时间线
  - name: 致富 vs 守富（Getting Wealthy vs Staying Wealthy）
    core: 两个不同的游戏
  - name: 尾部效应（Tails, You Win）
    core: 尾部效应决定一切
  - name: 自由是金钱的最大红利（Freedom Dividend）
    core: 金钱的真正回报
  - name: 财富是你看不见的东西（Wealth is What You Don't See）
    core: 豪车悖论 + 看不见的财富
  - name: 储蓄率（The Savings Rate）
    core: 储蓄率 = 唯一100%可控变量
  - name: 大体合理胜于绝对理性（Reasonable > Rational）
    core: '"大体合理"胜过"绝对理性"'
  - name: 容错空间（Room for Error）
    core: 安全边际 = 为计划不成做准备
  - name: 你会变（You'll Change）
    core: 长期规划的根本困难
  - name: 悲观主义的诱惑（The Seduction of Pessimism）
    core: 为什么悲观听起来更聪明？
  - name: 你会相信任何事（When You'll Believe Anything）
    core: 诱人虚构（Folklore）
  - name: 框架间的关系图
    core: 个人经历过滤器（地基）
  counterintuitive:
  - title: '"致富和守富是两种完全不同的技能"'
    claim: 大众认知：会赚钱的人自然会守住钱。
  - title: '"你的储蓄率比你的投资回报率更重要"'
    claim: 大众认知：投资赚钱的关键是找到高回报的投资品。
  - title: '"复利最大的特点是没有明显的感觉"'
    claim: 大众认知：复利很厉害，我知道——所以我要找年化20%的投资。
  - title: '"没有人真的对金钱失去理智"'
    claim: 大众认知：有些人就是贪婪、愚蠢、不理性。
  - title: '"悲观主义在短期有保护作用，但在长期是有害的"'
    claim: 大众认知：谨慎=悲观=聪明。
  - title: '"你今天制定的50年计划，未来的你大概率不同意"'
    claim: 大众认知：制定长期计划并坚持执行是成功的关键。
  - title: '"波动是费用，不是罚单"'
    claim: 大众认知：投资亏损=我做错了什么。
  - title: '"财富是你没有花掉的钱"'
    claim: 大众认知：有钱人=开豪车、住豪宅、穿名牌。
  takeaway: 财富不是数学题，是行为题——你和钱的关系，90%取决于你和自己的情绪如何相处。
