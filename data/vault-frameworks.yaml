- book: 幸福之路
  author: 伯特兰·罗素（Bertrand Russell，英国）
  category: 心理学与行为科学/心理哲学
  file: 心理学与行为科学/心理哲学/拆书笔记-《幸福之路》.md
  frameworks:
  - name: 不幸福的十大病因诊断模型
    core: 罗素把不幸福拆解为十大病因，每一种都是一种"注意力的扭曲"——把心理能量错误地投向了自我内部而非外部世界。
  - name: 幸福的三支柱转换模型
    core: 罗素认为幸福不是一种"追求"的结果，而是一种"转换"的结果——把注意力从自我转向三个外部支柱。
  - name: 兴趣─无聊光谱
    core: 无聊/兴奋瘾（焦虑）                      真正的兴趣（宁静）
  - name: 工作的双维度模型
    core: 工作的外在价值（收入、地位、安全感）
  - name: 爱情与家庭的幸福架构
    core: 罗素认为爱情是幸福最重要的来源，但区分了不同层次
  - name: 舆论独立性培养模型
    core: 舆 论 恐 惧 的 四 层 结 构
  - name: 疲劳的双重结构
    core: 罗素区分了两种截然不同的疲劳
  - name: 幸福悖论
    core: 幸 福 悖 论
  counterintuitive:
  - title: '"追求幸福的人最不幸福"'
    claim: 大众认知：幸福是人生最重要的目标，应该主动追求。 作者/罗素：一个人越是把幸福当作直接目标，越是得不到幸福。幸福是一种副产品——当你全心投入外部事物时，它自然降临。
  - title: '"现代人的无聊是刺激太多造成的"'
    claim: 大众认知：无聊是因为生活太单调、缺乏刺激。 作者/罗素：无聊的反面不是兴奋，而是兴趣。真正的问题不是生活太单调，而是你的兴奋阈值太高——你已经对刺激上瘾，对平凡事物失去了感知力。
  - title: '"竞争是不幸福的头号病因"'
    claim: 大众认知：竞争推动进步，适度竞争是健康的。 作者/罗素：把人生当作一场与他人的竞赛，是现代人不幸福的第一大病因。竞争让你永远在比较，永远不够好，永远焦虑。更致命的是，竞争把"赢"变成了目的本身，让你忘了问"我到底想要什么"。
  - title: '"自我分析越深，可能越不幸福"'
    claim: 大众认知：了解自己是成长的前提，自我觉察越深越好。 作者/罗素：适度的自我觉察有益，但过度的自我分析是一种病理——它让你把注意力持续锁定在自我内部，强化了"自我沉溺"。很多人越分析自己，越觉得自己有问题，越焦虑。
  - title: '"爱的最高形式不是''被爱''，而是''去爱''"'
    claim: 大众认知：幸福的爱情是找到一个爱你的人。 作者/罗素：在爱情中，"被爱"是自我中心的——你在索取关注和确认。"去爱"才是幸福的来源，因为它把你从自我中解放出来，让你的注意力自然地流向另一个人。
  - title: '"恐惧舆论的人活在一个不存在的监狱里"'
    claim: 大众认知：社会压力是真实的、无法逃避的。 作者/罗素：大多数人害怕的"舆论"其实根本不存在——他们害怕的是一个想象中的"大家都在看我"的场景。事实上，每个人都在忙着担心别人怎么看自己，根本没时间看你。
  - title: '"幸福的人不怕无聊"'
    claim: 大众认知：幸福的人生活一定很精彩，不会无聊。 作者/罗素：真正幸福的人反而能享受无聊。他们不需要持续的刺激来维持存在感，因为他们对世界有一种安静的好奇心——即使什么都没发生，他们也不会恐慌。
  - title: '"罪恶感是文明的自我攻击武器"'
    claim: 大众认知：有罪恶感说明你有道德感，是好事。 作者/罗素：过度的罪恶感不是道德，是病态——它是你的道德标准内化为一个永不满足的审判官，用"你不够好"来持续消耗你的心理能量。罪恶感让人把注意力锁死在自我内部，既不能真正改变行为（因为标准永远在提高），也不能享受生活（因为总觉得不配）。
  takeaway: 幸福不在你身上——你越盯着自己，越看不见它；你一转头看向世界，它就站在那里。
