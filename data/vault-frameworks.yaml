- book: 火眼金睛读财报
  author: 张新民（中国·对外经济贸易大学教授，战略视角财务分析框架创立者）
  category: 财商与投资/财务分析与财报解读
  file: 财商与投资/财务分析与财报解读/拆书笔记-《火眼金睛读财报》.md
  frameworks:
  - name: 分 利润表：远离造假重灾区
    core: 关键联动
  - name: 分 资产负债表：辨别财力虚实
    core: 资产 ＝ 负债 ＋ 所有者（股东）权益
  - name: 分 现金流量表：解开企业"死亡之谜"
    core: 1. 经营活动几乎丧失产生正向现金流量的能力
  - name: 分 解析三张表：看穿发展前景
    core: 母公司报表 → 战略的发起端（总部在想什么？资源往哪里投？）
  - name: 分 三表勾稽与交叉验证：给财报装上"测谎仪"
    core: 是什么：三张表不是三份独立报告，而是同一笔资金运动的三个切面。表与表之间存在必须"对得上"的钩子——勾稽关系。任何一张表被单独粉饰，都会在另外两张表上留下对不上的裂缝。
  - name: 分 行业与商业模式定结构：同一张表，不同的好
    core: 是什么：同一个数字，在不同行业里含义完全不同。战略视角财务分析的落点：报表结构是商业模式的X光片——企业怎么赚钱，就会长成什么样的三张表。
  - name: 分 从读报到决策：把三张表变成买卖动作
    core: 是什么：财报分析的终点不是"看懂"，而是"行动"。把本书25个工具压缩成一条决策链：三道闸门依次过滤，被任何一道拦下的企业都不进入下一关。
  counterintuitive:
  - title: '"盈利≠赚钱，两码事"'
    claim: 大众认知：企业利润高就是赚钱了。
  - title: '"账上钱太多，也是风险"'
    claim: 大众认知：现金越多越安全。
  - title: '"资不抵债的企业不一定死"'
    claim: 大众认知：资不抵债=破产。
  - title: '"负债不一定是坏事，关键看性质"'
    claim: 大众认知：负债越少越好。
  - title: '"高商誉=定时炸弹"'
    claim: 大众认知：商誉是无形资产，是企业价值的一部分。
  - title: '"利润结构比利润总量更重要"'
    claim: 大众认知：利润越高越好。
  - title: '"合并报表与母公司报表的差异暴露战略"'
    claim: 大众认知：合并报表是公司整体情况，看一个就够了。
  - title: '"资产负债率高不可怕，债务结构才是命门"'
    claim: 大众认知：资产负债率高的公司随时可能爆雷。
  - title: '"资产要''动''才值钱，趴着不动就是贬值"'
    claim: 大众认知：资产越多越好，尤其是设备和房产这类硬资产。
  takeaway: 利润表是面子，资产负债表是底子，现金流量表是命——看懂三张表的联动，就看穿了一家企业的全部真相。
