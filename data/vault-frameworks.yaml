    core: 斯密用大头针工厂的例子，揭示了经济学的核心洞察
  - name: 看不见的手——自利如何导向公益
    core: 这是全书最著名的概念，也是最常被误读的概念
  - name: 自然价格与市场价格——市场的自我调节机制
