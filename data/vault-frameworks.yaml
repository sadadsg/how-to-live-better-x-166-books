- book: 一万小时天才理论
  author: '[美]丹尼尔·科伊尔（Daniel Coyle）'
  category: 个人效能与习惯/认知与学习
  file: 个人效能与习惯/认知与学习/拆书笔记-《一万小时天才理论》.md
  frameworks:
  - name: 髓鞘质模型（The Myelin Model）
    core: 这是全书的生物学基础——理解了这个，才能理解其他所有框架
  - name: 天才三角——精深练习×激情×教练（The Talent Code Triangle）
    core: 这是全书的元框架，三大要素缺一不可
  - name: 精深练习三步法（Deep Practice Loop）
    core: 选择一个微技能块
  - name: 激情点燃模型（The Ignition Model）
    core: 精深练习是引擎，但引擎需要燃料。燃料来自"点燃时刻"——一个触发你愿意投入大量时间做精深练习的情感事件。
  - name: 大师指导的五个角色（Five Roles of a Master Coach）
    core: 分解者    镜子女王   加速器    情绪锚    标准制定者
  - name: 人才温床效应（The Talent Hotbed Effect）
    core: 是什么：科伊尔走访了全球多个"人才温床"——巴西圣保罗的五人制足球场、莫斯科的斯巴达克网球俱乐部、阿迪朗达克山里的草山音乐学院、韩国女子高尔夫、库拉索与多米尼加的棒球、KIPP特许学校、勃朗特姐妹的家庭书房、文艺复兴时期的佛罗伦萨。这些地方地理、文化、资源截然
  - name: 髓鞘质的年龄窗口（The Myelin Window）
    core: 是什么：髓鞘质的生长不是匀速的。大脑在童年经历一段"疯长期"——先超量生成神经连接，再按"用进废退"修剪包裹；青春期迎来第二轮包裹高峰（前额叶最后成熟）；成年后生长减速但并不停止——科伊尔在尾声引用的研究显示，髓鞘质总量的增长可以一直持续到四五十岁。窗口的本质
  counterintuitive:
  - title: '"天才不是天生的——是''养''出来的"'
    claim: 大众认知：莫扎特、费德勒、迈克尔·乔丹——这些人天生有特殊基因，普通人再怎么练也追不上。
  - title: '"犯错不是坏事——犯错是髓鞘质生长的信号"'
    claim: 大众认知：练习的目的是减少错误，做得对、做得好。犯错意味着你不行、不够好。
  - title: '"慢比快更有效——想变快，先变慢"'
    claim: 大众认知：熟能生巧——重复次数越多，速度越快。想快就多练，加快速度练。
  - title: '"一万小时不是真理——精深度比时长重要100倍"'
    claim: 大众认知：格拉德威尔说"一万小时定律"——一个人只要投入一万小时的练习，就能成为世界级专家。
  - title: '"点燃比方法论更重要——没有激情，精深练习无法持续"'
    claim: 大众认知：学习方法最重要——只要方法对了，普通人就能坚持。
  - title: '"好的教练不是在教——是在帮你加速犯错"'
    claim: 大众认知：好教练是最好的老师——他们知识渊博、讲解清晰、示范完美。
  - title: '"你不是在学技能——你是在建造神经高速公路"'
    claim: 大众认知：学技能是"记住怎么做"——是大脑中的某种知识存储。
  takeaway: 天才不是天生的，是练出来的——但秘诀不在时长，而在你怎么犯错。
