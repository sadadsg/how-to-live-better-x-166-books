- book: 蛤蟆先生去看心理医生
  author: '[英] 罗伯特·戴博德（Robert de Board）'
  category: 心理学与行为科学/情绪与内耗
  file: 心理学与行为科学/情绪与内耗/拆书笔记-《蛤蟆先生去看心理医生》.md
  frameworks:
  - name: 自我状态三模型（PAC模型）
    core: 这是全书的核心理论——TA沟通分析心理学的基础
  - name: 人生坐标四象限
    core: 蛤蟆和苍鹭探索出的"人生坐标"——你如何看待自己和他人
  - name: 心理游戏模型
    core: 人们无意识玩的"心理游戏"——看似在沟通，其实在重复童年模式
  - name: 咨询过程十阶段
    core: 蛤蟆的10次咨询，是一个完整的心理疗愈过程
  - name: 情绪温度计
    core: 衡量你当前"自我状态"的工具
  - name: 自我批判共谋模型（"秘密协议"）
    core: 是什么：出自第9章"秘密协议"。苍鹭对蛤蟆说：我用"共谋"是想说——"你偷偷地或无意识地配合对方，来给自己制造不快。"蛤蟆被獾当面贬低后，第一反应不是愤怒，而是抢先认错、自我贬低——他替獾把批评"稳稳接住"了。所谓共谋，就是配合外部批评者一起完成对自己的攻击。
  - name: 情商三要素模型（独立→共生）
    core: 是什么：最后一次咨询，苍鹭给出情商的三要素——不是社交技巧，而是一套情感能力的递进闭环
  counterintuitive:
  - title: '"抑郁不是性格缺陷，而是童年模式的延续"'
    claim: 大众认知：抑郁是因为"想太多"、"太脆弱"、"性格不好"。
  - title: '"心理游戏的''赢家''是那个''输''的人"'
    claim: 大众认知：没有人喜欢"输"。
  - title: '"能帮你的人是你自己，也只有你自己"'
    claim: 大众认知：心理咨询师能"治愈"你。
  - title: '"没有一种批判比自我批判更强烈"'
    claim: 大众认知：别人的批评最伤人。
  - title: '"愤怒是你的权利，不是你的错误"'
    claim: 大众认知：愤怒是不好的，应该控制。
  - title: '"真正的成长不是变得''成熟''，而是能够选择"'
    claim: 大众认知：成熟就是"不情绪化"。
  - title: '"你不需要被所有人喜欢"'
    claim: 大众认知：被喜欢是重要的。
  takeaway: 你不是不快乐，你是在用童年的模式回应成年的世界——看见它，才能选择不玩了。
