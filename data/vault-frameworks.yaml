- book: 进化心理学：心理的新科学
  author: '[美]戴维·M·巴斯（David M. Buss）'
  category: 心理学与行为科学/进化心理学
  file: 心理学与行为科学/进化心理学/拆书笔记-《进化心理学》.md
  frameworks:
  - name: 心理模块化与领域特殊性（Domain Specificity）
    core: 核心论点：心智不是通用的「智能处理器」，是大量领域特殊（domain-specific）的适应器。面孔识别模块只管面孔，对其他物体的识别速度慢得多；择偶模块只对潜在配偶产生偏好反应；欺诈检测模块专门识别「违反互惠规则」的行为者。
  - name: 进化认知与适应器逻辑（Cognitive Adaptations）
    core: 核心循环：问题 → 自然选择 → 机制 → 当代表达。每一步都不能跳过。
  - name: 择偶与两性心理机制（Mate Selection）
    core: 核心论断
  - name: 合作、攻击与等级心理（Cooperation, Aggression, Status）
    core: 核心论断
  - name: 亲属关系与亲代投资（Kin Selection & Parental Investment）
    core: 核心论断
  - name: 情绪、动机与人格的进化解释
    core: 对 Big Five 人格的进化解读
  - name: 进化陷阱 / 错配（Evolutionary Mismatch）
    core: 原书 Part V（Integration）一整块讲「健康」和「临床应用」，核心就是 mismatch——现代环境与 EEA（Environment of Evolutionary Adaptedness）错位。这是把前 6 框架的「机制 → 当代痛苦」连接起
  - name: 生存与威胁检测（Survival & Threat Detection）
    core: 原书 Part II 一整块讲生存，是进化心理学最被低估的支柱。现有 6 框架全部集中在「社会/择偶/亲属」维度，完全缺失「个体如何在物理世界中活下来」这一层。这是 6 框架里最大的结构性缺口。
  - name: 认知偏差的进化解释（Evolution of Cognitive Biases）
    core: Kahneman-Thaler 等行为经济学家对「人类非理性」的描述，离不开「为什么人类要进化出非理性」的解释。「偏差不是 bug，是 feature」——这是进化心理学对行为经济学的关键重写，也补上了原书 Part II - Cognition 章节。
  counterintuitive:
  - title: '"你以为的''性格''其实是模块化适应器的组合"'
    claim: 大众认知：性格是连续统一的内核（我是外向/内向/敏感/完美主义），需要找本我、寻认同、做整合。 巴斯/作者观点：性格不是连续内核，是大量**领域特殊适应器的统计输出**。所谓「我是一个内向的人」是「我的威胁检测模块、社交联盟模块、地位追求模块相对较强或较弱」的简化叙事。
  - title: '"文化不是心理的对立面，是适应器的环境输入"'
    claim: 大众认知：文化 vs 本能，二元对立——「这是文化教的」「这是天性使然」是互斥的解释。
  - title: '"理性不是进化的高级产物，是模块协调器的副产品"'
    claim: 大众认知：理性 = 高级脑战胜低级脑（理智战胜情感）。
  - title: '"择偶偏好的跨文化一致性远比文化相对论承认的高"'
    claim: 大众认知：「不同文化有完全不同的择偶观」「中国人重物质，西方人重爱情」。
  - title: '"亲属偏爱不是道德高尚，是亲缘选择计算"'
    claim: 大众认知：「家人就是亲近是美德」「亲情是天然的」「外人终究是外人」。
  - title: '"嫉妒的性别差异不是社会化结果，是适应问题的不同"'
    claim: 大众认知：「男人更不能接受出轨，女人更不能接受分心是社会化结果」「应该通过教育消除这种差异」。
  - title: '"攻击不是失败者的反应，是收益大于成本时的理性计算"'
    claim: 大众认知：攻击 = 失控/缺教养/低自尊/道德败坏。
  - title: '"心理疾病可能是适应器的''失调''，不是单纯的''病''"'
    claim: 大众认知：抑郁/焦虑/成瘾 = 大脑出故障 = 需要药物修复。
  takeaway: '**心理是一组为解决祖先问题而设计的模块——读懂模块，比读懂自己更接近真相。'
