- book: 不原谅也没关系（皮特·沃克版）
  author: 皮特·沃克（Pete Walker，美国，心理治疗师，C-PTSD领域开创者）
  category: 生命哲学与死亡/生老与告别
  file: 生命哲学与死亡/生老与告别/拆书笔记-《不原谅也没关系（皮特·沃克版）》.md
  frameworks:
  - name: 悲伤的非线性模型（Non-Linear Grief Model）
    core: 传统认知（阶段模型）：
  - name: 积极思维暴政（Tyranny of the Positive）
    core: 积极思维暴政的运作机制
  - name: 悲伤崩溃（Grief Burst）模型
    core: 悲伤崩溃（Grief Burst）
  - name: 见证 vs 修复（Witnessing vs Fixing）
    core: 人们面对你的悲伤时的两种反应模式
  - name: 悲伤 vs 抑郁的区分模型
    core: 关键洞察：很多人把悲伤误认为抑郁，试图用抗抑郁药"治好"悲伤。但悲伤不是疾病，不需要被治愈。悲伤需要被经历，抑郁才需要被治疗。
  - name: 沃克的十项哀伤原则
    core: ''
  counterintuitive:
  - title: '"积极思维是悲伤者最大的敌人"'
    claim: 大众认知：面对悲伤，应该积极乐观、向前看、保持正能量。
  - title: '"悲伤没有阶段，也没有终点"'
    claim: 大众认知：悲伤有五个阶段（否认、愤怒、讨价还价、抑郁、接受），走完就好了。
  - title: '"你不需要原谅才能释怀"'
    claim: 大众认知：释怀的前提是原谅——你不原谅，就永远被困在痛苦中。 参见：[[拆书笔记-《不原谅也没关系》]]（理微尘版）中"原谅迷思破解模型"——两位作者从不同角度得出了相同结论：**原谅不是疗愈的必经之路。**
  - title: '"悲伤崩溃不是退步，是进步的标志"'
    claim: 大众认知：如果你突然又哭了、又崩溃了，说明你"还没走出来"、"之前的好转是假的"。
  - title: '"最好的陪伴是不说话"'
    claim: 大众认知：面对悲伤的人，要说点什么来安慰他们——"一切都会好的"、"他/她在更好的地方"、"你要坚强"。
  - title: '"悲伤储存在身体里，不在脑子里"'
    claim: 大众认知：悲伤是一种情绪，用"想通了"就能解决。
  - title: '"孤独感比悲伤本身更致命"'
    claim: 大众认知：悲伤的主要痛苦来自丧失本身。
  takeaway: 悲伤不需要被治愈，它需要被允许——被你允许，也被身边的人允许。
