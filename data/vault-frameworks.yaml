  - name: 学习方法论
    core: 读书 → 思考 → 实践 → 反思 → 再学习
  - name: 人格培养模型
    core: 人格培养模型
  - name: 平等起点模型（Equal Start Model）
    core: 是什么：开篇第一句"天不生人上之人，不生人下之人"。福泽先立一个坚硬的前提：人人权利（本分）平等——没有人天生配居人上或居人下。但他同时承认另一个现实：世上明明白白有贫富贵贱智愚之别——境遇不平等。这个框架的全部机制，都在处理"前提与现实"之间的这道缝。
  - name: 怨尤转化模型（Resentment Detox）
    core: 是什么：境遇不平等会自动生成怨气：不如人时怨天（怪时代、怪出身），被压制时尤人（怪上司、怪社会）。福泽把怨定性为"毒药"：它不改变境遇分毫，却精确消耗掉本可用于实学的全部精力。
  counterintuitive:
  - title: '"学问的价值在于实用"'
    claim: 大众认知：学问的价值在于知识本身。
  - title: '"独立比成功更重要"'
    claim: 大众认知：成功是目标。
  - title: '"学历不等于能力"'
    claim: 大众认知：学历是能力的证明。
  - title: '"知行必须合一"'
    claim: 大众认知：知道就够了。
  - title: '"品德比知识更重要"'
