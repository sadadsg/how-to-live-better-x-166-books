- book: 幸福的陷阱
  author: 路斯·哈里斯（Russ Harris，澳大利亚）
  category: 心理学与行为科学/情绪与内耗
  file: 心理学与行为科学/情绪与内耗/拆书笔记-《幸福的陷阱》.md
  frameworks:
  - name: 幸福的陷阱——为什么追求快乐反而制造痛苦
    core: 社会文化灌输的信念：
  - name: ACT六大核心过程
    core: ACT 六大核心过程
  - name: 解离——与想法拉开距离
    core: 解 离（Cognitive Defusion）
  - name: 扩展——为情绪腾出空间
    core: 扩展/接纳（Expansion/Acceptance）
  - name: 联结——活在当下
    core: 联结/活在当下（Connection）
  - name: 以己为景——观察性自我
    core: 以己为景/观察性自我（Self-as-Context）
  - name: 价值——你的指南针
    core: 价 值（Values）
  - name: 承诺行动——带着不适感前进
    core: 承诺行动（Committed Action）
  - name: 创造性绝望——当旧方法全部失败时
    core: 创造性绝望（Creative Hopelessness）
  - name: ACT的终极公式
    core: 心理灵活性公式
  counterintuitive:
  - title: '"追求幸福本身就是幸福的陷阱"'
    claim: 大众认知：幸福是人生最重要的目标，应该主动追求。
  - title: '"你不需要''感觉好''才能''活得好''"'
    claim: 大众认知：要先感觉好，才能做好事。
  - title: '"负面情绪不是你的敌人——是你的信使"'
    claim: 大众认知：焦虑、恐惧、悲伤是"坏的"，应该消除。
  - title: '"控制情绪的尝试本身就在制造更多情绪"'
    claim: 大众认知：情绪管理 = 控制情绪。
  - title: '"你不是你的想法——你比你的想法更大"'
    claim: 大众认知：我的想法就是"我"。如果我想到"我很失败"，那我就是失败的。
  - title: '"幸福不是没有痛苦——是与痛苦共处的能力"'
    claim: 大众认知：幸福的人不痛苦。
  takeaway: 幸福不是消除痛苦——是带着痛苦，依然朝着对你重要的方向前进。
