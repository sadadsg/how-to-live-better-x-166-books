- book: 芯片战争
  author: 克里斯·米勒（Chris Miller，美国）
  category: 科技与创新/产业分析
  file: 科技与创新/产业分析/拆书笔记-《芯片战争》.md
  frameworks:
  - name: 芯片权力金字塔（Chip Power Pyramid）
    core: 半导体产业的权力结构——从沙子到超级大国的完整链条
  - name: 摩尔定律的双重性质（Moore's Law as Law of Physics AND Law of Economics）
    core: 摩尔定律不只是技术预测，它是经济规律和政治规律的叠加
  - name: 芯片战争的三大战场（Three Theaters of Chip War）
    core: 芯片战争的三大战场
  - name: 芯片产业的"赢家通吃"悖论（Winner-Take-All Paradox）
    core: 芯片产业的"赢家通吃"悖论
  - name: 五角大楼第一客户与模仿陷阱（The Pentagon as First Customer & the Copying Trap）
    core: 与现有框架1的分工：框架1画出权力金字塔"长什么样"，本框架回答它"为什么长成这样"——产业起源期的需求方决定了日后的权力分布。框架2讲供给侧规律（摩尔定律），本框架补需求侧的孵化机制。对应原书第一部 Cold War Chips。
  - name: 霸权护持剧本（The Hegemon's Playbook）
    core: 与现有框架3的分工：框架3是三大战场的静态地图，本框架是一份动态剧本——当挑战者逼近霸主时，霸主按什么顺序出什么牌。框架4解释垄断如何形成，本框架解释垄断如何被政治力量挑战、又如何被护持。对应原书第三部 Leadership Lost（美日半导体战）。
  - name: 卡脖子工程学与出口管制武器化（The Chokepoint Doctrine）
    core: 与现有框架3、4的分工：框架3把"供应链控制"列为战场之一（只知道有这张牌），框架4解释单点垄断的经济成因，本框架深入武器机制——瓶颈如何被工程化地设计出来、再被法律化成武器、以及如何反噬持刀者。对应原书第四、五部（ASML与EUV、华为制裁、中国的挑战）。
  counterintuitive:
  - title: '"最先进的技术不在实验室，而在工厂里"'
    claim: 大众认知：科技进步靠科学家在实验室里发明新东西。 作者/Chris Miller：半导体的进步靠的不是实验室突破，而是工厂里的工程优化——把已知的物理原理，在纳米尺度上稳定地量产出来。
  - title: '"芯片禁运比贸易战更有效，但也更危险"'
    claim: 大众认知：经济制裁是大国博弈的终极武器。 作者/Chris Miller：芯片禁运比传统经济制裁更精准、更有效——因为芯片是不可替代的。但它也更危险——因为它可能迫使被制裁国走向军事冒险。
  - title: '"台湾的真正武器不是导弹，是晶圆厂"'
    claim: 大众认知：台湾的防御靠的是美国军事保护和自己的导弹。 作者/Chris Miller：台湾的真正防御是"硅盾"——如果台海爆发冲突，全球90%先进芯片供应中断，这比任何经济制裁都更可怕，足以让所有主要国家都站在台湾一边。
  - title: '"中国造不出最先进芯片，不是因为不够努力，是因为物理定律"'
    claim: 大众认知：中国投入了数千亿资金发展芯片产业，应该能很快追上来。 作者/Chris Miller：芯片制造的难度不是资金问题，是物理问题——EUV光刻机需要在真空中用激光轰击锡滴产生13.5纳米波长的光，这种技术ASML花了20年才搞定。钱买不来时间，更买不来物理突破。
  - title: '"NVIDIA的成功不是因为造了最好的芯片，而是因为让别人离不开它的生态"'
    claim: 大众认知：NVIDIA赢在GPU性能最强。 作者/Chris Miller：NVIDIA赢在CUDA生态——一个让全球AI研究者都不得不用的软件平台。硬件可以被超越，生态不能。NVIDIA的护城河不是芯片，是"所有人都学会了用CUDA"这个事实。
  - title: '"摩尔定律不是预言，是自我实现的诅咒"'
    claim: 大众认知：摩尔定律是物理定律，是自然规律。 作者/Chris Miller：摩尔定律更像是一个自我实现的预言——Intel把它当目标，整个产业链围绕它组织研发。但它的成本在指数增长：每一代制程升级都需要指数级增长的投资，最终只有1-2家公司玩得起。
  - title: '"日本半导体产业的衰落不是因为技术不行，而是因为选错了战场"'
    claim: 大众认知：日本半导体衰落是因为"失去的三十年"或美国打压。 作者/Chris Miller：日本在DRAM（内存芯片）上做到了世界第一，但DRAM变成了大宗商品——利润越来越薄。日本没有及时转向逻辑芯片（CPU/GPU），而是死守DRAM，最终被韩国和台湾超越。
  - title: '"芯片战争的真正赢家不是技术最强的国家，而是最有耐心的国家"'
    claim: 大众认知：芯片战争是技术竞赛，谁先突破谁赢。 作者/Chris Miller：芯片产业的回报周期极长——一座晶圆厂从规划到量产需要5-10年，从量产到盈利又需要5-10年。真正能赢的不是技术最强的，而是能坚持投入20年不放弃的。
  takeaway: 芯片是21世纪的权力基础设施——谁控制了芯片，谁就控制了从战争到AI的一切。
