- book: 费曼的彩虹
  author: 伦纳德·蒙洛迪诺（Leonard Mlodinow，美国）
  category: 心理学与行为科学/认知科学
  file: 心理学与行为科学/认知科学/拆书笔记-《费曼的彩虹》.md
  frameworks:
  - name: 费曼式观察循环
    core: 蒙洛迪诺通过费曼的日常思考方式提炼出的核心循环——理解不是从书本到头脑，而是从现象到直觉
  - name: 权威怀疑矩阵
    core: 费曼对待所有知识来源的态度——没有例外，所有权威都接受同等审视
  - name: 彩虹分层理解法
    core: 费曼理解任何事物的层次结构——从现象开始，不从原理开始
  - name: 简单是理解的标尺
    core: 费曼的简化原则——不是把复杂的东西说得简单，而是真正理解后自然变简单
  - name: 玩是工作的最高形式（Play as the Highest Form of Work）
    core: 与现有框架1的分工：框架1给出理解循环的"怎么转"，本框架回答"什么力量能让循环一直转下去"——动力引擎层，对应书中费曼把物理称作"玩"的全部段落。
  - name: 诚实的"不知道"（The Comfortable "I Don't Know"）
    core: 与现有框架2的分工：框架2向外怀疑一切权威的知识来源，本框架向内设防——不让自己也变成一个生产假结论的"权威"。两者合起来才是费曼完整的怀疑纪律：对别人的结论怀疑，对自己的结论更怀疑。
  - name: 找到你的问题（Find Your Problem）
    core: 与现有框架1-4的分工：框架1-4解决"拿到问题后如何理解它"，本框架解决上游的选择问题——该把自己押在哪个问题上。这是书中蒙洛迪诺本人的成长线给出的答案：费曼教他的最后一课，不是任何物理知识。
  counterintuitive:
  - title: '"理解力和记忆力是两回事，甚至互相排斥"'
    claim: 大众认知：读的书越多，理解越深。
  - title: '"最聪明的方法不是最高效的方法"'
    claim: 大众认知：聪明人用最巧妙的方法解决问题。
  - title: '"权威是理解的最大敌人"'
    claim: 大众认知：跟着权威学，少走弯路。
  - title: '"简单是理解的结果，不是起点"'
    claim: 大众认知：简单就是肤浅。
  - title: '"好奇心需要''无知''来喂养"'
    claim: 大众认知：知识越多，问题越多。
  - title: '"你看到的颜色和别人看到的可能完全不同"'
    claim: 大众认知：颜色是客观的物理属性。
  - title: '"荣誉会改变的不是你的能力，而是你的选题"'
