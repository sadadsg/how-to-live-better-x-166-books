- book: 巴比伦最富有的人
  author: '[美]乔治·S·克拉森（George S. Clason）'
  category: 财商与投资/财商启蒙
  file: 财商与投资/财商启蒙/拆书笔记-《巴比伦最富有的人》.md
  frameworks:
  - name: 七步养肥钱包——阿卡德的财富操作系统
    core: 这是全书最核心的框架，巴比伦首富阿卡德传授给 100 位市民的致富操作系统。
  - name: 黄金的五条定律——财富的因果律
    core: 黄金五律（The Five Laws of Gold）
  - name: 贫穷的心理根源——巴比伦城墙寓言
    core: 克拉森用一个隐喻拆解了穷人与富人之间最本质的心理差异
  - name: 运气与机会——"巴比伦最幸运的人"悖论
    core: 克拉森通过赌场商人和工匠的对话，拆解了"运气"的本质
  - name: 达巴瑟的债务自救路线图——三桶金分配法
    core: 与现有框架的分工：框架一讲"从零开始"的积累系统，本框架补上"起点已是负数"的退路；也和框架四划清界限——框架四借达巴瑟讲运气悖论，这里拆的是他真正刻在泥板上的操作遗产。
  - name: 马松的黄金借贷守则——罗丹的五十枚金币难题
    core: 与现有框架二的分工：五定律讲"钱往哪投"（能力圈与避骗），本框架把"守住本金"推进到人与人之间的金钱关系——金商马松（Mathon）教罗丹（Rodan）判断"钱借给谁"的三类借款人清单。
  - name: 城墙与保险——防御性财务的三道墙
    core: 与现有框架三的分工：框架三把城墙用作"储蓄=心理安全感"的隐喻，讲贫穷的心理根源；本框架拆城墙的工程学——原书《巴比伦的城墙》一章的真正机制：繁荣之前先建防御，对应现代人的保险/储蓄/可靠投资三道墙。
  counterintuitive:
  - title: '"贫穷不是因为挣得少，是因为你先花了再存——支付的顺序就是你的命运"'
    claim: 大众认知：收入低所以存不下钱，等收入高了自然就能存下。
  - title: '"守住本金比追求收益率重要一万倍——但没人教你，因为教你的人靠你的交易手续费赚钱"'
    claim: 大众认知：投资就是追求高回报，收益率越高越好。
  - title: '"运气不是随机事件——运气是不拖延的别名"'
    claim: 大众认知：运气是概率，是命运的安排，是"老天眷顾"。
  - title: '"你的房子不是资产——如果你住在里面——但它可以是一笔学费"'
    claim: 大众认知：买房 = 投资 = 资产。
  - title: '"知识和技能是最被低估的资产——因为它们在资产负债表上显示为零"'
    claim: 大众认知：能力是"软实力"，钱才是硬通货。
  - title: '"预算不是限制你的欲望——是让你的欲望服务于你的目标"'
    claim: 大众认知：做预算 = 限制消费 = 约束自由 = 苦行僧生活。
  - title: '"钱不是稀缺的——黄金是充裕的——稀缺的是对待黄金的正确态度"'
    claim: 大众认知：钱难赚所以稀缺，富人只是占据了稀缺资源。
  takeaway: 支付给自己的顺序，就是你财务命运的全部——先存后花者终将为王。
