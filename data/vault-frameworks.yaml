- book: 道德经
  author: 老子（Laozi，中国，约公元前6-4世纪）
  category: 哲学经典/东方哲学
  file: 哲学经典/东方哲学/拆书笔记-《道德经》.md
  frameworks:
  - name: 宇宙生成论——道生万物
    core: 道 → 一 → 二 → 三 → 万物
  - name: 道的本体论——不可言说的终极实在
    core: '"道可道，非常道；名可名，非常名"（第1章）'
  - name: 道→德→仁→义→礼——文明的退化链
    core: 这是老子最深刻的文明批判——每一种"美德"被提倡，都说明上一层已经丧失。
  - name: 无为而治——最大的力量是不用力
    core: '"为学日益，为道日损。损之又损，以至于无为。'
  - name: 反者道之动——对立统一的辩证法
    core: '"反者道之动，弱者道之用"（第40章）'
  - name: 柔弱胜刚强——水的哲学
    core: '"上善若水。水善利万物而不争，处众人之所恶，故几于道。"'
  - name: 不争之德——最大的争是不争
    core: '"夫唯不争，故天下莫能与之争"（第22章）'
  - name: 三宝模型——老子的行动纲领
    core: '"我有三宝，持而保之：'
  - name: 守静观复——从动中回到静
    core: '"致虚极，守静笃。万物并作，吾以观复。'
  - name: 有无相生——"无"的妙用
    core: '"三十辐共一毂，当其无，有车之用。'
  - name: 大成若缺——不完美才是完美
    core: '"大成若缺，其用不弊。'
  - name: 治国层级模型——领导力的四个层次
    core: '"太上，下知有之；其次，亲而誉之；'
  - name: 返璞归真——复归于婴儿
    core: '"含德之厚，比于赤子"（第55章）'
  - name: 知足知止——安全边际的终极智慧
    core: '"知足不辱，知止不殆，可以长久"（第44章）'
  counterintuitive:
  - title: '"道不可言说，可言说的都不是真正的道"'
    claim: 大众认知：真正的智慧可以被清晰表达和教授。
  - title: '"无为不是什么都不做"'
    claim: 大众认知："无为"就是躺平、不作为、消极避世。
  - title: '"越被提倡的美德，说明它越缺失"'
    claim: 大众认知：提倡仁义道德是社会进步的表现。
  - title: '"柔弱胜刚强——刚强是脆弱的伪装"'
    claim: 大众认知：强者是刚硬的、不妥协的、压倒一切的。
  - title: '"不争才是最大的争"'
    claim: 大众认知：想要就要去争，不争就得不到。
  - title: '"最好领导，百姓不知道他的存在"'
    claim: 大众认知：好领导应该是魅力型、有存在感、被爱戴的。
  - title: '"有用的是''无''，不是''有''"'
    claim: 大众认知：有价值的是"有"——有知识、有技能、有资产。
  - title: '"反者道之动——福祸互相转化"'
    claim: 大众认知：好事就是好事，坏事就是坏事。
  - title: '"大道废，有仁义——文明本身就是退化"'
    claim: 大众认知：文明越发展，社会越好。
  - title: '"知者不言，言者不知——真懂了就不说了"'
    claim: 大众认知：知道就要说出来，分享知识是美德。
  takeaway: 越用力越得不到，越不争越没人能争——做减法，才是最高级的加法。
