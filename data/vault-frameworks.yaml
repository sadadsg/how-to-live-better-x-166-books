  - name: 带宽税（Bandwidth Tax）
    core: 认知带宽（Bandwidth）
  - name: 稀缺的四重陷阱
    core: 稀缺的恶性循环
  - name: 余闲的价值（Slack）
    core: 余闲 = 资源超出需求的部分
  - name: 稀缺心态 vs 丰富心态
    core: 稀缺心态           丰富心态
  - name: 专注红利与管窥负担——稀缺的两面
    core: 稀 缺 的 两 面（第1章：专注的"得"与"失"）
  - name: 权衡式思维——稀缺把每个决定变成考试
    core: 同一张购物清单，两种大脑（第3章）
  - name: 杂耍与借用雪球
    core: 杂 耍 式 生 存（第4-5章）
