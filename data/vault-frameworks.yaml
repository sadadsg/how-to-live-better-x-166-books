- book: 最好的告别
  author: 阿图·葛文德（Atul Gawande，美国）
  category: 生命哲学与死亡/生老与告别
  file: 生命哲学与死亡/生老与告别/拆书笔记-《最好的告别》.md
  frameworks:
  - name: 临终关怀三阶段模型（Three Stages of End-of-Life Care）
    core: 葛文德描述了医学在面对死亡时的三个阶段——从"治愈"到"姑息"到"临终关怀"
  - name: 临终对话三问模型（Three Questions for End-of-Life Conversations）
    core: 葛文德提出，医生应该问患者三个问题——这三个问题改变了临终关怀的实践
  - name: 养老院模式演变模型（Evolution of Elder Care Models）
    core: 葛文德描述了养老机构从"保护"到"自主"的演变——这是全书最触动人心的部分
  - name: 生命质量四维度模型（Four Dimensions of Quality of Life）
    core: 葛文德提出，生命质量不是单一维度的，而是四个维度的叠加
  - name: 勇气模型（Courage in the Face of Death）
    core: 葛文德重新定义了"勇气"——在面对死亡时，勇气不是"战斗"，而是"接受"
  - name: 衰老储备衰减模型（The Loss-of-Reserve Model of Aging）
    core: 与现有框架的分工：2.1~2.5 讨论的是"如何面对终局"，本模型是全书所有框架的事实前提——它回答"为什么终局无法用医学手段取消"。与 2.3（照护模式）的分工：2.3 讲机构如何安排老人的生活，本模型讲身体本身正在发生什么。来自第一、二章（独立/崩溃）：葛
  - name: 医患关系三型模型（Three Models of the Doctor-Patient Relationship）
    core: 与现有框架的分工：2.2 的"临终三问"是解释型关系里医生使用的具体工具——本模型回答的是更上游的问题：医疗决策权到底在谁手里。2.2 讲"问什么"，本模型讲"谁拍板"——三问只在解释型关系里才有意义，家长型和资讯型根本不会问那些问题。来自"艰难的谈话"一章：
  counterintuitive:
  - title: '"现代医学最大的失败不是治不好病，而是在生命的最后阶段剥夺了患者的尊严"'
    claim: 大众认知：医学的进步是好事——能治更多的病，能活得更长。
  - title: '"养老院模式最大的问题不是服务不好，而是剥夺了老人最后的自主权"'
    claim: 大众认知：养老院是为了保护老人——有专业护理、有安全保障。
  - title: '"最好的告别不是''不惜一切代价延长生命''，而是''按照自己的意愿生活到最后''"'
    claim: 大众认知：最好的告别是"活到最后一刻"——越长越好。
  - title: '"临终对话的目的不是''告诉患者真相''，而是''了解患者已经知道什么''"'
    claim: 大众认知：医生应该告诉患者"真相"——你还能活多久、你的情况有多严重。
  - title: '"面对死亡时，最大的勇气不是''战斗''，而是''接受''"'
    claim: 大众认知：面对死亡应该"战斗到底"——不惜一切代价延长生命。
  - title: '"死亡不是生命的失败——是生命的一部分"'
    claim: 大众认知：死亡是医学的失败——"我们没能救活他"。
  - title: '"选择善终护理的人，往往死得更晚、也活得更好"'
    claim: 大众认知：放弃激进治疗 = 放弃生存机会 = "等死"——哪怕只有1%的希望也要战斗到底。
  takeaway: 最好的告别不是活得最久，是活到最后一刻仍然按照自己的意愿生活。
