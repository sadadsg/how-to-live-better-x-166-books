- book: 我们为什么要睡觉
  author: 马修·沃克（Matthew Walker，英国/美国）
  category: 科学与身体
  file: 科学与身体/拆书笔记-《我们为什么要睡觉》.md
  frameworks:
  - name: 睡眠的"四大功能"（Four Functions of Sleep）
    core: 睡眠不是"什么都不做"，而是大脑在执行四个关键任务
  - name: 睡眠的"债务陷阱"（Sleep Debt Trap）
    core: 缺觉不是"少休息一会儿"，而是在积累不可逆的伤害
  - name: 睡眠的"四大杀手"（Four Sleep Killers）
    core: 日常习惯中隐藏的睡眠破坏者
  - name: 睡眠的"进化悖论"（Evolutionary Paradox of Sleep）
    core: 为什么进化没有淘汰"浪费1/3时间"的睡眠——因为睡眠的收益远大于风险
  - name: 睡眠的"双进程模型"（Two-Process Model of Sleep Regulation）
    core: 与现有框架3的分工：框架3把"咖啡因阻断腺苷"当作四大杀手之一来防范；本框架补全它背后的完整地图——"困意从哪来、为什么熬夜过点反而清醒"。这是原书第2章的调控底层，也是杀手清单之所以成立的机制。
  - name: NREM/REM"双引擎"与夜内排班（The NREM-REM Dual Engine & Night Shift）
    core: 与现有框架1的分工：框架1的"四大功能"里，记忆只分到两行（"NREM=事实、REM=技能"）；本框架展开整夜睡眠这台机器的排班表——引擎如何轮换、为什么入睡时刻比总时长更决定你得到哪一种睡眠。
  - name: 睡眠的"疾病网络"（The Sleep-Deficit Disease Network）
    core: 与现有框架1、框架2的分工：框架1的功能2/功能4各用一格提到阿尔茨海默与免疫，框架2讲债务如何累积；本框架把长期睡眠失衡与疾病地图连成一张网——并且明确区分原书论断中"证据坚实"与"学界有争议"的部分。
  counterintuitive:
  - title: '"你不需要知道自己困了才去睡——你需要在困之前就去睡"'
    claim: 大众认知：困了再睡，自然规律。 作者/Matthew Walker：你的困倦感是"滞后指标"——当你感觉困的时候，你已经缺觉了。正确的做法是在困之前就上床，让身体自然进入睡眠状态。
  - title: '"每天睡够7-9小时的人，比只睡5-6小时的人活得更长"'
    claim: 大众认知：少睡一点能多做很多事，寿命可能差不了多少。 作者/Matthew Walker：数据明确显示：每晚睡6小时以下的人，全因死亡率比睡7-9小时的人高12%。你用"省下来"的2小时，换来的是"缩短"的寿命。
  - title: '"你的身体在睡眠中''治愈''自己——清醒时做不到"'
    claim: 大众认知：身体24小时都在自我修复。 作者/Matthew Walker：很多修复过程只在睡眠时高效运行——比如大脑代谢废物的清理、免疫细胞的生成、生长激素的分泌。清醒时这些过程会大幅减慢或停止。
  - title: '"REM睡眠是大脑的''情绪疗愈室''——缺觉的人更容易抑郁"'
    claim: 大众认知：抑郁是心理问题，需要心理咨询或药物治疗。 作者/Matthew Walker：REM睡眠是大脑处理情绪记忆的关键阶段——它保留记忆，但去掉情绪的"刺"。缺觉时REM睡眠被压缩，情绪无法得到处理，积累到一定程度就会表现为抑郁或焦虑。
  - title: '"年龄越大，深度睡眠越少——这不是正常的，是需要干预的"'
    claim: 大众认知：年纪大了睡不好是正常的，接受就好。 作者/Matthew Walker：老年人深度睡眠减少确实会发生，但不代表你不需要干预。通过行为调整（固定作息、控制光线、避免酒精），你可以显著改善深度睡眠质量。
  - title: '"做梦不是''无意义的随机活动''，而是大脑在''处理情绪''"'
    claim: 大众认知：梦是无意义的，醒来就忘了。 作者/Matthew Walker：梦是REM睡眠的产物，它的功能是"重新处理白天的情绪记忆"——把情绪从"高强度"降到"低强度"。这就是为什么做完噩梦后，你反而感觉好一些——因为情绪被"释放"了。
  - title: '"一个晚上的好觉，就能让你的免疫系统''升级''一次"'
    claim: 大众认知：免疫力是长期积累的，一晚好觉没多大用。 作者/Matthew Walker：一晚好睡后，免疫细胞（特别是自然杀伤细胞）的数量和活性都会显著提升。这就是为什么感冒时多睡一觉就能好很多——你的免疫系统在睡眠中"加班"消灭病毒。
  takeaway: 睡眠是健康的基石——没有好的睡眠，运动、饮食、心理健康都建立在沙子上。
