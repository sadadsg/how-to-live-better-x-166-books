  category: 心理学与行为科学/关系与沟通
  file: 心理学与行为科学/关系与沟通/拆书笔记-《欲望的演化》.md
  frameworks:
  - name: 繁殖投资不对称理论
    core: 女性          卵子稀少      → 每次繁殖成本极高
  - name: 双轨择偶策略
    core: 择偶策略谱系
  - name: 女性择偶偏好矩阵
    core: ''
  - name: 男性择偶偏好矩阵
    core: ''
  - name: 配偶留住策略
    core: 配偶威胁检测 → 嫉妒情绪激活 → 策略选择
  - name: 两性冲突军备竞赛
    core: 男性策略进化                    女性策略进化
  counterintuitive:
  - title: '"爱情不是无条件的，而是有条件的交换"'
    claim: 大众认知：真正的爱情应该是无条件的付出和接纳。
  - title: '"女性对贞洁的重视程度是可变的，不是天生的"'
    claim: 大众认知：女性天生就重视伴侣的忠诚和贞洁。
  - title: '"男性的嫉妒核心是性背叛，女性的嫉妒核心是情感背叛"'
    claim: 大众认知：男女嫉妒的原因是一样的——都是因为伴侣和别人亲近。
  - title: '"女性也有短期择偶策略，只是更隐蔽"'
    claim: 大众认知：女性天生追求长期关系，男性天生追求短期关系。
  - title: '"在线约会中的欺骗是进化策略的现代延伸"'
    claim: 大众认知：网络约会中的欺骗是道德败坏的表现。
  - title: '"我们赞成的性道德，通常是我们择偶策略的表现"'
    claim: 大众认知：性道德是普世的、客观的伦理标准。
  - title: '"配偶价值差异是关系破裂的核心预测指标"'
    claim: 大众认知：关系破裂是因为"不爱了"或"性格不合"。
  takeaway: 你的欲望不是你选的，是你的祖先用几百万年的生死换来的——看清它，才能驾驭它。
