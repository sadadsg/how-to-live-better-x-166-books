- book: 社会性动物
  author: 埃利奥特·阿伦森（Elliot Aronson）
  category: 心理学与行为科学/社会心理与影响
  file: 心理学与行为科学/社会心理与影响/拆书笔记-《社会性动物》.md
  frameworks:
  - name: 认知失调理论（全书的理论地基）
    core: 这是阿伦森学术生涯的核心贡献，也是全书一切分析的出发点
  - name: 社会影响三层次模型
    core: 社会影响的三个层次（由浅入深）
  - name: 自我辩护（Self-Justification）机制
    core: 这是认知失调的日常运作形式，阿伦森认为它比故意撒谎更危险
  - name: 归因理论与基本归因错误
    core: 归因理论：你怎么解释别人和自己的行为
  - name: 自我实现预言（Self-Fulfilling Prophecy）
    core: 自我实现预言的闭环
  - name: 偏见与歧视的动态模型
    core: 偏见的产生与维持循环
  - name: 人际吸引的科学模型
    core: 人际吸引的四大因素
  - name: 攻击行为的根源模型
    core: 攻击行为的三种理论解释
  counterintuitive:
  - title: '"被迫说谎的人比自愿说谎的人更相信自己的谎言"'
    claim: 大众认知：被迫做违心事的人内心知道真相，只是嘴上不说。
  - title: '"对外貌的重视不是肤浅，而是深层的认知偏差——几乎不可抵抗"'
    claim: 大众认知：注重外貌是肤浅的表现，成熟的人应该看内在。
  - title: '"媒体暴力不是通过''宣泄''减少攻击性，而是通过''去抑制''增加攻击性"'
    claim: 大众认知：看暴力片能"释放"攻击性，让人在现实中更温和（宣泄假说）。
  - title: '"消除偏见最有效的方式不是''教育''或''接触''，而是让敌对群体合作达成共同目标"'
    claim: 大众认知：消除种族/群体偏见需要教育人们"偏见是错的"，或者让不同群体多接触。
  - title: '"决策后，你会自动高估被选中的选项、贬低被放弃的选项——而且毫无意识"'
    claim: 大众认知：选择之后，我清楚地知道我为什么选了这个、放弃了那个。
  - title: '"旁观者越多，任何一个人出手帮忙的概率越低——不是因为冷漠，而是因为责任分散"'
    claim: 大众认知：人多力量大，紧急情况中人越多越可能有人帮忙。
  - title: '"承诺和一致性是人类最强大的社会武器——你越是公开表态，越难改变"'
    claim: 大众认知：言行一致是美德，说到做到说明意志坚定。
  - title: '"过度奖赏反而会削弱内在动机——你付钱让我做的事，我反而不那么喜欢了"'
    claim: 大众认知：想让人做某件事，给更多奖励就好。
  takeaway: '**你以为自己在独立思考，其实你的态度、选择和记忆都在被社会环境悄然改写——而你对此毫无察觉。'
