- book: 拿铁因素
  author: '[美]戴维·巴赫（David Bach）、约翰·戴维·曼（John David Mann）'
  category: 财商与投资/财商启蒙
  file: 财商与投资/财商启蒙/拆书笔记-《拿铁因素》.md
  frameworks:
  - name: 拿铁因素模型（The Latte Factor Model）
    core: 花在别人身上            付给自己
  - name: 财务自由三秘密（The Three Secrets to Financial Freedom）
    core: 这是全书的核心框架——三个简单到难以置信、但绝大多数人做不到的秘密
  - name: 消费三重分类（The Three Types of Spending）
    core: 巴赫隐式地将消费分为三层，但没有明确指出。以下是提取的分类模型
  - name: 财富雪球模型（The Wealth Snowball）
    core: 财富雪球模型
  - name: 「未来的我」心理账户（Future Self Account）
    core: 书中根据：巴赫反复强调"先付给自己"——但他说的"自己"不是现在的自己，而是"未来的我"。在书的结尾，女主角终于理解：每一笔付给自己的钱，都是给十年后那个"已经自由的自己"的预付。
  - name: 自由数字模型（Freedom Number Model）
    core: 书中根据：巴赫给出明确计算公式 —— 你每年需要的支出 × 25 = 你的"自由数字"。这个数字基于 4% 安全提取率（学术界称为"4% 法则"，源自 Trinity Study），即每年提取 4% 本金，30 年内资金不会耗尽。
  - name: 财富熵增定律（Wealth Entropy Law）
    core: 书中根据：巴赫的核心论断之一 ——"如果你不主动安排你的钱，就会有人替你安排，而且不会按你的利益安排。"这句话本质上是在说：财富的默认状态是衰减。
  counterintuitive:
  - title: '"省钱不是关键，先付给自己才是"'
    claim: 大众认知：理财的核心是省钱——控制消费、减少开支、记账。
  - title: '"不是你花太多了，是你付给错的人了"'
    claim: 大众认知：月光族是因为赚得少花得多，需要控制欲望。
  - title: '"不要预算——自动化"'
    claim: 大众认知：要理财先学做预算，追踪每一分钱去哪里了。
  - title: '"现在先过富有的生活"'
    claim: 大众认知：努力存钱，等退休后才能享受。
  - title: '"¥15的奶茶比¥15,000的大衣更危险"'
    claim: 大众认知：大额消费才是财富的敌人，所以只要控制大额支出就万事大吉。
  - title: '"你应该自动变富，而不是努力变富"'
    claim: 大众认知：积累财富需要努力自律、精打细算、持之以恒。
  takeaway: 变富不是学会攒钱，是学会——在发工资那天先付给自己，然后忘掉它。
