  - title: '"虚构故事不是谎言——它是人类最强大的工具"'
    claim: 大众认知：虚构=撒谎=坏的。真实的东西才有价值。
  - title: '"农业革命是史上最大的骗局"'
    claim: 大众认知：农业→文明→进步。这是人类历史的必经之路。
  - title: '"金钱是有史以来最成功的虚构故事"'
    claim: 大众认知：金钱是有用的工具，因为它"代表"价值。
  - title: '"人类的幸福在历史上几乎没变"'
    claim: 大众认知：技术进步→物质丰富→生活幸福。现代人比古人幸福得多。
  - title: '"帝国不是坏事——它是人类统一的引擎"'
    claim: 大众认知：帝国=殖民=压迫=坏的。去殖民化=好的。
  - title: '"科学革命的核心不是''发现了什么''，而是''承认了什么''"'
    claim: 大众认知：科学革命是牛顿、伽利略、哥白尼发现了新知识。
  - title: '"人文主义也是一种宗教——现代人只是换了神"'
    claim: 大众认知：宗教=信神；现代人是世俗的、理性的，早已告别了宗教。
  takeaway: '**人类靠虚构故事征服世界——货币、国家、公司、人权全是故事，真实的是它们让陌生人协作成为可能。'
