- book: 助推
  author: 理查德·泰勒（Richard H. Thaler）、卡斯·桑斯坦（Cass R. Sunstein），美国
  category: 心理学与行为科学/行为设计
  file: 心理学与行为科学/行为设计/拆书笔记-《助推》.md
  frameworks:
  - name: 两种认知系统
    core: 人类大脑的两种操作系统
  - name: 自由家长主义（核心哲学）
    core: 这是全书的意识形态地基
  - name: 选择架构（Choice Architecture）——助推的设计工具箱
    core: 核心洞察：任何选择都是在某种环境中做出的。既然这个环境必然存在，为什么不把它设计好？
  - name: 助推矩阵——什么时候用助推？
    core: 强制     助推
  - name: 助推的伦理边界（"如果你在助推，谁在助推？"）
    core: 作者主动提出了对助推最大的批评，并做出了回应
  - name: 偏误全家福——自动系统的六个出厂 bug
    core: 自动系统的故障码清单（第1章 偏差与谬误）
  - name: 冷热共情差距——热状态下的你是另一个人
    core: 冷状态（清醒时）               热状态（被触发时）
  - name: 从众机器——信息瀑布与多元无知
    core: 信息瀑布的形成（第3章 从众）
  - name: 污泥 Sludge——摩擦的隐形税（终极版新增）
    core: 摩  擦  天  平
  - name: 明天多储蓄——助推的完美标本
    core: SMarT 计划（Save More Tomorrow）四原则
  counterintuitive:
  - title: '"选择架构无法避免——不作设计本身就是一种设计"'
    claim: 大众认知：我不干预，让人们自己选，这就是中立。
  - title: '"强制会让人反弹，但助推不会——因为它保留了你选错的权利"'
    claim: 大众认知：要改变行为，要么强制（立法），要么放任（不管）。
  - title: '"人不是越多选择越好——选择太多等于不选择"'
    claim: 大众认知：给予更多选择=给予更多自由=更好。
  - title: '"提醒不总能帮到人——有时候提醒本身就是一种助推，方向很重要"'
    claim: 大众认知：多提醒、多发通知、多推送，就能让人动起来。
  - title: '"免费的力量：零价格会让人停止理性思考"'
    claim: 大众认知：免费=划算，理性的消费者会计算。
  - title: '"反悔成本比选择成本更重要"'
    claim: 大众认知：选择时擦亮眼睛最重要。
  - title: '"冷状态的你，预测不了热状态的你会干什么"'
    claim: 大众认知：我了解自己——饿着肚子去超市也只会按清单买，深夜立的 flag 明早也能执行。
  - title: '"没人思考过的选择，会滚成集体错误"'
    claim: 大众认知：跟着大多数人走最安全——这么多人不可能都错。
  - title: '"摩擦是一场专门向弱者征收的隐形税"'
    claim: 大众认知：流程麻烦点而已，认真点都能办完，办不完怪自己。
  takeaway: '**要改变行为，不要跟人性作对，要跟设计站在一起——让好选择成为最省力的选择。'
