- book: 工作、消费主义和新穷人
  author: 齐格蒙特·鲍曼（Zygmunt Bauman，波兰/英国）
  category: 经济学与社会/社会与文化
  file: 经济学与社会/社会与文化/拆书笔记-《工作、消费主义和新穷人》.md
  frameworks:
  - name: 生产伦理 vs 消费美学 范式跃迁模型（总纲）
    core: 这是全书的总论点。鲍曼的核心判断——不是"伦理"退场了，是"伦理"换了主人。
  - name: 工作伦理的历史使命模型（第一章：工作）
    core: 工作伦理不是"自然道德"，是工业资本主义发明的驯化工具。它有清晰的历史轨迹
  - name: 进步综合征（Syndrome of Progress）（第一章：工作）
    core: 鲍曼对"现代性 = 进步"叙事的根本性解构——每一次"解放"都制造新的"问题"。
  - name: 吸引力 vs 排斥力 二象限模型（第二章：消费主义）
    core: 消费社会如何控制人？靠吸引力——而不是生产社会的排斥力。
  - name: 被引诱者 vs 被排斥者 二元人口分类（第二章：消费主义）
    core: 鲍曼将消费社会成员分为两类——这是他对当代社会结构最尖锐的诊断之一。
  - name: 新穷人五型分类（Taxonomy of the New Poor）（第三章：新穷人）
    core: 鲍曼的细分——不是简单的"四象限"，是 5 种被消费社会判定为"无用的消费者"
  - name: 福利国家悖论（Welfare State Paradox）（第三章：新穷人）
    core: 这是鲍曼对当代政治的尖锐诊断——福利国家不是被政治家砍掉的，是消费社会让它失效了。
  - name: 引诱/诱惑 vs 规训 切换模型（Seduction vs Discipline）（横向论题）
    core: 这是鲍曼对福柯的延伸——现代社会换了主控机制。
  counterintuitive:
  - title: '"工作伦理不是天经地义的道德，是工业资本主义的驯化工具"'
    claim: 大众认知：人就应该工作，不工作可耻——这是亘古不变的道德。
  - title: '"消费社会不需要剥夺穷人工作，只需要剥夺穷人消费"'
    claim: 大众认知：穷人是因为找不到工作，所以是"失业者问题"。
  - title: '"消费自由比生产自由更隐蔽也更难摆脱"'
    claim: 大众认知：消费社会很自由——我可以选任何我想要的。
  - title: '"新穷人不是因为''没工作''被排斥，是因为''没消费能力''被排斥"'
    claim: 大众认知：穷人的问题是收入。
  - title: '"福利国家不是被政治家砍掉的，是消费社会让它失效了"'
    claim: 大众认知：福利国家衰落是因为新自由主义。
  - title: '"现代人被''引力''控制比被''锁链''控制更彻底"'
    claim: 大众认知：现代人比中世纪/封建社会更自由。
  - title: '"消费不是用来满足需求，是用来证明你是合格消费者"'
    claim: 大众认知：消费满足了我的需求。
  - title: '"新穷人不是失败的人，是消费社会系统的必要产物"'
    claim: 大众认知：穷人是应该被救济的"受害者"。
  takeaway: 工作伦理是生产社会的道德监狱，消费美学是消费社会的欲望监狱——新穷人是被欲望监狱开除的人。
