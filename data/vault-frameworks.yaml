- book: 日本蜡烛图技术
  author: '[美]史蒂夫·尼森（Steve Nison）'
  category: 财商与投资/交易技术
  file: 财商与投资/交易技术/拆书笔记-《日本蜡烛图技术》.md
  frameworks:
  - name: 蜡烛图解剖学——价格行为的视觉语言
    core: 这是全书的基础层，理解任何形态的前提。
  - name: 反转信号分层模型（全书核心）
    core: 尼森构建了一个三层递进的反转信号体系，从"警觉"到"确认"。最重要的前提：任何反转信号必须先有趋势，没有趋势就没有反转。
  - name: 持续形态模型——趋势中的"休息站"和"加速器"
    core: 反转信号告诉你趋势可能结束，持续形态告诉你趋势还在进行中。
  - name: 信号可靠性矩阵（Decision Framework）
    core: 尼森虽然没有给出一个显式的"公式"，但全书反复在教读者一个隐含的信号可靠性评估系统
  - name: 酒田战法体系（Sakata's Five Methods）
    core: 尼森将日本技术分析的集大成——酒田战法（起源于18世纪日本大米交易商本间宗久，后由酒田市的交易商发展完善）引入书的后半部分
  - name: 蜡烛图 × 西方技术分析融合模型
    core: 这是尼森全书最被低估但最重要的框架——他写这本书的最终目的不是教日本人怎么用蜡烛图（人家早就会了），而是教西方交易者怎么把蜡烛图嫁接到已有的分析体系上。
  counterintuitive:
  - title: '"蜡烛图不是反转型态识别手册，而是市场心理的视觉语言"'
    claim: 大众认知：蜡烛图技术 = 背形态名字和识别规则，学会了就能赚钱。
  - title: '"没有趋势，就没有反转信号——这句话是全书最重要的一句话"'
    claim: 大众认知：看到锤子线 → 买！看到吞没形态 → 买！——把信号本身当做了入场理由。
  - title: '"长的上影线不是坏事——它在告诉你精确的价格边界"'
    claim: 大众认知：长上影线 = 涨不上去 = 坏信号，应该卖出。
  - title: '"缺口（窗口）不一定会回补——''缺口必补''是西方交易者的迷思"'
    claim: 大众认知：所有缺口最终都会回补，所以出现缺口就该反向操作。
  - title: '"同样的形态在日线和周线上意义完全不同——时间框架是信号权重的核心变量"'
    claim: 大众认知：蜡烛图形态在任何时间框架上含义都一样，5分钟图和周线图上一模一样的形态价值一样。
  - title: '"最可靠的信号往往是那些看起来''不太完美''的形态——完美的形态要警惕"'
    claim: 大众认知：越标准的形态越可靠——完美的启明星、标准的吞没形态。
  - title: '"半根蜡烛比一整根更重要——收盘价永远是四要素中最重要的一个"'
    claim: 大众认知：蜡烛图的四个要素（开、高、低、收）权重相当。
  - title: '"蜡烛图 + 西方技术分析才是完整系统——单独使用任何一个都是残缺的"'
    claim: 大众认知：学蜡烛图技术就够了，或者西方技术分析就够了。
  takeaway: 你不是在看K线，你是在看市场里每个人脸上的表情——学会读它，就学会了在别人恐惧时看到机会，在别人疯狂时看到风险。
