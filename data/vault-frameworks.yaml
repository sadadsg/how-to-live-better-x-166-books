- book: 伯恩斯新情绪疗法
  author: '[美]戴维·D·伯恩斯（David D. Burns）'
  category: 心理学与行为科学/情绪与内耗
  file: 心理学与行为科学/情绪与内耗/拆书笔记-《伯恩斯新情绪疗法》.md
  frameworks:
  - name: 底层引擎：情绪生成链（A→B→C）
    core: A 事件            B 认知/解释               C 情绪/行为
  - name: 病理图谱：十大认知扭曲（Ten Cognitive Distortions）
    core: 这是全书的病理分类学，也是使用频率最高的工具——坏情绪上头时，给脑内旁白逐条比对，基本都能当场对号入座。
  - name: 核心手术刀：三栏法（Triple-Column Technique）
    core: 第一栏         第二栏         第三栏
  - name: 配套武器箱（四个进阶工具）
    core: ''
  - name: 行动系统：无为症与"动机反转"
    core: 拖延瘫痪循环（Do-Nothingism，无为症）：
  - name: 人际系统：三套应答协议
    core: 批评应答三步（别人攻击你时）
  - name: 深层重构：沉默的假设与自尊脱钩
    core: 三栏法拆的是表层想法，垂直箭头挖出来的是底层"沉默假设"——没说出口、却统治一生的人生条款
  - name: 全景图：一张图看懂本书操作系统
    core: 十大扭曲表（诊断）→ 三栏法（反驳）
  counterintuitive:
  - title: '"你抑郁不是因为你惨，是因为你加工惨的方式有固定套路"'
    claim: 大众认知：情绪是对现实的直接反应——处境不好，人就该难过；"想开点"是风凉话。
  - title: '"动机不产生行动，行动产生动机"'
    claim: 大众认知：先有状态、有动力，才能开始做事；"我现在很丧，等我缓过来再说"。
  - title: '"贬低正面是抑郁的心脏，不是谦虚的美德"'
    claim: 大众认知：把夸奖当客气话、"这点成绩不算什么"是低调，是谦虚。
  - title: '"没有人能''惹''你生气——愤怒需要你的认知执照"'
    claim: 大众认知：是他做过分的事让我愤怒；愤怒是正当反应，宣泄出来才健康。
  - title: '"罪责归己不是善良，是自大"'
    claim: 大众认知：遇事先反思自己、把责任揽下来的人有担当，人格好。
  - title: '"依赖赞美建立的自尊是高利贷"'
    claim: 大众认知：多被夸、多被认可，人就自信了；自信是夸出来的。
  - title: '"应该句式是对自己的暴力：内疚不等于道德"'
    claim: 大众认知：对自己要求高（"我早该做到"）是上进的标志；内疚说明良知在线。
  - title: '"抑郁时的''清醒''是错觉：负面想法是谎言，不是洞见"'
    claim: 大众认知：抑郁的人是"想太多、太清醒"，把世界看透了才痛苦；旁人的劝解反而幼稚。
  takeaway: 让你痛苦的不是事件，是脑内加工——抓住歪曲想法，写下合理回应，情绪当场松动。
