  author: '[美]保罗·海恩（Paul Heyne）| 彼得·勃特克、大卫·普雷契特科续写'
  category: 经济学与社会/经济学理论
  file: 经济学与社会/经济学理论/拆书笔记-《经济学的思维方式》.md
  frameworks:
  - name: 经济学的思维方式总纲——四项核心前置
    core: 海恩开门见山，给出了经济学思维的四个基本前提——所有后续分析都建立在这上面
  - name: 七种核心思维工具（全书脚手架）
    core: 七种经济学思维工具
  - name: 价格机制——社会的操作系统
    core: 海恩对价格的理解是全书的精髓
  - name: 比较优势与贸易——财富从何而来
    core: 比较优势：贸易为何创造财富
  - name: 市场作为发现过程（奥地利学派视角）
    core: 市场不是机器——市场是发现过程
  - name: 意图 vs 后果分析矩阵
    core: 海恩最核心的分析工具——用于解剖任何政策和社会现象
  - name: 市场失灵的四种形式——市场也有做不到的事
    core: 海恩不是市场原教旨主义者。他承认市场会失败，但严格区分了真正的市场失灵和政策造成的伪失灵。只有下面四种情形才为政府干预提供了"可能的"理由
  - name: 看不见的脚——政策制定者也是普通人
    core: 这是海恩的标志性概念——"看不见的手"协调市场，但政府官员同样是被自身利益驱动的普通人，他们的"脚"也会带来未预期的后果。
  - name: 科斯定理与产权——市场能解决外部性的边界
    core: 借鉴科斯定理，海恩重新解读了外部性、侵权、污染等市场失灵问题
  - name: 政府的"第四职能"——减少不平等
    core: 海恩在斯密三大政府职能（国防、司法、公共工程）之外增加了第四职能——减少贫困和不平等。但他强调重新分配不等于劫富济贫。
  - name: 菲利普斯曲线——通胀与失业的两难
    core: 海恩用菲利普斯曲线解释宏观经济政策的核心两难，并比较了凯恩斯主义与货币主义
  counterintuitive:
  - title: '"成本不是你花了多少钱——成本是你放弃了什么"'
    claim: 大众认知：成本就是我要付的钱
  - title: '"价格高不是"坏事"——它是短缺的解决方案"'
    claim: 大众认知：价格太高，说明市场不公平
  - title: '"最低工资会让最需要帮助的人失去工作"'
    claim: 大众认知：最低工资保护了劳动者的权益
  - title: '"免费的午餐不存在——免费的东西才是最贵的"'
    claim: 大众认知：免费就是赚到了
  - title: '""公平价格"不存在——价格是谈判的结果，不是道德的产物"'
    claim: 大众认知：有些东西"应该"卖多少钱
  - title: '"利润不是剥削——利润是企业家判断正确的奖励"'
    claim: 大众认知：利润是资本家剥削工人的剩余价值
  - title: '""经济衰退"不是一场灾难——它是市场在清理错误"'
    claim: 大众认知：衰退是经济出了问题，必须用政府政策快速补救
  - title: '"市场经济不需要任何人的"善意"——甚至不需要你理解它"'
    claim: 大众认知：社会协作需要好心人来推动
  - title: '"市场失灵≠政府必然能修——政府也有看不见的脚"'
    claim: 大众认知：市场有问题，政府来管就行了
  - title: '"再分配要直接给钱，不要用价格管制"'
    claim: 大众认知：要帮助穷人，应该限制穷人必需品的价格（房租/食品/工资）
  - title: ⓫ "GDP 是20世纪最伟大的发明——也是最容易误导人的单一指标"
    claim: 大众认知：GDP 增长 = 国家变好
  takeaway: 不看"想达到什么"，看"激励了什么"——所有社会问题的分析都从这开始。
