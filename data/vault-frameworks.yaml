    claim: 大众认知：人生由少数重大时刻定义——毕业、结婚、升职、买房。
  - title: '"朴素不是贫穷，是一种选择"'
    claim: 大众认知：朴素是因为"没钱"。
  - title: '"慢不是懒，是注意力的质量"'
    claim: 大众认知：快=高效=好；慢=低效=差。
  - title: '"你不需要去日本学生活美学"'
    claim: 大众认知：生活美学是日本的、北欧的、法国的——是一种"进口"的生活方式。
  takeaway: 格外不是逃离平凡，是在柴米油盐中找到诗意——认真对待每一天的"小事"，就是最好的活法。
