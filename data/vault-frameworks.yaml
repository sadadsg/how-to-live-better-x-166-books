- book: 人生由我
  author: 梅耶·马斯克（Maye Musk，加拿大/南非/美国）
  category: 个人效能与习惯/人生哲学
  file: 个人效能与习惯/人生哲学/拆书笔记-《人生由我》.md
  frameworks:
  - name: 梅耶的"重建方程式"（Maye's Rebuild Equation）
    core: 梅耶人生的底层逻辑——每次崩溃都是重建的起点
  - name: 梅耶的"年龄无用论"（Age Is Irrelevant）
    core: 梅耶对年龄的态度——年龄是数字，不是限制
  - name: 梅耶的"母亲操作系统"（Mother's Operating System）
    core: 梅耶如何培养出三个亿万富翁——她的教育方法论
  - name: 梅耶的"营养哲学"（Maye's Nutrition Philosophy）
    core: 梅耶作为营养学家的核心洞察——健康是人生的基础资产
  - name: 梅耶的"三级跳重置"（The Reset Protocol）
    core: 梅耶一生完成了三次跨国重置：2岁随家从加拿大迁往南非，41岁（1989年）从南非迁回加拿大，48岁（1996年）再迁纽约。她在书中写道："我曾多次推倒并重建我的人生。"
  - name: 梅耶的"五份工现金流"（The Five-Job Cash Flow）
    core: 离婚后在南非和加拿大的最艰难岁月，她同时打五份工：营养咨询、营养课教学、模特拍摄、模特学校教学……最穷的时候靠花生酱度日。她从没把前夫的赡养费当成生活支柱——自己造血，才是唯一可靠的现金流。
  - name: 梅耶的"求助网络"（The Asking Network）
    core: 梅耶的每次重置都靠"开口"完成：到加拿大时靠朋友安排住处、介绍机会；她直接向经纪公司、品牌、客户开口要工作；她的第一批模特学生和营养客户，来自她主动打出的电话。而她同时也一直在"存"——帮别人的忙，几十年不断线地联络。
  counterintuitive:
  - title: '"最好的教育不是教孩子做什么，是让他们看到你在做什么"'
    claim: 大众认知：教育是告诉孩子什么是对的，什么是错的。 作者/Maye Musk：孩子不会听你说什么，但会看你做什么。你希望孩子努力工作，自己就先努力工作；你希望孩子独立思考，自己就先独立思考。身教 > 言传。
  - title: '"60岁不是退休年龄，是事业爆发期"'
    claim: 大众认知：60岁应该退休，享受晚年。 作者/Maye Musk：60岁是人生最好的年龄——你有40年的经验、人脉、判断力，而且不再在意别人的看法。梅耶69岁成为CoverGirl代言人，70岁登上《时代》杂志，72岁在纽约时装周压轴。年龄不是限制，是资产。
  - title: '"被家暴不是''人生污点''，是''重建的起点''"'
    claim: 大众认知：被家暴是羞耻的事，应该隐藏。 作者/Maye Musk：梅耶公开谈论被家暴的经历，不是为了博同情，而是为了证明：你不需要因为过去的经历而定义自己。被家暴不是她的"错"，也不是她的"标签"——那只是一个事件，她选择了从那个事件中站起来。
  - title: '"独立不是''不需要任何人''，是''能照顾好自己''"'
    claim: 大众认知：独立 = 孤独、不依赖任何人。 作者/Maye Musk：梅耶独自抚养三个孩子，但她不是"孤独"的——她有朋友、有支持网络、有孩子的陪伴。独立不是"不需要任何人"，是"有能力照顾好自己，同时接受别人的帮助"。
  - title: '"健康不是''有空再做''，是''必须现在做''"'
    claim: 大众认知：健康很重要，但等我忙完这阵子再关注。 作者/Maye Musk：健康是复利——今天吃得好，10年后看起来比同龄人年轻20岁；今天不运动，10年后多花10万元看病。健康不是"等有空再做"，是"必须现在做"，因为它的回报是指数级的。
  - title: '"你不需要''准备好''才能开始，你需要''开始''才能准备好"'
    claim: 大众认知：我需要先学习、先积累、先准备好，然后才能开始。 作者/Maye Musk：梅耶的行动优先原则：做了再想清楚。行动产生信息，信息指导下一步。等你"准备好"的时候，机会已经没了。
  - title: '"三个亿万富翁不是''培养''出来的，是''放手''出来的"'
    claim: 大众认知：要培养成功的孩子，需要花大量时间精力教育他们。 作者/Maye Musk：梅耶没有花大量时间"教育"孩子，她花大量时间"做自己的事"——打五份工、读学位、做模特。孩子们看到的是一个不断努力、从不放弃的母亲，他们学会了自己努力、自己解决问题。
  - title: '"人生最大的风险不是''失败''，是''从未尝试''"'
    claim: 大众认知：失败很可怕，应该避免。 作者/Maye Musk：梅耶被家暴、破产、独自抚养孩子——每次失败都让她更强。她不怕失败，她怕的是"从未尝试"。如果你从未尝试，你永远不会失败，但你也永远不会成功。
  takeaway: 你的人生不是由过去的经历决定的，而是由你此刻的选择决定的——无论你几岁，无论你经历过什么。
