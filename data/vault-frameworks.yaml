    claim: 大众认知：股票从高点跌了一大半，已经很便宜了，可以抄底。
  - title: '"你可以摊薄利润，但永远不要摊薄亏损"'
    claim: 大众认知：跌了就补仓，摊低成本，回本更快。
  - title: '"道氏理论已经过时——别等指数确认了"'
    claim: 大众认知：大盘确认趋势后再动手才稳妥。
