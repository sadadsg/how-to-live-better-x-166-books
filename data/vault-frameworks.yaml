  - name: 中国芯片的"三条突围路径"（Three Breakthrough Paths）
    core: 中国芯片的"三条突围路径"
  - name: 芯片产业的"纯代工革命"（Pure Foundry Revolution）
    core: 与现有框架2的分工：框架2讲中国被锁在价值链的哪一层（静态位置）；本框架讲这张层级地图本身是怎么来的——产业链格局不是天然给定，而是被一次商业模式创新重塑的。三个新框架构成一条递进链：框架5讲格局如何被创造，框架6讲格局如何迁移，框架7讲格局如何固化。
  - name: 半导体的"产业转移四波"（Four Waves of Semiconductor Migration）
    core: 与现有框架1的分工：框架1向内看——中国内部政策、资本、整机思维的错配；本框架向外看——半导体制造重心为什么在全球流动、浪头更替遵循什么规律、中国正站在第几浪的什么位置。内部错配（框架1）决定中国能不能接住浪，外部浪头规律（本框架）决定浪会不会等中国。
  - name: 制程竞赛的"资本军备赛"（Capex Arms Race）
    core: 与现有框架4的分工：框架4讲"往哪突围"（路线选择）；本框架讲"突围的时间窗为什么在收紧"——制程每前进一代，资本门槛指数级抬升，越晚上桌的玩家越难入局。它解释了框架4里"每条路都要10年以上"背后的经济学：不是路难走，是门票年年涨价。
  counterintuitive:
  - title: '"中国芯片产业最大的问题不是技术，而是''赶超心态''"'
    claim: 大众认知：中国芯片产业的问题是技术落后，只要加大投入就能追上来。 作者/余盛：中国芯片产业最大的问题是"赶超心态"——总是想用3年走完别人30年的路。半导体产业的规律是：每一代制程升级需要10-20年的积累，没有捷径。
  - title: '"大基金投了3000亿，但真正卡脖子的环节只分到了6%"'
    claim: 大众认知：国家投入了数千亿资金发展芯片产业，应该能很快解决卡脖子问题。 作者/余盛：大基金一期67%投制造、17%投设计、6%投设备材料。而真正卡脖子的恰恰是设备和材料——光刻机、光刻胶、EDA软件。钱投了，但没投对地方。
  - title: '"中国有3000家芯片设计公司，但大多数在用ARM的公版架构"'
    claim: 大众认知：中国芯片设计公司数量暴增，说明设计能力在快速提升。 作者/余盛：数量不等于质量。大多数中国芯片设计公司用的是ARM的公版架构（Cortex-A系列），只是在此基础上做集成和优化，没有真正的核心IP。这就像3000个人都在用微软的Word写文章，但没有一个人能自己开发文字处理软件。
  - title: '"国产替代的最大敌人不是外国制裁，而是国内的价格战"'
    claim: 大众认知：国产替代的最大障碍是美国的技术封锁。 作者/余盛：国产替代的最大敌人是国内的价格战——当3000家芯片设计公司都在抢同一个市场时，价格战会把利润压到为零，导致谁都没有钱投入研发。价格战杀死了创新。
  - title: '"芯片自主可控不是''造出来就行''，而是''造出来还要用起来''"'
    claim: 大众认知：只要能造出芯片，就实现了自主可控。 作者/余盛：造出来只是第一步，用起来才是关键。如果你造出的芯片性能差、良率低、成本高，下游客户不会用。自主可控不是"有"，而是"能用"、"好用"、"愿意用"。
  - title: '"中国芯片产业需要的不是''举国体制''，而是''容错机制''"'
    claim: 大众认知：芯片是国家战略产业，应该用举国体制集中力量办大事。 作者/余盛：举国体制适合"确定性高"的项目（如两弹一星），但芯片产业充满不确定性——技术路线在变、市场需求在变、竞争格局在变。举国体制的问题是"押注一条路线"，如果押错了，满盘皆输。
  - title: '"日本半导体衰落不是因为''失去的三十年''，而是因为''选错了战场''"'
    claim: 大众认知：日本半导体衰落是因为经济泡沫破裂后的"失去的三十年"。 作者/余盛：日本在DRAM（内存芯片）上做到了世界第一，但DRAM变成了大宗商品——利润越来越薄。日本没有及时转向逻辑芯片（CPU/GPU），而是死守DRAM，最终被韩国和台湾超越。这是战略选择的失败，不是经济周期的失败。
  - title: '"芯片战争的真正赢家不是技术最强的国家，而是最有耐心的国家"'
    claim: 大众认知：芯片战争是技术竞赛，谁先突破谁赢。 作者/余盛：芯片产业的回报周期极长——一座晶圆厂从规划到量产需要5-10年，从量产到盈利又需要5-10年。真正能赢的不是技术最强的，而是能坚持投入20年不放弃的。
  takeaway: 中国芯片产业的问题不是不够努力，而是用短跑的心态跑马拉松——需要的不是更多钱，而是更长的耐心和更对的方法。
