- book: 马云：未来已来
  author: 阿里巴巴集团、阿里研究院 编（马云演讲/讲话集，红旗出版社）
  category: 创业与商业/生意实践与商业人物
  file: 创业与商业/生意实践与商业人物/拆书笔记-《马云：未来已来》.md
  frameworks:
  - name: 马云的"未来三阶段论"
    core: 马云的未来认知地图
  - name: 新商业文明的三大支柱
    core: ''
  - name: 中小企业的"活法"模型
    core: 中小企业生存策略
  - name: 马云的"五个新"模型
    core: ''
  - name: 马云的"领导力"三角模型
    core: 愿景                  价值观
  - name: 马云的"平台生态"模型（让别人赢）
    core: 与框架二的分工：框架二回答"新商业文明长什么样"——新旧形态对照，"平台化生态"只是表格中的一行；本框架往下拆一层，讲平台生态自身的运行机制：为什么"让别人赢"反而是最强的赢法。
  - name: eWTP与"全球买全球卖"模型
    core: 与框架三、框架四的分工：框架三讲中小企业在本土市场"做活"的生存策略，本框架把"做活"升维到全球——eWTP如何把只属于大公司的全球贸易权变成中小企业的标配；框架四的"五个新"是产业清单，eWTP是贸易制度设计，不在五新清单之内。
  counterintuitive:
  - title: '"未来已来，只是分布不均"'
    claim: 大众认知：未来是遥远的事，跟我现在关系不大。 作者/马云：未来不是"还没来"，是已经来了但只在少数地方和少数人身上发生。你看到的"未来"，是别人正在过的生活。
  - title: '"AI不会取代人，但不用AI的人会被用AI的人取代"'
    claim: 大众认知：AI会让很多人失业。 作者/马云：AI取代的是岗位类型，不是人。问题是：你愿不愿意学习与AI协作？不愿意的人会被愿意的人取代。
  - title: '"电子商务只是开胃菜，真正的大餐是新零售"'
    claim: 大众认知：电商已经很成熟了，机会已经被占完了。 作者/马云：纯电商时代会结束。未来是线上线下融合的新零售——数据驱动的个性化服务才是真正的价值。
  - title: '"中小企业不要做大，要做活"'
    claim: 大众认知：企业要成功就要做大、做强。 作者/马云：中小企业的机会不是跟大企业拼规模，是利用灵活性在大企业看不上的缝隙中生存。做活比做大更重要。
  - title: '"数据是新的石油，但比石油更宝贵"'
    claim: 大众认知：石油是最宝贵的资源。 作者/马云：石油用完就没了，数据用完还有更多。石油需要开采，数据需要挖掘。未来最有价值的公司是拥有最多数据的公司。
  - title: '"最大的机会不是互联网+，而是互联网-"'
    claim: 大众认知：所有行业都应该"互联网+"——用互联网改造传统行业。 作者/马云：真正的机会是"互联网-"——用互联网思维做减法，砍掉不必要的环节，让核心价值更清晰。
  - title: '"贸易停止之日，就是战争开始之时"'
    claim: 大众认知：关税和贸易壁垒是经济问题，最多影响物价和就业。 作者/马云：贸易是和平的解药——回看历史，贸易一旦停止，战争往往就开始了（书中《长城、贸易和战争》一篇的核心观点）。
  takeaway: 未来不是恐惧的对象，是理解的对象——理解了未来的逻辑，你就是未来的创造者而非被淘汰者。
