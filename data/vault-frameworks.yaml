    core: 普世需要模型
  - name: 请求 vs 命令
    core: 请求 vs 命令
  - name: 同理心倾听模型
    core: 当别人在表达痛苦时，你需要做的不是：
  - name: 愤怒的根源——需要的信使
    core: · 愤怒是别人"造成的"
  - name: 惩罚 vs 满足需要
    core: 惩罚 vs 满足需要
  - name: 自我同理——与自己的暴力沟通
    core: 自 我 同 理
  - name: 表达感激——NVC的感恩方式
    core: 表达感激的NVC方式
  - name: NVC的冲突调解模型
    core: NVC冲突调解
  counterintuitive:
  - title: '"你让我很生气"——不，是你的需要让你很生气'
    claim: 大众认知：是别人的行为"导致"了我的愤怒。
  - title: '"批评是一种表达需要的暴力方式"'
    claim: 大众认知：批评是为了帮助对方改进。
  - title: '"同理心不是同意，是理解"'
    claim: 大众认知：同理心意味着你认同对方的观点。
  - title: '"命令短期有效，请求长期有效"'
    claim: 大众认知：对下属/孩子要"有权威"，说了就必须做。
  - title: '"冲突不是''谁对谁错''，是''需要没被满足''"'
    claim: 大众认知：冲突需要分出对错，然后错的一方改正。
  - title: '"自我批评是最隐蔽的暴力"'
    claim: 大众认知：对自己严格要求是好事。
  takeaway: 所有的暴力——包括语言暴力——都是未被满足的需要的悲剧性表达。学会说出需要，而不是发出评判，沟通就从互相伤害变成了互相连接。
