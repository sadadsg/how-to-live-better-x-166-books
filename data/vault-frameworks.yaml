  - title: '"学习是为了不再依赖"'
    claim: 大众认知：学习是为了获得更多。
  - title: '"怨天尤人是弱者的毒药"'
    claim: 大众认知：受了不公的对待，抱怨是正当的情绪。
  takeaway: '**学问的目的不是装饰，而是独立——经济独立、精神独立、社会独立。'
