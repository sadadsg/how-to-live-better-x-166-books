- book: 当代中国社会分层
  author: 李强
  category: 经济学与社会/社会与文化
  file: 经济学与社会/社会与文化/拆书笔记-《当代中国社会分层》.md
  frameworks:
  - name: 社会结构形态演变模型
    core: 这是全书最核心的分析框架——用图形化方式呈现中国社会结构的变迁轨迹。
  - name: 四个利益群体
    core: 李强根据改革开放中获益/受损情况，将中国社会划分为四个利益群体。这是理解"谁赢了改革、谁输了改革"的核心框架。
  - name: 中产阶层五个集团
    core: 李强将中国中产阶层细分为五个集团，揭示了中产阶层的内部异质性。
  - name: 中产社会形成的三条渠道
    core: 这是理解"如何从底层进入中产"的核心框架——三条渠道各有机制、门槛和政策含义。
  - name: ISEI测量体系
    core: 国际社会经济职业地位指数（International Socio-Economic Index）是本书最核心的测量工具——通过职业、教育、收入三个维度量化社会地位，让"阶层"从概念变成可测量的数字。
  - name: 政治分层与经济分层
    core: 这是理解"改革前后社会结构如何变化"的核心框架——从"身份决定命运"到"市场决定命运"的转变。
  - name: 户籍-城乡二元分层机制（机制基础层）
    core: 户籍制度是中国独有的"先赋性"分层基础。它不仅是身份标签，更是教育、医疗、住房、社保等所有制度资源的分配凭证——这是理解"为什么中国阶层流动比其他国家难"的关键。
  - name: 教育-学区房再生产循环（机制核心层）
    core: 这是布迪厄文化资本理论的中国版本——解释"寒门难出贵子"的微观机制。教育的"中立选拔"形象在中国语境下被住房绑定所扭曲。
  - name: 六种住房地位群体的阶层图谱（机制显性层）
    core: 房产是当代中国阶层最显性的标志——看得见、摸得着、可比较。本框架把反常识❻的"一句话伏笔"补成完整图谱。
  - name: 碎片化阶层困境（机制后果层）
    core: 中国中产规模虽在扩大，但未形成西方意义上的"中产阶级社会"。这是连接"中产规模"和"中产功能"的桥梁性框架——回答"中国为什么没形成中产阶级社会"。
  - name: 代际流动的"四个世界"模型（机制量化层）
    core: 把反常识❺的"四个世界"定性描述升级为可量化框架——不同区域的阶层固化程度差异巨大，全国数据掩盖了区域分化。
  counterintuitive:
  - title: '"阶层"不等于"阶级"——现代社会用阶层分析更准确'
    claim: 大众认知：中国社会还是"两个阶级一个阶层"（工人阶级、农民阶级、知识分子阶层）。
  - title: 农民工是"最典型的产业工人"，而非边缘群体
    claim: 大众认知：农民工是"边缘群体"，是城市化进程中的临时现象。
  - title: 中产阶层 ≠ 中等收入群体——职业和教育比收入更能定义中产
    claim: 大众认知：月入1万就是中产。
  - title: 社会流动的"先赋性"正在被"后致性"替代，但替代不完全
    claim: 大众认知：现代社会靠能力，出身不重要了。
  - title: 城市接近橄榄型，农村仍是倒丁字型——中国是"四个世界"
    claim: 大众认知：中国社会结构是统一的。
  - title: 住房是阶层分化的核心机制之一
    claim: 大众认知：住房只是居住问题。
  - title: 政策变量对社会分层结构有重大影响
    claim: 大众认知：社会分层是市场自然形成的。
  - title: '"中产焦虑不是心理问题，是结构性位置"'
    claim: 大众认知：房贷/教育/医疗压力大导致中产焦虑，是个人心态问题。
  - title: '"消费分层比收入分层更准确定义阶层"'
    claim: 大众认知：看收入就知道谁是中产——月入1万就是中产。
  - title: '"底层群体难以通过个人努力实现跃升"'
    claim: 大众认知：穷则思变，寒门能出贵子——只要努力就能改变命运。
  takeaway: '**中国社会从"倒丁字"变"土字"，但离"橄榄型"还差一个中产阶层的规模化崛起。'
