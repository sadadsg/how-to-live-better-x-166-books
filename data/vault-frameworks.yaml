- book: 活法
  author: '[日] 稻盛和夫'
  category: 工作与职业
  file: 工作与职业/拆书笔记-《活法》.md
  frameworks:
  - name: 人生方程式
    core: 稻盛和夫最核心的思维工具——人生·工作的结果=思维方式×热情×能力
  - name: 六项精进
    core: 稻盛和夫总结的六项人生修行
  - name: 工作观：劳动=修行
    core: 工作观：劳动=修行
  - name: 利他经营
    core: 传统经营观：
  - name: 判断基准："作为人，何谓正确？"
    core: 遇到任何问题，先问自己：
  - name: 自燃型与有意注意：工作的具体姿态
    core: 是什么：稻盛把人按对工作的燃烧方式分为三型——自燃型（自己燃烧）、可燃型（被人点燃）、不燃型（点不着）。他断言：想把事情做成，必须做自燃型的人，至少是可燃型——不燃型的人放在哪里都是成本。与三型配套的操作技术是"有意注意"：把全部意识有意图地聚焦在当下的那一点
  - name: 动机至善，私心了无：启动决策过滤器
    core: 是什么：稻盛在创立第二电电前，反复自问"動機善なりや、私心なかりしか"——动机善否？私心有无？整整半年，直到确信"动机至善、私心了无"才动手。动机至善：动机指向大义（为世人、为普遍之好），而非一时的小恩小惠；私心了无：动机里不掺个人名利与胜负心。
  counterintuitive:
  - title: '"人生的意义是提升心性，不是追求成功"'
    claim: 大众认知：人生的意义是成功、财富、地位。
  - title: '"工作是万病良药"'
    claim: 大众认知：工作是痛苦的根源——压力、加班、竞争。
  - title: '"思维方式可以是负数"'
    claim: 大众认知：能力越强、热情越高，结果越好。
  - title: '"利他是最好的商业策略"'
    claim: 大众认知：商业是零和博弈——你赢我输。
  - title: '"简单是做人和做事的最佳原则"'
    claim: 大众认知：复杂的问题需要复杂的解决方案。
  - title: '"每天进步一点点，就是最好的人生"'
    claim: 大众认知：人生需要"大突破"才能改变。
  - title: '"感恩之心是幸福的源泉"'
    claim: 大众认知：幸福来自于"得到"——得到爱、得到钱、得到认可。
  takeaway: 人生的意义是提升心性，工作是磨炼灵魂的道场——简单地做正确的事，就是最好的活法。
