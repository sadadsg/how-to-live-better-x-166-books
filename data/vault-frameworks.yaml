    core: 芒格给决策者的实操方法——同时用两条轨道思考
  counterintuitive:
  - title: '"你不知道自己不知道的，才是最大的风险"'
    claim: 大众认知：最大的风险是高风险的投资、高杠杆的操作、未知的市场波动。
  - title: '"激励是超级强大的力量——比你说服教育更管用"'
    claim: 大众认知：要改变人的行为，靠教育、靠道德感化、靠讲道理。
  - title: '"妒忌是人类最强大的驱动力——比贪婪更强大"'
    claim: 大众认知：驱动经济的是贪婪。
  - title: '"投资最大的敌人不是市场，是你的大脑"'
    claim: 大众认知：投资亏钱是因为市场不好、经济下行、政策变化。
  - title: '"最好的办法往往是最简单的，但大多数人觉得简单=没价值"'
    claim: 大众认知：成功的秘诀是复杂的、高深的、一般人想不到的。
  - title: '"不是经验让你更聪明，是懂得反思经验让你更聪明"'
    claim: 大众认知：年龄增长、经验积累会自动让你变成更好的决策者。
  - title: '"学习你不喜欢的学科，比学习你喜欢的更有用"'
    claim: 大众认知：追随热情，深耕你喜欢的领域。
  takeaway: '**聪明是容易的，不犯傻才是最难的——所有智慧都从避开蠢事开始。'
