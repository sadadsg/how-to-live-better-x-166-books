- book: 幸福的勇气
  author: 岸见一郎、古贺史健
  category: 心理学与行为科学/人格与动机
  file: 心理学与行为科学/人格与动机/拆书笔记-《幸福的勇气》.md
  frameworks:
  - name: 幸福是方法，不是目的地
    core: 这是本书的"地基性框架"，也是与前作最关键的升级点。
  - name: 重要的他者 vs 共同感觉
    core: 前作给出了"共同感觉"——归属感 + 贡献感。本书把"贡献感"具体化为"重要的他者"概念
  - name: 自我接纳的悖论——接受不能改变的，改变能改变的
    core: 本书最刺人的框架
  - name: 价值是主观感受到的，不是被评价出来的
    core: 这是本书最反常识的命题之一
  - name: 教育哲学——存在即贡献
    core: 本书用了相当篇幅谈教育，这是对前作"鼓励模型"的全面升级
  - name: 关于老龄化的勇气
    core: 这是前作没覆盖、本书新增的专门话题。阿德勒用苏格拉底对老龄的从容类比
  counterintuitive:
  - title: '"幸福不是目的地，是此刻的方法"'
    claim: 大众认知：我要变幸福，所以我需要先达成某些条件——赚够钱、找到对的人、实现某个目标。
  - title: '"重要的他者越多越自由"'
    claim: 大众认知：人际关系是负担，人越少越自由，越亲密越束缚。
  - title: '"价值是主观感受到的，不是被评价出来的"'
    claim: 大众认知：我的价值靠他人打分——分数、收入、点赞、排名决定我的价值。
  - title: '"孩子不需要表扬也不需要批评——需要''存在''本身"'
    claim: 大众认知：好孩子要表扬，坏孩子要批评，教育=奖惩。
  - title: '"愤怒不是敌人，是你缺乏勇气的信号"'
    claim: 大众认知：愤怒是情绪问题，要管理、要表达、要克制。
  - title: '"教育的全部目的是''自立''——自立=不再需要被认可就能行动"'
    claim: 大众认知：教育=传授知识=让孩子有能力。
  - title: '"老龄不是负担，是共同体的活见证"'
    claim: 大众认知：老人没用，需要被照顾，活的只是时间。
  - title: '"幸福的人不是没有痛苦，是不被痛苦定义"'
    claim: 大众认知：幸福 = 没有痛苦。
  takeaway: '**幸福不是目的地，是此刻的方法——你用幸福的方式去行动，幸福就在发生。'
