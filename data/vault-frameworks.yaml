  - name: 游戏化四要素映射（把游戏的上瘾设计搬进学习）
    core: 是什么：游戏让人上瘾不靠画面和剧情，靠精确的行为设计。原书的核心主张之一就是"用游戏设计的智慧改造学习"——游戏化不是给学习贴贴纸，而是把四个上瘾元件系统性地搬进学习流程。
  - name: 难度校准与心流通道（动力的难度旋钮）
    core: 是什么：契克森米哈赖的心流通道模型：动力不取决于任务本身的绝对难易，而取决于"挑战"与"技能"的相对位置。挑战远超技能→焦虑→放弃；技能远超挑战→无聊→走神；只有挑战略高于技能（约+4%）的窄带，才进入"停不下来"的状态。
  counterintuitive:
  - title: '"学习时感觉越困难，说明你学得越好"'
    claim: 大众认知：学习应该越学越顺，感觉困难说明方法不对或没学会。 作者/安川康介：学习中的"困难感"不是失败的信号，而是学习真正发生的信号——这叫"合意困难"（Desirable Difficulty）。当你合上书什么都想不起来，当交叉练习时错误率上升，当间隔复习时发现遗忘了——这些正是记忆巩固正在发生的证据。
  - title: '"反复阅读是最浪费时间的学习行为之一"'
    claim: 大众认知：多读几遍就记住了，重复是学习之母。 作者/安川康介：反复阅读会产生"流利度错觉"——文字读得越顺畅，大脑越误以为自己已经掌握。但这是一场自我欺骗：你只是在再认（看着认识），而不是回忆（关上书能说出来）。再认能力不等于考试能力。
  - title: '"所谓的''学习风格''（视觉型/听觉型/动觉型）缺乏科学依据"'
    claim: 大众认知：每个人都有自己偏好的学习风格，找到适合自己的风格学习效率最高。 作者/安川康介："学习风格"理论虽然广为流传，但缺乏扎实的科学证据支持。更严重的是，根据所谓的"学习风格"选择学习方式，可能反而放弃了更有效的方法。一个自称"听觉型"的人如果只靠听课而不做主动回忆，效率远不如视觉+动觉结合。
  - title: '"突击填鸭式学习的长期效果几乎为零"'
    claim: 大众认知：考试前集中突击效果最好，临时抱佛脚是应试必备技能。 作者/安川康介：分散学习的效果远超集中突击。同样的8小时，分散在8天每天1小时的效果，远好于一天学8小时。原因在于遗忘曲线——集中学习的信息在24小时内大量遗忘，而间隔复习在每次即将遗忘时重新加固，记忆曲线被不断拉升。
  - title: '"交叉练习感觉更乱、得分更低，但长期效果更好"'
    claim: 大众认知：同类题型集中练习，由易到难循序渐进，这样学最扎实。 作者/安川康介：集中练习同类题在短期内确实得分更高、感觉更顺畅——但这种"快速进步"是幻觉。交叉混合不同题型的练习在短期内让人困惑、错误率上升，但在长期测试中表现远超集中练习。原因：集中练习让大脑偷懒——自动套用同一解题模板，无需真正判断问题类型。
  - title: '"睡眠是学习的延续，不是学习的敌人"'
    claim: 大众认知：少睡几小时就能多学几小时，熬夜是勤奋的表现。 作者/安川康介：牺牲睡眠换来的额外学习时间不只是得不偿失——根本起反作用。睡眠是记忆从海马体向大脑皮层转移的关键窗口。你白天学的东西，如果不经过当晚的睡眠巩固，大部分会在24小时内遗忘。熬夜学习效率降低40%——而且是在浪费之前白天所有的学习积累。
  - title: '"教别人是最好的学习方式——但重点不是教，是准备教的过程"'
    claim: 大众认知：教别人能检验自己是否真的理解——理解了才能讲清楚。 作者/安川康介：费曼技巧的真正威力不在"讲给别人听"的那一刻，而在"准备讲"的过程中。当你假装要教别人时，你的大脑自动进入了一种前所未有的主动提取模式——你会发现自己"以为懂了但说不清楚"的地方，这些恰恰是你真正需要攻克的知识盲区。
  - title: '"学习的''上瘾''不是比喻——它有真实的神经化学基础"'
    claim: 大众认知：学习需要自律和毅力，"喜欢学习"是少数人的天赋。 作者/安川康介：当学习方法匹配脑科学时，学习可以像游戏一样让人上瘾。这不是鸡汤——主动回忆→发现知识漏洞→修正→获得成就感→多巴胺释放→更想主动回忆→更多成就。这个正反馈循环是真实的神经化学回路。关键不是"逼自己喜欢学习"，而是用正确的方法激活这个回路。
  takeaway: 学习不是往脑子里装东西，是从脑子里往外掏东西——掏得越费劲，记得越牢。
