- book: 西西弗神话
  author: 阿尔贝·加缪（Albert Camus，法国）
  category: 哲学经典/西方哲学
  file: 哲学经典/西方哲学/拆书笔记-《西西弗神话》.md
  frameworks:
  - name: 荒诞三元结构
    core: 加缪的"荒诞"不是一个形容词（"这太荒诞了"），而是一个关系名词——它存在于人与世界之间，不在任何一端单独存在。
  - name: 三类逃逸路线
    core: 加缪识别出三种应对荒诞的方式，前两种是逃逸，第三种才是诚实的回应。
  - name: 荒诞英雄谱——四种活法
    core: 加缪用四个历史/文学人物示范"荒诞人"的四种生活方式——不是建议你模仿，而是展示反抗的具体形态。
  - name: 西西弗的幸福公式
    core: 这是全书的高潮和最终结论——西西弗不是悲剧英雄，而是荒诞英雄的终极形态。
  - name: 荒诞的四个后果
    core: 从荒诞的确认出发，加缪推导出四个必须同时具备的生活态度
  - name: 量的伦理学——荒诞人的计价系统
    core: 与现有框架的分工：框架三的"唐璜"是"数量伦理"的人格化示范（四种活法之一），本框架拆它背后的通用计量机制——荒诞人如何给"活得多少"计价，以及它与"质量伦理"的根本分歧。物理自杀与哲学性自杀的辨析已由框架二详述，不再重复。
  - name: 荒诞作品的三个特征——创作机制与"希望"的质检
    core: 与现有框架的分工：框架三的"创造者"讲的是人怎么活（创作作为人格姿态），本框架拆作品本身——一件作品凭什么算"荒诞作品"，它靠什么机制保持荒诞，又如何退化成哲学自杀的赝品（依据第4章"荒诞创作"与附录《弗兰兹·卡夫卡作品中的希望与荒诞》）。哲学性自杀的判定已由
  counterintuitive:
  - title: '"最严肃的哲学问题不是上帝是否存在，而是人生是否值得活"'
    claim: 大众认知：哲学研究的是宇宙的本质、道德的基础、知识的来源。
  - title: '"哲学自杀比物理自杀更危险"'
    claim: 大众认知：自杀是最大的逃避，信仰是伟大的选择。
  - title: '"清醒比幸福更重要"'
    claim: 大众认知：人生的目标是幸福——如果清醒带来痛苦，不如糊涂一点。
  - title: '"西西弗是幸福的——恰恰因为他的任务毫无意义"'
    claim: 大众认知：幸福来自成功、成就、有意义的工作。
  - title: '"反抗不需要成功——反抗本身就是意义"'
    claim: 大众认知：反抗是为了改变现状。如果反抗失败了，反抗就没有意义。
  - title: '"对荒诞的忠诚意味着拒绝一切安慰——包括反抗的安慰"'
    claim: 大众认知：反抗是一种积极的态度，是好的。
  - title: '"没有永恒——这是好消息，不是坏消息"'
    claim: 大众认知：永恒是美好的——永恒的爱、永恒的真理、永恒的秩序。
  takeaway: 石头永远会滚落——清醒地推，就是对荒诞唯一的胜利。
