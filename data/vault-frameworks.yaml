    core: 复利 × 时间 = 财富
  - name: 市场先生（Mr. Market）——人格化的市场比喻
    core: 市场先生模型
  - name: 管理层评估——诚实与能力的双重标准
    core: 巴菲特的管理层评估框架
  counterintuitive:
  - title: '"投资不需要分散——集中才是王道"'
    claim: 大众认知：投资要分散风险，不要把鸡蛋放在一个篮子里。
  - title: '"市场波动不是风险——永久亏损才是风险"'
    claim: 大众认知：股价大幅波动就是风险，账面亏损让人恐惧。
  - title: '"最好的投资不需要任何操作"'
    claim: 大众认知：好的投资者应该频繁调整、主动管理。
  - title: '"永远不要分红是一个合理的选择"'
    claim: 大众认知：分红是公司对股东的回报，不分红说明公司不好。
  - title: '"现金不是安全的——它是有成本的"'
    claim: 大众认知：手里有现金最安全，等机会来了再投资。
  - title: '"优秀企业的合理价格 > 垃圾企业的便宜价格"'
    claim: 大众认知：便宜就是好——找到低估的股票就买。
  - title: '"CEO最重要的能力不是经营——是资本配置"'
    claim: 大众认知：好的CEO应该善于经营——管理团队、控制成本、提高效率。
  takeaway: 股票不是筹码是企业，价格不是价值——守住能力圈、用安全边际买入、让复利跑够时间。
