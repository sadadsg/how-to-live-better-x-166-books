- book: 德米安
  author: 赫尔曼·黑塞（Hermann Hesse，德国/瑞士）
  category: 哲学经典/西方哲学
  file: 哲学经典/西方哲学/拆书笔记-《德米安》.md
  frameworks:
  - name: 个体化三阶段模型（Individuation Process）
    core: 阶段一：顺从与分裂（Conformity & Split）
  - name: 善恶二元对立破解模型
    core: ''
  - name: 阿布拉克萨斯（Abraxas）象征模型
    core: 阿布拉克萨斯 = 神与魔的统一体
  - name: 鸟与蛋壳意象模型
    core: 鸟（真实自我）
  - name: 该隐之印与异质者标记模型（The Mark of Cain）
    core: 与现有框架的分工：框架2讲"善恶重估"的观点层（善与恶是同一枚硬币），本框架讲"标记"的社会机制层——一个记号如何同时完成"被群体排斥"与"自我认同的开端"两件事。框架2回答"该不该拥抱黑暗"，本框架回答"被群体排斥之后怎么办"。
  - name: 引路人接力模型（The Guide Relay）
    core: 与现有框架的分工：框架1讲个体化的"阶段"（路怎么分段），本框架讲阶段之间"人"的接棒——引路人出现、供职、退场的机制。框架1是地图，本框架是"谁陪你走哪一段"的接力表。
  - name: 内心图像先导模型（Inner Image Precedes Reality）
    core: 与现有框架的分工：框架4讲鸟与蛋壳意象的"含义"（蛋壳＝世界，破壳＝诞生），框架3讲阿布拉克萨斯符号的"内容"；本框架讲意象的"功能与时间性"——内心图像先于外部现实出现，以及把图像画出来的操作方法。框架4是意象的哲学，本框架是意象的实践。
  counterintuitive:
  - title: '"真正的善，需要先拥抱恶"'
    claim: 大众认知：要做一个好人，就必须消灭内心的恶念。
  - title: '"顺从不是美德，是懦弱"'
    claim: 大众认知：听话、顺从、遵守规则是成熟的表现。
  - title: '"导师不是给你答案的人，是逼你面对自己的人"'
    claim: 大众认知：好老师应该传道授业解惑。
  - title: '"蛋壳不是监狱，是保护——但你必须主动打破它"'
    claim: 大众认知：环境限制了我，我要逃离。
  - title: '"孤独不是惩罚，是成长的必经之路"'
    claim: 大众认知：孤独是可悲的，人应该融入群体。
  - title: '"真正的反叛，不是对抗规则，而是创造自己的规则"'
    claim: 大众认知：反叛就是打破一切、对抗权威。
  - title: '"引路人退场不是关系失败，是他把你送到了站"'
    claim: 大众认知：重要的关系应该一直持续下去；导师、贵人淡出你的生活，是可惜甚至是背叛。
  takeaway: 成长不是成为“更好的人”，而是成为“更完整的人”——哪怕那个完整里包含了黑暗。
