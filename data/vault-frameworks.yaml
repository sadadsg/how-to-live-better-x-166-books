- book: 小懒财富自由之路——从基金开始
  author: '[中]小懒（网络理财博主、小红书认证创作者）'
  category: 财商与投资/财商启蒙
  file: 财商与投资/财商启蒙/拆书笔记-《小懒财富自由之路》.md
  frameworks:
  - name: 基金四分法（Fund Classification）
    core: 书中根据：第一章把基金按投资方向分四类，每类风险收益特征明确——这是入门第一个必须掌握的工具识别框架。
  - name: 微笑曲线（The Smile Curve）
    core: 书中根据：第二章核心可视化。定投的精髓不是"涨了赚钱"，而是"跌了买到更多份额"——市场下跌时同样的钱买更多，市场回升时盈利自然出现。
  - name: 懒人选基排除法（The Lazy Elimination Method）
    core: 书中根据：第三、四章给出的"懒得研究"也能选对基金的方法——不是"选出最好的"，而是"排除最差的"。
  - name: 指数红绿灯（Index Traffic Light）
    core: 书中根据：第四章"什么时候买入指数基金"——用估值百分位（PE/PB 处于历史多少分位）作为简化版的择时信号。
  - name: 跑赢三基准（Beat the Three Benchmarks）
    core: 书中根据：第十二章核心——"什么叫真富了？"答案是你的财富增长率必须跑赢三道线。
  - name: 资产配置三维（Three Dimensions of Asset Allocation）
    core: 书中根据：第十章"鸡蛋分开存放"——用三个维度同时分散风险，覆盖不同市场环境。
  - name: 美林投资时钟（Merrill Lynch Investment Clock）
    core: 书中根据：第十章引入的经典经济周期配置框架——根据经济所处阶段调整股/债/商品/现金配比。
  - name: 定期再平衡（Periodic Rebalancing）
    core: 书中根据：第十章关键纪律——通过卖出涨多的、买入跌多的，自动实现"高抛低吸"。
  - name: 止盈分批法（Gradual Profit-Taking）
    core: 书中根据：第六章核心——定投不止盈，30 年可能还是 0 收益。止盈不是"预测高点"，而是"达到目标就动手"。
  - name: 财务自由公式（The Freedom Formula）
    core: 书中根据：第十二章给出的可计算锚点——自由 = 被动收入 ≥ 支出。
  counterintuitive:
  - title: '"7 日年化收益率是骗人的，看万份收益才真实"'
    claim: 大众认知：余额宝、零钱通的"7 日年化收益率 2.5%"就是真实的年化收益。
  - title: '"货币基金不保本，余额宝也会亏"'
    claim: 大众认知：货币基金=准存款，绝对安全。
  - title: '"净值低的基金≠便宜基金，1 元的和 5 元的可能是同一回事"'
    claim: 大众认知：净值 1 元的基金比净值 5 元的便宜，应该买便宜的。
  - title: '"长期来看，90% 的主动基金跑不赢指数"'
    claim: 大众认知：基金经理专业管理，应该比普通人买指数赚得多。
  - title: '"亏损时不要停，继续定投才能摊薄成本"'
    claim: 大众认知：基金跌了，要止损避免亏更多。
  - title: '"跑赢 CPI 算保值，跑赢 M2 才算真富"'
    claim: 大众认知：理财收益 > 银行存款利率就算赢了。
  takeaway: 选宽基、定投、止盈、再平衡——懒人四件套，跑赢三基准。
