- book: 创新者的窘境
  author: 克莱顿·克里斯坦森（Clayton M. Christensen）
  category: 创业与商业/创新与产品方法论
  file: 创业与商业/创新与产品方法论/拆书笔记-《创新者的窘境》.md
  frameworks:
  - name: 价值网络（Value Network）
    core: 核心问题：为什么好公司会忽视颠覆性创新？
  - name: 维持性创新 vs 颠覆性创新
    core: 核心问题：这两种创新有什么本质区别？
  - name: 技术S曲线与性能轨迹
    core: 核心问题：为什么颠覆性创新最终能取代主流产品？
  - name: 延续性创新的陷阱
    core: 核心问题：为什么在位者在维持性创新中做得越好，就越容易被颠覆？
  - name: 在位者优势陷阱
    core: 核心问题：为什么在位者的优势反而成了劣势？
  - name: 利润最优客户陷阱
    core: 核心问题：为什么听客户的话反而会害死公司？
  - name: 创新者的窘境
    core: 核心问题：好公司如何避免被颠覆？
  counterintuitive:
  - title: '"管理越好，死得越快"'
    claim: 大众认知：好公司之所以好，是因为管理好、执行力强、贴近客户。
  - title: '"听客户的话反而会害死公司"'
    claim: 大众认知：好公司应该倾听客户、满足客户需求。
  - title: '"颠覆性创新一开始看起来像个玩具"'
    claim: 大众认知：创新应该是技术先进、性能卓越、利润丰厚的。
  - title: '"技术供给可能超过市场需求"'
    claim: 大众认知：产品性能越高越好，客户永远需要更好的产品。
  - title: '"在位者的优势反而成了劣势"'
    claim: 大众认知：大公司有资源、有客户、有品牌，应该更容易创新。
  - title: '"解决方案不是''更努力''，而是''换一种方式思考''"'
    claim: 大众认知：公司失败是因为不够努力、不够聪明、不够贴近客户。
  takeaway: 好公司失败不是因为管理差，而是因为管理太好了——它们做了所有"正确"的事，但这些"正确"的事加在一起，让它们一步步走向深渊。
