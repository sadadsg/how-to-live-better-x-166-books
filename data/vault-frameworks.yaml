- book: 抑郁的力量
  author: '[日]泉谷闲示'
  category: 心理学与行为科学/情绪与内耗
  file: 心理学与行为科学/情绪与内耗/拆书笔记-《抑郁的力量》.md
  frameworks:
  - name: 抑郁的三重误解模型
    core: 泉谷闲示揭示了三个最根深蒂固的误解
  - name: 理性 vs 本能的拉锯战
    core: 这是全书最核心的模型——解释了抑郁发生的根本机制
  - name: 抑郁的五种革命性应对策略
    core: 泉谷提出的不是"治愈方法"，而是"与抑郁共处"的五种策略
  - name: 抑郁的三阶段模型
    core: 抑郁的三阶段
  - name: 身体优先恢复顺序（Body-First Recovery Sequence）
    core: 与框架4的分工：框架4讲"怎么倒下的"（发病三阶段），本框架讲"怎么站起来的"——康复不是整体均匀回暖，而是有严格的先后顺序。
  - name: 药物与治疗的定位（Medication as Toolbox）
    core: 与框架3的分工：框架3是你自己能做的五种策略，本框架回答"那还要不要看医生、吃药、做咨询"——把治疗工具箱里每样工具"能干什么、不能干什么"说清楚。
  - name: 复发预防与压力-复发链条（Relapse Prevention Loop）
    core: 与框架4的分工：框架4止步于"破茧期"——身体强制你停下来的那一刻；本框架管破茧之后：为什么有人从此换了活法，有人半年后原样复发。
  counterintuitive:
  - title: '"抑郁不是病，是身体的保护机制"'
    claim: 大众认知：抑郁是一种需要治疗的疾病
  - title: '"越努力康复，越难康复"'
    claim: 大众认知：要积极治疗、主动康复
  - title: '"最坚韧的人最容易抑郁"'
    claim: 大众认知：抑郁是因为脆弱、承受力差
  - title: '"振作起来"是最有害的建议'
    claim: 大众认知：抑郁时要振作、要积极
  - title: '"身体比大脑更诚实"'
    claim: 大众认知：理性思考是做正确决定的基础
  - title: '"抑郁是觉醒的契机"'
    claim: 大众认知：抑郁是人生的灾难和低谷
  - title: '"什么都不做"是最难也最重要的事'
    claim: 大众认知：要找事做、要保持忙碌
  takeaway: 抑郁不是需要消灭的敌人，是身体发出的求救信号——停下来，听它说话。
