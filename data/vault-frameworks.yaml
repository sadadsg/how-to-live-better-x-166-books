- book: 动机心理学
  author: '[美]爱德华·伯克利、梅利莎·伯克利'
  category: 心理学与行为科学/人格与动机
  file: 心理学与行为科学/人格与动机/拆书笔记-《动机心理学》.md
  frameworks:
  - name: 自决理论（SDT）——动机的底层操作系统
    core: 这是全书的理论基石，由爱德华·德西和理查德·瑞安提出，经过40年实证验证
  - name: 内在动机 vs 外在动机光谱
    core: 动机光谱：从内在到外在
  - name: 动机四阶段模型——从目标到完成的完整路径
    core: 伯克利夫妇提出了目标追求的完整周期
  - name: TOTE模型——动机的控制论机制
    core: TOTE模型：动机的闭环控制机制
  - name: 心流模型——内在动机的最高形式
    core: 米哈里·契克森米哈赖的心流理论，是本书的"高潮章节"
  - name: 自我控制——有限的资源 vs 聪明的策略
    core: 自我控制：不是意志力，是策略问题
  - name: 归因与调节焦点——你如何解释世界决定你的动机
    core: 归因风格 × 调节焦点 = 你的动机模式
  - name: 目标选择理论——成就目标×期望价值
    core: 伯克利整合了成就目标理论和期望价值理论，解释"你为什么选择做这件事"
  - name: 自我效能理论——你相信自己能做到吗
    core: 班杜拉的自我效能理论是动机的"信念引擎"
  - name: 动机的隐藏维度——自动动机×个体差异
    core: 动机不全是显意识的——有些目标在你不知道的情况下驱动你的行为
  counterintuitive:
  - title: '"外在奖励会毁掉内在动机"'
    claim: 大众认知：想让人多做事，就多给奖励。
  - title: '"最好的自控是不需要自控"'
    claim: 大众认知：自律的人意志力强。
  - title: '"''等有了动力再行动''是本末倒置"'
    claim: 大众认知：动力是行动的前提。
  - title: '"你的''不行''往往不是因为能力，是因为归因方式"'
    claim: 大众认知：我做不好是因为我不擅长这个。
  - title: '"心流不需要''努力''——它是大脑最喜欢的节能模式"'
    claim: 大众认知：心流很难进入，需要高度专注和努力。
  - title: '"''我应该''是最差的动机来源"'
    claim: 大众认知：责任感驱动人前进。
  - title: '"''目标越具体越好''是对的——但大多数人只设了''目标''没设''计划''"'
    claim: 大众认知：设定目标就是成功的一半。
  - title: '"延迟满足不是''忍着''，是''让等待变得值得''"'
    claim: 大众认知：延迟满足需要强大的忍耐力。
  takeaway: 不要问"怎么才有动力"——问"我的自主、能力、归属哪个没被满足"，答案就在问题里。
