  - name: 价值理论——使用价值 vs 交换价值
    core: 钻石 vs 水（价值悖论）
  - name: 三大生产要素与收入分配
    core: 国民收入的三重来源与分配
  - name: 储蓄-投资循环——资本积累的动力学
    core: 储蓄-投资循环
  - name: 生产性劳动 vs 非生产性劳动
    core: 生产性劳动 vs 非生产性劳动
  - name: 绝对优势理论——国际贸易的奠基
    core: 贸易不是零和博弈（重商主义的错误）
  - name: 税收四原则
    core: 斯密的税收四原则
  - name: 政府三大职能与"有限政府"
    core: 政府的三大合法职能
  - name: 重商主义的三大谬误
    core: 重商主义的三大谬误
  - name: 分工的上限——市场规模
    core: '"分工受限于市场范围"'
  - name: 斯密的历史观——经济发展的自然进程
    core: 经济发展的自然进程
  - name: 货币的起源与三大职能
    core: 斯密在第一篇第三章专门讨论了货币——这是分工的必然产物，也是市场的基础设施
  - name: 工资、利润、地租的变动规律
    core: 斯密在第一篇后半部分系统分析了三种收入的变动规律——这是经济学的"动力学"
  - name: 垄断与价格管制的扭曲
    core: 斯密在第四篇深入分析了两种扭曲价格机制的力量——私人垄断与政府限价
  - name: 公共债务与殖民地负担
    core: 斯密在第五篇对当时流行的两个政策进行了尖锐批评——国债和殖民地统治
  - name: 分工的两难——效率 vs 同情（斯密的双面性）
    core: 斯密一生写过两本传世之作：《道德情操论》（1759）讲"同情"，《国富论》（1776）讲"自利"。两个斯密如何统一？这是理解斯密的关键
  counterintuitive:
  - title: '"不是善良让世界运转，是自利"'
    claim: 大众认知：经济发展靠企业家的社会责任感和道德消费。
  - title: '"分工不是把人变笨，是把所有人变富"'
    claim: 大众认知：流水线分工把人变成机器、失去创造力。
  - title: '"水比钻石有用一万倍，但比钻石便宜一万倍"'
    claim: 大众认知：值钱的东西一定"有用"。
  - title: '"政府越小，国家越富"'
    claim: 大众认知：国家财富需要政府强力干预、规划产业。
  - title: '"高工资对国家是好事"'
    claim: 大众认知：低工资才能降低成本、提高竞争力。
  - title: '"节俭者是公共恩人，奢侈者是公众敌人"'
    claim: 大众认知：消费刺激经济，消费越多越好。
  - title: '"利润率会自然下降——这是经济成熟的标志"'
    claim: 大众认知：资本越多越好，投资越多越好。
  - title: '"殖民地贸易垄断对本国有害"'
    claim: 大众认知：殖民地是国家财富的来源。
  - title: '"限制价格等于限制供给"'
    claim: 大众认知：政府限价是保护穷人的善政。
  - title: '"分工让人变富，也让人变蠢"'
    claim: 大众认知：现代人的知识水平远超古代。
  takeaway: 一个国家的富强不靠国库里的金银，靠的是把每个人变成自己领域的专家，然后让他们自由交换——分工创造财富，自利在制度下导向公益，市场在竞争中自我修正。这就是经济学250年不变的元命题。
