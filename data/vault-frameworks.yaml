    core: 从解释到设计：带宽友好的制度（结语部分）
  counterintuitive:
  - title: '"穷人不是因为蠢才穷，是因为穷才变''蠢''"'
    claim: 大众认知：穷人之所以穷，是因为他们不够聪明、不够努力、做出了错误的决策。
  - title: '"余闲不是浪费，而是最便宜的保险"'
    claim: 大众认知：效率就是把所有资源用满——空闲是浪费。
  - title: '"忙碌和贫穷是同一种认知疾病"'
    claim: 大众认知：忙碌的人是高效的人，贫穷的人是失败的人。
  - title: '"带宽税是隐形的——你以为你在正常思考，其实你只用了半脑子"'
    claim: 大众认知：我今天状态不好，效率低。
  - title: '"计划对穷人无效，不是因为他们不自律，而是因为计划需要带宽"'
    claim: 大众认知：穷人不做计划是因为他们懒、没有远见。
  - title: '"稀缺会让你''借用''——而借用的代价远超你的想象"'
    claim: 大众认知：先借用一下，等有钱/有时间了再还。
  - title: '"稀缺也会让你变强——但这份红利靠不住"'
    claim: 大众认知：稀缺是纯粹的坏事，资源一紧人就垮。
  - title: '"富人买东西不假思索，不是大手大脚，是免于权衡的奢侈品"'
    claim: 大众认知：穷人对钱精打细算是美德，富人随随便便买是挥霍。
  - title: '"帮助穷人，给信息不如给带宽"'
    claim: 大众认知：穷人不领福利、不申请助学金、不参加培训，是因为他们不知道这些信息。
  takeaway: '**穷不是性格，是认知状态——稀缺偷走了你的带宽，先造余闲，再谈改变。'
