- book: 理解人性
  author: '[奥]阿尔弗雷德·阿德勒（Alfred Adler）'
  category: 心理学与行为科学/人格与动机
  file: 心理学与行为科学/人格与动机/拆书笔记-《理解人性》.md
  frameworks:
  - name: 自卑→补偿→超越——行为根本动力模型
    core: 这是阿德勒个体心理学的发动机。所有人的行为最终都可以还原到这个模型上
  - name: 目的论 vs 因果论——你的未来决定你的过去
    core: 阿德勒最核心的创见——与弗洛伊德的根本分歧
  - name: 性格形成模型——性格是你自创的生存策略
    core: 阿德勒对"性格"的定义极具革命性
  - name: 性格特征分类光谱
    core: 阿德勒把性格特征按"社会感强弱"分为两大类，辅以其他表现
  - name: 出生顺序——童年格局如何塑造人生剧本
    core: 阿德勒是第一个系统研究出生顺序对性格影响的心理学家
  - name: 个体心理学诊断方法——如何"阅读"一个人
    core: 阿德勒提供了一套观察人的方法，可以像阅读一本书一样理解一个人的行为
  - name: 精神生活的社会性——不存在"脱离社会的个人心理"
    core: 这是整本书的地基，也是最容易被跳过的前提：框架1讲的"自卑→补偿"不是在真空里运转的，它时刻受到外部约束系统的挤压。
  - name: 世界观滤镜——知觉、记忆、梦都为目标服务
    core: 框架6给出了"读人"的线索清单（早期记忆、姿态、位置），但没有回答：为什么这些线索是可靠的？阿德勒的回答是——因为心理内容的每一次筛选都服务于目标。
  - name: 溺爱——性格偏差的头号生产线
    core: 框架3讲性格策略的形成过程（个体视角），阿德勒在"儿童与社会"一章给出了更具体的土壤分析：三种典型的童年处境，通向三种典型的生活风格偏差。
  - name: 情绪的工具箱——每种情绪都是达成目标的手段
    core: 框架4给性格特征做了静态分类，但没有展开阿德勒对"情绪"的动态诊断：在他眼里，情绪不是被触发的反应，而是被调用的工具。
  - name: 理解人性的方法论——先懂自己，才能懂别人
    core: 全书第一章和结语最容易被跳过，但它们合起来是阿德勒给读者的"使用说明书"：这套框架的第一个分析对象必须是你自己。
  counterintuitive:
  - title: '"人的性格不是天生的，不是遗传的——是你自己选择的生存策略"'
    claim: 大众认知：性格是天生+环境塑造的结果，很难改变
  - title: '"你不是被过去决定的——你是被未来目标决定的"'
    claim: 大众认知：童年的创伤解释了我今天的痛苦
  - title: '"自卑感不是弱点——它是进步的发动机"'
    claim: 大众认知：自卑感是缺陷，要消除它
  - title: '"社会感——而不是自信/成功——才是心理健康的唯一指标"'
    claim: 大众认知：心理健康 = 自信、快乐、成功
  - title: '""我不行"通常不是事实，是一个被使用的借口"'
    claim: 大众认知："我不行"是一个诚实的能力判断
  - title: '"嫉妒不是在说对方太好——是在说你对自己的不满"'
    claim: 大众认知：嫉妒是因为别人拥有的比我多
  - title: '"教育中最大的错误是惩罚——惩罚不会让孩子变好，只会让孩子更擅长逃避"'
    claim: 大众认知：犯错就要惩罚，让孩子长记性
  - title: '""男性优越"是一种社会建构，而不是自然规律"'
    claim: 大众认知：男性天生在某些方面比女性优越
  - title: '"被溺爱的孩子是未来生活的敌人——溺爱是比忽视更隐蔽的灾难"'
    claim: 大众认知：爱孩子就是尽量满足ta、替ta扫清障碍
  - title: '"情绪不是被触发的——是被使用的"'
    claim: 大众认知：情绪是外界刺激的自动反应，"他惹我生气"
  - title: ⑪ "理解人性的最大障碍是不懂自己——评判他人比审视自己便宜"
    claim: 大众认知：读人是一眼看穿别人的本事
  takeaway: 你不是天生如此——你的性格是你小时候为了活下去选的一套策略，现在你可以选新的。
