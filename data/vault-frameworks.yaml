- book: 事实
  author: '[瑞典]汉斯·罗斯林（Hans Rosling）与奥拉·罗斯林、安娜·罗朗德'
  category: 心理学与行为科学/认知科学
  file: 心理学与行为科学/认知科学/拆书笔记-《事实》.md
  frameworks:
  - name: 事实性思维总纲——认知操作系统切换
    core: 罗斯林整个书的核心，是一套从"情绪化本能驱动"切换到"事实性数据驱动"的认知操作系统
  - name: 四层级世界观——替代"发达国家vs发展中国家"
    core: 这是全书最底层的认知升级——用一个四层级模型替代过时的"南北二分法"
  - name: 十大直觉偏差一览（全书核心脚手架）
    core: 罗斯林提炼了十种系统性地扭曲认知的直觉本能。以下是完整的对照图谱
  - name: 风险计算公式
    core: 风险 = 危险 × 暴露频率
  - name: 事实性决策四步法
    core: 罗斯林没有明确给出这个框架，但全书逻辑可以提炼为一个可复用的决策流程
  - name: 单一视角直觉——专家的锤子与组合偏差（Single Perspective Instinct）
    core: 对应原书第8章。人们常说"专家预测常错"，归因于"世界太复杂"。罗斯林的诊断更扎心：专家不是知道得不够，而是工具箱里只有一把锤子——马斯洛那句"手里只有锤子的人，看什么都像钉子"，在专家身上以更精密的形式重演。
  - name: 规模直觉与二八法则——数字没有比例就没有意义（Size Instinct & the 80/20 Rule）
    core: 对应原书第5章。孤立的大数字天然显得巨大，大脑对它没有参照系。媒体深谙此道：永远给你分子，从不给你分母。
  counterintuitive:
  - title: '"大多数人（包括诺贝尔奖得主）对世界基本事实的判断，不如黑猩猩随机乱猜"'
    claim: 大众认知：受过教育的人对世界有基本的正确认知
  - title: '"世界其实在以人类历史上从未有过的速度变好"'
    claim: 大众认知：世界越来越糟，危机四伏，什么都完了
  - title: '"发达国家的孩子和贫困国家的孩子，区别比你想象的小得多"'
    claim: 大众认知：发达国家vs发展中国家是完全不同的世界
  - title: '""恐惧"不是你做决策时的好参谋"'
    claim: 大众认知：恐惧是保护自己的有效信号
  - title: '""再不做就晚了"——大部分时候是假的"'
    claim: 大众认知：紧迫感是行动的催化剂
  - title: '""坏人"不是这个世界出问题的原因"'
    claim: 大众认知：找到坏人，解决问题
  - title: '""手里有锤子的人"比你想象的多——包括你自己"'
    claim: 大众认知：专家有更好的判断力
  - title: '""大多数人"可能只有51%——别被"大多数"这个词骗了"'
    claim: 大众认知："大多数人"意味着压倒性多数
  takeaway: 你的大脑天生会把世界想得更糟、更简单、更可怕——用数据对抗本能，才是真正的理性。
