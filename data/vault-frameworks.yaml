  author: '[美] 罗伯特·T. 清崎 / 莎伦·L. 莱希特'
  category: 财商与投资/投资进阶
  file: 财商与投资/投资进阶/拆书笔记-《富爸爸投资指南》.md
  frameworks:
  - name: 投资五阶段模型
    core: 投资五阶段模型
  - name: 投资者分类金字塔
    core: 终极投资者   ← 创造投资产品的人
  - name: B-I三角形（企业投资框架）
    core: B-I 三角形
  - name: 现金流象限（ESBI）
    core: S（自雇）  B（企业主）
  - name: 投资三大核心原则
    core: 投资三大核心原则
  - name: 90/10之谜（The 90/10 Riddle）
    core: 是什么：富爸爸留给清崎的一道谜题——"10%的投资者赚走了90%的钱，他们做了什么大多数人没做的事？"大多数人的答案是"找到更好的投资产品""抓住更准的时机"，富爸爸的答案完全相反：这10%的人不是在购买投资，而是在创造投资。他们是资产的制造者与卖出者，而不是
  - name: 好债务与坏债务（Good Debt vs Bad Debt）
    core: 是什么：成熟投资者的核心工具不是"不欠债"，而是"区分债务"。清崎的定义：好债务 = 由别人替你偿还的债务（资产产生的现金流覆盖月供）；坏债务 = 从你口袋里掏钱去还的债务（消费贷、车贷、自住房贷）。债务本身不是问题，"谁在为这笔债打工"才是问题。
  counterintuitive:
  - title: '"真正的投资不是买股票，而是投资你自己"'
    claim: 大众认知：投资就是买股票、基金、房产。
  - title: '"自住房不是资产，是负债"'
    claim: 大众认知：房子是最大的资产。
  - title: '"穷人和中产阶级买负债，富人买资产"'
    claim: 大众认知：有钱人买更贵的东西。
  - title: '"投资是一种计划，不是一种产品"'
    claim: 大众认知：找到好的投资产品就能赚钱。
  - title: '"用企业为载体投资，而不是用个人名义"'
    claim: 大众认知：用个人名义投资更简单。
  - title: '"投资最大的风险不是市场波动，而是你没有财务教育"'
    claim: 大众认知：投资最大的风险是亏钱。
  - title: '"焦虑只会浪费时间，阻止你想出解决问题的办法"'
    claim: 大众认知：担心风险是谨慎的表现。
  - title: '"词汇形成思维，思维形成现实，现实成为生活"'
    claim: 大众认知：学习新知识很重要。
  takeaway: 投资的不是产品，是你自己——先投资财务教育，再投资能产生现金流的资产。
