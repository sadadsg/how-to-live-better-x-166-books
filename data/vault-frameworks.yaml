- book: 反脆弱
  author: 纳西姆·尼古拉斯·塔勒布（Nassim Nicholas Taleb）
  category: 经济学与社会/经济学通俗
  file: 经济学与社会/经济学通俗/拆书笔记-《反脆弱》.md
  frameworks:
  - name: 三元结构（全书骨架）
    core: 塔勒布用这个三分法替换了传统的"脆弱 vs 坚固"二元对立
  - name: 波动性才是信息
    core: 塔勒布的根本洞察——大多数人对波动的理解是错的
  - name: 过度补偿机制——反脆弱的生物学基础
    core: 脆弱的系统 vs 反脆弱的系统（行为对比）
  - name: 杠铃策略（Barbell Strategy）
    core: 这是塔勒布给出的核心实操方法——同时持有两个极端，放弃中间
  - name: 林迪效应（Lindy Effect）——什么东西真的会存活
    core: 这是塔勒布在《反脆弱》中大力发展的一个洞见（最早由作家本华·曼德博提出）
  - name: 否定法（Via Negativa）——知道不做什么比做什么更重要
    core: 否定法：精华版
  - name: 火鸡问题（The Turkey Problem）
    core: 塔勒布最著名的比喻之一——用来解释为什么"过去的数据不能预测未来"
  counterintuitive:
  - title: '"稳定不是健康——稳定是在积累脆弱性"'
    claim: 大众认知：一个平稳运行的系统 = 健康的系统。波动 = 问题。
  - title: '"越是''保护''一个系统，它越脆弱"'
    claim: 大众认知：孩子要保护起来不让他受伤、老人不要做剧烈运动、公司不该经历动荡。
  - title: '"中间路线是最危险的位置"'
    claim: 大众认知：不极端、不走极端、中庸之道最明智。
  - title: '"过去存在的越久的东西，未来也会存在越久——新东西反而是危险的"'
    claim: 大众认知：新 = 更好、更先进。要追趋势、追新技术。
  - title: '"不要试图预测黑天鹅——你预测不了——但你可以设计一个欢迎黑天鹅的系统"'
    claim: 大众认知：不确定性很危险，所以我要努力预测未来、掌握更多信息、做更精确的规划。
  - title: '"风会熄灭蜡烛，但却能使火堆越烧越旺——关键是你是什么"'
    claim: 大众认知：面对混乱和不确定性，保护自己最重要。
  - title: '"大多数时候，不做什么比做什么更重要"'
    claim: 大众认知：要变得更好，我需要"增加"——学更多、做更多、拥有更多。
  - title: '"专家不一定可信——但经验主义的从业者往往可信"'
    claim: 大众认知：学历、证书、学术成果 = 权威。
  takeaway: '**要想在不确定的世界里活得好，就别想着躲避风浪——去变成那个需要风浪才能燃烧的火。'
