- book: 小岛经济学
  author: '[美]彼得·D·希夫（Peter D. Schiff）、安德鲁·J·希夫（Andrew J. Schiff）'
  category: 经济学与社会/经济学通俗
  file: 经济学与社会/经济学通俗/拆书笔记-《小岛经济学》.md
  frameworks:
  - name: 小岛经济发展全景——从徒手抓鱼到量化宽松
    core: 全书就是一座小岛的经济演化史，每一步都是一个经济学原理的具象化
  - name: 经济增长的根本公式
    core: 这是全书最核心的公式，理解了这个就理解了全书
  - name: 储蓄 vs 消费——被颠倒的因果关系
    core: 储蓄 vs 消费：到底谁在推动经济？
  - name: 鱼本位 vs 纸币——货币的本质
    core: 从鱼到纸币：货币的堕落史
  - name: 经济周期——繁荣→泡沫→崩盘的底层逻辑
    core: 经济周期的寓言拆解
  - name: 国际贸易——中岛帝国隐喻
    core: 国际贸易的寓言：中岛帝国
  counterintuitive:
  - title: '"促进经济增长的不是消费，而是生产"'
    claim: 大众认知：消费拉动经济——大家都不花钱，经济就完了。
  - title: '"储蓄比消费对经济更有益"'
    claim: 大众认知：储蓄是"把钱锁在箱子里"，对经济没贡献；消费才是拉动经济的。
  - title: '"通货紧缩不是恶魔——它是经济健康的标志"'
    claim: 大众认知：通缩是坏事——物价下跌=经济衰退。
  - title: '"最低工资伤害了它想帮助的人"'
    claim: 大众认知：最低工资保护低收入者。
  - title: '"经济衰退是良药，不是疾病"'
    claim: 大众认知：衰退是灾难，政府必须出手挽救。
  - title: '"量化宽松不是救命药——是偷偷征税"'
    claim: 大众认知：美联储印钞是为了救经济。
  - title: '"自由贸易永远比贸易战好——但前提是货币诚实"'
    claim: 大众认知：贸易逆差是坏事，说明我们在吃亏。
  - title: '"政府不能创造真正的就业"'
    claim: 大众认知：经济不好时政府搞基建、增加公共就业。
  takeaway: 经济增长只有一个来源——你造出比吃掉更多的东西——所有偏离这个常识的政策最终都会反噬。
