- book: 真实的幸福
  author: 马丁·塞利格曼（Martin Seligman，美国）
  category: 心理学与行为科学/幸福心理学
  file: 心理学与行为科学/幸福心理学/拆书笔记-《真实的幸福》.md
  frameworks:
  - name: 真实的幸福三维度（Three Dimensions of Authentic Happiness）
    core: 塞利格曼的幸福模型——幸福不只是"快乐"，而是三个维度的叠加
  - name: 性格优势与美德（Character Strengths and Virtues）
    core: 塞利格曼的性格分类体系——每个人都有独特的"性格优势组合"
  - name: 乐观的解释风格（Optimistic Explanatory Style）
    core: 塞利格曼对乐观的研究——乐观不是天生的，是可以学习的
  - name: 享乐适应与幸福陷阱（Hedonic Adaptation & Happiness Trap）
    core: 塞利格曼对"为什么有钱不一定幸福"的解释
  - name: 幸福公式 H = S + C + V（The Happiness Formula）
    core: 塞利格曼的幸福总公式——持久的幸福水平（H）由三个变量决定
  - name: 工作三分类（Job, Career & Calling）
    core: Wrzesniewski 的研究（塞利格曼在书中引用）——工作没有变，人对工作的"框定"变了
  - name: 品味五技巧（Savoring）
    core: 品味（Bryant & Veroff 的概念，塞利格曼引用）——有意识地把注意力放在愉悦体验上，让它停留、放大、可重访。享受是被动发生，品味是主动练习。
  counterintuitive:
  - title: '"乐观不是天生的，是可以学习的技能"'
    claim: 大众认知：有些人天生乐观，有些人天生悲观——这是性格，改不了。 作者/Martin Seligman：塞利格曼的研究证明：悲观的解释风格可以被"训练"成乐观的解释风格。用ABCDE方法，任何人都能变得更乐观。这不是"盲目自信"，是"合理的解释"。
  - title: '"幸福感在年收入超过7.5万美元后不再增加"'
    claim: 大众认知：钱越多越幸福。 作者/Martin Seligman：研究表明：在美国，年收入超过7.5万美元后，幸福感基本不再随收入增加。钱能解决"基本需求"带来的不幸福，但不能解决"意义缺失"带来的不幸福。
  - title: '"缺点不需要改正，优势需要发挥"'
    claim: 大众认知：要成功，必须改掉缺点。 作者/Martin Seligman：研究证明：成功者不是"没有缺点的人"，而是"最会用优点的人"。在缺点上你最多能达到"及格"，但在优点上你能达到"卓越"。与其花时间补短板，不如花时间用长板。
  - title: '"快乐来自''享受''，满足来自''投入''，意义来自''奉献''"'
    claim: 大众认知：快乐就是幸福。 作者/Martin Seligman：快乐只是幸福的一个维度。真正的幸福需要三个维度：愉悦（快乐的感觉）、投入（心流体验）、意义（服务于更大的目标）。只有快乐的人可能很空虚，只有投入的人可能很孤独，只有意义的人可能很痛苦。三者兼有才是"真实的幸福"。
  - title: '"享乐适应是幸福最大的敌人——它让你对一切快乐都麻木"'
    claim: 大众认知：只要我拥有了X，我就会一直幸福。 作者/Martin Seligman：享乐适应会让你对任何快乐都麻木。中了彩票6个月后回到原来的幸福水平，买了新车3个月后习以为常。幸福不是"达到某个状态"，而是"持续的实践"——你需要不断创造新鲜感、变化、感恩。
  - title: '"悲观者往往更''准确''，但乐观者更''成功''"'
    claim: 大众认知：乐观的人是因为看不到现实。 作者/Martin Seligman：研究发现：悲观者对现实的评估往往更"准确"，但乐观者更"成功"——因为乐观者更坚持、更愿意尝试、更少放弃。准确但不行动，不如不准确但行动。
  - title: '"真正有效的''环境改善''少得可怜——结婚算一个，加薪、学历、好气候都不算"'
    claim: 大众认知：改善外部条件——赚更多钱、搬到气候更好的城市、升职换岗——就能更幸福。 作者/Martin Seligman：塞利格曼在幸福公式 H=S+C+V 里逐项盘点环境变量后发现：长期有效的只有寥寥几项（生活在富裕民主社会、结婚、有信仰、避开持续的消极情绪），而收入（超过基本线后）、学历、气候对持久幸福的影响都小得出奇——因为享乐适应会把它们全部吞掉。
  takeaway: 幸福不是"没有痛苦"，而是"有目标、有投入、有优势"——这是一种可以培养的能力，不是运气。
