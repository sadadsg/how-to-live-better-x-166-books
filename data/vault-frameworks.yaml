- book: 小狗钱钱2
  author: '[德]博多·舍费尔（Bodo Schäfer）'
  category: 财商与投资/财商启蒙
  file: 财商与投资/财商启蒙/拆书笔记-《小狗钱钱2》.md
  frameworks:
  - name: 甜甜圈理论（Donut Theory）
    core: 这是全书的核心隐喻，也是第二本区别于第一本的根本框架。
  - name: 七大品格法则
    core: 舍费尔没有把品格定义为模糊的"做个好人"，而是拆成了七条具体的、可练习的法则。每一条都有对应的行为定义和练习方式。
  - name: 品格的练习模型（不是"知道"而是"练到"）
    core: 舍费尔的核心方法论：品格不是天生的性格，是可以像肌肉一样训练的能力。
  - name: 从"好先生"到导师模型
    core: 书中吉娅在美国学校遇到了导师"好先生"（Mr. Good），他不是直接告诉你答案，而是用提问和示范引导吉娅自己发现品格的力量。
  - name: 吉娅的美国之旅——跨文化成长模型
    core: 吉娅的成长路径
  - name: 品格 × 财务的双螺旋
    core: 两本书的真正力量不在各自独立，而在于它们构成了一个双螺旋结构——品格和财务能力互相强化。
  counterintuitive:
  - title: '"品格不是天生的，是可以练出来的"'
    claim: 大众认知：有些人天生善良，有些人天生冷漠——品格是性格的一部分，改不了。
  - title: '"有钱不等于成功——空心甜甜圈咬一口就知道"'
    claim: 大众认知：赚到钱就是成功了。
  - title: '"教你赚钱的书很多，教你配得上钱的书很少"'
    claim: 大众认知：理财教育就是教怎么赚钱、存钱、投资。
  - title: '"舒适区里学不到品格"'
    claim: 大众认知：在熟悉的环境里慢慢修炼品格就好。
  - title: '"感恩不是鸡汤，是认知训练"'
    claim: 大众认知：感恩是心灵鸡汤，说出来很矫情。
  - title: '"品格是最高效的社交货币"'
    claim: 大众认知：社交靠情商、靠会说话、靠关系网。
  - title: '"教别人品格比学品格更有用"'
    claim: 大众认知：自己先学好，再教别人。
  takeaway: '**赚钱能力决定你能走多快，品格决定你能走多远——两样都有的人才是完整的甜甜圈。'
