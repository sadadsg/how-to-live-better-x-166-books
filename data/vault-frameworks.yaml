- book: 黄帝内经
  author: 托名黄帝，岐伯、伯高、少师、雷公等问答（集体编纂，约战国至两汉，中国）
  category: 科学与身体
  file: 科学与身体/拆书笔记-《黄帝内经》.md
  frameworks:
  - name: 阴阳动态平衡模型
    core: 阴阳不是"好与坏"的对立，是一把可以移动的标尺。
  - name: 五行生克乘侮网络
    core: 关键洞见：五行描述的是关系，不是物质。 同一个对象在不同关系里可以同时是"生我的"和"克我的"——这在现代分类学里根本不成立。
  - name: 藏象系统：藏于内，象于外
    core: '"藏象"两个字是关键：藏于内，象于外。说的不是器官，是"功能"和"功能的外在征候"。'
  - name: 病机十九条：症状归因到上游
    core: 这是全书迁移价值最高的框架，也是最容易被当成古方忽略的框架。
  - name: 治未病三层防线
    core: 《素问·四气调神大论》：「是故圣人不治已病治未病，不治已乱治未乱，此之谓也。夫病已成而后药之，乱已成而后治之，譬犹渴而穿井，斗而铸锥，不亦晚乎？」
  - name: 标本与治病求本
    core: 《素问·标本病传论》：「知标本者，万举万当；不知标本，是谓妄行。」
  - name: 四时养生与五运六气节律
    core: 《素问·上古天真论》给出总纲
  - name: 形神一体与情志致病
    core: 内经没有"心理影响健康"这种委婉说法。它直接把情绪列为病因。
  - name: 整体观与医德：如何诊断一个复杂系统
    core: 这是全书最被低估、也最能迁移到任何专业领域的一段。
  counterintuitive:
  - title: '"书里被引用最多的那句养生名言，本身出自唐人补入的篇章"'
    claim: 大众认知：《黄帝内经》是托名黄帝的完整原典，里面的每一句都是两千年前的原话。
  - title: '"阴阳不是善恶对立，是一把会移动的标尺——所以''补''和''泻''是同一个动作"'
    claim: 大众认知：中医养生就是"缺什么补什么"——缺阳补阳，缺阴补阴，各补各的。
  - title: '"最好的医生治的是通路和失调，不是病灶"'
    claim: 大众认知：哪里坏了修哪里，治病 = 找到问题点并消除它。
  - title: '"五脏不是器官，是功能标签——今天的''肾＝肾脏''是清末之后的映射产物"'
    claim: 大众认知：中医讲肾就是讲解剖学的肾脏，脾就是脾脏；五脏六腑可以和现代器官一一对应。
  - title: '"疾病从''正气必虚''那一刻就开始了，不是从出现症状开始"'
    claim: 大众认知：没症状就是健康，症状出现才需要处理。
  - title: '"情绪不是健康的背景变量，是病因本身"'
    claim: 大众认知：情绪影响健康，但属于"软性"因素，身体指标才是硬的。
  - title: '"长寿来自''不折腾''，不来自补品——而且''度百岁''是理想值，不是基线"'
    claim: 大众认知：《黄帝内经》是养生经典，核心遗产是一套延年益寿的方法，补得好就能长寿。 内经实际：养生总纲里没有一个字提到补品。「法于阴阳，和于术数，**食饮有节，起居有常，不妄作劳**」——四个约束，核心是**不妄作劳**（不过度耗用）。更关键的是，作者紧接着自我否定：「今时之人不然也，以酒为浆，以妄为常，醉以入房，以欲竭其精，以耗散其真，**故半百而衰也**。」
  - title: '"运气七气的真正贡献，是把外部环境写进了系统的输入端"'
    claim: 大众认知：运气学说属于古代的朴素天文历法，或者干脆是迷信，不值得看。
  takeaway: 身体不是零件堆，是一套会自我调节的关系网络——治病是疏通，养命是别折腾。
