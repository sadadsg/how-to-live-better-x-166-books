- book: 竞争战略
  author: 迈克尔·波特（Michael E. Porter，美国）
  category: 工作与职业
  file: 工作与职业/拆书笔记-《竞争战略》.md
  frameworks:
  - name: 波特五力模型（Porter's Five Forces）
    core: 这是全书最核心的框架——行业盈利能力的决定因素
  - name: 三大基本竞争战略（Three Generic Strategies）
    core: 波特提出企业只能从三种基本战略中选择一种——不能同时追求
  - name: 价值链分析模型（Value Chain Analysis）
    core: 波特提出的工具——用来分析企业内部活动如何创造竞争优势
  - name: 行业演变模型（Industry Evolution）
    core: 波特描述了行业从诞生到成熟的演变过程——每个阶段的竞争规则不同
  - name: 竞争对手分析模型（Competitor Analysis）
    core: 波特提出的工具——用来分析竞争对手的战略意图
  - name: 竞争定位矩阵（Competitive Positioning Matrix）
    core: 波特提出的工具——用来选择你的竞争位置
  counterintuitive:
  - title: '"行业的盈利能力不是由产品决定的，而是由行业结构决定的"'
    claim: 大众认知：产品越好，利润越高。技术越先进，竞争力越强。
  - title: '"成本领先不是''便宜''——是用更低的成本提供同等价值"'
    claim: 大众认知：成本领先就是打价格战、卖便宜货。
  - title: '"差异化不是''做不同的事''——是''做客户愿意付溢价的事''"'
    claim: 大众认知：差异化就是做别人没做过的事、用别人没用过的技术。
  - title: '"夹在中间是最危险的位置——既不够便宜，也不够独特"'
    claim: 大众认知：什么都做一点、什么都不极端是最安全的。
  - title: '"竞争分析的目的不是模仿竞争对手——是找到他们的弱点"'
    claim: 大众认知：竞争分析就是看竞争对手在做什么，然后模仿他们。
  - title: '"进入壁垒不是用来阻挡对手的——是用来保护你的利润的"'
    claim: 大众认知：进入壁垒是行业自然形成的，不需要特别关注。
  - title: '"行业演变不是线性的——成熟期可能是衰退期的开始"'
    claim: 大众认知：行业会从成长走向成熟，然后稳定下来。
  takeaway: 战略不是做更好的产品，是在五种竞争力量中找到一个有利位置。
