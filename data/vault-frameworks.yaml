- book: 妙趣横生的博弈论
  author: 待确认
  category: 经济学与社会/博弈论与策略思维
  file: 经济学与社会/博弈论与策略思维/拆书笔记-《妙趣横生的博弈论》.md
  frameworks:
  - name: 框架 ❶：囚徒困境 — 个人理性≠集体理性
    core: 心智模型：两个理性人各自的最优选择，会在重复博弈/信息不对称/缺乏承诺机制下，锁死成集体最差结果。
  - name: 框架 ❷：纳什均衡 — 个体最优相互锁定低效
    core: 心智模型：博弈中每个人的选择都是对他人最优选择的反应，最终形成"没人愿意主动改变"的稳定状态——但这个状态可能是低效的相互卡死。
  - name: 框架 ❸：重复博弈 — 信誉是降低长期交易成本的硬通货
    core: 心智模型：单次博弈里"骗一把就跑"是最优策略；重复博弈里，未来收益的折现值远大于当下骗利——这就是信誉的数学含义。
  - name: 框架 ❹：最后通牒 — 公平份额也是收益
    core: 心智模型：分钱实验中，提议方若分配 < 30%，多数被试宁愿零收益也要拒绝——公平感知、社会尊严本身是收益的一部分，被算法当"非理性"丢掉。
  - name: 框架 ❺：外部选项（BATNA） — 谈判筹码不在话术在退路
    core: 心智模型：你的谈判力 = 你谈崩后的退路有多好。话术是装饰，退路是地基。
  - name: 框架 ❻：斗鸡博弈 — 可置信威胁的两种战术
    core: 心智模型：窄路会车场景里，谁先承诺不退让，谁就锁定对方让步——前提是这种"不退让"必须是可置信的。
  - name: 框架 ❼：柠檬市场 — 信息不对称的劣币驱逐良币
    core: 心智模型：当买方无法分辨商品质量，卖方有动机把好货伪装成中等货卖高（质利 < 中等价），结果市场只剩下劣质品。
  - name: 框架 ❽：赢家诅咒 — 竞价高者往往是错估者
    core: 心智模型：竞拍里出价最高的人系统性地比次高出价者多付——溢价往往就是估值偏差。
  - name: 框架 ❾：美元拍卖 — 沉没陷阱的不可退出博弈
    core: 心智模型：100 元拍卖游戏——上一轮投入的钱不算入下一轮，但人脑被沉没成本绑架，越投越难退出，最终赢家往往是总投入最高的人。
  - name: 框架 ❿：机制设计 — 规则能让自利者自动达成目标
    core: 心智模型：第二价格拍卖里，最优策略是按真实估值出价——因为出价高低只决定你赢不赢，价格由次高出价者决定。规则设计能让自利者自动说真话。
  - name: 框架之间的整体结构（关系图）
    core: 静态博弈           重复博弈           制度设计
  counterintuitive:
  - title: '"博弈论不是算计他人，是铺设共赢轨道"'
    claim: 大众认知：博弈论是讲怎么打败对手的智慧，是高级版"三十六计"。
  - title: '"个人理性不等于集体理性"'
    claim: 大众认知：每个人做对自己最有利的选择，整体也会最优。
  - title: '"你的谈判力不是来自你说什么，而是来自你谈崩后过得怎么样"'
    claim: 大众认知：谈判靠话术、靠气场、靠演技。
  - title: '"可置信的威胁比威胁本身更有效"'
    claim: 大众认知：威胁要狠、威胁要大，吓住对方。
  - title: '"信息不对称的赢家是骗子，但长期看是双输"'
    claim: 大众认知：信息差是优势，能骗就骗。
  - title: '"最危险的不是别人出高价，是自己不断加注"'
    claim: 大众认知：竞拍时只要"理性"就能赢。
  - title: '"机制设计比劝说更有效"'
    claim: 大众认知：管理靠领导艺术、靠沟通、靠文化。
  - title: '"公平感知也是收益的一部分，不能用金钱抹平"'
    claim: 大众认知：钱给够就行，公平不重要。
  takeaway: 博弈论不是教你怎么赢，是教你看清结构——然后选择不玩、换桌玩，或重新设计这张桌子。
  links:
  - 不妥协的谈判
  - 基层中国的运行逻辑
