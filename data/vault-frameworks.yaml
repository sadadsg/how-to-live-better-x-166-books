- book: 认知驱动
  author: 周岭
  category: 个人效能与习惯/认知与学习
  file: 个人效能与习惯/认知与学习/拆书笔记-《认知驱动》.md
  frameworks:
  - name: 认知驱动双翼模型（Two Wings of Cognitive Growth）
    core: 这是全书的元框架——《认知觉醒》和《认知驱动》的关系本身就是一个模型
  - name: 价值创造闭环（Value Creation Loop）
    core: 价值创造闭环
  - name: 长期主义的两种面孔（Two Faces of Long-Termism）
    core: 周岭提出了一个极其实用的区分：被动长期主义 vs 主动长期主义。
  - name: 价值输出阶梯（Value Output Ladder）
    core: / \      第五层：系统建设
  - name: 作品思维（The Work Mindset）
    core: 这可能是全书最有冲击力的概念
  - name: 身份层级模型（Identity Levels Model）
    core: 与框架5（作品思维）的分工：框架5管"每次交付什么"（行为层），框架6管"凭什么十年不散"（信念层）——作品是身份的证据，身份是作品的永动机。
  - name: 环境杠杆（Environment Leverage）
    core: 与框架2（价值创造闭环）的分工：框架2是动力系统（反馈推着你走），框架7是省力系统（场域替你挡掉消耗）——反馈解决"没劲"，环境解决"漏电"，两者合并才跑得又快又久。
  counterintuitive:
  - title: '"觉醒是一种新的内耗形式"'
    claim: 大众认知：认知觉醒是好事，觉醒越彻底，改变越容易。知道自己哪里有问题，问题就解决了一半。
  - title: '"你不需要坚持——需要被反馈"'
    claim: 大众认知：变好需要自律和坚持，毅力是成功的核心品质。
  - title: '"你的价值不是你是什么，而是你给了别人什么"'
    claim: 大众认知：个人成长的核心是"让自己变得更好"——提升自己、完善自己、变成更好的自己。
  - title: '"输出才是真正的输入"'
    claim: 大众认知：学习的过程是输入→吸收→内化。先多读多看多听，积累够了再输出。
  - title: '"作品思维治好了我的精神内耗"'
    claim: 大众认知：精神内耗需要心理调节——冥想、放松、接纳自己。
  - title: '"不要做计划——做成果"'
    claim: 大众认知：成功需要详细的计划和严格的执行。把大目标分解成小步骤，每天按计划推进。
  - title: '"''坚持''这个词，正在杀死你的习惯"'
    claim: 大众认知：养成习惯靠坚持，能把一件事坚持下去的人才配得到结果，意志力是可以练出来的肌肉。
  takeaway: 你最终长成什么样，取决于你给了世界什么，而不是你要了什么。
