  - name: 信息就是力量
    core: 谈判前：收集三张底牌——对方的真实需求 / 预算与权限 / 替代方案
  - name: 时间压力法则
    core: 90% 的让步发生在最后 10% 的时间里
  - name: 谈判力量五源（离场·竞争·合法性·信息·时间）
    core: 1. 离场力量（walk away）：随时能走开的人掌握谈判
  - name: 双赢谈判四要素（收官哲学）
    core: 1. 别把谈判做成单议题：只有一个分歧的谈判必是零和，
  - name: 全景图：一张图看懂本书操作系统
    core: 【开局】框架一 高开/意外/不情愿 → 框架三 锁定决策权
  counterintuitive:
  - title: '"谈判的终极目标不是成交，是让对方觉得自己赢了"'
    claim: 大众认知：谈判就是把价格压到最低、把条款抢到手，谁硬谁赢。
  - title: '"永远不要接受第一次报价——哪怕它好得离谱"'
    claim: 大众认知：对方第一次就给出远超预期的条件，赶紧答应，夜长梦多。
  - title: '"你让出去的步，当场贬值"'
    claim: 大众认知：我对人好、多让步，对方会记情。
  - title: '"谁赶时间，谁让步"'
    claim: 大众认知：谈判节奏越快越专业，效率高。
  - title: '"决策权越小，谈判力越强"'
    claim: 大众认知：能拍板的人才有谈判力，"做不了主"是弱势表现。
  - title: '"''我们平分差额吧''是谈判桌上最温柔的陷阱"'
    claim: 大众认知：平分差额最公平、最体面，是善意的收尾。
  - title: '"最会谈判的人，最会闭嘴"'
    claim: 大众认知：谈判靠口才，说得越多越占上风。
  - title: '"惊讶是可以表演的——情绪是谈判道具"'
    claim: 大众认知：谈判中的情绪是真实反应，尤其惊讶装不出来。
  takeaway: 谈判的输赢不在成交，在感觉：让对方觉得他赢了，真正的赢才属于你。
