- book: 安定此心
  author: 姜涛（中国）
  category: 心理学与行为科学/情绪与内耗
  file: 心理学与行为科学/情绪与内耗/拆书笔记-《安定此心》.md
  frameworks:
  - name: 精神疾病的三重误解
    core: 姜涛在30年临床中反复遭遇的三个根深蒂固的误解
  - name: 疗愈的三层路径
    core: 疗愈的三层路径
  - name: 安定的三个层次
    core: 安定：从表层到深层
  - name: 理解的四个维度
    core: 理解精神疾病的四个维度
  - name: 精神科医生的视角转换
    core: 从"治病"到"治人"的视角转换
  - name: 症状的功能——过期的解决方案（The Symptom as an Outdated Solution）
    core: 与框架1的分工：框架1的误解③纠正的是对症状的"定性"——它是信使，不是敌人；本框架进一步拆解症状的"运行机制"——这位信使不只送信，还身兼一份保护工作。它曾是解，只是过期了。
  - name: 症状是系统的信使——家庭如何维持症状（The Symptom as the System's Messenger）
    core: 与框架4的分工：框架4的"社会维度"从远处看环境（偏见、歧视、支持系统）；本框架把镜头拉近一层看互动——家庭是一个自我平衡的系统，症状常常不是某个人的故障，而是整个系统失衡的显影。框架1说"症状是信使"，本框架回答：这位信使，是替谁送信。
  counterintuitive:
  - title: '"精神疾病不是软弱，是大脑生病了"'
    claim: 大众认知：心理问题是"想太多"、"太脆弱"
  - title: '"症状不是敌人，是信使"'
    claim: 大众认知：症状是需要消灭的东西
  - title: '"安定不是与自己作战，是与自己和解"'
    claim: 大众认知：安定 = 控制情绪、压制痛苦
  - title: '"被看见本身就是疗愈"'
    claim: 大众认知：疗愈需要方法、技术、药物
  - title: '"允许自己生病是勇敢，不是软弱"'
    claim: 大众认知：承认心理问题 = 承认自己不行
  - title: '"你安定此心，娃才能有福"'
    claim: 大众认知：育儿是技术问题
  - title: '"症状不是故障，是曾经有效的解决方案"'
    claim: 大众认知：症状是坏掉的零件，越快拆掉越好
  takeaway: 安定不是打赢一场对内心的战争，而是完成一次耐心的解码——接纳痛苦，才能超越痛苦。
