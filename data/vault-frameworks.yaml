- book: 无论如何，潜水
  author: '[韩]河美娜（하미나）'
  category: 心理学与行为科学/创伤与疗愈
  file: 心理学与行为科学/创伤与疗愈/拆书笔记-《无论如何，潜水》.md
  frameworks:
  - name: 下潜-上浮循环模型
    core: 疗愈不是直线
  - name: 呼吸即存在模型
    core: 核心逻辑：呼吸是生命最基本的节律。自由潜水让人重新意识到这个被忽略的动作——屏住呼吸不是挑战，而是学习放松；浮出水面不是结束，而是重新开始。
  - name: 身体和解三阶段
    core: 第一阶段：与身体为敌
  - name: 非临床疗愈范式
    core: 核心逻辑：这不是对临床疗愈的否定，而是补充。在韩国社会"青年抑郁""内耗焦虑"问题日益严峻的背景下，河美娜提供了一种"身体力行的运动实践"路径——不是通过心理学的单向灌输，而是通过在恐惧中反复练习，重建人与身体、与世界的关系。
  - name: 恐惧共处模型
    core: 大众模式：恐惧 → 克服恐惧 → 勇敢 → 行动
  - name: 潜伴与信任模型
    core: 潜伴B（守望者）
  - name: 止损与退出模型
    core: 下潜 → 转向点（上岸前就划好的线）
  counterintuitive:
  - title: '"越放松越能下潜"'
    claim: 大众认知：面对恐惧需要更用力、更紧张、更"打起精神"。
  - title: '"屏住呼吸是学习放松"'
    claim: 大众认知：屏住呼吸是挑战极限，是勇敢的表现。
  - title: '"大海从不在乎我的身体是什么模样"'
    claim: 大众认知：身体需要符合某种标准才能被接受——瘦、美、有力、年轻。
  - title: '"疗愈不是一次完成的胜利"'
    claim: 大众认知：疗愈有一个终点——"痊愈""走出来""放下"。
  - title: '"用一种痛苦替代另一种痛苦"'
    claim: 大众认知：逃离痛苦是正确的——远离让你不舒服的人、事、环境。
  - title: '"活着就是始终与恐惧共处"'
    claim: 大众认知：勇敢的人不害怕。
  - title: '"不是逃离陆地，是重新回到生活"'
    claim: 大众认知：运动是逃避现实的方式——"去散散心""去放空"。
  takeaway: 疗愈不是消除恐惧，是学会在恐惧中呼吸。
  links:
  - 活出生命的意义
  - 身体从未忘记
