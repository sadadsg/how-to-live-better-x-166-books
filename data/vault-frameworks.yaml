    core: 是什么：陈海贤借用哈佛心理学家罗伯特·凯根的"变革免疫"（Immunity to Change）理论指出：每个"想改改不动"的人，心里都运行着一套心理免疫系统。它的功能是排斥一切"让你焦虑的改变"，用熟悉的旧行为保护你——哪怕旧行为本身正在伤害你。想改，先给这
  - name: 心理舒适区的本质——不是舒服，是熟悉（Psychological Comfort Zone）
    core: 是什么：大众把舒适区理解为"让人舒服的地方"。陈海贤说：心理舒适区的本质不是"舒服"，而是"熟悉"——是旧经验提供的可预测感与控制感。让你走不出的常常不是安逸，而是你一边抱怨、一边重复的熟悉处境：让你焦虑的工作、让你内耗的关系。焦虑的熟悉感，也是熟悉。
  counterintuitive:
  - title: '"想改变"本身就是问题，而不是解决方案'
    claim: 大众认知：只要我想改变，就说明我在进步，想改变是好事。
  - title: 自我攻击和自我反省是两回事——前者摧毁你，后者提升你
    claim: 大众认知：我对自己严格要求，经常反思自己的不足，这是自我反省，是好事。
  - title: 接纳不是躺平，是为改变积蓄能量
    claim: 大众认知：接纳自己 = 放弃改变 = 佛系/躺平/摆烂。
  - title: 100%的改变计划注定失败，因为它要求你否定整个过去的自己
    claim: 大众认知：改变就要彻底，要有决心，要有毅力，"要么不做，要做就做到最好"。
  - title: 行动不需要动力，行动本身就是动力的来源
    claim: 大众认知：我要先有动力才能行动——等我状态好了、有劲了、想做了，我自然就会去做。
  - title: 真正的自律不是咬牙硬撑，是减少需要硬撑的场景
    claim: 大众认知：自律 = 意志力 = 能忍住诱惑 = 咬牙坚持。
  - title: 心理舒适区不是"舒服"的地方，而是"熟悉"的地方——你赖着不走靠的是控制感，不是快乐
    claim: 大众认知：人留在坏习惯、烂关系里，是因为贪图安逸；只要吃够了苦头，自然会离开。
  takeaway: 改变不是推翻重来，是在接纳自己的基础上做5%的扰动，让行动自然螺旋上升。
