- book: 股市长线法宝
  author: '[美]杰里米·西格尔（Jeremy J. Siegel）'
  category: 财商与投资/投资哲学与价值投资
  file: 财商与投资/投资哲学与价值投资/拆书笔记-《股市长线法宝》.md
  frameworks:
  - name: 历史数据层——用事实重建认知
    core: 200年美国资产实际年化回报率（1802-2023）
  - name: 风险认知层——重新定义"风险"
    core: 持有期与股票回报率波动范围
  - name: 估值与预期层——判断入场时机
    core: CAPE = 当前价格 / 过去10年平均盈利（经通胀调整）
  - name: 资产配置层——不同人生阶段该配什么
    core: 生命周期资产配置
  - name: 投资策略层——具体怎么执行
    core: 主动 vs 被动：20年业绩对比
  counterintuitive:
  - title: '"股票比债券安全——如果你的时间够长"'
    claim: 大众认知：股票有风险，债券安全。年纪越大越该买债券。
  - title: '"你为安全感支付的溢价太高了"'
    claim: 大众认知：买债券是"保守稳健"的投资策略。
  - title: '"股利才是投资回报的全部引擎"'
    claim: 大众认知：投资回报来自股价上涨——低买高卖。
  - title: '"高估值不意味着崩盘，但意味着未来10年回报率注定偏低"'
    claim: 大众认知：高估值=泡沫=马上要崩盘。
  - title: '"最危险的投资不是股票，是你以为安全的东西"'
    claim: 大众认知：把钱放银行、买国债、买理财产品是最安全的。
  - title: '"定投不是最优策略，是最不犯错的策略"'
    claim: 大众认知：定投是一种"懒人投资法"，不如择时聪明。
  - title: '"退休不是投资的终点，是另一个30年赛跑的起点"'
    claim: 大众认知：65岁退休后应该把所有钱转到债券和存款里"保本"。
  takeaway: 股票长期最安全，债券长期最危险——时间是风险的稀释剂，通胀是购买力的杀手。
