    core: 这是荣格心理学的总框架。它描述了一个人从"自我中心的意识"走向"自性中心的完整人格"的完整路径。
  - name: 主动想象（Active Imagination）
    core: 荣格发明的核心技术。不同于自由联想（弗洛伊德的被动释放），主动想象是一种有意识地与无意识对话的方法。
  - name: 自我-自性轴（Ego-Self Axis）
    core: 这是理解荣格心理学的核心结构。
  - name: 补偿理论（Compensation Theory）
    core: 荣格从《红书》的经验中提炼出的核心心理动力学原理。
  - name: 原型与集体无意识（Archetypes & Collective Unconscious）
    core: 《红书》中的对话人物不是荣格的幻想，而是原型的显现——集体无意识中的普遍心理模式。
  - name: 灵魂的回归——对现代性的诊断（The Soul's Return）
    core: 《红书》不只是个人心理治疗手册，更是一份文明诊断书。
  - name: 神话作为心理真相（Myth as Psychological Truth）
    core: 荣格的神话观：
  - name: 框架间的关系
    core: 个体化之旅（总框架）
  counterintuitive:
  - title: '"疾病比健康更有价值"'
    claim: 大众认知：心理疾病是需要治愈的缺陷，健康是目标。
  - title: '"你的自我不是你的主人"'
    claim: 大众认知：我的意识、我的理性、我的意志——这些构成了"我"。我是自己的主人。
  - title: '"成为完整的人，而非好的人"'
    claim: 大众认知：成长意味着变得更善良、更道德、更理性——也就是变得更"好"。
  - title: '"你的灵魂需要喂养，而你正在饿死它"'
    claim: 大众认知：心灵问题的解决方案是认知行为疗法（改变认知）、药物治疗（改变化学）、或效率工具（改变行为）。
  - title: '"精神错乱和灵性觉醒可能是同一件事"'
    claim: 大众认知：听到内在声音、看到幻象、感觉自己"不正常"——这是精神疾病的征兆，需要立刻就医。
  - title: '"你遇到的内在人物比你更真实"'
    claim: 大众认知：想象中的人物是"虚构的"，是大脑的随机放电，没有意义。
  - title: '"你最害怕的东西，就是你最需要的东西"'
    claim: 大众认知：恐惧是危险信号，应该回避。追求舒适和安全感是本能，是正确的。
  - title: '"现代文明不是进步，是退化"'
    claim: 大众认知：科学、理性、技术让人类比古人更先进、更幸福、更自由。
  takeaway: 你的灵魂在深渊里等你——不是等你逃开，是等你走下来，和它对话。
