- book: 从0到1
  author: 彼得·蒂尔（Peter Thiel，美国人，硅谷天使投资人、PayPal 联合创始人）；布莱克·马斯特斯（Blake Masters，合著）
  category: 创业与商业/创新与产品方法论
  file: 创业与商业/创新与产品方法论/拆书笔记-《从0到1》.md
  frameworks:
  - name: 从0到1 vs 从1到N
    core: 从0到1（创造全新）  从1到N（复制推广）
  - name: 垄断 vs 竞争
    core: 竞争市场                垄断市场
  - name: 七大壁垒（七大护城河）
    core: 从0到1垄断企业
  - name: 权力定律（The Power Law）
    core: 指数增长曲线：
  - name: 起点思维（Start-up Thirteen）
    core: 创业者的"不同意"清单：
  - name: 秘密理论（Secrets）
    core: 认知流水线（本章在链条最上游）：
  - name: 销售与分发哲学（If You Build It, Will They Come?）
    core: 客单价从高到低，分发模式自动换挡：
  counterintuitive:
  - title: '"竞争是失败者的游戏"'
    claim: 大众认知：竞争激烈说明市场好、机会多、大家都在努力。
  - title: '"你最好的机会不在大市场里"'
    claim: 大众认知：大市场=大机会，应该追求最大的总市场规模。
  - title: '"好的创业公司不需要好团队"'
    claim: 大众认知：初创公司成功的关键是找到最出色的团队。
  - title: '"最后胜出的人不是最早入场的"'
    claim: 大众认知：先入者优势——第一个进入市场的人最容易成功。
  - title: '"如果你从竞争对手那里取名字，说明你的产品没有差异化"'
    claim: 大众认知：取一个与竞争对手相关的名字（如Facebook对标MySpace）是一种营销策略。
  - title: '"你不应该过早关注用户反馈"'
    claim: 大众认知：用户反馈是产品迭代的核心驱动力。
  - title: '"改变世界的不是你，是你做的东西"'
    claim: 大众认知：创始人应该感到自己是改变世界的独特力量。
  takeaway: 垄断不是成功的副产品，是创业的目标——创造独一无二的价值，建立不可替代的壁垒。
